# Linha de base da rede: nega tudo, depois libera exatamente os fluxos que o
# sistema exerce.
#
# ## Sobre a lista do enunciado da Fase 5
#
# O escopo pede "web→api, api→db, engine→api, engine→db; nada mais". Aplicada
# ao pé da letra, essa lista deixa o sistema no ar e quebrado — o próprio
# smoke test prova, no passo de criar sessão:
#
#   * criar sessão faz a **api** pedir um token client-credentials ao Keycloak
#     e chamar o **engine** por HTTP interno. Sem `api→keycloak` e `api→engine`
#     o passo 2 do smoke falha;
#   * o engine valida o token recebido contra o JWKS do Keycloak, e chama a api
#     de volta para gravar evento — `engine→keycloak` é obrigatório;
#   * sem egress de **DNS** nada resolve nome de Service e todo o resto é
#     irrelevante;
#   * sem `prometheus→engine:4000` a métrica `oban_queue_depth` nunca é
#     coletada e o HPA do engine fica em `<unknown>` para sempre — ou seja, a
#     política derrubaria em silêncio o critério de aceite desta sessão.
#
# Já `web→api` NÃO é um fluxo de pod: o web é nginx servindo estático, e quem
# chama a api é o **browser**, de fora do cluster. Por isso o pod do web não
# tem egress para a api — dar essa permissão seria afrouxar a política sem
# habilitar nada.
#
# ## Enforcement
#
# NetworkPolicy só vale se a CNI a implementar. k3s/k3d trazem o controlador
# embutido; o kindnet do kind **não implementa NetworkPolicy** e ignora estes
# manifests em silêncio. Por isso o bootstrap prefere k3d, e o smoke reporta
# quando está num cluster que não faz enforcement.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    app.kubernetes.io/part-of: brabo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# DNS é a exceção universal: sem resolver nome de Service, nenhuma das regras
# abaixo tem efeito prático.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  labels:
    app.kubernetes.io/part-of: brabo
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Postgres. Externo por padrão, então o destino é declarado por RÓTULO e não
# por IP: o overlay local rotula os pods do CloudNativePG com
# `brabo.dev/role: database`, e o overlay de produção SUBSTITUI esta policy por
# uma com `ipBlock` do endereço gerenciado. Nada de `to: {}` — uma base
# permissiva por default é o mesmo no-op que os ADRs anteriores descrevem.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-egress
  labels:
    app.kubernetes.io/part-of: brabo
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [api, engine, migrate-api, migrate-engine]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              brabo.dev/role: database
      ports:
        - protocol: TCP
          port: 5432
