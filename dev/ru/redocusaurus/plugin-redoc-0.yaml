  /projects/{projectId}/psychologist/analyses:
    get:
      description: >-
        `costMicros` суммируется из `token_usage` раунда. Именно это делает
        разницу в стоимости между лёгкой и тяжёлой сортировкой ВИДИМОЙ, а не
        просто заявленной, — два уровня используют действительно разные модели.
      operationId: PsychologistController_analyses
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PsychologistAnalysisResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, сессия или гипотеза не существуют.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перечисляет раунды анализа с уровнем и реальной стоимостью
      tags:
        - psychologist
  /projects/{projectId}/psychologist/status:
    get:
      description: >-
        Только чтение — без побочных эффектов. `enabled: false` означает, что
        пауза — решение ПРОДУКТА (не ошибка): существующие анализы и гипотезы ею
        не затрагиваются.
      operationId: PsychologistController_status
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PsychologistStatusResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, сессия или гипотеза не существуют.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Сообщает, может ли Психолог сегодня выполнить НОВЫЙ анализ
      tags:
        - psychologist
  /projects/{projectId}/rag/coverage:
    get:
      description: >-
        Реальный подсчёт (никогда не оценка) файлов `.md` в `docs`/`docs/adr`
        репозитория проекта против того, сколько из них имеют фрагмент, и сессий
        проекта против того, сколько имеют фрагмент. Не включает «N минут назад»
        для этих трёх областей — нет столбца метки времени индексации по
        области, и угаданное число лгало бы (то же правило, что ADR 0042 для
        оценки моделей). `local` (RN-455) — единственное исключение:
        `lastAttachedAt` — это реальный `MAX(created_at)` по этой области,
        потому что у загрузки из браузера нет состояния репозитория для
        сравнения.
      operationId: RagController_obterCobertura
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagCoverageResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: 'Покрытие индекса: проиндексированные файлы/сессии против реального итога'
      tags:
        - rag
  /projects/{projectId}/rag/feedback:
    post:
      description: >-
        Единственный сигнал ИСТИНЫ в измерении RAG: задержка и частота
        деградации говорят, ВЫПОЛНИЛСЯ ли поиск, но никогда — был ли он ПРАВ. Та
        же роль, что и у `search`: кто может читать результат, тот может его
        оценивать. Повторный голос за тот же фрагмент того же поиска
        перезаписывает ваш собственный голос, а не добавляет второй (уникален на
        актора), поэтому метрика измеряет точность, а не энтузиазм.
      operationId: RagController_votar
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagFeedbackRequestDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagFeedbackResponseDto'
        '400':
          description: >-
            Неизвестный `searchId` для этого проекта или `chunkId`, которого не
            было среди результатов этого поиска, — голос без позиции был бы
            числом без смысла.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: >-
        Оценивает один результат одного поиска как полезный или нерелевантный
        (RN-480)
      tags:
        - rag
  /projects/{projectId}/rag/local:
    post:
      description: >-
        Текстовое содержимое, уже прочитанное браузером (`<input
        webkitdirectory>`), никогда не путь на хосте — в этом различии весь
        смысл ADR 0113. Идемпотентная полная перестройка области `local`: каждый
        вызов удаляет и пересоздаёт её из файлов, отправленных В ЭТОТ раз,
        поэтому повторная загрузка и есть механизм пересинхронизации. Отклоняет
        (400) при превышении лимитов числа файлов/общего объёма в байтах вместо
        молчаливой обрезки — это однократный жест пользователя с выбором папки
        перед ним, а не фоновое сканирование. Отдельный слишком большой файл или
        файл с нераспознанным расширением только пропускается и никогда не
        приводит к сбою пакета.
      operationId: RagController_anexarPastaLocal
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachLocalFolderRequestDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachLocalFolderResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: >-
        Прикрепляет локальную папку (загрузка из браузера) как справочный
        материал только для чтения (RN-455, ADR 0113)
      tags:
        - rag
  /projects/{projectId}/rag/reindex:
    post:
      description: >-
        «Переиндексировать сейчас» из панели RAG в Чате. Удаляет и пересоздаёт
        фрагменты трёх честных областей (RN-219) из ТЕКУЩЕГО состояния —
        автоматического наблюдателя на push/закрытие сессии нет (решение
        записано в ADR 0079/0080). Может занять время в проектах с большим
        числом сессий: выполняется один проход индексации на сессию, каждый из
        которых может вызывать провайдера эмбеддингов пакетно.
      operationId: RagController_reindexar
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexProjectResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: >-
        Переиндексирует docs/ADR/сессии проекта (идемпотентная полная
        перестройка)
      tags:
        - rag
  /projects/{projectId}/rag/search:
    post:
      description: >-
        Сочетает косинусное сходство (pgvector) с лексическим `ts_rank`
        (tsvector), каждое из независимого запроса, объединённые взвешенной
        суммой и отсечённые порогом (ADR 0080). `vectorAvailable: false`
        предупреждает, когда провайдер эмбеддингов не ответил и поиск выполнился
        только с лексическим сигналом, — он никогда не притворяется, что
        выполнил полный гибридный поиск.
      operationId: RagController_buscar
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HybridSearchRequestDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HybridSearchResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: >-
        Гибридный поиск (вектор + лексика) по проиндексированным фрагментам
        проекта
      tags:
        - rag
  /projects/{projectId}/run-instructions:
    get:
      description: >-
        RN-852 (ADR 0213): текущий `artifact.run_instructions`, выпускаемый,
        когда выполняется `open_infra_pr` с `run`. ОБЪЯВЛЕН агентом Infra и
        никогда не проверяется на машине читателя. `null`, когда его нет.
      operationId: BacklogController_runInstructions
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInstructionsResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Возвращает, как запустить результат на вашей машине
      tags:
        - backlog
  /projects/{projectId}/runner-device-keys:
    get:
      description: >-
        Никто не отзовёт то, чего не видит (RN-519). Включает и уже ОТОЗВАННЫЕ —
        исчезновение строки заставило бы экран утверждать, что ключа никогда не
        было. Никогда не возвращает публичный JWK, а приватный api никогда не
        видела. Нулевой `lastUsedAt` — признак ОСИРОТЕВШЕГО ключа:
        зарегистрированного и ни разу не использованного ни одним runner.
        Начиная с RN-543 также включает МАШИННЫЕ ключи вызывающего (`especie:
        "maquina"`, `projectId` нулевой), которые обслуживают этот проект, не
        принадлежа ему, — без них в списке машинный ключ был бы невидим на любом
        экране.
      operationId: RunnerDeviceKeysController_listDeviceKeys
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunnerDeviceKeyListResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не найден.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перечисляет собственные ключи устройств этого проекта
      tags:
        - projects
  /projects/{projectId}/runner-device-keys/{deviceKeyId}:
    delete:
      description: >-
        Идемпотентно — повторный отзыв не является ошибкой. Начиная с RN-520
        также РАЗРЫВАЕТ живое соединение: раньше отзыв только не давал получить
        НОВЫЙ тикет, а уже подключённый runner продолжал выполнять одобренные
        команды. Начиная с RN-685 (ADR 0201) целью является КЛЮЧ: разрываются
        только соединения, открытые с ним, — во всех проектах, если он машинный,
        — а другой runner того же пользователя, подключённый с PAT или другим
        ключом, остаётся. Его ещё не использованные тикеты аннулируются.
        Недоступный engine или отсутствие подключённого runner НЕ приводят к
        сбою отзыва.
      operationId: RunnerDeviceKeysController_revokeDeviceKey
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: deviceKeyId
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Ключ отозван. Без тела.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не найден.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Отзывает собственный ключ устройства
      tags:
        - projects
  /projects/{projectId}/runner-ticket:
    post:
      description: >-
        Аутентифицирует `connect/3` сокета Phoenix `/runner` (топик
        `terminal:<projectId>`, роль "runner") — это НЕ переиспользованный JWT,
        и этот маршрут сам принимает только Personal Access Token вместо JWT
        сессии (ADR 0105). TTL 30 с и однократное использование. Отклоняет с
        400, если проект не в режиме "runner" (RN-421): runner нечего
        обслуживать в проекте, код которого живёт в управляемом контейнере.
      operationId: RunnerTicketsController_runnerTicket
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerTicketResponseDto'
        '400':
          description: Проект не в режиме "runner".
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не найден.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Выпускает одноразовый тикет для подключения локального runner
      tags:
        - projects
  /projects/{projectId}/sessions:
    get:
      description: >-
        Каждый элемент несёт `technical`: `true` только для сессии, открытой при
        создании репозитория (связанной из `repo_bootstraps`).
      operationId: SessionsController_list
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionListItemResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект или сессия не существуют.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перечисляет сессии проекта
      tags:
        - sessions
    post:
      description: >-
        Сессия рождается в `created` и является контейнером для всего, что
        делают агенты: журнал событий, предложенные действия и бюджет токенов
        привязаны к ней. `kind` ОБЯЗАТЕЛЕН и записывается: `consultiva`
        (консультационная) только беседует, `criativa` (творческая) производит и
        является единственной, которая принимает `execution.activated`.
      operationId: SessionsController_create
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '400':
          description: Тело без `kind` или со значением вне разрешённого списка.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект или сессия не существуют.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Открывает сессию в проекте
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}:
    get:
      operationId: SessionsController_get
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект или сессия не существуют.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Возвращает сессию по id
      tags:
        - sessions
    patch:
      description: >-
        Имя — это навигационная подпись, и оно НЕ заменяет хештег id: экраны
        составляют их вместе, а без имени деградируют до одного хештега. `null`
        или пустая строка очищают имя. Изменить `kind` нельзя: это намерение при
        создании, и изменение позже превратило бы его в состояние.
      operationId: SessionsController_rename
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameSessionDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '400':
          description: Тело без `name` или имя длиннее лимита символов.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект или сессия не существуют.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Задаёт или очищает понятное имя сессии
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}/actions:
    get:
      description: >-
        Упорядочено по `seq`; используйте `nextCursor` как `afterSeq`.
        `latest=true` вместо этого получает ХВОСТ (самые новые `limit` действий,
        всё ещё по возрастанию) и игнорирует `afterSeq`. `status=pending`
        оставляет только действия, ожидающие решения, — с `latest` самые новые
        ожидающие, чтобы сессия с более чем 200 действиями не вытесняла новое
        ожидающее из окна (RN-637).
      operationId: ActionsController_list
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: afterSeq
          required: false
          in: query
          schema:
            example: 6
            type: string
        - name: limit
          required: false
          in: query
          schema:
            example: 50
            type: string
        - name: latest
          required: false
          in: query
          description: Получает хвост сессии; игнорирует `afterSeq`.
          schema:
            example: 'true'
            type: string
        - name: status
          required: false
          in: query
          description: Поддерживается только `pending`.
          schema:
            example: pending
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeAcoesResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, сессия или действие не найдены.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Постранично выдаёт предложенные действия сессии
      tags:
        - actions
    post:
      description: >-
        Действие оценивается по `permissions.json` проекта при создании.
        `resolvedPolicy` в ответе говорит, что решила политика: `auto_approve`
        выходит уже готовым к выполнению, `require_approval` ждёт решения
        человека, а `deny` рождается отклонённым. Пути, выполняющего действие в
        обход этого, нет.
      operationId: ActionsController_propose
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeActionDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposedActionResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, сессия или действие не найдены.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Предлагает действие с внешним эффектом
      tags:
        - actions
  /projects/{projectId}/sessions/{sessionId}/actions/{actionId}/approve:
