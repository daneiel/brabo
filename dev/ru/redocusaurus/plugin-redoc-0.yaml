  /internal/sessions/{sessionId}/semantic-duplicate-check:
    post:
      description: >-
        Встраивает заголовок и заголовки правил проекта (100 самых свежих)
        моделью эмбеддингов RAG и предупреждает при косинусе ≥ порога. Никогда
        не отклоняет. Без провайдера эмбеддингов проверка ПРОПУСКАЕТСЯ с
        указанием причины, также описанной в журнале событий. Расход на
        эмбеддинги учитывается отдельной строкой `token_usage` (актор
        `system`/`duplicata-semantica`).
      operationId: InternalSessionsController_semanticDuplicateCheck
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemanticDuplicateCheckInternalDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticDuplicateCheckResponseDto'
        '400':
          description: Некорректное тело.
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '404':
          description: Сессия, проект или ресурс не найдены.
      security:
        - service-token: []
      summary: >-
        Предупреждает, когда только что записанное бизнес-правило похоже на
        существующее
      tags:
        - internal
  /internal/sessions/{sessionId}/stories:
    post:
      description: >-
        `businessRuleIds` питает покрытие правило→история. Каждый id должен
        ссылаться на СУЩЕСТВУЮЩЕЕ событие `artifact.business_rule` — проверка
        отклоняет выдуманный id. Ответ также содержит `semanticDuplicate`
        (RN-681): ПРЕДУПРЕЖДЕНИЕ на основе эмбеддингов по историям проекта,
        никогда не отказ.
      operationId: InternalSessionsController_story
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoryInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedStoryResponseDto'
        '400':
          description: Некорректное тело.
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '404':
          description: Сессия, проект или ресурс не найдены.
      security:
        - service-token: []
      summary: >-
        Создаёт историю с функциональными/нефункциональными требованиями, DoD,
        DoR и покрытыми правилами
      tags:
        - internal
  /internal/sessions/{sessionId}/stories/{storyId}/archive:
    post:
      description: >-
        История и её задачи уходят из backlog, покрытия, плана и claim; строка
        остаётся, и `backlog.story_archived` фиксирует это с PO как актором
        (RN-727).
      operationId: InternalSessionsController_archiveStoryRoute
      parameters:
        - name: storyId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveStoryInternalDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResponseDto'
        '400':
          description: Некорректное тело.
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '404':
          description: История не в этом проекте.
        '409':
          description: >-
            Именованный отказ (`reason`): `historia_arquivada`,
            `historia_nao_draft` или `historia_com_tarefa_em_execucao`.
      security:
        - service-token: []
      summary: Архивирует черновую историю
      tags:
        - internal
  /internal/sessions/{sessionId}/stories/{storyId}/complete:
    post:
      description: >-
        `businessRuleIds` ДОБАВЛЯЕТСЯ к уже связанным правилам; непустые списки
        заменяют текущие, а опущенные остаются. После записи история
        продвигается по ТОМУ ЖЕ критерию, что и при создании (`ready` в режиме
        `auto`, `proposedReady` в `manual`) (RN-720).
      operationId: InternalSessionsController_completeStoryRoute
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: storyId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteStoryInternalDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResponseDto'
        '400':
          description: business_rule_id не ссылается на существующее правило.
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '404':
          description: История не в этом проекте.
        '409':
          description: История больше не `draft`.
      security:
        - service-token: []
      summary: Дополняет существующую черновую историю вместо её повторного создания
      tags:
        - internal
  /internal/sessions/{sessionId}/stories/{storyId}/update:
    post:
      description: >-
        Только история `draft` без задачи в работе; пишет
        `backlog.story_updated` с PO как актором (RN-727). Также `ready`, когда
        `questionId` ссылается на открытый вопрос, на который пользователь уже
