name: CI

# Fase 5, item 4. Antes disto o repo não tinha CI de verdade: os dois workflows
# ao lado são helpers do Claude e nenhum roda teste.
#
# Este workflow é o que a proteção da branch `dev` deve exigir — a configuração
# está documentada em docs/adr/0024, e aplicá-la é passo MANUAL do usuário nas
# settings do GitHub (hoje bloqueado pelo plano do repo, ver o ADR).
# Só `pull_request`, sem `push`.
#
# Antes, `push` na branch de trabalho e `pull_request` para a permanente
# disparavam os DOIS — todo job rodava duas vezes por PR, incluindo os ~5,5 min
# do build de imagens: 11 minutos gastos para produzir o mesmo veredito duas
# vezes.
#
# Nada se perde em cobertura: a política exige PR para toda mudança, e PR em
# rascunho já dispara `opened` e `synchronize`. Quem quer CI antes de pedir
# review abre o PR como rascunho.
#
# O gatilho cobre a escada inteira (dev, qa, main). Enquanto filtrava só `dev`,
# um PR de promoção não rodava CI nenhum — e exigir estes checks nas
# permanentes travaria o PR para sempre, porque o check exigido nunca
# apareceria.
on:
  pull_request:
    branches:
      - dev
      - qa
      - main

# Push seguido de push no mesmo PR cancela a execução anterior: o que importa
# é o resultado do HEAD.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.11.1'
  PNPM_VERSION: '11.3.0'
  ELIXIR_VERSION: '1.17.3'
  OTP_VERSION: '27.1.2'
  # Mesmas versões pinadas do docker/engine/Dockerfile.prod. Divergir daqui
  # significa testar contra um scanner diferente do que roda em produção.
  # O passo "Versões dos scanners batem com o Dockerfile.prod" (job `lint`)
  # falha o build se estas três divergirem do que está lá.
  GITLEAKS_VERSION: '8.30.1'
  HADOLINT_VERSION: '2.12.0'
  YAMLLINT_VERSION: '1.38.0'
  ACTIONLINT_VERSION: '1.7.12'
  # Manifests de Kubernetes (Fase 5, sessão 2).
  KUSTOMIZE_VERSION: '5.8.1'
  KUBECONFORM_VERSION: '0.7.0'
  # SHA-256 de cada binário baixado por `curl` neste workflow — sem isto, um
  # `curl` que baixa release do GitHub sem checar nada é supply-chain aberta
  # (release comprometido ou MITM entregam um binário diferente do esperado,
  # e ninguém percebe até o scanner falhar em rodar, ou pior, "funcionar").
  # GITLEAKS_SHA256/HADOLINT_SHA256/ACTIONLINT_SHA256 são os MESMOS valores do
  # docker/engine/Dockerfile.prod (mesmo binário, mesma versão); conferidos
  # aqui de novo, por download independente, contra o checksums.txt publicado
  # em cada release. KUSTOMIZE_SHA256/KUBECONFORM_SHA256 não têm par no
  # Dockerfile.prod (o engine não usa os dois), mas seguem o mesmo método.
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  HADOLINT_SHA256: '56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010'
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
  KUSTOMIZE_SHA256: '029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d'
  KUBECONFORM_SHA256: 'c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3'
  # Binário do trivy usado no job `images` (scan das quatro imagens de
  # produção). Baixado à parte — e não pela action `aquasecurity/trivy-action`
  # — porque os quatro scans passam a rodar em PARALELO no mesmo job, e
  # GitHub Actions não paraleliza steps de um `uses:`. Mesma versão `v0.70.0`
  # que já validava o `.trivyignore.yaml` antes (era o `version:` da action).
  TRIVY_VERSION: '0.70.0'
  TRIVY_SHA256: '8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # Barato e cedo de propósito (nenhuma dependência instalada ainda): o
      # comentário perto de GITLEAKS_VERSION/HADOLINT_VERSION/ACTIONLINT_VERSION
      # promete que estas versões batem com docker/engine/Dockerfile.prod, mas
      # nada FORÇAVA isso até agora — alguém podia atualizar um dos dois
      # arquivos e o outro ficaria mudo, silenciosamente testando um scanner
      # diferente do que roda em produção (achado #8 da revisão de
      # 2026-08-28, docs/explanation/backlog.md).
      - name: Versões dos scanners batem com o Dockerfile.prod do engine
        run: |
          set -euo pipefail
          falhou=0
          for var in GITLEAKS_VERSION HADOLINT_VERSION ACTIONLINT_VERSION; do
            do_ci="$(grep -oP "^\s*${var}: '\K[^']+" .github/workflows/ci.yml)"
            do_dockerfile="$(grep -oP "^ARG ${var}=\K.+" docker/engine/Dockerfile.prod)"
            if [ "${do_ci}" != "${do_dockerfile}" ]; then
              echo "::error::${var} diverge — ci.yml='${do_ci}' Dockerfile.prod='${do_dockerfile}'"
              falhou=1
            fi
          done
          if [ "${falhou}" -ne 0 ]; then
            echo "As versões dos scanners têm que bater entre ci.yml e docker/engine/Dockerfile.prod."
            exit 1
          fi
          echo "ok: GITLEAKS_VERSION/HADOLINT_VERSION/ACTIONLINT_VERSION batem entre ci.yml e Dockerfile.prod"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Mesma família do passo "Versões dos scanners batem com o Dockerfile.prod"
      # lá em cima: asserção barata sobre o que o repositório já promete em
      # comentário. O #408 trocou tag por commit SHA nas actions DESTE arquivo e
      # só dele — os outros 15 workflows continuaram em tag mutável, entre eles
      # `release.yml` (empurra imagem no GHCR), `publish-runner.yml` (publica no
      # npm), `tag-release.yml` e `docs-deploy.yml`. Ou seja: sobrou justamente
      # onde há credencial. Disciplina humana não segurou o pin uma vez, e
      # workflow novo nasce copiando o vizinho — que estava com tag. Ver
      # docs/explanation/cadeia-de-suprimentos-do-ci.md.
      #
      # Antes do `pnpm install` de propósito: o script só usa `node:fs`.
      - name: Actions presas a commit SHA
        run: node scripts/ci/actions-pinadas.ts

      - run: pnpm install --frozen-lockfile

      # `eslint` direto, SEM o script `lint` do package.json: ele roda com
      # `--fix`, que num CI "conserta" o arquivo e sai verde sem ninguém ver o
      # problema. Aqui o modo é verificação.
      - name: ESLint (api, modo verificação)
        run: pnpm --filter api exec eslint "src/**/*.ts" --max-warnings 0

      - name: Oxlint (web)
        run: pnpm --filter web lint

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # SÓ RESTAURA — quem ESCREVE o cache do Elixir é o `test-engine`, e essa
      # assimetria é o ponto, não um detalhe.
      #
      # Antes eram duas entradas de cache mantidas em paralelo, sem reuso
      # cruzado: `lint` e `audit` gravavam `${os}-mix-deps-…` com `deps` só, e o
      # `test-engine` gravava `${os}-mix-…` com `deps` + `_build`. Duas cópias
      # das mesmas deps, e o `_build` — que é o que pesa, e cuja ausência faz o
      # `test-engine` variar de 39s a 124s — só existia numa delas.
      #
      # A saída ÓBVIA seria unificar a key e dar `_build` aos três. Ela está
      # ERRADA, e o modo de falha é silencioso: no Actions o PRIMEIRO que grava
      # uma key ganha, e gravação subsequente na mesma key é descartada. Como o
      # `lint` (66s) termina antes do `test-engine` (124s) e NÃO compila nada, ele
      # gravaria um `_build` vazio sob a key compartilhada — e o `test-engine`
      # passaria a restaurar isso e recompilar do zero para sempre. Unificar
      # deixaria o CI mais LENTO, com cache verde.
      #
      # Por isso `cache/restore`: mesma key e mesmos paths do escritor, zero
      # gravação. Cache frio aqui degrada para o que já era o caminho frio —
      # `mix deps.get` pela rede.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            apps/engine/deps
            apps/engine/_build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('apps/engine/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      # `mix format` NÃO é standalone aqui: o .formatter.exs faz
      # `import_deps: [:ecto, :ecto_sql, :phoenix]` para conhecer as macros
      # dessas libs, e sem as deps baixadas ele falha com "Unknown dependency".
      - name: mix deps.get
        working-directory: apps/engine
        run: mix deps.get

      # Mesma disciplina do eslint: `--check-formatted`, não `mix format`.
      #
      # A versão do Elixir aqui É load-bearing: as regras do formatador mudam
      # entre versões, então este check só é estável porque bate com o
      # ELIXIR_VERSION pinado nos Dockerfiles. Ver ADR 0024, decisão 10.
      - name: mix format --check-formatted
        working-directory: apps/engine
        run: mix format --check-formatted

      # Os Dockerfiles de produção passam pelo mesmo linter que o gate de QA de
      # infra usa nos artefatos que o agente propõe (ADR 0021).
      - name: Hadolint nos Dockerfiles de produção
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint
          /tmp/hadolint docker/api/Dockerfile.prod docker/engine/Dockerfile.prod \
            docker/web/Dockerfile.prod docker/backup/Dockerfile.prod \
            docker/broker/Dockerfile.prod

  test-api:
    name: Testes TS (api)
    runs-on: ubuntu-latest
    # Medido no run 33970169946 (job `test-ts`, antes da divisão): api sozinha
    # (setup + testes + typecheck) ficava por volta de 180s. 8min é folga real
    # sem ser bobeira.
    timeout-minutes: 8
    services:
      postgres:
        # pgvector, não `postgres:16` puro: as migrations criam a extensão e um
        # Postgres sem ela falha na primeira migration.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: brabo
          POSTGRES_PASSWORD: brabo
          POSTGRES_DB: brabo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brabo -d brabo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # O globalSetup do vitest (apps/api/test/support/global-setup.ts) cria
      # os bancos sozinho — só precisa de um Postgres onde possa CREATE
      # DATABASE. `TEST_DATABASE_URL` não é mais UM banco de teste: desde
      # perf/banco-por-worker-nos-testes-da-api ela só nomeia a BASE de onde
      # o setup deriva o banco template (`brabo_test_template`) e um banco
      # por worker do Vitest (`brabo_test_w1`..`brabo_test_w4`,
      # `apps/api/test/support/test-db-name.ts`) — nenhum teste conecta em
      # "brabo_test" no fluxo normal.
      DATABASE_URL: postgres://brabo:brabo@localhost:5432/brabo
      TEST_DATABASE_URL: postgres://brabo:brabo@localhost:5432/brabo_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `-- --coverage` liga o `@vitest/coverage-v8` (provider `v8`, nativo do
      # vitest — não é lib nova). `apps/api/vitest.config.ts` tem
      # `coverage.thresholds` gravado no valor medido hoje, arredondado para
      # baixo (RATCHET, não meta): o próprio vitest reprova o job se a
      # cobertura cair abaixo disso. `pnpm --filter api test` (sem
      # `--coverage`) continua o script que devs usam no dia a dia, sem gerar
      # relatório — só o CI mede o piso.
      - name: Testes da api (com piso de cobertura)
        run: pnpm --filter api test -- --coverage

      # O vitest transpila por SWC, que APAGA os tipos sem verificá-los — o
      # mesmo motivo do typecheck dos scripts de CI, no job `test-packages`.
      # Aqui isso importa mais do que parece: os DTOs de resposta da Fase 7b
      # provam por TIPO que espelham a entidade de domínio (`Wire<T>` +
      # `MesmasChaves`), e sem este passo essa prova só rodaria no job de
      # imagens, 20 minutos depois e num lugar que ninguém lê.
      - name: Typecheck da api
        run: pnpm --filter api typecheck

  test-web:
    name: Testes TS (web)
    runs-on: ubuntu-latest
    # Medido no run 33970169946 (job `test-ts`, antes da divisão): web sozinho
    # (setup + testes + typecheck) ficava por volta de 190s. 8min é folga real
    # sem ser bobeira. Sem serviço `postgres`: o web não toca banco.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Mesmo mecanismo do passo abaixo: `apps/web/vite.config.ts` tem
      # `coverage.thresholds` no valor medido hoje, arredondado para baixo.
      - name: Testes do web (com piso de cobertura)
        run: pnpm --filter web test -- --coverage

      # O web NÃO tinha typecheck no CI — só `lint` e `test`, e os dois passam
      # com erro de tipo (o vitest transpila por esbuild, que apaga os tipos
      # sem verificá-los, e o eslint não faz checagem de tipo aqui). O único
      # lugar que verificava era o `tsc -b` dentro do build da IMAGEM, que só
      # roda no bootstrap do k8s — feito à mão.
      #
      # O resultado foi quatro erros acumulados em três fases sem ninguém ver,
      # e a imagem `brabo-web` sem conseguir ser construída — ou seja, o deploy
      # Kubernetes inteiro quebrado, em silêncio. `--force` porque o `tsc -b`
      # é incremental e pularia o trabalho num runner com cache.
      - name: Typecheck do web
        run: pnpm --filter web typecheck

  test-packages:
    name: Testes TS (pacotes)
    runs-on: ubuntu-latest
    # Medido no run 33970169946 (job `test-ts`, antes da divisão): os seis
    # componentes abaixo (scripts de CI, porta de Docker, broker, runner)
    # somavam ~20s no total — o grosso do tempo deste job é o setup
    # (checkout + pnpm install). 8min é folga real sem ser bobeira. Sem
    # serviço `postgres`: nenhum destes pacotes toca banco.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Os scripts de CI são lógica pura, sem banco — mas rodam no mesmo job
      # porque compartilham o `pnpm install` acima.
      - name: Testes dos scripts de CI
        run: pnpm --filter @brabo/scripts test

      # O Node executa os `.ts` de scripts/ci/ por type stripping, que APAGA os
      # tipos sem verificá-los. Sem este passo, a anotação seria enfeite.
      - name: Typecheck dos scripts de CI
        run: pnpm --filter @brabo/scripts typecheck

      # A porta de Docker (ADR 0128) saiu de `apps/runner/src/` para um pacote
      # de workspace quando o broker virou o segundo consumidor (ADR 0130).
      # Nada auto-descobre membro novo: sem estes dois passos, os testes do
      # pacote simplesmente não rodariam.
      - name: Testes da porta de Docker
        run: pnpm --filter @brabo/docker-port test

      - name: Typecheck da porta de Docker
        run: pnpm --filter @brabo/docker-port typecheck

      # O broker de container (ADR 0130) — mesmo trio do runner, menos o smoke
      # do artefato: o `dist/index.cjs` dele não vai para registry nenhum, vai
      # para dentro da imagem, e quem o exercita é o build da imagem.
      - name: Testes do broker
        run: pnpm --filter @brabo/broker test

      - name: Typecheck do broker
        run: pnpm --filter @brabo/broker typecheck

      - name: Build do broker (tsup)
        run: pnpm --filter @brabo/broker build

      # `apps/runner` nunca rodou aqui até o ADR 0106 — buraco pré-existente,
      # mais grave agora que este código é publicado no npm pra terceiros.
      - name: Testes do runner
        run: pnpm --filter runner test

      - name: Typecheck do runner
        run: pnpm --filter runner typecheck

      - name: Build do runner (tsup)
        run: pnpm --filter runner build

      # O único teste que exercita o ARTEFATO EMPACOTADO de ponta a ponta —
      # os testes acima só chamam funções exportadas de `src/`, nunca o
      # `dist/index.cjs` que de fato vai pro registry.
      - name: Smoke do artefato empacotado do runner
        run: pnpm --filter runner smoke

  test-engine:
    name: Testes do engine (ExUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: brabo
          POSTGRES_PASSWORD: brabo
          POSTGRES_DB: brabo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brabo -d brabo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_USER: brabo
      POSTGRES_PASSWORD: brabo
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # Só para `node scripts/ci/coverage-floor.ts` logo abaixo — o script não
      # tem dependência nenhuma (só `node:fs`/`node:url`), então não precisa
      # de `pnpm install` aqui, ao contrário dos jobs `test-api`/`test-web`/
      # `test-packages`.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # O ESCRITOR do cache do Elixir — `lint` e `audit` só restauram desta key.
      # Este é o único job que compila (`mix compile` + `mix test`), então é o
      # único cujo `_build` vale ser guardado. O porquê de não distribuir a
      # gravação está no comentário do `lint`.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            apps/engine/deps
            apps/engine/_build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('apps/engine/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      # ---------------------------------------------------------------------
      # ESTE PASSO É O QUE IMPEDE UM FALSO-VERDE.
      #
      # test_helper.exs exclui as tags :gitleaks/:hadolint/:yamllint/:actionlint
      # quando o binário não existe na máquina. Esses módulos são exatamente as
      # REGRESSÕES que provam que os gates não aprovam vazio (ADR 0020: o
      # gitleaks varria o histórico em vez da árvore; ADR 0021: o gate de QA de
      # infra aprovava qualquer Dockerfile; ADR 0039: o Workflows geraria
      # pipeline sem validação nenhuma). Num runner pelado eles somem em
      # silêncio e o CI fica verde sem nunca testar os gates de segurança.
      #
      # Versões idênticas às do Dockerfile.prod do engine.
      # ---------------------------------------------------------------------
      - name: Instalar os binários dos gates (gitleaks, hadolint, yamllint, actionlint)
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          sudo chmod 0755 /usr/local/bin/gitleaks
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  /usr/local/bin/hadolint" | sha256sum -c -
          sudo chmod 0755 /usr/local/bin/hadolint
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          sudo chmod 0755 /usr/local/bin/actionlint
          pipx install "yamllint==${YAMLLINT_VERSION}"
          gitleaks version && hadolint --version && yamllint --version && actionlint -version

      - name: mix deps.get
        working-directory: apps/engine
        run: mix deps.get

      - name: Compilar com --warnings-as-errors
        working-directory: apps/engine
        run: mix compile --warnings-as-errors

      # `--cover` liga o `:cover` nativo do OTP (Mix já suporta — nenhuma lib
      # nova). `apps/engine/mix.exs` zera o threshold embutido da ferramenta
      # (`test_coverage: [summary: [threshold: 0]]`): quem decide passa/falha
      # é o `coverage-floor.ts` logo abaixo, não uma constante de 90% que
      # ninguém escolheu.
      - name: mix test --cover
        working-directory: apps/engine
        run: mix test --cover 2>&1 | tee /tmp/mix-test.log

      # Guarda do falso-verde: se algum teste foi EXCLUÍDO além do esperado,
      # algum binário do passo acima não chegou e os gates não foram
      # exercitados. Falhar aqui é a diferença entre "verde" e "verde de
      # verdade".
      #
      # DUAS exclusões são esperadas aqui, cada uma permanente e por desenho,
      # nunca por binário faltando:
      #   - `:golden_set_qa` (ADR 0123) — julga com um LLM real, custa tempo e
      #     não é determinística; roda só com `mix golden_set.qa`.
      #   - `:golden_set_rag` (ADR 0132) — mede a busca híbrida contra um
      #     corpus real, precisa de embedding de verdade; roda só com
      #     `mix golden_set.rag`.
      # Cada uma é sempre exatamente 1 teste (`@moduletag` no módulo golden
      # correspondente), então o piso é fixo em 2 — mais que isso É o sinal
      # real de binário ausente. Uma terceira família de golden-set soma mais
      # 1 ao piso, nunca o afrouxa por margem.
      - name: Nenhum teste pode ter sido excluído além dos golden-sets
        run: |
          excluidos="$(grep -oE '[0-9]+ excluded' /tmp/mix-test.log | head -1 | grep -oE '^[0-9]+' || true)"
          excluidos="${excluidos:-0}"
          if [ "${excluidos}" -gt 2 ]; then
            echo "::error::testes excluídos além dos golden-sets (ADR 0123/0132, esperado 2) — os binários dos gates não estavam disponíveis:"
            grep -E 'excluded' /tmp/mix-test.log
            exit 1
          fi
          echo "ok: só os golden-sets (ADR 0123/0132, sempre excluídos aqui) contribuíram para a contagem de excluídos (${excluidos})"

      # Piso (ratchet) sobre a % de cobertura do engine — ver
      # scripts/ci/coverage-floor.ts e scripts/ci/coverage-floor.json para o
      # valor gravado e a explicação de por que é ratchet, não meta.
      - name: Piso de cobertura do engine
        run: node scripts/ci/coverage-floor.ts < /tmp/mix-test.log

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job próprio, e não um passo do `lint`, porque a natureza da falha é
    # diferente: lint reprova o QUE ESCREVEMOS, auditoria reprova o que
    # IMPORTAMOS. Separado, dá para ver num relance se a PR quebrou por código
    # nosso ou porque uma CVE foi publicada num pacote de terceiro entre ontem
    # e hoje — que acontece sem ninguém tocar no repo.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--audit-level critical`: o gate é para CRÍTICA, como definido no
      # escopo da fase. HIGH e abaixo aparecem no log sem reprovar — reprovar
      # em `moderate` num monorepo com esta árvore de dependências
      # transformaria o CI num bloqueio permanente por coisa que ninguém pode
      # resolver hoje, e a reação seria desligar o gate inteiro.
      # NÃO é `pnpm audit` direto: o script separa "não consegui perguntar" de
      # "encontrei vulnerabilidade", e só o PRIMEIRO é risco assumido.
      #
      # O endpoint de advisories do npm derrubou este job em QUATRO PRs em
      # 2026-09-04, sempre com a mesma assinatura (`advisories/bulk error
      # (503)` + `TimeoutError`), e reproduzido fora do CI batendo direto nele.
      # Gate que reprova por indisponibilidade de terceiro ensina a re-rodar
      # até passar — e quem aprende isso re-roda também quando o vermelho era
      # de verdade.
      #
      # Decisão do dono do produto (2026-09-04): três tentativas sem resposta
      # = RISCO ASSUMIDO, verde com aviso alto no resumo do job. Vulnerabilidade
      # encontrada continua reprovando na PRIMEIRA, sem retentativa, e saída
      # desconhecida reprova também (fail closed). Ver ADR 0140.
      - name: pnpm audit (workspace)
        env:
          TENTATIVAS: '3'
        run: node scripts/ci/auditoria-de-dependencias.ts

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # Só restaura, pelo mesmo motivo detalhado no job `lint`: o escritor do
      # cache do Elixir é o `test-engine`, e gravar daqui poria um `_build`
      # vazio sob a key dele.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            apps/engine/deps
            apps/engine/_build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('apps/engine/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: mix deps.get
        working-directory: apps/engine
        run: mix deps.get

      # Os dois rodam, mas NÃO pela divisão que este comentário afirmava até
      # 2026-09-04 ("hex.audit -> aposentado, deps.audit -> CVE"). O `hex.audit`
      # cobre os DOIS assuntos e reprova por qualquer um deles — o `@shortdoc`
      # do próprio Hex é "Shows retired Hex deps and security advisories" —, e
      # foi ele quem pegou as duas advisories de `mint 1.9.3` que derrubaram a
      # PR de promoção #473. O comentário antigo mandava quem estivesse
      # depurando o vermelho procurar por pacote aposentado, que não era o caso.
      #
      # O que separa os dois é a BASE, não o assunto:
      #   hex.audit   -> o que a hex.pm serve no registro (retirement +
      #                  advisory), a mesma origem dos pacotes
      #   deps.audit  -> o repositório `elixir-security-advisories` (mix_audit)
      # Bases diferentes divergem, e a que estiver na frente é a que pega o
      # caso. Por isso os dois ficam: cortar um é aceitar o atraso do outro,
      # não remover redundância.
      #
      # Um passo reprovado ENCERRA o job (`bash -e`), então numa run vermelha o
      # segundo auditor não chega a rodar e o relatório fica pela metade — foi o
      # que aconteceu na #473. Aceito: o desfecho do gate não muda, e o passo
      # que sobrou roda sozinho no próximo push.
      - name: mix hex.audit (aposentados e advisories da hex.pm)
        working-directory: apps/engine
        run: mix hex.audit

      - name: mix deps.audit (elixir-security-advisories)
        working-directory: apps/engine
        run: mix deps.audit

  secrets-scan:
    name: Gitleaks no repositório
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Histórico completo: um segredo removido no último commit continua
          # recuperável e precisa ser encontrado.
          fetch-depth: 0

      # `fetch-depth: 0` traz TODAS as refs, e o `gitleaks detect` varre todos os
      # commits alcançáveis — não só o histórico do HEAD. Desde o ADR 0034 isso
      # passou a incluir a `gh-pages`, que carrega o site CONSTRUÍDO.
      #
      # O efeito foi medido, não previsto: **112 achados `generic-api-key`** num
      # único commit do bot de publicação, todos em `dev/assets/js/*.js` — nomes de
      # arquivo de avatar dentro de bundle minificado, com entropia alta o
      # suficiente para a regra morder. Reprovou o PR de promoção #78 (`v1.1.0`), o
      # primeiro a ser varrido depois de a `gh-pages` nascer.
      #
      # A `gh-pages` NÃO é código-fonte: nada nela é escrito por pessoa, tudo é
      # gerado de `docs/` e `website/`. Varrê-la procurando segredo é procurar no
      # lugar errado, e o custo de não fazer nada seria pior que o ruído — check
      # required vermelho por ruído ensina a ignorar check vermelho.
      #
      # A saída NÃO é allowlist de caminho no `.gitleaks.toml`: aquilo valeria para
      # TODOS os commits, então um `dev/` que aparecesse no código-fonte um dia
      # ficaria sem varredura, em silêncio. Tirar a ref do escopo é preciso —
      # exclui exatamente os commits que não são fonte, e nada mais.
      #
      # Verificado por execução com o gitleaks 8.30.1, a mesma versão daqui:
      # antes 133 commits e 112 achados (idêntico ao log do #78); depois 132
      # commits e nenhum achado. E a prova de que não abriu buraco: um PAT do
      # GitHub com entropia real, plantado num commit de `apps/api/src/`, continua
      # sendo detectado.
      - name: Tirar a gh-pages do escopo
        run: |
          set -euo pipefail
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            git update-ref -d refs/remotes/origin/gh-pages
            echo "gh-pages fora do escopo — ela é site gerado, não fonte."
          else
            echo "gh-pages não existe neste clone; nada a excluir."
          fi

      - name: Instalar gitleaks
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          sudo chmod 0755 /usr/local/bin/gitleaks

      - name: gitleaks detect
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  manifests:
    name: Manifests de Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Instalar kustomize e kubeconform
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  /tmp/kustomize.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin kustomize
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          sudo chmod 0755 /usr/local/bin/kustomize /usr/local/bin/kubeconform

      # Dois níveis, que pegam coisas diferentes: `kustomize build` acha patch
      # sem alvo e conflito de ID; `kubeconform` acha campo com nome errado,
      # tipo errado e apiVersion inexistente. O segundo é o que separa "o YAML
      # monta" de "a API aceitaria" — sem ele, um `maxUnavailble` passaria.
      - name: Montar e validar os overlays
        run: bash deploy/k8s/validate.sh

      # O overlay local é o único exercitado de verdade (`make deploy-local`), e
      # o que o smoke assume dele são as portas. Se alguém mudar um NodePort
      # sem mudar o mapeamento do bootstrap, o cluster sobe e o smoke falha por
      # um motivo que não parece ter relação. Barato afirmar aqui.
      - name: Portas do overlay local batem com as do compose de produção
        run: |
          set -euo pipefail
          out="$(kustomize build deploy/k8s/overlays/local)"
          # 30080 saiu com o Keycloak (Fase 7.2): era a porta dele, e nenhum
          # serviço a ocupa desde então. Manter a asserção reprovaria para
          # sempre uma remoção que já foi feita de propósito.
          for port in 30300 30400 30088; do
            grep -q "nodePort: ${port}" <<<"${out}" \
              || { echo "NodePort ${port} sumiu do overlay local"; exit 1; }
          done

      # `WEB_PORT` e `WEB_ORIGIN` são a MESMA informação vista de dois lados: a
      # porta em que o browser abre o web, e a origem que a api e o engine
      # aceitam no CORS. Enquanto tiveram defaults independentes, trocar
      # `WEB_PORT` movia o browser e deixava o CORS para trás — e o console fala
      # de CORS, não de porta, então o tempo vai todo para o lugar errado
      # (ADR 0037). Derivar um do outro torna a divergência impossível; esta
      # asserção impede que alguém volte a separá-los sem perceber.
      - name: WEB_ORIGIN deriva de WEB_PORT nos composes
        run: |
          set -euo pipefail
          faltou=0
          for arquivo in docker/docker-compose.yml docker/docker-compose.prod.yml; do
            while IFS= read -r linha; do
              case "${linha}" in
                *'${WEB_PORT'*) ;;
                *)
                  echo "${arquivo}: WEB_ORIGIN não deriva de WEB_PORT -> ${linha}"
                  faltou=1
                  ;;
              esac
            done < <(grep -E '^[[:space:]]*WEB_ORIGIN:' "${arquivo}" || true)
          done
          if [ "${faltou}" -ne 0 ]; then
            echo "A porta faz parte do contrato de CORS — ver docs/adr/0037-cors-do-engine-e-a-porta-como-contrato.md"
            exit 1
          fi
          echo "ok: todo WEB_ORIGIN dos composes deriva de WEB_PORT"

      # O nome da métrica e os rótulos são referenciados por STRING em três
      # lugares que não se enxergam: o HPA, a regra do prometheus-adapter e o
      # smoke. Renomear a métrica no engine compila, passa na suite, e o único
      # sintoma é o HPA parar em `<unknown>` sem escalar.
      - name: HPA do engine referencia a métrica que o engine expõe
        run: |
          set -euo pipefail
          grep -q 'name: oban_queue_depth' deploy/k8s/base/engine/hpa.yaml
          grep -q 'state: available' deploy/k8s/base/engine/hpa.yaml
          grep -q 'oban_queue_depth' deploy/k8s/helm/prometheus-adapter-values.yaml
          grep -q 'by (queue, state)' deploy/k8s/helm/prometheus-adapter-values.yaml
          grep -rq 'oban_queue_depth' apps/engine/test/engine_web/controllers/metrics_controller_test.exs

      # Nome de métrica, de campo de log e de datasource são referenciados por
      # STRING em lugares que não se enxergam: dashboards, alertas, runbook e o
      # código. Divergir compila, passa na suite, e o único sintoma é painel
      # vazio ou link de correlação que deixou de aparecer.
      - name: Contratos de observabilidade batem entre código e dashboards
        run: |
          set -euo pipefail

          # Dashboards e alertas são JSON/YAML válidos.
          for f in deploy/k8s/observability/dashboards/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
          python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" \
            deploy/k8s/observability/alerts/brabo-alerts.yaml

          # Toda métrica citada nos dashboards existe no código.
          for metric in \
            brabo_llm_cost_micros_total brabo_llm_tokens_total \
            brabo_llm_call_duration_seconds brabo_sessions_active \
            brabo_tasks_blocked brabo_proposed_actions_decided_total; do
            grep -rq "${metric%_bucket}" apps/api/src/infrastructure/observability/brabo-metrics.ts \
              || { echo "métrica ${metric} está nos dashboards e não no código"; exit 1; }
          done
          grep -rq "oban_queue_depth" apps/engine/lib/engine_web/telemetry.ex
          grep -rq "brabo_engine_sessions_hosted\|:sessions, :hosted" apps/engine/lib/engine_web/telemetry.ex

          # `trace_id` com underscore nos TRÊS serviços — é o que o Alloy extrai
          # e o derivedFields do Loki procura.
          grep -q "trace_id" apps/api/src/infrastructure/observability/logger.config.ts
          # No engine o campo mora em `log_fields.ex` desde o ADR 0035: o
          # `json_log_formatter.ex` passou a só serializar o mapa que esse módulo
          # monta, e o `pretty_log_formatter.ex` consome o mesmo mapa. Apontar
          # para o dono dos NOMES é mais estável que para um dos formatadores.
          grep -q '"trace_id"' apps/engine/lib/engine/telemetry/log_fields.ex
          grep -q "trace_id" apps/web/src/lib/logger.ts
          grep -q "matcherRegex: trace_id" deploy/k8s/helm/grafana-values.yaml
          grep -q "trace_id" deploy/k8s/helm/alloy-values.yaml

          # A NetworkPolicy de OTLP existe: sem ela a instrumentação exporta
          # para o vazio, em silêncio.
          grep -q "allow-otlp-egress" deploy/k8s/base/common/netpol-observability.yaml
          grep -q "netpol-observability" deploy/k8s/base/kustomization.yaml

      - name: shellcheck nos scripts de deploy
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning deploy/k8s/*.sh docker/smoke.sh

  images:
    name: Build, scan e smoke das imagens de produção
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Build, scan e smoke no MESMO job de propósito: as quatro imagens somam
    # ~1,7 GB, e passá-las entre jobs por artifact custaria mais tempo de
    # upload/download do que o build inteiro. Aqui elas ficam no daemon local.
    #
    # O paralelismo vem do `bake`, não de uma matriz de jobs — cada job da
    # matriz teria seu próprio daemon, e aí as imagens precisariam trafegar.
    #
    # [MEDIÇÃO TEMPORÁRIA — perf/imagens-via-ghcr-no-ci] Reabrindo essa
    # decisão a pedido explícito: em vez de artifact genérico, testar GHCR
    # como mecanismo de transporte entre jobs (layers deduplicadas, não um
    # tar). Os passos marcados [MEDIÇÃO] abaixo só EXISTEM pra medir
    # push/pull reais antes de desenhar o split — saem deste arquivo assim
    # que a medição terminar, virando o desenho final ou um comentário
    # registrando a rejeição.
    permissions:
      contents: read
      packages: write
    # [MEDIÇÃO] output só pro job de pull enxergar a tag efêmera desta run.
    outputs:
      medicao_tag: ${{ steps.medicao_push.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # Os quatro alvos em PARALELO num builder só. Em sequência somavam ~6
      # dos 8 minutos do job (api 130s, engine 160s, web 49s, backup 20s).
      # Medido localmente com cache frio: 201s em sequência, 111s em paralelo.
      # No runner o ganho é menor — 2 vCPUs não sobrepõem `tsc` com `mix
      # compile` —, mas as esperas de rede de pnpm/mix/pip/apk sobrepõem bem.
      #
      # O que cada alvo constrói, com que cache e com que tag está no
      # docker-bake.hcl da raiz, que também é o que se roda na mão.
      - name: Build das quatro imagens (em paralelo)
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4  # v6
        with:
          files: docker-bake.hcl
          targets: default
          load: true

      # [MEDIÇÃO] Login no GHCR — mesmo mecanismo do `release.yml` (ADR
      # 0119): `GITHUB_TOKEN` com `packages: write`, sem segredo novo. NUNCA
      # a mesma tag que o release publica (`brabo-api:vX.Y.Z`) — pacote
      # PRÓPRIO (`brabo-ci-*`), pra uma imagem de PR de CI nunca aparecer ao
      # lado de uma release de verdade.
      - name: "[MEDIÇÃO] Login no GHCR"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # [MEDIÇÃO] Mede só o PUSH: as quatro imagens já estão no daemon local
      # (step acima), então o tempo aqui é round-trip de rede puro, isolado
      # do build. Tag efêmera por run+attempt — nunca reaproveitada, pra não
      # colidir com uma run concorrente.
      - name: "[MEDIÇÃO] Push das quatro imagens pro GHCR"
        id: medicao_push
        run: |
          set -euo pipefail
          tag="ci-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          owner="${{ github.repository_owner }}"
          for alvo in api engine web backup; do
            docker tag "brabo-${alvo}:prod" "ghcr.io/${owner}/brabo-ci-${alvo}:${tag}"
          done
          inicio=$(date +%s)
          for alvo in api engine web backup; do
            docker push "ghcr.io/${owner}/brabo-ci-${alvo}:${tag}"
          done
          fim=$(date +%s)
          duracao=$((fim - inicio))
          echo "duracao_s=${duracao}" >> "$GITHUB_OUTPUT"
          echo "::notice::[MEDIÇÃO] push das 4 imagens pro GHCR: ${duracao}s"

      # Critério de aceite explícito da sessão. Checado aqui além do smoke.sh
      # porque é barato e falha com mensagem direta.
      - name: Nenhuma imagem pode rodar como root
        run: |
          set -euo pipefail
          for img in brabo-api:prod brabo-engine:prod brabo-web:prod brabo-backup:prod; do
            user="$(docker inspect --format '{{.Config.User}}' "$img")"
            if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
              echo "::error::$img roda como root (Config.User='$user')"
              exit 1
            fi
            echo "ok: $img -> $user"
          done

      # Os quatro scans abaixo eram QUATRO steps sequenciais via
      # `aquasecurity/trivy-action`, somando ~28s (api 17s — inclui o download
      # da base de vulnerabilidades —, engine 6s, web 2s, backup 3s). GitHub
      # Actions não paraleliza steps de um job, e a action não tem modo de
      # escanear várias imagens numa chamada só — só dava pra paralelizar
      # trocando por um binário chamado direto num script de shell.
      #
      # As quatro imagens já estão no MESMO daemon (é por isso que build, scan
      # e smoke ficam neste único job, ver o comentário no topo), então não
      # havia razão pras quatro serem sequenciais: o gargalo de cada scan é
      # I/O (base de vulnerabilidades + análise de camada), não CPU.
      #
      # Achado ao medir localmente: `trivy image` quatro vezes em paralelo
      # contra o MESMO `--cache-dir` (o default) falha por disputa de lock no
      # cache local do trivy (bbolt) — "cache may be in use by another
      # process: timeout" — mesmo com `--skip-db-update`, porque o cache de
      # ANÁLISE DE CAMADA usa o mesmo arquivo que a base de vulnerabilidades,
      # não só ela. A saída: baixar a base UMA vez, copiar pra um `--cache-dir`
      # PRÓPRIO por imagem (isola o lock) e só então escanear as quatro em
      # paralelo — o download de ~110MB deixa de se repetir quatro vezes e a
      # cópia local em disco é bem mais barata que refazer o download.
      - name: Instalar o binário do trivy
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          sudo chmod 0755 /usr/local/bin/trivy
          trivy --version

      - name: Baixar a base de vulnerabilidades do trivy
        run: trivy image --cache-dir /tmp/trivy-cache/seed --no-progress --download-db-only

      - name: Trivy nas quatro imagens (em paralelo)
        run: |
          set -uo pipefail
          # NÃO "set -e" aqui: cada scan roda em background (&) dentro de um
          # subshell próprio, e o desfecho de cada um é lido depois via
          # `wait`, nunca por status de comando em sequência — `errexit`
          # dentro de uma função chamada em background mataria a função ANTES
          # de ela registrar o próprio código de saída (achado ao testar a
          # primeira versão deste script).

          declare -A imagens=(
            [api]="brabo-api:prod"
            [engine]="brabo-engine:prod"
            [web]="brabo-web:prod"
            [backup]="brabo-backup:prod"
          )

          # Cache PRÓPRIO por imagem, apontando pra MESMA base já baixada —
          # ver o comentário acima sobre a disputa de lock no cache padrão.
          # LINK, não cópia: o lock em disputa era do `fanal.db` (cache de
          # ANÁLISE DE CAMADA, que cada scan cria do zero de qualquer forma),
          # nunca do `trivy.db` (a base em si) — copiar ~1,3 GB por imagem só
          # pra isolar um arquivo que nasce vazio comia de volta boa parte do
          # ganho da paralelização (medido: ~11s de cópia).
          for nome in "${!imagens[@]}"; do
            mkdir -p "/tmp/trivy-cache/${nome}"
            ln -s /tmp/trivy-cache/seed/db "/tmp/trivy-cache/${nome}/db"
          done

          pids=()
          nomes=()
          for nome in "${!imagens[@]}"; do
            (
              trivy image \
                --cache-dir "/tmp/trivy-cache/${nome}" \
                --no-progress \
                --format table \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --ignorefile .trivyignore.yaml \
                --skip-db-update \
                --exit-code 1 \
                "${imagens[$nome]}" 2>&1 | sed "s/^/[${nome}] /"
            ) &
            pids+=("$!")
            nomes+=("$nome")
          done

          # Cada `wait` é individual — e não um `wait` só pra todos — porque
          # precisamos do código de saída DE CADA UM pra apontar qual imagem
          # falhou, não só que alguma falhou.
          status=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "::error::Trivy falhou em ${nomes[$i]} (${imagens[${nomes[$i]}]})"
              status=1
            fi
          done
          exit "$status"

      # SMOKE_NO_BUILD: as imagens já estão no daemon, construídas com cache
      # acima — o compose reusaria a tag e reconstruiria à toa.
      #
      # SMOKE_KEEP_UP: o stack fica de pé para o E2E de navegador logo abaixo.
      # Ele roda NESTE job, e não num próprio, porque as quatro imagens levam
      # a maior parte do tempo aqui — um job separado as construiria de novo
      # para exercitar exatamente o mesmo compose.
      - name: Teste de fumaça (compose.prod)
        run: SMOKE_NO_BUILD=1 SMOKE_KEEP_UP=1 bash docker/smoke.sh

      # Este job é de Docker e não tinha Node nem pnpm — só o E2E precisa.
      # Depois do build das imagens de propósito: falha de setup aqui não
      # deve custar a construção que é o objeto principal do job.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # Sem `cache: pnpm`: o lockfile do `e2e/` não é o da raiz, e apontar a
      # chave de cache para o arquivo errado guarda a árvore errada.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # `e2e/` NÃO é membro do workspace da raiz (mesmo desenho do `website/`,
      # ADR 0117): `pnpm install` roda de DENTRO da pasta, contra o lockfile
      # próprio. `--frozen-lockfile` porque lockfile que o CI atualiza sozinho
      # não é lockfile.
      - name: Dependências do E2E
        run: pnpm install --frozen-lockfile
        working-directory: e2e

      # Só o chromium: um navegador prova o mecanismo (cookie httpOnly, CORS,
      # handshake do socket), e os outros dois custariam download e tempo para
      # provar de novo a mesma coisa. A VERSÃO do navegador vem presa à versão
      # exata do `@playwright/test` no lockfile — é assim que este download se
      # encaixa na disciplina de pin do repositório (ver
      # docs/explanation/cadeia-de-suprimentos-do-ci.md).
      - name: Navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e

      - name: E2E de navegador (compose.prod de pé)
        run: pnpm test
        working-directory: e2e

      # `if: always()` de propósito: o relatório só interessa quando falhou, e
      # é justamente aí que o passo anterior interrompeu o job.
      - name: Relatório do E2E
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # O `SMOKE_KEEP_UP` acima desligou a derrubada que o smoke fazia sozinho.
      # `always()` porque volume de banco sobrevivendo a um job que falhou é o
      # tipo de lixo que só aparece semanas depois, no disco do runner.
      - name: Derrubar o compose
        if: always()
        run: docker compose -f docker/docker-compose.prod.yml down -v

  # [MEDIÇÃO TEMPORÁRIA — perf/imagens-via-ghcr-no-ci] Mede o PULL num runner
  # LIMPO (sem as imagens no daemon), separado do job `images` de propósito —
  # é exatamente essa separação que o desenho final teria entre build e
  # scan/smoke, e é o número que falta pra decidir se o mecanismo compensa.
  medir-pull-ghcr:
    name: "[MEDIÇÃO] Pull das imagens do GHCR"
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull das quatro imagens (runner limpo)
        run: |
          set -euo pipefail
          tag="${{ needs.images.outputs.medicao_tag }}"
          owner="${{ github.repository_owner }}"
          inicio=$(date +%s)
          for alvo in api engine web backup; do
            docker pull "ghcr.io/${owner}/brabo-ci-${alvo}:${tag}"
          done
          fim=$(date +%s)
          duracao=$((fim - inicio))
          echo "::notice::[MEDIÇÃO] pull das 4 imagens do GHCR (runner limpo): ${duracao}s"

  # Limpeza OBRIGATÓRIA das tags efêmeras — elas nunca podem se acumular no
  # GHCR. `if: always()` porque a limpeza vale inclusive quando o push, o
  # scan ou o pull falharam no meio.
  limpar-imagens-medicao:
    name: "[MEDIÇÃO] Limpa as imagens efêmeras do GHCR"
    needs: [images, medir-pull-ghcr]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - name: Deletar as versões efêmeras desta run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.images.outputs.medicao_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "::notice::sem tag de medição (o job images não chegou a publicar) — nada a limpar"
            exit 0
          fi
          for alvo in api engine web backup; do
            pacote="brabo-ci-${alvo}"
            id="$(gh api "users/${OWNER}/packages/container/${pacote}/versions" --jq ".[] | select(.metadata.container.tags[]? == \"${TAG}\") | .id" | head -1)"
            if [ -z "${id}" ]; then
              echo "::warning::não achei versão de ${pacote}:${TAG} pra deletar (pode já ter sido removida, ou o push falhou)"
              continue
            fi
            gh api -X DELETE "users/${OWNER}/packages/container/${pacote}/versions/${id}"
            echo "ok: deletado ${pacote}:${TAG} (version id ${id})"
          done
