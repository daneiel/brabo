    CreateProjectDto:
      type: object
      properties:
        name:
          type: string
          example: Checkout
          minLength: 2
        slug:
          type: string
          example: checkout
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: kebab-case. Уникален в пределах рабочего пространства.
        maxConsecutiveBlocked:
          type: number
          example: 3
          description: >-
            Предохранитель (Фаза 12b — RN-047): сколько последовательных задач,
            закончившихся блокировкой, останавливают dev agent модуля в
            idle_tripped. Если опущено, используется значение домена по
            умолчанию (DEFAULT_MAX_CONSECUTIVE_BLOCKED). Применяется со
            СЛЕДУЮЩЕЙ активации выполнения — не затрагивает уже работающих
            агентов.
        storyPromotion:
          type: string
          enum:
            - manual
            - auto
          example: auto
          description: >-
            Кто продвигает историю из `draft` в `ready` (Фаза 12c — RN-048).
            `auto` (по умолчанию для новых проектов начиная с RN-659): полная
            история сразу рождается `ready`, без шага человека. `manual`: PO
            предлагает, а ВЫ решаете во вкладке Backlog. Смена значения по
            умолчанию не переписала ни одного существующего проекта. Проверки
            домена (DoD/DoR/RF/правило/модули) ОДИНАКОВЫ в обоих режимах; режим
            меняет только то, кто запускает.
        executionMode:
          type: string
          enum:
            - container
            - mounted
            - runner
          example: container
          description: >-
            ГДЕ ВЫПОЛНЯЕТСЯ команда этого проекта (RN-169/RN-421 — ADR
            0072/0104). `container` (по умолчанию): папка, управляемая продуктом
            внутри PROJECT_WORKSPACES_ROOT, обычное поведение. `mounted`: ВАША
            папка, указанная в `workspacePath`, внутри общей для установки базы
            `BRABO_PROJECTS_BASE` (ADR 0141), — при создании проверяется только
            ФОРМАТ пути плюс эта база, а сама папка создаётся позже, когда Infra
            запускает контейнер (RN-501, ADR 0142). `runner`: ВАША папка,
            которой НЕ нужен bind-mount, — при создании проверяется только
            формат пути, и проект рождается «непроверенным»; запустите
            `brabo-runner --project <id> --dir <folder>` на своей машине, чтобы
            подтвердить его (RN-423).
        workspacePath:
          type: string
          example: /home/you/projects/store
          description: >-
            АБСОЛЮТНЫЙ путь к папке, обязательный, когда `executionMode` равен
            `mounted` или `runner`, и отклоняемый, когда он `container`. В ОБОИХ
            сейчас проверяется только ФОРМАТ — абсолютный, без `..`, не
            системный корень, не системная папка, не пересекается с checkout
            Brabo (RN-422/RN-423). `mounted` добавляет одно правило: он должен
            находиться внутри `BRABO_PROJECTS_BASE`, единственной папки вашей
            машины, которую видят контейнеры Brabo (ADR 0141), — без настроенной
            базы режим недоступен в этой установке, и создание об этом сообщает.
            Диска касаются позже: runner в `runner` и Infra при запуске
            контейнера в `mounted` (RN-501, ADR 0142).
        language:
          type: string
          example: pt-BR
          maxLength: 35
          description: >-
            Язык ПРОЕКТА (RN-619) — его используют общие артефакты и ходы без
            автора-человека. Любой код BCP-47, распознаваемый сервером, хранимый
            в каноническом виде; нераспознанный — это 400. Если опущен, проект
            начинает с эффективного языка ответов своего создателя (RN-618:
            выбор в учётной записи > подтверждённое обнаружение > язык
            интерфейса).
      required:
        - name
        - slug
