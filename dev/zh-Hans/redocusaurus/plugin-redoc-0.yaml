          description: 项目从未设置过预算时为 `null`——不同于被清零的记录，正是这一点让卡片提供“设置预算”。
          type: object
          allOf:
            - $ref: '#/components/schemas/ProjectCardBudgetResponseDto'
        latestSessionId:
          type: object
          example: 01JC4Z0000SESSAO00000000001
          nullable: true
        latestSeq:
          type: number
          example: 41
          description: 最近会话中已记录的最后一个 `seq`（`nextSeq - 1`）；没有会话时为 0。Web 端将其与已看过的内容比较来统计未读数。
        lastEvent:
          nullable: true
          description: 最近会话的最后一个事件——卡片的页脚行。
          type: object
          allOf:
            - $ref: '#/components/schemas/SessionEventResponseDto'
        storiesAwaitingPromotion:
          type: number
          example: 2
          description: PO 已完成、等待用户提升的 story（RN-048）。
        pendingApprovalsCount:
          type: number
          example: 8
          description: >-
            `proposed_actions`，其 `status =
            pending`，覆盖整个项目所有会话——而不仅是最近的会话。这就是侧边栏显示为项目徽标的内容（RN-151）。
        onlineAgentCount:
          type: number
          example: 2
          description: >-
            此刻有多少代理在线——正在工作或有等待决定的待办项（RN-409）。绝不是团队规模：`idle`/`idle_tripped` 的
            dev agent 不计入，`idle` 的对话式代理不计入，QA/SecOps 永不计入（每次调用只有一个裁决）。
        roster:
          $ref: '#/components/schemas/RosterFactsResponseDto'
      required:
        - projectId
        - provider
        - provisioningStatus
        - budget
        - latestSessionId
        - latestSeq
        - lastEvent
        - storiesAwaitingPromotion
        - pendingApprovalsCount
        - onlineAgentCount
        - roster
    ProjectFoldersResponseDto:
      type: object
      properties:
        base:
          type: object
          example: /home/voce/brabo
          nullable: true
          description: >-
            此安装的挂载项目基目录（`BRABO_PROJECTS_BASE`，ADR 0141）——与 `GET
            .../projects-base` 返回的值相同，在此重复，以便客户端无需第二次调用即可渲染面包屑。`null` 表示此安装不提供
            Mounted 模式。
        path:
          type: object
          example: /home/voce/brabo/clientes
          nullable: true
          description: >-
            实际列出的文件夹，已规范化。等于 `base`，当请求省略 `path` 时。仅当完全没有基目录时为
            `null`：什么都没列出，因为无处可列。
        entries:
          example:
            - api
            - loja
            - website
          description: >-
            `path` 正下方的子目录名称，已排序，绝不递归。文件、符号链接和以点开头的条目会被排除——见
            `arquivos`、`simbolicos` 和 `truncado`。
          type: array
          items:
            type: string
        truncado:
          type: boolean
          example: false
          description: >-
            该文件夹包含超过 500 个子目录，只返回了前 500
            个。排序在截断之前进行，因此截断是确定性的，而不是“文件系统先返回什么就是什么”。
        arquivos:
          type: number
          example: 12
          description: 有多少个非目录条目被略去。满是代码的文件夹绝不能看起来是空的（RN-180）。
        simbolicos:
          type: number
          example: 1
          description: 有多少个符号链接被略去。浏览器从不跟随链接——链接只报告而绝不进入，因此指向基目录之外的链接不是逃出基目录的途径。
      required:
        - base
        - path
        - entries
        - truncado
        - arquivos
        - simbolicos
    ProjectGitRemoteResponseDto:
