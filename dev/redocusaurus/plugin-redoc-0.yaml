        entregavel:
          type: object
          example: veredito-qa
          description: O que o gate produz quando passa.
        aprovacaoHumana:
          type: boolean
          example: true
          description: >-
            A decisão é do usuário — direta no clique OU delegada por uma
            política que ele mesmo escreveu (ver RN-071).
        severidade:
          type: string
          example: block
          enum:
            - block
            - warn
      required:
