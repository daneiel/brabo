          description: >-
            `criado`：新提议。`substituiu_oferta`：新提议，且给同一目标的待处理提议变为
            `superseded`。`ja_oferecido`：没有新记录——返回已存在的待处理提议（同一会话且没有新制品，或
            `seAusente`）。
