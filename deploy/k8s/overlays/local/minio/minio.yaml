# MinIO — destino S3-compatível do backup, SÓ no cluster local (Fase 5, item 6).
#
# Existe para que o caminho de backup exercitado localmente seja o MESMO de
# produção: o script fala S3 sempre, e o que muda entre ambientes é apenas o
# endpoint. A alternativa (gravar em PVC no local e em S3 em produção) deixaria
# credencial, bucket e retenção remota — justamente onde restore costuma falhar
# — sem nenhum teste até o dia do incidente.
#
# Réplica única, sem HA e sem PDB de propósito: é infraestrutura de teste. Em
# staging/prod o bucket é externo e este manifesto não é aplicado.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: brabo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: brabo
spec:
  replicas: 1
  # Recreate e não RollingUpdate: o PVC é RWO e um segundo pod ficaria preso em
  # Pending esperando um volume que o primeiro não solta.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: brabo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            # As MESMAS credenciais que o backup usa, vindas do mesmo Secret —
            # se divergirem, o job falha na autenticação e o motivo não é óbvio.
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: brabo-secrets
                  key: BACKUP_S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: brabo-secrets
                  key: BACKUP_S3_SECRET_KEY
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # readOnlyRootFilesystem fica FALSO aqui: o MinIO escreve metadados
          # ao lado dos objetos dentro de /data, que é o PVC, mas também usa
          # caminhos próprios fora dele no boot. É componente de teste local;
          # endurecer isso não protege nada que exista em produção.
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: brabo
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
