  /projects/{projectId}/sessions/{sessionId}/chat:
    post:
      description: >-
        Server-Sent Events. Кадры `delta` несут инкрементальный текст, а `done`
        закрывает поток с учётом токенов и стоимости. Кадр `metering_failed`
        означает, что ОТВЕТ ушёл, но стоимость не была учтена, — сбой
        проявляется, а не исчезает. Если бюджет превышен при `policy=block`,
        поток несёт `error` и ни одного `delta`. Этот маршрут НЕ несёт агента:
        он отправляет только текст привязанной модели, без истории и без
        системного промпта. В сессии `consultiva`, где ни один агент не
        активировался, он отклоняется до каких-либо эффектов (RN-682) — вместо
        этого говорите с агентом через `.../agents/:agent/message`.
      operationId: ChatController_chat
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageDto'
      responses:
        '200':
          description: Поток кадров до `done` или `error`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatSseEventResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект или сессия не найдены.
        '422':
          description: >-
            `destinatario_ausente`: сессия `consultiva` без агента — у сообщения
            нет получателя. Ничего не записано, и ни одна модель не вызывалась
            (RN-682).
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Беседует с моделью сессии, с потоковым ответом
      tags:
        - llm
  /projects/{projectId}/sessions/{sessionId}/context-summary:
    get:
      description: >-
        Бизнес-правила, записи решений и артефакты по агентам, подсчитанные по
        ВСЕМУ журналу сессии (экран читает хвост из 200 событий), плюс файлы,
        затронутые `git_commit`/`git_push` в этой сессии и в сессии выполнения,
        которую активировал её одобренный план Dev Lead (RN-828). Начиная с
        RN-844 также возвращает ЭЛЕМЕНТЫ правил и решений (последние 50 каждого;
        итоги остаются в `regras`/`decisoes`) и файлы PR, открытых в этих
        сессиях, прочитанные из того же diff, что читает вкладка PR, не более
        чем для 20 PR за вызов; `prsNaoLidas` говорит, сколько было пропущено
        или завершилось сбоем. Только чтение; новой таблицы нет.
      operationId: SessionsController_contextSummary
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContextSummaryResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект или сессия не существуют.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Подсчитывает всю сессию для панели контекста
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}/events:
    get:
      description: >-
        Журнал НЕИЗМЕНЯЕМ и упорядочен по `seq`. Обычная пагинация
        инкрементальна: передавайте `nextCursor` предыдущего ответа как
        `afterSeq`. `latest=true` делает обратное — получает ХВОСТ и игнорирует
        `afterSeq`, для экрана, который открывается с конца, а не
        восстанавливает всю сессию с начала (ADR 0021).
      operationId: SessionsController_listEvents
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: afterSeq
          required: false
          in: query
          description: Возвращает события с `seq` больше этого.
          schema:
            example: 40
            type: string
        - name: limit
          required: false
          in: query
          schema:
            example: 50
            type: string
        - name: latest
          required: false
          in: query
          description: Получает хвост журнала; игнорирует `afterSeq`.
          schema:
            example: 'true'
            type: string
        - name: actionId
          required: false
          in: query
          description: >-
            Только события, у которых `payload.actionId` — это действие,
            например его `proposed_action.created`, несущий `reason` политики и
            `scopeRoot`, которые строка действия не хранит (RN-614). Сочетается
            с другими параметрами; `seq` на странице больше не непрерывен,
            поэтому вызывающий, фильтрующий по действию, не должен выводить из
            него число пропущенных. Пустое значение — это `400`.
          schema:
            example: 01JC4Z0000ACAO00000000000001
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
