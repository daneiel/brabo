  /workspaces/{workspaceId}/huggingface/pull-requests/{id}/confirm:
    post:
      description: >-
        Переводит `pending_confirmation` → `confirmed` → `pulling`, вызывает
        демон Ollama и при успехе делает upsert модели в каталог (`models`) и
        активирует её для ЭТОГО рабочего пространства. При сбое запрос
        заканчивается в `failed` с причиной, указывающей источник (infra | model
        | code | policy), — никогда не молчаливый сбой. Этот вызов выполняется
        СИНХРОННО в течение всего скачивания (почему — см. сценарий
        использования); используйте маршрут GET ниже для опроса, а не держите
        это соединение открытым.
      operationId: HuggingFaceModelsController_confirm
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPullRequestResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Требует `maintainer` в рабочем пространстве.
        '404':
          description: Запрос на скачивание не найден.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Второе подтверждение — действительно выполняет скачивание
      tags:
        - llm
  /workspaces/{workspaceId}/members:
    get:
      description: >-
        Кто связан с РАБОЧИМ ПРОСТРАНСТВОМ, с ролью рабочего пространства —
        ролью, которую наследует каждый проект, если строка проекта её не
        переопределяет. Дополняет `GET projects/:projectId/members`, который
        перечисляет только строки проекта: тот, кто попадает в проект только
        через рабочее пространство, появляется здесь, а не там. Только id, имя,
        email и роль.
      operationId: WorkspacesController_listMembers
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMemberComUsuarioResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в рабочем пространстве.
        '404':
          description: Рабочее пространство не существует или невидимо для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перечисляет участников рабочего пространства
      tags:
        - workspaces
    post:
      description: >-
        Только `owner` может менять состав участников. Роль здесь наследуют ВСЕ
        проекты рабочего пространства. Эта роль НЕОБХОДИМА, но не ДОСТАТОЧНА:
        изменение СВОЕЙ СОБСТВЕННОЙ роли здесь отклоняется с 403 в обе стороны и
        не может быть нигде включено. Уровня выше, который удержал бы падение,
        нет, поэтому самопонижение было бы невосстановимо через интерфейс.
        Понижение ДРУГОГО `owner` по-прежнему разрешено — это единственный
        способ отозвать владение.
      operationId: WorkspacesController_addMember
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: >-
            Не `owner` рабочего пространства ИЛИ цель — сам вызывающий, и
            запрошенная роль отличается от текущей (потолок самоизменения).
        '404':
          description: Рабочее пространство не существует или невидимо для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Связывает пользователя с рабочим пространством
      tags:
        - workspaces
  /workspaces/{workspaceId}/members/{userId}:
    delete:
      description: >-
        Только `owner`, как и upsert. Удаляет строку рабочего пространства И, в
        той же транзакции, строки пользователя во всех проектах этого рабочего
        пространства (роль проекта переопределяет роль рабочего пространства,
        поэтому их сохранение оставило бы пользователя внутри этих проектов), а
        также ключи устройств ПРОЕКТА и personal access token пользователя в
        них. После этого живое соединение runner этого пользователя в каждом
        проекте разрывается, по мере возможности. Машинные ключи устройств и
        открытые сессии не затрагиваются — они перестают достигать этого
        рабочего пространства, потому что роль разрешается в отсутствие.


        Удаление СЕБЯ отклоняется с 403 и не может быть нигде включено: уровня
        выше, который удержал бы падение, нет. Это же условие защищает
        последнего `owner` — только `owner` может вызвать этот маршрут, и никто
        не удаляет себя, поэтому каждый успешный вызов оставляет как минимум
        вызывающего в роли `owner`. Удаление ДРУГОГО `owner` разрешено — так
        отзывается владение, — кроме ТИТУЛЬНОГО ВЛАДЕЛЬЦА (`createdBy`),
        отклоняемого с 409 `criador_do_workspace`, пока `PUT
        :workspaceId/owner-of-record` не передаст титул другому владельцу: ключ
        LLM, который тратят агенты, и отчёт о расходах принадлежат ему.
        Идемпотентно: у цели без строки рабочего пространства всё равно
        очищаются строки проектов этого рабочего пространства, и она получает
        `204`.
      operationId: WorkspacesController_removeMember
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
        - name: userId
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Связь удалена. Без тела.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: >-
            Не `owner` рабочего пространства ИЛИ цель — сам вызывающий (потолок
            самоудаления).
        '404':
          description: Рабочее пространство не существует или невидимо для вызывающего.
        '409':
          description: >-
            `criador_do_workspace`: цель — титульный владелец; сначала передайте
            титул.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Отвязывает пользователя от рабочего пространства
      tags:
        - workspaces
