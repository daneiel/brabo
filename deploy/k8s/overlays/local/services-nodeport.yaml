# NodePorts fixos, mapeados pelo bootstrap para as MESMAS portas de host que o
# docker-compose.prod.yml usa: 3000 (api), 4000 (engine) e
# 8088 (web).
#
# Isso não é cosmético. Mantendo as portas, o `docker/smoke.sh` e o realm de
# desenvolvimento continuam valendo sem tradução, e o cluster local dispensa
# ingress controller e resolução de DNS — que seria mais um componente na
# memória e uma classe inteira de falha offline (nip.io e afins precisam de
# internet para resolver). Ingress fica nos overlays de staging/prod.
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: engine
spec:
  type: NodePort
  ports:
    - name: http
      port: 4000
      targetPort: http
      nodePort: 30400
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30088