        - payload
    ApproveAlwaysResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z8QK3M7YV2N5T9B0PXHRC
          description: ULID действия.
        projectId:
          type: string
          example: 01JC4Z0000PROJETO0000000001
        sessionId:
          type: string
          example: 01JC4Z8QK3M7YV2N5T9B0PXHRA
        seq:
          type: number
          example: 7
          description: Порядок действия внутри сессии; используется как курсор в списках.
        actionType:
          type: string
          enum:
            - terminal
            - git_commit
            - git_push
            - pr_open
            - spend
            - git_repo_create
            - git_branch_create
            - git_branch_protect
            - write_file
            - open_adr_pr
            - git_merge
            - open_infra_pr
            - instruction_patch
            - parallelize
            - raise_max_parallel
            - propose_execution_plan
            - assess_implementability
            - container_start
            - container_stop
            - container_remove
            - container_start_via_runner
          example: terminal
          description: >-
            Что сделало бы действие. `git_push` и `git_merge` требуют
            `maintainer`.
        payload:
          type: object
          additionalProperties: true
          example:
            command: pnpm test
          description: Параметры действия, свои для каждого `actionType`.
        status:
          type: string
          enum:
            - pending
            - approved
            - denied
            - auto_approved
            - executed
            - failed
          example: pending
          description: >-
            Состояние в конвейере. `auto_approved` намеренно отличается от
            `approved`: журналу нужно различать, что решил человек и что
            разрешила политика.
        resolvedPolicy:
          type: string
          enum:
            - auto_approve
            - require_approval
            - deny
          example: require_approval
          description: >-
            Что решил `permissions.json` для этого действия. `deny` ВСЕГДА
            побеждает `allow` — даже автономия агента его не переопределяет.
        actor:
          description: Кто предложил.
          allOf:
            - $ref: '#/components/schemas/ActorResponseDto'
        decidedBy:
          type: object
          example: null
          nullable: true
          description: Id пользователя, который одобрил или отклонил. Никогда не агент.
        decidedAt:
          type: object
          example: null
          format: date-time
          nullable: true
        rejectionReason:
          type: object
          example: null
          nullable: true
        executionResult:
          type: object
          additionalProperties: true
          nullable: true
          example: null
          description: >-
            Результат выполнения, с формой, своей для каждого `actionType`, —
            вывод и код выхода для терминала, номер и URL PR для git-типов.
            `null`, пока действие не выполнено.
        createdAt:
          type: string
          example: '2026-07-27T14:33:10.900Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-27T14:33:10.900Z'
          format: date-time
        desfecho:
          type: string
          enum:
            - aprovada
            - ja_aprovada
          example: aprovada
          description: >-
            `aprovada`: этот клик одобрил действие. `ja_aprovada`: действие уже
            вышло из `pending` в результате одобрения (предыдущий клик, другой
            человек или политика) — идемпотентный успех, а не ошибка.
            ОТКЛОНЁННОЕ действие по-прежнему даёт 409 `acao_ja_recusada`.
        padraoGravado:
          type: boolean
          example: true
          description: >-
            Записал ли этот клик шаблон (и его событие `permission.granted`).
            `false` означает, что он уже существовал; ничего не записано.
      required:
        - id
        - projectId
        - sessionId
        - seq
        - actionType
        - payload
        - status
        - resolvedPolicy
        - actor
        - decidedBy
        - decidedAt
        - rejectionReason
        - executionResult
        - createdAt
        - updatedAt
        - desfecho
        - padraoGravado
