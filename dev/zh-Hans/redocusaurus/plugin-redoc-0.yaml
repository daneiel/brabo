          description: 引发该 handoff 的制品（product_brief、module_map……）。
        status:
          type: string
          enum:
            - offered
            - accepted
            - completed
            - rejected
            - superseded
          example: offered
          description: >-
            此字段是可变的——它是当前状态。每次状态转换也会在日志中成为一个不可变的 `handoff.*`
            事件，历史就存放在那里。`superseded`（ADR
            0182，RN-635）：该提议不再是当前的——目标代理已通过其他路径被激活，或项目中给同一目标的更新提议取代了它（`handoff.superseded`）。只有
            `offered` 可以被接受。
