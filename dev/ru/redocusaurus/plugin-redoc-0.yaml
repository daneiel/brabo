            - criativa
          example: criativa
          description: >-
            НАМЕРЕНИЕ, с которым открыта сессия, выбранное при создании и
            неизменяемое. `consultiva` (консультационная) — только беседа;
            `criativa` (творческая) производит и единственная входит в
            выполнение. Не путать с состоянием выполнения, которым остаётся
            событие `execution.activated` в журнале.
        name:
          type: object
          example: Cart checkout
          nullable: true
          description: >-
            Понятное имя или `null`. Экраны составляют его с хештегом id; оно
            никогда его не заменяет.
        nextSeq:
          type: number
          example: 42
          description: >-
            Следующий `seq` журнала событий. Служит курсором: `?afterSeq=41`
            получает всё после 41.
        createdAt:
          type: string
          example: '2026-07-27T14:03:22.187Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-27T14:31:09.004Z'
          format: date-time
        closedAt:
          type: object
          example: null
          format: date-time
          nullable: true
          description: Заполняется только в терминальных состояниях.
        terminationReason:
          type: object
          example: null
          nullable: true
          description: >-
            Причина, сообщённая engine при завершении (heartbeat_timeout,
            conversation_idle_timeout, killed, exception…). `null` при закрытии
            человеком или ещё живой сессии.
        traceParent:
          type: object
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          nullable: true
          description: >-
            W3C `traceparent` корневого span. Так вся сессия восстанавливается в
            Tempo.
        technical:
          type: boolean
          example: false
          description: >-
            Является ли это ТЕХНИЧЕСКОЙ сессией, открытой при создании
            репозитория (той, что связана из `repo_bootstraps`), в отличие от
            рабочей сессии. Это связь, а не имя: переименование сессии её не
            меняет. Экраны, выбирающие «самую свежую сессию», пропускают её,
            если она не единственная.
      required:
        - id
        - projectId
        - createdBy
        - status
        - kind
        - name
        - nextSeq
        - createdAt
        - updatedAt
        - closedAt
        - terminationReason
        - traceParent
        - technical
    SessionPendingWorkResponseDto:
      type: object
      properties:
