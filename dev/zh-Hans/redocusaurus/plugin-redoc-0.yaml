  /projects/{projectId}/run-instructions:
    get:
      description: >-
        RN-852（ADR 0213）：当前的 `artifact.run_instructions`，在 `open_infra_pr` 携带
        `run` 执行时发出。由 Infra 代理声明，从未在读者的机器上验证。没有时为 `null`。
