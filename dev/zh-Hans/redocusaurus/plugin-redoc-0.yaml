          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 不是该 workspace 的 `owner`，或者目标是调用方本人且所请求的角色与其当前角色不同（自我变动上限）。
        '404':
          description: workspace 不存在或对调用方不可见。
        '429':
