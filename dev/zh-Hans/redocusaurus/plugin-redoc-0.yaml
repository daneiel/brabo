  /projects/{projectId}/sessions/{sessionId}/model-binding:
    get:
      description: >-
        返回由级联解析得出的 binding，而不是会话的原始 binding：没有自身 binding 的会话使用项目的 binding，在这里回答
        `null` 就是对正确问题的错误回答。`origin` 字段说明该值来自哪个范围。


        `agentId` 是可选的，表示此刻在会话中真正活跃的代理（与 `RunLlmTurnUseCase`
        运行回合时使用的相同）——没有它，级联只能看到 会话→项目→workspace（加上固定回落到 Creative），在 handoff
        之后永远无法反映 PO/Architect/Dev Lead/区域。
