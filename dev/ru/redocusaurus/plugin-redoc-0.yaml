          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HandoffResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, сессия или handoff не найдены.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перечисляет handoff между агентами в сессии
      tags:
        - agents
    post:
      description: >-
        Рождается как `offered`, в точности как собственный `offer_handoff`
        агента, — единственная разница в том, кто решил. `toAgent` должен быть в
        адресуемом каталоге (lead области или агент без области); субагент или
        неизвестный slug отклоняется с 400. Не более одного ожидающего
        предложения на (проект, цель): см. `desfecho` (ADR 0182, RN-635).
      operationId: AgentsController_requestManual
      parameters:
        - name: projectId
