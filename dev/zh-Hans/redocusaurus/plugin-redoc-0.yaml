    CreateProjectDto:
      type: object
      properties:
        name:
          type: string
          example: Checkout
          minLength: 2
        slug:
          type: string
          example: checkout
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: kebab-case。在 workspace 内唯一。
        maxConsecutiveBlocked:
          type: number
          example: 3
          description: >-
            熔断器（Phase 12b——RN-047）：连续多少个任务以阻塞结束会让该模块的 dev agent 停在
            idle_tripped。省略时使用领域默认值（DEFAULT_MAX_CONSECUTIVE_BLOCKED）。从下一次激活执行起生效——不影响已在运行的代理。
        storyPromotion:
          type: string
          enum:
            - manual
            - auto
          example: auto
          description: >-
            谁把 story 从 `draft` 提升为 `ready`（Phase 12c——RN-048）。`auto`（自 RN-659
            起为新项目的默认值）：完整的 story 一出生就是 `ready`，没有人工步骤。`manual`：PO 提议，由你在 Backlog
            标签页中决定。更改默认值并没有改写任何已有项目。领域校验（DoD/DoR/RF/规则/模块）在两种模式下完全相同；模式只改变由谁触发。
        executionMode:
          type: string
          enum:
            - container
            - mounted
            - runner
          example: container
          description: >-
            此项目的命令在哪里执行（RN-169/RN-421——ADR 0072/0104）。`container`（默认）：由产品管理、位于
            PROJECT_WORKSPACES_ROOT 内的文件夹，即通常的行为。`mounted`：你自己的一个文件夹，在
            `workspacePath` 中给出，位于安装范围的基目录 `BRABO_PROJECTS_BASE` 内（ADR
            0141）——创建时只校验路径格式和该基目录，文件夹本身稍后在 Infra 启动容器时创建（RN-501，ADR
            0142）。`runner`：你自己的一个不需要 bind-mount
            的文件夹——创建时只校验路径格式，项目以“未验证”状态诞生；在你的机器上运行 `brabo-runner --project <id>
            --dir <folder>` 来确认它（RN-423）。
        workspacePath:
          type: string
          example: /home/you/projects/store
          description: >-
            文件夹的绝对路径，当 `executionMode` 为 `mounted` 或 `runner` 时必需，为 `container`
            时拒绝。在这两种模式中，现在都只校验格式——绝对路径、不含 `..`、不是系统根目录、不是系统文件夹、不与 Brabo
            检出目录重叠（RN-422/RN-423）。`mounted` 增加一条规则：它必须位于 `BRABO_PROJECTS_BASE`
            内，那是你机器上 Brabo 容器唯一能看到的文件夹（ADR
            0141）——没有配置基目录时，此安装不提供该模式，创建时会说明这一点。磁盘稍后才会被触及：在 `runner` 中由 runner
            触及，在 `mounted` 中在 Infra 启动容器时触及（RN-501，ADR 0142）。
        language:
          type: string
          example: pt-BR
          maxLength: 35
          description: >-
            项目的语言（RN-619）——共享制品和没有人类作者的回合使用它。服务器能识别的任何 BCP-47 代码，以规范形式存储；无法识别的返回
            400。省略时，项目以其创建者的有效回复语言开始（RN-618：账户选择 > 已确认的检测 > 界面语言）。
      required:
        - name
        - slug
