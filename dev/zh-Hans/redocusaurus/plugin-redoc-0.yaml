        - internal
  /internal/sessions/{sessionId}/module-routing:
    post:
      description: >-
        制品就是 `artifact.module_routing` 事件：不可变、带版本、有作者，与
        `artifact.module_map`/`artifact.project_image`/`artifact.c4_diagram`
        并列。每个条目都按与 `choose_project_image` 相同的规则校验（显式 tag/digest，拒绝
        `latest`，`rationale` 不能过于简单）；模块名不在当前 module_map 中、列表为空或模块重复，都会以 400 被拒绝。
      operationId: InternalSessionsController_moduleRouting
      parameters:
        - name: sessionId
