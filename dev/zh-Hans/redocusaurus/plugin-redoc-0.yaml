      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoteamentoDeModulosGeradoResponseDto'
        '400':
          description: >-
            列表为空、模块重复、模块不在当前 module_map 中，或候选镜像不符合 `choose_project_image`
            的规则（没有显式 tag、`latest` 或 `rationale` 过短）。
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
        '404':
          description: 未找到会话、项目或资源。
      security:
        - service-token: []
      summary: 将当前 module_map 的每个模块路由到一个候选镜像
      tags:
        - internal
