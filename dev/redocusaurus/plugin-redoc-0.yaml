  /internal/sessions/{sessionId}/events:
    get:
      description: >-
        Usada para REIDRATAR o histórico de um agente conversacional e para ler
        os artefatos de que o kickoff dele precisa. A rota humana equivalente é
        protegida por RBAC; esta, pelo service token. `latest=true` devolve a
        CAUDA (ainda em `seq` crescente) e ignora `afterSeq`; `types` restringe
        a página a esses tipos de evento. A página tem teto de 200 em qualquer
        caso (ADR 0060).
      operationId: InternalSessionsController_listEvents
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: projectId
          required: true
          in: query
          schema:
            type: string
        - name: afterSeq
          required: false
          in: query
          schema:
            example: 40
            type: string
        - name: limit
          required: false
          in: query
          schema:
            example: 200
            type: string
        - name: latest
          required: false
          in: query
          description: Busca a cauda do log; ignora `afterSeq`.
          schema:
            example: 'true'
            type: string
        - name: types
          required: false
          in: query
          description: >-
            Tipos de evento separados por vírgula (no máximo 20). Só eventos
            desses tipos contam para `limit`.
          schema:
            example: artifact.product_brief,artifact.business_rule
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeEventosResponseDto'
        '400':
          description: Corpo inválido.
        '403':
          description: Service token ausente ou diferente do compartilhado.
        '404':
          description: Sessão, projeto ou recurso não encontrado.
      security:
        - service-token: []
      summary: Pagina o event log da sessão para o engine
      tags:
        - internal
    post:
      description: >-
        Mesmo caso de uso e mesma atribuição atômica de `seq` da rota humana. As
        hipóteses do Psicólogo NÃO passam por aqui: têm rota própria, com
        validação de evidência.
      operationId: InternalSessionsController_appendEvent
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendSessionEventInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEventResponseDto'
        '400':
          description: Corpo inválido.
        '403':
          description: Service token ausente ou diferente do compartilhado.
        '404':
          description: Sessão, projeto ou recurso não encontrado.
      security:
        - service-token: []
      summary: Acrescenta um evento ao log da sessão, em nome de um agente
      tags:
        - internal
  /internal/sessions/{sessionId}/gates/verdict:
    post:
      description: >-
        O `nextAction` da resposta é o que o engine obedece: `correct` volta ao
        dev, `run_secops` avança o gate, `done` libera para o usuário,
        `await_user` estaciona o ciclo até a pergunta aberta ser respondida
        (RN-860, sem contar correção), e `blocked` significa que o teto de
        correções acabou. O MERGE nunca é automático — `done` só quer dizer que
