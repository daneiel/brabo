# CVEs ACEITAS conscientemente nas imagens de produção (Fase 5).
#
# Isto NÃO é uma lista de exceções de conveniência. Toda entrada aqui obedece a
# três condições, e quem adicionar uma nova precisa satisfazer as três:
#
#   1. Está em um BINÁRIO DE TERCEIRO que nós apenas baixamos, não compilamos —
#      logo não há como aplicar o patch sem um release novo do projeto upstream.
#   2. Já estamos no ÚLTIMO release publicado desse projeto (verificado).
#   3. Tem `expired_at`. Passada a data, o trivy volta a reportar e o CI fica
#      vermelho de novo — a dívida reaparece sozinha em vez de apodrecer aqui.
#
# Tudo que é corrigível JÁ FOI CORRIGIDO e não aparece nesta lista:
#   - `apk upgrade` nas três imagens zerou os CVEs de pacote de sistema;
#   - remover o npm empacotado da imagem da api zerou os 24 achados de Node.js
#     (nenhum vinha das nossas dependências, todos do npm da imagem base);
#   - o pin do gitleaks subiu de 8.21.2 para 8.30.1 (Go 1.23.2 -> 1.24.11).
#
# As imagens da api e do web estão com ZERO achados HIGH/CRITICAL corrigíveis;
# nenhuma entrada abaixo se aplica a elas.
#
# Revisão: ao subir o pin do gitleaks ou do semgrep, rode
#   trivy image --severity HIGH,CRITICAL --ignore-unfixed brabo-engine:prod
# e REMOVA daqui o que tiver sido resolvido.

