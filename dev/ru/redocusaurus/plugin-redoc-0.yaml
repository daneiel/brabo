      tags:
        - sessions
    post:
      description: >-
        Только добавление: `seq` присваивается сервером, и ничто в журнале потом
        не обновляется и не удаляется. Endpoint для редактирования нет, по
        замыслу.
      operationId: SessionsController_appendEvent
      parameters:
