      security:
        - service-token: []
      summary: Контракты между модулями, для чтения dev agent (RN-684)
      tags:
        - internal
  /internal/projects/{projectId}/product-metrics:
    get:
      description: >-
        ТОТ ЖЕ отчёт, что и скрипт `analise:funil` (ADR 0089), — воронка сессия
