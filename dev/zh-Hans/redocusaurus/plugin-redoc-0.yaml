    ResolvedBindingResponseDto:
      type: object
      properties:
        modelId:
          type: string
          example: 01JC4Z0000MODELO00000000001
        origin:
          type: string
          enum:
            - workspace
            - project
            - area
            - agent
            - session
          example: project
          description: >-
            该值来自哪个范围。级联顺序为 会话 → 代理 → 项目 →
            workspace，暴露来源正是让界面可以说“继承自项目”，而不是显示一个来历不明的值。
        routingPreference:
          type: string
          enum:
            - price
            - throughput
            - latency
          nullable: true
          example: null
          description: >-
            在级联中胜出的那个 binding 的路由偏好（ADR
            0166）。它从不独立级联：被跳过的层级会带走它的偏好，没有任何层级只继承另一层级的偏好。
        skipped:
          description: 级联在到达 `origin` 之前丢弃的更具体的范围。在正常路径上为空。
          type: array
          items:
            $ref: '#/components/schemas/SkippedBindingResponseDto'
        herdadoDoLead:
          type: string
          example: secops
          description: >-
            当所询问的代理没有自己的模型（其区域或项目也没有）并继承了其区域 lead 已解析的 binding 时出现（RN-703）。此时
            `origin` 是 lead binding 的来源。
      required:
        - modelId
        - origin
        - routingPreference
        - skipped
    ResultadoPorProviderResponseDto:
      type: object
      properties:
        provider:
          type: string
          enum:
            - ollama
            - anthropic
            - openai
            - openrouter
            - nvidia-nim
            - together
            - deepinfra
            - bitdeer
            - vultr
            - 9router
            - opencode-zen
          example: openai
        descobertos:
          type: number
          example: 3
          description: 数据库中原本不存在的模型。它们以未激活状态进入——激活是所有者的策展（RN-043）。
        reencontrados:
          type: number
          example: 1
          description: 曾为 `unavailable` 又回到目录中的模型。它们的 `isActive` 保持不变：所有者的选择在缺席期间得以保留。
        indisponibilizados:
          type: number
          example: 0
          description: 从远程目录中消失的模型。它们变为 `unavailable`，且绝不删除——binding 和成本历史都指向它们。
        pulado:
          type: string
          enum:
            - sem_capability
            - sem_credencial
            - falha
          description: 当提供商没有被同步时出现。被跳过的提供商不会把任何东西标记为不可用：“我不知道那里有什么”不等于“那里什么都没有”。
        origemDaFalha:
          type: string
          enum:
            - infra
            - modelo
          description: >-
            仅配合 `pulado: "falha"`。来源词汇来自 ADR 0020——从未连通提供商时为 `infra`，提供商响应但拒绝时为
            `modelo`。
        detalhe:
          type: string
          example: openai responded with status 401
      required:
        - provider
        - descobertos
        - reencontrados
        - indisponibilizados
    ReturnStoryDto:
      type: object
      properties:
        reason:
          type: string
          example: The acceptance criteria don't cover the payment refusal case.
