  /projects/{projectId}/sessions/{sessionId}/actions:
    get:
      description: >-
        按 `seq` 排序；将 `nextCursor` 用作 `afterSeq`。`latest=true` 改为获取尾部（最新的 `limit`
        个操作，仍为升序）并忽略 `afterSeq`。`status=pending` 只保留等待决定的操作——配合 `latest`
        时是最新的待处理操作，这样拥有 200 个以上操作的会话不会把新的待处理操作挤出窗口（RN-637）。
      operationId: ActionsController_list
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: afterSeq
          required: false
          in: query
          schema:
            example: 6
            type: string
        - name: limit
          required: false
          in: query
          schema:
            example: 50
            type: string
        - name: latest
          required: false
          in: query
          description: 获取会话尾部；忽略 `afterSeq`。
          schema:
            example: 'true'
            type: string
        - name: status
          required: false
          in: query
          description: 只支持 `pending`。
          schema:
            example: pending
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeAcoesResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 未找到项目、会话或操作。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 分页读取会话中提议的操作
      tags:
        - actions
    post:
      description: >-
        操作在创建时依据项目的 `permissions.json` 进行评估。响应中的 `resolvedPolicy`
        说明策略的决定：`auto_approve` 出来时即可执行，`require_approval` 等待人工决定，`deny`
        一出生即被拒绝。不存在不经过这里就执行的路径。
      operationId: ActionsController_propose
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeActionDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposedActionResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 未找到项目、会话或操作。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 提议一个具有外部效果的操作
      tags:
        - actions
  /projects/{projectId}/sessions/{sessionId}/actions/{actionId}/approve:
    post:
      description: 只适用于此操作。决定连同决定者的 id 一起保存在事件日志中。
      operationId: ActionsController_approve
      parameters:
        - name: projectId
