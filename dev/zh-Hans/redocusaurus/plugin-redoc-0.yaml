            - zh-Hans
          example: pt-BR
        detectionQuestion:
          type: string
          nullable: true
          example: es
          description: >-
            你最近的消息所指向的语言，当界面应当询问是否用它来回答时（RN-624）——`null` 表示没有问题。检测本身从不改变偏好：只有回答
            `confirm`（在 `POST /users/me/preferences/detected-language`
            上）才会。当有效语言来自明确选择（此会话或账户）、已经是检测到的语言，或你之前拒绝过这种语言时，绝不询问。尽力而为：检测失败为
