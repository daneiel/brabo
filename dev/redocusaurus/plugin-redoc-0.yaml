        reencontrados:
          type: number
          example: 1
          description: >-
            Modelos que estavam `unavailable` e voltaram ao catálogo. O
            `isActive` deles fica intocado: a escolha do owner sobrevive à
            ausência.
        indisponibilizados:
          type: number
          example: 0
          description: >-
            Modelos que sumiram do catálogo remoto. Viram `unavailable` e NUNCA
