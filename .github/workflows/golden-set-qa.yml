name: Golden-set do QA (medição AT-076, temporário)

# TEMPORÁRIO — mede o golden-set do QA com o container de verdade (AT-076).
# Sai antes do PR; o desenho medido fica no histórico. NÃO é o agendado da
# AT-149 (que espera a cadência do dono).
#
# Molde: `golden-set-rag.yml` + o desenho da AT-067 (e7d7d1b16), com o que a
# AT-076 acrescenta: o BROKER de pé (nativo no runner, o único processo que
# fala com o Docker), a mesma pasta gerenciada nos três lados
# (`PROJECT_WORKSPACES_ROOT` na api e no engine = `PROJECT_WORKSPACES_HOST_ROOT`
# no broker — api e engine rodam no host, então "dentro" e "no host" são o
# mesmo caminho) e a imagem do golden-set puxada antes (a chamada api→broker
# tem teto de 5s).
on:
  push:
    branches: [bugfix/golden-set-qa-sob-rn-502]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24.11.1'
  PNPM_VERSION: '11.3.0'
  ELIXIR_VERSION: '1.17.3'
  OTP_VERSION: '27.1.2'

jobs:
  golden-set-qa:
    name: Golden-set do QA (ExUnit, contra Ollama real, container pelo broker)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b  # pg16
        env:
          POSTGRES_USER: brabo
          POSTGRES_PASSWORD: brabo
          POSTGRES_DB: brabo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brabo -d brabo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      ollama:
        image: ollama/ollama@sha256:075246f72d4109385b4a01c3ac8e9cbd26a0bcb21cd7aa30edbccd24e1b3180c  # 0.33.1
        ports:
          - 11434:11434
        env:
          OLLAMA_KEEP_ALIVE: 1h
          OLLAMA_CONTEXT_LENGTH: '16384'
        options: >-
          --health-cmd "ollama list || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 15s
    env:
      DATABASE_URL: postgres://brabo:brabo@localhost:5432/brabo
      OLLAMA_HOST: http://localhost:11434
      GOLDEN_SET_QA_MODEL: 'qwen2.5-coder:latest'
      API_URL: http://localhost:3000
      BRABO_SERVICE_TOKEN: golden-set-qa-ci-token-nao-e-segredo
      PROJECT_WORKSPACES_ROOT: /tmp/brabo-project-workspaces
      BROKER_URL: http://localhost:8090
      IMAGEM: node:24.11.1-bookworm-slim@sha256:48abc13a19400ca3985071e287bd405a1d99306770eb81d61202fb6b65cf0b57
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            apps/engine/deps
            apps/engine/_build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('apps/engine/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: pnpm install --frozen-lockfile

      - name: Puxar qwen2.5-coder:latest no Ollama do job
        run: |
          set -euo pipefail
          inicio=$(date +%s)
          curl -fsS --max-time 1200 -X POST http://localhost:11434/api/pull \
            -d '{"name":"qwen2.5-coder:latest","stream":false}'
          echo
          curl -fsS http://localhost:11434/api/tags | grep -q 'qwen2.5-coder:latest' \
            || { echo "::error::qwen2.5-coder:latest não apareceu em /api/tags depois do pull"; exit 1; }
          echo "TEMPO pull do modelo: $(( $(date +%s) - inicio ))s"

      - name: Puxar a imagem do container do golden-set
        run: |
          set -euo pipefail
          inicio=$(date +%s)
          docker pull "$IMAGEM"
          echo "TEMPO pull da imagem: $(( $(date +%s) - inicio ))s"
          mkdir -p "$PROJECT_WORKSPACES_ROOT"

      - name: Migrations da api
        run: pnpm --filter api db:migrate

      - name: Build da api
        run: pnpm --filter api build

      - name: Subir a api e esperar o /health
        working-directory: apps/api
        run: |
          set -euo pipefail
          node dist/main.js > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              echo "api de pé"; exit 0
            fi
            sleep 2
          done
          echo "::error::a api não respondeu em /health depois de 120s"
          tail -50 /tmp/api.log
          exit 1

      - name: Subir o broker (nativo, com o Docker do runner) e esperar o /health
        working-directory: apps/broker
        env:
          PROJECT_WORKSPACES_HOST_ROOT: /tmp/brabo-project-workspaces
          BROKER_PORT: '8090'
        run: |
          set -euo pipefail
          node src/index.ts > /tmp/broker.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8090/health >/dev/null 2>&1; then
              echo "broker de pé"; cat /tmp/broker.log; exit 0
            fi
            sleep 1
          done
          echo "::error::o broker não respondeu em /health"
          cat /tmp/broker.log
          exit 1

      - name: mix deps.get
        working-directory: apps/engine
        run: mix deps.get

      - name: Compilar com --warnings-as-errors
        working-directory: apps/engine
        run: mix compile --warnings-as-errors

      - name: Subir o engine (servidor) e esperar o /health
        working-directory: apps/engine
        run: |
          set -euo pipefail
          mix ecto.migrate
          mix phx.server > /tmp/engine.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:4000/health >/dev/null 2>&1; then
              echo "engine de pé"; exit 0
            fi
            sleep 2
          done
          echo "::error::o engine não respondeu em /health depois de 180s"
          tail -50 /tmp/engine.log
          exit 1

      - name: mix golden_set.qa
        working-directory: apps/engine
        run: |
          set -o pipefail
          inicio=$(date +%s)
          mix golden_set.qa 2>&1 | tee /tmp/golden-qa.log
          status=$?
          echo "TEMPO mix golden_set.qa: $(( $(date +%s) - inicio ))s"
          exit $status

      - name: O golden-set precisa ter RODADO, não pulado
        if: always()
        run: |
          set -euo pipefail
          if ! grep -qE '[0-9]+/[0-9]+ casos bateram o veredito esperado' /tmp/golden-qa.log; then
            echo "::error::o golden-set NÃO mediu:"
            grep -E 'NÃO mediu|seed do golden-set|ContainerDoGoldenSet' /tmp/golden-qa.log || true
            exit 1
          fi
          grep -E '✓|✗|casos bateram|container .* running' /tmp/golden-qa.log

      - name: Critério 1 — nenhuma recusa da RN-502 no event log
        if: always()
        run: |
          set -euo pipefail
          n=$(psql "$DATABASE_URL" -tAc "select count(*) from proposed_actions where action_type = 'terminal' and execution_result::text like '%RN-502%'")
          echo "terminal recusados pela RN-502: $n"
          e=$(psql "$DATABASE_URL" -tAc "select count(*) from session_events where payload::text like '%RN-502%'")
          echo "eventos de sessão citando RN-502: $e"
          [ "$n" = "0" ] && [ "$e" = "0" ] || { echo "::error::houve recusa da RN-502"; exit 1; }

      - name: Critério 2 — npm test executado DENTRO do container
        if: always()
        run: |
          psql "$DATABASE_URL" -c "select p.name as caso, pa.status, left(pa.payload->>'command', 40) as cmd, pa.payload->>'cwd' as cwd, pa.execution_result->>'exitCode' as exit, left(replace(coalesce(pa.execution_result->>'stdout','') || coalesce(pa.execution_result->>'stderr',''), E'\n', ' | '), 200) as saida from proposed_actions pa join projects p on p.id = pa.project_id where pa.action_type = 'terminal' order by p.name, pa.seq;"

      - name: Tempos da subida do container (proposta → executada)
        if: always()
        run: |
          psql "$DATABASE_URL" -c "select p.name as caso, pa.status, pa.execution_result->>'containerId' as container, round(extract(epoch from (pa.updated_at - pa.created_at))::numeric, 2) as segundos, left(pa.execution_result->>'motivo', 120) as motivo from proposed_actions pa join projects p on p.id = pa.project_id where pa.action_type = 'container_start' order by p.name;"
          psql "$DATABASE_URL" -c "select p.name as caso, pc.status, pc.image_version, pc.container_id from project_containers pc join projects p on p.id = pc.project_id order by p.name;" || true
          docker ps -a --filter label=brabo.managed=true --format '{{.Names}} {{.Image}} {{.Status}}'

      - name: Logs da api, do broker e do engine
        if: always()
        run: |
          echo "--- broker ---"; tail -100 /tmp/broker.log || true
          echo "--- api ---"; grep -E 'ERROR|WARN|broker|container' /tmp/api.log | grep -v Neo4j | tail -100 || true
          echo "--- engine ---"; grep -iE 'error|recus|actions/execute|container' /tmp/engine.log | grep -v SELECT | tail -100 || true
