components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
    service-token:
      type: apiKey
      in: header
      name: X-Brabo-Service-Token
  schemas:
    AcceptParallelizationDto:
      type: object
      properties:
        module:
          type: string
          example: api
          description: >-
            Имя модуля, как оно указано в `module_map`. Запускает выделенного
            ему dev agent в изолированном worktree.
      required:
        - module
    AceiteAutomaticoResponseDto:
      type: object
      properties:
        aceito:
          type: boolean
          example: true
        criterio:
          $ref: '#/components/schemas/CriterioDoAceiteResponseDto'
        motivo:
          type: string
          enum:
            - nao_e_po_para_arquiteto
            - oferta_nao_pendente
            - sem_regras_de_negocio
            - regras_sem_historia
            - repositorio_nao_local
            - credencial_de_git_no_projeto
            - autor_sem_papel
            - falhou
          example: regras_sem_historia
          description: >-
            Почему человеку всё ещё нужно кликнуть. `falhou`: система
            попыталась, и принятие не удалось — `handoff.auto_accept_failed`
            есть в журнале событий.
      required:
        - aceito
    AceiteResponseDto:
      type: object
      properties:
        message:
          type: string
          example: If the address is available, we've sent an email.
          description: >-
            Общее сообщение, одинаковое для известного и неизвестного адреса, —
            см. примечание о переборе в справочнике.
      required:
        - message
    ActivateExecutionDto:
      type: object
      properties:
        taskBudgetMicros:
          type: number
          example: 500000
          description: >-
            Бюджет на задачу в микро-USD. Если опущен, используется значение
            домена по умолчанию (DEFAULT_TASK_BUDGET_MICROS).
        maxGateCorrections:
          type: number
          example: 3
          description: >-
            Сколько циклов dev↔gate, прежде чем задача станет `blocked`. Именно
            это не даёт агенту тратить бюджет в цикле исправлений.
        devAgentImpl:
          type: string
          enum:
            - real
            - noop
          example: real
          description: >-
            `noop` запускает dev agent БЕЗ LLM, чтобы проверить инфраструктуру
            выполнения от начала до конца, не тратя токены. Если опущено,
            используется `real`.
        terminalAllowPatterns:
          example:
            - Terminal(pnpm test:*)
            - Terminal(pnpm lint)
          description: >-
            Шаблоны, разрешённые в `permissions.json`, чтобы dev agent запускали
            набор тестов. `deny` всё равно побеждает всё перечисленное здесь.
          type: array
          items:
            type: string
        originSessionId:
          type: string
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          description: >-
            Id сессии ЧАТА, из которой пришёл клик «активировать выполнение», —
            творческой/консультационной сессии Dev Lead/PO, никогда не сессии
            выполнения. Если опущен (устаревший вызывающий, например активация
            из Обзора без контекста сессии), никакая сессия не закрывается, как
            и раньше. Если указан, она закрывается в конце — но только если у
            неё нет ожидающего handoff/действия/хода (RN-135), и никогда, если
            это сама сессия выполнения.
