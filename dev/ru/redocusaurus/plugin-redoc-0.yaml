        `auto_approved` без вопросов. Шаблон, уже находящийся в `deny`, остаётся
        заблокированным. Одобрение и шаблон записываются в одной транзакции.
        Клик по действию, которое уже было ОДОБРЕНО, — идемпотентный успех
