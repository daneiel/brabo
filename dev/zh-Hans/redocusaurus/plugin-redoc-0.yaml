              $ref: '#/components/schemas/CreateStoryInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedStoryResponseDto'
        '400':
          description: 请求体无效。
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
        '404':
          description: 未找到会话、项目或资源。
