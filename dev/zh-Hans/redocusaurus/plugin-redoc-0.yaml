      tags:
        - psychologist
  /projects/{projectId}/rag/coverage:
    get:
      description: >-
        真实计数（从不估算）：`.md` 文件（位于项目仓库的 `docs`/`docs/adr`
        下）与其中有分块的数量对比，项目的会话数与其中有分块的数量对比。这三个范围不包含“N 分钟前”——没有按范围的索引时间戳列，猜测的数字会说谎（与
        ADR 0042 对模型评级的规则相同）。`local`（RN-455）是唯一的例外：`lastAttachedAt` 是该范围上真实的
        `MAX(created_at)`，因为浏览器上传没有可供比较的仓库状态。
      operationId: RagController_obterCobertura
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagCoverageResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 项目不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 索引覆盖率：已索引的文件/会话与真实总数对比
      tags:
        - rag
  /projects/{projectId}/rag/feedback:
    post:
      description: >-
        RAG 测量唯一的真实性信号：延迟和降级率说明搜索是否运行了，却从不说明它是否正确。角色与 `search`
        相同——能读取结果的人就能评判它。对同一搜索的同一分块重新投票会覆盖你自己的投票，而不是新增一票（每个参与者唯一），因此该指标衡量的是准确性而不是热情。
      operationId: RagController_votar
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagFeedbackRequestDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagFeedbackResponseDto'
        '400':
          description: 此项目未知的 `searchId`，或 `chunkId` 不在该次搜索的命中结果中——没有排名的投票将是一个没有意义的数字。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 项目不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 将某次搜索的一个命中评判为有用或无关（RN-480）
      tags:
        - rag
  /projects/{projectId}/rag/local:
    post:
      description: >-
        浏览器已读取的文本内容（`<input webkitdirectory>`），绝不是宿主机路径——这一区别正是 ADR 0113
        的全部要点。`local`
        范围的幂等完全重建：每次调用都会删除并根据本次发送的文件重新创建，因此重新上传就是重新同步的机制。超过文件数/总字节数上限时拒绝（400），而不是悄悄截断——这是用户在文件夹选择器前的一次性操作，不是后台扫描。单个过大或扩展名无法识别的文件只会被跳过，绝不会让整批失败。
      operationId: RagController_anexarPastaLocal
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachLocalFolderRequestDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachLocalFolderResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 项目不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 附加一个本地文件夹（浏览器上传）作为只读参考（RN-455，ADR 0113）
      tags:
        - rag
  /projects/{projectId}/rag/reindex:
    post:
      description: >-
        来自 Chat RAG
        面板的“立即重建索引”。根据当前状态删除并重建三个可信范围（RN-219）的分块——推送/会话关闭时没有自动监视器（决定记录在 ADR
        0079/0080 中）。在会话很多的项目上可能需要一段时间：它对每个会话运行一次索引，每次都可能批量调用嵌入提供商。
      operationId: RagController_reindexar
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
