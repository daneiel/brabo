      parameters:
        - name: modelId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelPriceChangeResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no workspace.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Histórico das mudanças de preço de um modelo
      tags:
        - llm
  /workspaces/{workspaceId}/models/{modelId}/pricing:
