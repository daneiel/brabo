# Loki em modo SingleBinary — backend de logs.
#
# Existe por um motivo específico: tornar a correlação trace<->log clicável no
# Grafana. Com o `trace_id` nas linhas de log JSON das três apps, o datasource
# do Loki extrai o campo (derivedFields) e liga ao Tempo, e o Tempo liga de
# volta (tracesToLogsV2). Sem Loki, o item 6 continuaria entregue (os logs são
# JSON com trace_id) mas a correlação seria copiar e colar id à mão.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  # `structuredMetadata` é o que permite guardar trace_id como metadado
  # indexado sem explodir a cardinalidade dos labels — label por trace_id
  # seria o erro clássico que derruba o Loki.
  limits_config:
    allow_structured_metadata: true
    retention_period: 24h
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  # Persistência LIGADA mesmo sendo ambiente descartável: com
  # `storage.type: filesystem` o Loki precisa de `/var/loki` gravável, e o
  # rootfs do container é read-only. Desligar a persistência não substitui esse
  # diretório por um emptyDir — o pod entra em CrashLoopBackOff com
  # `mkdir /var/loki: read-only file system`. Um PVC de 2Gi no provisionador
  # local resolve e ainda sobrevive a restart do pod.
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Tudo o que o modo distribuído sobe e que aqui só consumiria memória.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
gateway:
  enabled: false
