    GateVerdictResponseDto:
      type: object
      properties:
        nextAction:
          type: string
          enum:
            - correct
            - run_secops
            - done
            - blocked
            - await_user
          example: run_secops
          description: >-
            O que acontece a seguir. `correct` volta ao dev; `run_secops` avança
            o gate; `done` libera para o usuário; `await_user` estaciona o ciclo
            até a pergunta aberta ser respondida (RN-860); `blocked` quer dizer
            que o teto de correções acabou e só um humano pode desbloquear.
        task:
          $ref: '#/components/schemas/TaskResponseDto'
        openQuestionId:
          type: string
          format: uuid
          description: 'Com `await_user`: a pergunta aberta pela qual o ciclo espera.'
      required:
        - nextAction
        - task
    GitAuthorizeUrlResponseDto:
      type: object
      properties:
        authorizeUrl:
          type: string
          example: >-
            https://github.com/login/oauth/authorize?client_id=…&state=…&redirect_uri=…
          description: >-
            Para onde mandar o navegador. O `state` é assinado por HMAC com
            `GIT_OAUTH_STATE_SECRET` — é isso que impede o callback de ser
            forjado.
      required:
        - authorizeUrl
    HandoffResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z0000HANDOFF00000000001
        sessionId:
          type: string
          example: 01JC4Z8QK3M7YV2N5T9B0PXHRA
        projectId:
          type: string
          example: 01JC4Z0000PROJETO0000000001
        fromAgent:
          type: string
          example: criativo
          description: Slug do agente que passou o bastão.
        toAgent:
          type: string
          example: po
          description: Slug do agente que recebe.
        artifactId:
          type: object
          example: 01JC4Z0000ARTEFATO000000001
          nullable: true
          description: Artefato que motivou o handoff (product_brief, module_map…).
        status:
          type: string
          enum:
            - offered
            - accepted
            - completed
            - rejected
            - superseded
          example: offered
          description: >-
            Este campo é MUTÁVEL — é o estado corrente. Cada transição também
            vira um evento `handoff.*` imutável no log, que é onde o histórico
            mora. `superseded` (ADR 0182, RN-635): a oferta deixou de ser a
            corrente — o agente alvo foi ativado por outro caminho, ou uma
            oferta mais nova ao mesmo alvo no projeto a substituiu
            (`handoff.superseded`). Só `offered` pode ser aceita.
        createdAt:
          type: string
          example: '2026-07-24T10:00:00.000Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-24T10:05:00.000Z'
          format: date-time
      required:
        - id
        - sessionId
        - projectId
        - fromAgent
        - toAgent
        - artifactId
        - status
        - createdAt
        - updatedAt
    HealthStatusResponseDto:
      type: object
