    MachineDeviceKeyInternalResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 01JC4Z0000CHAVE000000000001
          description: >-
            O id do registro. Grave-o na JWK PRIVADA como `kid` antes de salvar
            o arquivo (RN-475): é o único vínculo entre a chave em disco e a
            metade pública no servidor, e todo passo seguinte só o repassa.
        userId:
          type: string
          format: uuid
          example: 01JC4Z0000USUARIO0000000001
          description: >-
            O dono que a api RESOLVEU — o único usuário da instalação. Quem
            chama não o escolhe e não o manda; este campo está aqui para o
            instalador conferi-lo contra a conta que acabou de criar em vez de
            supor.
        name:
          type: string
          example: servidor-de-casa
        createdAt:
          type: string
          example: '2026-09-12T12:00:00.000Z'
          format: date-time
        replacedKeyIds:
          example: []
          description: >-
            Ids das chaves de MÁQUINA que esta SUBSTITUIU — revogadas na mesma
            transação. Vazio é o caso normal (instalação nova). Não vazio quer
            dizer que um agente local ainda segurando uma delas para de receber
            tickets, e o instalador deveria dizer isso em vez de deixar ser
            descoberto. Chaves de projeto (ADR 0118) nunca são tocadas.
          type: array
          items:
            type: string
      required:
        - id
        - userId
        - name
        - createdAt
        - replacedKeyIds
