          maxLength: 35
          description: >-
            代理仅在此会话中回答你所使用的语言（RN-618）——其他参与者绝不受影响。服务器能识别的任何 BCP-47 代码，以规范形式存储。发送
            `null`（或 `automatico`）——该键是必需的——以恢复为从你的账户继承。
