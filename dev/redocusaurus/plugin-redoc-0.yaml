    ApproveAlwaysResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z8QK3M7YV2N5T9B0PXHRC
          description: ULID da ação.
        projectId:
          type: string
          example: 01JC4Z0000PROJETO0000000001
        sessionId:
          type: string
          example: 01JC4Z8QK3M7YV2N5T9B0PXHRA
        seq:
          type: number
          example: 7
          description: Ordem da ação dentro da sessão; usada como cursor nas listagens.
        actionType:
          type: string
          enum:
            - terminal
            - git_commit
            - git_push
            - pr_open
            - spend
            - git_repo_create
            - git_branch_create
            - git_branch_protect
            - write_file
            - open_adr_pr
            - git_merge
            - open_infra_pr
            - instruction_patch
            - parallelize
            - raise_max_parallel
            - propose_execution_plan
            - assess_implementability
            - container_start
            - container_stop
            - container_remove
            - container_start_via_runner
          example: terminal
          description: O que a ação faria. `git_push` e `git_merge` exigem `maintainer`.
        payload:
          type: object
          additionalProperties: true
          example:
            command: pnpm test
          description: Parâmetros da ação, específicos do `actionType`.
        status:
          type: string
          enum:
            - pending
            - approved
            - denied
            - auto_approved
            - executed
            - failed
          example: pending
          description: >-
            Estado no pipeline. `auto_approved` é distinto de `approved` de
            propósito: o log precisa distinguir o que uma pessoa decidiu do que
            a política liberou.
        resolvedPolicy:
          type: string
          enum:
            - auto_approve
            - require_approval
            - deny
          example: require_approval
          description: >-
            O que o `permissions.json` decidiu para esta ação. `deny` SEMPRE
            vence `allow` — nem a autonomia do agente o sobrepõe.
        actor:
          description: Quem propôs.
          allOf:
            - $ref: '#/components/schemas/ActorResponseDto'
        decidedBy:
          type: object
          example: null
          nullable: true
          description: Id do usuário que aprovou ou recusou. Nunca um agente.
        decidedAt:
          type: object
          example: null
          format: date-time
          nullable: true
        rejectionReason:
          type: object
          example: null
          nullable: true
        executionResult:
          type: object
          additionalProperties: true
          nullable: true
          example: null
          description: >-
            Resultado da execução, com forma específica de cada `actionType` —
            saída e código de saída para terminal, número e URL da PR para os
            tipos de git. `null` enquanto a ação não foi executada.
        createdAt:
          type: string
          example: '2026-07-27T14:33:10.900Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-27T14:33:10.900Z'
          format: date-time
        desfecho:
          type: string
          enum:
            - aprovada
            - ja_aprovada
          example: aprovada
          description: >-
            `aprovada`: este clique aprovou a ação. `ja_aprovada`: a ação já
            tinha saído de `pending` por uma aprovação (um clique anterior,
            outra pessoa ou a política) — sucesso idempotente, não erro. Ação
            RECUSADA continua sendo 409 `acao_ja_recusada`.
        padraoGravado:
          type: boolean
          example: true
          description: >-
            Se este clique gravou o padrão (e o evento `permission.granted`
            dele). `false` quer dizer que já existia; nada foi gravado.
      required:
        - id
        - projectId
        - sessionId
        - seq
        - actionType
        - payload
        - status
        - resolvedPolicy
        - actor
        - decidedBy
        - decidedAt
        - rejectionReason
        - executionResult
        - createdAt
        - updatedAt
        - desfecho
        - padraoGravado
