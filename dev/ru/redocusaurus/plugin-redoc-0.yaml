            - name: api
              stack: NestJS
              responsibility: Rules and HTTP
              dependsOn:
                - db
              resources:
                cpus: 1
                memoryMb: 1024
                pidsLimit: 256
          description: >-
            Граф модулей. ЦИКЛ приводит к отклонению карты с 400 — проверка на
            уровне домена. Каждый модуль может объявить `resources` (cpus,
            memoryMb, pidsLimit — все три или ни одного); частичное объявление,
