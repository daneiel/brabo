  /projects/{projectId}/sessions/{sessionId}/execution/parallelize:
    post:
      description: >-
        Passa pelo TETO da área de dev (RN-083): abaixo dele, o agente sobe na
        hora, no próprio worktree; acima, a resposta é uma `proposed_action` do
        tipo `parallelize` aguardando a sua decisão, e NADA sobe até você
        decidir. O valor do teto é configurável por lead em Configurações.
      operationId: ExecutionController_parallelize
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptParallelizationDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoDeParalelismoResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou tarefa não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Pede mais um dev agent para um módulo
      tags:
        - execution
  /projects/{projectId}/sessions/{sessionId}/handoffs:
    get:
      operationId: AgentsController_handoffs
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HandoffResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou handoff não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista os handoffs entre agentes da sessão
      tags:
        - agents
    post:
      description: >-
        Nasce `offered`, exatamente como o `offer_handoff` de um agente — a
        única diferença é quem decidiu. `toAgent` tem de estar no catálogo
        endereçável (lead de área ou agente sem área); subagente ou slug
        desconhecido é recusado com 400. No máximo uma oferta pendente por
        (projeto, alvo): ver `desfecho` (ADR 0182, RN-635).
      operationId: AgentsController_requestManual
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestManualHandoffDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaDeHandoffResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou handoff não encontrado.
        '409':
          description: >-
            `agente_ja_ativo` (ADR 0182, RN-635): o alvo já está ativo numa
            sessão não encerrada do projeto — nenhuma oferta é criada.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Oferece manualmente um handoff a um agente escolhido
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/handoffs/{handoffId}/accept:
    post:
      description: >-
        Uma coisa só: transicionar para `accepted` E iniciar o agente de
        destino. É o caminho normal de ativação de todo agente que não é o
        Criativo.
      operationId: AgentsController_accept
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: handoffId
