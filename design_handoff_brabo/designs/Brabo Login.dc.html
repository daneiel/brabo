<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --surface-0:#061B24; --surface-1:#0A2E3D; --surface-2:#123F4E;
    --text-primary:#F5EDE0; --text-secondary:#AEC6CE; --text-muted:#6E8A94;
    --accent:#D6633A; --accent-hover:#E37B4E; --on-accent:#F7EEE2;
    --success:#37B3A4; --warning:#E0982F; --danger:#E05A3E;
    --border:#1C4A5A; --border-strong:#2E6072; --code-bg:#03141B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Archivo',sans-serif;background:var(--surface-0);color:var(--text-primary);-webkit-font-smoothing:antialiased;line-height:1.5;}
  a{color:var(--accent);text-decoration:none;}
  a:hover{color:var(--accent-hover);}
  ::selection{background:var(--accent);color:var(--on-accent);}
  input{font-family:inherit;}
  input:focus{outline:none;border-color:var(--border-strong) !important;box-shadow:0 0 0 3px rgba(214,99,58,.18);}
  input::placeholder{color:var(--text-muted);}
  @keyframes bpulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(.65);}}
  @keyframes bspin{to{transform:rotate(360deg);}}
  @keyframes bfade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
</style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--surface-0);position:relative;overflow:hidden;">

  <div style="position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:64px 64px;opacity:.22;"></div>
  <div style="position:absolute;top:-160px;left:50%;transform:translateX(-50%);width:900px;height:520px;border-radius:50%;background:radial-gradient(closest-side,rgba(55,179,164,.14),transparent);pointer-events:none;"></div>

  <div style="position:relative;width:100%;max-width:412px;animation:bfade .4s ease both;">

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:26px;">
      <div style="width:40px;height:40px;border-radius:11px;background:var(--accent);display:grid;place-items:center;box-shadow:var(--shadow);">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="var(--on-accent)" stroke-linecap="round" stroke-linejoin="round"><path d="M5.4 3.6v16.8" stroke-width="3.4"/><path d="M10.4 4.6l5.6 3.8-5.6 3.8" stroke-width="2.8"/><path d="M10.4 12l5.6 3.8-5.6 3.8" stroke-width="2.8" opacity=".58"/></svg>
      </div>
      <div>
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;letter-spacing:-.035em;line-height:1.1;">Brabo</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);">orquestração de agentes</div>
      </div>
    </div>

    <div style="background:var(--surface-1);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;">

      <div style="padding:26px 28px 8px;">
        <h1 style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:19px;letter-spacing:-.015em;margin:0 0 4px;">Entrar</h1>
        <p style="font-size:13px;color:var(--text-secondary);margin:0;">Acesse seu workspace e retome as sessões em andamento.</p>
      </div>

      <form onSubmit="{{ submit }}" style="padding:20px 28px 26px;display:flex;flex-direction:column;gap:16px;">

        <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;gap:10px;align-items:flex-start;background:rgba(224,90,62,.1);border:1px solid rgba(224,90,62,.4);border-radius:8px;padding:10px 12px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;margin-top:2px;"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
            <span style="font-size:12.5px;color:var(--text-primary);">{{ error }}</span>
          </div>
        </sc-if>

        <label style="display:flex;flex-direction:column;gap:7px;">
          <span style="font-size:12px;font-weight:500;color:var(--text-secondary);letter-spacing:.01em;">E-mail</span>
          <input type="email" value="{{ email }}" onChange="{{ onEmail }}" placeholder="voce@empresa.com" autoComplete="username" style="height:42px;padding:0 13px;border-radius:8px;border:1px solid var(--border);background:var(--code-bg);color:var(--text-primary);font-size:14px;transition:border-color .12s,box-shadow .12s;" />
        </label>

        <label style="display:flex;flex-direction:column;gap:7px;">
          <span style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:500;color:var(--text-secondary);">
            <span>Senha</span>
            <a href="#" style="font-size:11.5px;font-weight:500;">Esqueci minha senha</a>
          </span>
          <span style="position:relative;display:block;">
            <input type="{{ pwType }}" value="{{ senha }}" onChange="{{ onSenha }}" placeholder="••••••••••" autoComplete="current-password" style="width:100%;height:42px;padding:0 44px 0 13px;border-radius:8px;border:1px solid var(--border);background:var(--code-bg);color:var(--text-primary);font-family:'IBM Plex Mono',monospace;font-size:13.5px;letter-spacing:.02em;transition:border-color .12s,box-shadow .12s;" />
            <button type="button" onClick="{{ togglePw }}" title="Mostrar senha" style="position:absolute;right:6px;top:5px;width:32px;height:32px;border:none;background:transparent;border-radius:6px;color:var(--text-muted);display:grid;place-items:center;cursor:pointer;" style-hover="color:var(--text-secondary);background:var(--surface-2);">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
            </button>
          </span>
        </label>

        <button type="submit" disabled="{{ loading }}" style="height:44px;border:none;border-radius:8px;background:var(--accent);color:var(--on-accent);font-family:'Archivo',sans-serif;font-weight:600;font-size:14px;letter-spacing:.01em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:background .12s;margin-top:2px;" style-hover="background:var(--accent-hover);">
          <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
            <span style="width:15px;height:15px;border:2px solid rgba(247,238,226,.35);border-top-color:var(--on-accent);border-radius:50%;animation:bspin .7s linear infinite;"></span>
          </sc-if>
          {{ cta }}
        </button>

        <div style="display:flex;align-items:center;gap:12px;margin:2px 0;">
          <div style="flex:1;height:1px;background:var(--border);"></div>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);">ou</span>
          <div style="flex:1;height:1px;background:var(--border);"></div>
        </div>

        <button type="button" style="height:42px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface-2);color:var(--text-primary);font-family:'Archivo',sans-serif;font-weight:500;font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:border-color .12s,background .12s;" style-hover="background:var(--border);border-color:var(--text-muted);">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.09.68-.22.68-.49v-1.7c-2.79.62-3.38-1.37-3.38-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.35 1.12 2.92.85.09-.67.35-1.13.64-1.39-2.23-.26-4.57-1.14-4.57-5.08 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.31.1-2.73 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.42.2 2.47.1 2.73.64.72 1.03 1.64 1.03 2.76 0 3.95-2.35 4.82-4.58 5.07.36.32.68.94.68 1.9v2.82c0 .27.18.59.69.49A10.14 10.14 0 0 0 22 12.25C22 6.58 17.52 2 12 2z"/></svg>
          Continuar com GitHub
        </button>
      </form>

      <div style="border-top:1px solid var(--border);background:var(--surface-0);padding:14px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
        <span style="font-size:12.5px;color:var(--text-secondary);">Não tem acesso? <a href="#" style="font-weight:500;">Criar uma conta</a></span>
        <span style="display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-muted);">
          <span style="width:6px;height:6px;border-radius:50%;background:var(--success);animation:bpulse 2s ease-in-out infinite;"></span>
          {{ statusLabel }}
        </span>
      </div>
    </div>

    <div style="display:flex;gap:10px;align-items:flex-start;margin-top:18px;padding:12px 14px;border:1px solid var(--border);border-left:2px solid var(--warning);border-radius:8px;background:var(--surface-1);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="1.9" stroke-linecap="round" style="flex-shrink:0;margin-top:2px;"><path d="M12 3l9 16H3z"/><path d="M12 9v5M12 17h.01"/></svg>
      <p style="font-size:12px;color:var(--text-secondary);margin:0;text-wrap:pretty;">Sua conta existia antes desta versão? Peça o link em <strong style="color:var(--text-primary);font-weight:600;">Esqueci minha senha</strong> — a senha antiga não foi migrada.</p>
    </div>

    <div style="display:flex;justify-content:center;gap:16px;margin-top:22px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-muted);">
      <span>v2.4.1</span>
      <span>·</span>
      <a href="#" style="color:var(--text-muted);">Status</a>
      <span>·</span>
      <a href="#" style="color:var(--text-muted);">Documentação</a>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;statusLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12 agentes online&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { email: '', senha: '', showPw: false, loading: false, error: '' };

  submit = (e) => {
    e.preventDefault();
    const { email, senha } = this.state;
    if (!email.includes('@')) return this.setState({ error: 'Informe um e-mail válido do workspace.' });
    if (senha.length < 8) return this.setState({ error: 'A senha precisa ter no mínimo 8 caracteres.' });
    this.setState({ error: '', loading: true });
    setTimeout(() => this.setState({ loading: false }), 1600);
  };

  renderVals() {
    const p = this.props;
    return {
      email: this.state.email,
      senha: this.state.senha,
      error: this.state.error,
      loading: this.state.loading,
      pwType: this.state.showPw ? 'text' : 'password',
      cta: this.state.loading ? 'Autenticando…' : 'Entrar',
      statusLabel: p.statusLabel ?? '12 agentes online',
      submit: this.submit,
      onEmail: (e) => this.setState({ email: e.target.value, error: '' }),
      onSenha: (e) => this.setState({ senha: e.target.value, error: '' }),
      togglePw: () => this.setState(s => ({ showPw: !s.showPw })),
    };
  }
}

</script>
</body>
</html>
