    ConfirmProjectWorkspaceInternalDto:
      type: object
      properties:
        path:
          type: string
          example: /home/you/projects/store
          description: >-
            Абсолютный путь, подтверждённый runner НА ХОСТЕ, — источник истины
            (RN-423). Здесь перед записью ЛЕКСИЧЕСКИ перепроверяется;
            недопустимый — 400, никогда не записывается.
        sessionId:
          type: string
          format: uuid
          example: 01JC4Z0000SESSAO00000000001
          description: >-
            Самая свежая сессия проекта (`ProjectSession.latest_id/1`),
            определённая на стороне engine. `null`/опущено, когда у проекта ещё
            нет сессий, — проект всё равно обновляется, пропускается только
            событие аудита (принятая лакуна, RN-423).
        actorId:
          type: string
          format: uuid
          example: 01JC4Z0000USUARIO0000000001
          description: >-
            Кто запросил тикет runner (владелец сокета, который подтвердил), —
            становится актором события `project.workspace_verified`. Если
            опущено: событие (если есть сессия) рождается без
            идентифицированного актора.
      required:
        - path
    ConfirmProjectWorkspaceResponseDto:
      type: object
      properties:
        verified:
          type: boolean
          example: true
          description: >-
            Всегда `true`, когда вызов не выбросил исключение, — подтверждение
            идемпотентно. `changed` говорит, изменилось ли ЧТО-НИБУДЬ в этом
            вызове.
        workspacePath:
          type: string
          example: /home/you/projects/store
          description: >-
            ЗАПИСАННЫЙ (нормализованный) путь — может отличаться от того, что
            был при создании, потому что runner — источник истины и
            перезаписывает его.
        changed:
          type: boolean
          example: true
          description: >-
            `true` при первом подтверждении или когда сообщённый путь ОТЛИЧАЕТСЯ
            от уже записанного. `false` при переподключении, сообщающем тот же
            путь, что и всегда, — ничего не перезаписано.
      required:
        - verified
        - workspacePath
        - changed
    ContainerExecInternalDto:
      type: object
      properties:
        comando:
          type: string
          example: npm test
          description: >-
            Команда оболочки, интерпретируемая `sh -c` ВНУТРИ контейнера, — то
            же соглашение, что и у действия терминала, выполняемого вне его.
        cwd:
          type: string
          example: /work/.worktrees/dev-api
          description: >-
            Рабочий каталог ВНУТРИ контейнера. Уже переведён из пути хоста
            engine (RN-492) — этот DTO не повторяет этот перевод. Если опущен,
            выполняется в `/work`, корне проекта. Broker перепроверяет, что он
            внутри `/work`, и иначе отклоняет (`DiretorioForaDoEscopoError`).
        timeoutMs:
          type: number
          example: 300000
          description: >-
            Таймаут в миллисекундах. Если опущен, используется значение broker
            по умолчанию.
      required:
        - comando
    ContainerExecInternalResponseDto:
      type: object
      properties:
        sucesso:
          type: boolean
          example: true
          description: >-
            `false`, когда broker отказал или не ответил, — остальные поля
            отсутствуют, а `motivo` объясняет.
        exitCode:
          type: number
          example: 0
          description: 'Присутствует только при `sucesso: true`.'
        output:
          type: string
          example: |
            ok
          description: 'Присутствует только при `sucesso: true`.'
        timedOut:
          type: boolean
          example: false
          description: 'Присутствует только при `sucesso: true`.'
        motivo:
          type: string
          example: 'o broker de container não respondeu em http://broker:8090: timeout'
          description: 'Присутствует только при `sucesso: false`.'
      required:
        - sucesso
    ContainerOverviewItemResponseDto:
      type: object
      properties:
        projectId:
          type: string
          example: 01JC4Z0000PROJETO000001
        projectName:
          type: string
          example: exp002
        projectSlug:
          type: string
          example: exp002
        executionMode:
          type: string
          enum:
            - container
            - mounted
            - runner
          example: runner
          description: >-
            Где поднимается контейнер этого проекта (RN-497/503). `container` и
            `mounted` идут через broker, на сервере; `runner` — через локального
            агента на машине пользователя. Именно это разветвляет действие
            запуска между `container_start` и `container_start_via_runner`.
        registrado:
          nullable: true
          description: >-
            `null` означает, что этот проект НИКОГДА не создавал контейнер, —
            ТРЕТЬЕ состояние, а не значение `status`: это ни `stopped`
            (контейнер, который существовал и остановился), ни «не удалось
            наблюдать» (что касается демона). Читайте вместе с этим
            `naoVerificado: "sem_container_registrado"`.
          type: object
          allOf:
            - $ref: '#/components/schemas/RegistroDeContainerResponseDto'
        temImagemDecidida:
          type: boolean
          example: true
          description: >-
            Существует ли ХОТЬ ОДИН `artifact.project_image` для этого проекта —
            gate RN-105, который начиная с RN-494/ADR 0135 применяется ко всем
            ТРЁМ режимам. `false` означает, что запустить контейнер сейчас
            невозможно, и страница говорит об этом, а не предлагает действие,
            заведомо обречённое на неудачу.
        workspaceVerifiedAt:
          type: object
          nullable: true
          format: date-time
          description: >-
            Когда runner ПОДТВЕРДИЛ папку (RN-423), — имеет смысл только для
            `executionMode: "runner"`. Записывает ОДНО подтверждение и никогда
            не является heartbeat (RN-468): ненулевое значение НЕ доказывает,
            что локальный агент подключён сейчас. Доказывает оно отрицательное —
            `null` у проекта `runner` означает, что ни один runner никогда не
            подключался.
        observado:
          nullable: true
          description: >-
            То, что broker сообщает прямо сейчас, — `null` либо потому, что
            контейнера нет, либо потому, что спросить не удалось
            (`naoObservado`), либо потому, что эту строку в эту загрузку не
            спрашивали (`naoVerificado`).
          type: object
          allOf:
            - $ref: '#/components/schemas/ObservacaoDeContainerResponseDto'
        naoObservado:
          type: string
          enum:
            - broker-nao-configurado
            - broker-sem-resposta
            - broker-recusou
            - null
          nullable: true
        detalheDaObservacao:
          type: object
          nullable: true
          example: null
        naoVerificado:
          type: string
          enum:
            - fora_do_escopo_da_verificacao
            - teto_de_verificacoes_atingido
            - sem_container_registrado
            - null
          nullable: true
          example: null
          description: >-
            Ненулевое, когда эту строку в эту загрузку НЕ спрашивали у broker, —
            никогда не путается с `naoObservado`, что означает, что спрашивали и
            не удалось. `fora_do_escopo_da_verificacao`: статус
            `stopped`/`failed`/`removed`, где подтверждение демона не важно.
            `teto_de_verificacoes_atingido`: подходит, но бюджет вызовов broker
            на загрузку уже израсходован другими строками.
            `sem_container_registrado`: проект его никогда не создавал, поэтому
            наблюдать нечего, — и он тоже никогда не тратит вызов из бюджета.
        acaoPendente:
          nullable: true
          description: >-
            Ожидающее действие
            `container_start`/`container_stop`/`container_remove`/`container_start_via_runner`
            для этого проекта, если есть, — в ЛЮБОЙ из его сессий. Страница
            отображает для него встроенный `ApprovalCard` вместо кнопки
            действия, по тому же шаблону, что и вкладка PR.
          type: object
          allOf:
            - $ref: '#/components/schemas/ProposedActionResponseDto'
        decisaoVigente:
          type: object
          nullable: true
          example:
            version: 3
            image: node:22
            network: egress
          description: The current (highest version) image decision, or null.
        imagemDesatualizada:
          type: boolean
          example: false
          description: >-
            The registered container (running/stopped/provisioning) differs in
            CONTENT (image, network, resources) from the current decision; only
            recreating it (stop, remove, start) applies the new one.
        brokerConfigurado:
          type: boolean
          example: false
          description: >-
            Настроен ли у ЭТОЙ УСТАНОВКИ broker контейнеров (`BROKER_URL` задан,
            ADR 0130), — одно и то же значение в каждой строке, потому что это
            конфигурация установки, а не свойство проекта. Проекты `container` и
            `mounted` поднимают контейнер только через broker (ADR 0144),
            поэтому при `false` страница отказывает им в кнопке запуска ДО клика
            и говорит почему (ADR 0161, RN-574); проекты `runner` не
            затрагиваются. Говорит, что переменная существует, и никогда — что
            broker отвечает: это сообщает `naoObservado`.
      required:
        - projectId
        - projectName
        - projectSlug
        - executionMode
        - registrado
        - temImagemDecidida
        - workspaceVerifiedAt
        - observado
        - naoObservado
        - detalheDaObservacao
        - naoVerificado
        - acaoPendente
        - decisaoVigente
        - imagemDesatualizada
        - brokerConfigurado
    ContainerSpecInternalResponseDto:
      type: object
      properties:
        projectId:
          type: string
          example: f52be111-0000-4000-8000-000000000000
        projectSlug:
          type: string
          example: exp002
        workspaceId:
          type: string
          example: aaaaaaaa-0000-4000-8000-000000000000
        workspaceDirName:
          type: string
          example: exp002-f52be111
          description: >-
            Имя папки, ЗАМОРОЖЕННОЕ при создании проекта (RN-109). Это
            единственный источник имени контейнера (`brabo-<workspaceDirName>`)
            во ВСЕХ трёх режимах. Где находится ПАПКА — другой вопрос, на
            который отвечает `localizacao` (RN-503), — api по-прежнему никогда
            не отправляет абсолютный путь, потому что путь изнутри контейнера
            api — это не путь, который может разрешить демон Docker.
        executionMode:
          type: string
          enum:
            - container
            - mounted
            - runner
          example: container
          description: >-
            Где живёт код. Broker обслуживает `container` И `mounted` (RN-503):
            начиная с ADR 0141 смонтированная папка живёт под одной базой,
            которую этот сервер монтирует по идентичности, поэтому демон до неё
            достаёт. Он по-прежнему отклоняет `runner`: эта папка на машине
            пользователя, и ни один корень здесь её не видит, — там контейнер
            поднимает runner (ADR 0137).
        localizacao:
          description: >-
            Дискриминированный локатор папки проекта (RN-503): какой из двух
            корней broker её разрешает и относительный сегмент, который нужно
            присоединить к этому корню.
          allOf:
            - $ref: '#/components/schemas/LocalizacaoDoProjetoResponseDto'
        usuarioDaPasta:
          type: object
          nullable: true
          properties:
            uid:
              type: integer
              example: 1000
            gid:
              type: integer
              example: 1000
          description: >-
            ВЛАДЕЛЕЦ папки проекта, измеренный api (ADR 0180): broker запускает
            контейнер с `--user uid:gid`, чтобы dev agent мог писать в папку при
            `--cap-drop ALL`. `null`, когда папку невозможно измерить, проект
            `runner` или владелец — root, — тогда контейнер запускается как
            раньше. Никогда не принимается из запроса к broker.
        imagem:
          nullable: true
          description: >-
            `null`, пока Архитектор не принял решение (RN-105), — тогда `start`
            отклоняется с 409 на стороне broker, а остальные четыре операции
            продолжают работать.
          type: object
          allOf:
            - $ref: '#/components/schemas/ImagemParaOBrokerResponseDto'
        imagemVersao:
          type: number
          example: 3
          description: >-
            Версия текущего артефакта; 0, когда решения нет. Попадает в
            контейнер как метка `brabo.image.version`.
      required:
        - projectId
        - projectSlug
        - workspaceId
        - workspaceDirName
        - executionMode
        - localizacao
        - usuarioDaPasta
        - imagem
        - imagemVersao
    ContratoDeModuloInternalDto:
