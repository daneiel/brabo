  /internal/sessions/{sessionId}/llm-turn:
    post:
      description: >-
        计量是强制的：每个回合都记录 `token_usage`，正是这一点让预算有意义。不记录任何事件——由 engine
        叙述事件日志。提供商失败时在 `error` 中以 200 返回，因为 `usage` 中的计费仍然有效：即使失败，该回合也产生了花费。
      operationId: InternalSessionsController_llmTurn
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunLlmTurnDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmTurnResponseDto'
        '400':
          description: 请求体无效。
        '403':
          description: 超出预算且 `policy=block`，或服务令牌无效。
        '404':
          description: 未找到会话、项目或资源。
      security:
        - service-token: []
      summary: 运行一个经过计量的 LLM 回合，支持工具
      tags:
        - internal
  /internal/sessions/{sessionId}/llm-turn-stream:
    post:
      description: 与 `llm-turn` 语义相同，逐帧交付。`done` 帧携带 `usage`——没有它，该回合将没有计费记录。
      operationId: InternalSessionsController_llmTurnStream
      parameters:
        - name: sessionId
