        名称是导航标签，不会取代 id 的井号标签——界面会把两者组合起来，没有名称时退化为只显示井号标签。`null`
        或空白字符串会清除名称。无法修改 `kind`：它是创建时的意图，之后修改会把它变成状态。
      operationId: SessionsController_rename
      parameters:
        - name: projectId
          required: true
