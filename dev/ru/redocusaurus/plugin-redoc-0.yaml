    DevTaskContextResponseDto:
      type: object
      properties:
        task:
          $ref: '#/components/schemas/TaskResponseDto'
        story:
          $ref: '#/components/schemas/StoryResponseDto'
        businessRules:
          type: array
          items:
            $ref: '#/components/schemas/DevContextBusinessRuleResponseDto'
        adrs:
          description: >-
            Применимые ADR: сквозные (без объявленного модуля) плюс те, что
            ссылаются на модуль этого агента.
          type: array
          items:
            $ref: '#/components/schemas/DevContextAdrResponseDto'
        siblingTasks:
          description: >-
            Остальные задачи той же истории, с их статусом. Gate QA оценивает
            поставку по тому, что относится к ЭТОЙ задаче; требование соседней
            задачи — это замечание, никогда не отклонение (RN-765).
          type: array
          items:
            $ref: '#/components/schemas/DevContextSiblingTaskResponseDto'
        moduleOpenTasks:
          description: >-
            Задачи ДРУГИХ историй того же модуля, ещё не завершённые, с
            заголовком истории (не более 20). Требование, зависящее от того, что
            поставит другая история, — это замечание для gate QA, никогда не
            отклонение (RN-785).
          type: array
          items:
            $ref: '#/components/schemas/DevContextModuleOpenTaskResponseDto'
        moduleOpenTasksTotal:
          type: number
          description: >-
            Реальное число открытых задач модуля в других историях — больше, чем
            `moduleOpenTasks.length`, когда список обрезан.
        moduleContract:
          nullable: true
          description: >-
            Текущий контракт модуля задачи (`artifact.module_contracts`) —
            источник ИНТЕРФЕЙСА для gate QA. Когда история и контракт
            расходятся, вердикт называет расхождение, а не отклоняет dev,
            следовавшего контракту (RN-786). `null` без разрешимого модуля или
            контракта.
          type: object
          allOf:
            - $ref: '#/components/schemas/ContratoDeModuloResponseDto'
        primeiraDoModulo:
          type: boolean
          description: >-
            Является ли это ПЕРВОЙ задачей модуля: самый старый
            `backlog.task_claimed` проекта для `module` — это эта задача. Engine
            даёт ей двойной бюджет на задачу (RN-774). `false` без `module`.
        decisoes:
          description: >-
            RN-859: решения пользователя, привязанные к этой задаче, её истории
            или её правилам через `afeta`, — при конфликте они побеждают RF/DoR.
            Сначала новые, не более 10, каждый текст обрезан до 1 500 символов.
          type: array
          items:
            $ref: '#/components/schemas/DevContextDecisaoResponseDto'
        decisoesDoProjeto:
          description: >-
            RN-872 (ADR 0215): ПРОЧИЕ решения проекта — те, чей `afeta` не
            касается этой задачи. Отдельный раздел, в пределах ТОГО ЖЕ лимита в
            10, что и `decisoes` (решения задачи занимают лимит первыми),
            сначала новые.
          type: array
          items:
            $ref: '#/components/schemas/DevContextDecisaoResponseDto'
      required:
        - task
        - story
        - businessRules
        - adrs
        - siblingTasks
        - moduleOpenTasks
        - moduleOpenTasksTotal
        - moduleContract
        - primeiraDoModulo
        - decisoes
        - decisoesDoProjeto
