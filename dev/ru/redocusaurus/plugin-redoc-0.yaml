                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/ModelComCuradoriaResponseDto'
                  cloud:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/ModelComCuradoriaResponseDto'
                example:
                  local:
                    ollama: []
                  cloud:
                    anthropic: []
                    openai: []
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в рабочем пространстве.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перечисляет ВЕСЬ каталог, включая неактивные и недоступные
      tags:
        - llm
