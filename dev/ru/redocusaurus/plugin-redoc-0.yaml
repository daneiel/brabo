    post:
      description: >-
        Рождается как `offered`. Принимает ЧЕЛОВЕК, через маршрут для человека,
        — агент не активирует агента. Два исключения. Предложение Креатив→PO,
        несущее `product_brief`, которого попросил клик «Я готов — потребность
        подтверждена», принимается от имени кликнувшего, с этим человеком как
        актором и `implicito` в payload (RN-658, ADR 0185). Handoff от PO к
        Архитектору принимается СИСТЕМОЙ, когда backlog покрыт (хотя бы одно
        бизнес-правило, ни одного без истории), а репозиторий `local` и в
        проекте нет учётных данных git (RN-660, ADR 0186); `aceiteAutomatico`
        говорит, произошло ли это, и если нет — почему. В любом случае ответ
        затем содержит `status: accepted`.
