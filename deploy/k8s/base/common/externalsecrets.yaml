# Secrets via External Secrets Operator.
#
# Nenhum segredo entra em manifesto versionado. O que está aqui é a DECLARAÇÃO
# de quais chaves existem e de onde vêm; o valor vive no provider e o ESO
# materializa o Secret dentro do cluster.
#
# O `secretStoreRef` aponta para um SecretStore que cada overlay define — é o
# único ponto que muda entre local e produção. No overlay local o store lê de
# um Secret-fonte que o bootstrap.sh cria imperativamente com `openssl rand`
# (`kubectl create secret`, nunca versionado); em staging/prod aponta para o
# provider real.
#
# Fallback sealed-secrets: ver docs/runbooks/deploy-local.md — a alternativa é
# substituir estes dois recursos por SealedSecrets, mantendo os MESMOS nomes de
# Secret e as mesmas chaves, para que nada mais no chart precise mudar.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: brabo-secrets
  labels:
    app.kubernetes.io/part-of: brabo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: brabo-secret-store
    kind: SecretStore
  target:
    name: brabo-secrets
    creationPolicy: Owner
  data:
    # Conexão do Postgres — externo por padrão (ver docs/adr/0025).
    - secretKey: DATABASE_URL
      remoteRef:
        key: brabo
        property: DATABASE_URL
    # Phoenix: assina sessão e token de canal.
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: brabo
        property: SECRET_KEY_BASE
    # Envelope encryption das credenciais de LLM e git do usuário.
    - secretKey: CREDENTIALS_MASTER_KEY
      remoteRef:
        key: brabo
        property: CREDENTIALS_MASTER_KEY
    # HMAC do state do OAuth de git — rotação independente da master key.
    - secretKey: GIT_OAUTH_STATE_SECRET
      remoteRef:
        key: brabo
        property: GIT_OAUTH_STATE_SECRET
    # Client credentials api -> engine.
    - secretKey: API_KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: brabo
        property: API_KEYCLOAK_CLIENT_SECRET
    # Client credentials engine -> api.
    - secretKey: ENGINE_KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: brabo
        property: ENGINE_KEYCLOAK_CLIENT_SECRET
    # Cookie da distribuição Erlang. O release já carrega um cookie gerado no
    # build; sobrescrever por Secret tira o segredo de dentro da imagem, que é
    # artefato compartilhado entre ambientes.
    - secretKey: RELEASE_COOKIE
      remoteRef:
        key: brabo
        property: RELEASE_COOKIE
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
  labels:
    app.kubernetes.io/part-of: brabo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: brabo-secret-store
    kind: SecretStore
  target:
    name: keycloak-secrets
    creationPolicy: Owner
  data:
    - secretKey: KC_BOOTSTRAP_ADMIN_USERNAME
      remoteRef:
        key: brabo
        property: KEYCLOAK_ADMIN
    - secretKey: KC_BOOTSTRAP_ADMIN_PASSWORD
      remoteRef:
        key: brabo
        property: KEYCLOAK_ADMIN_PASSWORD
    # Os dois secrets de client entram no realm importado. É por isso que o
    # realm.json daqui é um TEMPLATE renderizado por initContainer: o arquivo
    # original (docker/keycloak/realm.json) traz os secrets em plaintext, o que
    # num ConfigMap seria exatamente "secret em manifesto plano".
    - secretKey: API_KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: brabo
        property: API_KEYCLOAK_CLIENT_SECRET
    - secretKey: ENGINE_KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: brabo
        property: ENGINE_KEYCLOAK_CLIENT_SECRET
