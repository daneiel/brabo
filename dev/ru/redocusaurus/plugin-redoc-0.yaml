      summary: >-
        Принудительно выполняет синхронизацию каталога, которую делает
        периодическое задание, прямо сейчас
      tags:
        - llm
  /workspaces/{workspaceId}/models/uses:
    post:
      description: >-
        Ось, которую не публикует ни один каталог: «хорош для кода» — не
        возможность, объявленная каким-либо провайдером, это мнение оператора —
        и применяется ТОЛЬКО к этому рабочему пространству (ADR 0049). Ось
        независима от активации: пометка применения не включает модель в
