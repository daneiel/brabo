        - official
    HybridSearchHitResponseDto:
      type: object
      properties:
        chunkId:
          type: string
        scope:
          type: string
          enum:
            - docs
            - adr
            - session
            - local
        content:
          type: string
        score:
          type: number
          description: >-
            Combinado (RAG_SEARCH_WEIGHT_VECTOR*vetorial +
            RAG_SEARCH_WEIGHT_LEXICAL*léxico), já filtrado pelo limiar — todo
            acerto devolvido passou por ele.
        vectorScore:
          type: number
          nullable: true
          description: >-
            Similaridade de cosseno, 0..1. `null` quando este chunk não tinha
            vetor.
        lexicalScore:
          type: number
          nullable: true
          description: >-
            `ts_rank` normalizado, 0..1. `null` quando o termo não casou neste
            chunk.
        origin:
          type: object
          additionalProperties: true
          description: >-
            União discriminada por `kind`: "file" (`sourcePath`/`headingPath`)
            ou "session" (`sessionId`/`eventId`). Ver
            `domain/rag/rag-citation.ts`.
      required:
        - chunkId
        - scope
        - content
        - score
        - vectorScore
        - lexicalScore
        - origin
    HybridSearchRequestDto:
      type: object
      properties:
