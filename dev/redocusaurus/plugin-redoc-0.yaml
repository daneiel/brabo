    LocalizacaoDoProjetoResponseDto:
      type: object
      properties:
        tipo:
          type: string
          enum:
            - gerenciada
            - montada
            - indisponivel
          example: gerenciada
          description: >-
            Qual das raízes do broker resolve esta pasta. `gerenciada` →
            `PROJECT_WORKSPACES_HOST_ROOT` (a pasta gerenciada pelo produto,
            nomeada por `workspaceDirName`); `montada` →
            `BRABO_PROJECTS_HOST_BASE` (a base única dos projetos Mounted, ADR
            0141); `indisponivel` → nenhuma raiz deste servidor a alcança, e
            `motivo` diz por quê. Três estados, não dois: projetos `runner` e
            projetos `mounted` legados criados fora da base são recusas com
            correções DIFERENTES, e juntá-los num null faria quem chama
            adivinhar qual recebeu.
        segmento:
          type: string
          example: loja
          description: >-
            A parte que a raiz do broker NÃO cobre, juntada a ela como
            `<root>/<segmento>`. Para `gerenciada` é `workspaceDirName`; para
            `montada`, o caminho RELATIVO sob a base (pode conter `/`). AUSENTE
            — não null — quando `tipo` é `indisponivel`: as duas variantes são
            uma união discriminada do lado da api e o fio diz o mesmo, então
            quem lê `segmento` sem conferir `tipo` quebra de forma ruidosa em
            vez de compor `<root>/null`.
        motivo:
          type: string
          example: o projeto está no modo "runner"…
          description: >-
            Por que nenhuma raiz alcança esta pasta. Presente só quando `tipo` é
            `indisponivel`. É mensagem feita para ser repetida a quem opera,
            então nomeia o modo ou a base.
      required:
        - tipo
