    ProjectMirrorStateResponseDto:
      type: object
      properties:
        mirrorPath:
          type: object
          example: /home/you/mirrors/store
          nullable: true
          description: >-
            今天声明的目标（`projects.mirror_path`，RN-515）。`null`
            表示项目没有镜像——这是正常状态，也是界面完全隐藏这一行而不是凭空编造缺失的原因。
        status:
          type: string
          example: synced
          enum:
            - never
            - synced
            - failed
          description: >-
            `never`——还没有 runner 报告过任何一轮（没有记录）。`synced`——最近一轮已复制；`filesCopied`
            可能为 `0`，表示“看过了，没有需要复制的”，有自己专门的语句。`failed`——最近一轮失败，且错误比最近一次成功更新。API
            根据两个时间戳推导出它，让这条规则只有一个来源；界面仍会拿到原始字段来组织语句。
        lastSyncedAt:
          type: object
          example: '2026-09-07T12:04:00.000Z'
          nullable: true
          description: 最近一次成功的同步。之后的失败绝不会抹去它——在镜像损坏期间，这是此界面最有用的信息。
        filesCopied:
          type: object
          example: 412
          nullable: true
        filesSkipped:
          type: object
          example: 3
          nullable: true
        filesRefused:
          type: object
          example: 0
          nullable: true
        lastDestination:
          type: object
          example: /home/you/mirrors/store
          nullable: true
          description: >-
            最近一轮实际写入的位置——已冻结。在有人修改目标后它会与 `mirrorPath` 不同，因为授权随 join 传递，只在 runner
            重连时才会改变（RN-516）。
        lastError:
          type: object
          example: null
          nullable: true
        lastErrorAt:
          type: object
          example: null
          nullable: true
      required:
        - mirrorPath
        - status
        - lastSyncedAt
        - filesCopied
        - filesSkipped
        - filesRefused
        - lastDestination
        - lastError
        - lastErrorAt
    ProjectResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z0000PROJETO0000000001
        workspaceId:
          type: string
          example: 01JC4Z0000WORKSPACE00000001
        name:
          type: string
          example: Checkout
        slug:
          type: string
          example: checkout
          description: 在 workspace 内唯一。
        workspaceDirName:
          type: string
          example: checkout-3f2b1c8e
          description: >-
            此项目在 PROJECT_WORKSPACES_ROOT 中的物理 workspace 文件夹名称（RN-109）。新项目为
            `<slug>-<8 id chars>`；在此列存在之前创建的项目为原始 UUID。在创建时冻结——之后编辑 `slug`
            不会重新计算它。
        executionMode:
          type: string
          enum:
            - container
            - mounted
            - runner
          example: container
          description: >-
            命令在哪里执行（RN-169/RN-421——ADR 0072/0104）。`container`：在
            PROJECT_WORKSPACES_ROOT 中托管的文件夹。`mounted`：`workspacePath` 中的用户文件夹，位于
            `BRABO_PROJECTS_BASE` 内，通过基目录的 bind-mount 访问（ADR 0141）。`runner`：由
            runner 确认的用户文件夹。`mounted` 和 `runner` 都会在 `workspaceVerifiedAt`
            中报告确认。
        workspacePath:
          type: object
          example: null
          nullable: true
          description: 用户文件夹的绝对路径——`mounted`/`runner` 时填写，始终为 `null`，在 `container` 模式下。
        workspaceVerifiedAt:
          type: object
          example: null
          nullable: true
          description: >-
            路径在磁盘上被确认的时间。`null` = 尚未验证。在 `runner` 中，确认来自 CLI 连接（RN-423）；在
            `mounted` 中，在 Infra 启动容器、文件夹被物化时打上时间戳（RN-501，ADR 0142）。`container`
            从不填写此字段。它记录的是一次确认，绝不是心跳。
        mirrorPath:
          type: object
          example: null
          nullable: true
          description: >-
            用户机器上的镜像目标——位于挂载基目录之外、本地代理把工作复制到的文件夹（RN-515，ADR 0147）。`null`
            表示项目没有镜像，这是正常状态，绝不是错误。只有 `mounted`/`runner` 可以有。通过 `PUT
            /projects/:projectId/mirror-path`
            设置；它随每次项目读取一并返回，因此不需要专用端点来获知。该值只经过词法校验——文件夹是否存在由本地代理知道，而不是此 API。
        language:
          type: string
          example: pt-BR
          description: >-
            项目的语言（RN-619）：所有没有人类作者的内容所使用的语言——共享制品（产品简介、业务规则、ADR）以及没有人输入的回合（启动、dev
            agent、gate、提交信息、PR 正文）。规范的 BCP-47
            代码，开放列表。新项目以其创建者的有效回复语言开始（RN-618）。通过 `PATCH
            /projects/:projectId`（`maintainer`）设置。engine 在每个没有人类作者的回合的每次 LLM
            调用末尾，以临时系统消息的形式把它发送给模型（RN-622）；在某人的回合中发出的制品仍遵循此人的回复语言。
        createdBy:
          type: string
          example: 01JC4Z0000USUARIO0000000001
        taskBudgetMicros:
          type: object
          example: 500000
          nullable: true
          description: 每个 dev agent 任务的 token 上限，以微美元计。`null` 使用领域默认值。
        maxConsecutiveBlocked:
          type: object
          example: 3
          nullable: true
          description: >-
            每个 dev agent 的熔断器（Phase 12b——RN-047）：在停到 idle_tripped
            之前，连续以阻塞结束的任务数。`null` 使用领域默认值。
        storyPromotion:
          type: string
          enum:
            - manual
            - auto
          example: auto
          description: >-
            谁把 story 提升为 `ready`（Phase 12c——RN-048）。`manual`：PO
            提议，用户决定。`auto`：创建时自动提升——自 RN-659 起为新项目的默认值；之前创建的项目保留原有的值。
        createdAt:
          type: string
          example: '2026-07-21T11:00:00.000Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-21T11:00:00.000Z'
          format: date-time
      required:
        - id
        - workspaceId
        - name
        - slug
        - workspaceDirName
        - executionMode
        - workspacePath
        - workspaceVerifiedAt
        - mirrorPath
        - language
        - createdBy
        - taskBudgetMicros
        - maxConsecutiveBlocked
        - storyPromotion
        - createdAt
        - updatedAt
    ProjectsBaseResponseDto:
      type: object
      properties:
        projectsBase:
          type: object
          example: /home/voce/brabo
          nullable: true
          description: >-
            运营者电脑上 Brabo 容器唯一能看到的文件夹，按身份（`$X:$X`）挂载到 `api` 和 `engine` 中（ADR
            0141）。`null` 表示未设置 `BRABO_PROJECTS_BASE`：此安装不提供 Mounted
