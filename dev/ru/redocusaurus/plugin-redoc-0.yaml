  /workspaces/{workspaceId}/owner-of-record:
    put:
      description: >-
        Титульный владелец — это `createdBy`: чьи учётные данные LLM тратят
        агенты и чьи учётные данные git используют действия агентов (RN-058), и
        кому принадлежит отчёт о расходах (RN-060). Он не даёт авторизации — её
        дают роли. Цель уже должна быть `owner` рабочего пространства (иначе 409
        `titular_precisa_ser_owner`). С момента коммита ходы агентов ищут
        учётные данные НОВОГО титульного владельца; если у него нет учётных
        данных для провайдера модели, ход заканчивается существующим исходом
        «учётные данные не зарегистрированы» для этого провайдера — этот маршрут
        не проверяет это заранее. Вызвать его может любой `owner`, в том числе
        для другого владельца. Передача текущему титульному владельцу ничего не
        делает.
      operationId: WorkspacesController_transferOwnership
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в рабочем пространстве.
        '404':
          description: Рабочее пространство не существует или невидимо для вызывающего.
        '409':
          description: >-
            `titular_precisa_ser_owner`: цель не является `owner` рабочего
            пространства.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Передаёт титульное владение рабочим пространством
      tags:
        - workspaces
  /workspaces/{workspaceId}/project-folders:
    get:
      description: >-
        Выбор папки для режима Mounted, обслуживаемый api, а не runner (RN-504).
        ЖЁСТКО ограничен `BRABO_PROJECTS_BASE` (ADR 0141): `path` необязателен и
        по умолчанию равен самой базе, а любой `path` вне её — это `400`,
        некорректный запрос, а не проблема прав, поскольку ни одна роль не
        просматривает что-либо вне базы.


        Ограничен намеренно: только каталоги, не более 500 (отсортированных ДО
        обрезки, о чём говорит `truncado`), никогда рекурсивно, записи с точкой
        в начале исключены, а символические ссылки сообщаются, но никогда не
        разыменовываются. То, что осталось за бортом, ПОДСЧИТЫВАЕТСЯ
        (`arquivos`, `simbolicos`), чтобы папка, полная кода, никогда не
        выглядела пустой.


        Парного POST нет: создание папки относится к материализации
        смонтированной рабочей области, а не к выбору.
      operationId: WorkspacesController_listProjectFolders
      parameters:
        - name: path
          required: false
          in: query
          description: >-
            Абсолютный путь для перечисления. Если опущен — сама база. Должен
            быть внутри `BRABO_PROJECTS_BASE`; `..`, `.` и относительные пути
            сразу отклоняются, а не разрешаются.
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFoldersResponseDto'
        '400':
          description: Путь вне базы проектов или некорректен.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в рабочем пространстве.
        '404':
          description: Рабочее пространство не существует или невидимо для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перечисляет подпапки папки внутри базы проектов
      tags:
        - workspaces
  /workspaces/{workspaceId}/projects:
    get:
      operationId: WorkspacesController_listProjects
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в рабочем пространстве.
        '404':
          description: Рабочее пространство не существует или невидимо для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перечисляет проекты рабочего пространства
      tags:
        - workspaces
    post:
      operationId: WorkspacesController_createProjectInWorkspace
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в рабочем пространстве.
        '404':
          description: Рабочее пространство не существует или невидимо для вызывающего.
        '409':
          description: Проект с таким slug уже существует в рабочем пространстве.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Создаёт проект в рабочем пространстве
      tags:
        - workspaces
  /workspaces/{workspaceId}/projects-base:
    get:
      description: >-
        Единственная папка на машине оператора, которую видят контейнеры api и
        engine, смонтированная по идентичности (ADR 0141). `null` — нормальное
        состояние, никогда не ошибка, — означает, что у этой установки нет
        `BRABO_PROJECTS_BASE`, поэтому мастер проекта вообще не должен
        предлагать режим Mounted. Одно и то же значение для каждого рабочего
        пространства: это конфигурация установки, а `workspaceId` лишь
        ограничивает авторизацию.


        `brokerConfigurado` отвечает на вторую половину того же вопроса:
        `container` и `mounted` поднимают контейнер только через broker (ADR
        0144), поэтому без него мастер не выбирает заранее Mounted и предлагает
        вместо этого Runner (ADR 0161, RN-573).
      operationId: WorkspacesController_getProjectsBase
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsBaseResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в рабочем пространстве.
        '404':
          description: Рабочее пространство не существует или невидимо для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Базовая папка для проектов в режиме Mounted
      tags:
        - workspaces
  /workspaces/{workspaceId}/projects-status:
    get:
      description: >-
        Одна строка на проект рабочего пространства с заблокированной задачей —
        питает точку статуса в боковой панели дашборда одним запросом вместо N
        вызовов к backlog.
      operationId: WorkspacesController_getProjectsStatus
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectBlockedStatusResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в рабочем пространстве.
        '404':
          description: Рабочее пространство не существует или невидимо для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Количество заблокированных задач по проектам
      tags:
        - workspaces
  /workspaces/{workspaceId}/projects-summary:
    get:
      description: >-
        Одна строка на проект рабочего пространства с git-провайдером, статусом
        создания, бюджетом, последней активностью, историями, ожидающими
        продвижения, и фактами, определяющими состав агентов (RN-090).


        Та же идея, что и `projects-status`, этажом выше: сетка карточек — это
        чтение РАБОЧЕГО ПРОСТРАНСТВА, а не N чтений проектов. Прежний путь делал
        семь опрашиваемых запросов на карточку, и при 23 проектах один только
        дашборд пробивал лимит в 300 запросов/мин.
      operationId: WorkspacesController_getProjectsSummary
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectCardSummaryResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в рабочем пространстве.
        '404':
          description: Рабочее пространство не существует или невидимо для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Всё, что отображают карточки дашборда, за один вызов
      tags:
        - workspaces
  /workspaces/{workspaceId}/spend-report:
    get:
      description: >-
        Аудитория ВЛАДЕЛЬЦА. Ось ПРОВАЙДЕРА вернулась (ADR 0076, RN-186) и
        находится здесь, а не на маршруте участника, потому что разбивка по
        провайдеру — это разбивка по УЧЁТНЫМ ДАННЫМ, а учётные данные — дело
        того, кто платит (RN-060). Дополняет `credential-spend`, который
        продолжает отвечать на вопрос о СЧЁТЕ (по месяцам, с привязкой к
        существующему сегодня ключу). Человек и агент также идут отдельными
        блоками, по `actor_kind`. Скользящее окно в днях, а дневной ряд приходит
        ПЛОТНЫМ — день без расходов приходит как ноль, иначе спарклайн лжёт о
        темпе.
      operationId: SpendController_getWorkspaceSpendReport
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
        - name: dias
          required: false
          in: query
          description: Скользящее окно. По умолчанию 30, максимум 180.
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSpendReportResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Требует `owner` в рабочем пространстве.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: >-
        Разбивает расходы рабочего пространства по модели, провайдеру, проекту,
        актору и дню
      tags:
        - llm
  /workspaces/{workspaceId}/summary:
    get:
      description: >-
        Число проектов, агенты, потратившие токены в этом месяце, и расходы
        этого месяца — питает строку сводки дашборда проектов.
      operationId: WorkspacesController_getSummary
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSummaryResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в рабочем пространстве.
        '404':
          description: Рабочее пространство не существует или невидимо для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Агрегированная сводка рабочего пространства
      tags:
        - workspaces
  /workspaces/{workspaceId}/tool-router:
    put:
      description: >-
        Включено по умолчанию. Когда включено И модель хода от OpenRouter, шаг
        агента с двумя или более инструментами сначала спрашивает Jev, какой
        инструмент подходит, и модели чата предлагается только этот инструмент и
        предыдущий. Jev никогда ничего не одобряет и не отклоняет: действие,
        требующее одобрения, по-прежнему его требует. Любой сбой Jev
        откатывается ко всему каталогу. Выключение прекращает все вызовы к Jev,
        а вместе с ними и его затраты.
      operationId: WorkspacesController_setToolRouter
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetToolRouterDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в рабочем пространстве.
        '404':
          description: Рабочее пространство не существует или невидимо для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: >-
        Включает или выключает маршрутизацию инструментов Jev для рабочего
        пространства
      tags:
        - workspaces
  /workspaces/{workspaceId}/unread-events:
    post:
      description: >-
        Выдвижная панель колокольчика для всего рабочего пространства (RN-091).
        Каждый курсор говорит, до какого `seq` этот проект уже прочитан, а ответ
        несёт то, что пришло после этого в самой свежей сессии каждого.


        **Это POST, потому что это единственный глагол с ТЕЛОМ, а не потому, что
        он меняет состояние.** Сервер не знает, где остановился каждый читатель:
        «прочитано до сюда» — это `seq` на проект, хранимый в браузере, и
        endpoint «отметить как прочитанное» (намеренно) нет. Поэтому граница
        должна ПЕРЕДАВАТЬСЯ в запросе, а пар десятки — в query string это
        превращается в длинный URL, который прокси обрезает, и к тому же
        поместило бы id проектов пользователя в журналы доступа. Маршрут
        идемпотентен и без побочных эффектов: отвечает `200`, никогда `201`.


        Заменяет по одному запросу НА ПРОЕКТ при открытой панели — 23 проекта
        стоили 286 запросов/мин при лимите 300.
      operationId: WorkspacesController_getUnreadEvents
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnreadEventsDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectUnreadEventsResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в рабочем пространстве.
        '404':
          description: Рабочее пространство не существует или невидимо для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Непрочитанные события по нескольким проектам, за один вызов
      tags:
        - workspaces
info:
  title: Brabo API
  description: >-
    API Brabo. Каждый endpoint возвращает JSON, кроме четырёх явно

    задокументированных с другим `content-type` (два SSE, метрики

    и OAuth-callback, который перенаправляет).


    ## Аутентификация


    Access-токен — это **EdDSA JWT на 15 минут**, предъявляемый в

    `Authorization: Bearer <token>`. Публичный ключ находится по адресу

    `GET /.well-known/jwks.json`.


    Refresh **не является** JWT: это непрозрачный токен, который живёт в

    cookie `httpOnly` (`brabo_refresh`, `Path=/auth`, `SameSite=Strict`) и

    никогда не появляется ни в одном теле ответа. `POST /auth/refresh` и

    `POST /auth/logout` читают cookie и требуют, чтобы заголовок `X-CSRF-Token`

    совпадал с cookie `brabo_csrf`.


    **Ротация обязательна.** Каждый refresh расходует предъявленный токен и

    выдаёт другой. Повторное предъявление уже израсходованного — признак кражи,

    и оно отзывает ВСЁ семейство, включая законную сессию. Клиент, который

    отправляет два одновременных refresh, выводит из строя сам себя; используйте

    один вызов в полёте.


    Маршруты `/internal/*` — это поверхность api ↔ engine, и они находятся **вне

    JWT**: они требуют заголовок `X-Brabo-Service-Token` с общим

    секретом. Токен пользователя не открывает ни один из них.


    ## Ошибки


    Формат NestJS по умолчанию: `{ "statusCode": number, "message": string |
    string[], "error": string }`.


    | код | когда |

    |---|---|

    | `400` | некорректное тело — `ValidationPipe` работает с `whitelist` и
    `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к ошибке |

    | `401` | нет токена, токен истёк или недействительные учётные данные |

    | `403` | аутентифицирован, но без роли, которую требует RBAC, или неверный
    сервисный токен |

    | `404` | ресурс не существует **или** невидим для вызывающего |

    | `409` | конфликт состояния — недопустимый переход сессии, ресурс уже
    существует |

    | `429` | лимит частоты или прогрессивная блокировка |


    Маршруты аутентификации отвечают **намеренно неразличимо** для
    несуществующего

    email, неверного пароля и заблокированной учётной записи: то же тело, тот же
    статус, то же

    время. Именно это закрывает перебор учётных записей, и это не дефект

    диагностики.


    ## Лимит частоты


    Скользящее окно в Postgres: 300 запросов на пользователя и 600 на IP каждые
    60 с,

    настраивается. Маршрут `@Public()` и сервисный маршрут **освобождены** —
    `/auth/*`

    защищает прогрессивная блокировка, а не лимит частоты.
