      description: >-
        Определяется для ВЫЗЫВАЮЩЕГО, никогда для сессии: переопределение сессии
        > выбор в Учётной записи > обнаруженный и подтверждённый > язык
        интерфейса (RN-618). Возвращает победителя, его происхождение и каждое
        звено цепочки — и, когда ваши недавние сообщения указывают на другой
        язык и экран должен о нём спросить, `detectionQuestion` (RN-624).
      operationId: SessionResponseLanguageController_get
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseLanguageResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект или сессия не существуют.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Язык, на котором агенты отвечают ВАМ в этой сессии
      tags:
        - sessions
    put:
      description: >-
        Только для вызывающего, только в этой сессии (RN-618) — другие участники
        и ваш выбор в Учётной записи не затрагиваются. `null` возвращает к
        наследованию из Учётной записи.
      operationId: SessionResponseLanguageController_set
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSessionResponseLanguageDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseLanguageResponseDto'
        '400':
          description: >-
            Тело без `language` или код, не являющийся распознанным языком
            BCP-47.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект или сессия не существуют.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Закрепляет (или освобождает) ВАШ язык ответов в этой сессии
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}/socket-ticket:
    post:
      description: >-
        Тикет аутентифицирует сокет Phoenix сессии `session:<id>` при
        `connect/3` в engine — это НЕ переиспользованный JWT. TTL 30 с и
        однократное использование: каждое переподключение (включая
        автоматические) запрашивает новый тикет. `scope: "heartbeat"` требует
        роли `viewer`; `scope: "terminal"` требует `developer`, ту же
        минимальную роль, что и у действий терминала.
      operationId: SessionsController_issueSocketTicket
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSocketTicketDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocketTicketResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль для запрошенной области действия.
        '404':
          description: Проект или сессия не существуют.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Выпускает непрозрачный одноразовый тикет для сокета сессии
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}/tasks/{taskId}/unblock:
    post:
      description: >-
        Сбрасывает счётчик исправлений gate и возвращает задачу агенту. Это
        ручной выход для лимита исправлений — автоматической разблокировки нет.
      operationId: ExecutionController_unblock
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: taskId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, сессия или задача не найдены.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Разблокирует заблокированную задачу
      tags:
        - execution
  /projects/{projectId}/sessions/{sessionId}/token-usage:
    get:
      description: >-
        Данные всегда были в `token_usage`, но без агрегации и маршрута панель
        команды не могла показать стоимость по карточке. Требуется та же роль,
        что и для бюджета сессии.
      operationId: BudgetsController_getSessionTokenUsage
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentTokenUsageResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект или сессия не найдены.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Разбивает расходы сессии по агентам
      tags:
        - llm
  /projects/{projectId}/sessions/{sessionId}/transition:
    post:
      description: >-
        Переход проверяется машиной состояний домена, а не клиентом: created →
        active → closing → closed | closed_abnormally. Недопустимый переход —
        409.
      operationId: SessionsController_transition
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionSessionDto'
      responses:
        '201':
          description: >-
            Возвращает 201, а не 200, потому что обработчик — `@Post` без
            `@HttpCode`, это поведение Nest по умолчанию. Задокументировано как
            есть, а не изменено: семантика спорна, поведение не дефектно, а
            табличный тест падает при любом расхождении между ними.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект или сессия не существуют.
        '409':
          description: Переход из текущего состояния не разрешён.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Переводит сессию в другое состояние
      tags:
        - sessions
  /projects/{projectId}/spend/me:
    get:
      description: >-
        Аудитория УЧАСТНИКА. Только собственные строки вызывающего — актор
        берётся из аутентифицированного токена, и параметра для его подмены нет.
        В токенах и ОЦЕНОЧНОЙ стоимости, без разбивки по провайдеру или учётным
        данным: ключ, который работал, принадлежит владельцу (RN-058), и счёт по
        нему — его (RN-060). Ось провайдера появилась в отчёте владельца (ADR
        0076) и остаётся недоступной отсюда — на этом маршруте нет параметра
        измерения, а тип репозитория отклоняет такую комбинацию (RN-187). Агент
        не учитывается: `token_usage` записывает, кто потратил, а не кто заказал
        расход.
      operationId: SpendController_getMySpend
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: dias
          required: false
          in: query
          description: Скользящее окно. По умолчанию 30, максимум 180.
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySpendResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Моё собственное потребление в этом проекте, по сессиям и по дням
      tags:
        - llm
  /projects/{projectId}/stories/{storyId}/archive:
    post:
      description: >-
        История уходит из backlog, покрытия, очереди продвижения, плана Dev Lead
        и claim — а вместе с ней и её задачи. Ничего не удаляется: строка
        остаётся с `archivedAt`, а `backlog.story_archived` записывает, кто,
        почему и какие задачи. Только история `draft` без задачи в работе.
      operationId: BacklogController_archive
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: storyId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveStoryDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '409':
          description: >-
            Именованный отказ (`reason`): `historia_arquivada`,
            `historia_nao_draft` или `historia_com_tarefa_em_execucao`.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Архивирует черновую историю (RN-727)
      tags:
        - backlog
  /projects/{projectId}/stories/{storyId}/return:
    post:
      description: >-
        История уходит из очереди предложений, а причина становится сообщением,
        закреплённым в сессии PO, — тот же шаблон, что и при возврате gate к
        dev. Если PO этой сессии больше не запущен, возврат всё равно
        записывается: это решение пользователя, и оно не зависит от того,
        слушает ли агент.
      operationId: BacklogController_return
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: storyId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnStoryDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Возвращает отклонённую историю PO с указанием причины
      tags:
        - backlog
  /projects/{projectId}/stories/{storyId}/title:
    patch:
      description: >-
        Только история `draft` без задачи в работе (`in_progress`/`in_review`).
        Пишет `backlog.story_updated` с прежним и новым заголовком. Та же роль,
        что и у других записей backlog (продвижение/возврат).
      operationId: BacklogController_updateTitle
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: storyId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoryTitleDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResponseDto'
        '400':
          description: Пустой заголовок или длиннее 200 символов.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '409':
          description: >-
            Именованный отказ (`reason`): `historia_arquivada`,
            `historia_nao_draft` или `historia_com_tarefa_em_execucao`.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Исправляет заголовок черновой истории (RN-727)
      tags:
        - backlog
  /projects/{projectId}/stories/promote:
    post:
      description: >-
        Шаг человека, который режим `manual` (по умолчанию начиная с Фазы 12c)
        возвращает пользователю: до продвижения НИ ОДНА задача истории не может
        быть взята ни одним dev agent. Продвижение высвобождает пакет задач
        сразу и будит простаивающих агентов модуля (Фаза 12b). Пакет НЕ является
        «всё или ничего» — то, что не прошло, возвращается как `failed` с
        причиной, а то, что прошло, продвигается.
      operationId: BacklogController_promote
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteStoriesDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoteStoriesResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Продвигает предложенные PO истории в `ready`
      tags:
        - backlog
  /projects/{projectId}/tasks/{taskId}/gates/{gate}/resume:
    post:
      description: >-
        Цикл gate, застрявший более чем на 2 ч, паркуется, а не перезапускается
        сам (ADR 0207). Это жест человека, который его возобновляет.
      operationId: GateResumeController_resume
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: taskId
          required: true
          in: path
          schema:
            type: string
        - name: gate
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Роль ниже `developer` в проекте.
        '409':
          description: 'Цикл не припаркован — тело с `reason: "gate_nao_estacionado"`.'
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Возобновляет припаркованный цикл gate
      tags:
        - gates
  /projects/{projectId}/terminal-ticket:
    post:
      description: >-
        Тот же сокет `/runner`, тот же топик, роль "terminal" — тот, кто ВИДИТ
        терминал (сама команда действительно выполняется, только если подключён
        runner). Действует для любого режима проекта.
      operationId: RunnerTicketsController_terminalTicket
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerTicketResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не найден.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Выпускает одноразовый тикет для вкладки Терминал в вебе
      tags:
        - projects
  /runner-releases/binary:
    get:
      description: >-
        Прокси GitHub Releases — `platform` принимает только linux-x64,
        linux-arm64, darwin-arm64. Без аутентификации: бинарный файл не секрет.
        Байты сверяются с `checksums.txt` той же Release до того, как что-либо
        будет отдано (ADR 0149, RN-525); маршрут НЕ проверяет подпись манифеста
        — это целостность, а не происхождение, и подпись проверяет `install.sh`.
      operationId: RunnerReleasesController_binary
      parameters: []
      responses:
        '200':
          description: >-
            Бинарный файл runner потоком, с sha256, уже сверенным с манифестом.
            Не JSON: `Content-Type: application/octet-stream`. Заголовок
            `Content-Digest` повторяет сверенный хеш (RFC 9530).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '502':
          description: >-
            Именованный отказ — никогда байты с предупреждением. Тело содержит
            `motivo`: `plataforma_nao_publicada`, `release_sem_manifesto`,
            `manifesto_nao_cobre_a_plataforma`, `manifesto_ilegivel`,
            `download_falhou` или `hash_divergente`.
      summary: >-
        Скачивает автономный бинарный файл локального runner для запрошенной
        платформы
      tags:
        - infrastructure
  /runner/projects:
    get:
      description: >-
        Аутентифицируется МАШИННЫМ ключом устройства (ADR 0154) — НИКОГДА JWT
        сессии и никогда учётными данными, привязанными к проекту, на которые
        отвечает 403. Возвращает проекты в `execution_mode: "runner"`, в которых
        владелец ключа достигает как минимум `developer` (тот же минимум, что и
        у `POST .../runner-ticket`), с именем папки и состоянием проверки
        каждого. Агент спрашивает, а не сканирует диск: база машины принадлежит
        пользователю и может содержать папки, не являющиеся проектами.
      operationId: RunnerProjectsController_listRunnerProjects
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunnerProjectResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: >-
            Предъявленные учётные данные привязаны к проекту — этот маршрут
            требует машинного ключа устройства.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: >-
        Перечисляет проекты в режиме "runner", которые обслуживает этот
        локальный агент
      tags:
        - projects
  /users/me/credentials:
    get:
      description: >-
        Роль не требуется: учётные данные относятся к тому, кто вызвал, а не к
        рабочему пространству или проекту. Охватывает ключи LLM и токены git в
        одном списке.
      operationId: CredentialsController_list
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCredentialResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перечисляет собственные учётные данные текущего пользователя
      tags:
        - credentials
    post:
      description: >-
        Upsert по (пользователь, провайдер). Ключ шифруется envelope-шифрованием
        до того, как коснётся базы данных, а ответ несёт только ПРОЕКЦИЮ —
        никогда сам секрет, даже зашифрованный.
      operationId: CredentialsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCredentialDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCredentialResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Регистрирует или заменяет API-ключ провайдера
      tags:
        - credentials
  /users/me/credentials/{provider}:
    delete:
      description: 'Идемпотентно: удаление несуществующего тоже отвечает `{ ok: true }`.'
      operationId: CredentialsController_remove
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            example: anthropic
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Удаляет учётные данные провайдера
      tags:
        - credentials
  /users/me/credentials/{provider}/test:
    post:
      description: >-
        Проверка — явное действие, отдельное от регистрации (ADR 0050): api
        расшифровывает секрет, вызывает провайдера и возвращает ТОЛЬКО вердикт —
        ключ никогда не возвращается, даже частично. Отвечает 200 для всех трёх
        исходов, потому что запрос был обработан; `refused` — это исход, а не
        ошибка протокола. 404, когда нет учётных данных для (пользователь,
        провайдер), — тогда и проверять нечего.
      operationId: CredentialsController_test
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            example: openrouter
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialTestResultResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '404':
          description: Нет учётных данных для этого провайдера.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Проверяет УЖЕ сохранённые учётные данные у провайдера
      tags:
        - credentials
  /users/me/git-credentials:
    post:
      description: >-
        Собственный путь, а не `users/me/credentials`, потому что тело другое
        (`token`, а перечисление провайдеров — `github`/`gitlab`). Токен
        шифруется и сохраняется без предварительной проверки (ADR 0050); чтобы
        проверить его — `POST /users/me/credentials/{provider}/test`. Чтение,
        удаление и проверка переиспользуют маршруты `users/me/credentials` — это
        та же таблица.
      operationId: GitCredentialsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterGitCredentialDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCredentialResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Регистрирует токен git (зашифрованный, без проверки)
      tags:
        - credentials
  /users/me/machine-device-keys:
    get:
      description: >-
        На уровне учётной записи, без проекта в пути (RN-611): установка в одну
        строку создаёт машинный ключ до появления любого проекта, а все
        остальные списки — по проекту. Возвращает ТОЛЬКО машинные ключи
        (`especie: "maquina"`, `projectId: null`) и ТОЛЬКО ключи вызывающего —
        ключи проекта остаются в списке своего проекта, и никто не видит ключи
        другого пользователя (RN-519). Отозванные ключи ВКЛЮЧЕНЫ: регистрация
        нового машинного ключа отзывает предыдущий (RN-552), и именно в этом
        списке это видно. `lastUsedAt` — записанное использование, никогда не
        живое соединение; null означает, что ключ ни разу не использовался.
      operationId: MachineDeviceKeysController_listMachineDeviceKeys
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunnerDeviceKeyListResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: >-
        Перечисляет собственные МАШИННЫЕ ключи устройств аутентифицированного
        пользователя
      tags:
        - users
  /users/me/machine-device-keys/{deviceKeyId}:
    delete:
      description: >-
        Идемпотентно — повторный отзыв не является ошибкой. Тот же отзыв, что и
        `DELETE /projects/{projectId}/runner-device-keys/{deviceKeyId}`: он
        также разрывает ЖИВЫЕ соединения, открытые с этим ключом, во ВСЕХ
        проектах (RN-520/RN-543). Начиная с RN-685 (ADR 0201) целью является
        КЛЮЧ: другой runner того же пользователя, подключённый с PAT или другим
        ключом, остаётся. Ещё не использованные тикеты ключа аннулируются. Если
        проектов ещё нет, разрывать нечего. Ключ ПРОЕКТА, несуществующий ключ и
        ключ другого пользователя получают один и тот же 404.
      operationId: MachineDeviceKeysController_revokeMachineDeviceKey
      parameters:
        - name: deviceKeyId
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Ключ отозван. Без тела.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '404':
          description: >-
            Ни один машинный ключ с этим id не принадлежит вызывающему (он не
            существует, является ключом проекта или чужим — один ответ для
            всех).
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: >-
        Отзывает один из собственных МАШИННЫХ ключей устройств
        аутентифицированного пользователя
      tags:
        - users
  /users/me/preferences:
    get:
      operationId: UserPreferencesController_get
