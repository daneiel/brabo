            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 需要在 workspace 上拥有 `owner`。
        '404':
          description: 批次中有某个 id 不存在。
        '422':
          description: >-
            激活 OpenRouter 免费路由别名（`~…`）——`code:
            "alias_de_roteamento_livre"`，并附被拒绝的
            `modelIds`。整批都会被拒绝。停用一个别名始终允许（AT-271，RN-679）。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 在选择器中开启或关闭模型（批量）
      tags:
        - llm
  /workspaces/{workspaceId}/models/catalog:
    get:
      description: >-
        策展界面。同步发现的模型以 `isActive: false` 进入，在有人激活它之前只出现在这里；从提供商消失的模型会带有
        `availability: "unavailable"`，且绝不删除，因为 binding 和成本历史都指向它。`isActive` 是针对此
        workspace 的（ADR 0049）；`availability` 是全局的，因为它是同步在提供商处观测到的。
      operationId: ModelsController_catalog
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  local:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/ModelComCuradoriaResponseDto'
                  cloud:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/ModelComCuradoriaResponseDto'
                example:
                  local:
                    ollama: []
                  cloud:
                    anthropic: []
                    openai: []
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在 workspace 上的角色不足。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 列出整个目录，包括未激活和不可用的模型
      tags:
        - llm
  /workspaces/{workspaceId}/models/sync:
    post:
      description: 与 engine 调度的内部路由相同的用例——策展界面的刷新按钮没有自己的路径，因此绝不会出现两个可能产生分歧的对账。
      operationId: ModelsController_sync
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncModelCatalogResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 需要在 workspace 上拥有 `owner`。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 立即强制执行定期任务所做的目录同步
      tags:
        - llm
  /workspaces/{workspaceId}/models/uses:
    post:
      description: >-
        没有任何目录会公布的维度：“适合写代码”不是任何提供商声明的能力，而是运营者的意见——且仅适用于此 workspace（ADR
        0049）。与激活相互独立的维度：标记某种用途不会在选择器中开启模型，更改用途也不会关闭已开启的模型。用途列表会替换之前的列表。
      operationId: ModelsController_uses
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModelUsesDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelComCuradoriaResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 需要在 workspace 上拥有 `owner`。
        '404':
          description: 批次中有某个 id 不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 标记 workspace 将每个模型用于什么（批量）
      tags:
        - llm
  /workspaces/{workspaceId}/owner-of-record:
    put:
      description: >-
        记录所有者是 `createdBy`：代理花费的是谁的 LLM 凭据、代理操作使用的是谁的 git
        凭据（RN-058），以及花费报告归谁所有（RN-060）。它不授予授权——授权由角色决定。目标必须已经是该 workspace 的
        `owner`（否则返回 409
        `titular_precisa_ser_owner`）。从提交那一刻起，代理回合会查找新记录所有者的凭据；如果他们没有该模型提供商的凭据，回合会以该提供商现有的“没有登记凭据”结果结束——此路由不会事先检查。任何
        `owner` 都可以调用，包括为另一个所有者调用。转给当前的记录所有者是空操作。
      operationId: WorkspacesController_transferOwnership
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在 workspace 中的角色不足。
        '404':
          description: workspace 不存在或对调用方不可见。
        '409':
          description: '`titular_precisa_ser_owner`：目标不是该 workspace 的 `owner`。'
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 转移 workspace 的记录所有者
      tags:
        - workspaces
  /workspaces/{workspaceId}/project-folders:
    get:
      description: >-
        Mounted 模式的文件夹选择器，由 api 而不是 runner 提供（RN-504）。严格限定在
        `BRABO_PROJECTS_BASE` 内（ADR 0141）：`path` 是可选的，默认为基目录本身，任何在其之外的 `path`
        都返回 `400`——这是格式错误的请求，而不是权限问题，因为没有任何角色能浏览基目录之外的内容。


        刻意设限：只列目录，最多 500 个（在截断之前排序，并用 `truncado`
        说明），绝不递归，排除以点开头的条目，符号链接只报告而绝不跟随。被略去的内容会被计数（`arquivos`、`simbolicos`），这样满是代码的文件夹绝不会看起来是空的。


        没有配套的 POST：创建文件夹属于物化挂载 workspace 的过程，绝不属于选择器。
      operationId: WorkspacesController_listProjectFolders
      parameters:
        - name: path
          required: false
          in: query
          description: >-
            要列出的绝对路径。省略即基目录本身。必须位于 `BRABO_PROJECTS_BASE` 内；`..`、`.`
            和相对路径会被直接拒绝，而不是被解析。
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFoldersResponseDto'
        '400':
          description: 路径在项目基目录之外，或格式错误。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在 workspace 中的角色不足。
        '404':
          description: workspace 不存在或对调用方不可见。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 列出项目基目录内某个文件夹的子文件夹
      tags:
        - workspaces
  /workspaces/{workspaceId}/projects:
    get:
      operationId: WorkspacesController_listProjects
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在 workspace 中的角色不足。
        '404':
          description: workspace 不存在或对调用方不可见。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 列出 workspace 的项目
      tags:
        - workspaces
    post:
      operationId: WorkspacesController_createProjectInWorkspace
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在 workspace 中的角色不足。
        '404':
          description: workspace 不存在或对调用方不可见。
        '409':
          description: 该 workspace 中已存在使用此 slug 的项目。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 在 workspace 内创建项目
      tags:
        - workspaces
  /workspaces/{workspaceId}/projects-base:
    get:
      description: >-
        运营者机器上 api 和 engine 容器都能看到的那个唯一文件夹，按身份挂载（ADR
        0141）。`null`——一种正常状态，绝不是错误——表示此安装没有 `BRABO_PROJECTS_BASE`，因此项目向导完全不能提供
        Mounted 模式。每个 workspace 的值都相同：它是安装配置，`workspaceId` 只用于限定授权范围。


        `brokerConfigurado` 回答同一问题的另一半：`container` 和 `mounted` 只通过 broker
        启动容器（ADR 0144），因此没有它时向导不会预选 Mounted，而是提供 Runner（ADR 0161，RN-573）。
      operationId: WorkspacesController_getProjectsBase
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsBaseResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在 workspace 中的角色不足。
        '404':
          description: workspace 不存在或对调用方不可见。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: Mounted 模式项目的基目录
      tags:
        - workspaces
  /workspaces/{workspaceId}/projects-status:
    get:
      description: workspace 中每个有阻塞任务的项目一行——用一次查询为仪表盘侧边栏的状态点提供数据，而不是对 backlog 调用 N 次。
      operationId: WorkspacesController_getProjectsStatus
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectBlockedStatusResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在 workspace 中的角色不足。
        '404':
          description: workspace 不存在或对调用方不可见。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 每个项目的阻塞任务数
      tags:
        - workspaces
  /workspaces/{workspaceId}/projects-summary:
    get:
      description: >-
        workspace 中每个项目一行，包含 git 提供商、置备状态、预算、最近活动、等待提升的
        story，以及决定代理名单的事实（RN-090）。


        与 `projects-status` 同样的思路，只是高了一层：卡片网格是一次 workspace 读取，而不是 N
        次项目读取。之前的做法每张卡片要发起七个轮询查询，有 23 个项目时仅仪表盘就突破了 300 次/分钟的速率限制。
      operationId: WorkspacesController_getProjectsSummary
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectCardSummaryResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在 workspace 中的角色不足。
        '404':
          description: workspace 不存在或对调用方不可见。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 一次调用拿到仪表盘卡片渲染所需的一切
      tags:
        - workspaces
  /workspaces/{workspaceId}/spend-report:
    get:
      description: >-
        面向所有者的视图。提供商维度回来了（ADR
        0076，RN-186），并且在这里而不是在成员的路由上，因为按提供商细分就是按凭据细分——而凭据是付钱的人的事（RN-060）。补充
        `credential-spend`，后者继续回答账单问题（按月，并与当前存在的密钥对应）。人和代理也按 `actor_kind`
        分成单独的块。以天为单位的滑动窗口，每日序列是稠密的——没有花费的日子以零出现，否则迷你图会在节奏上说谎。
      operationId: SpendController_getWorkspaceSpendReport
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
        - name: dias
          required: false
          in: query
          description: 滑动窗口。默认 30，最大 180。
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSpendReportResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 需要在 workspace 上拥有 `owner`。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 按模型、提供商、项目、参与者和天细分 workspace 的花费
      tags:
        - llm
  /workspaces/{workspaceId}/summary:
    get:
      description: 项目数、本月花费过 token 的代理以及本月花费——为项目仪表盘的摘要行提供数据。
      operationId: WorkspacesController_getSummary
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSummaryResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在 workspace 中的角色不足。
        '404':
          description: workspace 不存在或对调用方不可见。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: workspace 汇总摘要
      tags:
        - workspaces
  /workspaces/{workspaceId}/tool-router:
    put:
      description: >-
        默认开启。开启且回合模型来自 OpenRouter 时，拥有两个或更多工具的代理步骤会先询问 Jev
        哪个工具合适，聊天模型只会被提供该工具和上一个工具。Jev 从不批准或拒绝任何东西：需要批准的操作仍然需要批准。Jev
        的任何失败都会回落到整个目录。关闭它会停止对 Jev 的所有调用，其成本也随之停止。
      operationId: WorkspacesController_setToolRouter
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetToolRouterDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在 workspace 中的角色不足。
        '404':
          description: workspace 不存在或对调用方不可见。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 为 workspace 开启或关闭 Jev 工具路由
      tags:
        - workspaces
  /workspaces/{workspaceId}/unread-events:
    post:
      description: >-
        铃铛的抽屉，面向整个 workspace（RN-091）。每个游标说明该项目已读到哪个 `seq`，响应携带每个项目最近会话中在此之后的内容。


        **之所以用 POST，是因为它是唯一带请求体的动词，而不是因为它改变状态。**
        服务器不知道每个读者停在哪里：“读到这里”是存储在浏览器中的每个项目一个
        `seq`，并且（刻意地）没有标记为已读的端点。因此截止点需要随请求传递，而这样的对有几十个——放在查询字符串中会变成很长的
        URL，代理会截断它，还会把用户的项目 id 写进访问日志。该路由是幂等的且没有副作用：它返回 `200`，绝不返回 `201`。


        取代了抽屉打开时每个项目一次的请求——23 个项目要花 286 次/分钟，而限制是 300。
      operationId: WorkspacesController_getUnreadEvents
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnreadEventsDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectUnreadEventsResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在 workspace 中的角色不足。
        '404':
          description: workspace 不存在或对调用方不可见。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 一次调用获取多个项目中的未读事件
      tags:
        - workspaces
info:
  title: Brabo API
  description: >-
    Brabo API。除了四个明确记录了不同 `content-type` 的端点（两个 SSE 端点、指标端点，以及会重定向的 OAuth
    回调）之外，每个端点都返回 JSON。


    ## 认证


    访问令牌是一个 **15 分钟有效的 EdDSA JWT**，通过

    `Authorization: Bearer <token>` 出示。公钥位于

    `GET /.well-known/jwks.json`。


    refresh **不是** JWT：它是一个不透明令牌，存放在

    `httpOnly` cookie（`brabo_refresh`、`Path=/auth`、`SameSite=Strict`）中，

    从不出现在任何响应体中。`POST /auth/refresh` 和

    `POST /auth/logout` 读取该 cookie，并要求 `X-CSRF-Token` 头

    与 `brabo_csrf` cookie 一致。


    **轮换是强制的。** 每次 refresh 都会消耗所出示的令牌并

    签发另一个。重复出示已被消耗的令牌是被盗的特征，

    会撤销整个令牌族——包括合法的会话。一个

    同时发起两次并发 refresh 的客户端会把自己踢下线；请只保留一个进行中的

    调用。


    `/internal/*` 路由是 api ↔ engine 之间的接口，位于 **JWT 之外**：

    它们要求带有共享机密的 `X-Brabo-Service-Token` 头。

    用户令牌打不开其中任何一个。


    ## 错误


    NestJS 默认格式：`{ "statusCode": number, "message": string | string[], "error":
    string }`。


    | 代码 | 何时 |

    |---|---|

    | `400` | 请求体无效——`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
    运行，因此未知字段也会失败 |

    | `401` | 没有令牌、令牌已过期或凭据无效 |

    | `403` | 已认证但没有 RBAC 要求的角色，或服务令牌错误 |

    | `404` | 资源不存在**或**对调用方不可见 |

    | `409` | 状态冲突——无效的会话状态转换、资源已存在 |

    | `429` | 速率限制或渐进式锁定 |


    认证路由对不存在的邮箱、错误的密码和被锁定的账户

    **刻意给出无法区分的**响应：相同的响应体、相同的状态码、相同的

    耗时。这正是防止账户枚举的手段，而不是诊断上的

    缺陷。


    ## 速率限制


    基于 Postgres 的滑动窗口：每 60 秒每个用户 300 次请求、每个 IP 600 次请求，

    可配置。`@Public()` 路由和服务路由**豁免**——保护

    `/auth/*` 的是渐进式锁定，而不是速率限制。
