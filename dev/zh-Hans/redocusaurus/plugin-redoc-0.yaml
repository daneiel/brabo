        estimated:
          type: boolean
          example: false
          description: 仅在 `done` 中。当提供商没有返回计数、成本是估算出来的时候为 `true`——这个数字的价值较低，界面需要能够说明这一点。
        message:
          type: string
          example: session budget exhausted
          description: 仅在 `error` 和 `metering_failed` 中。
