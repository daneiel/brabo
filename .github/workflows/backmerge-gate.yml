name: backmerge-gate

# Check required em TODO PR: o destino está travado aguardando retropropagação?
# Fonte da política: docs/explanation/branching-policy.md
#
# `hotfix/` entra direto em `main` porque incidente não espera a escada. Isso
# deixa `qa` e `dev` sem a correção — e o próximo release a DESFAZ, em silêncio.
# Este check impede que qualquer coisa suba enquanto a correção não descer.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: backmerge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conferir:
    name: Backmerge gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Sem `if:` no job — check required indexado por sha que não roda deixa
      # veredito velho colado, e aqui isso liberaria merge durante trava.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Histórico completo: a higiene do gate usa `merge-base --is-ancestor`
          # para perguntar se o hotfix JÁ desceu, e essa pergunta não tem
          # resposta confiável num clone raso.
          fetch-depth: 0
          persist-credentials: false

      - name: Buscar as permanentes
        run: |
          set -euo pipefail
          # O gate é lido SEMPRE da `main`, nunca da branch do PR: ler a cópia
          # que veio junto num backmerge daria estado velho, justamente durante
          # a cadeia em que ele muda a cada merge.
          #
          # `qa` e `dev` vêm junto porque a trava é CONFERIDA contra elas: um
          # registro velho que sobreviveu a uma promoção não pode travar o
          # repositório para sempre.
          git fetch --no-tags --quiet origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/qa:refs/remotes/origin/qa' \
            '+refs/heads/dev:refs/remotes/origin/dev'

      - name: Consultar o gate
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_MESMO_REPO: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/backmerge-gate.ts
