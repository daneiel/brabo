        - agents
    post:
      description: >-
        以 `offered` 状态诞生，与代理自己的 `offer_handoff` 完全一样——唯一的区别是由谁决定。`toAgent`
        必须在可寻址目录中（区域 lead 或没有区域的代理）；子代理或未知 slug 会以 400 拒绝。每个（项目，目标）最多一个待处理提议：见
        `desfecho`（ADR 0182，RN-635）。
      operationId: AgentsController_requestManual
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestManualHandoffDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaDeHandoffResponseDto'
        '400':
