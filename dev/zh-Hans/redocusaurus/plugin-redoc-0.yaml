  /runner-releases/binary:
    get:
      description: >-
        GitHub Releases 代理——`platform` 只接受
        linux-x64、linux-arm64、darwin-arm64。无需认证：二进制文件不是机密。在返回任何内容之前，字节会与同一
        Release 的 `checksums.txt` 核对（ADR
        0149，RN-525）；该路由不验证清单的签名——这是完整性而非来源，验证签名的是 `install.sh`。
      operationId: RunnerReleasesController_binary
      parameters: []
      responses:
        '200':
          description: >-
            以流方式返回 runner 二进制文件，其 sha256 已与清单核对。不是 JSON：`Content-Type:
            application/octet-stream`。`Content-Digest` 头重复已核对的哈希（RFC 9530）。
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '502':
          description: >-
            具名拒绝——绝不返回带警告的字节。响应体带有
            `motivo`：`plataforma_nao_publicada`、`release_sem_manifesto`、`manifesto_nao_cobre_a_plataforma`、`manifesto_ilegivel`、`download_falhou`
            或 `hash_divergente`。
      summary: 为所请求的平台下载本地 runner 的独立二进制文件
      tags:
        - infrastructure
  /runner/projects:
    get:
      description: >-
        通过机器设备密钥认证（ADR 0154）——绝不通过会话 JWT，也绝不通过绑定到项目的凭据，后者返回 403。返回处于
        `execution_mode: "runner"` 的项目，其中密钥所有者至少拥有 `developer`（与 `POST
        .../runner-ticket`
        的最低要求相同），并附带每个项目的文件夹名称和验证状态。代理会询问而不是扫描磁盘：机器的基目录属于用户，其中可能有并非任何项目的文件夹。
      operationId: RunnerProjectsController_listRunnerProjects
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunnerProjectResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 所出示的凭据绑定到某个项目——此路由需要机器设备密钥。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 列出此本地代理所服务的 “runner” 模式项目
      tags:
        - projects
  /users/me/credentials:
    get:
      description: 无需角色：凭据关乎调用者本人，而不是某个 workspace 或项目。在同一列表中涵盖 LLM 密钥和 git 令牌。
      operationId: CredentialsController_list
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCredentialResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 列出当前用户自己的凭据
      tags:
        - credentials
    post:
      description: 按（用户，提供商）upsert。密钥在接触数据库之前通过信封加密进行加密，响应只携带投影——绝不包含机密，即使是加密后的也不包含。
      operationId: CredentialsController_create
      parameters: []
      requestBody:
        required: true
