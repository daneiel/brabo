                $ref: '#/components/schemas/ProjectGitRemoteResponseDto'
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '404':
          description: >-
            У проекта нет созданного репозитория, или у владельца рабочего
            пространства нет зарегистрированных учётных данных для провайдера
            репозитория.
      security:
        - service-token: []
      summary: Рабочий remote проекта для fetch и push
      tags:
        - internal
  /internal/projects/{projectId}/mirror-sync-result:
    post:
      description: >-
        Вызывается только engine, после того как runner отправляет
        `mirror_sync_result` по каналу, — ТОТ ЖЕ путь, что и у
        `workspace_confirm` (runner → канал → engine → api), никогда не второй
        механизм: engine сообщает, а не пишет в таблицу. Это ТЕЛЕМЕТРИЯ, а не
        доменное событие: никогда не `session_events` (у раунда зеркала нет
        сессии, а `session_id` — `NOT NULL`, то же рассуждение, что сделало
        `rag_searches` таблицей) и никогда не `proposed_action` (запись зеркала
        — это конфигурация, объявленная пользователем, а не агент, просящий
        действовать). Исход определяет `ok` — никогда не наличие счётчика или
        сообщения: раунд, скопировавший 0 файлов, нормален и не должен быть
        неотличим от раунда, который не запускался. Запись никогда не ломает то,
        что измеряет: копирование уже завершено, когда это вызывается, и engine
        только логирует отказ здесь. Проект, у которого тем временем очистили
        назначение, ВСЁ РАВНО записывает — раунд состоялся, и его ошибка обычно
        и объясняет, что пошло не так.
      operationId: InternalProjectsController_mirrorSyncResult
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MirrorSyncResultInternalDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MirrorSyncResultResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '404':
          description: Проект не существует.
      security:
        - service-token: []
      summary: Локальный агент сообщает исход раунда зеркала (RN-517)
      tags:
        - internal
  /internal/projects/{projectId}/module-contracts:
    get:
      description: >-
        Одна запись на модуль ТЕКУЩЕГО module_map: что он потребляет
        (`dependeDe`, `dependsOn` карты) и что предоставляет (`expoe`, из
        текущего `artifact.module_contracts` Архитектора, или `null`, если
        ничего не объявлено). Это то, что читает dev agent вместо того, чтобы
        открывать worktree другого модуля (ADR 0200). Проект без контракта
        отвечает `200` со `status: sem_contratos`.
      operationId: InternalProjectsController_moduleContracts
      parameters:
        - name: projectId
          required: true
          in: path
