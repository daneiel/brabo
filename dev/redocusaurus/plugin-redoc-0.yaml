servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
    service-token:
      type: apiKey
      in: header
      name: X-Brabo-Service-Token
  schemas:
    AcceptParallelizationDto:
      type: object
      properties:
        module:
          type: string
          example: api
          description: >-
            Nome do módulo, como aparece no `module_map`. Sobe um dev agent
            dedicado a ele, num worktree isolado.
      required:
        - module
    AceiteAutomaticoResponseDto:
      type: object
      properties:
        aceito:
          type: boolean
          example: true
        criterio:
          $ref: '#/components/schemas/CriterioDoAceiteResponseDto'
        motivo:
          type: string
          enum:
            - nao_e_po_para_arquiteto
            - oferta_nao_pendente
            - sem_regras_de_negocio
            - regras_sem_historia
            - repositorio_nao_local
            - credencial_de_git_no_projeto
            - autor_sem_papel
            - falhou
          example: regras_sem_historia
          description: >-
            Por que uma pessoa ainda precisa clicar. `falhou`: o sistema tentou
            e o aceite falhou — `handoff.auto_accept_failed` está no event log.
      required:
        - aceito
    AceiteResponseDto:
      type: object
      properties:
        message:
          type: string
          example: If the address is available, we've sent an email.
          description: >-
            Mensagem genérica, idêntica para endereço conhecido e desconhecido —
            ver a nota de enumeração na referência.
      required:
        - message
    ActivateExecutionDto:
      type: object
      properties:
        taskBudgetMicros:
          type: number
          example: 500000
          description: >-
            Orçamento por tarefa em micro-USD. Omitido usa o padrão do domínio
            (DEFAULT_TASK_BUDGET_MICROS).
        maxGateCorrections:
          type: number
          example: 3
          description: >-
            Quantas idas e voltas dev↔gate antes de a tarefa virar `blocked`. É
            o que impede um agente de gastar o orçamento num laço de correção.
        devAgentImpl:
          type: string
          enum:
            - real
            - noop
          example: real
          description: >-
            `noop` sobe os dev agents SEM LLM, para exercitar a infraestrutura
            de execução de ponta a ponta sem gastar tokens. Omitido usa `real`.
        terminalAllowPatterns:
          example:
            - Terminal(pnpm test:*)
            - Terminal(pnpm lint)
          description: >-
            Padrões liberados no `permissions.json` para os dev agents rodarem a
            suíte de testes. `deny` continua vencendo qualquer coisa listada
            aqui.
          type: array
          items:
            type: string
        originSessionId:
          type: string
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          description: >-
            Id da sessão de CHAT de onde veio o clique "ativar execução" — a
            sessão criativa/consultiva do Dev Lead/PO, nunca a de execução.
            Omitido (chamador legado, ex.: ativação pela Visão geral sem
            contexto de sessão) não fecha sessão nenhuma, como antes. Quando
            dado, ela é fechada no fim — mas só se não tiver handoff/ação/turno
            pendente (RN-135), e nunca se for a própria sessão de execução.
    ActorDto:
      type: object
      properties:
        kind:
          type: string
          enum:
            - user
            - agent
            - system
          example: agent
          description: Natureza de quem agiu.
        id:
          type: string
          example: dev-api
          description: >-
            O id do usuário quando `kind=user`; o slug do agente quando
