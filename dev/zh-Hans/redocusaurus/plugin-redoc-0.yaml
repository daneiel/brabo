      type: object
      properties:
        status:
          type: string
          enum:
            - provisioning
            - running
            - stopped
            - failed
            - removed
          example: provisioning
          description: 登记的内容，而不是 Docker 守护进程确认的内容——目前没有真正的编排器转换这张表（RN-243）。
        imageVersion:
