        `product_brief`（RN-406）——没有它会被拒绝：没有可验证的内容。自 ADR
        0185（RN-657）起，“我准备好了——需求已验证”的点击（`POST .../readiness`）会自行记录此事件，Web
        端不再调用此路由；保留它是为了那些就绪点击早于该 ADR 的会话。
      operationId: AgentsController_validateNecessityHandoff
