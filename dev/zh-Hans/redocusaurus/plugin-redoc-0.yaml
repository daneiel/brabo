            enum:
              - open
              - merged
              - closed
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodePullRequestListResponseDto'
        '400':
          description: 路径超出项目范围（RN-095）、ref 格式错误，或搜索词过短或过长。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 项目没有已置备的仓库，或 ref/路径/PR 不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
        '501':
          description: >-
            项目的提供商没有声明该操作的能力——`listTree`、`pullRequestDiff`、`blame`、`pullRequestsList`
            或 `branchesDetailed`。能力只有在契约测试套件验证后才会声明，因此这是合法的响应，而非缺陷。
      security:
        - bearer: []
      summary: 列出仓库的 PR/MR
      tags:
        - git
  /projects/{projectId}/code/pull-requests/{pullRequestId}/diff:
    get:
      description: >-
        `patch` 为 null
        用于区分提供商没有交付文本（二进制文件或补丁过大）与文本返回为空这两种情况。把两者混为一谈，界面就会说一个已更改的二进制文件没有变化。当文件列表超过上限时，`truncated`
        字段会发出提示。
      operationId: CodeController_diff
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: pullRequestId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeDiffResponseDto'
        '400':
          description: 路径超出项目范围（RN-095）、ref 格式错误，或搜索词过短或过长。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 项目没有已置备的仓库，或 ref/路径/PR 不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
        '501':
          description: >-
            项目的提供商没有声明该操作的能力——`listTree`、`pullRequestDiff`、`blame`、`pullRequestsList`
            或 `branchesDetailed`。能力只有在契约测试套件验证后才会声明，因此这是合法的响应，而非缺陷。
      security:
        - bearer: []
      summary: 返回 PR 的 diff，已在各提供商之间统一格式
      tags:
        - git
  /projects/{projectId}/code/search:
    get:
      description: >-
        搜索不是 git
        契约中的操作：它是在树和内容之上组合而成的，因此是唯一一个成本随仓库大小增长的读取。三项预算为其设限——遍历的目录数、打开的文件数和返回的匹配数——`truncated`
        表示它已停止。`filesScanned` 显示它产生的成本。
      operationId: CodeController_search
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: q
          required: true
          in: query
          description: 搜索词，2 到 200 个字符。
          schema:
            type: string
        - name: ref
          required: false
          in: query
          description: 分支、tag 或 sha。
          schema:
            type: string
        - name: path
          required: false
          in: query
          description: 要搜索的子树。缩小范围才能避免截断。
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSearchResponseDto'
        '400':
          description: 路径超出项目范围（RN-095）、ref 格式错误，或搜索词过短或过长。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 项目没有已置备的仓库，或 ref/路径/PR 不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
        '501':
          description: >-
            项目的提供商没有声明该操作的能力——`listTree`、`pullRequestDiff`、`blame`、`pullRequestsList`
            或 `branchesDetailed`。能力只有在契约测试套件验证后才会声明，因此这是合法的响应，而非缺陷。
      security:
        - bearer: []
      summary: 在仓库中搜索文本，带预算限制
      tags:
        - git
  /projects/{projectId}/code/tree:
    get:
      description: 按契约设计不递归：标签页按需导航，而请求大型仓库的整棵树正是本阶段禁止的流量放大器。当该层级超过条目上限时，`truncated` 会发出提示。
      operationId: CodeController_tree
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: ref
          required: false
          in: query
          description: 分支、tag 或 sha。缺省时使用仓库的默认分支。
          schema:
            type: string
        - name: path
          required: false
          in: query
          description: 要列出的目录。缺省或为空即根目录。
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeTreeResponseDto'
        '400':
          description: 路径超出项目范围（RN-095）、ref 格式错误，或搜索词过短或过长。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 项目没有已置备的仓库，或 ref/路径/PR 不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
        '501':
          description: >-
            项目的提供商没有声明该操作的能力——`listTree`、`pullRequestDiff`、`blame`、`pullRequestsList`
            或 `branchesDetailed`。能力只有在契约测试套件验证后才会声明，因此这是合法的响应，而非缺陷。
      security:
        - bearer: []
      summary: 列出仓库树的一个层级
      tags:
        - git
  /projects/{projectId}/container:
    get:
      description: >-
        当状态为 `sem_decisao` 时，项目容器不会启动，Code 标签页返回 409——这就是 RN-105 的
        gate。查看该状态所需的权限与查看项目相同，即 `viewer`。
      operationId: ContainersController_estado
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoDoContainerResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 项目容器的状态（当前的镜像决定）
      tags:
        - projects
  /projects/{projectId}/container/lifecycle:
    get:
      description: >-
        项目从未置备时为
        `null`——这是目前的常见情况，因为还没有真正的编排器转换这张表（RN-243/RN-267）。`status`/`imageVersion`/`resources`
        是登记的内容；`observado` 是 Docker 守护进程此刻报告的内容，经由 broker 查询（ADR
        0130）。两者绝不合并：从外部被杀掉的容器读起来是登记为 `running`、观测为 `exited`。当无法查看时，`observado`
        为 `null`，`naoObservado` 说明原因——它绝不继承登记状态（RN-468）。
      operationId: ContainersController_cicloDeVida
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: 登记的生命周期，或 `null`（从未置备）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CicloDeVidaDoContainerResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 项目容器的生命周期（登记状态）
      tags:
        - projects
  /projects/{projectId}/coverage:
    get:
      description: >-
        将项目的规则与 story 的 `businessRuleIds` 交叉比对。完全没有 story 的规则是一项发现——是 PO
        的待办项，而不是错误。
      operationId: BacklogController_coverage
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageReportResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 项目不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 计算业务规则 → story 的覆盖情况
      tags:
        - backlog
  /projects/{projectId}/events/{eventId}:
    get:
      description: 与按会话查找事件的路由不同：这里不知道会话。正是这一点让画像的证据标签落在正确的事件上，因为 Anamnese 的窗口跨越多个会话。
      operationId: AnamneseController_event
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: eventId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEventResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 项目、事件或版本不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 按 id 返回项目事件，并解析其所属会话
      tags:
        - anamnesis
  /projects/{projectId}/execution-mode:
    put:
      description: >-
        为已存在的项目迁移 `execution_mode`/`workspacePath`（RN-447..450，ADR 0111）——专用路由，与
        PATCH 分开，因为它编排的不只是写一个列：它把 permissions.json 移动到新的范围根目录，在离开 `container`
        模式时撤下容器生命周期记录，并且只要项目中有任何 dev agent 不处于空闲状态就拒绝（409），因为运行中的代理不会自行重新解析其
        worktree 位置。
      operationId: ProjectsController_convertExecutionModeRoute
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertExecutionModeDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 项目不存在或对调用方不可见。
        '409':
          description: 此项目的某个 dev agent 正在工作或卡住。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 转换项目的执行模式
      tags:
        - projects
  /projects/{projectId}/execution/activate:
    post:
      description: >-
        需要 `maintainer` 而非 `developer`，因为 dev agent 的 git 操作在 IAM 评估中继承激活者的角色——以
        developer 身份激活会让代理无法打开 PR。`module_map` 中的每个模块都会在隔离的 worktree 中获得一个代理。
      operationId: ExecutionController_activate
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateExecutionDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecucaoAtivadaResponseDto'
        '400':
          description: >-
            没有当前的 `module_map`（Architect 必须先定义模块），或项目存储的 workspace
            位置不一致——无法从中推导出在此初始化的 `permissions.json`（RN-478）。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 未找到项目、会话或任务。
        '409':
          description: >-
            项目还没有仓库（RN-582）：dev agent 在其 worktree
            中工作，因此什么都不会启动。消息会指明缺少什么——其接受会置备仓库的、到 Architect（或作为第二道门，到 Dev Lead）的
            handoff，或者当该 handoff 已被接受却没有留下仓库时，指向置备页面。另外：来源会话为 `consultiva`，会拒绝
            `execution.activated`（RN-097）。激活两次不是冲突：它通过
            `findActiveExecutionSession` 实现幂等，并在同一会话内重新激活。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 激活执行阶段并为每个模块启动一个 dev agent
      tags:
        - execution
  /projects/{projectId}/execution/session:
    get:
      description: >-
        最近的 `active` 会话，且已携带 `execution.activated`——与 `activate`
        决定是重新激活还是新建时使用的标准相同（RN-139）。没有执行在进行时为 `null`。它的存在让 Executors
        标签页不再从项目最近的会话推断这个会话，那会随会话变化而变化，界面中毫无线索。
      operationId: ExecutionController_getSession
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: 没有活跃执行时响应体为 `null`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 未找到项目、会话或任务。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 返回项目当前的执行会话，或什么也不返回
      tags:
        - execution
  /projects/{projectId}/git/{provider}/connect:
    get:
      description: 不重定向：返回 URL，由客户端决定何时让浏览器跳转。`state` 经 HMAC 签名，正是这一点防止回调被伪造。
      operationId: GitController_connect
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - github
              - gitlab
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitAuthorizeUrlResponseDto'
        '400':
          description: 提供商不在 `github`/`gitlab` 之列。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 项目不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 与 git 提供商开始 OAuth
      tags:
        - git
  /projects/{projectId}/git/{provider}/repository:
    post:
      description: >-
        同步执行：只有在整个引导过程（永久分支、保护规则、模板）运行完毕后才会返回响应——背后没有 worker
        也没有队列。它是幂等且可恢复的，因此失败后再次调用会从失败的步骤继续。通过 `GET /projects/:id/git/bootstrap`
        跟踪进度并读取失败原因。
      operationId: GitController_provision
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - local
              - github
              - gitlab
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionRepositoryDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionRepositoryResponseDto'
        '400':
          description: 提供商无效，或缺少凭据。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 项目不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 创建仓库并运行 Gitflow 引导
      tags:
        - git
  /projects/{projectId}/git/{provider}/repository/adopt:
    post:
      description: >-
        用 `getRepo`
        校验访问权限，并生成引导将要执行的计划（dry-run）——缺失的分支、缺失的保护规则、文件。不会在仓库上执行任何操作：之后通过
        `plan/approve` 或 `plan/skip` 做决定。重新接入同一个仓库会收敛（重新生成计划而不会重复记录）。
      operationId: GitController_adopt
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - local
              - github
              - gitlab
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptRepositoryDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptRepositoryResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 仓库存在，但已登记的凭据无法访问它。
        '404':
          description: 该仓库在提供商上不存在——请检查标识符。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 接入一个已有仓库，不创建任何东西
      tags:
        - git
  /projects/{projectId}/git/bootstrap:
    get:
      description: 当前处于哪一步、是否失败以及在哪里失败、尝试了多少次。逐步的细节来自专用会话中的 `bootstrap.step_*` 事件。
      operationId: GitController_getBootstrap
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoBootstrapStatusResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 项目不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 返回 Gitflow 引导状态
      tags:
        - git
  /projects/{projectId}/git/bootstrap/acknowledge-protection-failure:
    post:
      description: >-
        `protect_branches`
        在免费计划的私有仓库上会失败，向导会事先就此发出警告。没有这个出口，唯一的按钮是“重试”，而它总会因同样的原因失败——`provision_failed`
