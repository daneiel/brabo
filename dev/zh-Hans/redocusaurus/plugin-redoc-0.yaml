      security:
        - bearer: []
      summary: 移除某个提供商的凭据
      tags:
        - credentials
  /users/me/credentials/{provider}/test:
    post:
      description: >-
        检查是一个显式操作，与登记分开（ADR 0050）：api 解密机密、调用提供商，只返回裁决——密钥绝不会返回，哪怕是一部分。三种结果都返回
        200，因为请求已被处理；`refused` 是一种结果，不是协议错误。当（用户，提供商）没有凭据时返回 404——那时没有可测试的东西。
      operationId: CredentialsController_test
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            example: openrouter
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialTestResultResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '404':
          description: 此提供商没有凭据。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 用提供商检查已存储的凭据
      tags:
        - credentials
  /users/me/git-credentials:
    post:
      description: >-
        使用自己的路径，而不是 `users/me/credentials`，因为请求体不同（`token`，且提供商枚举为
        `github`/`gitlab`）。令牌经过加密并在未事先验证的情况下存储（ADR 0050）；如需验证，请调用 `POST
        /users/me/credentials/{provider}/test`。读取、移除和测试复用 `users/me/credentials`
        路由——它们是同一张表。
      operationId: GitCredentialsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterGitCredentialDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCredentialResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 登记一个 git 令牌（加密，不测试）
      tags:
        - credentials
  /users/me/machine-device-keys:
    get:
      description: >-
        账户级别，路径中没有项目（RN-611）：一行命令安装会在任何项目存在之前创建机器密钥，而其他所有列表都是按项目的。只返回机器密钥（`especie:
        "maquina"`，`projectId:
        null`），且只返回调用方的——项目密钥保留在其项目的列表中，任何人都看不到其他用户的密钥（RN-519）。已撤销的密钥也包含在内：登记新的机器密钥会撤销上一把（RN-552），而这个列表就是体现这一点的地方。`lastUsedAt`
        是一次记录的使用，绝不是活动连接；为空表示该密钥从未被使用。
      operationId: MachineDeviceKeysController_listMachineDeviceKeys
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunnerDeviceKeyListResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 列出已认证用户自己的机器设备密钥
      tags:
        - users
  /users/me/machine-device-keys/{deviceKeyId}:
    delete:
      description: >-
        幂等——再次撤销不是错误。与 `DELETE
        /projects/{projectId}/runner-device-keys/{deviceKeyId}`
        是同一种撤销：它还会断开用此密钥打开的活动连接，遍及所有项目（RN-520/RN-543）。自 RN-685（ADR
        0201）起，目标是密钥本身：同一用户用 PAT 或其他密钥连接的另一个 runner
        不受影响。该密钥尚未使用的票据会被作废。还没有项目时，就没有可断开的连接。项目密钥、不存在的密钥和其他用户的密钥都返回同样的 404。
      operationId: MachineDeviceKeysController_revokeMachineDeviceKey
      parameters:
        - name: deviceKeyId
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: 密钥已撤销。无响应体。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '404':
          description: 没有属于调用方且具有此 id 的机器密钥（它不存在、是项目密钥，或属于别人——一种回答涵盖所有情况）。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 撤销已认证用户自己的一把机器设备密钥
      tags:
        - users
