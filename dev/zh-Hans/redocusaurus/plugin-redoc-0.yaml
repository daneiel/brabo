    SetAgentAutonomyDto:
      type: object
      properties:
        agentId:
          type: string
          example: dev-api
          description: 代理的 slug。
        actionType:
          type: string
          enum:
            - terminal
            - git_commit
            - git_push
            - pr_open
            - spend
            - git_repo_create
            - git_branch_create
            - git_branch_protect
            - write_file
            - open_adr_pr
            - git_merge
            - open_infra_pr
            - instruction_patch
            - parallelize
            - raise_max_parallel
            - propose_execution_plan
            - assess_implementability
            - container_start
            - container_stop
            - container_remove
            - container_start_via_runner
            - '*'
          example: terminal
          description: >-
            操作类型，或 `"*"` 表示该代理的所有操作类型——即 ApprovalCard
            的“自动模式”（RN-153）。特定规则始终优先于通配符：记录 `terminal: deny` 时，即使已开启 `"*":
            auto_approve`，仍会拒绝终端操作。
        mode:
          type: string
          enum:
            - auto_approve
            - require_approval
            - deny
          example: auto_approve
          description: 该代理对此类型的自主权。不会覆盖 `permissions.json`：`deny` 中的模式无论代理有多少自主权都保持阻止。
      required:
        - agentId
        - actionType
        - mode
    SetAreaBudgetDto:
      type: object
      properties:
        limitUsd:
          type: object
          example: 20
          minimum: 0
          nullable: true
          description: >-
            区域的上限，以美元计——与项目/会话预算（`BudgetsController`）相同的美元输入、微美元输出约定。`null`
            清除上限：区域恢复为无限制，这也是从未设置过上限的区域的默认值。
      required:
        - limitUsd
    SetMaxParallelDto:
      type: object
      properties:
        maxParallel:
          type: number
          example: 4
          minimum: 1
          description: >-
            区域 lead 在会话中无需请求你授权即可拥有的代理数量。最小为
            1——零不表示“无限制”，而是无效配置，把它当作无限制会让一个笔误变成不受限制的花费。
      required:
        - maxParallel
    SetMirrorPathDto:
      type: object
      properties:
        mirrorPath:
          type: string
          nullable: true
          example: /home/you/mirrors/store
          description: >-
            用户机器上的绝对路径，本地代理会把项目工作复制到这里（RN-515，ADR 0147）。发送 `null`——该键是必需的，省略返回
            400——以清除目标并关闭镜像；`null` 是项目的正常状态，不是错误。只有 `mounted`/`runner` 项目可以有：在
            `container` 中，来源是本地代理看不到的服务端托管卷，请求会以 400 拒绝并说明这一原因。API
            只校验词法形态（绝对路径，不含 `..`/`.`，绝不是根目录、系统文件夹或与 Brabo
            自身检出目录重叠）以及来源↔目标循环的两个方向（目标不能位于 `workspacePath`
            内部，也不能包含它）——它从不触碰磁盘，因为它看不到目标所在的机器，与 `runner`
            模式完全一样（RN-423）。解析符号链接是本地代理负责的那一半防护，而不是这里。
      required:
        - mirrorPath
    SetModelBindingDto:
      type: object
      properties:
        modelId:
          type: string
          format: uuid
          example: 9b1c2d3e-4f50-4a61-8b72-0c3d4e5f6a7b
          description: 要固定到此范围的模型。必须存在于 `GET /models` 中。
        routingPreference:
          type: string
          enum:
            - price
            - throughput
            - latency
          nullable: true
          example: throughput
          description: >-
            中转平台如何选择服务该模型的上游（ADR 0166，RN-583）。缺省时，若新模型的提供商接受则保留已存储的值，否则清除；`null`
            清除它；为提供商未声明 `routingPreference` 能力（`GET
            /llm/provider-capabilities`）的模型设置值会以 422 拒绝。它随此 binding 一起传递：从不独立级联。
      required:
        - modelId
    SetModelsActiveDto:
      type: object
      properties:
        modelIds:
          example:
            - 9b1c2d3e-4f50-4a61-8b72-0c3d4e5f6a7b
          description: 要开启或关闭的模型。整批全有或全无。
          type: array
          items:
            type: string
            format: uuid
        isActive:
          type: boolean
          example: true
          description: '`true` 让模型出现在选择器中并能接收新的 binding。不改动 `availability`，那是同步在提供商处观测到的。'
      required:
        - modelIds
        - isActive
    SetModelUsesDto:
      type: object
      properties:
        modelIds:
          example:
            - 9b1c2d3e-4f50-4a61-8b72-0c3d4e5f6a7b
          description: 要标记的模型。整批全有或全无。
          type: array
          items:
            type: string
            format: uuid
        uses:
          type: array
          example:
            - codigo
            - analise
          description: >-
            完整的用途列表——替换之前的列表，而不是追加。空列表会取消全部标记。封闭词汇：词汇之外的用途会让调用失败，因为自由文本会在同一个过滤器中出现
            `code`、`coding` 和 `código`。
          items:
            type: string
            enum:
              - codigo
              - documentacao
              - analise
              - imagem
              - conversa
      required:
        - modelIds
        - uses
    SetProjectPermissionsDto:
      type: object
      properties:
        allow:
          example:
            - Terminal(pnpm test:*)
            - Terminal(pnpm lint)
          description: 自动批准的模式。
          type: array
          items:
            type: string
        deny:
          example:
            - Terminal(rm -rf *)
            - Terminal(git push --force*)
          description: 禁止的模式。`deny` 优先于 `allow`，也优先于代理的自主权。
          type: array
          items:
            type: string
        ask:
