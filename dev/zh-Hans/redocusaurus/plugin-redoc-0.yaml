          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEventResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目中的角色不足。
        '404':
          description: 项目或会话不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 按 id 返回日志事件
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}/execution/parallelize:
    post:
      description: >-
        受 dev 区域上限约束（RN-083）：在上限之内，代理会立即在自己的 worktree 中启动；超过上限时，响应是一个
        `proposed_action`，类型为 `parallelize`，等待你的决定，在你决定之前什么都不会启动。上限设为多少可在
        Settings 中按 lead 配置。
