        `product_brief` pedido por um clique em "Estou pronto — a necessidade
        está validada" é aceita em nome de quem clicou, com essa pessoa como
        ator e `implicito` no payload (RN-658, ADR 0185). O handoff do PO ao
        Arquiteto é aceito pelo SISTEMA quando o backlog está coberto (ao menos
        uma regra de negócio, nenhuma sem história) e o repositório é `local`
        sem credencial de git no projeto (RN-660, ADR 0186); `aceiteAutomatico`
