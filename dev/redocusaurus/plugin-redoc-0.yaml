    FirstAccountInternalDto:
      type: object
      properties:
        email:
          type: string
          example: voce@exemplo.dev
          description: >-
            O e-mail do owner, digitado no TTY. Normalizado antes de qualquer
            gravação; é o que o instalador grava no marcador dele, já que e-mail
            identifica e não é segredo.
        senha:
          type: string
          example: uma frase longa e minha
          description: >-
            Lida sem eco e confirmada pelo instalador. Usada e descartada —
            nunca gravada no `.env`, no marcador nem em log, e nunca gerada por
            código nenhum: não há caminho em que uma conta nasça com senha
            escolhida pelo script. O mínimo é a política do DOMÍNIO, o mesmo
            código que o cadastro usa; o tamanho máximo aqui é proteção do
            argon2id, não política.
        nome:
          type: string
          example: Fulana de Tal
          description: >-
            Nome de exibição. Omitido: o nome do workspace pessoal cai na parte
            local do e-mail (RN-410) — nada é inventado.
      required:
        - email
        - senha
    FirstAccountInternalResponseDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
