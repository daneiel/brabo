        Курация владельца, ПРИМЕНЯЕМАЯ ТОЛЬКО К ЭТОМУ РАБОЧЕМУ ПРОСТРАНСТВУ (ADR
        0049). Затрагивает только `isActive` — `availability` — это то, что
        синхронизация наблюдала у провайдера, оно глобально и здесь не меняется.
        Весь пакет или ничего: несуществующий id приводит к сбою вызова без
        применения какой-либо строки.
      operationId: ModelsController_activate
      parameters:
        - name: workspaceId
          required: true
          in: path
