    post:
      description: >-
        该 story 及其任务离开 backlog、覆盖、计划和认领；记录保留，`backlog.story_archived` 记录此事，以 PO
        为参与者（RN-727）。
      operationId: InternalSessionsController_archiveStoryRoute
      parameters:
        - name: storyId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveStoryInternalDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResponseDto'
        '400':
          description: 请求体无效。
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
        '404':
          description: story 不在此项目中。
        '409':
          description: >-
            具名拒绝（`reason`）：`historia_arquivada`、`historia_nao_draft` 或
            `historia_com_tarefa_em_execucao`。
      security:
        - service-token: []
      summary: 归档一个草稿 story
      tags:
        - internal
  /internal/sessions/{sessionId}/stories/{storyId}/complete:
    post:
      description: >-
        `businessRuleIds` 会追加到已关联的规则中；非空列表替换当前列表，省略的列表保持不变。写入后，story 按与创建 story
        相同的标准提升（`ready` 用于 `auto` 模式，`proposedReady` 用于 `manual` 模式）（RN-720）。
      operationId: InternalSessionsController_completeStoryRoute
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: storyId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteStoryInternalDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResponseDto'
        '400':
          description: 某个 business_rule_id 未引用已存在的规则。
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
        '404':
          description: story 不在此项目中。
        '409':
          description: story 已不再是 `draft`。
      security:
        - service-token: []
      summary: 补全一个已有的草稿 story，而不是重新创建
      tags:
        - internal
  /internal/sessions/{sessionId}/stories/{storyId}/update:
    post:
      description: >-
        仅限没有执行中任务的 `draft` story；以 PO 为参与者写入 `backlog.story_updated`（RN-727）。状态为
        `ready` 的也可以，前提是 `questionId` 引用了一个用户已回答的未决问题（RN-859）。
      operationId: InternalSessionsController_updateStoryRoute
      parameters:
        - name: storyId
          required: true
          in: path
          schema:
            type: string
      requestBody:
