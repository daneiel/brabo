    SessionResponseLanguageResponseDto:
      type: object
      properties:
        language:
          type: string
          example: pt-BR
          description: Эффективный язык.
        origin:
          type: string
          enum:
            - sessao
            - conta
            - detectado
            - interface
          example: interface
          description: >-
            Откуда пришёл `language`: `sessao` (закреплён в этой сессии) >
            `conta` (выбор в Учётной записи) > `detectado` (обнаружен И
            подтверждён) > `interface` (язык интерфейса).
        sessionOverride:
          type: string
          nullable: true
          example: null
        account:
          type: string
          example: automatico
          description: '`automatico` или код, выбранный в Учётной записи.'
        detected:
          type: string
          nullable: true
          example: null
        interfaceLocale:
          type: string
          enum:
            - pt-BR
            - en
            - ru
            - zh-Hans
          example: pt-BR
        detectionQuestion:
          type: string
          nullable: true
          example: es
          description: >-
            Язык, на который указывают ВАШИ недавние сообщения, когда экран
            должен СПРОСИТЬ, использовать ли его для ответов (RN-624), — `null`
            означает, что вопроса нет. Обнаружение никогда само не меняет
            предпочтение: это делает только ответ `confirm` на `POST
            /users/me/preferences/detected-language`. Никогда не спрашивается,
            когда эффективный язык происходит из явного выбора (эта сессия или
            Учётная запись), когда он уже является обнаруженным или когда вы
            ранее отказались от этого языка. По мере возможности: сбой
            обнаружения — это `null`, никогда не ошибка этого маршрута.
      required:
        - language
        - origin
        - sessionOverride
        - account
        - detected
        - interfaceLocale
        - detectionQuestion
    SetAgentAutonomyDto:
      type: object
      properties:
        agentId:
          type: string
          example: dev-api
          description: Slug агента.
        actionType:
          type: string
          enum:
            - terminal
            - git_commit
            - git_push
            - pr_open
            - spend
            - git_repo_create
            - git_branch_create
            - git_branch_protect
            - write_file
            - open_adr_pr
            - git_merge
            - open_infra_pr
            - instruction_patch
            - parallelize
            - raise_max_parallel
            - propose_execution_plan
            - assess_implementability
            - container_start
            - container_stop
            - container_remove
            - container_start_via_runner
            - '*'
          example: terminal
          description: >-
            Тип действия или `"*"` для КАЖДОГО типа действия этого агента —
            «автоматический режим» ApprovalCard (RN-153). КОНКРЕТНОЕ правило
            всегда побеждает подстановочное: запись `terminal: deny` при уже
            включённом `"*": auto_approve` всё равно запрещает терминал.
        mode:
          type: string
          enum:
            - auto_approve
            - require_approval
            - deny
          example: auto_approve
          description: >-
            Автономия этого агента для этого типа. НЕ переопределяет
            `permissions.json`: шаблон в `deny` остаётся заблокированным,
            сколько бы автономии ни было у агента.
      required:
        - agentId
        - actionType
        - mode
    SetAreaBudgetDto:
      type: object
      properties:
        limitUsd:
          type: object
          example: 20
          minimum: 0
          nullable: true
          description: >-
            Лимит в ДОЛЛАРАХ для области — то же соглашение «доллары на входе,
            микро-USD на выходе», что и у бюджетов проекта/сессии
            (`BudgetsController`). `null` СНИМАЕТ лимит: область снова без
            ограничений, что также является значением по умолчанию для области,
            у которой лимит никогда не задавался.
      required:
        - limitUsd
    SetMaxParallelDto:
      type: object
      properties:
        maxParallel:
          type: number
          example: 4
          minimum: 1
          description: >-
            Сколько агентов lead области может иметь в сессии БЕЗ запроса вашего
            разрешения. Минимум 1 — ноль не означает «без ограничений», а
            означает недопустимую конфигурацию, и трактовка его как
            неограниченного превратила бы опечатку в неограниченные расходы.
      required:
        - maxParallel
    SetMirrorPathDto:
      type: object
      properties:
        mirrorPath:
          type: string
          nullable: true
          example: /home/you/mirrors/store
          description: >-
            Абсолютный путь НА МАШИНЕ ПОЛЬЗОВАТЕЛЯ, куда локальный агент
            копирует работу проекта (RN-515, ADR 0147). Отправьте `null` — ключ
            ОБЯЗАТЕЛЕН, его отсутствие даёт 400, — чтобы очистить назначение и
            выключить зеркало; `null` — нормальное состояние проекта, а не
            ошибка. Оно может быть только у проектов `mounted`/`runner`: в
            `container` источник — управляемый том на сервере, которого
            локальный агент не видит, и запрос отклоняется с 400 с указанием
            этой причины. API проверяет ТОЛЬКО ЛЕКСИЧЕСКУЮ форму (абсолютный,
            без `..`/`.`, никогда корень, системная папка или пересечение с
            собственным checkout Brabo) плюс оба направления петли
            источник↔назначение (назначение не может быть внутри `workspacePath`
            или содержать его) — он никогда не касается диска, потому что не
            видит машину, на которой будет находиться назначение, ровно как в
            режиме `runner` (RN-423). Разрешение символических ссылок — половина
            защиты на стороне локального агента, а не эта.
      required:
        - mirrorPath
    SetModelBindingDto:
      type: object
      properties:
        modelId:
          type: string
          format: uuid
          example: 9b1c2d3e-4f50-4a61-8b72-0c3d4e5f6a7b
          description: >-
            Модель для закрепления в этой области действия. Должна существовать
            в `GET /models`.
        routingPreference:
          type: string
          enum:
            - price
            - throughput
            - latency
          nullable: true
          example: throughput
          description: >-
            Как ХАБ выбирает upstream, обслуживающий модель (ADR 0166, RN-583).
            ОТСУТСТВИЕ сохраняет хранимое значение, если провайдер новой модели
            его принимает, и очищает его в противном случае; `null` очищает;
            значение для модели, провайдер которой не объявляет возможность
            `routingPreference` (`GET /llm/provider-capabilities`), отклоняется
            с 422. Оно идёт ВМЕСТЕ с этим binding: само по себе никогда не
            каскадируется.
      required:
        - modelId
    SetModelsActiveDto:
      type: object
      properties:
        modelIds:
          example:
            - 9b1c2d3e-4f50-4a61-8b72-0c3d4e5f6a7b
          description: Модели для включения или выключения. Весь пакет или ничего.
          type: array
          items:
            type: string
            format: uuid
        isActive:
          type: boolean
          example: true
          description: >-
            `true` заставляет модель появиться в селекторе и позволяет ей
            получить новый binding. Не затрагивает `availability`, — то, что
            синхронизация наблюдала у провайдера.
      required:
        - modelIds
        - isActive
    SetModelUsesDto:
      type: object
      properties:
        modelIds:
          example:
            - 9b1c2d3e-4f50-4a61-8b72-0c3d4e5f6a7b
          description: Модели для пометки. Весь пакет или ничего.
          type: array
          items:
            type: string
            format: uuid
        uses:
          type: array
          example:
            - codigo
            - analise
          description: >-
            ПОЛНЫЙ список применений — заменяет предыдущий, а не добавляет к
            нему. Пустой список снимает все пометки. Закрытый словарь:
            применение вне его приводит к сбою вызова, потому что свободный
            текст дал бы `code`, `coding` и `código` в одном фильтре.
          items:
            type: string
            enum:
              - codigo
              - documentacao
              - analise
              - imagem
              - conversa
      required:
        - modelIds
        - uses
    SetProjectPermissionsDto:
      type: object
      properties:
        allow:
          example:
            - Terminal(pnpm test:*)
            - Terminal(pnpm lint)
          description: Автоматически одобряемые шаблоны.
          type: array
          items:
            type: string
        deny:
          example:
            - Terminal(rm -rf *)
            - Terminal(git push --force*)
          description: Запрещённые шаблоны. `deny` побеждает `allow` и автономию агента.
          type: array
          items:
            type: string
        ask:
          example:
            - Terminal(pnpm add *)
          description: Шаблоны, всегда требующие решения человека.
          type: array
          items:
            type: string
      required:
        - allow
        - deny
        - ask
    SetSessionResponseLanguageDto:
      type: object
      properties:
        language:
          type: string
          nullable: true
          example: en
          maxLength: 35
          description: >-
            Язык, на котором агенты отвечают ВАМ, только в ЭТОЙ сессии (RN-618)
            — другие участники никогда не затрагиваются. Любой код BCP-47,
            распознаваемый сервером, хранимый в каноническом виде. Отправьте
            `null` (или `automatico`) — ключ ОБЯЗАТЕЛЕН, — чтобы вернуться к
            наследованию из вашей Учётной записи.
      required:
        - language
    SetToolRouterDto:
      type: object
      properties:
        enabled:
          type: boolean
          example: false
          description: >-
            Выбирает ли Jev инструмент для каждого шага агента. Включено по
            умолчанию; действует, только когда модель хода от OpenRouter.
      required:
        - enabled
    SkippedBindingResponseDto:
      type: object
      properties:
        scope:
          type: string
          enum:
            - workspace
            - project
            - area
            - agent
            - session
          example: agent
        modelId:
          type: string
          example: 01JC4Z0000MODELO00000000001
        reason:
          type: string
          enum:
            - unavailable
            - sem_tool_calling
          example: unavailable
          description: >-
            `unavailable`: модель исчезла из каталога провайдера.
            `sem_tool_calling`: запрос от агента, а модель только для чата —
            каскад перепроверяет возможность на каждом уровне, чтобы молча не
            нарушить RN-040.
      required:
        - scope
        - modelId
        - reason
    SocketTicketResponseDto:
      type: object
      properties:
        ticket:
          type: string
          description: >-
            Непрозрачный одноразовый токен base64url. TTL 30 с и однократное
            использование: исчезает после первого успешного `connect/3` или по
            истечении.
        expiresAt:
          type: string
          example: '2026-08-09T12:00:30.000Z'
          description: Когда истекает тикет (ISO 8601).
      required:
        - ticket
        - expiresAt
    SpendLinhaResponseDto:
      type: object
      properties:
        chave:
          type: string
          example: anthropic/claude-sonnet-4
          description: >-
            Ключ группировки: имя модели, имя провайдера, id проекта, id актора
            или id сессии, в зависимости от того, в каком списке появляется
