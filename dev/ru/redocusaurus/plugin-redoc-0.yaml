    ProjectMirrorStateResponseDto:
      type: object
      properties:
        mirrorPath:
          type: object
          example: /home/you/mirrors/store
          nullable: true
          description: >-
            Назначение, объявленное СЕГОДНЯ (`projects.mirror_path`, RN-515).
            `null` означает, что у проекта нет зеркала, — НОРМАЛЬНОЕ состояние,
            и именно поэтому экран полностью скрывает эту строку, а не
            выдумывает отсутствие.
        status:
          type: string
          example: synced
          enum:
            - never
            - synced
            - failed
          description: >-
            `never` — ни один runner ещё не сообщил о раунде (строки нет).
            `synced` — последний раунд скопировал; `filesCopied` может быть `0`,
            что значит «посмотрел, и копировать было нечего», и для этого есть
            своя фраза. `failed` — последний раунд завершился сбоем, и ошибка
            новее последнего успеха. API выводит это из двух меток времени,
            чтобы у правила был один источник; экран всё равно получает сырые
            поля, чтобы написать фразу.
        lastSyncedAt:
          type: object
          example: '2026-09-07T12:04:00.000Z'
          nullable: true
          description: >-
            Последняя УСПЕШНАЯ синхронизация. Последующий сбой никогда её не
            стирает — это самое полезное, что есть у этого экрана, пока зеркало
            сломано.
        filesCopied:
          type: object
          example: 412
          nullable: true
        filesSkipped:
          type: object
          example: 3
          nullable: true
        filesRefused:
          type: object
          example: 0
          nullable: true
        lastDestination:
          type: object
          example: /home/you/mirrors/store
          nullable: true
          description: >-
            Куда фактически писал последний раунд — ЗАМОРОЖЕНО. Расходится с
            `mirrorPath` после того, как кто-то меняет назначение, потому что
            разрешение передаётся в join и меняется только при переподключении
            runner (RN-516).
        lastError:
          type: object
          example: null
          nullable: true
        lastErrorAt:
          type: object
          example: null
          nullable: true
      required:
        - mirrorPath
        - status
        - lastSyncedAt
        - filesCopied
        - filesSkipped
        - filesRefused
        - lastDestination
        - lastError
        - lastErrorAt
    ProjectResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z0000PROJETO0000000001
        workspaceId:
          type: string
          example: 01JC4Z0000WORKSPACE00000001
        name:
          type: string
          example: Checkout
        slug:
          type: string
          example: checkout
          description: Уникален в пределах рабочего пространства.
        workspaceDirName:
          type: string
          example: checkout-3f2b1c8e
          description: >-
            Имя физической папки рабочей области этого проекта в
            PROJECT_WORKSPACES_ROOT (RN-109). `<slug>-<8 id chars>` у нового
            проекта; сырой UUID у проекта, созданного до появления этого
            столбца. Заморожено при создании — последующее редактирование `slug`
            его не пересчитывает.
        executionMode:
          type: string
          enum:
            - container
            - mounted
            - runner
          example: container
          description: >-
            ГДЕ выполняется команда (RN-169/RN-421 — ADR 0072/0104).
            `container`: папка, управляемая в PROJECT_WORKSPACES_ROOT.
            `mounted`: папка пользователя в `workspacePath`, внутри
            `BRABO_PROJECTS_BASE`, доступная через bind-mount базы (ADR 0141).
            `runner`: папка пользователя, подтверждённая runner. И `mounted`, и
            `runner` сообщают подтверждение в `workspaceVerifiedAt`.
        workspacePath:
          type: object
          example: null
          nullable: true
          description: >-
            Абсолютный путь к папке пользователя — заполнен для
            `mounted`/`runner`, всегда `null` в режиме `container`.
        workspaceVerifiedAt:
          type: object
          example: null
          nullable: true
          description: >-
            Когда путь был подтверждён на диске. `null` = ещё не проверен. В
            `runner` подтверждение приходит от подключения CLI (RN-423); в
            `mounted` ставится, когда Infra запускает контейнер и папка
            материализуется (RN-501, ADR 0142). `container` никогда не заполняет
            это поле. Записывает ОДНО подтверждение, никогда не heartbeat.
        mirrorPath:
          type: object
          example: null
          nullable: true
          description: >-
            Назначение зеркала на машине ПОЛЬЗОВАТЕЛЯ — папка ВНЕ смонтированной
            базы, куда локальный агент копирует работу (RN-515, ADR 0147).
            `null` означает, что у проекта нет зеркала, и это НОРМАЛЬНОЕ
            состояние, никогда не ошибка. Оно может быть только у
            `mounted`/`runner`. Задаётся через `PUT
            /projects/:projectId/mirror-path`; передаётся при каждом чтении
            проекта, чтобы ничему не требовался отдельный endpoint. Значение
            проверено только ЛЕКСИЧЕСКИ — существует ли папка, знает локальный
            агент, а не этот API.
        language:
          type: string
          example: pt-BR
          description: >-
            Язык ПРОЕКТА (RN-619): язык всего, у чего нет автора-человека, —
            общие артефакты (product brief, бизнес-правила, ADR) и ходы, которые
            никто не набирал (kickoff, dev agent, gate, сообщения коммитов, тела
            PR). Канонический код BCP-47, открытый список. Новый проект начинает
            с эффективного языка ответов своего создателя (RN-618). Задаётся
            через `PATCH /projects/:projectId` (`maintainer`). Engine отправляет
            его модели как эфемерное системное сообщение в конце каждого вызова
            LLM хода без автора-человека (RN-622); артефакт, выпущенный во время
            хода человека, по-прежнему следует языку ответов этого человека.
        createdBy:
          type: string
          example: 01JC4Z0000USUARIO0000000001
        taskBudgetMicros:
          type: object
          example: 500000
          nullable: true
          description: >-
            Лимит токенов на задачу dev agent, в микро-USD. `null` использует
            значение домена по умолчанию.
        maxConsecutiveBlocked:
          type: object
          example: 3
          nullable: true
          description: >-
            Предохранитель на dev agent (Фаза 12b — RN-047): последовательные
            задачи, закончившиеся блокировкой, до остановки в idle_tripped.
            `null` использует значение домена по умолчанию.
        storyPromotion:
          type: string
          enum:
            - manual
            - auto
          example: auto
          description: >-
            Кто продвигает историю в `ready` (Фаза 12c — RN-048). `manual`: PO
            предлагает, пользователь решает. `auto`: автоматическое продвижение
            при создании — значение по умолчанию для новых проектов начиная с
            RN-659; проекты, созданные раньше, сохраняют своё значение.
        createdAt:
          type: string
          example: '2026-07-21T11:00:00.000Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-21T11:00:00.000Z'
          format: date-time
      required:
        - id
        - workspaceId
        - name
        - slug
        - workspaceDirName
        - executionMode
        - workspacePath
        - workspaceVerifiedAt
        - mirrorPath
        - language
        - createdBy
        - taskBudgetMicros
        - maxConsecutiveBlocked
        - storyPromotion
        - createdAt
        - updatedAt
    ProjectsBaseResponseDto:
      type: object
      properties:
        projectsBase:
          type: object
          example: /home/voce/brabo
          nullable: true
          description: >-
            Единственная папка на компьютере оператора, которую видят контейнеры
            Brabo, смонтированная по ИДЕНТИЧНОСТИ (`$X:$X`) в `api` и `engine`
            (ADR 0141). `null` означает, что `BRABO_PROJECTS_BASE` не задана:
            установка не предлагает режим Mounted, и мастер проекта не должен
            его предлагать. Никогда не сбой — отсутствие является нормальным
            состоянием.
        brokerConfigurado:
          type: boolean
          example: false
          description: >-
            Настроен ли у этой установки broker контейнеров (`BROKER_URL` задан,
            ADR 0130). Проекты `container` и `mounted` поднимают контейнер
            только через broker (ADR 0144), и без него каждый dev agent
            заблокирован навсегда (ADR 0143). При `false` мастер проекта не
            выбирает заранее Mounted, оставляет Container и Mounted видимыми, но
            недоступными для выбора, с причиной в тексте, и заранее выбирает
            Runner (ADR 0161, RN-573). Говорит, что переменная существует, и
            никогда — что broker отвечает. Конфигурация установки, как и
            `projectsBase`: одинакова для каждого рабочего пространства.
      required:
        - projectsBase
        - brokerConfigurado
