    UserPreferencesResponseDto:
      type: object
      properties:
        locale:
          type: string
          enum:
            - pt-BR
            - en
            - ru
            - zh-Hans
          example: pt-BR
        responseLanguage:
          type: string
          example: automatico
          description: >-
            `automatico` (с него начинается каждая учётная запись) или код
            BCP-47, явно выбранный на странице Учётной записи.
        detectedLanguage:
          type: string
          nullable: true
          example: null
          description: >-
            Язык, обнаруженный в ваших собственных сообщениях И подтверждённый
            вами, — никогда не неподтверждённое обнаружение. `null`, пока нет
            подтверждения.
        detectedLanguageConfirmedAt:
          type: string
          format: date-time
          nullable: true
        effectiveResponseLanguage:
          description: >-
            Что действует сегодня ВНЕ любой сессии и откуда это взялось: выбор в
            учётной записи > подтверждённое обнаружение > язык интерфейса.
          allOf:
            - $ref: '#/components/schemas/IdiomaEfetivoResponseDto'
      required:
        - locale
        - responseLanguage
        - detectedLanguage
        - detectedLanguageConfirmedAt
        - effectiveResponseLanguage
    VerifyEmailDto:
      type: object
      properties:
        token:
          type: string
          description: Одноразовый токен, полученный по email.
      required:
        - token
    WorkspaceComPapelResponseDto:
      type: object
      properties:
        workspace:
          $ref: '#/components/schemas/WorkspaceResponseDto'
        role:
          type: string
          enum:
            - viewer
            - developer
            - maintainer
            - owner
          example: maintainer
          description: Роль ВЫЗЫВАЮЩЕГО в этом рабочем пространстве.
      required:
        - workspace
        - role
    WorkspaceMemberComUsuarioResponseDto:
      type: object
      properties:
        userId:
          type: string
          example: 01JC4Z0000USUARIO0000000002
        role:
          type: string
          enum:
            - viewer
            - developer
            - maintainer
            - owner
          example: maintainer
          description: >-
            Роль РАБОЧЕГО ПРОСТРАНСТВА — то, что наследует каждый проект
            рабочего пространства, если строка проекта её не переопределяет
            (RN-471).
        name:
          type: string
          example: Senior Dev
          nullable: true
        email:
          type: string
          example: dev@brabo.dev
      required:
        - userId
        - role
        - name
        - email
    WorkspaceMemberResponseDto:
      type: object
      properties:
        workspaceId:
          type: string
          example: 01JC4Z0000WORKSPACE00000001
        userId:
          type: string
          example: 01JC4Z0000USUARIO0000000002
        role:
          type: string
          enum:
            - viewer
            - developer
            - maintainer
            - owner
          example: maintainer
          description: >-
            Линейная иерархия: owner > maintainer > developer > viewer. Каждая
            роль включает разрешения последующих.
        createdAt:
          type: string
          example: '2026-07-22T08:00:00.000Z'
          format: date-time
      required:
        - workspaceId
        - userId
        - role
        - createdAt
    WorkspaceResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z0000WORKSPACE00000001
        name:
          type: string
          example: Acme Corp
        slug:
          type: string
          example: acme-corp
          description: Уникален в системе; именно он появляется в URL.
        createdBy:
          type: string
          example: 01JC4Z0000USUARIO0000000001
        toolRouterEnabled:
          type: boolean
          example: true
          description: >-
            Выполняется ли шаг маршрутизации инструментов через Jev (ADR 0179)
            для этого рабочего пространства. Включено по умолчанию; действует,
            только когда модель хода от OpenRouter, поэтому `true` в рабочем
            пространстве без OpenRouter ничего не делает.
        createdAt:
          type: string
          example: '2026-07-20T09:12:00.000Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-20T09:12:00.000Z'
          format: date-time
      required:
        - id
        - name
        - slug
        - createdBy
        - toolRouterEnabled
        - createdAt
        - updatedAt
    WorkspaceSpendReportResponseDto:
      type: object
      properties:
        workspaceId:
          type: string
          example: 9b1c2d3e-4f50-4a61-8b72-0c3d4e5f6a7b
          format: uuid
        ownerId:
          type: string
          example: 9b1c2d3e-4f50-4a61-8b72-0c3d4e5f6a7b
          format: uuid
          description: Владелец ключей, профинансировавших этот расход (RN-058).
        dias:
          type: number
          example: 30
          description: Скользящее окно, в днях.
        totalMicros:
          type: number
          example: 1250000
        inputTokens:
          type: number
          example: 120000
        outputTokens:
          type: number
          example: 35000
        chamadas:
          type: number
          example: 42
        porModelo:
          description: >-
            По МОДЕЛИ. Два провайдера, обслуживающие одно и то же имя, попадают
            в одну строку — их разделение вернуло бы ось учётных данных под
            другим именем.
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porProvider:
          description: >-
            По ПРОВАЙДЕРУ (ADR 0076, RN-186). Эта ось говорит об УЧЁТНЫХ ДАННЫХ
            и поэтому существует только здесь, на маршруте, требующем `owner`
            (RN-060), — в ответе участника её нет, и это не фильтр, который её
            скрывает: её отклоняет тип репозитория при области действия актора
            (RN-187).
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porProjeto:
          description: По ПРОЕКТУ внутри рабочего пространства.
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porAtor:
          description: >-
            По АКТОРУ — агент и человек в одном списке, различаемые по
            `actorKind`.
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porOwner:
          description: >-
            Строки ЛЮДЕЙ (`actor_kind = "user"`) — блок, который handoff
            называет «По владельцу», потому что по RN-058 все они тратят ключ
            владельца. Кто владелец, указано в `ownerId`. Разбиение `porAtor`,
            без дополнительного запроса (RN-188).
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porAgente:
          description: Строки АГЕНТОВ (`actor_kind = "agent"`). Вторая половина `porAtor`.
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porDia:
          type: array
          items:
            $ref: '#/components/schemas/SpendPorDiaResponseDto'
      required:
        - workspaceId
        - ownerId
        - dias
        - totalMicros
        - inputTokens
        - outputTokens
        - chamadas
        - porModelo
        - porProvider
        - porProjeto
        - porAtor
        - porOwner
        - porAgente
        - porDia
    WorkspaceSummaryResponseDto:
      type: object
      properties:
        activeProjects:
          type: number
          example: 4
          description: >-
            Число проектов в рабочем пространстве. В домене нет флага «активный»
            — учитывается каждый проект.
        agentCount:
          type: number
          example: 6
          description: >-
            Различные агенты (actorKind=agent), потратившие токены в этом
            месяце, суммарно по всем проектам рабочего пространства, — включая
            подспециальности областей (Фаза 8).
        spentMicros:
          type: number
          example: 12500000
          description: >-
            Расходы текущего месяца в микро-USD, суммированные по
            token_usage.createdAt.
      required:
        - activeProjects
        - agentCount
        - spentMicros
