            application/json:
              schema:
                $ref: '#/components/schemas/StoryResponseDto'
        '400':
          description: Нет ни одного поля или пустой заголовок.
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '404':
          description: История не в этом проекте.
        '409':
          description: >-
            Именованный отказ (`reason`): `historia_arquivada`,
            `historia_nao_draft` или `historia_com_tarefa_em_execucao`.
      security:
        - service-token: []
      summary: Исправляет заголовок и/или описание черновой истории
      tags:
        - internal
  /internal/sessions/{sessionId}/story-modules:
    post:
      description: >-
