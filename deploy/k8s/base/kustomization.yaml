# Base: os quatro componentes do Brabo + o que eles compartilham.
#
# Não há nada específico de ambiente aqui — nem endereço de banco, nem URL
# pública, nem StorageClass, nem SecretStore. Tudo isso vem por overlay. Um
# `kubectl apply -k` desta base sozinha NÃO deve funcionar, e é intencional:
# subir a base direto significaria que algum default de ambiente vazou para
# dentro dela.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: brabo

# `labels` e não `commonLabels`: o segundo é deprecado e injeta o rótulo também
# nos selectors, o que os torna imutáveis na prática — mudar um rótulo comum
# depois exigiria recriar Deployment e Service.
labels:
  - pairs:
      app.kubernetes.io/part-of: brabo

resources:
  - namespace.yaml
  - common/pvc-shared-data.yaml
  - common/externalsecrets.yaml
  - common/netpol-baseline.yaml
  - common/netpol-observability.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/hpa.yaml
  - api/pdb.yaml
  - api/netpol.yaml
  - engine/deployment.yaml
  - engine/service.yaml
  - engine/hpa.yaml
  - engine/pdb.yaml
  - engine/netpol.yaml
  - web/deployment.yaml
  - web/service.yaml
  - web/pdb.yaml
  - web/netpol.yaml
  - backup/cronjob.yaml
  - backup/netpol.yaml
  - migrations/jobs.yaml

configMapGenerator:
  # Só o que NÃO é segredo e NÃO varia por ambiente. Os overlays fazem
  # `behavior: merge` para acrescentar as URLs públicas e o que for deles.
  - name: brabo-config
    literals:
      # Endereços internos: nome de Service, iguais em qualquer ambiente.
      # OpenTelemetry (Fase 5, item 3). Endereço do Collector, não do Tempo: é
      # ele que desacopla a instrumentação do backend.
      #
      # ATENÇÃO (ADR 0035): esta variável NÃO liga mais a instrumentação — ela
      # liga a EXPORTAÇÃO. api e engine criam span e carregam `trace_id` no log
      # com ou sem ela; sem ela a span simplesmente não sai do processo. O texto
      # anterior dizia o contrário, e era o que fazia todo mundo achar que
      # desenvolvimento não tinha trace por opção de projeto.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4318
      - API_URL=http://api:3000
      - ENGINE_URL=http://engine:4000
      # Nível do logger JSON da web (ADR 0035). Toda a encanação já existia —
      # entrypoint → /config.js → runtime-config → logger — e faltava só a
      # variável, então `logger.debug` era código morto em TODO ambiente
      # publicado. Um nível que ninguém consegue ligar é pior que nível nenhum.
      - WEB_LOG_LEVEL=info

images:
  # As tags são substituídas por overlay. No local ficam as :prod construídas
  # no daemon e importadas no cluster; em staging/prod viram a referência
  # imutável do registry (por digest ou SHA do commit).
  - name: brabo-api
    newTag: prod
  - name: brabo-engine
    newTag: prod
  - name: brabo-web
    newTag: prod
  - name: brabo-backup
    newTag: prod
