  /workspaces/{workspaceId}/members/{userId}:
    delete:
      description: >-
        只有 `owner` 可以调用，与 upsert 相同。移除 workspace 记录，并在同一事务中移除该用户在此 workspace
        每个项目中的记录（项目角色覆盖 workspace
        角色，保留它们会让该用户留在那些项目中），以及该用户在这些项目中的项目设备密钥和个人访问令牌。之后会尽力断开该用户在每个项目中的活动
        runner 连接。机器设备密钥和已打开的会话不受影响——由于角色解析为无，它们不再能触及此 workspace。


        移除你自己会以 403 拒绝，且在任何地方都无法启用：上面没有更高层级来兜底。正是这一条款保护了最后一个 `owner`——只有 `owner`
        可以调用此路由且没有人能移除自己，因此每次成功调用后至少还有调用方是 `owner`。移除另一个 `owner`
        是允许的——这是撤销所有权的方式——但记录所有者（`createdBy`）除外，它会以 409 `criador_do_workspace`
        拒绝，直到 `PUT :workspaceId/owner-of-record` 把它转给另一个所有者：代理花费的 LLM
        密钥和花费报告都是他们的。幂等：没有 workspace 记录的目标仍会清除其在此 workspace 中的项目记录，并返回 `204`。
      operationId: WorkspacesController_removeMember
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
        - name: userId
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: 关联已移除。无响应体。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 不是该 workspace 的 `owner`，或者目标是调用方本人（自我移除上限）。
        '404':
          description: workspace 不存在或对调用方不可见。
        '409':
          description: '`criador_do_workspace`：目标是记录所有者；请先转移。'
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 解除用户与 workspace 的关联
      tags:
        - workspaces
