            - error
          example: ok
        timestamp:
          type: string
          example: '2026-07-27T15:40:00.000Z'
          format: date-time
        details:
          type: object
          additionalProperties: true
          description: >-
            Só quando `status=error`, com a mensagem da falha. Uma resposta
            saudável não tem detalhe nenhum, de propósito: liveness não é lugar
            de expor topologia.
      required:
        - service
        - status
        - timestamp
    HuggingFaceModelResponseDto:
