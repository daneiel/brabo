name: Release

# Fase 5, item 6. Disparado pela TAG, não por push em branch: a decisão de
# publicar uma versão é do usuário, e uma tag é o registro explícito dessa
# decisão. O CLAUDE.md já trata merge em branch protegida como ato manual; a
# release segue a mesma regra.
# SÓ tag FINAL. O padrão `v[0-9]+.[0-9]+.[0-9]+` não casa com sufixo de
# pré-lançamento, então `v0.2.0-qa.1` e `v0.2.0-dev.3` não disparam nada.
#
# Antes era `v*`, e isso quebraria assim que a esteira da FASE 6 começasse a
# carimbar: as tags de estágio nascem a cada merge, e cada uma dispararia uma
# tentativa de publicar release — falhando na conferência de versão, porque
# `0.2.0-qa.1` nunca vai bater com o `0.2.0` declarado nos arquivos.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write # criar a GitHub Release

env:
  NODE_VERSION: '24.11.1'
  PNPM_VERSION: '11.3.0'

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # O changelog é gerado a partir do histórico: sem `fetch-depth: 0` o
          # checkout raso traz um commit só e a release sai com o changelog
          # vazio, sem erro nenhum.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # PRIMEIRO passo depois do checkout, de propósito: falhar aqui custa
      # segundos, e evita descobrir a divergência depois de 20 minutos de build.
      #
      # A verificação existe porque a tag e os manifests são fontes de verdade
      # independentes. Taggear v0.2.0 com os package.json ainda em 0.1.0 produz
      # imagens rotuladas com uma versão que o código não declara — e o sintoma
      # aparece semanas depois, quando alguém tenta correlacionar um bug com
      # uma versão.
      - name: A tag bate com as versões declaradas?
        run: |
          set -euo pipefail
          versao="${GITHUB_REF_NAME#v}"
          echo "tag: ${GITHUB_REF_NAME} -> versão ${versao}"

          # AVISO, não reprovação: desde a FASE 6 a versão é CALCULADA e vive
          # na tag. Ninguém pode commitar direto numa permanente para bumpar
          # `package.json`, então exigir que os arquivos acompanhem obrigaria a
          # um PR de bump por ciclo — cerimônia que o cálculo automático existe
          # para eliminar. Os arquivos viram metadado, e a divergência fica
          # visível no log em vez de travar a publicação.
          divergentes=0
          conferir() {
            local arquivo="$1" encontrado="$2"
            if [ "${encontrado}" != "${versao}" ]; then
              echo "::warning file=${arquivo}::declara ${encontrado}, mas a tag é ${versao}"
              divergentes=$((divergentes + 1))
            else
              echo "ok: ${arquivo} = ${encontrado}"
            fi
          }

          conferir package.json           "$(node -p "require('./package.json').version")"
          conferir apps/api/package.json  "$(node -p "require('./apps/api/package.json').version")"
          conferir apps/web/package.json  "$(node -p "require('./apps/web/package.json').version")"
          conferir apps/engine/mix.exs    "$(grep -oP 'version:\s*"\K[^"]+' apps/engine/mix.exs | head -1)"

          if [ "${divergentes}" -gt 0 ]; then
            echo "::notice::${divergentes} arquivo(s) com versão diferente da tag — a fonte de verdade é a TAG."
          fi

      - name: Gerar o changelog desta versão
        run: |
          set -euo pipefail
          # A tag anterior é a penúltima em ordem de versão — `HEAD^` daria o
          # commit anterior, que não é a mesma coisa.
          anterior="$(git tag --list 'v*' --sort=-v:refname | sed -n '2p')"
          node scripts/changelog.mjs "${GITHUB_REF_NAME}" ${anterior:+"${anterior}"} --stdout \
            | tee RELEASE_NOTES.md

      - uses: docker/setup-buildx-action@v3

      # As duas tags de cada imagem, calculadas num passo só porque agora são
      # entrada de uma action e não de um `run` — expressão de workflow não
      # enxerga variável de shell.
      - name: As duas tags desta release
        id: versao
        run: |
          set -euo pipefail
          echo "versao=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # As quatro imagens, cada uma com DUAS tags: a versão (legível, é o que
      # se cita numa conversa) e o SHA do commit (imutável, é o que identifica
      # o build sem ambiguidade quando uma tag é movida). O `TAG_EXTRA` do
      # `docker-bake.hcl` existe exatamente para a segunda.
      #
      # BAKE, não quatro `docker build` em loop. O `ci.yml` já usa este mesmo
      # bakefile desde a Fase 5, e o comentário no topo dele MEDE o motivo: em
      # sequência os builds somavam ~359s (api 130, engine 160, web 49, backup
      # 20); em paralelo num builder só, ~195s. O loop daqui pagava aquele preço
      # a cada tag para chegar ao mesmo veredito.
      #
      # `push: false` continua valendo, e agora vem do `output = ["type=docker"]`
      # do alvo `_comum`: publicar em registry ainda não está resolvido — o
      # overlay de produção aponta para `ghcr.io/OWNER/*`, um placeholder. As
      # imagens são construídas aqui para provar que a tag é CONSTRUÍVEL; a
      # publicação entra quando o registry for decidido (ver ADR 0027).
      #
      # Sobre o cache `type=gha` que o bakefile declara: aqui ele é BÔNUS, não a
      # razão da troca. O cache do Actions é escopado por branch, e quem popula
      # aqueles escopos é o `ci.yml` em `pull_request` — cache escrito por PR não
      # é legível de uma tag em `main`. O ganho garantido é o PARALELISMO; se o
      # cache pegar, melhor.
      - name: Build das imagens taggeadas
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          targets: default
          load: true
        env:
          TAG: ${{ steps.versao.outputs.versao }}
          TAG_EXTRA: ${{ steps.versao.outputs.sha }}

      - name: O que foi construído
        run: |
          set -euo pipefail
          for app in api engine web backup; do
            echo "construída: brabo-${app} -> ${TAG}, ${TAG_EXTRA}"
          done
        env:
          TAG: ${{ steps.versao.outputs.versao }}
          TAG_EXTRA: ${{ steps.versao.outputs.sha }}

      - name: Publicar a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
