        - toVersion
        - cacheInvalidated
    RosterFactsResponseDto:
      type: object
      properties:
        executionActivated:
          type: boolean
          example: true
          description: 最近的会话已经记录了 `execution.activated`——正是这一点把按模块划分的 dev agent 带入名单。
        moduleNames:
          example:
            - api
            - web
          description: 来自当前 module_map（`version` 最高）的模块名称。执行激活后，每个模块一个 dev agent。
          type: array
          items:
            type: string
        gatesEverOpened:
          type: boolean
          example: true
          description: >-
            本会话中某个 PR gate（dev 或 infra）至少打开过一次——正是这一点把 QA 和 SecOps
            带入名单。覆盖整个会话，而不是最近 N 个事件的窗口。
        delegatedSubagents:
          example:
            - qa-automacao
          description: 在会话中至少记录过一次委派的子代理，无论结果如何——放弃委派是一项被记录的决定，而不是沉默。
          type: array
          items:
            type: string
        activatedAgents:
          example:
            - arquiteto
            - infra
          description: >-
            在会话中至少有一次 `agent.activated` 的代理，最近激活的在前（按
            `seq`），每个代理一条（RN-630）。覆盖整个会话，而不是 200 个事件的窗口：客户端将其与窗口合并，并且只有当
            `latestSessionId` 是它正在读取的会话时才信任它。
          type: array
          items:
            type: string
        infraActive:
          type: boolean
          example: false
          description: 最近的会话中存在一个 `accepted` handoff，目标为 `infra`。
        uxDesignerActive:
          type: boolean
          example: false
          description: 最近的会话中存在一个 `accepted` handoff，目标为 `ux-designer`（ADR 0087）。
        staffActive:
          type: boolean
          example: false
          description: >-
            最近的会话中存在一个 `accepted` handoff，目标为 `staff`（docs/fluxo.yml，ADR
            0088）——对自动触发处于休眠状态，只反映已被接受的手动激活。
      required:
        - executionActivated
        - moduleNames
        - gatesEverOpened
        - delegatedSubagents
        - activatedAgents
        - infraActive
        - uxDesignerActive
        - staffActive
