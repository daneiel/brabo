        pulado:
          type: string
          enum:
            - sem_capability
            - sem_credencial
            - falha
          description: >-
            Presente quando o provider não foi sincronizado. Provider pulado não
            marca nada como indisponível: "não sei o que há lá" não é "não há
            nada lá".
        origemDaFalha:
          type: string
          enum:
            - infra
            - modelo
          description: >-
            Só com `pulado: "falha"`. Vocabulário de origem do ADR 0020 —
            `infra` quando o provider nem foi alcançado, `modelo` quando
            respondeu recusando.
