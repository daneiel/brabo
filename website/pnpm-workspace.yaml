  # Ver `../pnpm-workspace.yaml` — mesma origem em `apps/api`, via
  # `eslint` → `@eslint/eslintrc`, e aqui via `openapi-to-postmanv2` /
  # `@11ty/gray-matter` (subárvore do `docusaurus-theme-openapi-docs`).
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  # Ver `../pnpm-workspace.yaml` — mesma origem em `apps/web`, dependência de
  # runtime direta (ADR 0068), e aqui via `@docusaurus/theme-mermaid`.
  mermaid@>=11.0.0-alpha.1 <11.16.1: 11.16.1
  # Ver `../pnpm-workspace.yaml` — mesma origem em `apps/web`, via `vite`
  # (`postcss: ^8.5.17`), e aqui via `postcss-preset-env` (transitivo do
  # `docusaurus-theme-openapi-docs`).
  postcss@<8.5.23: 8.5.23
  # Ver `../pnpm-workspace.yaml` — mesma origem em `apps/api`, via `ajv` →
  # `@angular-devkit/core`, e aqui via `@redocly/ajv`.
  fast-uri@>=3.0.0 <3.1.5: 3.1.5
