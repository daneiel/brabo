          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует или невидим для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Возвращает проект по id
      tags:
        - projects
    patch:
      operationId: ProjectsController_update
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует или невидим для вызывающего.
        '409':
          description: Проект с таким slug уже существует в рабочем пространстве.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Меняет имя или slug проекта
      tags:
        - projects
    delete:
      description: Забирает с собой свои сессии, журнал событий и предложенные действия.
      operationId: ProjectsController_remove
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует или невидим для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Удаляет проект
      tags:
        - projects
  /projects/{projectId}/actions:
    get:
      description: >-
        `status` — это `pending` (по умолчанию) или `failed`. `actionType`
        фильтрует по типу — например, `git_merge`, чтобы вкладка PR нашла
        предложение merge для PR, не зная, какая сессия его создала.
        `status=failed` ТРЕБУЕТ `actionType` и перечисляет действия, выполнение
        которых завершилось сбоем, — вкладка PR читает отсюда последний
        отклонённый merge каждого PR (конфликт слияния несёт
        `executionResult.conflictingFiles`).
      operationId: ProjectActionsController_list
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: status
          required: false
          in: query
          schema:
            example: pending
            type: string
        - name: actionType
          required: false
          in: query
          schema:
            example: git_merge
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProposedActionResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не найден.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перечисляет ОЖИДАЮЩИЕ действия всего проекта, по любой сессии
      tags:
        - actions
  /projects/{projectId}/agent-areas:
    get:
      description: >-
        Проект рождается с тремя областями (RN-094), поэтому список возвращается
        полным даже до появления `module_map`. Активация выполнения добавляет
        УЧАСТНИКОВ области dev, по одному на модуль.
      operationId: ExecutionController_listAreas
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AreaDeAgentesResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, сессия или задача не найдены.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Области агентов проекта с лимитом каждого lead
      tags:
        - execution
  /projects/{projectId}/agent-areas/{key}/budget:
    put:
      description: >-
        Требует `maintainer`, по той же причине, что и лимит параллелизма: это
        НЕЗАВИСИМАЯ, дополнительная проверка рядом с бюджетами проекта и сессии
        (ADR 0110) — не каскад и не замена ни одному из них. Лимит приходит в
        ДОЛЛАРАХ и переводится в микро-USD на сервере, по тому же соглашению,
        что и `BudgetsController`. `null` снимает лимит.
      operationId: ExecutionController_setBudget
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: key
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAreaBudgetDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaDeAgentesResponseDto'
        '400':
          description: '`limitUsd` не является ни `null`, ни числом >= 0.'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, сессия или задача не найдены.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Задаёт (или снимает) лимит расходов области
      tags:
        - execution
  /projects/{projectId}/agent-areas/{key}/max-parallel:
    patch:
      description: >-
        Требует `maintainer`, а не `developer`, по той же причине, что и
        активация выполнения: повышать лимит — значит решать, сколько продукт
        может тратить, не спрашивая. Применяется к СЛЕДУЮЩИМ запросам — то, что
        уже ждёт вашего решения, продолжает ждать.
      operationId: ExecutionController_setMaxParallel
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: key
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMaxParallelDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaDeAgentesResponseDto'
        '400':
          description: '`maxParallel` не является целым числом >= 1.'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, сессия или задача не найдены.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Меняет лимит параллелизма области
      tags:
        - execution
  /projects/{projectId}/agent-autonomy:
    get:
      description: >-
        Только явно записанные правила. Агент без строки здесь откатывается к
        значению по умолчанию из `permissions.json` проекта.
      operationId: AgentAutonomyController_list
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentAutonomyRuleResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не найден.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перечисляет автономию, предоставленную каждому агенту
      tags:
        - actions
    put:
      description: >-
        Upsert по (агент, тип). НЕ переопределяет `permissions.json`: шаблон,
        уже находящийся в `deny`, остаётся заблокированным, сколько бы автономии
        здесь ни было предоставлено. `actionType: "*"` — это «автоматический
        режим» (RN-153), автономия для ЛЮБОГО типа действия этого агента;
        конкретное правило, записанное после, всё равно побеждает подстановочное
        для этого типа.
      operationId: AgentAutonomyController_set
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAgentAutonomyDto'
      responses:
        '204':
          description: Правило записано. Без тела.
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не найден.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Задаёт автономию агента для типа действия
      tags:
        - actions
  /projects/{projectId}/agent-bindings/{agentSlug}:
    get:
      description: >-
        Каскад агент → область → проект → рабочее пространство, БЕЗ сессии: это
        конфигурация агента в проекте, а не конкретного разговора. `origin:
        "agent"` означает, что этот агент ОТКЛОНИЛСЯ от значения по умолчанию
        своей области; любой другой origin означает, что он наследует.
      operationId: ModelBindingsController_getAgentBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: agentSlug
          required: true
          in: path
          schema:
            example: dev-api
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedBindingResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в области действия.
        '404':
          description: Область действия не найдена.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Определяет, какую модель использует агент и откуда она взялась
      tags:
        - llm
    put:
      description: >-
        Применяется к каждой сессии этого проекта, у которой нет собственного
        binding, и только к ним — до ADR 0064 binding был глобальным и
        затрагивал и другие проекты. Так Психологу даётся дешёвая модель, а
        Архитектору дорогая в одном проекте, и так же агент ОТКЛОНЯЕТСЯ от
        значения по умолчанию своей области.
      operationId: ModelBindingsController_setAgentBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: agentSlug
          required: true
          in: path
          schema:
            example: dev-api
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModelBindingDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelBindingResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в области действия.
        '404':
          description: Область действия не найдена.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Закрепляет модель агента в ЭТОМ проекте
      tags:
        - llm
    delete:
      description: >-
        УДАЛЯЕТ binding агента — не копирует в него модель области. Копирование
        выглядело бы на экране так же, но им не является: оно стало бы копией, и
        следующее изменение области молча оставило бы этого агента позади. 404,
        если он уже наследует.
      operationId: ModelBindingsController_clearAgentBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: agentSlug
          required: true
          in: path
          schema:
            example: dev-api
            type: string
      responses:
        '204':
          description: Агент снова наследует. Без тела.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в области действия.
        '404':
          description: Область действия не найдена.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Возвращает агента к наследованию модели области
      tags:
        - llm
  /projects/{projectId}/agent-costs:
    get:
      description: >-
        СКОЛЬЗЯЩЕЕ окно в 30 дней, а не текущий календарный месяц: именно эту
        подпись показывает экран, а с календарным месяцем оценка проваливалась
        бы 1-го числа из-за смены страницы, а не из-за изменения использования.
        Учитывается только `actor_kind = agent` (RN-038). Агент, который никогда
        не запускался, не появляется в списке — экран показывает для него
        прочерк, что отличается от нуля.
      operationId: BudgetsController_getProjectAgentCosts
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentTokenUsageResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект или сессия не найдены.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Разбивает расходы проекта по агентам за последние 30 дней
      tags:
        - llm
  /projects/{projectId}/agents/{agent}/instruction-versions:
    get:
      description: >-
        Сначала самые свежие, каждая уже с diff относительно предыдущей,
        вычисленным на сервере.
      operationId: AnamneseController_versions
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: agent
          required: true
          in: path
          schema:
            example: dev-api
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstructionVersionResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, событие или версия не существуют.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перечисляет версии инструкции агента
      tags:
        - anamnesis
  /projects/{projectId}/agents/{agent}/instruction-versions/{version}/rollback:
    post:
      description: >-
        История неизменяема: восстановление ничего не удаляет, оно СОЗДАЁТ новую
        версию со старым содержимым. Требует `maintainer`, потому что меняет
        поведение агента с этого момента, — та же калибровка, что и у патча.
      operationId: AnamneseController_rollbackVersion
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: agent
          required: true
          in: path
          schema:
            example: dev-api
            type: string
        - name: version
          required: true
          in: path
          description: Версия для восстановления.
          schema:
            example: 2
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackResponseDto'
        '400':
          description: Версия не является положительным целым числом.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, событие или версия не существуют.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Восстанавливает предыдущую версию инструкции агента
      tags:
        - anamnesis
  /projects/{projectId}/anamnese/run:
    post:
      description: >-
        Требует `maintainer` по той же причине, что и повторный анализ
        Психолога: он запускает ToolLoop и тратит реальный бюджет.
      operationId: AnamneseController_run
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, событие или версия не существуют.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
        '503':
          description: >-
            Анамнез глобально отключён по решению пользователя (не ошибка) —
            тело с `reason: "anamnese_disabled"`.
      security:
        - bearer: []
      summary: Запускает Анамнез сейчас, не дожидаясь тика
      tags:
        - anamnesis
  /projects/{projectId}/architecture:
    get:
      description: >-
        Текущая карта — та, у которой наибольший `version` (история
        неизменяема). Незакрытые вопросы — это перекрёстная проверка
        история↔карта: история без модуля или указывающая на несуществующий
        модуль.
      operationId: BacklogController_architecture
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchitectureResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Возвращает текущий module_map, ADR и незакрытые вопросы
      tags:
        - backlog
  /projects/{projectId}/area-bindings/{areaKey}:
    get:
      description: >-
        Значение по умолчанию, общее для lead и субагентов области. `origin:
        "area"` означает, что кто-то выбрал его для этой области; любой другой
        origin означает, что сама область наследует от проекта или рабочего
        пространства.
      operationId: ModelBindingsController_getAreaBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: areaKey
          required: true
          in: path
          schema:
            example: qa
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedBindingResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в области действия.
        '404':
          description: Область действия не найдена.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Определяет, какая модель области по умолчанию и откуда она взялась
      tags:
        - llm
    put:
      description: >-
        Применяется к lead и к каждому субагенту области, у которого нет
        собственного binding (RN-102). Требует `maintainer`, потому что
        затрагивает всю область сразу, а выбор модели — это решение о расходах,
        та же причина, что и у лимита параллелизма.
      operationId: ModelBindingsController_setAreaBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: areaKey
          required: true
          in: path
          schema:
            example: qa
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModelBindingDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelBindingResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в области действия.
        '404':
          description: Область действия не найдена.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Задаёт модель области по умолчанию
      tags:
        - llm
    delete:
      description: >-
        Область перестаёт иметь собственное значение по умолчанию и начинает
        наследовать от проекта (или рабочего пространства). Отклонившиеся агенты
        продолжают отклоняться: их binding другой, и удаление этого не может
        решать за них.
      operationId: ModelBindingsController_clearAreaBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: areaKey
          required: true
          in: path
          schema:
            example: qa
            type: string
      responses:
        '204':
          description: Область снова наследует. Без тела.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в области действия.
        '404':
          description: Область действия не найдена.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Возвращает область к наследованию модели проекта
      tags:
        - llm
