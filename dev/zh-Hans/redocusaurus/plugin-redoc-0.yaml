        与 `analise:funil` 脚本（ADR 0089）相同的报告——会话 → 提交 → PR →
        合并的漏斗、真实交付周期和真实部署频率——经由相同的纯函数和相同的查询（`apps/api/src/application/services/funil-metrics.ts`），因此两者对同一事实绝不会出现分歧。补上
        `docs/fluxo.yml`（角色 `po`，输入 `metricas-de-produto`，此前为 `status:
