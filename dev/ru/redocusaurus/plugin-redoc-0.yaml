    ProjectFoldersResponseDto:
      type: object
      properties:
        base:
          type: object
          example: /home/voce/brabo
          nullable: true
          description: >-
            База смонтированных проектов этой установки (`BRABO_PROJECTS_BASE`,
            ADR 0141) — то же значение, что возвращает `GET .../projects-base`,
            повторённое здесь, чтобы клиент мог отрисовать хлебные крошки без
            второго вызова. `null` означает, что установка не предлагает режим
            Mounted.
        path:
          type: object
          example: /home/voce/brabo/clientes
          nullable: true
          description: >-
            Фактически перечисленная папка, нормализованная. Равна `base`, когда
            запрос опустил `path`. `null`, только когда базы нет вовсе: ничего
            не перечислено, потому что негде перечислять.
        entries:
          example:
            - api
            - loja
            - website
          description: >-
            Имена ПОДКАТАЛОГОВ непосредственно в `path`, отсортированные,
            никогда рекурсивно. Файлы, символические ссылки и записи с точкой в
            начале исключены — см. `arquivos`, `simbolicos` и `truncado`.
          type: array
          items:
            type: string
        truncado:
          type: boolean
          example: false
          description: >-
            В папке больше 500 подкаталогов, и вернулись только первые 500.
            Сортировка происходит ДО обрезки, поэтому обрезка детерминирована, а
            не «что файловая система вернула первым».
        arquivos:
          type: number
          example: 12
          description: >-
            Сколько записей, не являющихся каталогами, осталось за бортом.
            Папка, полная кода, не должна выглядеть пустой (RN-180).
        simbolicos:
          type: number
          example: 1
          description: >-
            Сколько символических ссылок осталось за бортом. Обозреватель
            никогда по ним не переходит — ссылка сообщается, но в неё не
            спускаются, поэтому ссылка за пределы базы не является выходом из
            неё.
      required:
        - base
        - path
        - entries
        - truncado
        - arquivos
        - simbolicos
    ProjectGitRemoteResponseDto:
      type: object
