            - closed
            - closed_abnormally
          example: closed_abnormally
          description: >-
            `closing` NÃO é terminal: quer dizer "estou liberando esta sessão".
            Se outra réplica a adota, ela continua viva; se ninguém a adota
            antes do timeout, o drain manda `closed_abnormally`. `created` e
            `active` ficam de fora porque entrar neles é decisão da api, nunca
            do engine relatando um encerramento.
        reason:
          type: string
