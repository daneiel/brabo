  /projects/{projectId}/personal-access-tokens/{tokenId}:
    delete:
      description: >-
        Идемпотентно — повторный отзыв не является ошибкой. Начиная с RN-685
        (ADR 0201) также РАЗРЫВАЕТ соединения runner, открытые с ЭТИМ токеном, и
        только их — ключ устройства того же пользователя остаётся, — и
