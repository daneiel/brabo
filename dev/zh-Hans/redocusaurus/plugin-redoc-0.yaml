            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 未找到项目、会话或 handoff。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 确认 Criativo 的业务需求已得到验证
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/budget:
