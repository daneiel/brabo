  /projects/{projectId}/area-bindings/{areaKey}:
    get:
      description: >-
        O padrão que o lead e os subagentes da área compartilham. `origin:
        "area"` quer dizer que alguém o escolheu para esta área; qualquer outra
        origem quer dizer que a própria área herda do projeto ou do workspace.
      operationId: ModelBindingsController_getAreaBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: areaKey
          required: true
          in: path
          schema:
            example: qa
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedBindingResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no escopo.
        '404':
          description: Escopo não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Resolve qual é o modelo padrão de uma área, e de onde veio
      tags:
        - llm
    put:
      description: >-
        Vale para o lead e para todo subagente da área que não tem binding
        próprio (RN-102). Exige `maintainer` porque alcança a área inteira de
        uma vez, e escolher modelo é decidir gasto — o mesmo motivo do teto de
        paralelismo.
      operationId: ModelBindingsController_setAreaBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: areaKey
          required: true
          in: path
          schema:
            example: qa
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModelBindingDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelBindingResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no escopo.
        '404':
          description: Escopo não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Define o modelo padrão de uma área
      tags:
        - llm
    delete:
      description: >-
        A área deixa de ter padrão próprio e passa a herdar do projeto (ou do
        workspace). Agentes que divergiram continuam divergindo: o binding deles
        é outro, e apagar este não pode decidir por eles.
      operationId: ModelBindingsController_clearAreaBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: areaKey
          required: true
          in: path
          schema:
            example: qa
            type: string
      responses:
        '204':
          description: A área voltou a herdar. Sem corpo.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no escopo.
        '404':
          description: Escopo não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Faz a área voltar a herdar o modelo do projeto
      tags:
        - llm
  /projects/{projectId}/backlog:
