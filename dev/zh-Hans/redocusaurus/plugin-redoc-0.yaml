            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAgentMessageDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemAoAgenteResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 未找到项目、会话或 handoff。
        '409':
          description: >-
            代理在此会话中未处于活跃状态；或正在等待执行计划的决定；或其队列中已有 10
            条消息（`fila_de_mensagens_cheia`）——消息已记录，但代理没有读取（ADR 0163，RN-673）。
        '422':
          description: >-
            该代理不接收聊天消息（Infra Lead 通过提议工作，engine 中没有自身条款的任何 slug
            都会被具名拒绝）——消息已记录，但没有任何代理读取（RN-584）。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 向活跃代理发送消息
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/agents/{agent}/messages/{messageId}/cancel:
    post:
      description: >-
        在代理处于回合中时发送的消息会在队列中等待，并在回合结束时被读取（RN-673）。等待期间，发送者可以取消它：engine
        将其从队列中移除并记录 `chat.message_cancelled`；它绝不会展示给模型。取消别人的消息返回 403。
      operationId: AgentsController_cancelQueued
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: agent
          required: true
          in: path
          description: 队列中持有该消息的代理的 slug。
          schema:
            example: po
            type: string
        - name: messageId
          required: true
          in: path
          description: '`chat.message` 事件的 id（消息路由返回的 `mensagemId`）。'
          schema:
            example: 01JC4Z0000EVENTO000000000001
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 未找到项目、会话或 handoff。
        '409':
          description: 该消息已不在队列中——代理已经读取了它，或它已被取消；或会话已关闭（RN-581）。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 取消代理队列中一条正在等待的消息
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/agents/{agent}/resume:
    post:
      description: >-
        Human gesture, with no cap: the automatic resume happens once at boot
        (ADR 0226) and this is the button for the rest. The reply is the ACCEPT
        (the turn goes up in the engine); progress arrives on the session
        channel. Requires `developer`.
      operationId: AgentResumeController_resume
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: agent
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色低于 `developer`。
        '404':
          description: Session does not exist.
        '409':
          description: >-
            Nothing to resume — `reason: turno_nao_interrompido` (the agent has
            no interrupted turn, or one is already running) or
            `agente_sem_retomada` (the agent cannot resume).
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: Resumes the turn an engine restart interrupted
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}/agents/{agent}/start:
    post:
      description: >-
        只有 Criativo 可以通过直接命令启动。其他每个代理都需要一个指向它的已接受的
        handoff——该规则位于领域中，而不在这里，试图绕过它会返回 409。
      operationId: AgentsController_start
      parameters:
        - name: projectId
