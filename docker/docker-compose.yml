name: brabo

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brabo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brabo}
      POSTGRES_DB: ${POSTGRES_DB:-brabo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brabo} -d ${POSTGRES_DB:-brabo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Neo4j — grafo de conhecimento (templates de prompt + memória relacional).
  # Community, instância única, sem cluster (Causal Cluster é recurso
  # Enterprise). Auth via NEO4J_AUTH; sem NEO4J_PASSWORD definido, a senha vira
  # vazia e o PRÓPRIO entrypoint da imagem recusa subir (exige >= 8
  # caracteres) — não é validação nossa, mas cumpre o mesmo espírito de "sem
  # default público que vira fallback silencioso" que o resto do compose segue
  # (ADR 0059).
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-dev-neo4j-password-change-me}
      # NÃO defina NEO4J_USERNAME/NEO4J_PASSWORD aqui (só NEO4J_AUTH acima) —
      # achado testando de verdade: o entrypoint da imagem converte TODA
      # variável com prefixo NEO4J_ num caminho de config
      # (server.<resto_convertido>), e "USERNAME"/"PASSWORD" não são chaves de
      # config válidas — com `server.config.strict_validation.enabled` (default
      # true) o container morre no boot com "Unrecognized setting". O
      # healthcheck abaixo passa a credencial como ARGUMENTO de linha de
      # comando (mesmo padrão do `pg_isready -U` do postgres, acima), não via
      # env.
      # Heap com teto EXPLÍCITO, mesmo motivo do OLLAMA_MAX_LOADED_MODELS
      # abaixo: sem isto o default do Neo4j dimensiona o heap como fração da
      # RAM do HOST inteiro (não do container), e a máquina de dev de 15GB já
      # reparte entre postgres, ollama, api, engine e web. Nome da env var
      # mudou entre Neo4j 4.x (NEO4J_dbms_memory_heap_max__size) e 5.x — esta é
      # a de 5.x, confirmada contra a doc oficial (server.memory.heap.max_size,
      # dois "_" representam o "_" literal da chave, um "_" representa ".").
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # cypher-shell vem embutido na imagem oficial (mesmo espírito do
      # pg_isready do postgres, acima).
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-dev-neo4j-password-change-me} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # Ollama local — baixa um modelo pequeno (llama3.2:1b) automaticamente
  # no primeiro start, pra o chat funcionar via curl sem passo manual.
  #
  # `profiles: ["local-llm"]` (mesmo padrão já usado para os dois serviços
  # `ollama`/`ollama-model-loader` em docker-compose.prod.yml, lá sob o nome
  # `llm`): um `docker compose up` sem `--profile` NÃO sobe este serviço.
  # Existe porque a porta publicada abaixo (OLLAMA_PORT, default 11434) é o
  # MESMO default de uma instalação nativa de Ollama na máquina do
  # desenvolvedor — com os dois de pé, o `up` falhava com "port is already
  # allocated". scripts/dev/preflight.mjs detecta o Ollama nativo e escolhe
  # o modo certo em `.env` (OLLAMA_MODE=host|container); quem sobe a stack
  # (scripts/dev/reset-total.sh e o bootstrap.sh, via
  # scripts/dev/perfil-ollama.sh) passa `--profile local-llm` só quando o
  # modo atual NÃO é `host`.
  ollama:
    # Pin deliberado (mesmo motivo do pgvector/pg16 e do neo4j:5.26 acima):
    # `latest` muda sob o pé sem aviso, e um upgrade silencioso de Ollama já
    # quebrou build antes (mudança de rota da API). Atualizar é decisão
    # manual — subir o número aqui, não seguir `latest`.
    image: ollama/ollama:0.33.1
    profiles: ["local-llm"]
    entrypoint: ["sh", "-c", "ollama serve & sleep 5 && ollama pull llama3.2:1b; wait"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      # Sem GPU (o host precisaria do nvidia-container-toolkit), o modelo vive
      # na RAM e o default de 5min descarrega ele entre um agente e outro — o
      # turno seguinte paga o carregamento de ~5GB de novo e estoura o
      # LLM_TURN_TIMEOUT_MS. Manter residente é o que torna uma sessão com
      # vários agentes viável nesta máquina.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1h}
      # Sem isto o KEEP_ALIVE acima acumula: cada modelo já usado fica
      # residente e uma máquina de 15GB chegou a 15,2GB só de pesos, com o
      # agente devolvendo resposta VAZIA por falta de memória. Um por vez.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      # O default do Ollama é 4096 tokens e ele TRUNCA em silêncio, enquanto o
      # ToolLoop monta o prompt pra uma janela de 128k. Na prática o agente
      # perdia as próprias instruções a partir do 2º/3º turno e passava a imitar
      # o que sobrava no fim do contexto (o schema das ferramentas). Ver ADR 0020.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}

  # Loader ONE-SHOT: puxa os modelos que o produto exige no boot
  # (OLLAMA_REQUIRED_MODELS), sem duplicar nem substituir o entrypoint do
  # `ollama` acima — aquele continua só com llama3.2:1b, para o uso direto do
  # engine. Este container NUNCA roda `ollama serve`: é um CLIENTE do daemon
  # do container `ollama` vizinho, falando com ele via OLLAMA_HOST (a CLI
  # `ollama pull`/`ollama list` é HTTP puro contra ${OLLAMA_HOST}/api/*, não
  # precisa de daemon local). Sem isto, `nomic-embed-text` nunca é puxado
  # automaticamente e o Chat RAG degrada em silêncio para busca léxico-only em
  # qualquer ambiente limpo — bug real de hoje, não só desta feature.
  #
  # A lógica mora em docker/ollama/pull-models.sh (montado read-only) em vez
  # de inline, para poder ser lida/testada fora do compose.
  ollama-model-loader:
    # MESMA tag do serviço `ollama` acima, de propósito: os dois falam o
    # mesmo protocolo HTTP, e divergir a versão entre daemon e CLI é o tipo
    # de coisa que só aparece em produção.
    image: ollama/ollama:0.33.1
    profiles: ["local-llm"]
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_REQUIRED_MODELS: ${OLLAMA_REQUIRED_MODELS:-gemma3:1b,yi-coder:1.5b,nomic-embed-text}
    entrypoint: ["sh", "/pull-models.sh"]
    volumes:
      - ./ollama/pull-models.sh:/pull-models.sh:ro
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
      args:
        # UID/GID do usuário do container — casam com o dono do bind mount
        # no host, pra ele nunca escrever como root (ver .env.example e
        # docs/getting-started.md). NÃO leia ${UID} do shell aqui: é
        # somente-leitura no bash e não é exportado ao ambiente por padrão,
        # então o Compose sempre veria vazio. `DEV_UID`/`DEV_GID` são
        # variáveis PRÓPRIAS, definidas no `.env` ou exportadas antes do
        # `docker compose up`.
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    working_dir: /workspace
    # `host.docker.internal` resolve de graça no Docker Desktop, mas NÃO no
    # Docker Engine nativo do Linux — precisa deste mapeamento explícito para
    # o gateway da bridge. É o que permite OLLAMA_HOST=http://host.docker.
    # internal:<porta> (OLLAMA_MODE=host, ver scripts/dev/preflight.mjs)
    # alcançar um Ollama nativo rodando no HOST a partir de dentro do
    # container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://brabo:brabo@postgres:5432/brabo}
      # DERIVA de WEB_PORT de propósito. A porta faz parte do contrato de CORS
      # (ADR 0037), e com dois defaults independentes bastava trocar WEB_PORT
      # para o browser abrir em :5174 enquanto a api só aceitava :5173 — CORS
      # quebrado em silêncio, com a mensagem apontando para o lugar errado. O
      # `strictPort` do Vite fechou o lado de quem escolhe a porta sozinho;
      # isto fecha o lado de quem a escolhe de propósito.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-5173}}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      # Teto de INATIVIDADE do socket na chamada ao Ollama (ver
      # ollama-provider.ts). Precisa ser >= o LLM_TURN_TIMEOUT_MS do engine,
      # senão quem desiste primeiro é a api e o teto do engine não vale nada.
      OLLAMA_REQUEST_TIMEOUT_MS: ${OLLAMA_REQUEST_TIMEOUT_MS:-300000}
      CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY:-dev-master-key-change-me}
      # Auth first-party (Fase 7a). AUTH_JWT_SECRET deriva o par Ed25519 que
      # assina o access token; BRABO_SERVICE_TOKEN autentica o tráfego interno
      # engine <-> api nos dois sentidos.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-auth-jwt-secret-change-me}
      BRABO_SERVICE_TOKEN: ${BRABO_SERVICE_TOKEN:-dev-service-token-change-me}
      # MAIL_TRANSPORT=log (default) — o link de verificação/reset sai no log
      # da api. Definir MAIL_TRANSPORT=smtp aqui (contra um MailHog local, por
      # exemplo) exige também SMTP_HOST/SMTP_USER/SMTP_PASSWORD/SMTP_FROM —
      # ver .env.example (backlog "SMTP real no MailSender", ADR 0096).
      AUTH_MAIL_LOG_TOKENS: ${AUTH_MAIL_LOG_TOKENS:-true}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # (o navegador/curl no host usam localhost:8080) — precisa bater
      # aqui dentro do container.
      # Git providers (Fase 2): OAuth Apps do GitHub/GitLab + provisionamento
      # de repositório local. GIT_OAUTH_STATE_SECRET é separado de
      # CREDENTIALS_MASTER_KEY de propósito — domínios de segurança
      # diferentes (HMAC de curta duração vs. derivação AES de longa
      # duração), rotação independente.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITLAB_OAUTH_CLIENT_ID: ${GITLAB_OAUTH_CLIENT_ID:-}
      GITLAB_OAUTH_CLIENT_SECRET: ${GITLAB_OAUTH_CLIENT_SECRET:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3000}
      GIT_OAUTH_STATE_SECRET: ${GIT_OAUTH_STATE_SECRET:-dev-oauth-state-secret-change-me}
      GIT_LOCAL_REPOS_ROOT: /data/git-repos
      # Comando síncrono api -> engine (criar sessão supervisionada na
      # ativação) — autenticado pelo segredo de serviço, simétrico à direção
      # engine -> api que já existe.
      ENGINE_URL: ${ENGINE_URL:-http://engine:4000}
      # URL do engine alcançável PELO BROWSER (fora da rede Docker) — usada
      # só para montar `engineWsUrl` no ticket do terminal/runner (RN-419,
      # ADR 0103/0104). Sem este default, o fallback do código caía em
      # `ENGINE_URL` (`http://engine:4000`, hostname que só resolve DENTRO
      # da rede do Compose) e a aba Terminal ficava presa em "Abrindo
      # terminal..." pra sempre — o browser nunca conseguia abrir o socket.
      # Mesmo padrão que `VITE_ENGINE_URL` já usa logo abaixo, no serviço `web`.
      ENGINE_PUBLIC_URL: ${ENGINE_PUBLIC_URL:-http://localhost:4000}
      # Pipeline de ações propostas (Fase 1 item 5): raiz compartilhada com
      # o engine (mesmo path, mesmo volume) onde mora o permissions.json
      # de cada projeto.
      PROJECT_WORKSPACES_ROOT: /data/project-workspaces
      # Grafo de conhecimento (ADR 0099) — memória DERIVADA do event log, nunca
      # fonte de verdade. `.env.example` documenta as TRÊS desde que o grafo
      # nasceu, mas elas nunca chegavam ao processo: este bloco não as
      # repassava e o serviço não tem `env_file`, então descomentar as linhas
      # do `.env` não ligava nada — o Neo4j subia saudável e a api dizia
      # "NEO4J_* ausentes, grafo desligado" ao lado dele, para sempre.
      #
      # `NEO4J_URI` vazia é o INTERRUPTOR, e vazia é o default: ausente = grafo
      # desligado, com as rotas dependentes degradando para 503 (só em produção
      # as três são obrigatórias e derrubam o boot). Ligar em dev é definir a
      # URI no `.env` — `bolt://neo4j:7687`, hostname da rede do Compose.
      #
      # Usuário e senha herdam os MESMOS defaults do `NEO4J_AUTH` do serviço
      # `neo4j` acima, de propósito: quem trocar a senha no `.env` troca a dos
      # dois lados de uma vez. Dois defaults independentes deixariam a api
      # tentando autenticar com uma senha que o servidor não tem mais.
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-dev-neo4j-password-change-me}
      # Broker de container (ADR 0130) — o único processo com acesso ao daemon
      # Docker. A api é a ÚNICA que o alcança (rede `broker`, `internal: true`,
      # sem porta publicada). Vazia é estado NORMAL: sem o profile
      # `container-broker`, o serviço nem sobe, e quem lê o estado observado
      # DIZ "não observado" em vez de herdar o registrado (RN-468).
      BROKER_URL: ${BROKER_URL:-}
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      # Explícito porque a api participa de DUAS redes: a default (postgres,
      # engine, web) e a interna do broker. Declarar `networks` num serviço
      # tira dele a default implícita — omitir `default` aqui desligaria a api
      # de todo o resto.
      - default
      - broker
    volumes:
      - ..:/workspace
      - api_root_node_modules:/workspace/node_modules
      - api_app_node_modules:/workspace/apps/api/node_modules
      - api_shared_node_modules:/workspace/packages/shared/node_modules
      # As duas linhas abaixo aceitam pasta REAL do host, não só volume
      # Docker gerenciado — ver GIT_LOCAL_REPOS_HOST_DIR/PROJECT_WORKSPACES_HOST_DIR
      # em .env.example. Sem a variável definida, o lado esquerdo é o NOME de
      # um volume declarado (comportamento de hoje, inalterado); definida com
      # um caminho (absoluto, `./relativo` ou `~/...`), o Compose troca para
      # bind mount na hora — mesma linha serve os dois casos.
      - ${GIT_LOCAL_REPOS_HOST_DIR:-git_local_repos}:/data/git-repos
      - ${PROJECT_WORKSPACES_HOST_DIR:-project_workspaces}:/data/project-workspaces
      # PROJETO NO MODO **LOCAL** (ADR 0072): o código mora numa pasta SUA, de
      # caminho livre, e as duas linhas acima não participam disso. Para cada
      # pasta que você for usar, acrescente aqui E no serviço `engine` a MESMA
      # linha, com o mesmo caminho absoluto dos dois lados do `:` — é o caminho
      # gravado em `projects.workspace_path`, lido pelos DOIS processos, e
      # montar em lugares diferentes faria o engine escrever onde a api não lê:
      #
      #   - /home/voce/projetos/loja:/home/voce/projetos/loja
      #
      # Sem a montagem, a CRIAÇÃO do projeto é recusada com 400 e a mensagem
      # traz esta linha (RN-170) — o projeto não nasce para travar depois, na
      # primeira ferramenta do primeiro agente. Ver docs/runbook.md, seção
      # "Projeto no modo Local". Não é variável de ambiente de propósito: o
      # caminho é dado do PROJETO, não da instalação.
    # SEM depends_on de `ollama` aqui, de propósito: desde que ele entrou em
    # `profiles: ["local-llm"]` (ver o comentário no serviço, acima), um
    # `docker compose up`/`config`/`ps` SEM `--profile` recusa o arquivo
    # inteiro com "depends on undefined service" quando um serviço FORA do
    # profile depende de um DENTRO dele — confirmado testando: quebrava até
    # o `preflight.mjs`, que lê `docker compose config`. A api já não
    # precisa da ordem de boot: o Ollama só é chamado quando um agente pede
    # um turno de LLM, nunca no startup dela.
    depends_on:
      postgres:
        condition: service_healthy

  engine:
    build:
      context: ..
      dockerfile: docker/engine/Dockerfile
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    working_dir: /workspace/apps/engine
    # Mesmo motivo do serviço `api`, acima: `host.docker.internal` não
    # resolve por padrão no Docker Engine nativo do Linux (só no Docker
    # Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Mesmo segredo dos dois lados — ver EngineServiceGuard e
      # EngineWeb.Plugs.VerifyServiceToken.
      BRABO_SERVICE_TOKEN: ${BRABO_SERVICE_TOKEN:-dev-service-token-change-me}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgres://brabo:brabo@postgres:5432/brabo}
      MIX_ENV: dev
      # config/test.exs (usado por `mix test`) monta a conexão a partir
      # destas variáveis, não de DATABASE_URL — sem isso o Postgrex tenta
      # localhost de dentro do container e nunca alcança o serviço postgres.
      POSTGRES_USER: ${POSTGRES_USER:-brabo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brabo}
      POSTGRES_HOST: postgres
      API_URL: ${API_URL:-http://api:3000}
      # A api chama o engine com um token client-credentials deste client
      # — o engine só precisa saber QUAL client esperar, nunca o secret.
      SESSION_HEARTBEAT_TIMEOUT_MS: ${SESSION_HEARTBEAT_TIMEOUT_MS:-30000}
      # Pipeline de ações propostas (Fase 1 item 5): mesma raiz de
      # workspaces que a api usa — Engine.Actions.Workspace faz o
      # checkout do bare repo (montado abaixo, read-only) ali dentro.
      PROJECT_WORKSPACES_ROOT: /data/project-workspaces
      TERMINAL_ACTION_TIMEOUT_MS: ${TERMINAL_ACTION_TIMEOUT_MS:-15000}
      # Teto de BYTES da saída de um comando (RN-074). A saída fica no
      # histórico do laço e viaja em TODO turno seguinte — sem teto, um `find`
      # numa árvore grande derruba a execução com 413 da api do Brabo (o
      # corpo de POST .../llm-turn estourando o limite de transporte dela,
      # não um limite do provider de LLM).
      TERMINAL_OUTPUT_MAX_BYTES: ${TERMINAL_OUTPUT_MAX_BYTES:-32768}
      SECOPS_SCAN_TIMEOUT_MS: ${SECOPS_SCAN_TIMEOUT_MS:-180000}
      # Já era lido do ambiente pelo runtime.exs, mas não era exposto aqui —
      # o default (8) é justo pro caminho feliz e apertado quando o agente
      # precisa de ciclos de correção (escrever, testar, corrigir, testar).
      #
      # Desde a FASE 14d este `8` é só o do agente CONVERSACIONAL: quem
      # trabalha com ferramenta pesada tem teto próprio, e a razão de cada um
      # está em `Engine.Harness.Iteracoes`.
      TOOL_LOOP_MAX_ITERATIONS: ${TOOL_LOOP_MAX_ITERATIONS:-8}
      TOOL_LOOP_MAX_ITERATIONS_EXECUCAO: ${TOOL_LOOP_MAX_ITERATIONS_EXECUCAO:-60}
      TOOL_LOOP_MAX_ITERATIONS_GATE: ${TOOL_LOOP_MAX_ITERATIONS_GATE:-60}
      # Também já era lido do runtime.exs sem estar exposto aqui. Com modelo
      # local o primeiro turno carrega os pesos antes do primeiro token, e
      # trocar de modelo entre agentes (dev e qa) paga esse custo mais de uma
      # vez na mesma sessão.
      LLM_TURN_TIMEOUT_MS: ${LLM_TURN_TIMEOUT_MS:-300000}
      # Ver runtime.exs: desligar os agentes de fundo libera o provider local
      # pros agentes de execução. Default ligado.
      START_OUTBOX_DRAIN: ${START_OUTBOX_DRAIN:-true}
      START_ANAMNESE: ${START_ANAMNESE:-true}
      # Triagem do Psicólogo (Fase 4b). Os defaults foram calibrados pensando
      # em modelo forte; num 7B local o modelo gasta tentativas hallucinando
      # event id (e sendo corretamente rejeitado) antes de acertar, então subir
      # o teto de iterações é o que faz o critério de aceite fechar sem afrouxar
      # a validação de evidência. Ver Engine.Psychologist.Triage.
      PSYCHOLOGIST_TRIAGE_THRESHOLD: ${PSYCHOLOGIST_TRIAGE_THRESHOLD:-20}
      PSYCHOLOGIST_MAX_ITERATIONS_LEVE: ${PSYCHOLOGIST_MAX_ITERATIONS_LEVE:-4}
      PSYCHOLOGIST_MAX_ITERATIONS_PESADA: ${PSYCHOLOGIST_MAX_ITERATIONS_PESADA:-8}
      PSYCHOLOGIST_BUDGET_MICROS_LEVE: ${PSYCHOLOGIST_BUDGET_MICROS_LEVE:-50000}
      PSYCHOLOGIST_BUDGET_MICROS_PESADA: ${PSYCHOLOGIST_BUDGET_MICROS_PESADA:-300000}
      # Anamnese (Fase 4b). O tick é global e faz fan-out por projeto; baixar o
      # intervalo num ambiente de teste é o que permite exercitar o ciclo sem
      # esperar 15 min (o endpoint de rodada sob demanda é o outro caminho).
      ANAMNESE_INTERVAL_SECONDS: ${ANAMNESE_INTERVAL_SECONDS:-900}
      ANAMNESE_INITIAL_WINDOW_DAYS: ${ANAMNESE_INITIAL_WINDOW_DAYS:-30}
      ANAMNESE_MIN_EVENTS: ${ANAMNESE_MIN_EVENTS:-10}
      ANAMNESE_MAX_ITERATIONS: ${ANAMNESE_MAX_ITERATIONS:-6}
      ANAMNESE_BUDGET_MICROS: ${ANAMNESE_BUDGET_MICROS:-200000}
      ANAMNESE_MAX_PROMPT_EVENTS: ${ANAMNESE_MAX_PROMPT_EVENTS:-500}
      ANAMNESE_MAX_PAYLOAD_CHARS: ${ANAMNESE_MAX_PAYLOAD_CHARS:-600}
    ports:
      - "${ENGINE_PORT:-4000}:4000"
    volumes:
      - ../apps/engine:/workspace/apps/engine
      - engine_build:/workspace/apps/engine/_build
      - engine_deps:/workspace/apps/engine/deps
      - engine_mix:/root/.mix
      - engine_hex:/root/.hex
      # RW (era :ro): desde a Fase 4a o executor `git_push` roda NO ENGINE
      # (Engine.Actions.GitExecutor) e empurra a branch do worktree pro bare
      # repo local. Com o mount read-only o push morre em "remote unpack
      # failed: unable to create temporary object directory", e a PR do dev
      # agent nunca chega a abrir.
      #
      # Mesma troca opcional para pasta real do host que o serviço `api` já
      # faz acima — TEM que ser o MESMO valor nos dois serviços (mesmo
      # volume/pasta), senão api e engine enxergam árvores diferentes.
      - ${GIT_LOCAL_REPOS_HOST_DIR:-git_local_repos}:/data/git-repos
      - ${PROJECT_WORKSPACES_HOST_DIR:-project_workspaces}:/data/project-workspaces
      # PROJETO NO MODO **LOCAL** (ADR 0072): a MESMA linha que você
      # acrescentar no serviço `api` precisa vir aqui também, com o mesmo
      # caminho absoluto — o engine é quem monta o worktree e escreve o código:
      #
      #   - /home/voce/projetos/loja:/home/voce/projetos/loja
      #
      # Montar só na api produz um projeto que a api ACEITA (ela valida o que
      # ela vê) e o engine não enxerga. Ver docs/runbook.md, "Projeto no modo
      # Local".
    depends_on:
      postgres:
        condition: service_healthy

  # Broker de container (ADR 0130) — o ÚNICO serviço com `/var/run/docker.sock`
  # montado, e o único que precisa dele. Não monte esse socket em nenhum outro.
  #
  # `profiles: ["container-broker"]`, mesmo mecanismo do `local-llm` acima: um
  # `docker compose up` sem `--profile` NÃO sobe este serviço. A escolha é
  # deliberada — dar acesso ao Docker do host a um processo que nada chama
  # ainda seria uma mudança de postura para toda máquina de desenvolvimento, em
  # troca de nada. Para ligar:
  #
  #   docker compose -f docker/docker-compose.yml --env-file .env \
  #     --profile container-broker up -d broker
  #
  # e, no `.env`, `BROKER_URL=http://broker:8090` mais
  # `PROJECT_WORKSPACES_HOST_DIR` (ver .env.example).
  #
  # NENHUM serviço tem `depends_on` dele, e isso é obrigatório: um serviço FORA
  # do profile dependendo de um DENTRO faz o Compose recusar o arquivo inteiro
  # com "depends on undefined service" — o mesmo achado registrado no serviço
  # `ollama`, acima.
  broker:
    build:
      context: ..
      dockerfile: docker/broker/Dockerfile
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    profiles: ["container-broker"]
    working_dir: /workspace
    environment:
      BROKER_PORT: 8090
      # Mesmo segredo dos outros dois serviços — ver EngineServiceGuard,
      # EngineWeb.Plugs.VerifyServiceToken e `apps/broker/src/config.ts`.
      BRABO_SERVICE_TOKEN: ${BRABO_SERVICE_TOKEN:-dev-service-token-change-me}
      # De onde o broker LÊ a decisão do Arquiteto. Ele não recebe
      # especificação de container: recebe `projectId` e vem buscar aqui.
      API_URL: ${API_URL:-http://api:3000}
      # A raiz das pastas de projeto **NO HOST** — não dentro de container
      # nenhum. O `-v` de um `docker run` é resolvido pelo DAEMON, que enxerga
      # o filesystem do host; um caminho de dentro da api faria o daemon criar
      # e montar uma pasta VAZIA. Sem esta variável, `start` recusa dizendo
      # exatamente isso, e as outras quatro operações continuam funcionando.
      #
      # Deriva de PROJECT_WORKSPACES_HOST_DIR (a mesma variável que troca o
      # volume nomeado por uma pasta real, ver .env.example): com volume
      # gerenciado não há caminho de host que sirva, e o broker prefere recusar
      # a adivinhar.
      PROJECT_WORKSPACES_HOST_ROOT: ${PROJECT_WORKSPACES_HOST_ROOT:-${PROJECT_WORKSPACES_HOST_DIR:-}}
    # SEM `ports:`. É a primeira camada da contenção: quem alcança este processo
    # alcança o Docker do host por procuração, e nada no host precisa alcançá-lo.
    networks:
      - broker
    volumes:
      - ..:/workspace
      - broker_root_node_modules:/workspace/node_modules
      - broker_app_node_modules:/workspace/apps/broker/node_modules
      - broker_port_node_modules:/workspace/packages/docker-port/node_modules
      # O socket. `:ro` é COSMÉTICO aqui e não vale nada como contenção — o
      # protocolo do Docker é HTTP sobre o socket, e escrever no socket é o que
      # toda operação faz. A contenção real é a de cima (sem porta), a
      # autenticação por token e o fato de a especificação ser computada.
      - /var/run/docker.sock:/var/run/docker.sock
    # O socket é `root:docker` no host, e o processo aqui roda como DEV_UID.
    # `DOCKER_GID` é o gid do grupo `docker` da SUA máquina
    # (`getent group docker | cut -d: -f3`) — o default 999 é o mais comum e
    # está errado em várias distribuições. Errar aqui dá "permission denied" no
    # socket, que o `DockerIndisponivelError` nomeia com a dica do grupo.
    group_add:
      - "${DOCKER_GID:-999}"

  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    working_dir: /workspace
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_ENGINE_URL: ${VITE_ENGINE_URL:-http://localhost:4000}
      # do token, já que o browser roda fora da rede do compose.
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ..:/workspace
      - web_root_node_modules:/workspace/node_modules
      - web_app_node_modules:/workspace/apps/web/node_modules
      - web_shared_node_modules:/workspace/packages/shared/node_modules
    depends_on:
      - api
      - engine

networks:
  # Rede PRÓPRIA do broker, `internal: true` (ADR 0130). Duas consequências, e
  # as duas são o ponto: o engine e o web NÃO alcançam o broker (eles não estão
  # nela), e o broker não alcança a internet. Só a api está dos dois lados.
  #
  # Isto não substitui o token de serviço — é a camada de baixo dele. Um
  # processo que fala com o Docker do host merece as duas.
  broker:
    internal: true

volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
  ollama_data:
  git_local_repos:
  api_root_node_modules:
  api_app_node_modules:
  api_shared_node_modules:
  web_root_node_modules:
  web_app_node_modules:
  web_shared_node_modules:
  engine_build:
  engine_deps:
  engine_mix:
  engine_hex:
  project_workspaces:
  broker_root_node_modules:
  broker_app_node_modules:
  broker_port_node_modules:
