packages:
  - apps/api
  - apps/runner
  - apps/web
  - packages/*
  # scripts/ é pacote do workspace só para carregar vitest e `type: module` —
  # este último é o que faz o Node 24 executar os `.ts` de scripts/ci/ direto,
  # sem build. Os `.mjs` ao lado não são afetados: `.mjs` é ESM sempre.
  - scripts

# `website/` NÃO é membro do workspace (ADR 0117) — tem `pnpm-lock.yaml`
# PRÓPRIO, instalado com `pnpm install` de dentro de `website/`, nunca com
# `pnpm --filter website` (esse verbo exige membership). O motivo é isolar o
# `pnpm audit` do produto da árvore de dependências do Docusaurus, que nunca
# chega a nenhuma imagem. Scripts que hoje leem `docs:*` usam `pnpm --dir
# website <script>`.

# Overrides de SEGURANÇA — cada linha fecha um alerta do Dependabot sobre uma
# dependência TRANSITIVA, onde subir o pai não resolve porque o pai não tem
# versão nova.
#
# Duas disciplinas aqui:
#
#   1. a chave é a FAIXA VULNERÁVEL do aviso, não a versão que está instalada
#      hoje. Fixar `js-yaml@5.2.1` fecharia o buraco de hoje e abriria de novo,
#      em silêncio, no dia em que uma transitiva pedisse 5.2.0;
#   2. a faixa é presa à LINHA MAIOR afetada. `lodash@<4.18.0` não toca a 5.x
#      de ninguém, e `yaml@>=1.0.0 <1.10.3` não arrasta a 2.9.0 que o
#      workspace usa de propósito.
#
# Cada entrada some quando o pai apontar para uma versão corrigida sozinho —
# `pnpm audit` reprovando é o sinal de que ainda são necessárias, e o
# `pnpm why` mostra se ainda há quem peça a antiga.
overrides:
  # MISTA (ADR 0117) — duplicada em `website/package.json` (`pnpm.overrides`).
  # `pnpm why js-yaml -r` mostra DOIS pais reais, não só o `@nestjs/swagger`
  # que o comentário original citava: o `website`, via `@redocly/openapi-core`
  # (`docusaurus-plugin-openapi-docs`). As duas árvores agora têm lockfile
  # separado — a entrada precisa existir dos dois lados ou o lado que perder
  # o override volta a resolver a faixa vulnerável em silêncio.
  #
  # HIGH · GHSA-pm4m-ph32-ghv5 — parsing exponencial em flow collections (DoS).
  # Entra por `@nestjs/swagger@11.4.6`, que fixa `js-yaml` em 5.2.1 EXATO — não
  # é faixa, é pino — e é a última versão publicada, então não há bump de
  # upstream que resolva. Esta é a ÚNICA destas que chega na imagem de produção
  # da api (o Trivy reprovava o scan por ela); as outras são todas de build.
  #
  # A 5.2.2 é patch da mesma linha, só o fix do parser, e o `@nestjs/swagger`
  # usa a lib apenas para serializar o documento em YAML — caminho que a api
  # nem exerce, porque o export é JSON.
  #
  # Entrou primeiro no #70 como `js-yaml@5.2.1: 5.2.2`; virou faixa aqui pelo
  # motivo explicado na disciplina 1 acima.
  js-yaml@>=5.0.0 <5.2.2: 5.2.2
  # MISTA (ADR 0117) — duplicada em `website/package.json`. `pnpm why -r`
  # mostra que esta faixa TAMBÉM entra por `apps/api`, via `eslint@9` →
  # `@eslint/eslintrc` (`js-yaml: ^4.1.0`) — não só pelo subárvore do
  # `docusaurus-theme-openapi-docs` que o comentário original citava. Sem a
  # entrada nos dois `package.json`, um dos dois lockfiles volta a resolver a
  # faixa vulnerável quando o outro for o único a manter a proteção.
  #
  # HIGH · GHSA-52cp-r559-cp3m (mais duas moderadas na mesma linha). Entra por
  # `openapi-to-postmanv2`, do subárvore de geração de snippets do
  # docusaurus-theme-openapi-docs. A 4.3.0 já estava na árvore.
  #
  # HIGH · GHSA-5p4m-2wfm-xmqj (alerta #27, sem CVE ainda) — consumo
  # quadrático de CPU ao resolver `!!omap` (DoS). A faixa `4.3.0` acima já não
  # bastava: a correção saiu na 4.3.1, então o teto virou 4.3.1 e a faixa
  # cresceu para cobrir a 4.3.0 também.
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  # MISTA (ADR 0117) — duplicada em `website/package.json`. `mermaid` é
  # dependência de RUNTIME do próprio `apps/web` (ADR 0068, diagrama C4), não
  # só do `website` — `pnpm why mermaid -r` mostra os dois pais.
  #
  # MODERATE/LOW · alertas #22-#26 (CVE-2026-71436, -71437, -71438, -71439,
  # -50159). Entra por `@docusaurus/theme-mermaid`, que o `website` declara
  # direto, e por `web`, que declara `mermaid` direto também — mas o
  # `theme-mermaid` fixa a faixa dele (`>=11.6.0`, sem teto) e é quem resolve
  # a versão real. Faixa presa em `11.0.0-alpha.1` para cobrir a mais larga
  # das cinco advisories.
  mermaid@>=11.0.0-alpha.1 <11.16.1: 11.16.1
  # MISTA (ADR 0117) — duplicada em `website/package.json`. `vite` (usado por
  # `apps/web`, não só pelo `website`) declara `postcss: ^8.5.17` como
  # dependência própria — faixa que INCLUI a vulnerável. `pnpm why postcss -r`
  # confirma `web` como pai, ao lado do subárvore do
  # `docusaurus-theme-openapi-docs` que o comentário original citava sozinho.
  #
  # MODERATE · CVE-2026-69153 (alerta #21). Entra pela árvore inteira de
  # plugins `@csstools/postcss-*` do `postcss-preset-env` (transitivo do
  # docusaurus-theme-openapi-docs) — todos pedem `postcss: ^8.4`, então
  # qualquer 8.5.23 serve.
  postcss@<8.5.23: 8.5.23
  # MISTA (ADR 0117) — duplicada em `website/package.json`. `pnpm why
  # fast-uri -r` mostra `ajv@8.18.0` também entrando por `apps/api`, via
  # `@angular-devkit/core` → `@nestjs/schematics` → `@nestjs/cli`
  # (devDependency), não só pelo `@redocly/ajv` do `website` que o comentário
  # original citava.
  #
  # HIGH · CVE-2026-18446 (alerta #20). Entra por `ajv`/`@redocly/ajv`
  # (`fast-uri: ^3.0.1` nos dois) — só uma das duas versões na árvore estava
  # desatualizada, a outra já era 3.1.5.
  fast-uri@>=3.0.0 <3.1.5: 3.1.5
  # MISTA — já era o exemplo canônico de override que serve aos dois lados
  # (ADR 0117 mantém a duplicação em `website/package.json`).
  #
  # HIGH + 3 MODERATE · CVE-2026-13697, -14643, -15157, -16728, -16729
  # (alertas #15-#19). Entra por `cheerio` (busca local do Docusaurus, no
  # `website`) e por `jsdom` — devDependency direta de `apps/web` para o
  # ambiente de teste do vitest. Ambos pedem `undici` em faixa `^7.x`, então
  # 7.29.0 satisfaz os dois sem tocar o `jsdom` em si.
  undici@>=7.0.0 <7.29.0: 7.29.0
  # MISTA (ADR 0117) — duplicada em `website/package.json`. `@docusaurus/core`
  # declara `lodash` DIRETO, então o `website` também precisa da correção, não
  # só a api via `@nestjs/swagger` que o comentário original citava.
  #
  # HIGH · GHSA-r5fr-rjxr-66jc. A versão corrigida que o aviso cita (4.17.24)
  # NÃO existe no registry — a linha 4.17 parou na 4.17.23 e a correção saiu na
  # 4.18.0. Daí o alvo ser a 4.18.1, que o `@nestjs/swagger` já traz.
  lodash@<4.18.0: 4.18.1
  # WEBSITE-EXCLUSIVA (ADR 0117) — `pnpm why serialize-javascript -r` não
  # mostra nenhum pai fora da árvore do `website`. Saiu daqui, entrou em
  # `website/package.json`; não é mais necessária no lockfile do produto.
  #
  # HIGH · GHSA-5c6j-r48x-rmvq e moderada GHSA-qj8w-gfj5-8c6v. Entra pelos
  # plugins de webpack do Docusaurus. A 7.x pede Node >= 20; o CI roda 24.
  # (comentário preservado em `website/package.json`, onde a entrada vive agora)
  # WEBSITE-EXCLUSIVA (ADR 0117) — `pnpm why yaml -r` só mostra a árvore
  # `oas-linter`/`oas-validator`/`swagger2openapi` do `website`; a 2.9.0 que o
  # resto do workspace usa direto nunca entra nesta faixa. Saiu daqui, entrou
  # em `website/package.json`.
  #
  # MODERATE · GHSA-48c2-rrv3-qjmp. Patch dentro da 1.x — não confundir com o
  # `yaml` 2.9.0 que o workspace usa direto, fora da faixa.
  # (comentário preservado em `website/package.json`, onde a entrada vive agora)
  # MISTA (ADR 0117) — duplicada em `website/package.json`. `mermaid` (agora
  # dependência de `web` também, não só do `website`) é quem pede `uuid` — o
  # `pnpm why uuid -r` mostra os dois lados.
  #
  # MODERATE · GHSA-w5hq-g745-h8pq. Entra por `postman-collection` e por
  # `sockjs` (o dev-server do webpack), os dois com `require('uuid').v4`.
  #
  # O alvo é a 11.1.1 EXATA, e isso é load-bearing: a uuid virou ESM-only na
  # 14 (`type: module`, sem `main`), e `^11.1.1` deixaria a porta aberta para o
  # resolvedor escolher algo assim mais tarde. A 11.1.1 ainda é dual — conferi
  # instalando-a num diretório à parte e chamando `require('uuid').v4()`, que
  # devolve um uuid.
  uuid@<11.1.1: 11.1.1
  # PRODUTO-EXCLUSIVA — `pnpm why esbuild -r` não mostra nenhum pai dentro da
  # árvore do `website`; não precisa de entrada equivalente lá (ADR 0117).
  #
  # MODERATE · GHSA-67mh-4wv8-2f99 — o dev-server do esbuild aceita requisição
  # de qualquer origem. Entra por `@esbuild-kit/core-utils`, que o drizzle-kit
  # ainda arrasta (e a 0.31.10 já é a última publicada).
  #
  # O caminho não é explorável aqui: o `esbuild --serve` nunca sobe, o
  # drizzle-kit só usa a lib para transpilar `drizzle.config.ts`. Mesmo assim
  # vale fechar — o alerta some e a 0.25.12 já estava na árvore por outro pai.
  esbuild@<0.24.3: 0.25.12
  # MISTA (ADR 0117) — duplicada em `website/package.json`. O `nanoid` chega
  # SÓ pelo `postcss@8.5.23` acima, e esse `postcss` agora tem pai dos dois
  # lados (`web` via `vite`, `website` via `postcss-preset-env`) — então os
  # dois lockfiles precisam da mesma trava.
  #
  # HIGH · CVE-2026-67213 (alerta #29, revisado como #32) — gerador
  # customizado entra em laço infinito quando `size` é zero (DoS). Entra por
  # `postcss@8.5.23`, que pede `nanoid: ^3.3.16`. O fix original saiu na
  # 3.3.17 (alerta #29), mas o advisory foi revisado: a correção era
  # incompleta, e a faixa vulnerável cresceu até < 3.3.18 (alerta #32) — a
  # faixa aqui acompanha a revisão. Note que o `postcss` aqui já é o alvo de
  # um override acima: os dois convivem, um fixa o pai e o outro a
  # transitiva dele.
  nanoid@>=3.0.0 <3.3.18: 3.3.18
  # MISTA (ADR 0117) — duplicada em `website/package.json`. Chega pelo
  # `mermaid@11.16.1` acima, que agora tem pai dos dois lados — mesma lógica
  # do `uuid`.
  #
  # MODERATE · GHSA (alerta #28) — o `IN_PLACE` remove o hook e deixa a
  # subárvore destacada executável, o que reabre XSS. Entra por
  # `mermaid@11.16.1` (ele próprio um override acima), que pede
  # `dompurify: ^3.3.3`; a 3.4.13 é a correção e cabe na faixa.
  dompurify@>=3.0.0 <3.4.13: 3.4.13


# O default do pnpm ("install") roda um `pnpm install` do workspace INTEIRO,
# em silêncio, antes de executar QUALQUER script — inclusive `pn bootstrap`/
# `pnpm bootstrap`, que nem chega a abrir o menu (scripts/dev/bootstrap.sh).
# Isso quebra sempre que UMA pasta de UM workspace (ex.: website/, populada
# pelo Docker rodando como root — sem `USER` nos Dockerfiles de dev) fica com
# dono divergente do host: o install implícito falha com EACCES antes do
# bootstrap.sh ter a chance de se auto-curar (função `corrigir_donos`).
#
# Vai em `pnpm-workspace.yaml`, não em `.npmrc`: testado nesta versão do
# pnpm (11.3.0) — `.npmrc` (mesmo com o tipo certo, boolean) é ignorado para
# esta chave, só a forma camelCase aqui é respeitada.
verifyDepsBeforeRun: false

allowBuilds:
  '@swc/core': true
  esbuild: true
  msw: true
  # false de propósito: o protobufjs entra como dependência transitiva do
  # exporter OTLP, e o exporter que usamos é o de HTTP/JSON — não precisa da
  # geração de código dele. Não rodar postinstall de dependência transitiva é a
  # mesma disciplina de pin e checksum do resto da Fase 5.
  protobufjs: false
  # false pelo mesmo critério: o core-js entra como transitiva do Docusaurus e
  # o postinstall dele só imprime pedido de financiamento — não gera nem
  # compila nada. Declarado explicitamente porque o pnpm reprova build
  # ignorado que ninguém decidiu.
  core-js: false
  unrs-resolver: true
  # `node-pty` (apps/runner) é binding NATIVO de verdade — compila C++ com
  # node-gyp no postinstall para abrir PTY de verdade (o mesmo binding que o
  # VS Code usa). Diferente dos `false` abaixo, este build faz algo que o
  # produto precisa: sem ele, o modo terminal interativo do runner não existe.
  'node-pty': true
  # false pelo mesmo critério dos dois acima: o @scarf/scarf entra como
  # transitiva do @nestjs/swagger (Fase 7) e o postinstall dele só reporta
  # telemetria de instalação para um servidor de terceiros. Não gera nem
  # compila nada, e chamada de rede em `pnpm install` é exatamente o que a
  # disciplina de build da Fase 5 recusa.
  '@scarf/scarf': false
  # false pelo mesmo critério: os dois entram como transitivas do
  # docusaurus-theme-openapi-docs (Fase 7b).
  #
  # O postinstall do `postman-code-generators` roda um `npm install` DENTRO de
  # cada subdiretório de gerador — instalação aninhada, com rede, no meio do
  # nosso `pnpm install`. É exatamente o que a disciplina de build da Fase 5
  # recusa. O preço é não ter os snippets de código gerados por linguagem na
  # página da rota; o `curl` continua, porque é o tema que o monta.
  postman-code-generators: false
  # O `@parcel/watcher` compila binding nativo para observar arquivos, e só é
  # usado em modo watch. O build de produção e o `docusaurus gen-api-docs` não
  # dependem dele.
  '@parcel/watcher': false
minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.113.0'
