          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResponseDto'
        '400':
          description: Некорректное тело.
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '404':
          description: Сессия, проект или ресурс не найдены.
      security:
        - service-token: []
      summary: Связывает историю с модулями, которых она касается
      tags:
        - internal
  /internal/sessions/{sessionId}/tasks:
