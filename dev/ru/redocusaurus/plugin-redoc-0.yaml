    RecordDelegationInternalDto:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
          example: 01JC4Z0000PROJETO0000000001
        area:
          type: string
          example: qa
          description: >-
            Область, которая делегировала, — "qa" (Фаза 8b) или "infra" (Фаза
            8c). Текст, а не перечисление.
        taskId:
          type: string
          format: uuid
          example: 01JC4Z0000TASK00000000001
          description: >-
            Задача backlog за делегированием, если она есть. QA (Фаза 8b) всегда
            её отправляет; Infra (Фаза 8c) никогда — делегирование касается
            СЕССИИ, а не задачи.
        leadAgent:
          type: string
          example: qa-lead
        subagent:
          type: string
          example: qa-automacao
        status:
          type: string
          enum:
            - completed
            - failed
            - dispensed
          example: completed
        parecerArtifactId:
          type: string
          example: evt_01jc4z0000parecer000000001
          description: >-
            Id session_event `artifact.qa_verdict` для ВЕРДИКТА ЭТОЙ
            подспециальности — обязателен, когда `status` равен "completed".
        failureOrigin:
          type: string
          enum:
            - infra
            - modelo
            - codigo
            - politica
          example: infra
          description: >-
            ИСТОЧНИК сбоя (ADR 0020/0038), никогда методом исключения, —
            обязателен, когда `status` равен "failed".
        failureReason:
          type: string
          example: iteration limit reached without emit_perf_seguranca_verdict
        justification:
          type: string
          example: story with no relevant performance NFR
          description: >-
            Почему lead решил НЕ делегировать — обязательно, когда `status`
            равен "dispensed". Никогда не остаётся пустым: отказ от
            делегирования — записанное решение, а не молчание (CLAUDE.md, Фаза
            8b, пункт 2).
      required:
        - projectId
        - area
        - leadAgent
        - subagent
        - status
