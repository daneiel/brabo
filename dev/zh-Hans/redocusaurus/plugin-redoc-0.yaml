        检测到的语言成为偏好的唯一途径（RN-624）：仅凭检测绝不会改变任何东西。`confirm` 写入 `detectedLanguage` +
        `detectedLanguageConfirmedAt`；`decline` 记录拒绝，以免再次询问同一种语言。返回回答之后的偏好设置。
      operationId: UserPreferencesController_answerDetected
