        用户机器上的绝对路径，本地代理会把工作复制到这里（RN-515，ADR
        0147）——一个位于挂载基目录之外的文件夹，这正是镜像存在的全部理由。按项目设置，绝不全局：一个全局目标会把项目 B 的制品放进项目 A
        的文件夹，而用户会从内容中发现，而不是从错误中发现。`mirrorPath: null` 会清除它并关闭镜像——该键是必需的，省略它返回
        400，因为省略字段的请求体与请求清除无法区分。`null` 是项目的正常状态。`maintainer`，与 `execution-mode`
        和 `projects-base` 的最低要求相同：此路由涉及运营者自己文件系统上的路径。它只校验词法形态，并以 400 拒绝位于
        `workspacePath` 内部或包含它的目标（同一循环的两个方向），以及 `container` 项目上的任何目标。它从不触碰磁盘：API
        看不到目标所在的机器。写入镜像不是 proposed_action——它是用户声明的配置，不是代理请求执行操作。
