      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/agents/{agent}/message:
    post:
      description: >-
        Ответ — это лишь подтверждение, и он возвращается при ПРИНЯТИИ — до
        окончания хода агента (ADR 0163). То, что отвечает агент, приходит через
        журнал событий и канал сессии, а не через этот вызов. Если агент посреди
        хода, сообщение НЕ отклоняется: оно попадает в очередь агента (`entrega:
        "enfileirada"`) и читается вместе с другими поставленными в очередь за
        один ход, когда текущий закончится; пока оно ждёт, его можно отменить
        (RN-673, ADR 0191).
      operationId: AgentsController_message
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: agent
          required: true
          in: path
          description: >-
            Slug разговорного агента, который читает сообщение: criativo, po,
            arquiteto, dev-lead, ux-designer или staff. Любой другой slug —
            включая infra — отклоняется с 422; оно никогда не доставляется
            агенту по умолчанию (RN-584).
          schema:
            example: po
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAgentMessageDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemAoAgenteResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, сессия или handoff не найдены.
        '409':
          description: >-
            Агент не активен в этой сессии; или он ждёт решения по плану
            выполнения; или в его очереди уже 10 сообщений
            (`fila_de_mensagens_cheia`) — сообщение записано, но агент его НЕ
            прочитал (ADR 0163, RN-673).
        '422':
          description: >-
            Агент не принимает сообщения чата (Infra Lead работает через
            предложения, а любой slug без своего условия в engine отклоняется по
            имени) — сообщение записано, но НИ ОДИН агент его не прочитал
            (RN-584).
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Отправляет сообщение активному агенту
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/agents/{agent}/messages/{messageId}/cancel:
    post:
      description: >-
        Сообщение, отправленное, пока агент посреди хода, ждёт в очереди и
        читается, когда ход закончится (RN-673). Пока оно ждёт, ОТПРАВИВШИЙ его
        может его отменить: engine удаляет его из очереди и записывает
        `chat.message_cancelled`; модели оно никогда не показывается. Чужое
        сообщение — 403.
      operationId: AgentsController_cancelQueued
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: agent
          required: true
          in: path
          description: Slug агента, в очереди которого находится сообщение.
          schema:
            example: po
            type: string
        - name: messageId
          required: true
          in: path
          description: >-
            Id события `chat.message` (`mensagemId`, который вернул маршрут
            сообщения).
          schema:
            example: 01JC4Z0000EVENTO000000000001
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, сессия или handoff не найдены.
        '409':
          description: >-
            Сообщение больше не в очереди — агент его уже прочитал или оно уже
            отменено; или сессия закрыта (RN-581).
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Отменяет одно сообщение, ожидающее в очереди агента
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/agents/{agent}/start:
