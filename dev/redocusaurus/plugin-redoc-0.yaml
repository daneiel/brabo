            já rodando.
        storyPromotion:
          type: string
          enum:
            - manual
            - auto
          example: auto
          description: >-
            Quem promove uma história de `draft` para `ready` (Fase 12c —
            RN-048). `auto` (padrão de projeto novo desde a RN-659): história
            completa já nasce `ready`, sem passo humano. `manual`: o PO propõe e
            VOCÊ decide, na aba Backlog. Mudar o padrão não reescreveu projeto
            existente nenhum. As validações de domínio
            (DoD/DoR/RF/regra/módulos) são as MESMAS nos dois modos; o modo só
            muda quem dispara.
        executionMode:
          type: string
          enum:
            - container
            - mounted
            - runner
          example: container
          description: >-
            ONDE o comando deste projeto EXECUTA (RN-169/RN-421 — ADR
            0072/0104). `container` (padrão): a pasta gerenciada pelo produto
            dentro de PROJECT_WORKSPACES_ROOT, o comportamento de sempre.
            `mounted`: uma pasta SUA, dada em `workspacePath`, dentro da base da
            instalação `BRABO_PROJECTS_BASE` (ADR 0141) — a criação valida só o
            FORMATO do caminho mais essa base, e a pasta em si é criada depois,
            quando a Infra sobe o container (RN-501, ADR 0142). `runner`: uma
            pasta SUA que NÃO precisa de bind-mount — a criação só valida o
            formato do caminho e o projeto nasce "não verificado"; rode
            `brabo-runner --project <id> --dir <folder>` na sua máquina para
            confirmá-lo (RN-423).
        workspacePath:
          type: string
          example: /home/you/projects/store
          description: >-
            O caminho ABSOLUTO da pasta, obrigatório quando `executionMode` é
            `mounted` ou `runner`, e recusado quando é `container`. Nos DOIS só
            o FORMATO é validado agora — absoluto, sem `..`, não a raiz do
            sistema, não pasta de sistema, não sobreposto ao checkout do Brabo
            (RN-422/RN-423). `mounted` acrescenta uma regra: tem de ficar dentro
            de `BRABO_PROJECTS_BASE`, a única pasta da sua máquina que os
            containers do Brabo enxergam (ADR 0141) — sem base configurada o
            modo não está disponível nesta instalação e a criação diz isso. O
            disco é tocado depois: pelo runner em `runner`, e quando a Infra
            sobe o container em `mounted` (RN-501, ADR 0142).
        language:
          type: string
          example: pt-BR
          maxLength: 35
          description: >-
            O idioma do PROJETO (RN-619) — artefatos compartilhados e turnos sem
            autor humano o usam. Qualquer código BCP-47 que o servidor
            reconhece, gravado na forma canônica; um não reconhecido é 400.
            Omitido, o projeto começa com o idioma de resposta efetivo de quem o
            criou (RN-618: escolha da conta > detecção confirmada > idioma da
            interface).
      required:
        - name
        - slug
    CreateSessionDto:
      type: object
      properties:
        kind:
          type: string
          enum:
            - consultiva
            - criativa
          example: criativa
          description: >-
