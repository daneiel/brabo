  /projects/{projectId}/members:
    get:
      description: >-
        Только те, кто был связан ЗДЕСЬ, с ролью этой связи, — тот, кто попадает
        в проект только через рабочее пространство, не имеет строки и не
        появляется.
      operationId: ProjectsController_listMembers
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMemberComUsuarioResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует или невидим для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перечисляет участников проекта
      tags:
        - projects
    post:
      description: >-
        Эта роль ПЕРЕОПРЕДЕЛЯЕТ то, что у человека есть в рабочем пространстве,
        в обе стороны: связывание кого-то как `viewer` здесь действительно
        ограничивает `developer` рабочего пространства в этом проекте. Два
        действия отклоняются с 403 и не могут быть нигде включены: понижение
        `owner` рабочего пространства и изменение СОБСТВЕННОЙ роли — вниз или
        вверх, поскольку самоповышение — та половина, которая повышает
        привилегии.
      operationId: ProjectsController_addMember
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: >-
            Недостаточная роль в проекте ИЛИ один из двух потолков (цель —
            `owner` рабочего пространства; цель — сам вызывающий, и запрошенная
            роль отличается от его текущей эффективной).
        '404':
          description: Проект не существует или невидим для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Связывает пользователя с проектом
      tags:
        - projects
  /projects/{projectId}/members/{userId}:
    delete:
      description: >-
        Удаляет только связь с ПРОЕКТОМ. Тот, у кого есть роль в рабочем
        пространстве, продолжает видеть проект по наследованию, — и поскольку
        роль проекта ПЕРЕОПРЕДЕЛЯЕТ роль рабочего пространства в обе стороны,
        это наследование может быть НИЖЕ того, что давала строка. Поэтому
        удаление собственной строки отклоняется с 403 всякий раз, когда итоговый
        эффект — понижение (включая случай, когда роли в рабочем пространстве
        нет вовсе); удаление, когда рабочее пространство держит ту же роль, и
        удаление кого-либо другого по-прежнему работают.
      operationId: ProjectsController_removeMember
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: userId
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Связь удалена. Без тела.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: >-
            Недостаточная роль в проекте ИЛИ вызывающий удаляет собственную
            строку и в итоге получил бы роль ниже, чем сейчас.
        '404':
          description: Проект не существует или невидим для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Отвязывает пользователя от проекта
      tags:
        - projects
  /projects/{projectId}/mirror-path:
    put:
      description: >-
        Абсолютный путь НА МАШИНЕ ПОЛЬЗОВАТЕЛЯ, куда локальный агент копирует
        работу (RN-515, ADR 0147), — папка ВНЕ смонтированной базы, в чём и
        состоит весь смысл существования зеркала. На проект и никогда не
        глобально: одно глобальное назначение помещало бы артефакты проекта B в
        папку проекта A, и пользователь узнал бы об этом по содержимому, а не из
        ошибки. `mirrorPath: null` ОЧИЩАЕТ его и выключает зеркало — ключ
        обязателен, его отсутствие даёт 400, потому что тело без поля было бы
        неотличимо от просьбы очистить. `null` — НОРМАЛЬНОЕ состояние проекта.
        `maintainer`, тот же минимум, что и у `execution-mode` и
        `projects-base`: этот маршрут говорит о пути в собственной файловой
        системе оператора. Он проверяет ТОЛЬКО ЛЕКСИЧЕСКУЮ форму и отклоняет с
        400 назначение внутри `workspacePath` или содержащее его (оба
        направления одной петли), а также вообще любое назначение у проекта
        `container`. Он никогда не касается диска: API не видит машину, на
        которой будет находиться назначение. Запись зеркала НЕ является
        proposed_action — это конфигурация, объявленная пользователем, а не
        агент, просящий действовать.
      operationId: ProjectsController_setMirrorPathRoute
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMirrorPathDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует или невидим для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Объявляет (или очищает) назначение зеркала проекта
      tags:
        - projects
  /projects/{projectId}/mirror-state:
    get:
      description: >-
        Телеметрия, которую локальный агент отправил по каналу после копирования
        работы в папку пользователя (ADR 0147, пункт 7), — никогда не журнал
        событий, потому что у раунда зеркала нет сессии, а
        `session_events.session_id` — `NOT NULL` (то же рассуждение, что сделало
        `rag_searches` таблицей). ТРИ ответа, которые никогда не сливаются в
        один (RN-088): `never` (ни один раунд не сообщался), `synced` (последний
        раунд скопировал — `filesCopied` может быть `0`, что значит «посмотрел,
        и копировать было нечего») и `failed`. Сбой никогда не стирает последнюю
        успешную синхронизацию, а успех никогда не стирает последнюю ошибку:
        какой из них ТЕКУЩИЙ, выясняется сравнением двух меток времени, поэтому
        экран может сказать «сбой с сегодняшнего дня, последняя хорошая копия
        была вчера, 412 файлов». `lastDestination` ЗАМОРОЖЕН — он расходится с
        `mirrorPath` после того, как кто-то меняет назначение, потому что
        разрешение передаётся в join и меняется только при переподключении
        runner (RN-516). `viewer`, тот же минимум, что и для чтения проекта,
        который уже несёт `mirrorPath`.
      operationId: ProjectsController_mirrorStateRoute
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMirrorStateResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует или невидим для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Что сделал последний раунд зеркала (RN-517)
      tags:
        - projects
  /projects/{projectId}/model-binding:
    get:
      description: >-
        СЫРОЙ binding этой области действия — `null`, если проект только
        наследует от рабочего пространства.
      operationId: ModelBindingsController_getProjectBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelBindingResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в области действия.
        '404':
          description: Область действия не найдена.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Читает binding модели проекта
      tags:
        - llm
    put:
      operationId: ModelBindingsController_setProjectBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModelBindingDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelBindingResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в области действия.
        '404':
          description: Область действия не найдена.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Задаёт модель проекта
      tags:
        - llm
  /projects/{projectId}/model-bindings/resolved:
    get:
      description: >-
        Пакетная форма `GET .../agent-bindings/:agentSlug` и `GET
        .../area-bindings/:areaKey`: каждый запрошенный ключ получает РОВНО то
        значение, которое отвечает его маршрут для одного ключа (тот же каскад,
        те же origin, `null`, когда ни на одном уровне нет модели). Существует,
        чтобы вкладка Настройки читала 20 разрешённых binding одним запросом
        вместо 20 — лимит частоты действует на ПОЛЬЗОВАТЕЛЯ. Ключи через
        запятую, без дубликатов, а некорректный ключ или больше 64 ключей всего
        — это 400, никогда не молчаливое отбрасывание.
      operationId: ModelBindingsController_getResolvedBindings
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: agents
          required: false
          in: query
          description: Slug агентов через запятую.
          schema:
            example: criativo,po,dev-lead
            type: string
        - name: areas
          required: false
          in: query
          description: Ключи областей через запятую.
          schema:
            example: dev,qa,infra
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingsResolvidosEmLoteResponseDto'
        '400':
          description: Некорректный ключ или больше ключей, чем лимит пакета.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в области действия.
        '404':
          description: Область действия не найдена.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Определяет модель нескольких агентов и областей за одно чтение
      tags:
        - llm
  /projects/{projectId}/models:
    get:
      description: >-
        Категория `local` — модели Ollama, которые не тратят деньги; `cloud` —
        платные модели API. Модель, которую рабочее пространство не
        активировало, здесь не появляется, но остаётся в исторических затратах —
        чтобы увидеть её, используйте маршрут каталога. Список относится к
        рабочему пространству-ВЛАДЕЛЬЦУ проекта: одна и та же модель может быть
        включена в одном рабочем пространстве и выключена в соседнем (ADR 0049).
      operationId: ModelsController_list
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  local:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/ModelResponseDto'
                  cloud:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/ModelResponseDto'
                example:
                  local:
                    ollama: []
                  cloud:
                    anthropic: []
                    openai: []
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перечисляет модели, активные В РАБОЧЕМ ПРОСТРАНСТВЕ ПРОЕКТА
      tags:
        - llm
  /projects/{projectId}/open-questions:
    get:
      description: >-
        Статус берётся из журнала событий: открытый — это
        `artifact.open_question` без `open_question.answered`. Сначала новые, не
        более 50, с `total`.
      operationId: OpenQuestionsController_list
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: status
          required: false
          in: query
          schema:
            default: open
            type: string
            enum:
              - open
              - answered
              - all
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenQuestionsListResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перечисляет открытые вопросы агентов проекта (RN-858)
      tags:
        - backlog
  /projects/{projectId}/open-questions/{questionId}/answer:
    post:
      description: >-
        Отвечает только автор сессии, в которой родился вопрос. Пишет
        `decision_record` (актор: пользователь, с `questionId`) и
        `open_question.answered` и просит engine возобновить поставленный на
        паузу gate QA каждой затронутой задачи (RN-860), по мере возможности.
      operationId: OpenQuestionsController_answer
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: questionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerOpenQuestionDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenQuestionResponseDto'
        '400':
          description: Нет ответа или принято предложение там, где его нет.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: 'Не автор сессии — тело с `reason: "so_o_autor_da_sessao"`.'
        '404':
          description: Вопрос не в этом проекте.
        '409':
          description: 'Уже отвечен — `reason: "pergunta_ja_respondida"`.'
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Отвечает на открытый вопрос (RN-858)
      tags:
        - backlog
  /projects/{projectId}/permissions:
    get:
      description: >-
        Это физический файл в корне рабочей области проекта, а не столбец базы
        данных.
      operationId: ProjectsController_getPermissions
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsFileResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует или невидим для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Читает permissions.json проекта
      tags:
        - projects
    put:
      description: >-
        Заменяет все три списка сразу. `deny` по-прежнему побеждает `allow` при
        оценке — разрешить через это что-то запрещённое невозможно.
      operationId: ProjectsController_setPermissions
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProjectPermissionsDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsFileResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует или невидим для вызывающего.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перезаписывает permissions.json проекта
      tags:
        - projects
  /projects/{projectId}/personal-access-tokens:
