  /projects/{projectId}/sessions/{sessionId}/execution/parallelize:
    post:
      description: >-
        Проходит через ЛИМИТ области dev (RN-083): ниже него агент стартует
        сразу, в собственном worktree; выше — ответ является `proposed_action`
        типа `parallelize`, ожидающим вашего решения, и НИЧЕГО не стартует, пока
        вы не решите. Значение лимита настраивается для каждого lead в
        Настройках.
      operationId: ExecutionController_parallelize
      parameters:
        - name: projectId
          required: true
          in: path
