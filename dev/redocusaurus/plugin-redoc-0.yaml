        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageReportResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Calcula a cobertura regra de negócio → histórias
      tags:
        - backlog
  /projects/{projectId}/events/{eventId}:
    get:
      description: >-
        Diferente da rota de evento por sessão: aqui a sessão não é conhecida. É
        isto que faz o chip de evidência do perfil cair no evento certo, já que
        a janela da Anamnese atravessa várias sessões.
      operationId: AnamneseController_event
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: eventId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEventResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, evento ou versão não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Devolve um evento do projeto pelo id, resolvendo a sessão dele
      tags:
        - anamnesis
  /projects/{projectId}/execution-mode:
    put:
      description: >-
        Migra `execution_mode`/`workspacePath` de um projeto que JÁ existe
        (RN-447..450, ADR 0111) — rota dedicada, separada do PATCH, porque
        orquestra mais do que gravar uma coluna: move o permissions.json para a
        raiz de escopo nova, aposenta a linha de ciclo de vida do container ao
        sair do modo `container`, e recusa (409) enquanto qualquer dev agent do
        projeto não estiver ocioso, já que um agente rodando não re-resolve
        sozinho onde está o worktree dele.
      operationId: ProjectsController_convertExecutionModeRoute
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertExecutionModeDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: O projeto não existe ou é invisível para quem chama.
        '409':
          description: Um dev agent deste projeto está trabalhando ou travado agora.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Converte o modo de execução do projeto
      tags:
        - projects
  /projects/{projectId}/execution/activate:
    post:
      description: >-
        Exige `maintainer`, não `developer`, porque as ações de git dos dev
        agents herdam o papel de QUEM ATIVOU na avaliação de IAM — ativar como
        developer deixaria os agentes sem conseguir abrir PR. Cada módulo do
        `module_map` ganha um agente num worktree isolado.
      operationId: ExecutionController_activate
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateExecutionDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecucaoAtivadaResponseDto'
        '400':
          description: >-
            Sem `module_map` vigente (o Arquiteto tem de definir os módulos
            primeiro), ou a localização de workspace gravada do projeto é
            incoerente — o `permissions.json` semeado aqui não pode ser derivado
            dela (RN-478).
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou tarefa não encontrado.
        '409':
          description: >-
            O projeto ainda não tem repositório (RN-582): os dev agents
            trabalham em worktrees dele, então nada começa. A mensagem nomeia o
            que falta — o handoff ao Arquiteto (ou, como segunda porta, ao Dev
            Lead) cujo aceite o provisiona, ou a página de provisionamento
            quando esse handoff já foi aceito e não deixou repositório. Também:
            a sessão de origem é `consultiva` e recusa `execution.activated`
            (RN-097). Ativar duas vezes NÃO é conflito: é idempotente por
            `findActiveExecutionSession`, e reativa dentro da mesma sessão.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Ativa a fase de execução e sobe um dev agent por módulo
      tags:
        - execution
  /projects/{projectId}/execution/session:
    get:
      description: >-
        A sessão `active` mais recente que já traz `execution.activated` — o
        MESMO critério que `activate` usa para decidir entre reativar ou criar
        uma (RN-139). `null` quando não há execução em andamento. Existe para a
        aba Executores parar de inferir esta sessão a partir da mais recente do
        projeto, que muda de sessão em sessão sem pista nenhuma na interface.
      operationId: ExecutionController_getSession
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: '`null` no corpo quando não há execução ativa.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou tarefa não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Devolve a sessão de execução corrente do projeto, ou nada
      tags:
        - execution
  /projects/{projectId}/git/{provider}/connect:
    get:
      description: >-
        Não redireciona: devolve a URL para o cliente decidir quando mandar o
        navegador. O `state` vai assinado por HMAC, e é isso que impede o
        callback de ser forjado.
      operationId: GitController_connect
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - github
              - gitlab
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitAuthorizeUrlResponseDto'
        '400':
          description: Provider fora de `github`/`gitlab`.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Inicia o OAuth com o provider de git
      tags:
        - git
  /projects/{projectId}/git/{provider}/repository:
    post:
      description: >-
        SÍNCRONA: a resposta só volta depois que o bootstrap inteiro (branches
        permanentes, proteções, templates) rodou — não há worker nem fila por
        trás. É IDEMPOTENTE E RETOMÁVEL, então chamá-la de novo depois de uma
        falha retoma do passo que falhou. Acompanhe o progresso e leia o motivo
        da falha por `GET /projects/:id/git/bootstrap`.
      operationId: GitController_provision
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - local
              - github
              - gitlab
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionRepositoryDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionRepositoryResponseDto'
        '400':
          description: Provider inválido, ou credencial ausente.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Cria o repositório e roda o bootstrap do Gitflow
      tags:
        - git
  /projects/{projectId}/git/{provider}/repository/adopt:
    post:
      description: >-
        Valida o acesso com `getRepo` e produz um PLANO (dry-run) do que o
        bootstrap faria — branches faltando, proteções faltando, arquivos. NADA
        é executado no repositório: decida depois por `plan/approve` ou
        `plan/skip`. Readotar o mesmo repositório converge (regenera o plano sem
        duplicar linha).
      operationId: GitController_adopt
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - local
              - github
              - gitlab
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptRepositoryDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptRepositoryResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: O repositório existe, mas a credencial registrada não o alcança.
        '404':
          description: O repositório não existe no provider — confira o identificador.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Adota um repositório existente, sem criar nada
      tags:
        - git
  /projects/{projectId}/git/bootstrap:
    get:
      description: >-
        Em que passo está, se falhou e onde, e quantas tentativas houve. O
        detalhe passo a passo vem dos eventos `bootstrap.step_*` da sessão
        dedicada.
      operationId: GitController_getBootstrap
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoBootstrapStatusResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Devolve o estado do bootstrap do Gitflow
      tags:
        - git
  /projects/{projectId}/git/bootstrap/acknowledge-protection-failure:
    post:
      description: >-
        `protect_branches` falha em repositório privado no plano gratuito, e o
        assistente avisa disso ANTES. Sem esta saída o único botão era "Tentar
        de novo", que sempre falha pelo mesmo motivo — e `provision_failed` faz
        o painel redirecionar o projeto de volta para a página de
        provisionamento, deixando-o inalcançável para sempre. Só falha em
        PROTEGER pode ser reconhecida: é o último passo e o único cuja falha
        deixa um repositório utilizável. A trava de merge do produto (RN-006)
        não depende da proteção do provider e continua valendo.
      operationId: GitController_reconhecerFalhaDeProtecao
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconhecerFalhaDeProtecaoResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '409':
          description: >-
            O bootstrap não falhou, ou falhou num passo anterior à proteção —
            seguir adiante ali deixaria o projeto sem repositório utilizável.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Reconhece a falha de proteção de branch e segue adiante
      tags:
        - git
  /projects/{projectId}/git/bootstrap/plan:
    get:
      description: >-
        `decision: null` com plano presente é o estado em que NADA roda —
        aguardando aprovação ou adoção como está (RN-045).
      operationId: GitController_plan
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapPlanEstadoResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Devolve o plano de bootstrap e o que se decidiu sobre ele
      tags:
        - git
  /projects/{projectId}/git/bootstrap/plan/approve:
    post:
      description: >-
        A aprovação é tudo ou nada: aprovar passos soltos quebraria a cascata
        `dev←main, qa←dev, rc←qa`. O que roda é o plano RE-DERIVADO na hora da
        execução — igual ou menor que o mostrado, nunca maior.
      operationId: GitController_approvePlan
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideBootstrapPlanDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideBootstrapPlanResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '409':
          description: >-
            O plano foi regenerado desde que você o viu, ou já tinha sido
            decidido.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Aprova o plano INTEIRO e roda o bootstrap
      tags:
        - git
  /projects/{projectId}/git/bootstrap/plan/skip:
    post:
      description: >-
        Grava a decisão e não toca o repositório. O plano fica guardado como
        evidência do que deliberadamente não foi aplicado, e o cursor do
        bootstrap NÃO é mexido — nenhum passo rodou.
      operationId: GitController_skipPlan
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideBootstrapPlanDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideBootstrapPlanResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '409':
          description: >-
            O plano foi regenerado desde que você o viu, ou já tinha sido
            decidido.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Adota o repositório COMO ESTÁ, dispensando o bootstrap
      tags:
        - git
  /projects/{projectId}/git/repository:
    get:
      operationId: GitController_get
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionedRepositoryResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Devolve o repositório provisionado do projeto
      tags:
        - git
  /projects/{projectId}/hypotheses:
    get:
      description: >-
        Cada hipótese cita os eventos que a sustentam (`evidenceEventIds`) — é
        isso que a torna auditável em vez de aceita por fé.
      operationId: PsychologistController_hypotheses
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HypothesisResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou hipótese não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista as hipóteses do Psicólogo sobre os agentes
      tags:
        - psychologist
  /projects/{projectId}/hypotheses/{hypothesisId}/accept:
    post:
      description: >-
        Move `proposed` → `accepted`. NÃO é `proposed_action`: o Psicólogo é
        somente leitura e nada aqui tem efeito externo.
      operationId: PsychologistController_accept
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: hypothesisId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HypothesisResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou hipótese não existe.
        '409':
          description: A hipótese já foi decidida.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Aceita uma hipótese
      tags:
        - psychologist
  /projects/{projectId}/hypotheses/{hypothesisId}/dismiss:
    post:
      description: Move `proposed` → `dismissed`. Mesmo raciocínio do aceite.
      operationId: PsychologistController_dismiss
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: hypothesisId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HypothesisResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou hipótese não existe.
        '409':
          description: A hipótese já foi decidida.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Descarta uma hipótese
      tags:
        - psychologist
  /projects/{projectId}/infra-artifacts:
    get:
      description: >-
        Artefatos do InfraAgent (Dockerfile, compose, CI). Passam pelos MESMOS
        gates de QA e SecOps das PRs de dev, sem tarefa nem worktree por trás.
      operationId: BacklogController_infraArtifacts
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InfraArtifactResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista as PRs de infra e o estágio de gate de cada uma
      tags:
        - backlog
  /projects/{projectId}/instruction-versions:
    get:
      description: >-
        Parte de quem TEM versão no projeto, não de uma lista estática — é isso
        que faz os dev agents por módulo (`dev-api`) aparecerem.
      operationId: AnamneseController_allVersions
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgenteComVersoesResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, evento ou versão não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista o histórico de instruções de todo agente do projeto
      tags:
        - anamnesis
  /projects/{projectId}/members:
    get:
      description: >-
        Só quem foi associado AQUI, com o papel dessa associação — quem alcança
        o projeto só pelo workspace não tem linha e não aparece.
      operationId: ProjectsController_listMembers
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMemberComUsuarioResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: O projeto não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista os membros do projeto
      tags:
        - projects
    post:
      description: >-
        Este papel SOBREPÕE o que a pessoa tem no workspace, nos dois sentidos:
        associar alguém como `viewer` aqui restringe de fato um `developer` do
        workspace neste projeto. Dois movimentos são recusados com 403 e não
        podem ser habilitados em lugar nenhum: rebaixar um `owner` do workspace,
        e mudar o PRÓPRIO papel — para baixo ou para cima, já que a autopromoção
        é a metade que escala privilégio.
      operationId: ProjectsController_addMember
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: >-
            Papel insuficiente no projeto, OU um dos dois tetos (o alvo é
            `owner` do workspace; o alvo é quem chama e o papel pedido difere do
            efetivo atual dele).
        '404':
          description: O projeto não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Associa um usuário ao projeto
      tags:
        - projects
  /projects/{projectId}/members/{userId}:
    delete:
      description: >-
        Remove só a associação de PROJETO. Quem tem papel no workspace continua
        vendo o projeto por herança — e como o papel de projeto SOBREPÕE o de
        workspace nos dois sentidos, essa herança pode ser MENOR que o que a
        linha concedia. Remover a própria linha é, por isso, recusado com 403
        sempre que o efeito líquido é rebaixamento (inclusive quando não há
        papel de workspace nenhum); removê-la quando o workspace segura o mesmo
        papel, e remover qualquer outra pessoa, continuam funcionando.
      operationId: ProjectsController_removeMember
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: userId
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Associação removida. Sem corpo.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: >-
            Papel insuficiente no projeto, OU quem chama está removendo a
            própria linha e ficaria com papel menor que o de hoje.
        '404':
          description: O projeto não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Desassocia um usuário do projeto
      tags:
        - projects
  /projects/{projectId}/mirror-path:
    put:
      description: >-
        O caminho absoluto, NA MÁQUINA DO USUÁRIO, para onde o agente local
        copia o trabalho (RN-515, ADR 0147) — uma pasta FORA da base montada,
        que é toda a razão de o espelho existir. Por projeto e nunca global: um
        destino global aterrissaria os artefatos do projeto B na pasta do
        projeto A, e o usuário descobriria pelo conteúdo, não por um erro.
        `mirrorPath: null` o LIMPA e desliga o espelho — a chave é obrigatória,
        omiti-la é 400, porque um corpo que omite o campo seria indistinguível
        de pedir para limpar. `null` é o estado NORMAL de um projeto.
        `maintainer`, o mesmo mínimo de `execution-mode` e `projects-base`: esta
        rota fala de um caminho no próprio sistema de arquivos do operador.
        Valida SÓ a forma LÉXICA e recusa, com 400, destino dentro de
        `workspacePath` ou que o contenha (os dois sentidos do mesmo laço), e
        qualquer destino num projeto `container`. Nunca toca o disco: a API não
        enxerga a máquina onde o destino vai morar. Gravar o espelho NÃO é
        proposed_action — é configuração que o usuário declarou, não agente
        pedindo para agir.
      operationId: ProjectsController_setMirrorPathRoute
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMirrorPathDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: O projeto não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Declara (ou limpa) o destino de espelho do projeto
      tags:
        - projects
  /projects/{projectId}/mirror-state:
    get:
      description: >-
        Telemetria que o agente local empurrou pelo canal depois de copiar o
        trabalho para a pasta do usuário (ADR 0147, ponto 7) — nunca o event
        log, porque rodada de espelho não tem sessão e
        `session_events.session_id` é `NOT NULL` (o mesmo raciocínio que fez de
        `rag_searches` uma tabela). TRÊS respostas que nunca colapsam numa só
        (RN-088): `never` (nenhuma rodada relatada), `synced` (a última rodada
        copiou — `filesCopied` pode ser `0`, que quer dizer "olhou e não havia
        nada a copiar") e `failed`. Uma falha nunca apaga a última sincronização
        bem-sucedida, e um sucesso nunca apaga o último erro: qual é o CORRENTE
        sai da comparação dos dois carimbos, então a tela pode dizer "falhando
        desde hoje, a última cópia boa foi ontem com 412 arquivos".
        `lastDestination` é CONGELADO — diverge de `mirrorPath` depois que
        alguém troca o destino, porque a concessão viaja no join e só muda
        quando o runner reconecta (RN-516). `viewer`, o mesmo mínimo de ler o
        projeto, que já traz `mirrorPath`.
      operationId: ProjectsController_mirrorStateRoute
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMirrorStateResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: O projeto não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: O que a última rodada de espelho fez (RN-517)
      tags:
        - projects
  /projects/{projectId}/model-binding:
    get:
      description: O binding CRU deste escopo — `null` se o projeto só herda do workspace.
      operationId: ModelBindingsController_getProjectBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelBindingResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no escopo.
        '404':
          description: Escopo não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lê o binding de modelo do projeto
      tags:
        - llm
    put:
      operationId: ModelBindingsController_setProjectBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModelBindingDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelBindingResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no escopo.
        '404':
          description: Escopo não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Define o modelo do projeto
      tags:
        - llm
  /projects/{projectId}/model-bindings/resolved:
    get:
      description: >-
        Forma em lote de `GET .../agent-bindings/:agentSlug` e `GET
        .../area-bindings/:areaKey`: cada chave pedida recebe EXATAMENTE o valor
        que a rota de chave única dela responde (mesma cascata, mesmas origens,
        `null` quando nenhum nível tem modelo). Existe para a aba Configurações
        ler 20 bindings resolvidos com uma requisição em vez de 20 — o rate
        limit é por USUÁRIO. As chaves são separadas por vírgula, deduplicadas,
        e chave malformada ou mais de 64 chaves no total é 400, nunca descartada
        em silêncio.
      operationId: ModelBindingsController_getResolvedBindings
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: agents
          required: false
          in: query
          description: Slugs de agente separados por vírgula.
          schema:
            example: criativo,po,dev-lead
            type: string
        - name: areas
          required: false
          in: query
          description: Chaves de área separadas por vírgula.
          schema:
            example: dev,qa,infra
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingsResolvidosEmLoteResponseDto'
        '400':
          description: Chave malformada, ou mais chaves que o teto do lote.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no escopo.
        '404':
          description: Escopo não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Resolve o modelo de vários agentes e áreas numa leitura só
      tags:
        - llm
  /projects/{projectId}/models:
    get:
      description: >-
        A categoria `local` são os do Ollama, que não gastam dinheiro; `cloud`
        são os de API paga. Modelo que o workspace não ativou não aparece aqui,
        mas fica nos custos históricos — para vê-lo use a rota do catálogo. A
        lista é a do workspace DONO do projeto: o mesmo modelo pode estar ligado
        num workspace e desligado no vizinho (ADR 0049).
      operationId: ModelsController_list
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  local:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/ModelResponseDto'
                  cloud:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/ModelResponseDto'
                example:
                  local:
                    ollama: []
                  cloud:
                    anthropic: []
                    openai: []
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista os modelos ativos NO WORKSPACE do projeto
      tags:
        - llm
  /projects/{projectId}/open-questions:
    get:
      description: >-
        O status vem do event log: aberta é um `artifact.open_question` sem
        `open_question.answered`. A mais nova primeiro, teto de 50 com `total`.
