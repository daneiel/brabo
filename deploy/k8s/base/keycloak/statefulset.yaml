# Keycloak.
#
# StatefulSet e não Deployment porque no modo `start-dev` o Keycloak guarda o
# realm num banco H2 embutido, em disco: com storage efêmero, todo restart
# perderia usuários criados depois do import.
#
# LIMITAÇÃO HERDADA E CONSCIENTE: segue em `start-dev`, como no
# docker-compose.prod.yml. Endurecer o Keycloak (modo produção, banco externo,
# TLS, hostname fixo) está registrado como fora de escopo desde o ADR 0024
# (limitação 4) — o alvo desta sessão são os nossos três serviços. O que MUDA
# aqui em relação ao compose é que os segredos deixaram de ser plaintext.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: brabo
spec:
  serviceName: keycloak
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: brabo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Renderiza o realm a partir do template, injetando os segredos vindos
        # do ESO. Sem este passo, ou os secrets dos clients ficariam num
        # ConfigMap versionado, ou dependeríamos da substituição de variáveis
        # do próprio Keycloak — que existe mas varia entre versões, e cujo modo
        # de falha é o realm importar com a string literal como senha e o login
        # falhar sem explicação.
        - name: render-realm
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              set -eu
              # Delimitador | no sed: os valores são URLs e contêm barras.
              sed \
                -e "s|__KEYCLOAK_REALM__|${KEYCLOAK_REALM}|g" \
                -e "s|__WEB_ORIGIN__|${WEB_ORIGIN}|g" \
                -e "s|__API_CLIENT_SECRET__|${API_KEYCLOAK_CLIENT_SECRET}|g" \
                -e "s|__ENGINE_CLIENT_SECRET__|${ENGINE_KEYCLOAK_CLIENT_SECRET}|g" \
                -e "s|__BOOTSTRAP_USER__|${KC_BOOTSTRAP_ADMIN_USERNAME}|g" \
                -e "s|__BOOTSTRAP_PASSWORD__|${KC_BOOTSTRAP_ADMIN_PASSWORD}|g" \
                /template/realm-template.json > /import/realm.json
              # Falha alto se sobrou marcador: um realm importado pela metade
              # sobe verde e só quebra no login.
              if grep -q '__[A-Z_]*__' /import/realm.json; then
                echo "realm.json ainda tem marcadores não substituídos:" >&2
                grep -o '__[A-Z_]*__' /import/realm.json >&2
                exit 1
              fi
          env:
            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: brabo-config
                  key: KEYCLOAK_REALM
            - name: WEB_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: brabo-config
                  key: WEB_ORIGIN
          envFrom:
            - secretRef:
                name: keycloak-secrets
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: realm-template
              mountPath: /template
            - name: realm-rendered
              mountPath: /import
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Sem isto o Keycloak monta URLs absolutas com o IP do pod, e o
            # redirect do login manda o browser para um endereço interno.
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: JAVA_OPTS_APPEND
              value: "-XX:MaxRAMPercentage=70"
          envFrom:
            - secretRef:
                name: keycloak-secrets
          # As probes vão para a porta de MANAGEMENT (9000), não para a 8080:
          # no Keycloak 26 os endpoints /health/* só existem lá.
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            # ÚNICO container do deploy sem rootfs read-only, e a razão é
            # técnica, não desleixo: `start-dev` roda a augmentação do Quarkus
            # NO BOOT, que reescreve `/opt/keycloak/lib/quarkus`. Com o
            # filesystem read-only o container morre em
            # `ReadOnlyFileSystemException` antes de servir qualquer coisa.
            #
            # As alternativas custam mais do que valem para um componente que o
            # ADR 0024 (limitação 4) já colocou fora do escopo de endurecimento:
            # montar um emptyDir ali apagaria a aplicação pré-construída da
            # imagem, e preservá-la exigiria mais um initContainer só para
            # copiá-la. O resto do endurecimento continua: non-root, sem
            # escalada de privilégio, todas as capabilities descartadas.
            #
            # Some quando o Keycloak passar para modo produção (`kc.sh build`
            # em tempo de imagem, `start` em vez de `start-dev`), que é a
            # sessão de endurecimento de terceiros.
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: realm-rendered
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: keycloak-data
              mountPath: /opt/keycloak/data/h2
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: realm-template
          configMap:
            name: keycloak-realm-template
        # emptyDir e não Secret: o arquivo renderizado contém segredo e não
        # pode voltar para o etcd como ConfigMap. Vive só na memória do pod.
        - name: realm-rendered
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: keycloak-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
