          example: gerenciada
          description: >-
            由 broker 的哪个根目录解析此文件夹。`gerenciada` →
            `PROJECT_WORKSPACES_HOST_ROOT`（产品管理的文件夹，由 `workspaceDirName`
            命名）；`montada` → `BRABO_PROJECTS_HOST_BASE`（Mounted 项目的唯一基目录，ADR
            0141）；`indisponivel` → 此服务器没有任何根目录能访问它，`motivo`
            说明原因。三种状态而不是两种：`runner` 项目和在基目录之外创建的旧版 `mounted`
            项目都是拒绝，但修复方式不同，把它们合并成一个 null 会让调用方去猜自己遇到的是哪一种。
        segmento:
          type: string
          example: loja
          description: >-
            broker 的根目录没有覆盖的部分，以 `<root>/<segmento>` 的形式拼接上去。对 `gerenciada` 而言是
            `workspaceDirName`；对 `montada` 而言，是基目录下的相对路径（可能包含 `/`）。缺省——而不是
            null——当 `tipo` 为 `indisponivel` 时：这两种变体在 api
            端是可辨识联合，线上传输也表达同样的意思，因此读取 `segmento` 却不检查 `tipo` 的调用方会明显地出错，而不是拼出
            `<root>/null`。
        motivo:
          type: string
          example: o projeto está no modo "runner"…
          description: >-
            为什么没有任何根目录能访问此文件夹。仅当 `tipo` 为 `indisponivel`
            时出现。这是一条要转述给运营者的消息，因此会指明模式或基目录。
      required:
        - tipo
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: fulano@brabo.dev
        senha:
          type: string
          example: correct horse battery staple
      required:
        - email
        - senha
    MachineDeviceKeyInternalDto:
      type: object
      properties:
        name:
          type: string
          example: servidor-de-casa
          description: 供人以后认出这台机器的名称，显示在它所服务的每个项目的设备密钥列表中。不要求唯一。安装器会建议主机名；api 不会从中推导任何东西。
        publicKeyJwk:
          type: string
          example: '{"kty":"OKP","crv":"Ed25519","x":"…"}'
          description: >-
            Ed25519 公钥 JWK（RFC 8037），序列化为 JSON。密钥对在机器上生成，私有的一半从不传输——携带 `d` 的 JWK
            会以 400 拒绝并说明原因，绝不存储。
      required:
        - name
        - publicKeyJwk
    MachineDeviceKeyInternalResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 01JC4Z0000CHAVE000000000001
          description: >-
            注册 id。在保存文件之前把它作为 `kid` 写入私有
            JWK（RN-475）：它是磁盘上的密钥与服务器上公开一半之间唯一的关联，下游的每一步都只是传递它。
        userId:
          type: string
          format: uuid
          example: 01JC4Z0000USUARIO0000000001
          description: api 解析出的所有者——该安装的唯一用户。调用方不选择也不发送它；此字段存在是为了让安装器能与刚创建的账户核对，而不是想当然。
        name:
          type: string
          example: servidor-de-casa
        createdAt:
          type: string
          example: '2026-09-12T12:00:00.000Z'
          format: date-time
        replacedKeyIds:
          example: []
          description: >-
            被这把密钥替换的机器密钥
            id——在同一事务中被撤销。为空是正常情况（全新安装）。非空表示仍持有其中某把密钥的本地代理将不再获得票据，安装器应当说明这一点，而不是让人自己发现。项目密钥（ADR
            0118）不受影响。
          type: array
          items:
            type: string
      required:
        - id
        - userId
        - name
        - createdAt
        - replacedKeyIds
    MarkTaskInternalDto:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
          example: 01JC4Z0000PROJETO0000000001
        agentId:
          type: string
          example: dev-api
          description: 只有认领了任务的代理才能移动它。
        status:
          type: string
          enum:
            - todo
            - in_progress
            - in_review
            - done
          example: in_review
      required:
        - projectId
        - agentId
        - status
    MensagemAoAgenteResponseDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
          description: 始终为 `true`；失败会变成 HTTP 错误。
        mensagemId:
          type: string
          example: 01JC4Z0000EVENTO000000000001
          description: 为这条消息记录的 `chat.message` 事件的 id——在它于队列中等待时用来取消它的 id。
        entrega:
          type: string
          enum:
            - lida
            - enfileirada
          example: enfileirada
          description: >-
            `lida`：代理立即用它开始了一个回合。`enfileirada`：代理正处于回合中，因此消息进入了它的队列，会在当前回合结束时与其他排队的消息在一个回合中一起被读取（RN-673）。会话日志会记录
            `chat.message_queued` / `chat.message_delivered` /
            `chat.message_cancelled`。
        posicao:
          type: number
          example: 2
          description: 在队列中的位置（1 = 下一个）。仅当 `entrega` 为 `enfileirada` 时出现。
      required:
        - ok
        - mensagemId
        - entrega
    MirrorSyncResultInternalDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
          description: 复制的真实结果，由本地代理在完成后报告——绝不是在这一轮结束前乐观地报“ok”。
        destination:
          type: string
          example: /home/you/mirrors/store
          description: >-
            这一轮实际解析到的目标（成功时）或尝试使用的目标（失败时），位于用户的机器上。在记录中冻结：把项目当前的目标显示在昨天的复制旁边，等于界面在对一个那轮从未触及的文件夹做出断言。当失败与目标本身有关时省略。
        filesCopied:
          type: number
          example: 412
          description: 这一轮复制的普通文件数。`0` 是一个数字，而不是缺失——“已同步但什么也没复制”是一种独立的状态（RN-088）。
        filesSkipped:
          type: number
          example: 3
          description: >-
            git 列出的、不是普通文件的条目——嵌套仓库（dev agent 的 worktree
            就是一个）、符号链接，或在列出和复制之间消失的文件。
        filesRefused:
          type: number
          example: 0
          description: 被逐文件防护拒绝的目标（逃出目标目录的符号链接）。会被计数，绝不吞掉。
        error:
          type: string
          example: >-
            o espelho não conseguiu listar o trabalho com o git: not a git
            repository
          description: 具名的失败消息。很长时会截断存储，并说明已截断。它绝不会抹去最近一次成功的同步——哪条是当前的，由比较两个时间戳决定。
      required:
        - ok
    MirrorSyncResultResponseDto:
      type: object
      properties:
        recorded:
          type: boolean
          example: true
        status:
          type: string
          example: synced
          enum:
            - never
            - synced
            - failed
          description: >-
            此次写入后三种状态中哪一种是当前的。`never`
            在这里不可能出现（每次写入都会标记两个时间戳之一），列出它是因为词汇与界面读取的相同。
      required:
        - recorded
        - status
    ModelBindingResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z0000BINDING00000000001
        scope:
          type: string
          enum:
            - workspace
            - project
            - area
            - agent
            - session
          example: project
        scopeId:
          type: string
          example: 01JC4Z0000PROJETO0000000001
          description: >-
            binding 所固定的 workspace、项目或会话的 id。在按项目存在的 `agent` 和 `area`
            范围中，它是复合的：`<projectId>:<agent slug|area key>`（ADR 0064）。
        modelId:
          type: string
          example: 01JC4Z0000MODELO00000000001
        routingPreference:
          type: string
          enum:
            - price
            - throughput
            - latency
          nullable: true
          example: null
          description: >-
            中转平台如何为此 binding 选择上游（ADR 0166，RN-583）。`null` = 由中转平台自行决定。只会为声明了
            `routingPreference` 能力的提供商设置。
        createdBy:
          type: string
          example: 01JC4Z0000USUARIO0000000001
        createdAt:
          type: string
          example: '2026-07-11T09:00:00.000Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-11T09:00:00.000Z'
          format: date-time
      required:
        - id
        - scope
        - scopeId
        - modelId
        - routingPreference
        - createdBy
        - createdAt
        - updatedAt
    ModelComCuradoriaResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z0000MODELO00000000001
        provider:
          type: string
          enum:
            - ollama
            - anthropic
            - openai
          example: anthropic
        name:
          type: string
          example: claude-opus-4-8
          description: 在提供商处的标识符。
        displayName:
          type: string
          example: Claude Opus 4.8
        inputPricePerMillionMicros:
          type: number
          example: 15000000
          description: 每百万输入 token 的价格，以微美元计。
        outputPricePerMillionMicros:
          type: number
          example: 75000000
          description: 每百万输出 token 的价格，以微美元计。
        contextWindow:
          type: object
          example: 200000
          nullable: true
          description: 同时也是模型的 `context_length` 能力。
        supportsToolCalling:
          type: boolean
          example: true
          description: 原生工具调用。没有它，模型只能聊天，不能绑定到代理（RN-040）。
        supportsStreaming:
          type: boolean
          example: true
        supportsVision:
          type: boolean
          example: false
          description: 接受图像输入。`false` 表示提供商没有声明该模态——而不是模型做不到（ADR 0041）。
        supportsReasoning:
          type: boolean
          example: true
          description: '接受显式推理（thinking）。在 OpenRouter 上来自 `supported_parameters: reasoning`。'
        generatesImage:
          type: boolean
          example: false
          description: 生成图像——与接受图像输入是不同的维度。具备的模型很少，把两者混淆会让用户选错模型。
        reasoningBudget:
          type: number
          nullable: true
          example: 2048
          description: >-
            Reasoning budget (tokens) the model is PROVEN to respect, curated by
            hand (ADR 0223). Null = not proven; the field is not sent.
        manualPricing:
          type: boolean
          example: true
          description: 根据提供商文档手动输入的价格，而不是同步而来。价格同步在没有明确决定的情况下不会覆盖被标记的记录。
        availability:
          type: string
          enum:
            - available
            - unavailable
          example: available
          description: >-
            同步观测到的远程现实，与策展相互独立的维度。`unavailable` 是从提供商目录中消失的模型——它绝不会被删除，因为
            binding 和成本历史都指向它。
        lastSeenAt:
          type: object
          example: '2026-07-30T03:00:00.000Z'
          format: date-time
          nullable: true
          description: 同步最后一次在提供商目录中看到该模型的时间。
        createdAt:
          type: string
          example: '2026-07-01T00:00:00.000Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-01T00:00:00.000Z'
          format: date-time
        isActive:
          type: boolean
          example: true
          description: >-
            **此 workspace**
            所有者的策展：被停用的模型会从选择器中消失，但保留在历史成本中。同步发现的模型没有策展记录，没有记录即表示 `false`。
        uses:
          type: array
          example:
            - codigo
          description: >-
            此 workspace
            将该模型用于什么。是运营者的意见，而不是提供商的能力——没有任何目录会公布“适合写代码”。空列表表示“没有人有意见”，而不是“不适合”。
          items:
            type: string
            enum:
              - codigo
              - documentacao
              - analise
              - imagem
              - conversa
        freeRoutingAlias:
          type: boolean
          example: false
          description: >-
            OpenRouter 免费路由别名（以 `~` 开头的
            id）：目录价格只是展示价，账单来自实际处理调用的那个上游。策展拒绝激活它（422
            `alias_de_roteamento_livre`）；在该规则之前激活的保持激活，并以此标志标记，一旦停用就无法再恢复。读取时根据提供商和名称推导，从不存储。
      required:
        - id
        - provider
        - name
        - displayName
        - inputPricePerMillionMicros
        - outputPricePerMillionMicros
        - contextWindow
        - supportsToolCalling
        - supportsStreaming
        - supportsVision
        - supportsReasoning
        - generatesImage
        - reasoningBudget
        - manualPricing
        - availability
        - lastSeenAt
        - createdAt
        - updatedAt
        - isActive
        - uses
        - freeRoutingAlias
