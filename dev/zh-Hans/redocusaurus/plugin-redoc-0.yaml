        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamLlmTurnDto'
      responses:
        '200':
          description: 直到 `done` 或 `error` 的帧流。
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/LlmTurnStreamEventResponseDto'
        '400':
          description: 请求体无效。
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
        '404':
          description: 未找到会话、项目或资源。
      security:
        - service-token: []
      summary: 运行一个以流式返回响应的 LLM 回合
      tags:
        - internal
  /internal/sessions/{sessionId}/max-parallel-proposals:
