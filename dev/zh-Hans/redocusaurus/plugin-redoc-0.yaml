  /projects/{projectId}/sessions/{sessionId}/reopen:
    post:
      description: >-
        只有 `closed`/`closed_abnormally` 可以重新打开，并且只能回到 `active`——`closing`
        绝不回退（ADR 0183）。会话保留其事件日志、制品、已回答的问题和 handoff；`kind` 不变。一个新事件
        `session.reopened` 记录之前的 `closedAt` 和 `terminationReason`，记录中的这两列会被清空。携带
        `execution.activated`
        的会话会被拒绝（`sessao_com_execucao`）：请打开新会话并在那里激活执行。没有时间限制。需要 `developer`（ADR
        0184）。
      operationId: SessionsController_reopen
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目中的角色不足。
        '404':
          description: 项目或会话不存在。
        '409':
          description: >-
            会话未关闭（`reason: sessao_nao_encerrada`），或它激活过执行（`reason:
            sessao_com_execucao`）。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
