            aberta, ao contrário de `locale`. Gravado na forma canônica (`pt-br`
            vira `pt-BR`). Código não reconhecido é um 400 que nomeia a regra.
            Nunca muda `locale`.
    UpdateWorkspaceDto:
      type: object
      properties:
        name:
          type: string
          example: Acme Corp
          minLength: 2
        slug:
          type: string
          example: acme-corp
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: kebab-case. Único no sistema e visível na URL.
    UpsertBudgetDto:
      type: object
      properties:
        limitUsd:
          type: number
          example: 50
          minimum: 0
          description: >-
            Teto em DÓLARES — o único lugar do contrato que fala em dólares,
            porque é o que uma pessoa digita. A api o converte para micro-USD, e
            as respostas voltam em micro-USD.
        policy:
          type: string
          enum:
            - block
            - allow
          example: block
          description: >-
            `block` recusa a chamada que estouraria o teto; `allow` a deixa
            passar e só avisa.
      required:
        - limitUsd
        - policy
    UpsertCredentialDto:
      type: object
      properties:
        provider:
          type: string
          enum:
            - anthropic
            - openai
            - openrouter
            - nvidia-nim
            - together
            - deepinfra
            - bitdeer
            - vultr
          example: anthropic
        apiKey:
          type: string
          example: sk-ant-api03-…
          maxLength: 512
          description: >-
            A chave em texto puro. É cifrada por envelope encryption antes de
            tocar o banco e NUNCA volta em resposta nenhuma — nem cifrada. O
            teto de 512 caracteres é proteção contra payload absurdo, não
            validação de formato: se a chave presta quem responde é o provider,
            em `POST /users/me/credentials/{provider}/test`.
      required:
        - provider
        - apiKey
    UpsertPromptTemplateInternalDto:
      type: object
      properties:
        name:
          type: string
          example: dev-agent-kickoff
        version:
          type: string
          example: '3'
        body:
          type: string
          example: You are the dev agent for the {{modulo}} module...
        hash:
          type: string
          example: sha256:9f2c...
      required:
        - name
        - version
        - body
        - hash
    UrlDeExecucaoResponseDto:
      type: object
      properties:
        label:
          type: string
          example: Swagger
          maxLength: 60
        url:
          type: string
          example: http://localhost:8080/docs
        kind:
          type: string
          enum:
            - api_docs
            - web
          example: api_docs
      required:
        - label
        - url
        - kind
    UserCredentialResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z0000CREDENCIAL00000001
        provider:
          type: object
          example: anthropic
          description: Cobre chaves de LLM e tokens de git (`github`, `gitlab`).
        createdAt:
          type: string
          example: '2026-07-10T10:00:00.000Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-10T10:00:00.000Z'
          format: date-time
      required:
        - id
        - provider
        - createdAt
        - updatedAt
    UserPreferencesResponseDto:
      type: object
      properties:
        locale:
          type: string
          enum:
            - pt-BR
            - en
            - ru
            - zh-Hans
          example: pt-BR
        responseLanguage:
          type: string
          example: automatico
          description: >-
            `automatico` (toda conta começa assim) ou o código BCP-47 escolhido
            explicitamente na página da Conta.
        detectedLanguage:
          type: string
          nullable: true
          example: null
          description: >-
            O idioma detectado nas suas próprias mensagens E confirmado por você
            — nunca uma detecção não confirmada. `null` até existir uma
            confirmação.
        detectedLanguageConfirmedAt:
          type: string
          format: date-time
          nullable: true
        effectiveResponseLanguage:
          description: >-
            O que vale hoje FORA de qualquer sessão, e de onde veio: escolha da
            conta > detecção confirmada > idioma da interface.
          allOf:
            - $ref: '#/components/schemas/IdiomaEfetivoResponseDto'
      required:
        - locale
        - responseLanguage
        - detectedLanguage
        - detectedLanguageConfirmedAt
        - effectiveResponseLanguage
    VerifyEmailDto:
      type: object
      properties:
        token:
          type: string
          description: Token de uso único recebido por e-mail.
      required:
        - token
    WorkspaceComPapelResponseDto:
      type: object
      properties:
        workspace:
          $ref: '#/components/schemas/WorkspaceResponseDto'
        role:
          type: string
          enum:
            - viewer
            - developer
            - maintainer
            - owner
          example: maintainer
          description: O papel de QUEM CHAMA neste workspace.
      required:
        - workspace
        - role
    WorkspaceMemberComUsuarioResponseDto:
      type: object
      properties:
        userId:
          type: string
          example: 01JC4Z0000USUARIO0000000002
        role:
          type: string
          enum:
            - viewer
            - developer
            - maintainer
            - owner
          example: maintainer
          description: >-
            O papel de WORKSPACE — o que todo projeto do workspace herda a menos
            que uma linha de projeto o sobreponha (RN-471).
        name:
          type: string
          example: Senior Dev
          nullable: true
        email:
          type: string
          example: dev@brabo.dev
      required:
        - userId
        - role
        - name
        - email
    WorkspaceMemberResponseDto:
      type: object
      properties:
        workspaceId:
          type: string
          example: 01JC4Z0000WORKSPACE00000001
        userId:
          type: string
          example: 01JC4Z0000USUARIO0000000002
        role:
          type: string
          enum:
            - viewer
            - developer
            - maintainer
            - owner
          example: maintainer
          description: >-
            Hierarquia linear: owner > maintainer > developer > viewer. Cada
            papel inclui as permissões dos seguintes.
        createdAt:
          type: string
          example: '2026-07-22T08:00:00.000Z'
          format: date-time
      required:
        - workspaceId
        - userId
        - role
        - createdAt
    WorkspaceResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z0000WORKSPACE00000001
        name:
          type: string
          example: Acme Corp
        slug:
          type: string
          example: acme-corp
          description: Único no sistema; é o que aparece na URL.
        createdBy:
          type: string
          example: 01JC4Z0000USUARIO0000000001
        toolRouterEnabled:
          type: boolean
          example: true
          description: >-
            Se o passo de roteamento de ferramentas pelo Jev (ADR 0179) roda
            neste workspace. Ligado por padrão; só age quando o modelo do turno
            é do OpenRouter, então `true` num workspace sem OpenRouter não faz
            nada.
        createdAt:
          type: string
          example: '2026-07-20T09:12:00.000Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-20T09:12:00.000Z'
          format: date-time
      required:
        - id
        - name
        - slug
        - createdBy
        - toolRouterEnabled
        - createdAt
        - updatedAt
    WorkspaceSpendReportResponseDto:
      type: object
      properties:
        workspaceId:
          type: string
          example: 9b1c2d3e-4f50-4a61-8b72-0c3d4e5f6a7b
          format: uuid
        ownerId:
          type: string
          example: 9b1c2d3e-4f50-4a61-8b72-0c3d4e5f6a7b
          format: uuid
          description: Dono das chaves que financiaram este gasto (RN-058).
        dias:
          type: number
          example: 30
          description: Janela deslizante, em dias.
        totalMicros:
          type: number
          example: 1250000
        inputTokens:
          type: number
          example: 120000
        outputTokens:
          type: number
          example: 35000
        chamadas:
          type: number
          example: 42
        porModelo:
          description: >-
            Por MODELO. Dois providers servindo o mesmo nome caem na mesma linha
            — separá-los reintroduziria o eixo de credencial com outro nome.
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porProvider:
          description: >-
            Por PROVIDER (ADR 0076, RN-186). Este eixo fala de CREDENCIAL e por
            isso só existe aqui, numa rota que exige `owner` (RN-060) — a
            resposta do membro não o tem, e não é um filtro que o esconde: é o
            tipo do repositório que o recusa com escopo de ator (RN-187).
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porProjeto:
          description: Por PROJETO dentro do workspace.
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porAtor:
          description: >-
            Por ATOR — agente e pessoa na mesma lista, distinguidos por
            `actorKind`.
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porOwner:
          description: >-
            As linhas de PESSOA (`actor_kind = "user"`) — o bloco que o handoff
            chama de "Por owner", porque pela RN-058 é a chave do owner que
            todas gastam. Quem é o owner fica em `ownerId`. Uma partição de
            `porAtor`, sem consulta extra (RN-188).
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porAgente:
          description: >-
            As linhas de AGENTE (`actor_kind = "agent"`). A outra metade de
            `porAtor`.
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porDia:
          type: array
          items:
            $ref: '#/components/schemas/SpendPorDiaResponseDto'
      required:
        - workspaceId
        - ownerId
        - dias
        - totalMicros
        - inputTokens
        - outputTokens
        - chamadas
        - porModelo
        - porProvider
        - porProjeto
        - porAtor
        - porOwner
        - porAgente
        - porDia
    WorkspaceSummaryResponseDto:
      type: object
      properties:
        activeProjects:
          type: number
          example: 4
          description: >-
            Número de projetos do workspace. Não há flag de "ativo" no domínio —
            todo projeto conta.
        agentCount:
          type: number
          example: 6
          description: >-
            Agentes distintos (actorKind=agent) que gastaram tokens neste mês,
            somados em todos os projetos do workspace — inclui as
            subespecialidades das áreas (Fase 8).
        spentMicros:
          type: number
          example: 12500000
          description: >-
            Gasto do mês corrente, em micro-USD, somado por
            token_usage.createdAt.
      required:
        - activeProjects
        - agentCount
        - spentMicros
