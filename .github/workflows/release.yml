name: Release

# Fase 5, item 6. Disparado pela TAG, não por push em branch: a decisão de
# publicar uma versão é do usuário, e uma tag é o registro explícito dessa
# decisão. O CLAUDE.md já trata merge em branch protegida como ato manual; a
# release segue a mesma regra.
# SÓ tag FINAL. O padrão `v[0-9]+.[0-9]+.[0-9]+` não casa com sufixo de
# pré-lançamento, então `v0.2.0-qa.1` e `v0.2.0-dev.3` não disparam nada.
#
# Antes era `v*`, e isso quebraria assim que a esteira da FASE 6 começasse a
# carimbar: as tags de estágio nascem a cada merge, e cada uma dispararia uma
# tentativa de publicar release — falhando na conferência de versão, porque
# `0.2.0-qa.1` nunca vai bater com o `0.2.0` declarado nos arquivos.
#
# E TEM SEGUNDA CHANCE, que é a lição de seis tags órfãs. Com só o gatilho de
# `push: tags`, uma Release que não sai não sai mais: republicar exigiria apagar
# e recriar a tag, ou seja, reescrever o registro para consertar o efeito dele.
#
# Aconteceu, e não uma vez: `v0.2.0`, `v0.3.0`, `v0.3.1`, `v1.0.0`, `v1.0.1` e
# `v1.1.0` existem sem Release. A causa era o `tag-release` cair no
# `GITHUB_TOKEN` sem o `BRABO_BOT_TOKEN` configurado — tag empurrada com o token
# padrão NÃO dispara workflow (regra do GitHub contra recursão), e o comentário
# do `tag-release.yml` já registrava isso desde a `v0.2.0`.
#
# O PAT foi configurado e a `v1.1.1` fechou a esteira sozinha, então o automático
# está resolvido. As seis de cima NÃO: o PAT vale para tag nova, e recuperar
# aquelas é justamente o que o `workflow_dispatch` abaixo existe para permitir.
# São dois problemas, e o segundo continuaria aberto mesmo com o PAT no lugar.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag final a publicar (ex.: v1.1.0)'
        required: true
        type: string

permissions:
  contents: write # criar a GitHub Release e a branch do corte do CHANGELOG
  pull-requests: write # abrir a PR do CHANGELOG para `dev`

env:
  NODE_VERSION: '24.11.1'
  PNPM_VERSION: '11.3.0'

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `secrets` não existe no `if:` de um step — só em `env`. Mesmo padrão do
      # `tag-release.yml`.
      TEM_PAT: ${{ secrets.BRABO_BOT_TOKEN != '' }}
    steps:
      # PRIMEIRO passo, antes de qualquer checkout: quem republica é restrito,
      # pela mesma razão e com a mesma lógica do `promote.yml`. `workflow_dispatch`
      # já exige escrita no repo, mas isso não é a mesma coisa que ser o
      # responsável de release — e a política nomeia um responsável.
      #
      # O gatilho de `push: tags` NÃO passa por aqui: ali quem "autorizou" foi a
      # tag, que só nasce da esteira.
      - name: Quem pode republicar
        if: github.event_name == 'workflow_dispatch'
        env:
          ATOR: ${{ github.actor }}
          MODO: ${{ vars.APPROVAL_MODE || 'solo' }}
          OWNER: ${{ vars.OWNER_HANDLE }}
        run: |
          set -euo pipefail
          if [ "$MODO" != 'solo' ]; then
            echo "::notice::APPROVAL_MODE=$MODO — a restrição de dispatch por owner vale no modo solo."
            exit 0
          fi
          if [ -z "${OWNER:-}" ]; then
            echo "::error::OWNER_HANDLE não está definido. Sem ele não há como saber quem é o responsável de release."
            exit 1
          fi
          if [ "$ATOR" != "$OWNER" ]; then
            echo "::error::'$ATOR' não pode republicar uma release."
            exit 1
          fi
          echo "ator autorizado: $ATOR"

      # DE ONDE VEM A TAG, e por que isto não é `github.ref_name` direto.
      #
      # No gatilho de `push: tags`, `GITHUB_REF_NAME` É a tag. Num
      # `workflow_dispatch` ele é a BRANCH (a padrão, `main`) — usar o mesmo
      # `${GITHUB_REF_NAME}` nos dois casos faria a republicação gerar uma Release
      # chamada "main", com o changelog de `main`, e sem erro nenhum.
      #
      # Um lugar só resolve, valida e publica o resultado como output. Os passos
      # seguintes leem daqui e nunca de `github.ref_name`.
      - name: Qual tag publicar
        id: alvo
        env:
          ENTRADA: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            tag="$ENTRADA"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          # A validação de formato existe porque o `workflow_dispatch` aceita
          # texto livre — o filtro do gatilho de push não protege este caminho.
          # Sufixo de pré-lançamento é recusado: `-qa.1` nunca bate com a versão
          # declarada nos manifests, e a Release sairia de algo que ninguém
          # validou como final.
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' não é tag final. O formato é vX.Y.Z, sem sufixo -dev.N nem -qa.N."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag a publicar: $tag"

      - uses: actions/checkout@v4
        with:
          # O checkout é NA TAG, não no ref do evento. No push isso é o mesmo
          # commit; num dispatch é a diferença entre publicar a versão pedida e
          # publicar o topo da `main`.
          ref: ${{ steps.alvo.outputs.tag }}
          # O changelog é gerado a partir do histórico: sem `fetch-depth: 0` o
          # checkout raso traz um commit só e a release sai com o changelog
          # vazio, sem erro nenhum.
          fetch-depth: 0
          # O PAT porque o último passo EMPURRA a branch do corte do CHANGELOG
          # e abre PR com ela. Branch empurrada com o `GITHUB_TOKEN` abre PR
          # cujos checks nascem em `action_required` — o mesmo defeito que o
          # `promote.yml` tinha.
          token: ${{ secrets.BRABO_BOT_TOKEN || github.token }}

      # RECUSA republicar sobre o que já existe, e isso é escolha, não limitação:
      # uma Release publicada é registro, e sobrescrevê-la em silêncio apagaria as
      # notas que alguém pode já ter lido ou linkado. Se a intenção for refazer,
      # apagar a Release é ato deliberado seu, na interface.
      #
      # Falha rápido de propósito: descobrir a colisão aqui custa segundos, contra
      # 20 minutos de build para bater no `gh release create` no fim. No gatilho de
      # push isto nunca acontece; num dispatch, significa tag errada no input.
      - name: A Release já existe?
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.alvo.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a Release de $TAG já existe, e este workflow não sobrescreve."
            {
              echo "### Release já publicada"
              echo
              echo "\`$TAG\` já tem Release, e ela não é sobrescrita — nota publicada é"
              echo "registro. Para refazer, apague a Release primeiro, na interface."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "$TAG ainda não tem Release."

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # PRIMEIRO passo depois do checkout, de propósito: falhar aqui custa
      # segundos, e evita descobrir a divergência depois de 20 minutos de build.
      #
      # A verificação existe porque a tag e os manifests são fontes de verdade
      # independentes. Taggear v0.2.0 com os package.json ainda em 0.1.0 produz
      # imagens rotuladas com uma versão que o código não declara — e o sintoma
      # aparece semanas depois, quando alguém tenta correlacionar um bug com
      # uma versão.
      - name: A tag bate com as versões declaradas?
        env:
          TAG: ${{ steps.alvo.outputs.tag }}
        run: |
          set -euo pipefail
          versao="${TAG#v}"
          echo "tag: ${TAG} -> versão ${versao}"

          # AVISO, não reprovação: desde a FASE 6 a versão é CALCULADA e vive
          # na tag. Ninguém pode commitar direto numa permanente para bumpar
          # `package.json`, então exigir que os arquivos acompanhem obrigaria a
          # um PR de bump por ciclo — cerimônia que o cálculo automático existe
          # para eliminar. Os arquivos viram metadado, e a divergência fica
          # visível no log em vez de travar a publicação.
          divergentes=0
          conferir() {
            local arquivo="$1" encontrado="$2"
            if [ "${encontrado}" != "${versao}" ]; then
              echo "::warning file=${arquivo}::declara ${encontrado}, mas a tag é ${versao}"
              divergentes=$((divergentes + 1))
            else
              echo "ok: ${arquivo} = ${encontrado}"
            fi
          }

          conferir package.json           "$(node -p "require('./package.json').version")"
          conferir apps/api/package.json  "$(node -p "require('./apps/api/package.json').version")"
          conferir apps/web/package.json  "$(node -p "require('./apps/web/package.json').version")"
          conferir apps/engine/mix.exs    "$(grep -oP 'version:\s*"\K[^"]+' apps/engine/mix.exs | head -1)"

          if [ "${divergentes}" -gt 0 ]; then
            echo "::notice::${divergentes} arquivo(s) com versão diferente da tag — a fonte de verdade é a TAG."
          fi

      - name: Gerar o changelog desta versão
        env:
          TAG: ${{ steps.alvo.outputs.tag }}
        run: |
          set -euo pipefail
          # A tag anterior é a penúltima FINAL em ordem de versão — `HEAD^`
          # daria o commit anterior, que não é a mesma coisa.
          #
          # O `grep -v -- '-'` não é detalhe: `--sort=-v:refname` coloca
          # `v1.4.0-qa.1` ACIMA de `v1.4.0`, então sem o filtro a "penúltima"
          # era uma PRÉ-RELEASE da própria versão sendo lançada. O intervalo
          # sobrava só os merges de promoção, que o `--no-merges` do gerador
          # descarta — e a Release saía com "_Nenhum commit em conventional
          # commits neste intervalo._". Aconteceu em seis releases.
          anterior="$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | sed -n '2p')"
          node scripts/changelog.mjs "${TAG}" ${anterior:+"${anterior}"} --stdout \
            | tee RELEASE_NOTES.md

      - uses: docker/setup-buildx-action@v3

      # As duas tags de cada imagem, calculadas num passo só porque agora são
      # entrada de uma action e não de um `run` — expressão de workflow não
      # enxerga variável de shell.
      - name: As duas tags desta release
        id: versao
        env:
          TAG: ${{ steps.alvo.outputs.tag }}
        run: |
          set -euo pipefail
          echo "versao=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # As quatro imagens, cada uma com DUAS tags: a versão (legível, é o que
      # se cita numa conversa) e o SHA do commit (imutável, é o que identifica
      # o build sem ambiguidade quando uma tag é movida). O `TAG_EXTRA` do
      # `docker-bake.hcl` existe exatamente para a segunda.
      #
      # BAKE, não quatro `docker build` em loop. O `ci.yml` já usa este mesmo
      # bakefile desde a Fase 5, e o comentário no topo dele MEDE o motivo: em
      # sequência os builds somavam ~359s (api 130, engine 160, web 49, backup
      # 20); em paralelo num builder só, ~195s. O loop daqui pagava aquele preço
      # a cada tag para chegar ao mesmo veredito.
      #
      # `push: false` continua valendo, e agora vem do `output = ["type=docker"]`
      # do alvo `_comum`: publicar em registry ainda não está resolvido — o
      # overlay de produção aponta para `ghcr.io/OWNER/*`, um placeholder. As
      # imagens são construídas aqui para provar que a tag é CONSTRUÍVEL; a
      # publicação entra quando o registry for decidido (ver ADR 0027).
      #
      # Sobre o cache `type=gha` que o bakefile declara: aqui ele é BÔNUS, não a
      # razão da troca. O cache do Actions é escopado por branch, e quem popula
      # aqueles escopos é o `ci.yml` em `pull_request` — cache escrito por PR não
      # é legível de uma tag em `main`. O ganho garantido é o PARALELISMO; se o
      # cache pegar, melhor.
      #
      # `VERSION` é a terceira variável e não é redundante com `TAG`, apesar de
      # receber o mesmo valor aqui: ela vira `BRABO_VERSION` na imagem da api e
      # `VITE_BRABO_VERSION` no bundle do web, assando a versão NO ARTEFATO (ADR
      # 0036). É o único caminho pelo qual a tag chega ao rodapé da tela de login
      # e ao `service.version` dos spans. Fora deste workflow o default do
      # bakefile é "dev" — o `ci.yml` põe `TAG=prod`, e "prod" não é versão de
      # nada.
      - name: Build das imagens taggeadas
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          targets: default
          load: true
        env:
          TAG: ${{ steps.versao.outputs.versao }}
          TAG_EXTRA: ${{ steps.versao.outputs.sha }}
          VERSION: ${{ steps.versao.outputs.versao }}

      - name: O que foi construído
        run: |
          set -euo pipefail
          for app in api engine web backup; do
            echo "construída: brabo-${app} -> ${TAG}, ${TAG_EXTRA}"
          done
        env:
          TAG: ${{ steps.versao.outputs.versao }}
          TAG_EXTRA: ${{ steps.versao.outputs.sha }}

      - name: Publicar a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.alvo.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file RELEASE_NOTES.md

      # O CHANGELOG.md do repositório volta por PR para `dev`, não por push.
      #
      # `main` não aceita push (só tag pelo bot de release e
      # `.release/gate.json` pelo bot do gate), e commitar em `qa`/`dev` antes
      # de abrir a promoção quebraria o "range limpo" do check de promoção.
      # Sobra o caminho que a política já prevê para tudo: entrar por PR.
      #
      # Consequência aceita: o `CHANGELOG.md` de `main` fica um ciclo atrás. A
      # fonte autoritativa das notas é a GitHub Release, publicada acima no
      # mesmo instante da tag.
      #
      # Antes disto NADA nunca escrevia no arquivo: o gerador só era chamado
      # com `--stdout` para montar o corpo da Release, e o `CHANGELOG.md`
      # acumulou doze versões dentro de um único "Unreleased".
      - name: O PAT está configurado?
        if: env.TEM_PAT != 'true'
        run: |
          echo "::warning::sem BRABO_BOT_TOKEN: a PR do CHANGELOG abre, mas os checks dela nascem em 'action_required' e precisam ser liberados à mão."

      - name: Levar o CHANGELOG desta versão para `dev`
        env:
          # PAT pelo mesmo motivo do `promote.yml`: PR aberto pelo
          # `GITHUB_TOKEN` nasce com os checks travados em `action_required`.
          GH_TOKEN: ${{ secrets.BRABO_BOT_TOKEN || github.token }}
          TAG: ${{ steps.alvo.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin dev --no-tags
          git checkout -B "chore/changelog-${TAG}" origin/dev

          anterior="$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | sed -n '2p')"
          node scripts/changelog.mjs "${TAG}" ${anterior:+"${anterior}"} "${TAG}"

          # A versão anunciada em prosa vem JUNTO, no mesmo commit — no README e
          # na primeira página do site (`docs/intro.md`). Ela é gerável — o
          # release sabe qual é —, e deixá-la para depois faria todo release
          # nascer com o drift check vermelho numa PR que o bot abre e ninguém
          # pode consertar sem um segundo commit à mão.
          node scripts/ci/readme-version.ts "${TAG}"

          if git diff --quiet -- CHANGELOG.md README.md docs/intro.md; then
            echo "::notice::CHANGELOG, README e docs/intro.md já contêm ${TAG} — nada a abrir."
            exit 0
          fi

          git config user.name  'brabo-release[bot]'
          git config user.email 'brabo-release[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md docs/intro.md
          git commit -m "docs(changelog): ${TAG}"
          git push -u origin "chore/changelog-${TAG}"

          gh pr create --base dev --head "chore/changelog-${TAG}" \
            --title "docs(changelog): ${TAG}" \
            --body "Corte do CHANGELOG na versão \`${TAG}\`, gerado por \`scripts/changelog.mjs\`,
          mais a versão anunciada no README e em \`docs/intro.md\`, gerada por
          \`scripts/ci/readme-version.ts\`.

          Entra por PR porque \`main\` não aceita push, e commitar em \`qa\`/\`dev\`
          antes da promoção quebraria o \"range limpo\" do check de promoção.
          Sobe para \`qa\` e \`main\` no próximo ciclo, como qualquer mudança." 
