            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 未找到项目、会话或 handoff。
        '409':
          description: '`agente_ja_ativo`（ADR 0182，RN-635）：目标已在该项目一个未关闭的会话中处于活跃状态——不会创建提议。'
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
