# Mapa: mudança de código → documentação que precisa ser revisada.
#
# Consumido pelo drift check do CI (.github/workflows/docs-check.yml) e pelo
# slash command /sync-docs. Todo glob é validado contra os arquivos versionados
# por `node scripts/docs/docmap.mjs` — glob que não casa com nada é REGRA
# MORTA: nunca dispara e finge cobertura que não existe. O CI reprova nesse
# caso.
#
# severity: block → reprova o PR
# severity: warn  → comenta no PR listando o que revisar
# generated: true → os docs saem de `pnpm docs:generate`, não da mão
#
# Escape hatch: label `docs-not-needed` no PR, ou uma linha
# `docs-not-needed: <motivo>` no corpo. Sem saída, a regra vira algo a burlar.
version: 1

rules:
  # ---------------------------------------------------------------- domínio

  - id: dominio-e-regras
    watch:
      - "apps/api/src/domain/**"
      - "apps/api/src/db/migrations/**"
      # Fase 12d: os casos de uso de backlog decidem QUEM promove uma história
      # (RN-048) — regra de negócio que não mora no diretório `domain/`.
      - "apps/api/src/application/use-cases/backlog/**"
    docs: ["docs/business-rules.md"]
    severity: block
    note: "RN alterada exige arquivo:linha atualizado e o teste que a cobre."

  - id: pipeline-de-acoes
    watch:
      - "apps/api/src/domain/actions/**"
      - "apps/api/src/application/use-cases/actions/**"
    docs: ["docs/reference/permissions.md", "docs/business-rules.md"]
    severity: block
    note: "deny > allow e os dois tetos são o coração do sistema."

  # A confirmação em duas etapas do pull (RequestModelPull/ConfirmModelPull)
  # e o cliente do Hub vivem fora de `domain/` — `dominio-e-regras` cobre o
  # allowlist de publisher oficial (que É domain/), mas não estes dois
  # diretórios. Mesmo critério de separação de `pipeline-de-acoes`, acima:
  # regra de negócio que mora em application/use-cases fora do padrão comum.
  - id: huggingface-model-pull
    watch:
      - "apps/api/src/infrastructure/huggingface/**"
      - "apps/api/src/application/use-cases/llm/huggingface/**"
    docs: ["docs/business-rules.md"]
    severity: block
    note: "A confirmação em duas etapas do pull é regra de negócio (RN-462) fora de domain/; RN alterada exige arquivo:linha atualizado e o teste que a cobre."

  # ------------------------------------------------------------------ dados

  # O arquivo mais alterado do repositório até a v0.1.0 (23 mudanças) e o que
  # menos tinha cobertura de doc: as constraints do schema SÃO regra de
  # negócio (budgets_scope_check, unique(session_id, seq)).
  - id: schema-e-migrations
    watch:
      - "apps/api/src/db/schema.ts"
      - "apps/api/src/db/migrations/**"
      - "apps/engine/priv/repo/migrations/**"
    docs: ["docs/architecture.md", "docs/business-rules.md"]
    severity: warn
    note: "Constraint nova costuma ser RN. Tabela nova muda o diagrama de dados."

  # -------------------------------------------------------- contratos e API

  - id: eventos-e-artefatos
    watch:
      - "apps/engine/lib/engine/harness/artifact_schemas.ex"
      - "apps/api/src/domain/sessions/**"
    docs: ["docs/reference/events.md", "docs/reference/artifacts.md"]
    severity: block

  # O engine_api_client.ex é onde o contrato api↔engine se materializa, e não
  # há checagem automática de que ele bate com as rotas da api.
  - id: contrato-api-engine
    watch:
      - "apps/engine/lib/engine/sessions/engine_api_client.ex"
      - "apps/api/src/interfaces/http/internal/**"
      - "apps/engine/lib/engine_web/router.ex"
    docs: ["docs/reference/internal-api.md"]
    severity: block

  - id: superficie-http
    watch:
      - "apps/api/src/interfaces/http/**"
    docs: ["docs/security-surface.md", "docs/reference/internal-api.md"]
    severity: block
    note: "Rota nova sem classificação já quebra route-surface.spec.ts; a doc é a fonte dele."

  # SEPARADA de `superficie-http` pelo mesmo critério que separa
  # `checks-e-rulesets` de `politica-de-branches`: aquela cobra a
  # CLASSIFICAÇÃO de exposição de uma rota; esta cobra o CONTRATO gerado.
  # Mexer num @ApiProperty não muda a classificação de ninguém, e cobrar as
  # duas coisas pela mesma mudança ensina a usar o escape hatch por reflexo.
  #
  # O `docs:` aponta para os ARQUIVOS, não para o diretório: o docmap valida
  # com existsSync e um diretório passaria trivialmente.
  # `apps/web/src/lib/api-types.generated.ts` entrou na MESMA regra, não numa
  # nova: ele é o segundo andar do `openapi.json` (openapi-typescript rodando
  # sobre ele), watch idêntico e mesmo remédio de "não edite à mão" — separar
  # duplicaria o `watch` e um dia um dos dois divergiria do outro. Ver ADR
  # 0116.
  - id: referencia-openapi
    watch:
      - "apps/api/src/**/*.controller.ts"
      - "apps/api/src/**/*.dto.ts"
      - "apps/api/src/infrastructure/openapi/**"
    docs:
      - "docs/reference/openapi.json"
      - "docs/reference/api/.openapi-manifest.json"
      - "apps/web/src/lib/api-types.generated.ts"
    generated: true
    severity: block
    note: "Rode `pnpm docs:generate` e `pnpm --filter web run openapi:types`. O openapi.json, os MDX e os tipos do web saem do código, nunca da mão."

  # O SITE era ponto cego do mapa: `website/**` não aparecia em nenhuma regra, e
  # mexer no config do Docusaurus não cobrava documentação nenhuma. Isso não é
  # hipótese — foi por aí que passou o defeito que deixou as 117 páginas de
  # operação da referência de API sem renderizar em duas releases: o config não
  # declarava `docItemComponent: '@theme/ApiItem'`, o build ficou verde, e nada
  # no mapa ligava aquela mudança a doc alguma.
  #
  # `warn`, não `block`: o `website/**` vai de ajuste de uma cor no
  # `custom.css` a trocar o mecanismo de publicação. Bloquear os dois pelo mesmo
  # motivo ensina a usar o escape hatch por reflexo, e aí ele para de significar
  # alguma coisa. Quem reprova de verdade o comportamento do site é o
  # `api-render-check.mjs` no `docs-check.yml`, que olha o build, não a prosa.
  - id: site-e-publicacao
    watch:
      - "website/**"
      - ".github/workflows/docs-deploy.yml"
    docs:
      - "docs/explanation/documentation-workflow.md"
    severity: warn
    note: "Config do site ou mecanismo de publicação mudou — o documento que explica o mecanismo precisa acompanhar."

  - id: contrato-web
    watch:
      - "apps/web/src/lib/api-client.ts"
      - "apps/web/src/lib/api-types.ts"
      - "packages/shared/src/**"
    docs: ["docs/architecture.md"]
    severity: warn

  - id: git-providers
    watch:
      - "apps/api/src/infrastructure/git/**"
      - "apps/api/src/domain/git/**"
      - "packages/shared/src/**"
    docs: ["docs/reference/git-providers.md"]
    severity: warn

  - id: llm-providers
    watch:
      - "apps/api/src/infrastructure/llm/**"
      - "apps/api/src/domain/llm/**"
      - "apps/api/test/contract/llm-provider.contract.ts"
    docs:
      - "docs/reference/llm-providers.md"
      # O aceite com credencial real (Fase 13a): mexer num provider invalida a
      # linha dele na tabela de aceite, e sem esta regra ninguém era cobrado.
      - "docs/explanation/aceite-providers.md"
    severity: warn
    note: "Até a Fase 9a NENHUMA regra observava a camada de LLM — provider, capabilities e taxonomia de erro mudavam sem doc cobrando nada. Contrato, capabilities e divergências por dialeto vivem no doc apontado (ADR 0041)."

  # ---------------------------------------------------------------- agentes

  - id: harness-e-gates
    watch:
      - "apps/engine/lib/engine/harness/**"
      - "apps/engine/lib/engine/gates/**"
      - "apps/engine/lib/engine/infra/**"
      # Fase 12d: `dev/` e `agents/` não eram observados por regra NENHUMA — a
      # máquina de estados dos dev agents (12b) e os agentes conversacionais
      # (12c) podiam mudar sem doc ser cobrada. O vão estava exatamente onde a
      # Fase 12 mais mexeu.
      - "apps/engine/lib/engine/dev/**"
      - "apps/engine/lib/engine/agents/**"
    docs: ["docs/architecture.md", "docs/glossary.md"]
    severity: warn
    note: "Atualizar só se mudou contrato de behaviour ou fluxo de gate. `infra/` (área de Infra, Fase 8c) entrou aqui de passagem — não tinha regra nenhuma até então; `dev/` e `agents/` entraram na 12d pelo mesmo motivo."

  # O registro de gates é índice do que barra o trabalho. Gate novo, ou
  # evidência que mudou de lugar, exige a linha no registro e a RN — senão o
  # arquivo vira uma lista que descreve um produto que não existe mais.
  - id: registro-de-gates
    watch:
      - "docs/gates.yml"
      - "apps/api/src/domain/gates/**"
      - "apps/api/src/infrastructure/gates/**"
      - "apps/api/scripts/validacao-gates.ts"
      # FASE 15b — o CONSUMO. A regra observava só quem produz o registro; a
      # tela podia passar a mostrar outra coisa sem ninguém ser cobrado, que
      # é a forma de envelhecimento que o registro existe para impedir.
      - "apps/api/src/interfaces/http/gates/**"
      - "apps/web/src/components/PrGateTimeline.tsx"
    docs: ["docs/explanation/gates.md", "docs/business-rules.md"]
    severity: block

  # O fluxo (ADR 0085) declara as RELAÇÕES entre papéis — quem entrega o
  # quê a quem — a terceira peça ao lado do catálogo (agent-areas.ts) e do
  # controle (gates.yml, ADR 0054). `warn`, não `block`: ainda não existe
  # teste de cruzamento fluxo.yml × gates.yml × agent-areas.ts que prove
  # que uma mudança no catálogo ou no registro de gates quebrou uma
  # relação declarada — promover para `block` fica para quando esse teste
  # existir (backlog).
  - id: modelo-de-time
    watch:
      - "apps/api/src/domain/agents/**"
      - "docs/gates.yml"
    docs: ["docs/fluxo.yml", "docs/explanation/modelo-de-time.md"]
    severity: warn
    note: "Fluxo declara as relações entre papéis; catálogo (agent-areas.ts) ou controle (gates.yml) mudando pode desalinhar docs/fluxo.yml."

  # -------------------------------------------------------- infra e operação

  - id: boot-e-supervisao
    watch:
      - "apps/engine/lib/engine/application.ex"
      - "apps/api/src/app.module.ts"
      - "apps/api/src/main.ts"
    docs: ["docs/architecture.md"]
    severity: warn
    note: "Árvore de supervisão e ordem dos guards são fronteiras arquiteturais."

  # O coração da observabilidade não tinha regra nenhuma até o ADR 0035: dava para
  # trocar o nome de `trace_id`, desligar a propagação ou mudar o formato do log
  # sem que nada pedisse para atualizar doc. E é justamente aqui que a doc erra
  # calada — dois textos afirmavam o contrário do comportamento por meses.
  - id: observabilidade
    watch:
      - "apps/api/src/tracing.ts"
      - "apps/api/src/tracing-boot.ts"
      - "apps/api/src/infrastructure/observability/**"
      - "apps/engine/lib/engine/telemetry/**"
      - "apps/web/src/lib/logger.ts"
    docs:
      - "docs/explanation/observability.md"
      - "docs/runbook.md"
    severity: warn
    note: "`trace_id` é contrato (Alloy + derivedFields do Loki). Formato de log e propagação mudam o runbook."

  - id: config-e-inferencia
    watch:
      - "docker/docker-compose*.yml"
      - ".env.example"
      - "docker/**"
    docs: ["docs/reference/configuration.md", "docs/runbook.md"]
    generated: true
    severity: block
    note: "Vars do ambiente de inferência (ADR 0020) vivem no runbook."

  - id: deploy-e-runbook
    watch:
      - "deploy/k8s/**"
      - "Makefile"
    docs: ["docs/runbook.md"]
    severity: warn

  - id: scripts
    watch:
      - "package.json"
      - "apps/api/package.json"
      - "apps/web/package.json"
      - "Makefile"
      - "scripts/**"
    docs: ["docs/reference/scripts.md", "README.md"]
    generated: true
    severity: warn

  # -------------------------------------------------------------------- ADR

  # A política de branches é executada por workflow. Mudar o mecanismo sem
  # mudar a fonte faz a doc descrever um sistema que não existe — e aqui isso é
  # pior que o normal, porque a política é o que as pessoas leem quando o CI as
  # reprova.
  - id: politica-de-branches
    watch:
      - ".github/workflows/pr-police.yml"
      - ".github/workflows/approval-ladder.yml"
      - ".github/workflows/promote.yml"
      - ".github/workflows/promotion-check.yml"
      - ".github/workflows/tag-release.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/backmerge-gate.yml"
      - "scripts/ci/**"
      # `.release/gate.json` NÃO entra aqui: ele só existe depois do primeiro
      # hotfix, e glob que não casa com nada reprova o docs:check. O estado do
      # gate é dado, não fonte — a doc dele acompanha `scripts/ci/gate.ts`.
    docs:
      - "docs/explanation/branching-policy.md"
    severity: block
    note: "Regra nova no mecanismo exige a regra escrita na política."

  # SEPARADA da regra acima de propósito, mesmo motivo de checks-e-rulesets
  # logo abaixo: `politica-de-branches` cobre o MECANISMO da escada
  # (approval-ladder.ts muda → branching-policy.md muda); esta cobre o
  # CRITÉRIO de quem ocupa cada papel dela, que é decisão humana, não
  # decorre do código — daí `warn`, não `block`.
  - id: governanca
    watch:
      - "scripts/ci/approval-ladder.ts"
      - "docs/explanation/branching-policy.md"
    docs:
      - "GOVERNANCE.md"
    severity: warn
    note: "Papel novo na escada ou mudança na exigência por destino pode exigir revisão do critério de quem entra em cada lista."

  # SEPARADA da regra acima de propósito. O rulesets.md documenta a
  # configuração do GitHub e a lista de checks required — ele fica velho quando
  # muda NOME DE JOB ou gatilho, não quando muda a lógica interna de um script.
  #
  # Estavam juntas, e o drift check cobrou o rulesets.md duas vezes por
  # mudanças que não tinham nada a ver com ele. Regra que cobra o que não faz
  # sentido ensina a usar o escape hatch por reflexo, e aí ele para de
  # significar alguma coisa.
  - id: checks-e-rulesets
    watch:
      - ".github/workflows/*.yml"
    docs:
      - "docs/reference/rulesets.md"
    severity: warn
    note: "Nome de job ou gatilho novo muda a lista de checks required."

  - id: adr-trigger
    watch:
      - "docker/**"
      - "deploy/k8s/**"
      - "apps/engine/mix.exs"
      - "package.json"
      - ".github/workflows/**"
    requires_adr: true
    severity: warn
    note: "Mudança estrutural? Provavelmente merece um ADR."

  # O CLAUDE.md é o único documento lido em TODA sessão — desatualizado ele não
  # fica neutro, ele ensina errado. Até aqui tinha ZERO cobertura: nenhuma regra
  # o observava, e ele só era atualizado quando alguém lembrava.
  #
  # `warn` e não `block` de propósito: o CLAUDE.md não mora sob `docs/`, e é lá
  # que o `generate.mjs --check` valida glob morto, gerado fora de dia e link
  # quebrado. Uma regra `block` que o checker não sabe verificar vira regra que
  # se burla com a label `docs-not-needed` — pior que `warn` honesto, porque
  # ensina a ignorar o vermelho.
  #
  # O watch são os gatilhos que HISTORICAMENTE o desatualizam: dependência nova
  # (Stack), ADR novo (Convenções e proibições) e gate novo.
  # Onda 6a (i18n): `docs/` na raiz virou a árvore em INGLÊS (fonte), e o
  # snapshot pt-BR foi preservado em
  # `website/i18n/pt-BR/docusaurus-plugin-content-docs/current/` no momento da
  # migração. Ninguém garante que a tradução acompanha toda mudança de prosa
  # depois disso — `warn`, não `block`, MESMO padrão não-bloqueante que a
  # regra `governanca` acima usa: traduzir tudo de uma vez não significa que
  # toda PR futura tenha que manter as duas árvores sincronizadas sob pena de
  # vermelho no CI. `docs/reference/**` fica de fora do watch de propósito —
  # é gerado (`pnpm docs:generate`) e nunca entrou na tradução (RN pendente:
  # localizar o gerador é gap maior, fora desta entrega).
  - id: traducao-pt-br
    watch:
      - "docs/*.md"
      - "docs/adr/**"
      - "docs/explanation/**"
      - "docs/missions/**"
    docs:
      - "website/i18n/pt-BR/docusaurus-plugin-content-docs/current/"
    severity: warn
    note: "docs/ (inglês, fonte) mudou — confira se a tradução pt-BR em website/i18n/pt-BR/... precisa acompanhar."

  - id: claude-md
    watch:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "apps/*/package.json"
      - "apps/engine/mix.exs"
      - "docs/adr/*.md"
      - "docs/gates.yml"
    docs: ["CLAUDE.md"]
    severity: warn
    note: "Stack, Convenções, 'O que NÃO fazer' e o estado das fases envelhecem em silêncio."
