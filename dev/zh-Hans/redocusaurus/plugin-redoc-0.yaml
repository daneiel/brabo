  /internal/sessions/{sessionId}/module-contracts:
    post:
      description: >-
        制品就是 `artifact.module_contracts` 事件：不可变、带版本、有作者，与 `artifact.module_map`
        并列。每次调用携带完整列表并替换上一版本。模块消费什么不在这里写：那是当前 module_map 的 `dependsOn`。
      operationId: InternalSessionsController_moduleContracts
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
