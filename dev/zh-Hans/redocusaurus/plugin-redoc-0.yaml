  /projects/{projectId}/spend/me:
    get:
      description: >-
        面向成员的视图。只有调用方自己的记录——参与者来自已认证的令牌，没有可替换它的参数。以 token
        和估算成本呈现，不按提供商或凭据细分：运行的密钥属于所有者（RN-058），其账单也属于所有者（RN-060）。提供商维度在所有者的报告中才存在（ADR
        0076），从这里仍不可达——此路由没有维度参数，仓储类型也拒绝这种组合（RN-187）。代理不计入：`token_usage`
