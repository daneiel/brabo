          type: string
          format: date-time
        statusChangedAt:
          type: string
          format: date-time
        observado:
          nullable: true
          description: >-
            Docker 守护进程此刻报告的内容，经由 broker 查询（ADR
            0130）——绝不与上面那些登记的字段合并。从外部被杀掉的容器会显示为登记 `running`、观测
            `exited`，这正是要点所在。`null` 表示“没有容器”或“我无法查看”——读取 `naoObservado` 来区分两者。
          type: object
          allOf:
            - $ref: '#/components/schemas/ObservacaoDeContainerResponseDto'
        naoObservado:
          type: string
          enum:
            - broker-nao-configurado
