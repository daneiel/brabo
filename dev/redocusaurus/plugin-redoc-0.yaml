        '404':
          description: Projeto não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista TODOS os Personal Access Tokens do projeto, de qualquer usuário
      tags:
        - projetos
  /projects/{projectId}/proficiency:
    get:
      description: >-
        O PRÓPRIO perfil do usuário por padrão; a visão agregada do time só para
