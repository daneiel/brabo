        никогда не расходятся для одного и того же факта. Закрывает
        `docs/fluxo.yml` (роль `po`, вход `metricas-de-produto`, ранее `status:
        lacuna`) (RN-407).
      operationId: InternalProjectsController_productMetrics
      parameters:
        - name: projectId
          required: true
