name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # PR de promoção (dev→qa, qa→main) é aberto pelo `github-actions[bot]` e
    # NÃO é revisado, por dois motivos independentes:
    #
    # 1. O action se recusa a rodar com ator não-humano ("Workflow initiated by
    #    non-human actor"). Sem este `if`, o check falha em TODA promoção — foi
    #    o que aconteceu nos PRs #64 e #65 do ciclo v0.3.1.
    # 2. Mesmo que rodasse, seria revisão repetida: a promoção só carrega
    #    commits que já passaram por um PR para `dev`, onde este mesmo workflow
    #    já revisou. Revisar de novo em cada degrau é a mesma diff três vezes.
    #
    # Pular é seguro porque `claude-review` NÃO é check required
    # (docs/reference/rulesets.md, "Checks obrigatórios") — job pulado aqui não
    # deixa PR de promoção pendente para sempre.
    if: github.event.pull_request.user.login != 'github-actions[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # O plugin code-review (anthropics/claude-code-plugins) só declara
          # Bash(gh ...) no seu allowed-tools próprio. Na prática os agentes de
          # revisão (passo 4 do comando) tentam ler histórico/autoria do
          # checkout local com `git log`/`git blame`/`git show`, e como nada
          # liberava esses comandos, a PR #250 sofreu 44 negações de permissão
          # e a sessão terminou sem nenhum comentário em prosa (fallback
          # mecânico "Ran N shell commands."). claude_args é aditivo ao
          # allowed-tools do plugin, não substitui.
          claude_args: |
            --allowedTools "Bash(git log:*),Bash(git blame:*),Bash(git show:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

