  /projects/{projectId}/mirror-state:
    get:
      description: >-
        本地代理在把工作复制到用户文件夹后通过通道推送的遥测（ADR 0147，第 7 点）——绝不进入事件日志，因为一轮镜像没有会话，而
        `session_events.session_id` 是 `NOT NULL`（与把 `rag_searches`
        做成表的理由相同）。三种答案绝不合并为一（RN-088）：`never`（从未报告过任何一轮）、`synced`（最近一轮已复制——`filesCopied`
        可能为 `0`，表示“看过了，没有需要复制的”）和
        `failed`。失败绝不会抹去最近一次成功的同步，成功也绝不会抹去最近一次错误：哪个是当前状态由比较两个时间戳得出，因此界面可以说“从今天开始失败，最近一次成功复制是昨天，共
        412 个文件”。`lastDestination` 是冻结的——在有人修改目标后它会与 `mirrorPath` 不同，因为授权随 join
        传递，只在 runner 重连时才会改变（RN-516）。`viewer`，与读取项目的最低要求相同，项目本身已携带 `mirrorPath`。
      operationId: ProjectsController_mirrorStateRoute
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMirrorStateResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 项目不存在或对调用方不可见。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 最近一轮镜像做了什么（RN-517）
      tags:
        - projects
