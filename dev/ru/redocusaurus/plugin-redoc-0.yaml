            `~`): цена каталога — витринная, а счёт идёт от того upstream,
            который обслужил вызов. Курация отказывается его АКТИВИРОВАТЬ (422
            `alias_de_roteamento_livre`); активированный до этого правила
            остаётся активным, помеченный этим флагом, а после деактивации
            вернуться не может. Выводится из провайдера и имени при чтении,
            никогда не хранится.
