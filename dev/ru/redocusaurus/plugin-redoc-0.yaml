openapi: 3.0.0
paths:
  /.well-known/jwks.json:
    get:
      description: Один ключ в обычном режиме; два — во время ротации AUTH_JWT_SECRET.
      operationId: JwksController_jwks
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponseDto'
      summary: Публичные ключи проверки access-токена
      tags:
        - auth
  /auth/login:
    post:
      description: >-
        Несуществующий email, неверный пароль и заблокированная учётная запись
        возвращают ровно один и тот же ответ 401 — то же тело, тот же статус.
      operationId: AuthController_login_
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Неверные учётные данные.
        '403':
          description: Email ещё не подтверждён.
      summary: Аутентифицирует и выдаёт пару access + refresh
      tags:
        - auth
  /auth/logout:
    post:
      description: >-
        Всегда 204, даже для неизвестного токена — ответ 401 здесь стал бы
        оракулом валидности токена.
      operationId: AuthController_logout_
      parameters: []
      responses:
        '204':
          description: Сессия завершена. Cookie сессии очищены.
      summary: Отзывает семейство предъявленного refresh
      tags:
        - auth
  /auth/oauth/{provider}/callback:
    get:
      description: >-
        Успех ведёт на `WEB_ORIGIN/` с уже установленными cookie сессии; неудача
        — на `WEB_ORIGIN/login?oauth_error=1`, без указания причины.
      operationId: AuthController_oauthCallback
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - github
              - gitlab
            type: string
        - name: code
          required: true
          in: query
          schema:
            type: string
        - name: state
          required: true
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Перенаправляет в веб-приложение.
          headers:
            Location:
              description: Адрес назначения в веб-приложении.
              schema:
                type: string
                example: http://localhost:5173/
      summary: Принимает OAuth-callback социального входа
      tags:
        - auth
  /auth/oauth/{provider}/start:
    get:
      description: >-
        `state` подписывается HMAC со СВОИМ назначением — никогда не с
        назначением потока подключения git к проекту (см. ADR 0084).
      operationId: AuthController_oauthStart
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - github
              - gitlab
            type: string
      responses:
        '302':
          description: Перенаправляет к провайдеру.
          headers:
            Location:
              description: URL авторизации провайдера.
              schema:
                type: string
                example: https://github.com/login/oauth/authorize?…
        '400':
          description: Провайдер вне `github`/`gitlab`.
      summary: Перенаправляет к OAuth-провайдеру для социального входа
      tags:
        - auth
  /auth/refresh:
    post:
      description: >-
        Предъявленный refresh расходуется. Повторное предъявление уже
        ротированного токена отзывает ВСЁ семейство и записывает событие
        безопасности — даже если причиной была двойная отправка клиентом.
      operationId: AuthController_refresh_
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoResponseDto'
        '401':
          description: Refresh недействителен, истёк или уже использован.
      summary: Ротирует refresh и выдаёт новую пару
      tags:
        - auth
  /auth/register:
    post:
      description: >-
        Отвечает 202 и для нового адреса, и для уже зарегистрированного — ответ
        не раскрывает, существует ли учётная запись. Во втором случае ничего не
        создаётся, а владелец адреса получает уведомление.
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AceiteResponseDto'
        '400':
          description: Пароль не соответствует минимальной политике.
        '403':
          description: Регистрация закрыта (AUTH_REGISTRATION_ENABLED=false).
      summary: Создаёт учётную запись и отправляет письмо для подтверждения
      tags:
        - auth
  /auth/request-password-reset:
    post:
      description: >-
        Отвечает 202 и для известного, и для неизвестного адреса. Это также путь
        для тех, кто был импортирован из Keycloak и ещё не задал пароль.
      operationId: AuthController_requestPasswordReset
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordResetDto'
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AceiteResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
      summary: Запрашивает ссылку для сброса пароля
      tags:
        - auth
  /auth/reset-password:
    post:
      description: >-
        Отзывает ВСЕ сессии пользователя. Не выдаёт токены: тот, кто сбрасывает
        пароль, отправляется на вход, чтобы компрометация email не означала
        захват учётной записи за один шаг.
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '204':
          description: >-
            Пароль установлен. ВСЕ активные сессии пользователя отзываются
            вместе с этим.
        '400':
          description: Ссылка недействительна/истекла или пароль не соответствует политике.
      summary: Устанавливает новый пароль по токену
      tags:
        - auth
  /auth/verify-email:
    post:
      operationId: AuthController_verifyEmail
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailDto'
      responses:
        '204':
          description: Email подтверждён; вход уже работает.
        '400':
          description: >-
            Ссылка недействительна, истекла или уже использована — во всех трёх
            случаях один и тот же ответ.
      summary: Подтверждает email одноразовым токеном
      tags:
        - auth
  /gates:
    get:
      description: >-
        Декларативный индекс gate потока (ADR 0054). Экран берёт отсюда, какие
        шаги существуют и кто оценивает каждый, вместо того чтобы повторять
        список в коде — именно так он раньше незаметно устаревал.
      operationId: GatesController_listar
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatesResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Реестр активных gate
      tags:
        - gates
  /git/oauth/{provider}/callback:
    get:
      description: >-
        Публичный, потому что приходит БРАУЗЕР пользователя от провайдера, без
        сессии api. Это не значит без ограничений: `state` проверяется HMAC, и
        без валидного вызов отклоняется. Никогда не отвечает JSON — всегда
        перенаправляет, потому что сырое тело ошибки при навигации в браузере
        было бы ужасным опытом.
      operationId: GitController_callback
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - github
              - gitlab
            type: string
        - name: code
          required: true
          in: query
          schema:
            type: string
        - name: state
          required: true
          in: query
          schema:
            type: string
      responses:
        '302':
          description: >-
            Успех ведёт на `WEB_ORIGIN/projects/:id?git=connected`; неудача — на
            `WEB_ORIGIN/git-error`. Ошибка НЕ раскрывает причину в URL.
          headers:
            Location:
              description: Адрес назначения в веб-приложении.
              schema:
                type: string
                example: http://localhost:5173/projects/01JC…?git=connected
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
      summary: Принимает возврат OAuth и перенаправляет в веб-приложение
      tags:
        - git
  /health:
    get:
      description: >-
        Выполняет `select 1`. Сообщает только, отвечает ли база данных; ни
        топологии, ни версии. Публичный, потому что вызывающий — kubelet, у
        которого нет токена.
      operationId: HealthController_check
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponseDto'
        '503':
          description: База данных не ответила. Тело содержит сообщение в `details`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponseDto'
      summary: Readiness — процесс действительно может обслуживать трафик
      tags:
        - infrastructure
  /internal/first-account:
    post:
      description: >-
        Для установщика в одну строку, который работает там, где почтовый
        транспорт не настроен: сгенерированный `.env` не содержит почтовых
        переменных, `MAIL_TRANSPORT` падает в `log`, и обычная регистрация ждёт
        письма, которое никогда не придёт. Учётная запись рождается
        подтверждённой, потому что тот, кто запускает установщик, уже доказал
        нечто БОЛЕЕ СИЛЬНОЕ, чем контроль над почтовым ящиком, — он контролирует
        машину, `.env` и демон Docker. Обычная регистрация не затрагивается.
        Отклоняет с 409, если в установке есть ЛЮБОЙ пользователь: условие
        касается установки, а не этого email, поэтому восстановление при
        миграции глушит шаг той же проверкой. Пароль здесь никогда не
        генерируется и нигде не хранится, кроме как в виде хеша argon2id; личное
        рабочее пространство (RN-410) рождается в той же транзакции.
      operationId: InternalFirstAccountController_criar
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirstAccountInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirstAccountInternalResponseDto'
        '400':
          description: >-
            Некорректный email или пароль, отклонённый политикой ДОМЕНА, — тот
            же код, что вызывает регистрация, никогда не второе правило.
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '409':
          description: В установке уже есть пользователь. Ничего не создано.
      security:
        - service-token: []
      summary: Создаёт ПЕРВУЮ учётную запись установки, уже подтверждённую
      tags:
        - internal
  /internal/gates:
    get:
      description: >-
        Реестр ОПИСЫВАЕТ, а не исполняет: ни один gate не становится
        обязательным из-за него, и изменение поля здесь не меняет никакого
        поведения. Каждый gate говорит, где находится доказательство его
        прохождения (`evidencia`), потому что не каждое доказательство есть в
        журнале событий.
      operationId: InternalGatesController_ler
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateRegistryResponseDto'
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
      security:
        - service-token: []
      summary: Читает декларативный реестр gate
      tags:
        - internal
  /internal/graph/prompt-templates:
    post:
      description: >-
        Если для того же `name` уже существует версия с ТЕМ ЖЕ хешем, новая
        версия не создаётся — возвращается существующая (попадание
        идемпотентности не меняет HTTP-статус: всегда 201, для простоты — тело
        идентично тому, что было бы создано).
      operationId: InternalGraphController_upsert
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPromptTemplateInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '503':
          description: >-
            Neo4j не настроен или недоступен — никакой запасной вариант для
            чтения/записи шаблона невозможен.
      security:
        - service-token: []
      summary: Публикует версию шаблона промпта, идемпотентно по хешу
      tags:
        - internal
  /internal/graph/prompt-templates/{name}:
    get:
      description: >-
        Конкретная `version` ищется по равенству; если опущена, ищется самая
        свежая версия `active`. 404, если шаблон (или запрошенная версия) не
        существует.
      operationId: InternalGraphController_getByName
      parameters:
        - name: name
          required: true
          in: path
          schema:
            type: string
        - name: version
          required: false
          in: query
          schema:
            example: '3'
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateReadResponseDto'
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '404':
          description: Шаблон не существует или не имеет запрошенной версии.
        '503':
          description: >-
            Neo4j не настроен или недоступен — никакой запасной вариант для
            чтения/записи шаблона невозможен.
      security:
        - service-token: []
      summary: Ищет шаблон промпта по имени
      tags:
        - internal
  /internal/machine-device-keys:
    post:
      description: >-
        Для установщика в одну строку, сразу после создания первой учётной
        записи: локальному агенту нужны учётные данные, а единственные
        существовавшие были привязаны к ПРОЕКТУ — в установке, где проектов ещё
        нет. Пара генерируется НА МАШИНЕ, и сюда приходит только публичная
        половина; запишите возвращённый `id` в приватный JWK как `kid` (RN-475)
        — это единственная связь между файлом на диске и публичной половиной на
        сервере. `userId` в теле НЕТ НАМЕРЕННО: владелец — ЕДИНСТВЕННЫЙ
        пользователь установки, определяемый api, поэтому владение сервисным
        токеном никогда не означает выбор, чьи учётные данные выпустить.
        Регистрация ЗАМЕНЯЕТ: активные машинные ключи владельца отзываются в той
        же транзакции, так что переустановленная машина работает, а тысяча
        машинных ключей существовать не может. Ключи проекта (ADR 0118) никогда
        не затрагиваются.
      operationId: InternalMachineDeviceKeysController_registrarChave
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachineDeviceKeyInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineDeviceKeyInternalResponseDto'
        '400':
          description: >-
            JWK не является ПУБЛИЧНЫМ ключом Ed25519 — некорректный JSON,
            неверный `kty`/`crv`, отсутствует `x` или присутствует `d` (это
            приватная половина, и она отклоняется по имени, а не сохраняется).
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '409':
          description: >-
            В установке нет пользователя или их больше одного. Ничего не
            записано. Этот маршрут относится к моменту установки и навсегда
            замолкает, когда у установки появляется команда.
      security:
        - service-token: []
      summary: Регистрирует МАШИННЫЙ ключ устройства новой установки
      tags:
        - internal
  /internal/models/sync:
    post:
      description: >-
        Никогда не падает из-за одного провайдера: каждый отвечает за себя в
        отчёте, с причиной пропуска и источником сбоя, если он был. Провайдер,
        который не ответил, ПРОПУСКАЕТСЯ, а не помечается недоступным.
      operationId: InternalModelsController_sync
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncModelCatalogResponseDto'
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
      security:
        - service-token: []
      summary: Синхронизирует каталог моделей по всем провайдерам
      tags:
        - internal
  /internal/projects/{projectId}/backlog:
    get:
      description: >-
        ТО ЖЕ дерево эпик → история → задача, что и во вкладке Backlog, через
        тот же сценарий использования (три чтения на проект, никогда N+1).
        Именно с ним PO видит эпик без историй и историю без задач, вместо того
        чтобы заново создавать уже существующее (RN-164).
      operationId: InternalProjectsController_backlog
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EpicComHistoriasResponseDto'
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
      security:
        - service-token: []
      summary: Backlog проекта в виде дерева, чтобы PO читал уже написанное
      tags:
        - internal
  /internal/projects/{projectId}/business-rules:
    get:
      description: >-
        Все `artifact.business_rule` из сессий проекта — не только текущей
        сессии, что было потолком контекста kickoff у PO, — с полным
        `description` и тем, какие истории уже ссылаются на каждое правило.
        `uncoveredCount` — это незакрытое: правило, которое не покрывает ни одна
        история (RN-164). Проект совсем без правил отвечает `200` с пустым
        списком: «ни одного правила ещё не собрано» — не ошибка.
      operationId: InternalProjectsController_businessRules
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBusinessRulesResponseDto'
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
      security:
        - service-token: []
      summary: Бизнес-правила проекта с покрытием, для чтения PO
      tags:
        - internal
  /internal/projects/{projectId}/container-exec:
    post:
      description: >-
        Вызывается только engine, когда `Engine.Actions.TerminalExecutor` решил,
        что команда должна выполняться внутри настоящего контейнера
        (`execution_mode: container` с ЗАРЕГИСТРИРОВАННОЙ строкой `running`).
        Проксирует в `ContainerBrokerPort.exec` (ADR 0130/0134) — последняя из
        пяти операций broker, получившая реального вызывающего. `sucesso: false`
        в ответе — никогда не выброшенная ошибка — это НОРМАЛЬНАЯ форма для
        отказавшего или недоступного broker: контейнер мог умереть или быть
        удалён извне между зарегистрированной строкой `running` и этим вызовом
        (RN-486, зарегистрированное и наблюдаемое никогда не сливаются), и это
        сбой команды, а не ошибка транспорта.
      operationId: InternalProjectsController_containerExec
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerExecInternalDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerExecInternalResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
      security:
        - service-token: []
      summary: >-
        Выполняет команду терминала ВНУТРИ настоящего контейнера проекта
        (RN-492)
      tags:
        - internal
  /internal/projects/{projectId}/container-spec:
    get:
      description: >-
        Идентичность проекта, режим выполнения и текущее решение Архитектора об
        образе. Broker перепроверяет всё это, прежде чем что-либо передать
        демону, — читать отсюда не то же самое, что доверять, и отказ называет
        поле. АБСОЛЮТНЫЙ путь не возвращается: источник bind разрешается демоном
        относительно файловой системы ХОСТА, и путь изнутри контейнера api молча
        смонтировал бы пустую папку. Передаётся `localizacao` (RN-503) — какой
        из двух корней broker использовать плюс относительный сегмент, который
        этот корень не покрывает.
      operationId: InternalContainersController_containerSpec
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerSpecInternalResponseDto'
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '404':
          description: Проект не найден.
      security:
        - service-token: []
      summary: Что нужно broker, чтобы самому составить спецификацию контейнера
      tags:
        - internal
  /internal/projects/{projectId}/git-remote:
    get:
      description: >-
        Возвращает чистый origin (без встроенных учётных данных) и, для
        удалённого провайдера, токен ВЛАДЕЛЬЦА рабочего пространства (RN-058),
        расшифрованный на лету. Потребитель внедряет токен при каждом вызове и
        НИКОГДА не записывает его в файл — `.git/config` находится внутри папки,
        где RN-075 даёт dev agent автоматически одобренный доступ на чтение.
      operationId: InternalProjectsController_gitRemote
      parameters:
        - name: projectId
          required: true
          in: path
