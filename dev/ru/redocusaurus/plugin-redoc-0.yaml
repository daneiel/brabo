    ChatSseEventResponseDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - delta
            - done
            - error
            - metering_failed
          example: delta
          description: >-
            `delta` несёт инкрементальный `text`; `done` закрывает поток с
            учётом токенов/стоимости; `error` прерывает; `metering_failed`
            означает, что ОТВЕТ ушёл, но стоимость не была учтена, — кадр
            существует, чтобы этот сбой не остался незамеченным.
        text:
          type: string
          example: I will open the epic
          description: Только в `delta`.
        inputTokens:
          type: number
          example: 1820
          description: Только в `done`.
        outputTokens:
          type: number
          example: 340
          description: Только в `done`.
        costMicros:
          type: number
          example: 52700
          description: Только в `done`, микро-USD.
        estimated:
          type: boolean
          example: false
          description: >-
            Только в `done`. `true`, когда провайдер не вернул счётчик и
            стоимость была ОЦЕНЕНА, — число стоит меньше, и интерфейс должен
            уметь об этом сказать.
        message:
          type: string
          example: session budget exhausted
          description: Только в `error` и `metering_failed`.
      required:
        - type
    CicloDeVidaDoContainerResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - provisioning
            - running
            - stopped
            - failed
            - removed
          example: provisioning
          description: >-
            То, что было ЗАПИСАНО, а не то, что подтверждает демон Docker, —
            сегодня ни один реальный оркестратор не переводит эту таблицу
            (RN-243).
        imageVersion:
          type: number
          example: 1
          description: >-
            Версия `artifact.project_image`, ЗАМОРОЖЕННАЯ при первом переходе
            (RN-245), — не применяется заново при каждом чтении.
        resources:
          description: >-
            Лимит, ОБЪЯВЛЕННЫЙ при создании, — не применяется принудительно
            (RN-248).
          allOf:
            - $ref: '#/components/schemas/RecursosDoContainerResponseDto'
        failureReason:
          type: object
          nullable: true
          example: null
          description: Заполняется только при переходе в `failed`.
        createdAt:
          type: string
          format: date-time
        statusChangedAt:
          type: string
          format: date-time
        observado:
          nullable: true
          description: >-
            То, что демон Docker сообщает ПРЯМО СЕЙЧАС, по запросу через broker
            (ADR 0130), — никогда не сливается с полями выше, которые являются
            ЗАПИСАННЫМ. Контейнер, убитый извне, отображается как записанный
            `running` и наблюдаемый `exited`, и в этом весь смысл. `null`
            означает либо «контейнера нет», либо «не удалось посмотреть» —
            читайте `naoObservado`, чтобы их различить.
          type: object
          allOf:
            - $ref: '#/components/schemas/ObservacaoDeContainerResponseDto'
        naoObservado:
          type: string
          enum:
            - broker-nao-configurado
            - broker-sem-resposta
            - broker-recusou
            - null
          nullable: true
          example: broker-nao-configurado
          description: >-
            `null`, когда наблюдение действительно СОСТОЯЛОСЬ, — в том числе
            когда оно вернулось пустым, что является положительным утверждением
            «я посмотрел, и контейнера нет». Заполняется, когда посмотреть не
            удалось, с указанием причины. Наследовать здесь записанное состояние
            — именно то, что запрещает RN-468.
        detalheDaObservacao:
          type: object
          nullable: true
          example: null
          description: Собственное сообщение broker, если оно было.
      required:
        - status
        - imageVersion
        - resources
        - failureReason
        - createdAt
        - statusChangedAt
        - observado
        - naoObservado
        - detalheDaObservacao
