        - anamnesis
  /projects/{projectId}/proficiency/me/opt-in:
    post:
      description: >-
        Desfaz o opt-out. Os perfis voltam a ser derivados a partir da próxima
        rodada.
      operationId: AnamneseController_optInMine
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilOptInResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, evento ou versão não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Reativa a perfilagem do próprio usuário
      tags:
        - anamnesis
  /projects/{projectId}/psychologist/analyses:
    get:
      description: >-
        `costMicros` é somado do `token_usage` da rodada. É isso que torna
        VISÍVEL a diferença de custo entre triagem leve e pesada, em vez de só
        afirmada — as duas faixas usam modelos de fato diferentes.
      operationId: PsychologistController_analyses
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PsychologistAnalysisResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou hipótese não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista as rodadas de análise com faixa e custo real
      tags:
        - psychologist
  /projects/{projectId}/psychologist/status:
    get:
      description: >-
        Somente leitura — não tem efeito colateral. `enabled: false` quer dizer
        que a pausa é decisão de PRODUTO (não bug): análises e hipóteses
        existentes não são tocadas por ela.
      operationId: PsychologistController_status
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PsychologistStatusResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou hipótese não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Informa se o Psicólogo pode rodar uma análise NOVA hoje
      tags:
        - psychologist
  /projects/{projectId}/rag/coverage:
    get:
      description: >-
        Contagem real (nunca estimada) de arquivos `.md` sob `docs`/`docs/adr`
        no repositório do projeto contra quantos têm chunk, e das sessões do
        projeto contra quantas têm chunk. Não inclui "há N minutos" para esses
        três escopos — não há coluna de carimbo de indexação por escopo, e um
        número chutado mentiria (mesma régua do ADR 0042 para nota de modelo).
        `local` (RN-455) é a única exceção: `lastAttachedAt` é um
        `MAX(created_at)` real sobre aquele escopo, porque upload pelo navegador
        não tem estado de repositório contra o qual comparar.
      operationId: RagController_obterCobertura
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagCoverageResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: 'Cobertura do índice: arquivos/sessões indexados contra o total real'
      tags:
        - rag
  /projects/{projectId}/rag/feedback:
    post:
      description: >-
        O único sinal de VERDADE que a medição do RAG tem: latência e taxa de
        degradação dizem se a busca RODOU, nunca se ACERTOU. Mesmo papel de
        `search` — quem pode ler o resultado é quem pode julgá-lo. Votar de novo
        no mesmo chunk da mesma busca sobrescreve o próprio voto em vez de somar
        um segundo (único por ator), para a métrica medir acerto e não
        entusiasmo.
      operationId: RagController_votar
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagFeedbackRequestDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagFeedbackResponseDto'
        '400':
          description: >-
            `searchId` desconhecido para este projeto, ou um `chunkId` que não
            estava entre os acertos daquela busca — voto sem posição seria
            número sem significado.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Julga um acerto de uma busca como útil ou irrelevante (RN-480)
      tags:
        - rag
  /projects/{projectId}/rag/local:
    post:
      description: >-
        Conteúdo de texto já lido pelo navegador (`<input webkitdirectory>`),
        nunca um caminho do host — essa distinção é todo o ponto do ADR 0113.
        Reconstrução completa e idempotente do escopo `local`: toda chamada o
        apaga e recria a partir dos arquivos enviados DESTA vez, então reenviar
        é o mecanismo de ressincronização. Recusa (400) acima dos tetos de
        quantidade de arquivos/bytes totais em vez de cortar em silêncio — é um
        gesto único do usuário com um seletor de pasta à frente, não uma
        varredura em segundo plano. Arquivo individual grande demais ou de
        extensão não reconhecida é só pulado, nunca reprova o lote.
      operationId: RagController_anexarPastaLocal
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachLocalFolderRequestDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachLocalFolderResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: >-
        Anexa uma pasta local (upload pelo navegador) como referência somente
        leitura (RN-455, ADR 0113)
      tags:
        - rag
  /projects/{projectId}/rag/reindex:
    post:
      description: >-
        "Reindexar agora" do painel de RAG do Chat. Apaga e recria os chunks dos
        três escopos honestos (RN-219) a partir do estado CORRENTE — não há
        watcher automático em push/fechamento de sessão (decisão registrada nos
        ADRs 0079/0080). Pode demorar em projetos com muitas sessões: roda uma
        passada de indexação por sessão, cada uma possivelmente chamando o
        provider de embedding em lote.
      operationId: RagController_reindexar
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexProjectResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: >-
        Reindexa docs/ADRs/sessões do projeto (reconstrução completa
        idempotente)
      tags:
        - rag
  /projects/{projectId}/rag/search:
    post:
      description: >-
        Combina similaridade de cosseno (pgvector) com `ts_rank` léxico
        (tsvector), cada um de uma consulta independente, mesclados por soma
        ponderada e cortados pelo limiar (ADR 0080). `vectorAvailable: false`
        avisa quando o provider de embedding não respondeu e a busca rodou só
        com o sinal léxico — nunca finge ter rodado o híbrido completo.
      operationId: RagController_buscar
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HybridSearchRequestDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HybridSearchResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Busca híbrida (vetorial + léxica) sobre os chunks indexados do projeto
      tags:
        - rag
  /projects/{projectId}/run-instructions:
    get:
      description: >-
        RN-852 (ADR 0213): o `artifact.run_instructions` vigente, emitido quando
        um `open_infra_pr` com `run` executa. DECLARADO pelo agente de Infra,
        nunca verificado na máquina de quem lê. `null` quando não há.
      operationId: BacklogController_runInstructions
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInstructionsResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Devolve como rodar o entregável na sua máquina
      tags:
        - backlog
  /projects/{projectId}/runner-device-keys:
    get:
      description: >-
        Ninguém revoga o que não consegue ver (RN-519). Inclui as já REVOGADAS —
        sumir com a linha faria a tela afirmar que a chave nunca existiu. Nunca
        devolve a JWK pública, e a privada a api nunca viu. `lastUsedAt` nulo é
        o sinal de uma chave ÓRFÃ: registrada e nunca usada por runner nenhum.
        Desde a RN-543 inclui também as chaves de MÁQUINA do chamador (`especie:
        "maquina"`, `projectId` nulo), que servem este projeto sem pertencer a
        ele — sem elas na lista, uma chave de máquina seria invisível em toda
        tela.
      operationId: RunnerDeviceKeysController_listDeviceKeys
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunnerDeviceKeyListResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista as próprias chaves de dispositivo deste projeto
      tags:
        - projetos
  /projects/{projectId}/runner-device-keys/{deviceKeyId}:
    delete:
      description: >-
        Idempotente — revogar de novo não é erro. Desde a RN-520 também DERRUBA
        a conexão viva: antes, revogar só impedia ticket NOVO, e um runner já
        conectado seguia executando comando aprovado. Desde a RN-685 (ADR 0201)
        o alvo é a CHAVE: caem só as conexões abertas com ela — em todo projeto,
        se for de máquina —, e outro runner do mesmo usuário, conectado com PAT
        ou com outra chave, fica de pé. Os tickets dela ainda não usados são
        anulados. Engine fora do ar ou nenhum runner conectado NÃO fazem a
        revogação falhar.
      operationId: RunnerDeviceKeysController_revokeDeviceKey
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: deviceKeyId
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Chave revogada. Sem corpo.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Revoga uma chave de dispositivo própria
      tags:
        - projetos
  /projects/{projectId}/runner-ticket:
    post:
      description: >-
        Autentica `connect/3` do socket Phoenix `/runner` (tópico
        `terminal:<projectId>`, papel "runner") — NÃO é o JWT reaproveitado, e
        esta rota em si só aceita um Personal Access Token no lugar do JWT de
        sessão (ADR 0105). TTL de 30s e uso único. Recusa com 400 se o projeto
        não estiver no modo "runner" (RN-421): o runner não tem o que servir num
        projeto cujo código mora no container gerenciado.
      operationId: RunnerTicketsController_runnerTicket
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerTicketResponseDto'
        '400':
          description: Projeto não está no modo "runner".
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Emite um ticket de uso único para o runner local conectar
      tags:
        - projetos
  /projects/{projectId}/sessions:
    get:
      description: >-
        Cada item traz `technical`: `true` só para a sessão aberta pelo
        provisionamento do repositório (ligada por `repo_bootstraps`).
      operationId: SessionsController_list
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionListItemResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto ou sessão não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista as sessões do projeto
      tags:
        - sessions
    post:
      description: >-
        A sessão nasce em `created` e é o contêiner de tudo o que os agentes
        fazem: o event log, as ações propostas e o orçamento de tokens ficam
        pendurados nela. `kind` é OBRIGATÓRIO e fica gravado: `consultiva` só
        conversa, `criativa` produz e é a única que aceita
        `execution.activated`.
      operationId: SessionsController_create
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '400':
          description: Corpo sem `kind`, ou com valor fora da lista permitida.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto ou sessão não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Abre uma sessão no projeto
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}:
    get:
      operationId: SessionsController_get
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto ou sessão não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Devolve uma sessão pelo id
      tags:
        - sessions
    patch:
      description: >-
        O nome é rótulo de navegação e NÃO substitui a hashtag do id — as telas
        compõem os dois, e sem nome degradam para só a hashtag. `null` ou texto
        em branco limpa o nome. Não há como mudar o `kind`: é a intenção de
        criação, e mudá-lo depois o transformaria em estado.
      operationId: SessionsController_rename
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameSessionDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '400':
          description: Corpo sem `name`, ou nome acima do limite de caracteres.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto ou sessão não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Define ou limpa o nome amigável da sessão
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}/actions:
    get:
      description: >-
        Ordenadas por `seq`; use `nextCursor` como `afterSeq`. `latest=true`
        busca a CAUDA em vez disso (as `limit` ações mais novas, ainda em ordem
        crescente) e ignora `afterSeq`. `status=pending` mantém só as ações
        esperando decisão — com `latest`, as pendentes mais novas, para que uma
        sessão com mais de 200 ações não empurre uma pendente nova para fora da
        janela (RN-637).
      operationId: ActionsController_list
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: afterSeq
          required: false
          in: query
          schema:
            example: 6
            type: string
        - name: limit
          required: false
          in: query
          schema:
            example: 50
            type: string
        - name: latest
          required: false
          in: query
          description: Busca a cauda da sessão; ignora `afterSeq`.
          schema:
            example: 'true'
            type: string
        - name: status
          required: false
          in: query
          description: Só `pending` é suportado.
          schema:
            example: pending
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeAcoesResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou ação não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Pagina as ações propostas da sessão
      tags:
        - actions
    post:
      description: >-
        A ação é avaliada contra o `permissions.json` do projeto na criação. O
        `resolvedPolicy` da resposta diz o que a política decidiu:
        `auto_approve` já sai executável, `require_approval` espera decisão
        humana, e `deny` nasce recusada. Não há caminho que execute sem passar
        por aqui.
      operationId: ActionsController_propose
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeActionDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposedActionResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou ação não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Propõe uma ação com efeito externo
      tags:
        - actions
  /projects/{projectId}/sessions/{sessionId}/actions/{actionId}/approve:
    post:
      description: >-
        Vale só para esta ação. A decisão fica no event log com o id de quem
        decidiu.
      operationId: ActionsController_approve
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: actionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposedActionResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou ação não encontrado.
        '409':
          description: A ação já foi decidida ou executada.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Aprova a ação, uma vez
      tags:
        - actions
  /projects/{projectId}/sessions/{sessionId}/actions/{actionId}/approve_always:
    post:
      description: >-
        Além de liberar esta ação, acrescenta o padrão correspondente à lista
        `allow` do projeto — ações futuras que casem saem `auto_approved` sem
        perguntar. Padrão já em `deny` continua bloqueado. A aprovação e o
        padrão são gravados na mesma transação. Clicar numa ação já APROVADA é
        sucesso idempotente (`desfecho: ja_aprovada`), gravando o padrão só se
        ele faltar.
      operationId: ActionsController_approveAlways
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: actionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveAlwaysResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou ação não encontrado.
        '409':
          description: >-
            A ação já foi RECUSADA (`reason: acao_ja_recusada`); nenhum padrão é
            gravado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Aprova a ação e grava o padrão no permissions.json
      tags:
        - actions
  /projects/{projectId}/sessions/{sessionId}/actions/{actionId}/deny:
    post:
      description: O motivo, se dado, fica no event log junto com a decisão.
      operationId: ActionsController_deny
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: actionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DenyActionDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposedActionResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou ação não encontrado.
        '409':
          description: A ação já foi decidida ou executada.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Recusa a ação
      tags:
        - actions
  /projects/{projectId}/sessions/{sessionId}/agents/{agent}/cancel:
    post:
      description: >-
        O botão "Parar" do composer (RN-122): mata a chamada de LLM em voo no
        engine, cortando a conexão no meio do stream — economiza tokens de
        verdade, não só para de renderizar no cliente. Idempotente: sem turno em
        andamento, é aceito sem efeito.
      operationId: AgentsController_cancel
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: agent
          required: true
          in: path
          description: Slug do agente ativo.
          schema:
            example: po
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou handoff não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Cancela o turno em andamento do agente ativo
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/agents/{agent}/message:
    post:
      description: >-
        A resposta é só a confirmação, e volta no ACEITE — antes de o turno do
        agente terminar (ADR 0163). O que o agente responde chega pelo event log
        e pelo canal da sessão — não por esta chamada. Se o agente está no meio
        de um turno, a mensagem NÃO é recusada: entra na fila do agente
        (`entrega: "enfileirada"`) e é lida, com as outras enfileiradas, num
        turno só quando o atual terminar; pode ser cancelada enquanto espera
        (RN-673, ADR 0191).
      operationId: AgentsController_message
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: agent
          required: true
          in: path
          description: >-
            Slug do agente conversacional que lê a mensagem: criativo, po,
            arquiteto, dev-lead, ux-designer ou staff. Qualquer outro slug —
            infra inclusive — é recusado com 422; nunca é entregue a um agente
            padrão (RN-584).
          schema:
            example: po
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAgentMessageDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemAoAgenteResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou handoff não encontrado.
        '409':
          description: >-
            O agente não está ativo nesta sessão; ou está esperando decisão
            sobre o plano de execução; ou a fila dele já tem 10 mensagens
            (`fila_de_mensagens_cheia`) — a mensagem foi gravada mas NÃO lida
            pelo agente (ADR 0163, RN-673).
        '422':
          description: >-
            O agente não recebe mensagens de chat (o Infra Lead trabalha por
            proposta, e todo slug sem cláusula própria no engine é recusado pelo
            nome) — a mensagem foi gravada mas NENHUM agente a leu (RN-584).
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Envia uma mensagem ao agente ativo
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/agents/{agent}/messages/{messageId}/cancel:
    post:
      description: >-
        Mensagem enviada com o agente no meio de um turno espera numa fila e é
        lida quando o turno termina (RN-673). Enquanto espera, quem a ENVIOU
        pode cancelá-la: o engine a tira da fila e grava
        `chat.message_cancelled`; ela nunca é mostrada ao modelo. Mensagem de
        outra pessoa é 403.
      operationId: AgentsController_cancelQueued
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: agent
          required: true
          in: path
          description: Slug do agente em cuja fila está a mensagem.
          schema:
            example: po
            type: string
        - name: messageId
          required: true
          in: path
          description: >-
            Id do evento `chat.message` (o `mensagemId` que a rota de mensagem
            devolveu).
          schema:
            example: 01JC4Z0000EVENTO000000000001
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou handoff não encontrado.
        '409':
          description: >-
            A mensagem não está mais na fila — o agente já a leu, ou ela já foi
            cancelada; ou a sessão está encerrada (RN-581).
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Cancela uma mensagem que espera na fila do agente
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/agents/{agent}/start:
    post:
      description: >-
        Só o Criativo pode ser iniciado por comando direto. Todo outro agente
        exige um handoff ACEITO apontando para ele — a regra mora no domínio,
        não aqui, e tentar contorná-la devolve 409.
      operationId: AgentsController_start
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: agent
          required: true
          in: path
          description: Slug do agente.
          schema:
            example: criativo
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgenteAtivadoResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou handoff não encontrado.
        '409':
          description: Agente sem handoff aceito, ou já ativo na sessão.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Inicia um agente na sessão
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/agents/{agent}/structured-question/{questionSetId}/answer:
    post:
      description: >-
        Grava `chat.structured_question_answered` e reenvia as respostas ao
        agente como mensagem normal. Um conjunto de perguntas só pode ser
        respondido uma vez. Volta no ACEITE, antes de o turno do agente terminar
        (ADR 0163): o turno segue rodando no engine e a narração, o fim e as
        falhas dele chegam pelo canal da sessão e pelo event log
        (`agent.status`, `agent.response`, `agent.error`) — nunca por esta
        resposta.
      operationId: AgentsController_submitStructuredQuestionAnswer
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: agent
          required: true
          in: path
          description: Slug do agente que fez as perguntas (e vai ler a resposta).
          schema:
            example: criativo
            type: string
        - name: questionSetId
          required: true
          in: path
          description: Id do evento `chat.structured_question` respondido.
          schema:
            example: 01JC4Z0000EVENTO000000000001
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerStructuredQuestionDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou handoff não encontrado.
        '409':
          description: >-
            Este conjunto de perguntas já foi respondido; ou o agente ainda está
            no meio de um turno e não leu as respostas (ADR 0163).
        '422':
          description: >-
            O agente que perguntou não recebe mensagens de chat — as respostas
            foram gravadas mas NENHUM agente as leu (RN-584).
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Responde um conjunto de perguntas estruturadas do agente
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/agents/{agentId}/rearm:
    post:
      description: >-
        Zera o contador de tarefas bloqueadas consecutivas (RN-047) e devolve o
        agente a tentar reivindicar trabalho. É a única saída de `idle_tripped`
        — não há desbloqueio automático.
      operationId: ExecutionController_rearm
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: agentId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou tarefa não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Rearma um dev agent desarmado pelo circuit breaker
      tags:
        - execution
  /projects/{projectId}/sessions/{sessionId}/agents/arquiteto/handoff-infra:
    post:
      description: >-
        Endpoint dedicado em vez de reusar `readiness`, que é do Criativo: são
        dois marcos diferentes da sessão, e confundi-los tornaria o event log
        ambíguo. Volta no ACEITE, antes de o turno do agente terminar (ADR
        0163): o turno segue rodando no engine e a narração, o fim e as falhas
        dele chegam pelo canal da sessão e pelo event log (`agent.status`,
        `agent.response`, `agent.error`) — nunca por esta resposta. O handoff ao
        Dev Lead continua vindo DEPOIS do de Infra: o engine o segura até o
        turno de fechamento terminar. Idempotente (ADR 0182, RN-635): alvo que
        já tem oferta pendente ou está ativo no projeto não é disparado de novo,
        e com os dois assim nada é gravado.
      operationId: AgentsController_handoffInfra
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmacaoDeArquiteturaResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou handoff não encontrado.
        '409':
          description: >-
            O Arquiteto ainda está no meio de um turno — a confirmação foi
            gravada mas o turno de fechamento não começou (ADR 0163).
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Confirma que a arquitetura está pronta e oferece o handoff à Infra
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/agents/criativo/validate-necessity:
    post:
      description: >-
        Grava `necessity.validated`. Exige que o Criativo já tenha consolidado
        um `product_brief` nesta sessão (RN-406) — sem ele, é recusado: não há o
        que validar. Desde o ADR 0185 (RN-657) o clique "Estou pronto — a
        necessidade está validada" (`POST .../readiness`) grava ele mesmo este
        evento, e a web não chama mais esta rota; ela fica para sessões cujo
        clique de prontidão é anterior a esse ADR.
      operationId: AgentsController_validateNecessityHandoff
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou handoff não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Confirma que a necessidade de negócio do Criativo foi validada
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/budget:
    get:
      description: É isto que alimenta o medidor de tokens ao vivo da tela de sessão.
      operationId: BudgetsController_getSessionBudget
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto ou sessão não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lê o orçamento da sessão e o gasto acumulado
      tags:
        - llm
    put:
      description: Mesma conversão de dólar para micro-USD do orçamento do projeto.
      operationId: BudgetsController_setSessionBudget
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertBudgetDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto ou sessão não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Define o teto de gasto da sessão
      tags:
        - llm
  /projects/{projectId}/sessions/{sessionId}/chat:
    post:
      description: >-
        Server-Sent Events. Quadros `delta` levam o texto incremental e `done`
        fecha com a contabilidade de tokens e custo. Um quadro `metering_failed`
        quer dizer que a RESPOSTA saiu mas o custo não foi contabilizado — a
        falha aparece em vez de sumir. Se o orçamento estourar com
        `policy=block`, o stream leva `error` e nenhum `delta`. Esta rota NÃO
        leva agente: manda o texto sozinho ao modelo vinculado, sem histórico e
        sem prompt de sistema. Numa sessão `consultiva` onde nenhum agente foi
        ativado ela é recusada antes de qualquer efeito (RN-682) — converse com
        um agente por `.../agents/:agent/message`.
      operationId: ChatController_chat
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageDto'
      responses:
        '200':
          description: Fluxo de quadros até `done` ou `error`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatSseEventResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto ou sessão não encontrado.
        '422':
          description: >-
            `destinatario_ausente`: sessão `consultiva` sem agente — a mensagem
            não tem destinatário. Nada foi gravado e nenhum modelo foi chamado
            (RN-682).
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Conversa com o modelo da sessão, com a resposta em streaming
      tags:
        - llm
  /projects/{projectId}/sessions/{sessionId}/context-summary:
    get:
      description: >-
        Regras de negócio, registros de decisão e artefatos por agente contados
        sobre o log INTEIRO da sessão (a tela lê uma cauda de 200 eventos), mais
        os arquivos tocados por `git_commit`/`git_push` nesta sessão e na sessão
        de execução que o plano aprovado do Dev Lead dela ativou (RN-828). Desde
        a RN-844 devolve também os ITENS de regras e decisões (os 50 mais
        recentes de cada; os totais ficam em `regras`/`decisoes`) e os arquivos
        das PRs abertas nessas sessões, lidos do mesmo diff que a aba de PRs lê,
        para no máximo 20 PRs por chamada; `prsNaoLidas` diz quantas ficaram de
        fora ou falharam. Só leitura; nenhuma tabela nova.
      operationId: SessionsController_contextSummary
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContextSummaryResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto ou sessão não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Conta a sessão inteira para o painel de contexto
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}/events:
    get:
      description: >-
        O log é IMUTÁVEL e ordenado por `seq`. A paginação normal é incremental:
        passe o `nextCursor` da resposta anterior como `afterSeq`. `latest=true`
        faz o contrário — busca a CAUDA e ignora `afterSeq`, para uma tela que
        abre no fim em vez de reconstruir a sessão inteira desde o começo (ADR
        0021).
      operationId: SessionsController_listEvents
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: afterSeq
          required: false
          in: query
          description: Devolve os eventos com `seq` maior que este.
          schema:
            example: 40
            type: string
        - name: limit
          required: false
          in: query
          schema:
            example: 50
            type: string
        - name: latest
          required: false
          in: query
          description: Busca a cauda do log; ignora `afterSeq`.
          schema:
            example: 'true'
            type: string
        - name: actionId
          required: false
          in: query
          description: >-
            Só os eventos cujo `payload.actionId` é esta ação — ex.: o
            `proposed_action.created` dela, que traz o `reason` da política e o
            `scopeRoot` que a linha da ação não guarda (RN-614). Combina com os
            outros parâmetros; o `seq` deixa de ser contíguo na página, então
            quem filtra por ação não deve derivar dele contagem de omitidos.
            Valor vazio é `400`.
          schema:
            example: 01JC4Z0000ACAO00000000000001
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeEventosResponseDto'
        '400':
          description: '`actionId` está presente mas vazio.'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto ou sessão não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Pagina o event log da sessão
      tags:
        - sessions
    post:
      description: >-
        Append-only: o `seq` é atribuído pelo servidor e nada no log é
        atualizado ou removido depois. Não há endpoint de edição, por desenho.
      operationId: SessionsController_appendEvent
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendSessionEventDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEventResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto ou sessão não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Acrescenta um evento ao log da sessão
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}/events/{eventId}:
    get:
      description: >-
        Existe para que a evidência das hipóteses do Psicólogo alcance o evento
        citado não importa em que página ele caiu nem os filtros do feed.
