      summary: 批准该操作，仅此一次
      tags:
        - actions
  /projects/{projectId}/sessions/{sessionId}/actions/{actionId}/approve_always:
    post:
      description: >-
        除了放行此操作外，还会把相应的模式加入项目的 `allow` 列表——今后匹配的操作会以 `auto_approved` 出来而无需询问。已在
        `deny` 中的模式保持阻止。批准和模式在同一事务中记录。点击已被批准的操作属于幂等成功（`desfecho:
        ja_aprovada`），仅在模式缺失时才记录它。
      operationId: ActionsController_approveAlways
