        O mapa vigente é o de maior `version` (o histórico é imutável). As
        pendências são a validação cruzada história↔mapa: história sem módulo,
        ou apontando para módulo que não existe.
      operationId: BacklogController_architecture
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
