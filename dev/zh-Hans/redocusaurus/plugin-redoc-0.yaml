          nullable: true
          description: >-
            项目中从未进行过置备时为 `null`。`awaiting_plan_decision`
            是一个已接入、计划已生成但尚未决定的仓库：在有人批准计划或按原样接入之前，什么都不会运行。
        sessionId:
          type: object
          example: 01JC4Z8QK3M7YV2N5T9B0PXHRA
          nullable: true
          description: 引导的专用会话。进度界面读取其 `bootstrap.step_*` 事件来构建实时清单。
        failedStep:
          type: string
          enum:
            - commit_pr_template
            - commit_branching_policy
            - commit_gitignore
            - create_dev_branch
            - create_qa_branch
            - create_rc_branch
            - protect_branches
          example: null
          nullable: true
        lastError:
          type: object
          example: null
          nullable: true
        attempts:
          type: number
          example: 1
          description: 引导已经尝试了多少次。它是幂等且可恢复的：重复执行不会重复已成功的部分。
      required:
