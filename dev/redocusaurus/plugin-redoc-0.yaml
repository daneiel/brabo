    SessionListItemResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z8QK3M7YV2N5T9B0PXHRA
          description: O ULID da sessão.
        projectId:
          type: string
          example: 01JC4Z0000PROJETO0000000001
        createdBy:
          type: string
          example: 01JC4Z0000USUARIO0000000001
          description: Quem abriu a sessão.
        status:
          type: string
          enum:
            - created
            - active
            - closing
            - closed
            - closed_abnormally
          example: active
          description: >-
            Máquina de estados explícita: created → active → closing → closed |
            closed_abnormally. Transição inválida responde 409.
        kind:
          type: string
          enum:
            - consultiva
            - criativa
          example: criativa
          description: >-
            A INTENÇÃO com que a sessão foi aberta, escolhida na criação e
            imutável. `consultiva` é só conversa; `criativa` produz e é a única
            que entra em execução. Não confundir com o estado de execução, que
            continua sendo o evento `execution.activated` no log.
        name:
          type: object
          example: Cart checkout
          nullable: true
          description: >-
            Nome amigável, ou `null`. As telas o compõem com a hashtag do id;
            ele nunca a substitui.
        nextSeq:
          type: number
          example: 42
          description: >-
            Próximo `seq` do event log. Serve de cursor: `?afterSeq=41` busca
            tudo depois do 41.
        createdAt:
          type: string
          example: '2026-07-27T14:03:22.187Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-27T14:31:09.004Z'
          format: date-time
        closedAt:
          type: object
          example: null
          format: date-time
          nullable: true
          description: Só preenchido em estados terminais.
        terminationReason:
          type: object
          example: null
          nullable: true
          description: >-
            Motivo relatado pelo engine ao encerrar (heartbeat_timeout,
            conversation_idle_timeout, killed, exception…). `null` num
            fechamento humano ou numa sessão ainda viva.
        traceParent:
          type: object
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          nullable: true
          description: >-
            `traceparent` W3C do span raiz. É assim que a sessão inteira é
            recuperada no Tempo.
        technical:
          type: boolean
          example: false
          description: >-
            Se esta é a sessão TÉCNICA aberta pelo provisionamento do
            repositório (a ligada por `repo_bootstraps`), em oposição a uma
            sessão de trabalho. É o vínculo, nunca o nome: renomear a sessão não
            o muda. Telas que escolhem "a sessão mais recente" a pulam, a menos
            que seja a única.
      required:
        - id
        - projectId
        - createdBy
        - status
        - kind
        - name
        - nextSeq
        - createdAt
        - updatedAt
        - closedAt
        - terminationReason
        - traceParent
        - technical
