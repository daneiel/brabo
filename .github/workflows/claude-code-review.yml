name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # PR aberto por BOT não é revisado, e o teste é o `type` do autor — nunca
    # uma lista de logins. A lista foi o que estava aqui (`github-actions[bot]`
    # apenas), e ela tem o defeito de quem enumera: acerta enquanto o conjunto
    # não muda, e erra calada no dia em que um bot novo aparece. Foi o que
    # aconteceu quando o `dependabot.yml` entrou (PR #520) — o PR #526 reprovou
    # com a MESMA mensagem dos #64/#65, três meses depois de a lição ter sido
    # aprendida e escrita logo abaixo.
    #
    # A razão 1 vale para TODO bot, e é mecânica, não preferência:
    #
    # 1. O action se recusa a rodar com ator não-humano ("Workflow initiated by
    #    non-human actor: <nome> (type: Bot)"). Sem este `if`, o check falha
    #    sempre — nos PRs #64 e #65 do ciclo v0.3.1 (promoção) e no #526
    #    (Dependabot).
    #
    # A razão 2 vale só para PR de PROMOÇÃO, e não deixa de ser verdadeira por
    # isso:
    #
    # 2. Seria revisão repetida: a promoção só carrega commits que já passaram
    #    por um PR para `dev`, onde este mesmo workflow já revisou. Revisar de
    #    novo em cada degrau é a mesma diff três vezes.
    #
    # Para o Dependabot existe ainda uma terceira, e ela FECHA a porta: o PR
    # dele roda com o cofre de segredos DO DEPENDABOT, separado do de Actions,
    # então `secrets.CLAUDE_CODE_OAUTH_TOKEN` chega VAZIO (o log do #526 mostra
    # `Secret source: Dependabot` e `"anthropic_api_key": ""`). Mesmo liberando
    # o ator, a revisão não teria credencial — e um check que falha por segredo
    # ausente é pior que um pulado, porque parece defeito de código.
    #
    # Pular é seguro porque `claude-review` NÃO é check required
    # (docs/reference/rulesets.md, "Checks obrigatórios") — job pulado aqui não
    # deixa PR nenhum pendente para sempre.
    # As DUAS checagens, espelhando `ehAutorBot` (`scripts/ci/pr-police.ts:147`)
    # em vez de inventar um teste mais fraco aqui: o `type` é o sinal da API, e
    # o sufixo `[bot]` é a rede — o GitHub não permite `[` em login humano,
    # então ele não é forjável.
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      !endsWith(github.event.pull_request.user.login, '[bot]')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # O plugin code-review (anthropics/claude-code-plugins) só declara
          # Bash(gh ...) no seu allowed-tools próprio. Na prática os agentes de
          # revisão (passo 4 do comando) tentam ler histórico/autoria do
          # checkout local com `git log`/`git blame`/`git show`, e como nada
          # liberava esses comandos, a PR #250 sofreu 44 negações de permissão
          # e a sessão terminou sem nenhum comentário em prosa (fallback
          # mecânico "Ran N shell commands."). claude_args é aditivo ao
          # allowed-tools do plugin, não substitui.
          claude_args: |
            --allowedTools "Bash(git log:*),Bash(git blame:*),Bash(git show:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

