    LlmTurnResponseDto:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/LlmMessageResponseDto'
        usage:
          $ref: '#/components/schemas/LlmUsageResponseDto'
        error:
          type: object
          example: null
          nullable: true
          description: >-
            A falha do provider. Vem no CORPO com 200, não como erro HTTP,
            porque a contabilidade em `usage` continua valendo — o turno gastou,
            mesmo falhando.
        errorCode:
          type: object
          example: null
          nullable: true
          description: >-
            O `code` normalizado da falha do provider (ADR 0041) — `auth`,
            `rate_limit`, `insufficient_credit` (HTTP 402, RN-730),
            `model_not_found`, `context_length`, `timeout`, `connection` ou
            `upstream`. `null` sem erro, ou quando o erro não é do provider
            (orçamento, binding ausente). Decida por isto, nunca pelo texto de
            `error`.
        modelName:
          type: object
          example: llama3.2:3b
          nullable: true
          description: >-
            Nome do modelo que gerou a resposta (achado do problema 2) — `null`
            quando o turno falhou antes de resolver um modelo (sem binding, ou
            binding para modelo inexistente).
        truncated:
          type: boolean
          enum:
            - true
          description: >-
            Presente (sempre `true`) só quando o provider cortou a resposta no
            teto de saída (`finish_reason: "length"` / `stop_reason:
            "max_tokens"`, RN-737): o texto e os argumentos de `toolCalls` estão
            truncados. O engine se recusa a rodar uma tool call truncada e narra
            o corte.
        toolRouting:
          description: >-
            O passo em que o Jev escolheu a ferramenta (ADR 0179, RN-625).
            Ausente quando o roteador não foi consultado (provider que não é o
            OpenRouter, menos de duas ferramentas, chave do workspace
            desligada). O engine o narra como `tool_router.decided`.
          allOf:
            - $ref: '#/components/schemas/ToolRoutingResponseDto'
      required:
        - message
        - usage
        - error
        - errorCode
        - modelName
    LlmTurnStreamEventResponseDto:
      type: object
