name: Build runner binaries

# ADR 0112 — o item de backlog do ADR 0104 ("binário standalone (pkg/bun
# build --compile)"), até agora fora de escopo. Workflow PRÓPRIO, disparado
# pela MESMA tag final de `release.yml`/`publish-runner.yml` — mesma
# disciplina do ADR 0030 ("workflow PRÓPRIO disparado pela tag... nada a
# religar aqui"). Cinco binários (um por plataforma do backlog), cada um
# construído no seu runner NATIVO — nunca cross-compila addon nativo — e
# anexado à MESMA GitHub Release que `release.yml` cria (`gh release
# upload`, nunca `create`).
#
# Roda em PARALELO a `release.yml`/`publish-runner.yml`, sem `needs:` — a
# única dependência real é a Release EXISTIR, e o passo de upload ESPERA por
# ela com teto antes de declarar ausência (nunca cria uma por conta própria).
#
# Este arquivo já afirmou o contrário — "a Release já existe quando este job
# termina" — e a v4.0.0 provou que não: era a PRIMEIRA tag final desde que o
# workflow nasceu, e a afirmação nunca tinha sido exercitada. Ver o comentário
# do passo "Anexar à GitHub Release", onde a corrida está medida.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag final a (re)construir (ex.: v1.2.0)'
        required: true
        type: string

permissions:
  contents: write # gh release upload

env:
  NODE_VERSION: '24.11.1'
  PNPM_VERSION: '11.3.0'
  # `oven-sh/setup-bun` aceita "latest", mas fixar a versão evita que uma
  # release do Bun quebre os cinco builds ao mesmo tempo sem aviso — mesmo
  # raciocínio que já vale para NODE_VERSION/PNPM_VERSION no resto do repo.
  BUN_VERSION: '1.4.0'

concurrency:
  # Mesmo padrão de `publish-runner.yml`: evita duas construções da MESMA
  # tag em paralelo (push e dispatch manual coincidindo).
  group: build-runner-binaries-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Binário (${{ matrix.target }})
    strategy:
      # `fail-fast: false` — uma plataforma falhando não deve impedir as
      # outras quatro de publicar o binário delas. O ADR 0112 documenta
      # exatamente qual plataforma foi validada de ponta a ponta neste
      # sandbox (só linux-x64) e quais dependem só desta matriz para a
      # primeira prova real.
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          # GitHub-hosted, Cobalt 100 (Ubuntu 24.04) — confirmado disponível
          # em repositório PÚBLICO sem custo extra em 2026 (a oferta de ARM
          # hospedado mudou desde o preview de jan/2025; este label é o
          # atual). `node-pty` não publica prebuild pra Linux nenhum —
          # `node-gyp rebuild` compila local aqui como em `linux-x64`.
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: darwin-x64
            os: macos-13
          - target: darwin-arm64
            os: macos-14
          - target: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        # O default do windows-latest é `pwsh` — os passos abaixo são bash
        # de propósito (mesma sintaxe `set -euo pipefail` do resto do repo),
        # e o `windows-latest` do GitHub já traz um bash utilizável (Git
        # Bash) sob `C:\Program Files\Git\bin\bash.exe`, que é o que
        # `shell: bash` resolve.
        shell: bash
    steps:
      # Mesma restrição de `publish-runner.yml`/`release.yml`: quem
      # reconstrói manualmente é o responsável nomeado, não qualquer um com
      # escrita no repo.
      - name: Quem pode (re)construir
        if: github.event_name == 'workflow_dispatch'
        env:
          ATOR: ${{ github.actor }}
          MODO: ${{ vars.APPROVAL_MODE || 'solo' }}
          OWNER: ${{ vars.OWNER_HANDLE }}
        run: |
          set -euo pipefail
          if [ "$MODO" != 'solo' ]; then
            echo "::notice::APPROVAL_MODE=$MODO — a restrição de dispatch por owner vale no modo solo."
            exit 0
          fi
          if [ -z "${OWNER:-}" ] || [ "$ATOR" != "$OWNER" ]; then
            echo "::error::'$ATOR' não pode disparar construção manual."
            exit 1
          fi
          echo "ator autorizado: $ATOR"

      # Mesmo motivo de `publish-runner.yml`: num dispatch, `github.ref_name`
      # é a branch padrão, não a tag pedida. Um lugar só resolve e valida.
      - name: Qual tag construir
        id: alvo
        env:
          ENTRADA: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            tag="$ENTRADA"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' não é tag final. O formato é vX.Y.Z, sem sufixo -dev.N nem -qa.N."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag a construir: $tag"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Checkout NA TAG, nunca no ref do evento — mesmo motivo de
          # `publish-runner.yml`.
          ref: ${{ steps.alvo.outputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # `pnpm install` — mesmo que sem publicar no npm, é ELE quem roda o
      # `install` do `node-pty` (`node scripts/prebuild.js || node-gyp
      # rebuild`), que decide se `build/Release/pty.node` (compilado local)
      # ou `prebuilds/<platform>-<arch>/*.node` (binário pronto do pacote) é
      # o que `scripts/build-bin.mjs` vai embutir — Node é exigido aqui por
      # causa do fallback de compilação local do `node-gyp`, mesmo o
      # artefato final sendo compilado pelo Bun.
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build do binário (${{ matrix.target }})
        run: pnpm --filter runner build:bin

      # Smoke REAL sobre o binário recém-construído — nunca confiar em CI
      # antigo. `--self-test-pty` spawna um PTY de verdade e prova que o
      # `.node` nativo embutido carrega e funciona NESTE runner, para ESTA
      # plataforma — é o mesmo raciocínio de "cinto e suspensório" que
      # `publish-runner.yml` já aplica ao smoke do `dist/index.cjs`.
      - name: Smoke do binário
        run: pnpm --filter runner smoke:bin

      # Idempotência — mesmo padrão de `publish-runner.yml` ("Essa versão já
      # está publicada?"): republicar a MESMA tag (workflow_dispatch depois
      # de um push que já rodou) não deve falhar tentando anexar um asset
      # que já existe. `gh release upload` sem `--clobber` falharia com 422
      # nesse caso; a checagem evita alcançar isso.
      - name: Anexar à GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.alvo.outputs.tag }}
          # Teto da espera pela Release. 10min contra os ~4min que
          # `release.yml` levou na v4.0.0 — folga para um build de imagem sem
          # cache, e ainda dentro do `timeout-minutes: 20` do job somado ao
          # build mais lento da matriz (macOS).
          ESPERA_MAXIMA_SEGUNDOS: '600'
          INTERVALO_SEGUNDOS: '15'
        run: |
          set -euo pipefail

          arquivo="$(ls apps/runner/dist-bin/brabo-runner-* 2>/dev/null | head -1)"
          if [ -z "$arquivo" ]; then
            echo "::error::nenhum binário encontrado em apps/runner/dist-bin/ — o build falhou silenciosamente?"
            exit 1
          fi
          nome="$(basename "$arquivo")"

          # A Release NÃO existe quando este job termina de construir, e a
          # corrida não é rara: é o caso NORMAL. Na v4.0.0 as CINCO
          # plataformas construíram o binário e passaram no smoke, e as cinco
          # morreram aqui — binário pronto às 13:10:56, Release publicada às
          # 13:14:23, uma perda por 3m25s. O motivo é estrutural, não de
          # carga: `release.yml` publica a Release DEPOIS de construir e
          # empurrar as quatro imagens do GHCR (~3min), enquanto este job
          # constrói o binário em ~45s. Quem chega primeiro é sempre este.
          #
          # Por que não `on: release: published`, que dispensaria a espera:
          # `release.yml` cria a Release com o `GITHUB_TOKEN`, e evento
          # gerado com esse token NÃO dispara workflow (regra do GitHub
          # contra recursão) — a MESMA armadilha que `tag-release.yml`
          # documenta sobre a tag da v0.2.0, que por isso nunca publicou.
          # Trocaríamos uma corrida perdida por um gatilho que nunca dispara.
          #
          # Então: espera LIMITADA. O que NÃO muda é o desfecho de uma
          # ausência PERMANENTE — dispatch manual numa tag sem Release, ou
          # `release.yml` reprovado — que continua sendo erro explícito, e
          # nunca uma Release criada por aqui. O que muda é que a ausência
          # precisa PERSISTIR pelo teto para ser declarada, em vez de ser
          # lida no primeiro instante, quando ela ainda não significa nada.
          limite=$(( SECONDS + ESPERA_MAXIMA_SEGUNDOS ))
          until gh release view "$TAG" >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$limite" ]; then
              echo "::error::a Release de $TAG não existe depois de ${ESPERA_MAXIMA_SEGUNDOS}s de espera — este workflow só ANEXA a uma Release existente, nunca cria uma."
              exit 1
            fi
            echo "a Release de $TAG ainda não existe; nova tentativa em ${INTERVALO_SEGUNDOS}s."
            sleep "$INTERVALO_SEGUNDOS"
          done

          ja_anexado="$(gh release view "$TAG" --json assets --jq ".assets[].name" | grep -qx "$nome" && echo true || echo false)"
          if [ "$ja_anexado" = 'true' ]; then
            echo "::notice::$nome já está anexado a $TAG — nada a fazer (idempotência)."
          else
            gh release upload "$TAG" "$arquivo"
            echo "anexado: $nome -> $TAG"
          fi
