          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductMetricsResponseDto'
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '404':
          description: Проект не существует.
      security:
        - service-token: []
      summary: Воронка поставки проекта и частичные метрики DORA, для чтения PO
      tags:
        - internal
