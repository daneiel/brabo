# Destino S3-compatível do backup, SÓ no cluster local (Fase 5, item 6).
#
# Existe para que o caminho de backup exercitado localmente seja o MESMO de
# produção: o script fala S3 sempre, e o que muda entre ambientes é apenas o
# endpoint. A alternativa (gravar em PVC no local e em S3 em produção) deixaria
# credencial, bucket e retenção remota — justamente onde restore costuma falhar
# — sem nenhum teste até o dia do incidente.
#
# O servidor é o SeaweedFS (`weed server -s3`, Apache-2.0), e não mais o MinIO
# (ADR 0169). A MinIO parou de publicar a imagem comunitária: o digest que este
# arquivo prendia passou a responder 401 no quay.io e o repositório do Docker
# Hub, 404 — e o bootstrap morria no `rollout status`, antes de qualquer prova
# de propriedade rodar. O nome dos recursos é NEUTRO (`s3-local`) de propósito:
# o que o backup consome é o protocolo, e um Service chamado pelo produto que
# está atrás dele envelhece na próxima troca.
#
# O cliente NÃO mudou: é o `aws-cli` da imagem `brabo-backup`, e o fluxo inteiro
# do `docker/backup/lib.sh` (ls, cp por stdin com multipart, head-object, cópia
# do lado do servidor, list-objects-v2, rm, mb) foi medido contra esta imagem
# antes da troca — ver o ADR.
#
# Réplica única, sem HA e sem PDB de propósito: é infraestrutura de teste. Em
# staging/prod o bucket é externo e este manifesto não é aplicado.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3-local-data
  labels:
    app.kubernetes.io/name: s3-local
    app.kubernetes.io/part-of: brabo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-local
  labels:
    app.kubernetes.io/name: s3-local
    app.kubernetes.io/part-of: brabo
spec:
  replicas: 1
  # Recreate e não RollingUpdate: o PVC é RWO e um segundo pod ficaria preso em
  # Pending esperando um volume que o primeiro não solta.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: s3-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3-local
        app.kubernetes.io/part-of: brabo
    spec:
      # Non-root desde o início: o entrypoint da imagem só troca de usuário
      # (`su-exec`) quando nasce root, e rodando como 1000 ele vai direto ao
      # `weed`. O `fsGroup` dá ao processo a escrita no PVC.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: s3
          image: docker.io/chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882  # 4.47
          # `server -s3` sobe mestre, volume, filer e o gateway S3 num processo
          # só — o mínimo que responde S3. NÃO `mini`, que acrescenta WebDAV,
          # Admin UI e catálogo Iceberg que ninguém aqui consome.
          #
          # O gateway escuta na 9000, a porta que o destino sempre teve: é ela
          # que a NetworkPolicy (que casa a porta do POD, não a do Service) e o
          # `BACKUP_S3_ENDPOINT` do bootstrap nomeiam.
          args: ["server", "-s3", "-s3.port=9000"]
          env:
            # As MESMAS credenciais que o backup usa, vindas do mesmo Secret —
            # se divergirem, o job falha na autenticação e o motivo não é óbvio.
            # O SeaweedFS lê o par do ambiente como a identidade administrativa
            # do gateway; com ele definido, pedido sem assinatura válida é
            # recusado (medido: segredo errado reprova o `aws s3 ls`).
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: brabo-secrets
                  key: BACKUP_S3_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: brabo-secrets
                  key: BACKUP_S3_SECRET_KEY
          ports:
            - name: s3
              containerPort: 9000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # readOnlyRootFilesystem fica FALSO aqui: além do /data (o PVC), o
          # `weed` grava o socket local do filer em /tmp. É componente de teste
          # local; endurecer isso não protege nada que exista em produção.
          readinessProbe:
            httpGet:
              path: /healthz
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: s3-local-data
---
apiVersion: v1
kind: Service
metadata:
  name: s3-local
  labels:
    app.kubernetes.io/name: s3-local
    app.kubernetes.io/part-of: brabo
spec:
  selector:
    app.kubernetes.io/name: s3-local
  ports:
    - name: s3
      port: 9000
      targetPort: s3
