name: Build runner binaries

# ADR 0112 — o item de backlog do ADR 0104 ("binário standalone (pkg/bun
# build --compile)"), até agora fora de escopo. Workflow PRÓPRIO, disparado
# pela MESMA tag final de `release.yml`/`publish-runner.yml` — mesma
# disciplina do ADR 0030 ("workflow PRÓPRIO disparado pela tag... nada a
# religar aqui"). Cinco binários (um por plataforma do backlog), cada um
# construído no seu runner NATIVO — nunca cross-compila addon nativo — e
# anexado à MESMA GitHub Release que `release.yml` cria (`gh release
# upload`, nunca `create`).
#
# Roda em PARALELO a `release.yml`/`publish-runner.yml`, sem `needs:` — a
# única dependência real é a Release EXISTIR, e o passo de upload ESPERA por
# ela com teto antes de declarar ausência (nunca cria uma por conta própria).
#
# Este arquivo já afirmou o contrário — "a Release já existe quando este job
# termina" — e a v4.0.0 provou que não: era a PRIMEIRA tag final desde que o
# workflow nasceu, e a afirmação nunca tinha sido exercitada. Ver o comentário
# do passo "Anexar à GitHub Release", onde a corrida está medida.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        # VAZIA = ENSAIO: constrói e roda o smoke nas cinco plataformas a
        # partir da branch escolhida, e NÃO anexa nada a Release nenhuma.
        #
        # Existe porque estes binários só eram construídos numa tag, e foi
        # assim que duas falhas de plataforma ficaram invisíveis até o corte:
        # `darwin-arm64` no `--self-test-pty` (o `spawn-helper` não era
        # embutido) e `win32-x64` no `build:bin` (o `.node` está no prebuild,
        # não em `build/Release`). Nenhuma das duas aparece no Linux.
        description: 'Tag final a (re)construir (ex.: v1.2.0). VAZIA = ensaio, sem anexar nada.'
        required: false
        type: string

permissions:
  contents: write # gh release upload

env:
  NODE_VERSION: '24.11.1'
  PNPM_VERSION: '11.3.0'
  # `oven-sh/setup-bun` aceita "latest", mas fixar a versão evita que uma
  # release do Bun quebre os cinco builds ao mesmo tempo sem aviso — mesmo
  # raciocínio que já vale para NODE_VERSION/PNPM_VERSION no resto do repo.
  BUN_VERSION: '1.4.0'

concurrency:
  # Mesmo padrão de `publish-runner.yml`: evita duas construções da MESMA
  # tag em paralelo (push e dispatch manual coincidindo).
  group: build-runner-binaries-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Binário (${{ matrix.target }})
    strategy:
      # `fail-fast: false` — uma plataforma falhando não deve impedir as
      # outras quatro de publicar o binário delas. O ADR 0112 documenta
      # exatamente qual plataforma foi validada de ponta a ponta neste
      # sandbox (só linux-x64) e quais dependem só desta matriz para a
      # primeira prova real.
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          # GitHub-hosted, Cobalt 100 (Ubuntu 24.04) — confirmado disponível
          # em repositório PÚBLICO sem custo extra em 2026 (a oferta de ARM
          # hospedado mudou desde o preview de jan/2025; este label é o
          # atual). `node-pty` não publica prebuild pra Linux nenhum —
          # `node-gyp rebuild` compila local aqui como em `linux-x64`.
          - target: linux-arm64
            os: ubuntu-24.04-arm
          # `macos-13` NÃO TEM RUNNER: a imagem macOS 13 foi aposentada pelo
          # GitHub (changelog de 2025-09-19, fim em dez/2025), e o job fica
          # 24h00m01s na fila e é cancelado nas três tags (`v4.0.0`, `v4.0.1`,
          # `v5.0.0`) — de novo 30min na fila, sem runner, no ensaio de
          # 2026-09-13 (run 34769280227). O label Intel que o GitHub oferece no
          # lugar, `macos-15-intel`, FOI medido no mesmo dia e agenda em 3–22s
          # (cinco runs) e CONSTRÓI — mas reprova no `--self-test-pty`: sob o
          # Bun o `onData` do node-pty nunca entrega a saída do filho (bug
          # aberto oven-sh/bun#25822, sem release corrigida; a MESMA prova
          # passa sob Node no mesmo runner, run 34770476634). O label fica
          # como está, de propósito: trocá-lo não faz o alvo publicar, e
          # tirar a plataforma ou esperar o Bun é decisão de dono (AT-065).
          - target: darwin-x64
            os: macos-13
          - target: darwin-arm64
            os: macos-14
          - target: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        # O default do windows-latest é `pwsh` — os passos abaixo são bash
        # de propósito (mesma sintaxe `set -euo pipefail` do resto do repo),
        # e o `windows-latest` do GitHub já traz um bash utilizável (Git
        # Bash) sob `C:\Program Files\Git\bin\bash.exe`, que é o que
        # `shell: bash` resolve.
        shell: bash
    steps:
      # Mesma restrição de `publish-runner.yml`/`release.yml`: quem
      # reconstrói manualmente é o responsável nomeado, não qualquer um com
      # escrita no repo.
      - name: Quem pode (re)construir
        if: github.event_name == 'workflow_dispatch'
        env:
          ATOR: ${{ github.actor }}
          MODO: ${{ vars.APPROVAL_MODE || 'solo' }}
          OWNER: ${{ vars.OWNER_HANDLE }}
        run: |
          set -euo pipefail
          if [ "$MODO" != 'solo' ]; then
            echo "::notice::APPROVAL_MODE=$MODO — a restrição de dispatch por owner vale no modo solo."
            exit 0
          fi
          if [ -z "${OWNER:-}" ] || [ "$ATOR" != "$OWNER" ]; then
            echo "::error::'$ATOR' não pode disparar construção manual."
            exit 1
          fi
          echo "ator autorizado: $ATOR"

      # Mesmo motivo de `publish-runner.yml`: num dispatch, `github.ref_name`
      # é a branch padrão, não a tag pedida. Um lugar só resolve e valida.
      - name: Qual tag construir
        id: alvo
        env:
          ENTRADA: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ] && [ -z "$ENTRADA" ]; then
            # ENSAIO: constrói a partir do que foi escolhido no dispatch e não
            # anexa nada. Sem isto, a única forma de exercitar as cinco
            # plataformas era cortar uma tag — e uma falha de plataforma só
            # aparecia com a Release já publicada.
            echo 'ensaio=true' >> "$GITHUB_OUTPUT"
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "ENSAIO a partir de ${GITHUB_REF_NAME} — nada será anexado."
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            tag="$ENTRADA"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' não é tag final. O formato é vX.Y.Z, sem sufixo -dev.N nem -qa.N."
            exit 1
          fi
          echo 'ensaio=false' >> "$GITHUB_OUTPUT"
          echo "ref=$tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag a construir: $tag"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Checkout NA TAG, nunca no ref do evento — mesmo motivo de
          # `publish-runner.yml`.
          ref: ${{ steps.alvo.outputs.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # `pnpm install` — mesmo que sem publicar no npm, é ELE quem roda o
      # `install` do `node-pty` (`node scripts/prebuild.js || node-gyp
      # rebuild`), que decide se `build/Release/pty.node` (compilado local)
      # ou `prebuilds/<platform>-<arch>/*.node` (binário pronto do pacote) é
      # o que `scripts/build-bin.mjs` vai embutir — Node é exigido aqui por
      # causa do fallback de compilação local do `node-gyp`, mesmo o
      # artefato final sendo compilado pelo Bun.
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build do binário (${{ matrix.target }})
        run: pnpm --filter runner build:bin

      # Smoke REAL sobre o binário recém-construído — nunca confiar em CI
      # antigo. `--self-test-pty` spawna um PTY de verdade e prova que o
      # `.node` nativo embutido carrega e funciona NESTE runner, para ESTA
      # plataforma — é o mesmo raciocínio de "cinto e suspensório" que
      # `publish-runner.yml` já aplica ao smoke do `dist/index.cjs`.
      - name: Smoke do binário
        run: pnpm --filter runner smoke:bin

      # Idempotência — mesmo padrão de `publish-runner.yml` ("Essa versão já
      # está publicada?"): republicar a MESMA tag (workflow_dispatch depois
      # de um push que já rodou) não deve falhar tentando anexar um asset
      # que já existe. `gh release upload` sem `--clobber` falharia com 422
      # nesse caso; a checagem evita alcançar isso.
      - name: Anexar à GitHub Release
        # Ensaio prova o BUILD e o SMOKE; publicar é o que ele não faz.
        if: steps.alvo.outputs.ensaio != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.alvo.outputs.tag }}
          # Teto da espera pela Release. 10min contra os ~4min que
          # `release.yml` levou na v4.0.0 — folga para um build de imagem sem
          # cache, e ainda dentro do `timeout-minutes: 20` do job somado ao
          # build mais lento da matriz (macOS).
          ESPERA_MAXIMA_SEGUNDOS: '600'
          INTERVALO_SEGUNDOS: '15'
        run: |
          set -euo pipefail

          arquivo="$(ls apps/runner/dist-bin/brabo-runner-* 2>/dev/null | head -1)"
          if [ -z "$arquivo" ]; then
            echo "::error::nenhum binário encontrado em apps/runner/dist-bin/ — o build falhou silenciosamente?"
            exit 1
          fi
          nome="$(basename "$arquivo")"

          # A Release NÃO existe quando este job termina de construir, e a
          # corrida não é rara: é o caso NORMAL. Na v4.0.0 as CINCO
          # plataformas construíram o binário e passaram no smoke, e as cinco
          # morreram aqui — binário pronto às 13:10:56, Release publicada às
          # 13:14:23, uma perda por 3m25s. O motivo é estrutural, não de
          # carga: `release.yml` publica a Release DEPOIS de construir e
          # empurrar as quatro imagens do GHCR (~3min), enquanto este job
          # constrói o binário em ~45s. Quem chega primeiro é sempre este.
          #
          # Por que não `on: release: published`, que dispensaria a espera:
          # `release.yml` cria a Release com o `GITHUB_TOKEN`, e evento
          # gerado com esse token NÃO dispara workflow (regra do GitHub
          # contra recursão) — a MESMA armadilha que `tag-release.yml`
          # documenta sobre a tag da v0.2.0, que por isso nunca publicou.
          # Trocaríamos uma corrida perdida por um gatilho que nunca dispara.
          #
          # Então: espera LIMITADA. O que NÃO muda é o desfecho de uma
          # ausência PERMANENTE — dispatch manual numa tag sem Release, ou
          # `release.yml` reprovado — que continua sendo erro explícito, e
          # nunca uma Release criada por aqui. O que muda é que a ausência
          # precisa PERSISTIR pelo teto para ser declarada, em vez de ser
          # lida no primeiro instante, quando ela ainda não significa nada.
          limite=$(( SECONDS + ESPERA_MAXIMA_SEGUNDOS ))
          until gh release view "$TAG" >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$limite" ]; then
              echo "::error::a Release de $TAG não existe depois de ${ESPERA_MAXIMA_SEGUNDOS}s de espera — este workflow só ANEXA a uma Release existente, nunca cria uma."
              exit 1
            fi
            echo "a Release de $TAG ainda não existe; nova tentativa em ${INTERVALO_SEGUNDOS}s."
            sleep "$INTERVALO_SEGUNDOS"
          done

          ja_anexado="$(gh release view "$TAG" --json assets --jq ".assets[].name" | grep -qx "$nome" && echo true || echo false)"
          if [ "$ja_anexado" = 'true' ]; then
            echo "::notice::$nome já está anexado a $TAG — nada a fazer (idempotência)."
          else
            gh release upload "$TAG" "$arquivo"
            echo "anexado: $nome -> $TAG"
          fi

  # ADR 0149 (BRB-005) — UM `checksums.txt` assinado, não cinco assinaturas.
  #
  # Por que um job SEPARADO e não um passo dentro da matriz: cada job da
  # matriz roda numa plataforma diferente e enxerga só o PRÓPRIO binário. Um
  # manifesto que cobre o conjunto só pode ser montado depois que os alvos
  # anexaram — e é por isso que este job baixa os assets da Release em vez de
  # ler `dist-bin/`, que aqui está vazio.
  #
  # Cinco assinaturas separadas seriam cinco jeitos de a verificação ficar
  # pela metade: quem verifica quatro e esquece o quinto não tem como saber
  # que esqueceu. Um manifesto assinado cobre o conjunto com uma verificação
  # só, e é o formato que qualquer consumidor sabe ler.
  #
  # O conjunto não é só de binários: o `install.sh` desta tag e, desde o ADR
  # 0160, os arquivos que ele baixa para subir a instalação (o compose e o que
  # ele monta, nomeados em `scripts/ci/assets-do-instalador.ts`) entram no MESMO
  # manifesto — uma cadeia, não duas.
  checksums:
    name: checksums.txt assinado
    # SEM `needs: build`, e a ausência É a correção — não um esquecimento.
    #
    # Com `needs: build` mais `always()`, o job rodava mesmo com a matriz
    # falhando: `always()` cobre dependência CANCELADA. O que ele não cobria
    # era QUANDO. E "quando" está medido nas três tags que existem
    # (`v4.0.0`, `v4.0.1`, `v5.0.0`): o alvo `darwin-x64` (`macos-13`) fica
    # **24h00m01s** na fila e é cancelado pelo teto do Actions, o MESMO
    # número nas três — ou seja, nunca recebe runner. Todos os outros quatro
    # jobs terminam em no máximo **4m18s** (linux-x64 na `v4.0.1`,
    # 17:38:28Z → 17:42:44Z). Com `needs:`, o manifesto assinado só podia
    # nascer UM DIA depois da Release, e para quem instala isso é o mesmo que
    # não nascer: sem `checksums.txt`, `GET /runner-releases/binary` recusa
    # com `release_sem_manifesto` (RN-525) e o `install.sh` recusa junto
    # (RN-526) — em TODAS as plataformas, inclusive as duas que anexaram.
    #
    # Um manifesto parcial é honesto (ele DIZ o que não cobre); um manifesto
    # ausente desliga a conferência de todo mundo.
    #
    # Tirar o `needs:` não tira a espera, MOVE de onde ela vem: em vez de
    # esperar o JOB mais lento (que pode nem começar), este job espera os
    # ASSETS, com teto — ver o passo "Esperar a Release e os binários". Nada
    # do que ele FAZ muda: continua montando o manifesto a partir dos assets
    # da Release, assinando keyless e verificando antes de anexar.
    #
    # E NUNCA em ensaio (dispatch com `tag` vazia): não há Release a que
    # anexar nem manifesto a assinar. A condição é de JOB e lê `inputs`
    # direto — `steps.alvo` é do próprio job e não alcança este nível.
    if: github.event_name != 'workflow_dispatch' || inputs.tag != ''
    runs-on: ubuntu-latest
    # 600s de espera pela Release + 1200s pelos binários + o trabalho em si.
    # Era 10 — que bastava enquanto o `needs:` fazia a espera por fora.
    timeout-minutes: 40
    permissions:
      contents: write # anexar o manifesto e o bundle à Release
      id-token: write # assinar keyless (a identidade é ESTE workflow)
    env:
      # Os cinco alvos da matriz acima. Escrito aqui de novo, de propósito: é
      # contra ESTA lista que a ausência é declarada, e uma lista derivada do
      # que foi baixado nunca acusaria falta nenhuma. No JOB e não no passo
      # porque agora são DOIS passos que a leem — quem espera e quem declara —,
      # e duas cópias divergiriam no dia em que a matriz mudasse.
      ALVOS_ESPERADOS: 'linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64'
    steps:
      - name: Qual tag
        id: alvo
        env:
          ENTRADA: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ] && [ -z "$ENTRADA" ]; then
            # ENSAIO (ver o job `build`): não há manifesto a assinar nem
            # Release a que anexar. O job inteiro é pulado logo abaixo.
            echo 'ensaio=true' >> "$GITHUB_OUTPUT"
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            tag="$ENTRADA"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo 'ensaio=false' >> "$GITHUB_OUTPUT"
          echo "ref=$tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # O checkout existe por UM motivo: o `install.sh` desta tag entra no
      # manifesto. Sem ele, o script não teria contra o que conferir a si
      # mesmo, e a verificação de origem da RN-526 seria letra morta.
      - name: Checkout na tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.alvo.outputs.ref }}

      - name: Instalar o cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Node só para `scripts/ci/assets-do-instalador.ts` (ADR 0160), que diz
      # QUAIS arquivos do checkout viram asset e com que nome. O `node` que o
      # `ubuntu-latest` traz não executa `.ts` por type stripping; a versão é a
      # MESMA do job `build`, e nada aqui roda `pnpm install` — o script não
      # tem dependência de pacote de propósito.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # A espera que o `needs: build` fazia, agora com TETO e olhando o que
      # importa: os ASSETS, não os jobs.
      #
      # São duas esperas com desfechos DIFERENTES, e é por isso que são dois
      # laços e não um:
      #
      # 1. A Release. Ausência PERMANENTE aqui é erro — este workflow só
      #    ANEXA, nunca cria (a mesma regra e o mesmo teto do passo "Anexar à
      #    GitHub Release" do job `build`, medido contra os ~4min que o
      #    `release.yml` leva).
      # 2. Os binários. Ausência aqui é ESPERADA e não é erro: é justamente o
      #    caso que o manifesto sabe declarar. O laço PARA cedo quando os
      #    cinco chegam — que é o caminho feliz e o mais rápido — e desiste no
      #    teto quando algum não chega.
      #
      # O teto dos binários é 1200s = os `timeout-minutes: 20` do próprio job
      # `build`, e o número não é arbitrário: 20min é o máximo que um alvo com
      # runner pode DEMORAR depois de começar. O que ele não cobre é o tempo
      # de FILA — e não cobrir tempo de fila é exatamente o ponto. Medido: os
      # quatro alvos que recebem runner terminam em ≤ 4m18s.
      #
      # Um alvo que anexe DEPOIS disto não fica órfão: `gh release upload
      # --clobber` no passo seguinte já existe para isso, e refazer o
      # manifesto é um `workflow_dispatch` com a mesma tag.
      - name: Esperar a Release e os binários
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.alvo.outputs.tag }}
          ESPERA_MAXIMA_DA_RELEASE_SEGUNDOS: '600'
          ESPERA_MAXIMA_DOS_BINARIOS_SEGUNDOS: '1200'
          INTERVALO_SEGUNDOS: '15'
        run: |
          set -euo pipefail

          limite=$(( SECONDS + ESPERA_MAXIMA_DA_RELEASE_SEGUNDOS ))
          until gh release view "$TAG" >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$limite" ]; then
              echo "::error::a Release de $TAG não existe depois de ${ESPERA_MAXIMA_DA_RELEASE_SEGUNDOS}s de espera — este workflow só ANEXA a uma Release existente, nunca cria uma."
              exit 1
            fi
            echo "a Release de $TAG ainda não existe; nova tentativa em ${INTERVALO_SEGUNDOS}s."
            sleep "$INTERVALO_SEGUNDOS"
          done

          limite=$(( SECONDS + ESPERA_MAXIMA_DOS_BINARIOS_SEGUNDOS ))
          while :; do
            anexados="$(gh release view "$TAG" --json assets --jq '.assets[].name' || true)"
            faltando=''
            for alvo in $ALVOS_ESPERADOS; do
              if ! printf '%s\n' "$anexados" | grep -q "^brabo-runner-${alvo}"; then
                faltando="${faltando} ${alvo}"
              fi
            done

            if [ -z "${faltando# }" ]; then
              echo "os $(echo "$ALVOS_ESPERADOS" | wc -w) alvos estão anexados a $TAG."
              break
            fi

            if [ "$SECONDS" -ge "$limite" ]; then
              echo "::notice::teto de ${ESPERA_MAXIMA_DOS_BINARIOS_SEGUNDOS}s atingido esperando:${faltando}. O manifesto sai com o que existe e DIZ o que não cobre."
              break
            fi

            echo "ainda faltam:${faltando}; nova tentativa em ${INTERVALO_SEGUNDOS}s."
            sleep "$INTERVALO_SEGUNDOS"
          done

      - name: Gerar, assinar e anexar o checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.alvo.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p artefatos && cd artefatos

          # Baixa o que ESTÁ anexado. `|| true`: Release sem nenhum binário é
          # um desfecho tratado embaixo, com mensagem própria — não um erro de
          # download.
          gh release download "$TAG" --pattern 'brabo-runner-*' --dir . || true

          # O `install.sh` entra no manifesto e na Release, e sem isso a
          # verificação que ele faz de SI MESMO seria impossível: ele confere o
          # próprio hash contra este arquivo (RN-526). Vem do checkout desta
          # tag, não de download — é o mesmo commit que produziu tudo o mais
          # que está sendo assinado aqui.
          cp "${GITHUB_WORKSPACE}/install.sh" .

          # Os arquivos que o `install.sh` baixa para SUBIR a instalação
          # (ADR 0160, RN-570): o compose e o que ele monta. Entram no MESMO
          # manifesto, e é isso que dá a eles a mesma cadeia do binário — o
          # instalador os confere contra este arquivo antes de gravar qualquer
          # coisa. Até aqui ele usava um caminho relativo que nada trazia, e a
          # instalação morria depois do `.env`. Vêm do checkout DESTA tag, pelo
          # motivo do `install.sh` acima; a tabela nome-do-asset -> caminho mora
          # no script, e o `stdout` dele é um nome por linha.
          ASSETS_DO_INSTALADOR="$(node "${GITHUB_WORKSPACE}/scripts/ci/assets-do-instalador.ts" preparar "${GITHUB_WORKSPACE}" .)"
          [ -n "$ASSETS_DO_INSTALADOR" ] \
            || { echo "::error::nenhum asset do instalador preparado — sem eles o install.sh desta tag recusa em toda máquina."; exit 1; }

          presentes=''
          faltando=''
          for alvo in $ALVOS_ESPERADOS; do
            if ls "brabo-runner-${alvo}"* >/dev/null 2>&1; then
              presentes="${presentes} ${alvo}"
            else
              faltando="${faltando} ${alvo}"
            fi
          done

          if [ -z "${presentes# }" ]; then
            echo "::error::nenhum binário anexado a $TAG — não há o que assinar. O manifesto NÃO é criado vazio: um checksums.txt sem linhas afirmaria que a release não tem binários, quando o que houve foi a matriz inteira falhar."
            exit 1
          fi

          # O manifesto DIZ o que cobre. Um checksums que lista quatro e cala
          # sobre o quinto é pior que nenhum: quem verifica os quatro conclui
          # que verificou a release.
          # `$ASSETS_DO_INSTALADOR` sem aspas de propósito: é uma lista, um nome
          # por linha, e nenhum nome tem espaço (o script recusa a tabela que
          # tiver).
          # shellcheck disable=SC2086
          sha256sum brabo-runner-* install.sh $ASSETS_DO_INSTALADOR > checksums.txt
          echo "cobre:${presentes}" >&2
          if [ -n "${faltando# }" ]; then
            echo "::warning::o manifesto NÃO cobre:${faltando} — esses alvos não têm binário anexado a $TAG."
          fi

          # `sign-blob` (e não `sign`, que é de imagem OCI). O bundle carrega
          # assinatura, certificado e a prova de inclusão no log de
          # transparência num arquivo só — é o que torna a verificação
          # possível sem consultar o Rekor na hora.
          cosign sign-blob --yes --bundle checksums.txt.bundle checksums.txt

          # Verifica AQUI, antes de anexar. Assinatura que ninguém tenta
          # verificar é um arquivo a mais na Release, e a falha apareceria só
          # na máquina de quem instala.
          cosign verify-blob \
            --bundle checksums.txt.bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/build-runner-binaries\.yml@" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            checksums.txt

          # E cada linha do manifesto contra o arquivo que ele descreve, no
          # mesmo run. A assinatura prova quem escreveu o manifesto; isto prova
          # que o que vai ser anexado é o que ele diz — binários, `install.sh`
          # e os assets do instalador. `--strict` reprova linha malformada em
          # vez de pulá-la.
          sha256sum -c --strict checksums.txt

          # `--clobber`: este job pode reexecutar por dispatch depois de um
          # alvo ser reanexado, e aí o manifesto TEM de ser substituído — ao
          # contrário do binário, cujo passo é idempotente porque o mesmo
          # arquivo não muda.
          # shellcheck disable=SC2086
          gh release upload "$TAG" checksums.txt checksums.txt.bundle install.sh $ASSETS_DO_INSTALADOR --clobber
          echo "anexados: checksums.txt, checksums.txt.bundle, install.sh e os assets do instalador -> $TAG"
