      type: object
      properties:
        id:
          type: string
          example: 01JC4Z0000HANDOFF00000000001
        sessionId:
          type: string
          example: 01JC4Z8QK3M7YV2N5T9B0PXHRA
        projectId:
          type: string
          example: 01JC4Z0000PROJETO0000000001
        fromAgent:
          type: string
          example: criativo
          description: Slug do agente que passou o bastão.
        toAgent:
          type: string
          example: po
          description: Slug do agente que recebe.
        artifactId:
          type: object
          example: 01JC4Z0000ARTEFATO000000001
          nullable: true
          description: Artefato que motivou o handoff (product_brief, module_map…).
        status:
          type: string
          enum:
            - offered
            - accepted
            - completed
            - rejected
            - superseded
          example: offered
          description: >-
            Este campo é MUTÁVEL — é o estado corrente. Cada transição também
            vira um evento `handoff.*` imutável no log, que é onde o histórico
            mora. `superseded` (ADR 0182, RN-635): a oferta deixou de ser a
            corrente — o agente alvo foi ativado por outro caminho, ou uma
            oferta mais nova ao mesmo alvo no projeto a substituiu
            (`handoff.superseded`). Só `offered` pode ser aceita.
