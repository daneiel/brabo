# O tema de cada ADR — e a lista fechada de temas (ADR 0202, AT-137).
#
# O tema mora AQUI, e não no ADR: ADR aceito NUNCA é editado, nem para ganhar
# frontmatter. `docs/adr/index.md` é agrupado por tema a partir deste arquivo,
# e `pnpm docs:check` (`scripts/docs/temas-de-adr.mjs`) reprova:
#   - ADR em `docs/adr/` sem tema aqui;
#   - tema citado em `adrs:` que não está em `temas:`;
#   - entrada em `adrs:` para ADR que não existe;
#   - tema da lista sem nenhum ADR;
#   - no índice: seção de tema ausente, fora da ordem desta lista, linha de ADR
#     sob a seção errada, fora de seção, repetida ou fora da ordem numérica.
#
# ADR novo: UMA linha em `adrs:` com UM tema (o principal — quando dois servem,
# vale aquele em que alguém procuraria primeiro), e a linha do índice na seção
# desse tema, em ordem numérica. Quem escreve o ADR propõe o tema; quem revisa
# o PR confirma. Tema NOVO é mudança desta lista, justificada no PR que o
# cria; passar de 15 temas exige ADR que revise o 0202.
#
# `titulo` é o cabeçalho da seção no índice (o índice está em inglês); `id` é a
# âncora (`{#tema-<id>}`) e o valor usado em `adrs:`.

temas:
  - id: git
    titulo: Git, repository and branch policy
    descricao: The git provider contract, the repository's birth and adoption, protection and the branch policy.
  - id: agentes
    titulo: Agent harness, turns and sessions
    descricao: How an agent runs — context, the tool loop, the conversational turn, the session and its states.
  - id: time
    titulo: The agent team — roles, areas and handoffs
    descricao: Which agents exist, what each delivers to whom, delegation inside an area and the handoff between them.
  - id: gates
    titulo: Gates, QA and security review
    descricao: The gate registry, the QA and SecOps verdicts and the golden-sets that measure them.
  - id: execucao
    titulo: Execution, terminal policy and approvals
    descricao: The dev agent at work, `proposed_action`, the terminal policy, path scope, auto mode and the absolute ceilings.
  - id: modos
    titulo: Where the code lives — execution modes
    descricao: The three execution modes, the user's folder, the projects base and converting a project between modes.
  - id: container
    titulo: Project container and broker
    descricao: The project container's lifecycle, the image decision, the Docker port and the broker that talks to the daemon.
  - id: runner
    titulo: The local runner
    descricao: The CLI on the user's machine — its channel, credentials, device keys, distribution, base and service.
  - id: iam
    titulo: Auth, access and secrets
    descricao: First-party auth, roles and their ceilings, workspace membership, cross-origin hardening and secret envelopes.
  - id: llm
    titulo: LLM providers, models and spend
    descricao: The provider contract, the model catalog and curation, model bindings, metering and budgets.
  - id: conhecimento
    titulo: RAG, knowledge graph and artifacts
    descricao: Chunks and hybrid search, its measurement, the Neo4j graph and the artifacts projected from the event log.
  - id: web
    titulo: Web UI and design system
    descricao: Screens, navigation, themes and the structure of the web app's largest files.
  - id: operacao
    titulo: Operation, deploy and installation
    descricao: Production images, Kubernetes, observability, backup, the dev compose and the one-line installer.
  - id: engenharia
    titulo: CI, release and supply chain
    descricao: The pipeline, the published images, signing, scanning, pinning, the test layers and the repository's own structure.
  - id: docs
    titulo: Documentation
    descricao: How documentation is generated, verified and published.

