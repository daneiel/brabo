    ProjectMirrorStateResponseDto:
      type: object
      properties:
        mirrorPath:
          type: object
          example: /home/you/mirrors/store
          nullable: true
          description: >-
            O destino declarado HOJE (`projects.mirror_path`, RN-515). `null`
            quer dizer que o projeto não tem espelho — o estado NORMAL, e o que
            faz a tela esconder esta linha inteira em vez de inventar uma
            ausência.
        status:
          type: string
          example: synced
          enum:
            - never
            - synced
            - failed
          description: >-
            `never` — nenhum runner relatou rodada ainda (não há linha).
            `synced` — a última rodada copiou; `filesCopied` pode ser `0`, que é
            "olhou e não havia nada a copiar" e tem frase própria. `failed` — a
            última rodada falhou, e o erro é mais novo que o último sucesso. A
            API deriva isto dos dois carimbos para a regra ter uma fonte; a tela
            ainda recebe os campos crus para escrever a frase.
        lastSyncedAt:
          type: object
          example: '2026-09-07T12:04:00.000Z'
          nullable: true
          description: >-
            A última sincronização BEM-SUCEDIDA. Uma falha posterior nunca a
            apaga — é a coisa mais útil que esta tela tem enquanto o espelho
            está quebrado.
        filesCopied:
          type: object
          example: 412
          nullable: true
        filesSkipped:
          type: object
          example: 3
          nullable: true
        filesRefused:
          type: object
          example: 0
          nullable: true
        lastDestination:
          type: object
          example: /home/you/mirrors/store
          nullable: true
          description: >-
            Onde a última rodada de fato escreveu — CONGELADO. Diverge de
            `mirrorPath` depois que alguém troca o destino, porque a concessão
            viaja no join e só muda quando o runner reconecta (RN-516).
        lastError:
          type: object
          example: null
          nullable: true
        lastErrorAt:
          type: object
          example: null
          nullable: true
      required:
        - mirrorPath
        - status
        - lastSyncedAt
        - filesCopied
        - filesSkipped
        - filesRefused
        - lastDestination
        - lastError
        - lastErrorAt
    ProjectResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z0000PROJETO0000000001
        workspaceId:
          type: string
          example: 01JC4Z0000WORKSPACE00000001
        name:
          type: string
          example: Checkout
        slug:
          type: string
          example: checkout
          description: Único dentro do workspace.
        workspaceDirName:
          type: string
          example: checkout-3f2b1c8e
          description: >-
            Nome da pasta física do workspace deste projeto em
            PROJECT_WORKSPACES_ROOT (RN-109). `<slug>-<8 id chars>` (8
            caracteres do id) em projeto novo; o UUID cru em projeto criado
            antes de esta coluna existir. Congelado na criação — editar `slug`
            depois não o recalcula.
        executionMode:
          type: string
          enum:
            - container
            - mounted
            - runner
          example: container
          description: >-
            ONDE o comando executa (RN-169/RN-421 — ADR 0072/0104). `container`:
            a pasta gerenciada em PROJECT_WORKSPACES_ROOT. `mounted`: a pasta do
            usuário em `workspacePath`, dentro de `BRABO_PROJECTS_BASE` e
            alcançada pelo bind-mount da base (ADR 0141). `runner`: a pasta do
            usuário confirmada pelo runner. `mounted` e `runner` relatam a
            confirmação em `workspaceVerifiedAt`.
        workspacePath:
          type: object
          example: null
          nullable: true
          description: >-
            O caminho absoluto da pasta do usuário — preenchido em
            `mounted`/`runner`, sempre `null` no modo `container`.
        workspaceVerifiedAt:
          type: object
          example: null
          nullable: true
          description: >-
            Quando o caminho foi confirmado em disco. `null` = ainda não
            verificado. Em `runner` a confirmação vem do CLI conectando
            (RN-423); em `mounted` é carimbada quando a Infra sobe o container e
            a pasta é materializada (RN-501, ADR 0142). `container` nunca
            preenche este campo. Registra UMA confirmação, nunca um batimento.
        mirrorPath:
          type: object
          example: null
          nullable: true
          description: >-
            O destino de espelho na máquina do USUÁRIO — a pasta FORA da base
            montada para onde o agente local copia o trabalho (RN-515, ADR
            0147). `null` quer dizer que o projeto não tem espelho, e esse é o
            estado NORMAL, nunca um erro. Só `mounted`/`runner` podem ter.
            Definido por `PUT /projects/:projectId/mirror-path`; vem junto em
            toda leitura do projeto para nada precisar de endpoint dedicado para
            conhecê-lo. O valor foi validado só LEXICAMENTE — se a pasta existe
            quem sabe é o agente local, não esta API.
        language:
          type: string
          example: pt-BR
          description: >-
            O idioma do PROJETO (RN-619): o idioma de tudo o que não tem autor
            humano — artefatos compartilhados (product brief, regras de negócio,
            ADRs) e turnos que ninguém digitou (kickoff, dev agents, gates,
            mensagens de commit, corpos de PR). Código BCP-47 canônico, lista
            aberta. Projeto novo começa com o idioma de resposta efetivo de quem
            o criou (RN-618). Definido por `PATCH /projects/:projectId`
            (`maintainer`). O engine o manda ao modelo como mensagem de sistema
            efêmera no fim de toda chamada de LLM de um turno sem autor humano
            (RN-622); artefato emitido durante o turno de uma pessoa continua
            seguindo o idioma de resposta dessa pessoa.
        createdBy:
          type: string
          example: 01JC4Z0000USUARIO0000000001
        taskBudgetMicros:
          type: object
          example: 500000
          nullable: true
          description: >-
            Teto de tokens por tarefa de dev agent, em micro-USD. `null` usa o
            padrão do domínio.
        maxConsecutiveBlocked:
          type: object
          example: 3
          nullable: true
          description: >-
            Circuit breaker por dev agent (Fase 12b — RN-047): tarefas
            consecutivas terminando bloqueadas antes de parar em idle_tripped.
            `null` usa o padrão do domínio.
        storyPromotion:
          type: string
          enum:
            - manual
            - auto
          example: auto
          description: >-
            Quem promove uma história para `ready` (Fase 12c — RN-048).
            `manual`: o PO propõe e o usuário decide. `auto`: promoção
            automática na criação — o padrão de projeto novo desde a RN-659;
            projetos criados antes mantêm o valor que tinham.
        createdAt:
          type: string
          example: '2026-07-21T11:00:00.000Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-21T11:00:00.000Z'
          format: date-time
      required:
        - id
        - workspaceId
        - name
        - slug
        - workspaceDirName
        - executionMode
        - workspacePath
        - workspaceVerifiedAt
        - mirrorPath
        - language
        - createdBy
        - taskBudgetMicros
        - maxConsecutiveBlocked
        - storyPromotion
        - createdAt
        - updatedAt
    ProjectsBaseResponseDto:
      type: object
      properties:
        projectsBase:
          type: object
          example: /home/voce/brabo
          nullable: true
          description: >-
            A única pasta do computador do operador que os containers do Brabo
            enxergam, montada por IDENTIDADE (`$X:$X`) em `api` e `engine` (ADR
            0141). `null` quer dizer que `BRABO_PROJECTS_BASE` não está
            definida: a instalação não oferece o modo Mounted, e o assistente de
            projeto não deve oferecê-lo. Nunca uma falha — ausente é estado
            normal.
        brokerConfigurado:
          type: boolean
          example: false
          description: >-
            Se esta instalação tem broker de container configurado (`BROKER_URL`
            definida, ADR 0130). Projetos `container` e `mounted` só sobem
            container pelo broker (ADR 0144), e sem ele todo dev agent fica
            bloqueado para sempre (ADR 0143). Com `false` o assistente de
            projeto não pré-seleciona Mounted, mantém Container e Mounted
            visíveis mas não selecionáveis com o motivo em texto, e
            pré-seleciona Runner (ADR 0161, RN-573). Diz que a variável existe,
            nunca que o broker responde. Configuração da instalação, como
            `projectsBase`: a mesma para todo workspace.
