# Overlay de produção.
#
# NÃO é exercitado por `make deploy-local` e nem poderia ser: depende de um
# Postgres gerenciado, de uma StorageClass RWX de verdade, de um provider de
# segredos real e de imagens num registry. O que o CI garante é que ele
# **monta** e que os manifests são válidos contra o schema — o resto é
# responsabilidade do ambiente.
#
# O pré-requisito que faltava (imagens publicadas por digest) foi atendido pelo
# ADR 0119: `release.yml` publica as quatro no GHCR a cada tag final e registra
# os digests em `.release/images.json`. Aplicar aqui é
# `make imagens-do-release OVERLAY=prod` — nunca à mão, e o resultado NÃO se
# commita: `kustomize edit` reescreve o arquivo inteiro (reordena as chaves e
# desloca estes comentários), e o repositório guarda o MARCADOR, não a release
# que estava em produção num dia específico.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: brabo

resources:
  - ../../base
  - ingress.yaml

patches:
  - path: patches.yaml
  # Substitui a regra de egress do banco herdada da base. Precisa ser PATCH e
  # não `resources`: declarar um recurso com o mesmo nome da base é conflito de
  # ID no kustomize, não substituição.
  - path: netpol-db-egress.yaml

configMapGenerator:
  - name: brabo-config
    behavior: merge
    literals:
      - PUBLIC_API_URL=https://api.brabo.example
      - PUBLIC_ENGINE_URL=https://engine.brabo.example
      - WEB_ORIGIN=https://app.brabo.example
      - PHX_HOST=engine.brabo.example
      - CSP_CONNECT_SRC=https://api.brabo.example https://engine.brabo.example wss://engine.brabo.example

images:
  # Tag mutável NÃO serve em produção: `:prod` apontando para conteúdo
  # diferente ao longo do tempo impede rollback determinístico e faz dois pods
  # do mesmo ReplicaSet rodarem binários diferentes. O valor abaixo é um
  # marcador — `make imagens-do-release` o substitui pelo `digest:` da release
  # escolhida, lendo `.release/images.json` (asset de toda release final).
  - name: brabo-api
    newName: ghcr.io/daneiel/brabo-api
    newTag: REPLACE_WITH_DIGEST
  - name: brabo-engine
    newName: ghcr.io/daneiel/brabo-engine
    newTag: REPLACE_WITH_DIGEST
  - name: brabo-web
    newName: ghcr.io/daneiel/brabo-web
    newTag: REPLACE_WITH_DIGEST
  # A QUARTA imagem. Ficava de fora, e o CronJob de backup herdava
  # `brabo-backup:prod` da base — nome que não existe em registry nenhum, então
  # o backup do ambiente que mais precisa dele nunca subiria. O `ci.yml` não
  # pegava isto porque só valida que o overlay MONTA.
  - name: brabo-backup
    newName: ghcr.io/daneiel/brabo-backup
    newTag: REPLACE_WITH_DIGEST
