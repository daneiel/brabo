    ResolvedBindingResponseDto:
      type: object
      properties:
        modelId:
          type: string
          example: 01JC4Z0000MODELO00000000001
        origin:
          type: string
          enum:
            - workspace
            - project
            - area
            - agent
            - session
          example: project
          description: >-
            De qual escopo veio o valor. A cascata é sessão → agente → projeto →
            workspace, e expor a ORIGEM é o que deixa a interface dizer "herdado
            do projeto" em vez de mostrar um valor sem procedência.
        routingPreference:
          type: string
          enum:
            - price
            - throughput
            - latency
          nullable: true
          example: null
          description: >-
            A preferência de roteamento DO BINDING QUE VENCEU a cascata (ADR
            0166). Ela nunca cascateia sozinha: nível pulado leva a preferência
            junto, e nenhum nível herda só a preferência de outro.
        skipped:
          description: >-
            Escopos mais específicos que a cascata descartou antes de chegar em
            `origin`. Vazio no caminho normal.
          type: array
          items:
            $ref: '#/components/schemas/SkippedBindingResponseDto'
        herdadoDoLead:
          type: string
          example: secops
          description: >-
            Presente quando o agente perguntado não tinha modelo próprio (nem da
            área nem do projeto) e herdou o binding RESOLVIDO do lead da área
            dele (RN-703). `origin` é então a origem do binding do lead.
      required:
        - modelId
        - origin
        - routingPreference
        - skipped
    ResultadoPorProviderResponseDto:
      type: object
      properties:
        provider:
          type: string
          enum:
            - ollama
            - anthropic
            - openai
            - openrouter
            - nvidia-nim
            - together
            - deepinfra
            - bitdeer
            - vultr
          example: openai
        descobertos:
          type: number
          example: 3
          description: >-
            Modelos que não existiam no banco. Entram INATIVOS — ativar é
