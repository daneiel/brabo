          type: string
          example: '2026-07-24T10:00:00.000Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-24T10:05:00.000Z'
          format: date-time
        desfecho:
          type: string
          enum:
            - criado
            - substituiu_oferta
            - ja_oferecido
          example: criado
          description: >-
            `criado`: uma oferta nova. `substituiu_oferta`: uma oferta nova, e
            a(s) pendente(s) ao mesmo alvo viraram `superseded`. `ja_oferecido`:
            nenhuma linha nova — a oferta pendente que já existia é devolvida
            (mesma sessão e nenhum artefato novo, ou `seAusente`).
      required:
        - id
        - sessionId
        - projectId
        - fromAgent
        - toAgent
        - artifactId
        - status
        - createdAt
        - updatedAt
        - desfecho
