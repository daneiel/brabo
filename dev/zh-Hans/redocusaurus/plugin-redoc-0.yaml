  /projects/{projectId}/sessions:
    get:
      description: 每个条目都带有 `technical`：仅当会话由仓库置备打开时为 `true`（从 `repo_bootstraps` 关联）。
      operationId: SessionsController_list
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionListItemResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目中的角色不足。
        '404':
          description: 项目或会话不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 列出项目的会话
      tags:
        - sessions
    post:
      description: >-
        会话以 `created` 状态诞生，是代理所做一切的容器：事件日志、提议的操作和 token 预算都挂在它上面。`kind`
        是必需的并会被记录：`consultiva`（咨询式）只对话，`criativa`（创作式）产出内容，并且是唯一接受
        `execution.activated` 的。
      operationId: SessionsController_create
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '400':
          description: 请求体缺少 `kind`，或其值不在允许列表中。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目中的角色不足。
        '404':
          description: 项目或会话不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 在项目中打开一个会话
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}:
    get:
      operationId: SessionsController_get
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
