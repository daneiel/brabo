  /projects/{projectId}/sessions/{sessionId}/model-binding:
    get:
      description: >-
        Возвращает binding, РАЗРЕШЁННЫЙ каскадом, а не сырой binding сессии:
        сессия без собственного binding использует binding проекта, и ответ
        `null` здесь был бы неверным ответом на верный вопрос. Поле `origin`
        говорит, из какой области действия пришло значение.


        `agentId` необязателен и является агентом, ДЕЙСТВИТЕЛЬНО активным в
        сессии прямо сейчас (тем же, что использует `RunLlmTurnUseCase` для
        выполнения хода), — без него каскад видит только сессия→проект→рабочее
        пространство (плюс фиксированный откат к Креативу) и никогда не отражает
        PO/Архитектора/Dev Lead/область после handoff.
      operationId: ModelBindingsController_getSessionBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: agentId
          required: false
          in: query
          description: >-
            Агент, активный в этой сессии в данный момент (например, "po",
            "arquiteto", "dev-lead").
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedBindingResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в области действия.
        '404':
          description: Область действия не найдена.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Определяет, какую модель использует сессия и откуда она взялась
      tags:
        - llm
    put:
      description: Побеждает всё остальное в каскаде, пока живёт сессия.
      operationId: ModelBindingsController_setSessionBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModelBindingDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelBindingResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в области действия.
        '404':
          description: Область действия не найдена.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Закрепляет модель для этой сессии
      tags:
        - llm
  /projects/{projectId}/sessions/{sessionId}/psychologist/reanalyze:
    post:
      description: >-
        Требует `maintainer`, а не `developer`, потому что снова запускает
        ToolLoop и ТРАТИТ реальный бюджет — в отличие от принятия или
        отклонения, которые лишь меняют локальное состояние. Предыдущий анализ
        помечается как замещённый.
      operationId: PsychologistController_reanalyze
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, сессия или гипотеза не существуют.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
        '503':
          description: >-
            Психолог глобально отключён по решению пользователя (не ошибка) —
            тело с `reason: "psychologist_disabled"`.
      security:
        - bearer: []
      summary: Запускает повторный анализ сессии
      tags:
        - psychologist
  /projects/{projectId}/sessions/{sessionId}/readiness:
    post:
      description: >-
        Это кнопка, запускающая `product_brief` и handoff к PO. Записывает
        `readiness.confirmed` в журнал событий. Возвращается при ПРИНЯТИИ, до
        окончания хода агента (ADR 0163): ход продолжается в engine, а его ход,
        завершение и сбои приходят через канал сессии и журнал событий
        (`agent.status`, `agent.response`, `agent.error`) — никогда через этот
        ответ.
      operationId: AgentsController_readiness
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, сессия или handoff не найдены.
        '409':
          description: >-
            Креатив всё ещё посреди хода — подтверждение записано, но brief не
            начался (ADR 0163).
        '422':
          description: >-
            В этом разговоре не было собрано ни одного бизнес-правила — пока
            нечего консолидировать в brief (ADR 0163).
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Подтверждает, что сессия исследования с Креативом завершена
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/reopen:
    post:
      description: >-
        Повторно открываются только `closed`/`closed_abnormally`, и только в
        `active` — `closing` никогда не возвращается (ADR 0183). Сессия
        сохраняет журнал событий, артефакты, отвеченные вопросы и handoff;
        `kind` не затрагивается. НОВОЕ событие `session.reopened` записывает
        прежние `closedAt` и `terminationReason`, которые строка очищает.
        Сессия, несущая `execution.activated`, отклоняется
        (`sessao_com_execucao`): откройте новую сессию и активируйте выполнение
        там. Без ограничения по времени. Требует `developer` (ADR 0184).
      operationId: SessionsController_reopen
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект или сессия не существуют.
        '409':
          description: >-
            Сессия не закрыта (`reason: sessao_nao_encerrada`) или активировала
            выполнение (`reason: sessao_com_execucao`).
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Повторно открывает закрытую сессию, сохраняя всё, что в ней было
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}/response-language:
