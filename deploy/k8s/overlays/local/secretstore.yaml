# SecretStore do ambiente local.
#
# É o ÚNICO recurso que muda entre local e produção no caminho dos segredos: os
# `ExternalSecret` da base ficam idênticos, e só a fonte varia. Aqui a fonte é
# um Secret chamado `brabo` que o `bootstrap.sh` cria de forma IMPERATIVA, com
# valores de `openssl rand` (`kubectl create secret`) — nunca versionado, nunca
# em manifesto. Em staging/prod o mesmo `ExternalSecret` aponta para o provider
# de verdade.
#
# Fallback sealed-secrets: ver docs/runbook.md (seção "Deploy local").
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brabo-secret-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: brabo-secret-reader
rules:
  # Escopo mínimo: ler UM secret nomeado, não "secrets" do namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["brabo"]
    verbs: ["get"]
  # O provider kubernetes do ESO faz SelfSubjectRulesReview para checar o
  # próprio acesso antes de ler.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: brabo-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: brabo-secret-reader
subjects:
  - kind: ServiceAccount
    name: brabo-secret-reader
    namespace: brabo
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: brabo-secret-store
spec:
  provider:
    kubernetes:
      remoteNamespace: brabo
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: brabo-secret-reader
