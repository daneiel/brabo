<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      As fontes são AUTO-HOSPEDADAS em `/fonts/`, declaradas por `@font-face` em
      `src/index.css` (ADR 0036). Havia aqui um `preconnect` + `<link>` para um
      CDN de fontes que a CSP do nginx bloqueava em produção — `style-src 'self'`
      e `font-src 'self' data:` não o incluem, então as três famílias caíam em
      fonte de sistema e a distinção entre título e corpo desaparecia.

      Este comentário evita citar o hostname de propósito: o vite preserva
      comentários no index.html publicado, e o `Dockerfile.prod` reprova a imagem
      se ele aparecer lá.

      O preload abaixo é dos dois arquivos que TODA tela usa no primeiro paint;
      os demais subsets e o mono carregam por demanda do `unicode-range`.
    -->
    <link
      rel="preload"
      href="/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Brabo</title>
    <!--
      Configuração de runtime: o entrypoint do nginx gera este arquivo a partir
      das variáveis de ambiente do container, para que a MESMA imagem sirva
      qualquer ambiente (ver src/lib/runtime-config.ts). Precisa ser síncrono e
      vir antes do bundle. Em `pnpm dev:web` o arquivo não existe e o 404 é
      inofensivo: a app cai no fallback das VITE_*.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
