        ВЛАДЕЛЬЦУ рабочего пространства (RN-058), — тот, кто оплачивает счёт,
        должен видеть счёт. Группирует по провайдеру, потому что это единица
        учётных данных, и отделяет то, что ушло через АГЕНТА, от того, что ушло
        через человека в чате: оба выходят из одного ключа и отвечают на разные
