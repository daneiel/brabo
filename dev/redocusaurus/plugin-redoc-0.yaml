    MensagemAoAgenteResponseDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
          description: Sempre `true`; falha vira erro HTTP.
        mensagemId:
          type: string
          example: 01JC4Z0000EVENTO000000000001
          description: >-
