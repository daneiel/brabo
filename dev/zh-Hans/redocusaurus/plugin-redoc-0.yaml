          nullable: true
          example: broker-nao-configurado
          description: >-
            当观测确实发生时为
            `null`——包括返回为空的情况，那是“我看过了，没有容器”的肯定陈述。无法查看时填写，并说明原因。在这里继承登记状态正是
            RN-468 所禁止的。
        detalheDaObservacao:
          type: object
          nullable: true
          example: null
          description: broker 自己的消息（如有）。
      required:
        - status
        - imageVersion
        - resources
        - failureReason
        - createdAt
        - statusChangedAt
        - observado
        - naoObservado
        - detalheDaObservacao
