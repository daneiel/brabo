      properties:
        keys:
          description: Активные публичные ключи Ed25519. Два во время ротации.
          type: array
          items:
            type: object
      required:
        - keys
    LlmMessageResponseDto:
      type: object
      properties:
        role:
          type: string
          example: assistant
          enum:
            - assistant
        content:
          type: string
          example: I'll read the file before answering.
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCallResponseDto'
      required:
        - role
        - content
        - toolCalls
    LLMProviderCapabilitiesResponseDto:
      type: object
      properties:
        streaming:
          type: boolean
          example: true
        toolCalling:
          type: boolean
          example: true
        listModels:
          type: boolean
          example: true
          description: >-
            Провайдер может ПЕРЕЧИСЛИТЬ собственный каталог (синхронизация
            каталога).
        embeddings:
          type: boolean
          example: false
          description: Текст → вектор (ADR 0075). `true` только при доказательстве.
        routingPreference:
          type: boolean
          example: false
          description: >-
            Провайдер принимает ПРЕДПОЧТЕНИЕ МАРШРУТИЗАЦИИ (`price`,
            `throughput`, `latency`) для выбора среди upstream, обслуживающих
            одну и ту же модель (ADR 0166). `true` только после того, как smoke
            против реального API вернул выбранный upstream, — чтение
            документации не считается.
        stickySession:
          type: boolean
          example: false
          description: >-
            The provider pins a conversation to the upstream that served it when
            given a session key (ADR 0221). Only `true` after a smoke against
            the real API showed one upstream with the key and several without
            it.
        promptCaching:
          type: boolean
          example: false
          description: >-
            Провайдер принимает явные точки PROMPT-CACHE (`cache_control`) на
            стабильном префиксе вызова (RN-892). `true` только после того, как
            smoke против реального API показал закешированные входные токены при
            повторном вызове.
      required:
        - streaming
        - toolCalling
        - listModels
        - embeddings
        - routingPreference
        - stickySession
        - promptCaching
    LlmTurnResponseDto:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/LlmMessageResponseDto'
        usage:
          $ref: '#/components/schemas/LlmUsageResponseDto'
        error:
          type: object
          example: null
          nullable: true
          description: >-
            Сбой провайдера. Приходит в ТЕЛЕ с 200, а не как ошибка HTTP, потому
            что учёт в `usage` остаётся действительным — ход потратил, даже
            завершаясь сбоем.
        errorCode:
          type: object
          example: null
          nullable: true
          description: >-
            Нормализованный `code` сбоя провайдера (ADR 0041) — `auth`,
            `rate_limit`, `insufficient_credit` (HTTP 402, RN-730),
            `model_not_found`, `context_length`, `timeout`, `connection` или
            `upstream`. `null` без ошибки или когда ошибка не от провайдера
            (бюджет, отсутствующий binding). Решайте по нему, никогда по тексту
            `error`.
        modelName:
          type: object
          example: llama3.2:3b
          nullable: true
          description: >-
            Имя модели, сгенерировавшей ответ (вывод из проблемы 2), — `null`,
            когда ход завершился сбоем до разрешения модели (нет binding или
            binding на несуществующую модель).
        truncated:
          type: boolean
          enum:
            - true
          description: >-
            Присутствует (всегда `true`) только когда провайдер обрезал ответ на
            лимите вывода (`finish_reason: "length"` / `stop_reason:
            "max_tokens"`, RN-737): текст и аргументы `toolCalls` усечены.
            Engine отказывается выполнять усечённый вызов инструмента и сообщает
            об обрезке.
        toolRouting:
          description: >-
            Шаг, на котором Jev выбрал инструмент (ADR 0179, RN-625).
            Отсутствует, когда маршрутизатор не запрашивался (провайдер не
            OpenRouter, меньше двух инструментов, переключатель рабочего
            пространства выключен). Engine сообщает об этом как
            `tool_router.decided`.
          allOf:
            - $ref: '#/components/schemas/ToolRoutingResponseDto'
      required:
        - message
        - usage
        - error
        - errorCode
        - modelName
    LlmTurnStreamEventResponseDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - delta
            - done
            - error
          example: delta
          description: >-
            `delta` несёт `text`; `done` закрывает поток с `usage`; `error`
            несёт `message`.
        text:
          type: string
          example: I'll read the
        usage:
          $ref: '#/components/schemas/LlmUsageResponseDto'
        message:
          type: string
          example: provider unavailable
        modelName:
          type: object
          example: llama3.2:3b
          nullable: true
          description: >-
            Только в кадре `done`/`final` — имя модели, сгенерировавшей ответ
            (вывод из проблемы 2). `null`, когда ход завершился сбоем до
            разрешения модели.
        truncated:
          type: boolean
          enum:
            - true
          description: >-
            Только в кадре `final`, и только когда провайдер обрезал ответ на
            лимите вывода (RN-737).
      required:
        - type
    LlmUsageResponseDto:
      type: object
      properties:
        inputTokens:
          type: number
          example: 1820
        outputTokens:
          type: number
          example: 340
        costMicros:
          type: number
          example: 52700
          description: >-
            Стоимость в микро-USD: РЕАЛЬНАЯ стоимость, которую вернул провайдер,
            если вернул (`usage.cost` у OpenRouter), иначе замороженная цена
            каталога (ADR 0188, RN-665).
        estimated:
          type: boolean
          example: false
          description: >-
            `true`, когда провайдер не вернул счётчик и стоимость была ОЦЕНЕНА.
            Число стоит меньше, и потребитель должен уметь об этом сказать.
      required:
        - inputTokens
        - outputTokens
        - costMicros
        - estimated
    LocalFolderFileDto:
      type: object
      properties:
        path:
          type: string
          example: src/domain/rag/chunking.ts
          description: >-
            Относительный путь внутри выбранной папки — никогда не абсолютный,
            никогда не `..`.
        content:
          type: string
          description: Простой текст UTF-8 — никогда не base64.
      required:
        - path
        - content
    LocalizacaoDoProjetoResponseDto:
      type: object
      properties:
        tipo:
          type: string
          enum:
            - gerenciada
            - montada
            - indisponivel
          example: gerenciada
          description: >-
            Какой из корней broker разрешает эту папку. `gerenciada` →
            `PROJECT_WORKSPACES_HOST_ROOT` (папка, управляемая продуктом,
            названная по `workspaceDirName`); `montada` →
            `BRABO_PROJECTS_HOST_BASE` (единая база проектов Mounted, ADR 0141);
            `indisponivel` → ни один корень этого сервера до неё не достаёт, и
            `motivo` говорит почему. Три состояния, а не два: проекты `runner` и
            устаревшие проекты `mounted`, созданные вне базы, — это отказы с
            РАЗНЫМИ способами исправления, и их слияние в null заставило бы
            вызывающего гадать, какой он получил.
        segmento:
          type: string
          example: loja
          description: >-
            Часть, которую корень broker НЕ покрывает, присоединяемая к нему как
            `<root>/<segmento>`. Для `gerenciada` это `workspaceDirName`; для
            `montada` — ОТНОСИТЕЛЬНЫЙ путь внутри базы (может содержать `/`).
            ОТСУТСТВУЕТ — а не null, — когда `tipo` равен `indisponivel`: два
            варианта — дискриминированное объединение на стороне api, и протокол
            говорит то же самое, поэтому вызывающий, читающий `segmento` без
            проверки `tipo`, ломается громко, а не составляет `<root>/null`.
        motivo:
          type: string
          example: o projeto está no modo "runner"…
          description: >-
            Почему ни один корень не достаёт до этой папки. Присутствует только
            когда `tipo` равен `indisponivel`. Это сообщение, предназначенное
            для передачи тому, кто управляет, поэтому оно называет режим или
            базу.
      required:
        - tipo
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: fulano@brabo.dev
        senha:
          type: string
          example: correct horse battery staple
      required:
        - email
        - senha
    MachineDeviceKeyInternalDto:
      type: object
      properties:
        name:
          type: string
          example: servidor-de-casa
          description: >-
            Имя, чтобы человек потом узнал эту МАШИНУ в списке ключей устройств
            каждого проекта, который она обслуживает. Не уникально. Установщик
            предлагает hostname; api ничего из него здесь не выводит.
        publicKeyJwk:
          type: string
          example: '{"kty":"OKP","crv":"Ed25519","x":"…"}'
          description: >-
            ПУБЛИЧНЫЙ JWK Ed25519 (RFC 8037), сериализованный как JSON. Пара
            генерируется на машине, и приватная половина никогда не передаётся —
            JWK с `d` отклоняется с 400 с указанием этого и никогда не
            сохраняется.
      required:
        - name
        - publicKeyJwk
    MachineDeviceKeyInternalResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 01JC4Z0000CHAVE000000000001
          description: >-
            Id регистрации. Запишите его в ПРИВАТНЫЙ JWK как `kid` перед
            сохранением файла (RN-475): это единственная связь между ключом на
            диске и публичной половиной на сервере, и каждый последующий шаг
            лишь передаёт его дальше.
        userId:
          type: string
          format: uuid
          example: 01JC4Z0000USUARIO0000000001
          description: >-
            Владелец, которого ОПРЕДЕЛИЛА api, — единственный пользователь
            установки. Вызывающий его не выбирает и не отправляет; это поле
            здесь, чтобы установщик мог сверить его с только что созданной
            учётной записью, а не предполагать.
        name:
          type: string
          example: servidor-de-casa
        createdAt:
          type: string
          example: '2026-09-12T12:00:00.000Z'
          format: date-time
        replacedKeyIds:
          example: []
          description: >-
            Id МАШИННЫХ ключей, которые этот ЗАМЕНИЛ, — отозваны в той же
            транзакции. Пусто — обычный случай (новая установка). Непусто
            означает, что локальный агент, всё ещё держащий один из них,
            перестаёт получать тикеты, и установщик должен об этом сказать, а не
            оставлять это на обнаружение. Ключи проекта (ADR 0118) никогда не
            затрагиваются.
          type: array
          items:
            type: string
      required:
        - id
        - userId
        - name
        - createdAt
        - replacedKeyIds
    MarkTaskInternalDto:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
          example: 01JC4Z0000PROJETO0000000001
        agentId:
          type: string
          example: dev-api
          description: Двигать задачу может только агент, который её забрал.
        status:
          type: string
          enum:
            - todo
            - in_progress
            - in_review
            - done
          example: in_review
      required:
        - projectId
        - agentId
        - status
    MensagemAoAgenteResponseDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
          description: Всегда `true`; сбой становится ошибкой HTTP.
        mensagemId:
          type: string
          example: 01JC4Z0000EVENTO000000000001
          description: >-
            Id события `chat.message`, записанного для этого сообщения, — id,
            которым его отменяют, пока оно ждёт в очереди.
        entrega:
          type: string
          enum:
            - lida
            - enfileirada
          example: enfileirada
          description: >-
            `lida`: агент сразу начал с ним ход. `enfileirada`: агент был
            посреди хода, поэтому сообщение попало в его очередь и будет
            прочитано вместе с другими поставленными в очередь за ОДИН ход,
            когда текущий закончится (RN-673). Журнал сессии несёт
            `chat.message_queued` / `chat.message_delivered` /
            `chat.message_cancelled`.
        posicao:
          type: number
          example: 2
          description: >-
            Позиция в очереди (1 = следующее). Присутствует, только когда
            `entrega` равен `enfileirada`.
      required:
        - ok
        - mensagemId
        - entrega
    MirrorSyncResultInternalDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
          description: >-
            РЕАЛЬНЫЙ исход копирования, сообщённый локальным агентом после
            завершения, — никогда не оптимистичное «ok» до окончания раунда.
        destination:
          type: string
          example: /home/you/mirrors/store
          description: >-
            Назначение, которое раунд фактически разрешил (успех) или пытался
            использовать (сбой), на машине ПОЛЬЗОВАТЕЛЯ. ЗАМОРОЖЕНО в строке:
            показ текущего назначения проекта рядом со вчерашней копией был бы
            утверждением экрана о папке, которой тот раунд не касался. Опущено,
            когда сбой касается самого назначения.
        filesCopied:
          type: number
          example: 412
          description: >-
            Обычные файлы, скопированные в этом раунде. `0` — это число, а не
            отсутствие: «синхронизировано и ничего не скопировано» — отдельное
            состояние (RN-088).
        filesSkipped:
          type: number
          example: 3
          description: >-
            Записи, перечисленные git, которые не являются обычными файлами, —
            вложенный репозиторий (worktree dev agent — один из них),
            символическая ссылка или файл, исчезнувший между перечислением и
            копированием.
        filesRefused:
          type: number
          example: 0
          description: >-
            Цели, отклонённые пофайловой защитой (символическая ссылка,
            выходящая за пределы назначения). Подсчитываются, никогда не
            замалчиваются.
        error:
          type: string
          example: >-
            o espelho não conseguiu listar o trabalho com o git: not a git
            repository
          description: >-
            ИМЕНОВАННОЕ сообщение о сбое. При большой длине хранится обрезанным,
            с указанием на обрезку. Оно никогда не стирает последнюю успешную
            синхронизацию — какая строка ТЕКУЩАЯ, решается сравнением двух меток
            времени.
      required:
        - ok
    MirrorSyncResultResponseDto:
      type: object
      properties:
        recorded:
          type: boolean
          example: true
        status:
          type: string
          example: synced
          enum:
            - never
            - synced
            - failed
          description: >-
            Какое из трёх состояний ТЕКУЩЕЕ после этой записи. `never` здесь
            недостижимо (каждая запись ставит одну из двух меток времени) и
            указано, потому что словарь тот же, что читает экран.
      required:
        - recorded
        - status
    ModelBindingResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z0000BINDING00000000001
        scope:
          type: string
          enum:
            - workspace
            - project
            - area
            - agent
            - session
          example: project
        scopeId:
          type: string
          example: 01JC4Z0000PROJETO0000000001
          description: >-
            Id рабочего пространства, проекта или сессии, к которым привязан
            binding. В областях действия `agent` и `area`, существующих НА
            ПРОЕКТ, он составной: `<projectId>:<agent slug|area key>` (ADR
            0064).
        modelId:
          type: string
          example: 01JC4Z0000MODELO00000000001
        routingPreference:
          type: string
          enum:
            - price
            - throughput
            - latency
          nullable: true
          example: null
          description: >-
            Как хаб выбирает upstream для этого binding (ADR 0166, RN-583).
            `null` = хаб решает сам. Задаётся только для провайдера,
            объявляющего возможность `routingPreference`.
        createdBy:
          type: string
          example: 01JC4Z0000USUARIO0000000001
        createdAt:
          type: string
          example: '2026-07-11T09:00:00.000Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-11T09:00:00.000Z'
          format: date-time
      required:
        - id
        - scope
        - scopeId
        - modelId
        - routingPreference
        - createdBy
        - createdAt
        - updatedAt
    ModelComCuradoriaResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z0000MODELO00000000001
        provider:
          type: string
          enum:
            - ollama
            - anthropic
            - openai
          example: anthropic
        name:
          type: string
          example: claude-opus-4-8
          description: Идентификатор у провайдера.
        displayName:
          type: string
          example: Claude Opus 4.8
        inputPricePerMillionMicros:
          type: number
          example: 15000000
          description: Цена за миллион ВХОДНЫХ токенов, в микро-USD.
        outputPricePerMillionMicros:
          type: number
          example: 75000000
          description: Цена за миллион ВЫХОДНЫХ токенов, в микро-USD.
        contextWindow:
          type: object
          example: 200000
          nullable: true
          description: Также возможность модели `context_length`.
        supportsToolCalling:
          type: boolean
          example: true
          description: >-
            НАТИВНЫЙ вызов инструментов. Без этого модель только для чата и не
            может быть привязана к агенту (RN-040).
        supportsStreaming:
          type: boolean
          example: true
        supportsVision:
          type: boolean
          example: false
          description: >-
            Принимает ИЗОБРАЖЕНИЕ на вход. `false` означает, что провайдер не
            объявил модальность, — а не что модель этого не умеет (ADR 0041).
        supportsReasoning:
          type: boolean
          example: true
          description: >-
            Принимает явное рассуждение (thinking). В OpenRouter берётся из
            `supported_parameters: reasoning`.
        generatesImage:
          type: boolean
          example: false
          description: >-
            ПРОИЗВОДИТ изображение — ось, отличная от приёма на вход. Это есть у
            немногих моделей, и смешение двух отправляет пользователя к неверной
            модели.
        manualPricing:
          type: boolean
          example: true
          description: >-
            Цена, введённая из документации провайдера, а не синхронизированная.
            Синхронизация цен не перезаписывает помеченную строку без явного
            решения.
        availability:
          type: string
          enum:
            - available
            - unavailable
          example: available
          description: >-
            УДАЛЁННАЯ реальность, наблюдаемая синхронизацией, ось, независимая
            от курации. `unavailable` — модель, исчезнувшая из каталога
            провайдера, — она никогда не удаляется, потому что на неё указывают
            binding и история затрат.
        lastSeenAt:
          type: object
          example: '2026-07-30T03:00:00.000Z'
          format: date-time
          nullable: true
          description: >-
            Последний раз, когда синхронизация видела модель в каталоге
            провайдера.
        createdAt:
          type: string
          example: '2026-07-01T00:00:00.000Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-01T00:00:00.000Z'
          format: date-time
        isActive:
          type: boolean
          example: true
          description: >-
            Курация ВЛАДЕЛЬЦЕМ **этого рабочего пространства**: деактивированная
            модель исчезает из селектора, но остаётся в исторических затратах. У
            модели, обнаруженной синхронизацией, нет строки курации, а
            отсутствие строки означает `false`.
        uses:
          type: array
          example:
            - codigo
          description: >-
            Для чего ЭТО рабочее пространство использует модель. Мнение
            оператора, а не возможность провайдера, — ни один каталог не
            публикует «хорош для кода». Пустой список означает «ни у кого нет
            мнения», а не «не подходит».
