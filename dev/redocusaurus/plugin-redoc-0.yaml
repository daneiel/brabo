    ProjectFoldersResponseDto:
      type: object
      properties:
        base:
          type: object
          example: /home/voce/brabo
          nullable: true
          description: >-
            A base de projetos montados desta instalação (`BRABO_PROJECTS_BASE`,
            ADR 0141) — o mesmo valor que `GET .../projects-base` devolve,
            repetido aqui para o cliente desenhar o caminho sem uma segunda
            chamada. `null` quer dizer que a instalação não oferece o modo
            Mounted.
        path:
          type: object
          example: /home/voce/brabo/clientes
          nullable: true
          description: >-
            A pasta de fato listada, normalizada. Igual a `base` quando o pedido
            omitiu `path`. `null` só quando não há base nenhuma: nada foi
            listado porque não há onde listar.
        entries:
          example:
            - api
            - loja
            - website
          description: >-
            Os nomes dos SUBDIRETÓRIOS diretamente sob `path`, ordenados, nunca
            recursivo. Arquivos, symlinks e entradas com ponto no início ficam
            de fora — ver `arquivos`, `simbolicos` e `truncado`.
          type: array
          items:
            type: string
        truncado:
          type: boolean
          example: false
          description: >-
            A pasta tem mais de 500 subdiretórios e só os 500 primeiros
            voltaram. A ordenação acontece ANTES do corte, então o corte é
            determinístico em vez de "o que o sistema de arquivos devolveu
            primeiro".
        arquivos:
          type: number
          example: 12
          description: >-
            Quantas entradas que não são diretório ficaram de fora. Uma pasta
            cheia de código não pode parecer vazia (RN-180).
        simbolicos:
          type: number
          example: 1
          description: >-
            Quantos symlinks ficaram de fora. O navegador nunca segue um — o
            link é relatado, nunca percorrido, então um link apontando para fora
            da base não é uma saída dela.
      required:
        - base
        - path
        - entries
        - truncado
        - arquivos
        - simbolicos
    ProjectGitRemoteResponseDto:
