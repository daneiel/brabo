    patch:
      description: >-
        Оба поля необязательны и независимы — отправка одного никогда не
        затрагивает другое, а тело без обоих — это 400. `locale` (интерфейс)
        остаётся ограниченным списком `pt-BR`/`en`. `responseLanguage` (RN-618)
        — это `automatico` или любой распознанный код BCP-47, хранимый в
        каноническом виде; нераспознанный код — это 400, и ничего из тела не
        записывается.
      operationId: UserPreferencesController_update
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPreferencesDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: >-
        Записывает язык интерфейса и/или язык ответов агентов
        аутентифицированного пользователя
      tags:
        - users
  /users/me/preferences/detected-language:
    post:
      description: >-
        Единственный способ, которым обнаруженный язык становится предпочтением
        (RN-624): одно лишь обнаружение никогда ничего не меняет. `confirm`
        записывает `detectedLanguage` + `detectedLanguageConfirmedAt`; `decline`
        записывает отказ, чтобы о том же языке больше не спрашивали. Возвращает
        предпочтения после ответа.
      operationId: UserPreferencesController_answerDetected
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerDetectedLanguageDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponseDto'
        '400':
          description: Код, не являющийся распознанным языком BCP-47.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '409':
          description: >-
            `deteccao_mudou`: при `confirm` ваши недавние сообщения больше не
            указывают на этот язык — ничего не записано.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Отвечает на вопрос об обнаруженном языке
      tags:
        - users
