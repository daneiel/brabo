    SessionResponseLanguageResponseDto:
      type: object
      properties:
        language:
          type: string
          example: pt-BR
          description: O idioma efetivo.
        origin:
          type: string
          enum:
            - sessao
            - conta
            - detectado
            - interface
          example: interface
          description: >-
            De onde veio `language`: `sessao` (fixado nesta sessão) > `conta`
            (escolha da Conta) > `detectado` (detectado E confirmado) >
            `interface` (o idioma da interface).
        sessionOverride:
          type: string
          nullable: true
          example: null
        account:
          type: string
          example: automatico
          description: '`automatico` ou o código escolhido na Conta.'
        detected:
          type: string
          nullable: true
          example: null
        interfaceLocale:
          type: string
          enum:
            - pt-BR
            - en
            - ru
            - zh-Hans
          example: pt-BR
        detectionQuestion:
          type: string
          nullable: true
          example: es
          description: >-
            O idioma para o qual as SUAS mensagens recentes apontam, quando a
            tela deveria PERGUNTAR se usá-lo nas respostas (RN-624) — `null`
            quer dizer sem pergunta. A detecção nunca muda a preferência
            sozinha: só responder `confirm` em `POST
            /users/me/preferences/detected-language` muda. Nunca é perguntado
            quando o idioma efetivo vem de uma escolha explícita (esta sessão ou
            a Conta), quando ele já é o detectado, ou quando você recusou este
            idioma antes. Melhor esforço: falha na detecção é `null`, nunca um
            erro desta rota.
      required:
        - language
        - origin
        - sessionOverride
        - account
        - detected
        - interfaceLocale
        - detectionQuestion
    SetAgentAutonomyDto:
      type: object
      properties:
        agentId:
          type: string
          example: dev-api
          description: Slug do agente.
        actionType:
          type: string
          enum:
            - terminal
            - git_commit
            - git_push
            - pr_open
            - spend
            - git_repo_create
            - git_branch_create
            - git_branch_protect
            - write_file
            - open_adr_pr
            - git_merge
            - open_infra_pr
            - instruction_patch
            - parallelize
            - raise_max_parallel
            - propose_execution_plan
            - assess_implementability
            - container_start
            - container_stop
            - container_remove
            - container_start_via_runner
            - '*'
          example: terminal
          description: >-
            Tipo de ação, ou `"*"` para TODO tipo de ação deste agente — o "modo
            automático" do ApprovalCard (RN-153). Regra ESPECÍFICA sempre vence
            a curinga: gravar `terminal: deny` com `"*": auto_approve` já ligado
            continua negando terminal.
        mode:
          type: string
          enum:
            - auto_approve
            - require_approval
            - deny
          example: auto_approve
          description: >-
            A autonomia deste agente para este tipo. NÃO sobrepõe o
            `permissions.json`: padrão em `deny` continua bloqueado por mais
            autonomia que o agente tenha.
      required:
        - agentId
        - actionType
        - mode
    SetAreaBudgetDto:
      type: object
      properties:
        limitUsd:
          type: object
          example: 20
          minimum: 0
          nullable: true
          description: >-
            Teto em DÓLARES para a área — a mesma convenção dólar na entrada,
            micro-USD na saída dos orçamentos de projeto/sessão
            (`BudgetsController`). `null` LIMPA o teto: a área volta a
            ilimitada, que também é o padrão de área que nunca teve um.
      required:
        - limitUsd
    SetMaxParallelDto:
      type: object
      properties:
        maxParallel:
          type: number
          example: 4
          minimum: 1
          description: >-
            Quantos agentes o lead da área pode ter na sessão SEM pedir a sua
            autorização. Mínimo 1 — zero não quer dizer "ilimitado", quer dizer
            configuração inválida, e tratá-lo como ilimitado transformaria um
            erro de digitação em gasto irrestrito.
      required:
        - maxParallel
    SetMirrorPathDto:
      type: object
      properties:
        mirrorPath:
          type: string
          nullable: true
          example: /home/you/mirrors/store
          description: >-
            O caminho absoluto, NA MÁQUINA DO USUÁRIO, para onde o agente local
            copia o trabalho do projeto (RN-515, ADR 0147). Mande `null` — a
            chave é OBRIGATÓRIA, omiti-la é 400 — para limpar o destino e
            desligar o espelho; `null` é o estado normal de um projeto, não um
            erro. Só projetos `mounted`/`runner` podem ter: em `container` a
            origem é um volume gerenciado do lado do servidor que o agente local
            não enxerga, e o pedido é recusado com 400 nomeando esse motivo. A
            API valida SÓ a forma LÉXICA (absoluto, sem `..`/`.`, nunca a raiz,
            pasta de sistema ou sobreposto ao próprio checkout do Brabo) mais os
            dois sentidos do laço origem↔destino (o destino não pode estar
            dentro de `workspacePath`, nem contê-lo) — nunca toca o disco,
            porque não enxerga a máquina onde o destino vai morar, exatamente
            como no modo `runner` (RN-423). Resolver symlinks é a metade da
            guarda do agente local, não esta.
      required:
        - mirrorPath
    SetModelBindingDto:
      type: object
      properties:
        modelId:
          type: string
          format: uuid
          example: 9b1c2d3e-4f50-4a61-8b72-0c3d4e5f6a7b
          description: Modelo a fixar neste escopo. Tem de existir em `GET /models`.
        routingPreference:
          type: string
          enum:
            - price
            - throughput
            - latency
          nullable: true
          example: throughput
          description: >-
            Como um HUB escolhe o upstream que serve o modelo (ADR 0166,
            RN-583). AUSENTE mantém o valor gravado quando o provider do modelo
            novo o aceita, e o limpa caso contrário; `null` o limpa; valor para
            modelo cujo provider não declara a capability `routingPreference`
            (`GET /llm/provider-capabilities`) é recusado com 422. Viaja JUNTO
            com este binding: nunca cascateia sozinho.
      required:
        - modelId
    SetModelsActiveDto:
      type: object
      properties:
        modelIds:
          example:
            - 9b1c2d3e-4f50-4a61-8b72-0c3d4e5f6a7b
          description: Modelos a ligar ou desligar. Lote inteiro ou nada.
          type: array
          items:
            type: string
            format: uuid
        isActive:
          type: boolean
          example: true
          description: >-
            `true` faz o modelo aparecer no seletor e poder receber binding
            novo. Não toca `availability`, que é o que o sync observou no
            provider.
      required:
        - modelIds
        - isActive
    SetModelUsesDto:
      type: object
      properties:
        modelIds:
          example:
            - 9b1c2d3e-4f50-4a61-8b72-0c3d4e5f6a7b
          description: Modelos a marcar. Lote inteiro ou nada.
          type: array
          items:
            type: string
            format: uuid
        uses:
          type: array
          example:
            - codigo
            - analise
          description: >-
            The COMPLETE list of uses — replaces the previous one, does not add
            to it. An empty list unmarks all. A closed vocabulary: a use outside
            it fails the call, because free text would give `code`, `coding`,
            and `código` in the same filter.
          items:
            type: string
            enum:
              - codigo
              - documentacao
              - analise
              - imagem
              - conversa
      required:
        - modelIds
        - uses
    SetProjectPermissionsDto:
      type: object
      properties:
        allow:
          example:
            - Terminal(pnpm test:*)
            - Terminal(pnpm lint)
          description: Padrões aprovados automaticamente.
          type: array
          items:
            type: string
        deny:
