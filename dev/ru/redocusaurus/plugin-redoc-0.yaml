        '422':
          description: >-
            Активация псевдонима свободной маршрутизации OpenRouter (`~…`) —
            `code: "alias_de_roteamento_livre"`, с отклонёнными `modelIds`.
            Отклоняется весь пакет. Деактивация всегда разрешена (AT-271,
            RN-679).
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Включает или выключает модели в селекторе (пакетно)
      tags:
        - llm
  /workspaces/{workspaceId}/models/catalog:
    get:
      description: >-
        Экран курации. Модель, обнаруженная синхронизацией, приходит как
        `isActive: false` и появляется только здесь, пока кто-нибудь её не
        активирует; модель, исчезнувшая у провайдера, приходит с `availability:
        "unavailable"` и никогда не удаляется, потому что на неё указывают
        binding и история затрат. `isActive` — ДЛЯ ЭТОГО рабочего пространства
        (ADR 0049); `availability` глобально, потому что это то, что
        синхронизация наблюдала у провайдера.
      operationId: ModelsController_catalog
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
