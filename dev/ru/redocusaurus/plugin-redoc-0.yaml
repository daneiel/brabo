        - chave
        - rotulo
        - actorKind
        - costMicros
        - inputTokens
        - outputTokens
        - chamadas
    SpendPorDiaResponseDto:
      type: object
      properties:
        dia:
          type: string
          example: '2026-08-09'
          description: 'День в UTC. Ряд ПЛОТНЫЙ: день без расходов приходит как ноль.'
        costMicros:
          type: number
          example: 1250000
        chamadas:
          type: number
          example: 42
      required:
        - dia
        - costMicros
        - chamadas
    StoryComTarefasResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z0000HISTORIA000000001
        epicId:
          type: string
          example: 01JC4Z0000EPICO000000000001
        projectId:
          type: string
          example: 01JC4Z0000PROJETO0000000001
        sessionId:
          type: string
          example: 01JC4Z8QK3M7YV2N5T9B0PXHRA
        title:
          type: string
          example: Add item to cart
        description:
          type: string
          example: As a buyer, I want to gather items before paying.
        rf:
          example:
            - The cart accepts up to 50 items
          description: Функциональные требования.
          type: array
          items:
            type: string
        rnf:
          example:
            - The response stays under 200 ms at p95
          description: Нефункциональные требования.
          type: array
          items:
            type: string
        businessRuleIds:
          example:
            - RN-014
          description: >-
            Покрытые бизнес-правила. Именно отсюда вычисляется покрытие
            правило→история в `GET /projects/:id/coverage`.
          type: array
          items:
            type: string
        dod:
          example:
            - Unit tests green
          description: Критерии готовности (Definition of done).
          type: array
          items:
            type: string
        dor:
          example:
            - Module defined
          description: Критерии готовности к работе (Definition of ready).
          type: array
          items:
            type: string
        moduleIds:
          example:
            - api
          description: >-
            Модули из `module_map`, которых касается история. История без модуля
