          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou handoff não encontrado.
        '409':
          description: O handoff não está em `offered`.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Aceita um handoff e ativa o agente de destino
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/model-binding:
    get:
      description: >-
        Devolve o binding RESOLVIDO pela cascata, não o binding cru da sessão:
        sessão sem binding próprio usa o do projeto, e responder `null` aqui
        seria a resposta errada para a pergunta certa. O campo `origin` diz de
        qual escopo veio o valor.


        `agentId` é opcional e é o agente REALMENTE ativo na sessão agora (o
        mesmo que `RunLlmTurnUseCase` usa para rodar o turno) — sem ele, a
        cascata só enxerga sessão→projeto→workspace (mais o fallback fixo ao
        Criativo) e nunca reflete PO/Arquiteto/Dev Lead/área depois de um
        handoff.
      operationId: ModelBindingsController_getSessionBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: agentId
          required: false
          in: query
          description: >-
            Agente ativo agora nesta sessão (ex.: "po", "arquiteto",
            "dev-lead").
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedBindingResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no escopo.
        '404':
          description: Escopo não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Resolve qual modelo a sessão usa, e de onde veio
      tags:
        - llm
    put:
      description: Vence todo o resto da cascata enquanto a sessão viver.
      operationId: ModelBindingsController_setSessionBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModelBindingDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelBindingResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no escopo.
        '404':
          description: Escopo não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Fixa o modelo desta sessão
      tags:
        - llm
  /projects/{projectId}/sessions/{sessionId}/psychologist/reanalyze:
    post:
      description: >-
        Exige `maintainer`, não `developer`, porque roda o ToolLoop de novo e
        GASTA orçamento real — ao contrário de aceitar ou descartar, que só
        mexem em estado local. A análise anterior é marcada como superada.
      operationId: PsychologistController_reanalyze
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou hipótese não existe.
        '429':
          description: Rate limit por usuário ou por IP.
        '503':
          description: >-
            O Psicólogo está desligado globalmente por decisão do usuário (não é
            bug) — corpo com `reason: "psychologist_disabled"`.
      security:
        - bearer: []
      summary: Dispara uma reanálise da sessão
      tags:
        - psychologist
  /projects/{projectId}/sessions/{sessionId}/readiness:
    post:
      description: >-
        É o botão que dispara o `product_brief` e o handoff ao PO. Grava
        `readiness.confirmed` no event log. Volta no ACEITE, antes de o turno do
        agente terminar (ADR 0163): o turno segue rodando no engine e a
        narração, o fim e as falhas dele chegam pelo canal da sessão e pelo
        event log (`agent.status`, `agent.response`, `agent.error`) — nunca por
        esta resposta.
      operationId: AgentsController_readiness
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou handoff não encontrado.
        '409':
          description: >-
            O Criativo ainda está no meio de um turno — a confirmação foi
            gravada mas o brief não começou (ADR 0163).
        '422':
          description: >-
            Nenhuma regra de negócio foi capturada nesta conversa — ainda não há
            o que consolidar num brief (ADR 0163).
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Confirma que a sessão de descoberta com o Criativo terminou
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/reopen:
    post:
      description: >-
        Só `closed`/`closed_abnormally` reabrem, e só para `active` — `closing`
        nunca volta (ADR 0183). A sessão mantém o event log, os artefatos, as
        perguntas respondidas e os handoffs; o `kind` não é tocado. Um evento
        NOVO `session.reopened` registra o `closedAt` e o `terminationReason`
        anteriores, que a linha limpa. Sessão que traz `execution.activated` é
        recusada (`sessao_com_execucao`): abra uma sessão nova e ative a
        execução nela. Sem prazo. Exige `developer` (ADR 0184).
      operationId: SessionsController_reopen
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto ou sessão não existe.
        '409':
          description: >-
            A sessão não está encerrada (`reason: sessao_nao_encerrada`), ou
            ativou execução (`reason: sessao_com_execucao`).
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Reabre uma sessão encerrada, mantendo tudo o que ela tinha
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}/response-language:
    get:
      description: >-
        Resolvido para QUEM CHAMA, nunca para a sessão: sobreposição da sessão >
        escolha da Conta > detectado-e-confirmado > idioma da interface
        (RN-618). Devolve o vencedor, a origem dele e cada elo da cadeia — e,
        quando as suas mensagens recentes apontam para outro idioma e a tela
        deveria perguntar sobre isso, `detectionQuestion` (RN-624).
      operationId: SessionResponseLanguageController_get
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseLanguageResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto ou sessão não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: O idioma em que os agentes respondem a VOCÊ, nesta sessão
      tags:
        - sessions
    put:
      description: >-
        Só para quem chama, só nesta sessão (RN-618) — os outros participantes e
        a sua escolha na Conta não são tocados. `null` volta a herdar da Conta.
      operationId: SessionResponseLanguageController_set
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSessionResponseLanguageDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseLanguageResponseDto'
        '400':
          description: >-
            Corpo sem `language`, ou código que não é um idioma BCP-47
            reconhecido.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto ou sessão não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Fixa (ou solta) o SEU idioma de resposta nesta sessão
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}/socket-ticket:
    post:
      description: >-
        O ticket autentica o socket Phoenix `session:<id>` da sessão, no
        `connect/3` do engine — NÃO é o JWT reaproveitado. TTL de 30s e uso
        único: toda reconexão (inclusive as automáticas) pede um ticket novo.
        `scope: "heartbeat"` exige o papel `viewer`; `scope: "terminal"` exige
        `developer`, o mesmo papel mínimo das ações de terminal.
      operationId: SessionsController_issueSocketTicket
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSocketTicketDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocketTicketResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente para o escopo pedido.
        '404':
          description: Projeto ou sessão não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Emite um ticket opaco de uso único para o socket da sessão
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}/tasks/{taskId}/unblock:
    post:
      description: >-
        Zera o contador de correções do gate e devolve a tarefa ao agente. É a
        saída humana do teto de correções — não há desbloqueio automático.
      operationId: ExecutionController_unblock
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: taskId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou tarefa não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Desbloqueia uma tarefa bloqueada
      tags:
        - execution
  /projects/{projectId}/sessions/{sessionId}/token-usage:
    get:
      description: >-
        O dado sempre esteve em `token_usage`, mas sem agregação nem rota o
        painel do time não tinha como mostrar o custo por card. Mesmo papel
        exigido pelo orçamento da sessão.
      operationId: BudgetsController_getSessionTokenUsage
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentTokenUsageResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto ou sessão não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Quebra o gasto da sessão por agente
      tags:
        - llm
  /projects/{projectId}/sessions/{sessionId}/transition:
    post:
      description: >-
        A transição é validada pela máquina de estados do domínio, não pelo
        cliente: created → active → closing → closed | closed_abnormally. Salto
        inválido é 409.
      operationId: SessionsController_transition
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionSessionDto'
      responses:
        '201':
          description: >-
            Devolve 201, não 200, porque o handler é `@Post` sem `@HttpCode` — é
            o padrão do Nest. Documentado como está em vez de mudado: a
            semântica é discutível, o comportamento não é defeituoso, e o teste
            da tabela reprova qualquer divergência entre os dois.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto ou sessão não existe.
        '409':
          description: Transição não permitida a partir do estado atual.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Move a sessão para outro estado
      tags:
        - sessions
  /projects/{projectId}/spend/me:
    get:
      description: >-
        O público do MEMBRO. Só as linhas do próprio chamador — o ator vem do
        token autenticado e não há parâmetro para trocá-lo. Em tokens e custo
        ESTIMADO, sem quebrar por provider nem por credencial: a chave que rodou
        é a do owner (RN-058) e a fatura dela é dele (RN-060). O eixo de
        provider passou a existir no relatório do owner (ADR 0076) e continua
        inalcançável daqui — não há parâmetro de dimensão nesta rota, e o tipo
        do repositório recusa a combinação (RN-187). Agente não conta:
        `token_usage` registra quem gastou, não quem mandou gastar.
      operationId: SpendController_getMySpend
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: dias
          required: false
          in: query
          description: Janela deslizante. Padrão 30, máximo 180.
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySpendResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Meu próprio consumo neste projeto, por sessão e por dia
      tags:
        - llm
  /projects/{projectId}/stories/{storyId}/archive:
    post:
      description: >-
        A história sai do backlog, da cobertura, da fila de promoção, do plano
        do Dev Lead e do claim — e as tarefas dela também. Nada é apagado: a
        linha fica com `archivedAt`, e `backlog.story_archived` registra quem,
        por quê e quais tarefas. Só história `draft` sem tarefa em execução.
      operationId: BacklogController_archive
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: storyId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveStoryDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '409':
          description: >-
            Recusa nomeada (`reason`): `historia_arquivada`,
            `historia_nao_draft` ou `historia_com_tarefa_em_execucao`.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Arquiva uma história em rascunho (RN-727)
      tags:
        - backlog
  /projects/{projectId}/stories/{storyId}/return:
    post:
      description: >-
        A história sai da fila de proposta e o motivo vira uma mensagem fixada
        na sessão do PO — o mesmo padrão de devolver um gate ao dev. Se o PO
        daquela sessão não está mais de pé, a devolução é gravada mesmo assim: é
        decisão do usuário e não depende de um agente ouvindo.
      operationId: BacklogController_return
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: storyId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnStoryDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Devolve uma história recusada ao PO, com o motivo
      tags:
        - backlog
  /projects/{projectId}/stories/{storyId}/title:
    patch:
      description: >-
        Só história `draft` sem tarefa em execução (`in_progress`/`in_review`).
        Grava `backlog.story_updated` com o título anterior e o novo. Mesmo
        papel das outras escritas do backlog (promover/devolver).
      operationId: BacklogController_updateTitle
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: storyId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoryTitleDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResponseDto'
        '400':
          description: Título vazio ou com mais de 200 caracteres.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '409':
          description: >-
            Recusa nomeada (`reason`): `historia_arquivada`,
            `historia_nao_draft` ou `historia_com_tarefa_em_execucao`.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Corrige o título de uma história em rascunho (RN-727)
      tags:
        - backlog
  /projects/{projectId}/stories/promote:
    post:
      description: >-
        O passo humano que o modo `manual` (padrão desde a Fase 12c) devolve ao
        usuário: até a promoção, NENHUMA tarefa da história é pegável por dev
        agent algum. Promover libera o lote de tarefas de uma vez e acorda os
        agentes ociosos do módulo (Fase 12b). O lote NÃO é tudo ou nada — o que
        não passou volta como `failed` com o motivo, e o que passou é promovido.
      operationId: BacklogController_promote
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteStoriesDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoteStoriesResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Promove para `ready` histórias que o PO propôs
      tags:
        - backlog
  /projects/{projectId}/tasks/{taskId}/gates/{gate}/resume:
    post:
      description: >-
        Ciclo de gate parado há mais de 2 h é estacionado em vez de reiniciado
        sozinho (ADR 0207). Este é o gesto humano que o retoma.
      operationId: GateResumeController_resume
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: taskId
          required: true
          in: path
          schema:
            type: string
        - name: gate
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel abaixo de `developer` no projeto.
        '409':
          description: >-
            O ciclo não está estacionado — corpo com `reason:
            "gate_nao_estacionado"`.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Retoma um ciclo de gate estacionado
      tags:
        - gates
  /projects/{projectId}/terminal-ticket:
    post:
      description: >-
        Mesmo socket `/runner`, mesmo tópico, papel "terminal" — quem VÊ o
        terminal (o comando em si só roda de verdade se houver um runner
        conectado). Vale para qualquer modo de projeto.
      operationId: RunnerTicketsController_terminalTicket
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerTicketResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Emite um ticket de uso único para a aba Terminal da web
      tags:
        - projetos
  /runner-releases/binary:
    get:
      description: >-
        Proxy de GitHub Releases — `platform` aceita só linux-x64, linux-arm64,
        darwin-arm64. Sem autenticação: o binário não é segredo. Os bytes são
        conferidos contra o `checksums.txt` da mesma Release antes de qualquer
        coisa ser respondida (ADR 0149, RN-525); a rota NÃO verifica a
        assinatura do manifesto — isso é integridade, não procedência, e quem
        verifica assinatura é o `install.sh`.
      operationId: RunnerReleasesController_binary
      parameters: []
      responses:
        '200':
          description: >-
            O binário do runner, em stream, com o sha256 já conferido contra o
            manifesto. Não é JSON: `Content-Type: application/octet-stream`. O
            header `Content-Digest` repete o hash conferido (RFC 9530).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '502':
          description: >-
            Recusa nomeada — nunca bytes com aviso. O corpo traz `motivo`:
            `plataforma_nao_publicada`, `release_sem_manifesto`,
            `manifesto_nao_cobre_a_plataforma`, `manifesto_ilegivel`,
            `download_falhou` ou `hash_divergente`.
      summary: Baixa o binário standalone do runner local pra plataforma pedida
      tags:
        - infrastructure
  /runner/projects:
    get:
      description: >-
        Autenticada por uma chave de dispositivo de MÁQUINA (ADR 0154) — NUNCA
        por JWT de sessão, e nunca por uma credencial presa a um projeto, que
        responde 403. Devolve os projetos em `execution_mode: "runner"` nos
        quais o dono da chave alcança pelo menos `developer` (o mesmo mínimo de
        `POST .../runner-ticket`), com o nome da pasta e o estado de verificação
        de cada um. O agente pergunta em vez de varrer o disco: a base da
        máquina é do usuário e pode ter pasta que não é projeto nenhum.
      operationId: RunnerProjectsController_listRunnerProjects
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunnerProjectResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: >-
            A credencial apresentada está presa a um projeto — esta rota exige
            uma chave de dispositivo de máquina.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista os projetos em modo "runner" que este agente local atende
      tags:
        - projetos
  /users/me/credentials:
    get:
      description: >-
        Nenhum papel exigido: credencial é sobre quem chamou, não sobre um
        workspace ou projeto. Cobre chaves de LLM e tokens de git na mesma
        listagem.
      operationId: CredentialsController_list
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCredentialResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista as credenciais do próprio usuário corrente
      tags:
        - credentials
    post:
      description: >-
        Upsert por (usuário, provider). A chave é cifrada por envelope
        encryption antes de tocar o banco, e a resposta traz só a PROJEÇÃO —
        nunca o segredo, nem cifrado.
      operationId: CredentialsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCredentialDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCredentialResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Registra ou substitui a API key de um provider
      tags:
        - credentials
  /users/me/credentials/{provider}:
    delete:
      description: 'Idempotente: apagar o que não existe também responde `{ ok: true }`.'
      operationId: CredentialsController_remove
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            example: anthropic
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Remove a credencial de um provider
      tags:
        - credentials
  /users/me/credentials/{provider}/test:
    post:
      description: >-
        A checagem é uma ação explícita, separada do registro (ADR 0050): a api
        decifra o segredo, chama o provider e devolve SÓ o veredito — a chave
        nunca volta, nem em parte. Responde 200 para os três desfechos, porque o
        pedido foi processado; `refused` é um desfecho, não erro de protocolo.
        404 quando não há credencial para (usuário, provider) — aí não há o que
        testar.
      operationId: CredentialsController_test
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            example: openrouter
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialTestResultResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '404':
          description: Sem credencial para este provider.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Confere contra o provider a credencial JÁ guardada
      tags:
        - credentials
  /users/me/git-credentials:
    post:
      description: >-
        Caminho próprio, não o de `users/me/credentials`, porque o corpo é
        diferente (`token`, e o enum de provider é `github`/`gitlab`). O token é
        cifrado e guardado sem verificação prévia (ADR 0050); para verificá-lo,
        `POST /users/me/credentials/{provider}/test`. Leitura, remoção e teste
        reusam as rotas de `users/me/credentials` — é a mesma tabela.
      operationId: GitCredentialsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterGitCredentialDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCredentialResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Registra um token de git (cifrado, sem testar)
      tags:
        - credentials
  /users/me/machine-device-keys:
    get:
      description: >-
        Por conta, sem projeto no caminho (RN-611): a instalação de uma linha
        cria uma chave de máquina antes de existir qualquer projeto, e toda
        outra listagem é por projeto. Devolve SÓ chaves de máquina (`especie:
        "maquina"`, `projectId: null`) e SÓ as do chamador — chaves de projeto
        ficam na listagem do projeto delas, e ninguém vê chave de outro usuário
        (RN-519). Chaves revogadas ENTRAM: registrar uma chave de máquina nova
        revoga a anterior (RN-552), e é nesta lista que isso aparece.
        `lastUsedAt` é uso registrado, nunca conexão viva; nulo quer dizer que a
        chave nunca foi usada.
      operationId: MachineDeviceKeysController_listMachineDeviceKeys
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunnerDeviceKeyListResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: >-
        Lista as próprias chaves de dispositivo de MÁQUINA do usuário
        autenticado
      tags:
        - users
  /users/me/machine-device-keys/{deviceKeyId}:
    delete:
      description: >-
        Idempotente — revogar de novo não é erro. Mesma revogação de `DELETE
        /projects/{projectId}/runner-device-keys/{deviceKeyId}`: também derruba
        as conexões VIVAS abertas com esta chave, em TODO projeto
        (RN-520/RN-543). Desde a RN-685 (ADR 0201) o alvo é a CHAVE: outro
        runner do mesmo usuário, conectado com PAT ou com outra chave, fica de
        pé. Os tickets da chave ainda não usados são anulados. Sem projeto
        ainda, não há conexão a derrubar. Chave de PROJETO, chave que não existe
        e chave de outro usuário respondem o mesmo 404.
      operationId: MachineDeviceKeysController_revokeMachineDeviceKey
      parameters:
        - name: deviceKeyId
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Chave revogada. Sem corpo.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '404':
          description: >-
            Nenhuma chave de máquina com este id pertence a quem chama (não
            existe, é chave de projeto, ou é de outra pessoa — uma resposta para
            todos).
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: >-
        Revoga uma das próprias chaves de dispositivo de MÁQUINA do usuário
        autenticado
      tags:
        - users
  /users/me/preferences:
    get:
      operationId: UserPreferencesController_get
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: >-
        Lê o idioma da interface e o idioma de resposta dos agentes do usuário
        autenticado
      tags:
        - users
    patch:
      description: >-
        Os dois campos são opcionais e independentes — mandar um nunca toca o
        outro, e corpo sem nenhum é 400. `locale` (a interface) continua fechado
        à lista `pt-BR`/`en`. `responseLanguage` (RN-618) é `automatico` ou
        qualquer código BCP-47 reconhecido, gravado na forma canônica; código
        não reconhecido é 400 e nada do corpo é gravado.
      operationId: UserPreferencesController_update
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPreferencesDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: >-
        Grava o idioma da interface e/ou o idioma de resposta dos agentes do
        usuário autenticado
      tags:
        - users
  /users/me/preferences/detected-language:
    post:
      description: >-
        O único jeito de um idioma detectado virar preferência (RN-624): a
        detecção sozinha nunca muda nada. `confirm` grava `detectedLanguage` +
        `detectedLanguageConfirmedAt`; `decline` registra a recusa para o mesmo
        idioma não ser perguntado de novo. Devolve as preferências depois da
        resposta.
      operationId: UserPreferencesController_answerDetected
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerDetectedLanguageDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponseDto'
        '400':
          description: Código que não é um idioma BCP-47 reconhecido.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '409':
          description: >-
            `deteccao_mudou`: no `confirm`, as suas mensagens recentes não
            apontam mais para aquele idioma — nada foi gravado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Responde a pergunta do idioma detectado
      tags:
        - users
  /workspaces:
    get:
      description: >-
        Já filtrada por associação — não há listagem global. Cada item traz o
        papel do próprio chamador.
      operationId: WorkspacesController_list
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceComPapelResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no workspace.
        '404':
          description: O workspace não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista os workspaces de quem chama
      tags:
        - workspaces
    post:
      description: >-
        Não exige papel: quem cria vira `owner`. É a única porta de entrada para
        quem ainda não pertence a workspace nenhum.
      operationId: WorkspacesController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponseDto'
        '400':
