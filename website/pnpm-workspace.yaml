# ------------------------------------------------------------------------
# O que NÃO tem override, e por quê. Esta seção existe porque fechar três de
# quatro sem nomear o quarto transforma um painel honesto num painel que
# PARECE resolvido — e o que sobra aqui é HIGH. Eram dois; o `image-size`
# ganhou correção upstream (2.0.3) e virou override acima.
#
# O argumento de ALCANCE vale para ele, e é o do ADR 0117: `website/` tem
# lockfile próprio justamente porque **nada da árvore do Docusaurus chega a
# imagem nenhuma**. Nenhuma das quatro imagens publicadas no GHCR (ADR 0119)
# instala estas dependências; o que o site publica é HTML estático. O alcance
# é a máquina de quem CONSTRÓI a documentação — o runner do CI e o checkout de
# quem roda `pnpm docs:build` —, nunca a instalação de ninguém. Isso reduz a
# severidade real; não a zera, e por isso está escrito em vez de esquecido.
#
#   · `@faker-js/faker@5.5.3` — HIGH · GHSA-qxc2-j82w-r537 (alerta #43), com
#     correção em 10.5.0. **Tem patch e mesmo assim não sobe**, e isso foi
#     MEDIDO, não suposto: `postman-collection@5.3.1` pina `@faker-js/faker`
#     em `5.5.3` EXATO (não é faixa) e usa a API da v5 que sumiu na v8
#     (`faker.address`, `faker.random.*`, `faker.datatype.number`,
#     `faker.phone.phoneNumberFormat`). Com o override aplicado, o
#     `pnpm docs:build` REPROVA — `Docusaurus could not load module …
#     docusaurus-plugin-openapi-docs/lib/index.js`, com
#     `TypeError: Cannot read properties of undefined (reading 'city')` como
#     causa, no `require` de `dynamic-variables.js`. São cinco majors de
#     distância e o pai não tem versão nova; fechar o alerta custaria a
#     documentação inteira.
#     Remedido em 2026-10-02 (AT-359): `postman-collection@5.3.1` segue a
#     última no npm (sem 5.3.2/6.x) e ainda pina `5.5.3`; quem a arrasta é
#     `docusaurus-plugin-openapi-docs`/`-theme-openapi-docs` (5.1.2 aqui,
#     5.2.0 a mais nova, ambas `postman-collection ^5.0.2`),
#     `openapi-to-postmanv2@6.3.3` e `postman-code-generators@2.1.1` (as
#     duas `^5.0.0`, ambas as mais novas). Nenhum pai sobe para fora do
#     faker 5.5.3. Trocar/remover o plugin ou dispensar o alerta com
#     justificativa é decisão do dono.
