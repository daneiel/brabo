      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgenteAtivadoResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 未找到项目、会话或 handoff。
        '409':
          description: 代理没有已接受的 handoff，或已在会话中处于活跃状态。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 在会话中启动一个代理
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/agents/{agent}/structured-question/{questionSetId}/answer:
    post:
      description: >-
        记录
        `chat.structured_question_answered`，并把答案作为普通消息重新发送给代理。一组问题只能回答一次。在接受时返回，在代理的回合结束之前（ADR
        0163）：回合继续在 engine
        中运行，其叙述、结束和失败通过会话通道和事件日志到达（`agent.status`、`agent.response`、`agent.error`）——绝不通过这个响应。
      operationId: AgentsController_submitStructuredQuestionAnswer
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: agent
          required: true
          in: path
          description: 提出问题（并将读取答案）的代理的 slug。
          schema:
            example: criativo
            type: string
        - name: questionSetId
          required: true
          in: path
          description: 已回答的 `chat.structured_question` 事件的 id。
          schema:
            example: 01JC4Z0000EVENTO000000000001
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerStructuredQuestionDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 未找到项目、会话或 handoff。
        '409':
          description: 这组问题已经回答过；或代理仍处于回合中，没有读取答案（ADR 0163）。
        '422':
          description: 提问的代理不接收聊天消息——答案已记录，但没有任何代理读取（RN-584）。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 回答代理的一组结构化问题
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/agents/{agentId}/rearm:
    post:
      description: 重置连续阻塞任务计数器（RN-047），让代理重新尝试认领工作。这是离开 `idle_tripped` 的唯一方式——没有自动解除阻塞。
      operationId: ExecutionController_rearm
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: agentId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 未找到项目、会话或任务。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 重新启用被熔断器触发的 dev agent
      tags:
        - execution
  /projects/{projectId}/sessions/{sessionId}/agents/arquiteto/handoff-infra:
    post:
      description: >-
        专用端点，而不是复用属于 Criativo 的
        `readiness`：它们是会话中两个不同的里程碑，混为一谈会让事件日志含糊不清。在接受时返回，在代理的回合结束之前（ADR
        0163）：回合继续在 engine
        中运行，其叙述、结束和失败通过会话通道和事件日志到达（`agent.status`、`agent.response`、`agent.error`）——绝不通过这个响应。到
        Dev Lead 的 handoff 仍在到 Infra 的之后：engine 会一直持有它，直到收尾回合结束。幂等（ADR
        0182，RN-635）：已有待处理提议或已在项目中活跃的目标不会被再次触发，两者都如此时不记录任何内容。
      operationId: AgentsController_handoffInfra
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmacaoDeArquiteturaResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 未找到项目、会话或 handoff。
        '409':
          description: Arquiteto 仍处于回合中——确认已记录，但收尾回合没有开始（ADR 0163）。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 确认架构已就绪，并向 Infra 提议 handoff
      tags:
        - agents
  /projects/{projectId}/sessions/{sessionId}/agents/criativo/validate-necessity:
