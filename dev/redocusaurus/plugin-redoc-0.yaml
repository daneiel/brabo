    ModelResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z0000MODELO00000000001
        provider:
          type: string
          enum:
            - ollama
            - anthropic
            - openai
          example: anthropic
        name:
          type: string
          example: claude-opus-4-8
          description: Identificador no provider.
        displayName:
          type: string
          example: Claude Opus 4.8
        inputPricePerMillionMicros:
          type: number
          example: 15000000
          description: Preço por milhão de tokens de ENTRADA, em micro-USD.
        outputPricePerMillionMicros:
          type: number
          example: 75000000
          description: Preço por milhão de tokens de SAÍDA, em micro-USD.
        contextWindow:
          type: object
          example: 200000
          nullable: true
          description: Também a capability `context_length` do modelo.
        supportsToolCalling:
          type: boolean
          example: true
          description: >-
            Tool calling NATIVO. Sem isso o modelo é só chat e não pode ser
            vinculado a um agente (RN-040).
        supportsStreaming:
          type: boolean
          example: true
        supportsVision:
          type: boolean
          example: false
          description: >-
            Aceita entrada de IMAGEM. `false` quer dizer que o provider não
            declarou a modalidade — não que o modelo não consiga (ADR 0041).
        supportsReasoning:
          type: boolean
          example: true
          description: >-
            Aceita raciocínio explícito (thinking). No OpenRouter vem de
            `supported_parameters: reasoning`.
        generatesImage:
          type: boolean
          example: false
          description: >-
            PRODUZ imagem — eixo diferente de aceitá-la como entrada. Poucos
            modelos têm, e confundir os dois manda o usuário ao modelo errado.
        manualPricing:
          type: boolean
          example: true
          description: >-
            Preço digitado a partir da documentação do provider, não
            sincronizado. O sync de preço não sobrescreve linha marcada sem
            decisão explícita.
        availability:
          type: string
          enum:
            - available
            - unavailable
          example: available
          description: >-
            Realidade REMOTA observada pelo sync, eixo independente da
            curadoria. `unavailable` é modelo que sumiu do catálogo do provider
            — nunca é apagado, porque bindings e histórico de custo apontam para
            ele.
        lastSeenAt:
          type: object
          example: '2026-07-30T03:00:00.000Z'
          format: date-time
          nullable: true
          description: Última vez que o sync viu o modelo no catálogo do provider.
        createdAt:
          type: string
          example: '2026-07-01T00:00:00.000Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-01T00:00:00.000Z'
          format: date-time
      required:
        - id
        - provider
        - name
        - displayName
        - inputPricePerMillionMicros
        - outputPricePerMillionMicros
        - contextWindow
        - supportsToolCalling
        - supportsStreaming
        - supportsVision
        - supportsReasoning
        - generatesImage
        - manualPricing
        - availability
        - lastSeenAt
        - createdAt
        - updatedAt
