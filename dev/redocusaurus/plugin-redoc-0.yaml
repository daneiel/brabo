            antigo do projeto para `module` é esta tarefa. O engine lhe dá o
            dobro do orçamento por tarefa (RN-774). `false` sem `module`.
        decisoes:
          description: >-
            RN-859: as decisões do usuário ligadas a esta tarefa, à história
            dela ou às regras dela por `afeta` — vencem RF/DoR em conflito. A
            mais nova primeiro, no máximo 10, cada texto cortado em 1.500
            caracteres.
          type: array
          items:
            $ref: '#/components/schemas/DevContextDecisaoResponseDto'
        decisoesDoProjeto:
          description: >-
            RN-872 (ADR 0215): as OUTRAS decisões do projeto — aquelas cujo
            `afeta` não toca esta tarefa. Seção separada, dentro do MESMO teto
            de 10 de `decisoes` (as decisões da tarefa ocupam o teto primeiro),
            a mais nova primeiro.
          type: array
          items:
            $ref: '#/components/schemas/DevContextDecisaoResponseDto'
      required:
        - task
        - story
        - businessRules
        - adrs
        - siblingTasks
        - moduleOpenTasks
        - moduleOpenTasksTotal
        - moduleContract
        - primeiraDoModulo
        - decisoes
        - decisoesDoProjeto
