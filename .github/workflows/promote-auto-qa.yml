name: promote-auto-qa

# Promoção automática `dev` → `qa` enquanto a `qa` está em FASE DE TESTE
# (ADR 0217, AT-555, decisão do dono de 15/10). Fonte da política:
# docs/explanation/branching-policy.md, seção "Automatic promotion to qa".
#
# Ligado só com a variável de repositório `QA_FASE_DE_TESTE == 'true'`
# (Settings → Variables). Desligar é apagar a variável ou mudar o valor: a
# promoção volta a ser só o `promote.yml` manual. `qa` → `main` NÃO passa por
# aqui em caso nenhum.
#
# O repositório NÃO tem checks obrigatórios, então `gh pr merge --auto`
# mergearia sem esperar o CI. Quem espera é `scripts/ci/promocao-automatica.ts`:
# todos os check runs do head terminados, nenhum em falha/cancelado/timeout.
on:
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

# Um merge novo na `dev` durante a espera NÃO cancela a promoção em curso: o
# PR é o mesmo (o head anda junto) e a espera relê o head a cada volta.
concurrency:
  group: promote-auto-qa
  cancel-in-progress: false

jobs:
  promover:
    name: Promoção automática para qa
    if: ${{ vars.QA_FASE_DE_TESTE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEM_PAT: ${{ secrets.BRABO_BOT_TOKEN != '' }}
    steps:
      # Sem o PAT a promoção automática NÃO roda: PR aberto pelo token padrão
      # nasce com checks em `action_required` (ver promote.yml), e o merge
      # pelo token padrão não dispararia o `tag-release` nem o `docs-deploy`.
      - name: O PAT está configurado?
        if: env.TEM_PAT != 'true'
        run: |
          echo "::error::QA_FASE_DE_TESTE=true mas BRABO_BOT_TOKEN não está configurado — a promoção automática não roda sem ele."
          echo "### promote-auto-qa: sem BRABO_BOT_TOKEN — nada foi promovido." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26.10.0

      - name: Calcular a versão
        id: calculo
        env:
          GH_TOKEN: ${{ github.token }}
          PAR: dev->qa
          PROMOCAO_AUTOMATICA: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/promote.ts

      # Ciclo vazio (merge de promoção, backmerge, dev igual à qa) é desfecho
      # normal: `promote.ts` sai 0 com `vazio=true` e nada é aberto.
      - name: Abrir ou atualizar o PR de promoção
        id: pr
        if: steps.calculo.outputs.vazio != 'true'
        env:
          GH_TOKEN: ${{ secrets.BRABO_BOT_TOKEN }}
          DE: ${{ steps.calculo.outputs.de }}
          PARA: ${{ steps.calculo.outputs.para }}
          VERSAO: ${{ steps.calculo.outputs.versao }}
        run: bash scripts/ci/abrir-pr-de-promocao.sh

      - name: Esperar os checks e mergear
        if: steps.calculo.outputs.vazio != 'true'
        env:
          GH_TOKEN: ${{ secrets.BRABO_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMERO: ${{ steps.pr.outputs.numero }}
        run: node scripts/ci/promocao-automatica.ts
