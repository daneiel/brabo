  /projects/{projectId}/sessions/{sessionId}/agents/arquiteto/handoff-infra:
    post:
      description: >-
        Выделенный endpoint вместо повторного использования `readiness`,
        принадлежащего Креативу: это две разные вехи сессии, и их смешение
        сделало бы журнал событий неоднозначным. Возвращается при ПРИНЯТИИ, до
        окончания хода агента (ADR 0163): ход продолжается в engine, а его ход,
        завершение и сбои приходят через канал сессии и журнал событий
        (`agent.status`, `agent.response`, `agent.error`) — никогда через этот
        ответ. Handoff к Dev Lead по-прежнему идёт ПОСЛЕ handoff к Infra: engine
        удерживает его, пока не закончится завершающий ход. Идемпотентно (ADR
        0182, RN-635): цель, у которой уже есть ожидающее предложение или
        которая активна в проекте, повторно не запускается, а если обе такие —
        ничего не записывается.
