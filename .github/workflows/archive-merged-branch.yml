name: archive-merged-branch

# Uma vez por dia, arquiva a branch mergeada há 7 dias ou mais — exceto dev,
# qa, main (permanentes) e gh-pages (deploy do site de docs). "Arquivar" é
# mecânico: mover de `refs/heads/<nome>` para `refs/archive/<nome>`, nunca
# apagar — o objeto e o histórico continuam no repositório, recuperável por
# quem souber o ref. Fonte da política: docs/explanation/branching-policy.md
#
# A decisão (quem é apta e por quê) e a chamada à API moram em
# scripts/ci/archive-branch.ts; o resumo do job lista arquivadas, mantidas com
# o motivo e falhas, e o job sai vermelho se houver falha.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: archive-merged-branch
  cancel-in-progress: false

jobs:
  arquivar:
    name: Arquivar branches mergeadas há 7 dias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # fetch nativo e type stripping: a mesma versão do ci.yml.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26.10.0'

      - name: Decidir e arquivar
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/archive-branch.ts
