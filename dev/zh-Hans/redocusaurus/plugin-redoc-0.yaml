      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponseDto'
        '400':
          description: 不是可识别的 BCP-47 语言代码。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '409':
          description: '`deteccao_mudou`：在 `confirm` 时，你最近的消息已不再指向该语言——未写入任何内容。'
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 回答关于检测到的语言的问题
      tags:
        - users
  /workspaces:
