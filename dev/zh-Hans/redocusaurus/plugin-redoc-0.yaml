      tags:
        - internal
  /internal/sessions/{sessionId}/semantic-duplicate-check:
    post:
      description: >-
        用 RAG 嵌入模型对标题和项目规则的标题（最近 100 条）进行嵌入，余弦相似度 ≥
        阈值时发出警告。从不拒绝。没有嵌入提供商时检查会被跳过并说明原因，同样会在事件日志中叙述。嵌入花费作为单独的 `token_usage`
        记录计量（参与者 `system`/`duplicata-semantica`）。
      operationId: InternalSessionsController_semanticDuplicateCheck
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemanticDuplicateCheckInternalDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticDuplicateCheckResponseDto'
        '400':
          description: 请求体无效。
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
        '404':
          description: 未找到会话、项目或资源。
      security:
        - service-token: []
      summary: 当刚写下的业务规则与已有规则相似时发出警告
      tags:
        - internal
