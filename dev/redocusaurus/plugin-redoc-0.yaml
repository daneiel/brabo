          type: string
          example: laptop
        projectId:
          type: object
          example: 01JC4Z0000PROJETO000000001
          nullable: true
          description: >-
            Nulo = chave de MÁQUINA (ADR 0154): vale para qualquer projeto do
            dono dela, e não só para este. Ver `especie`.
        especie:
          type: string
          enum:
            - projeto
            - maquina
          example: projeto
          description: >-
            `projeto` = presa ao projeto desta rota (ADR 0118). `maquina` =
            descreve a MÁQUINA (ADR 0154) e aparece na listagem de todo projeto
            que ela atende — revogá-la derruba o agente local em todos eles.
        createdAt:
          type: string
          example: '2026-08-27T12:00:00.000Z'
          format: date-time
        revokedAt:
          type: object
          example: null
          nullable: true
          description: Nulo = ativa. Revogada continua aparecendo na lista.
        lastUsedAt:
          type: object
          example: null
          nullable: true
          description: >-
            Nulo = nunca usada — o sinal de uma chave órfã (aba fechada no meio
            do fluxo de configuração automática do runner).
      required:
        - id
        - name
        - projectId
        - especie
        - createdAt
        - revokedAt
        - lastUsedAt
