        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySpendResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 角色不足。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
