            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInstructionsResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 项目不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 返回如何在你的机器上运行交付物
      tags:
        - backlog
  /projects/{projectId}/runner-device-keys:
    get:
      description: >-
        没有人能撤销看不到的东西（RN-519）。包含已撤销的密钥——让记录消失会让界面声称该密钥从未存在。从不返回 JWK 公钥，私钥 api
        从未见过。`lastUsedAt` 为空是孤立密钥的信号：已登记但从未被任何 runner 使用。自 RN-543
        起，还包含调用方的机器密钥（`especie: "maquina"`，`projectId`
        为空），它们服务于此项目却不属于它——如果列表中没有它们，机器密钥在任何界面上都将不可见。
      operationId: RunnerDeviceKeysController_listDeviceKeys
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunnerDeviceKeyListResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 未找到项目。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 列出自己在此项目中的设备密钥
      tags:
        - projects
  /projects/{projectId}/runner-device-keys/{deviceKeyId}:
    delete:
      description: >-
        幂等——再次撤销不是错误。自 RN-520 起还会断开活动连接：此前撤销只阻止新票据，已连接的 runner 会继续执行已批准的命令。自
        RN-685（ADR 0201）起，目标是密钥本身：只断开用它打开的连接——如果是机器密钥则遍及所有项目——同一用户用 PAT
        或其他密钥连接的另一个 runner 不受影响。它尚未使用的票据会被作废。engine 宕机或没有 runner 连接都不会导致撤销失败。
      operationId: RunnerDeviceKeysController_revokeDeviceKey
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: deviceKeyId
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: 密钥已撤销。无响应体。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 未找到项目。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 撤销自己的一把设备密钥
      tags:
        - projects
  /projects/{projectId}/runner-ticket:
