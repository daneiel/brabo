# Secrets via External Secrets Operator.
#
# Nenhum segredo entra em manifesto versionado. O que está aqui é a DECLARAÇÃO
# de onde os segredos vêm; o valor vive no provider e o ESO materializa o
# Secret dentro do cluster.
#
# O `secretStoreRef` aponta para um SecretStore que cada overlay define — é o
# único ponto que muda entre local e produção. No overlay local o store lê de
# um Secret-fonte que o bootstrap.sh cria imperativamente com `openssl rand`
# (`kubectl create secret`, nunca versionado); em staging/prod aponta para o
# provider real.
#
# Fallback sealed-secrets: ver docs/runbook.md (seção "Deploy local") — a alternativa é
# substituir estes dois recursos por SealedSecrets, mantendo os MESMOS nomes de
# Secret e as mesmas chaves, para que nada mais no chart precise mudar.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: brabo-secrets
  labels:
    app.kubernetes.io/part-of: brabo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: brabo-secret-store
    kind: SecretStore
  target:
    name: brabo-secrets
    creationPolicy: Owner
  # O OBJETO INTEIRO `brabo` do store vira o Secret `brabo-secrets` (AT-220).
  #
  # Até aqui eram treze entradas de `data:`, uma por chave, e isso tornava
  # impossível a rotação sem janela: o ESO não tem chave OPCIONAL em `data:` —
  # uma `property` ausente no provider reprova a sincronização do Secret
  # INTEIRO —, e as `_PREVIOUS` (`AUTH_JWT_SECRET_PREVIOUS`,
  # `BRABO_SERVICE_TOKEN_PREVIOUS`, `CREDENTIALS_MASTER_KEY_PREVIOUS`) ausentes
  # são o estado NORMAL fora de rotação. Com `extract`, elas entram no Secret
  # quando existem no store e saem quando são retiradas dele, na sincronização
  # seguinte (`refreshInterval`, ou o `force-sync` do runbook). O Pod só as vê
  # depois de REINICIAR: `envFrom` é lido na criação do container.
  #
  # Não há `data:` ao lado. Ele só se justificaria para RENOMEAR uma chave, e
  # toda chave do store já tem o nome exato da variável que os processos leem.
  #
  # O CUSTO, declarado:
  # - TUDO o que estiver no objeto `brabo` do store vira variável de ambiente
  #   de todo Pod que faz `envFrom: brabo-secrets` — api, engine, os dois Jobs
  #   de migração e o CronJob de backup. O store NÃO pode ter chave que esses
  #   processos não devam ver; segredo de outro consumidor mora em OUTRO objeto
  #   do store, nunca neste.
  # - A lista das chaves OBRIGATÓRIAS deixou de morar aqui. Uma obrigatória
  #   ausente no store não reprova mais a sincronização: o Secret nasce sem ela
  #   e quem acusa é o consumidor — `secretKeyRef` (NEO4J_PASSWORD no neo4j,
  #   BACKUP_S3_* no S3 local) em CreateContainerConfigError, a api e o engine
  #   recusando o boot de produção sem as deles. O inventário vive no runbook
  #   ("`ExternalSecret` never becomes Ready") e no `bootstrap.sh`, que cria o
  #   objeto no overlay local.
  dataFrom:
    - extract:
        key: brabo
