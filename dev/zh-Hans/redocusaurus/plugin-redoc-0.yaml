    ContainerOverviewItemResponseDto:
      type: object
      properties:
        projectId:
          type: string
          example: 01JC4Z0000PROJETO000001
        projectName:
          type: string
          example: exp002
        projectSlug:
          type: string
          example: exp002
        executionMode:
          type: string
          enum:
            - container
            - mounted
            - runner
          example: runner
          description: >-
            此项目的容器在哪里启动（RN-497/503）。`container` 和 `mounted` 通过服务器上的
            broker；`runner` 通过用户机器上的本地代理。正是它让启动操作在 `container_start` 和
            `container_start_via_runner` 之间分支。
        registrado:
          nullable: true
          description: >-
            `null` 表示此项目从未置备过容器——这是第三种状态，而不是 `status` 的一个值：它既不是
            `stopped`（曾经存在后来停止的容器），也不是“无法观测”（那是关于守护进程的）。请同时读取 `naoVerificado:
            "sem_container_registrado"`。
          type: object
          allOf:
            - $ref: '#/components/schemas/RegistroDeContainerResponseDto'
        temImagemDecidida:
          type: boolean
          example: true
          description: >-
            此项目是否存在任何 `artifact.project_image`——RN-105 gate，自 RN-494/ADR 0135
            起适用于全部三种模式。`false` 表示此刻无法启动容器，页面会说明这一点，而不是提议一个注定失败的操作。
        workspaceVerifiedAt:
          type: object
          nullable: true
          format: date-time
          description: >-
            runner 确认文件夹的时间（RN-423）——仅对 `executionMode: "runner"`
            有意义。它记录的是一次确认，绝不是心跳（RN-468）：非空并不能证明本地代理此刻已连接。它能证明的是否定的一面——值为 `null`
            时（在 `runner` 项目上）表示从未有 runner 连接过。
        observado:
          nullable: true
          description: >-
            broker 此刻报告的内容——为 `null`
            可能是因为没有容器、因为无法询问（`naoObservado`），或因为本次加载没有询问这一行（`naoVerificado`）。
          type: object
          allOf:
            - $ref: '#/components/schemas/ObservacaoDeContainerResponseDto'
        naoObservado:
          type: string
          enum:
            - broker-nao-configurado
            - broker-sem-resposta
            - broker-recusou
            - null
          nullable: true
        detalheDaObservacao:
          type: object
          nullable: true
          example: null
        naoVerificado:
          type: string
          enum:
            - fora_do_escopo_da_verificacao
            - teto_de_verificacoes_atingido
            - sem_container_registrado
            - null
          nullable: true
          example: null
          description: >-
            当本次加载没有向 broker 询问这一行时非空——绝不与 `naoObservado`
            混淆，后者表示询问过但失败了。`fora_do_escopo_da_verificacao`：状态为
            `stopped`/`failed`/`removed`，守护进程的确认无关紧要。`teto_de_verificacoes_atingido`：符合条件，但本次加载的
            broker
            调用预算已被其他行用完。`sem_container_registrado`：项目从未置备过容器，因此没有可观测的东西——它也从不消耗预算中的调用。
        acaoPendente:
          nullable: true
          description: >-
            此项目待处理的
            `container_start`/`container_stop`/`container_remove`/`container_start_via_runner`
            操作（如有）——在它的任何会话中。页面为其渲染内联的 `ApprovalCard`，而不是操作按钮，与 PR 标签页的模式相同。
          type: object
          allOf:
            - $ref: '#/components/schemas/ProposedActionResponseDto'
        decisaoVigente:
          type: object
          nullable: true
          example:
            version: 3
            image: node:22
            network: egress
          description: The current (highest version) image decision, or null.
        imagemDesatualizada:
          type: boolean
          example: false
          description: >-
            The registered container (running/stopped/provisioning) differs in
            CONTENT (image, network, resources) from the current decision; only
            recreating it (stop, remove, start) applies the new one.
        brokerConfigurado:
          type: boolean
          example: false
          description: >-
            此安装是否配置了容器 broker（已设置 `BROKER_URL`，ADR
            0130）——每一行的值都相同，因为它是安装配置而不是项目的属性。`container` 和 `mounted` 项目只通过
            broker 启动容器（ADR 0144），因此为 `false` 时，页面会在点击之前就为它们拒绝启动按钮并说明原因（ADR
            0161，RN-574）；`runner` 项目不受影响。它说明的是变量存在，而绝不是 broker 有响应——那是
            `naoObservado` 报告的内容。
      required:
        - projectId
        - projectName
        - projectSlug
        - executionMode
        - registrado
        - temImagemDecidida
        - workspaceVerifiedAt
        - observado
        - naoObservado
        - detalheDaObservacao
        - naoVerificado
        - acaoPendente
        - decisaoVigente
        - imagemDesatualizada
        - brokerConfigurado
    ContainerSpecInternalResponseDto:
      type: object
      properties:
        projectId:
          type: string
          example: f52be111-0000-4000-8000-000000000000
        projectSlug:
          type: string
          example: exp002
        workspaceId:
          type: string
          example: aaaaaaaa-0000-4000-8000-000000000000
        workspaceDirName:
          type: string
          example: exp002-f52be111
          description: >-
            在项目创建时冻结的文件夹名称（RN-109）。在全部三种模式中，它都是容器名称（`brabo-<workspaceDirName>`）的唯一来源。文件夹在哪里是另一个问题，由
            `localizacao`（RN-503）回答——api 仍然从不发送绝对路径，因为来自 api 容器内部的路径不是 Docker
            守护进程能够解析的路径。
        executionMode:
          type: string
          enum:
            - container
            - mounted
            - runner
          example: container
          description: >-
            代码所在的位置。broker 服务于 `container` 和 `mounted`（RN-503）：自 ADR 0141
            起，挂载的文件夹位于此服务器按身份挂载的一个基目录下，因此守护进程可以访问它。它仍然拒绝
            `runner`：那个文件夹在用户的机器上，这里没有任何根目录能看到它——在那里，启动容器的是 runner（ADR 0137）。
        localizacao:
          description: 项目文件夹的可辨识定位符（RN-503）：由 broker 两个根目录中的哪一个解析它，以及要拼接到该根目录的相对段。
          allOf:
            - $ref: '#/components/schemas/LocalizacaoDoProjetoResponseDto'
        usuarioDaPasta:
          type: object
          nullable: true
          properties:
            uid:
              type: integer
              example: 1000
            gid:
              type: integer
              example: 1000
          description: >-
            项目文件夹的所有者，由 api 测量（ADR 0180）：broker 以 `--user uid:gid` 启动容器，使 dev
            agent 在 `--cap-drop ALL` 下仍能写入该文件夹。为 `null` 的情况：文件夹无法测量、项目为
            `runner`，或所有者是 root——此时容器像以前一样启动。绝不接受来自对 broker 请求中的值。
        imagem:
          nullable: true
          description: >-
            在 Architect 尚未做出决定时为 `null`（RN-105）——此时 `start` 在 broker 端会以 409
            拒绝，其他四个操作仍然可用。
          type: object
          allOf:
            - $ref: '#/components/schemas/ImagemParaOBrokerResponseDto'
        imagemVersao:
          type: number
          example: 3
          description: 当前制品的版本；没有决定时为 0。它最终作为 `brabo.image.version` 标签出现在容器上。
      required:
        - projectId
        - projectSlug
        - workspaceId
        - workspaceDirName
        - executionMode
        - localizacao
        - usuarioDaPasta
        - imagem
        - imagemVersao
