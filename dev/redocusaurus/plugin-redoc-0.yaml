      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Exige `owner` no workspace.
        '404':
          description: Modelo não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Corrige o preço de um modelo
      tags:
        - llm
  /workspaces/{workspaceId}/models/activate:
    post:
      description: >-
        Curadoria do owner, VALENDO SÓ PARA ESTE WORKSPACE (ADR 0049). Só toca
        `isActive` — `availability` é o que o sync observou no provider, é
        global, e não muda aqui. Lote inteiro ou nada: id inexistente reprova a
        chamada sem aplicar linha nenhuma.
      operationId: ModelsController_activate
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModelsActiveDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelComCuradoriaResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Exige `owner` no workspace.
        '404':
          description: Algum id do lote não existe.
        '422':
          description: >-
            Ativar um alias de roteamento livre do OpenRouter (`~…`) — `code:
            "alias_de_roteamento_livre"`, com os `modelIds` recusados. O lote
            inteiro é recusado. Desativar um é sempre permitido (AT-271,
            RN-679).
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Liga ou desliga modelos no seletor (em lote)
      tags:
        - llm
  /workspaces/{workspaceId}/models/catalog:
    get:
      description: >-
        A tela de curadoria. Modelo descoberto pelo sync entra como `isActive:
        false` e só aparece aqui até alguém ativá-lo; modelo que sumiu do
        provider vem com `availability: "unavailable"` e nunca é apagado, porque
        bindings e histórico de custo apontam para ele. `isActive` é PARA ESTE
        workspace (ADR 0049); `availability` é global, porque é o que o sync
        observou no provider.
      operationId: ModelsController_catalog
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  local:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/ModelComCuradoriaResponseDto'
                  cloud:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/ModelComCuradoriaResponseDto'
                example:
                  local:
                    ollama: []
                  cloud:
                    anthropic: []
                    openai: []
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no workspace.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista o catálogo INTEIRO, inclusive inativos e indisponíveis
      tags:
        - llm
  /workspaces/{workspaceId}/models/sync:
    post:
      description: >-
        Mesmo caso de uso da rota interna que o engine agenda — o botão de
        atualizar da tela de curadoria não tem caminho próprio, então nunca há
        duas reconciliações que possam divergir.
      operationId: ModelsController_sync
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncModelCatalogResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Exige `owner` no workspace.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Força agora o sync do catálogo que o job periódico faz
      tags:
        - llm
  /workspaces/{workspaceId}/models/uses:
    post:
      description: >-
        O eixo que nenhum catálogo publica: "bom para código" não é capability
        declarada por provider nenhum, é opinião do operador — e vale SÓ para
        este workspace (ADR 0049). Eixo independente da ativação: marcar um uso
        não liga o modelo no seletor, e mudar o uso não desliga o que estava
        ligado. A lista de usos SUBSTITUI a anterior.
      operationId: ModelsController_uses
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModelUsesDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelComCuradoriaResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Exige `owner` no workspace.
        '404':
          description: Algum id do lote não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Marca para que o workspace usa cada modelo (em lote)
      tags:
        - llm
  /workspaces/{workspaceId}/owner-of-record:
    put:
      description: >-
        O titular é `createdBy`: de quem é a credencial de LLM que os agentes
        gastam e a credencial de git que as ações de agente usam (RN-058), e de
        quem é o relatório de gasto (RN-060). Não concede autorização — quem
        concede são os papéis. O alvo já tem de ser `owner` do workspace (senão
        409 `titular_precisa_ser_owner`). A partir do commit, os turnos de
        agente buscam a credencial do NOVO titular; se ele não tem uma para o
        provider do modelo, o turno termina com o desfecho de sempre de "nenhuma
        credencial cadastrada" para aquele provider — esta rota não confere isso
        antes. Qualquer `owner` pode chamá-la, inclusive para outro owner.
        Transferir para o titular atual não faz nada.
      operationId: WorkspacesController_transferOwnership
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no workspace.
        '404':
          description: O workspace não existe ou é invisível para quem chama.
        '409':
          description: '`titular_precisa_ser_owner`: o alvo não é `owner` do workspace.'
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Transfere a titularidade do workspace
      tags:
        - workspaces
  /workspaces/{workspaceId}/project-folders:
    get:
      description: >-
        O navegador de pastas do modo Mounted, servido pela api em vez do runner
        (RN-504). Escopado RIGIDAMENTE a `BRABO_PROJECTS_BASE` (ADR 0141):
        `path` é opcional e tem como padrão a própria base, e qualquer `path`
        fora dela é `400` — pedido malformado, não problema de permissão, já que
        papel nenhum navega fora da base.


        Com teto de propósito: só diretórios, no máximo 500 (ordenados ANTES do
        corte, com `truncado` dizendo isso), nunca recursivo, entradas com ponto
        no início excluídas, e symlinks relatados mas nunca seguidos. O que fica
        de fora é CONTADO (`arquivos`, `simbolicos`) para uma pasta cheia de
        código nunca parecer vazia.


        Não há POST irmão: criar pasta é parte de materializar o workspace
        montado, nunca do navegador.
      operationId: WorkspacesController_listProjectFolders
      parameters:
        - name: path
          required: false
          in: query
          description: >-
            Caminho absoluto a listar. Omitido quer dizer a própria base. Tem de
            estar dentro de `BRABO_PROJECTS_BASE`; `..`, `.` e caminhos
            relativos são recusados de cara em vez de resolvidos.
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFoldersResponseDto'
        '400':
          description: O caminho está fora da base de projetos, ou malformado.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no workspace.
        '404':
          description: O workspace não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista as subpastas de uma pasta dentro da base de projetos
      tags:
        - workspaces
  /workspaces/{workspaceId}/projects:
    get:
      operationId: WorkspacesController_listProjects
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no workspace.
        '404':
          description: O workspace não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista os projetos do workspace
      tags:
        - workspaces
    post:
      operationId: WorkspacesController_createProjectInWorkspace
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no workspace.
        '404':
          description: O workspace não existe ou é invisível para quem chama.
        '409':
          description: Já existe um projeto com este slug no workspace.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Cria um projeto dentro do workspace
      tags:
        - workspaces
  /workspaces/{workspaceId}/projects-base:
    get:
      description: >-
        A única pasta da máquina do operador que os containers da api e do
        engine enxergam, montada por identidade (ADR 0141). `null` — estado
        normal, nunca erro — quer dizer que esta instalação não tem
        `BRABO_PROJECTS_BASE`, então o assistente de projeto não deve oferecer o
        modo Mounted de jeito nenhum. O mesmo valor para todo workspace: é
        configuração da instalação, e `workspaceId` só escopa a autorização.


        `brokerConfigurado` responde a outra metade da mesma pergunta:
        `container` e `mounted` só sobem container pelo broker (ADR 0144), então
        sem ele o assistente não pré-seleciona Mounted e oferece Runner no lugar
        (ADR 0161, RN-573).
      operationId: WorkspacesController_getProjectsBase
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsBaseResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no workspace.
        '404':
          description: O workspace não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: A pasta base dos projetos no modo Mounted
      tags:
        - workspaces
  /workspaces/{workspaceId}/projects-status:
    get:
      description: >-
        Uma linha por projeto do workspace com tarefa bloqueada — alimenta o
        ponto de status da barra lateral do painel com uma consulta só em vez de
        N chamadas ao backlog.
      operationId: WorkspacesController_getProjectsStatus
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectBlockedStatusResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no workspace.
        '404':
          description: O workspace não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Contagem de tarefas bloqueadas por projeto
      tags:
        - workspaces
  /workspaces/{workspaceId}/projects-summary:
    get:
      description: >-
        Uma linha por projeto do workspace com provider de git, status de
        provisionamento, orçamento, última atividade, histórias aguardando
        promoção e os fatos que decidem a lista de agentes (RN-090).


        Mesma ideia de `projects-status`, um andar acima: a grade de cards é uma
        leitura de WORKSPACE, não N leituras de projeto. O caminho anterior
        fazia sete consultas com poll por card, e com 23 projetos só o painel
        estourava o rate limit de 300 req/min.
      operationId: WorkspacesController_getProjectsSummary
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectCardSummaryResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no workspace.
        '404':
          description: O workspace não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Tudo o que os cards do painel desenham, numa chamada só
      tags:
        - workspaces
  /workspaces/{workspaceId}/spend-report:
    get:
      description: >-
        O público do OWNER. O eixo de PROVIDER voltou (ADR 0076, RN-186) e está
        aqui, não na rota do membro, porque quebrar por provider é quebrar por
        CREDENCIAL — e credencial é assunto de quem paga (RN-060). Complementa
        `credential-spend`, que continua respondendo a pergunta da FATURA (por
        mês, com o vínculo à chave que existe hoje). Pessoa e agente também vêm
        em blocos separados, por `actor_kind`. Janela deslizante em dias, e a
        série diária vem DENSA — dia sem gasto entra como zero, senão o
        sparkline mente sobre o ritmo.
      operationId: SpendController_getWorkspaceSpendReport
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
        - name: dias
          required: false
          in: query
          description: Janela deslizante. Padrão 30, máximo 180.
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSpendReportResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Exige `owner` no workspace.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Quebra o gasto do workspace por modelo, provider, projeto, ator e dia
      tags:
        - llm
  /workspaces/{workspaceId}/summary:
    get:
      description: >-
        Contagem de projetos, agentes que gastaram tokens neste mês e o gasto do
        mês — alimenta a linha de resumo do painel de projetos.
      operationId: WorkspacesController_getSummary
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSummaryResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no workspace.
        '404':
          description: O workspace não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Resumo agregado do workspace
      tags:
        - workspaces
  /workspaces/{workspaceId}/tool-router:
    put:
      description: >-
        Ligado por padrão. Quando ligado E o modelo do turno é do OpenRouter, um
        passo de agente com duas ou mais ferramentas primeiro pergunta ao Jev
        qual ferramenta cabe, e ao modelo de chat só são oferecidas essa
        ferramenta e a anterior. O Jev nunca aprova nem nega nada: ação que
        exige aprovação continua exigindo. Qualquer falha do Jev cai no catálogo
        inteiro. Desligá-lo para toda chamada ao Jev, e o custo delas junto.
      operationId: WorkspacesController_setToolRouter
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetToolRouterDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no workspace.
        '404':
          description: O workspace não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Liga ou desliga o roteamento de ferramentas do Jev no workspace
      tags:
        - workspaces
  /workspaces/{workspaceId}/unread-events:
    post:
      description: >-
        A gaveta do sino, para o workspace inteiro (RN-091). Cada cursor diz até
        qual `seq` aquele projeto já foi lido, e a resposta traz o que veio
        depois disso na sessão mais recente de cada um.


        **É POST porque é o único verbo com CORPO, não porque muda estado.** O
        servidor não sabe onde cada leitor parou: "lido até aqui" é um `seq` por
        projeto guardado no navegador, e (de propósito) não há endpoint de
        marcar como lido. Então o corte precisa VIAJAR no pedido, e são dezenas
        de pares — numa query string isso vira uma URL longa, que um proxy
        corta, e ainda poria os ids de projeto do usuário em logs de acesso. A
        rota é idempotente e não tem efeito colateral: responde `200`, nunca
        `201`.


        Substitui um pedido POR PROJETO com a gaveta aberta — 23 projetos
        custavam 286 req/min contra um limite de 300.
      operationId: WorkspacesController_getUnreadEvents
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnreadEventsDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectUnreadEventsResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no workspace.
        '404':
          description: O workspace não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Eventos não lidos de vários projetos, numa chamada só
      tags:
        - workspaces
info:
  title: Brabo API
  description: >-
    A API do Brabo. Todo endpoint devolve JSON, exceto os quatro explicitamente

    documentados com outro `content-type` (os dois de SSE, o de métricas,

    e o callback OAuth, que redireciona).


    ## Autenticação


    O access token é um **JWT EdDSA de 15 minutos**, apresentado em

    `Authorization: Bearer <token>`. A chave pública mora em

    `GET /.well-known/jwks.json`.


    O refresh **não** é JWT: é um token opaco que mora num cookie

    `httpOnly` (`brabo_refresh`, `Path=/auth`, `SameSite=Strict`) e

    nunca aparece em corpo de resposta nenhum. `POST /auth/refresh` e

    `POST /auth/logout` leem o cookie e exigem que o cabeçalho `X-CSRF-Token`

    bata com o cookie `brabo_csrf`.


    **A rotação é obrigatória.** Cada refresh consome o token apresentado e

    emite outro. Reapresentar um já consumido é assinatura de roubo

    e revoga a família INTEIRA — inclusive a sessão legítima. Um cliente

    que dispara dois refreshes concorrentes derruba a si mesmo; use uma única

    chamada em voo.


    As rotas `/internal/*` são a superfície api ↔ engine e ficam **fora do

    JWT**: exigem o cabeçalho `X-Brabo-Service-Token` com o segredo

    compartilhado. Token de usuário não abre nenhuma delas.


    ## Erros


    Formato padrão do NestJS: `{ "statusCode": number, "message": string |
    string[], "error": string }`.


    | código | quando |

    |---|---|

    | `400` | corpo inválido — o `ValidationPipe` roda com `whitelist` e
    `forbidNonWhitelisted`, então campo desconhecido também reprova |

    | `401` | sem token, token expirado ou credencial inválida |

    | `403` | autenticado mas sem o papel que o RBAC exige, ou service token
    errado |

    | `404` | o recurso não existe **ou** é invisível para quem chama |

    | `409` | conflito de estado — transição de sessão inválida, recurso já
    existe |

    | `429` | rate limit ou bloqueio progressivo |


    As rotas de auth respondem de forma **deliberadamente indistinguível** entre

    e-mail inexistente, senha errada e conta bloqueada: mesmo corpo, mesmo
    status, mesmo

    tempo. É isso que fecha a enumeração de contas, e não é defeito de

    diagnóstico.


    ## Rate limit


    Janela deslizante no Postgres: 300 requisições por usuário e 600 por IP a
    cada 60s,

    configurável. Rota `@Public()` e rota de serviço são **isentas** — o que

    protege `/auth/*` é o bloqueio progressivo, não o rate limit.
  version: 0.1.0
  contact: {}
