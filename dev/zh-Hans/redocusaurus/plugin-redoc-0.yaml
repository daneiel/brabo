  /projects/{projectId}/sessions/{sessionId}/chat:
    post:
      description: >-
        Server-Sent Events。`delta` 帧携带增量文本，`done` 以 token
        和成本计费收尾。`metering_failed` 帧表示响应已发出但成本没有计入——失败会显现出来而不是消失。如果在
        `policy=block` 下超出预算，流会携带 `error` 且没有
        `delta`。此路由不携带代理：它把文本单独发送给绑定的模型，没有历史也没有系统提示词。在从未激活过任何代理的 `consultiva`
        会话中，它会在产生任何效果之前被拒绝（RN-682）——请改用 `.../agents/:agent/message` 与代理对话。
      operationId: ChatController_chat
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageDto'
      responses:
        '200':
          description: 直到 `done` 或 `error` 的帧流。
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatSseEventResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 未找到项目或会话。
        '422':
          description: >-
            `destinatario_ausente`：没有代理的 `consultiva`
            会话——消息没有接收者。没有记录任何内容，也没有调用任何模型（RN-682）。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 与会话的模型对话，以流式返回响应
      tags:
        - llm
  /projects/{projectId}/sessions/{sessionId}/context-summary:
    get:
      description: >-
        在整个会话日志上统计的业务规则、决策记录和每个代理的制品（界面读取的是 200 个事件的尾部），以及此会话和其已批准的 Dev Lead
        计划所激活的执行会话中被 `git_commit`/`git_push` 触及的文件（RN-828）。自 RN-844
        起，它还返回规则和决策的条目（各最新 50 条；总数仍在 `regras`/`decisoes` 中）以及这些会话中打开的 PR 的文件，读取自
        PR 标签页所读的同一 diff，每次调用最多 20 个 PR；`prsNaoLidas` 说明有多少被略过或失败。只读；没有新表。
      operationId: SessionsController_contextSummary
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContextSummaryResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目中的角色不足。
        '404':
          description: 项目或会话不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 为上下文面板统计整个会话
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}/events:
    get:
      description: >-
        日志不可变，按 `seq` 排序。常规分页是增量式的：把上一个响应的 `nextCursor` 作为 `afterSeq`
        传入。`latest=true` 则相反——它获取尾部并忽略 `afterSeq`，供那些在末尾打开而不是从头重建整个会话的界面使用（ADR
        0021）。
      operationId: SessionsController_listEvents
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: afterSeq
          required: false
          in: query
          description: 返回 `seq` 大于此值的事件。
          schema:
            example: 40
            type: string
        - name: limit
          required: false
          in: query
          schema:
            example: 50
            type: string
        - name: latest
          required: false
          in: query
          description: 获取日志尾部；忽略 `afterSeq`。
          schema:
            example: 'true'
            type: string
        - name: actionId
          required: false
          in: query
          description: >-
            只返回 `payload.actionId` 为此操作的事件——例如它的
            `proposed_action.created`，其中携带操作记录不保存的策略 `reason` 和
            `scopeRoot`（RN-614）。可与其他参数组合；页内的 `seq`
            不再连续，因此按操作过滤的调用方不得据此推算省略的数量。空值返回 `400`。
          schema:
            example: 01JC4Z0000ACAO00000000000001
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeEventosResponseDto'
        '400':
          description: '`actionId` 存在但为空。'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目中的角色不足。
        '404':
          description: 项目或会话不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 分页读取会话的事件日志
      tags:
        - sessions
    post:
      description: 仅追加：`seq` 由服务器分配，日志中的任何内容之后都不会被更新或删除。按设计没有编辑端点。
      operationId: SessionsController_appendEvent
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendSessionEventDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEventResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '403':
          description: 在项目中的角色不足。
        '404':
          description: 项目或会话不存在。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 向会话日志追加一个事件
      tags:
        - sessions
  /projects/{projectId}/sessions/{sessionId}/events/{eventId}:
    get:
      description: 它的存在是为了让 Psychologist 的假设证据无论落在哪一页、无论信息流的过滤条件如何，都能找到所引用的事件。
