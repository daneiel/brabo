            type: string
      responses:
        '204':
          description: Token revogado. Sem corpo.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Revoga um Personal Access Token próprio
      tags:
        - projetos
  /projects/{projectId}/personal-access-tokens/{tokenId}/admin:
