        '409':
          description: Недопустимый переход или задача другого агента.
      security:
        - service-token: []
      summary: Меняет состояние задачи по мере продвижения работы
      tags:
        - internal
  /internal/sessions/{sessionId}/tasks/{taskId}/unblock:
    post:
      description: >-
        Вызывается заданием повтора engine (до 3 раз, через 1, 3 и 10 мин). Тот
        же сценарий использования, что и разблокировка человеком, с актором
        `system`; задача, которая больше не заблокирована, остаётся нетронутой.
      operationId: InternalSessionsController_unblockTaskAutomatically
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: taskId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnblockTaskInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponseDto'
        '400':
          description: Некорректное тело.
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '404':
          description: Сессия, проект или ресурс не найдены.
      security:
        - service-token: []
      summary: Разблокирует задачу после временного сбоя сети/провайдера
      tags:
        - internal
  /internal/sessions/{sessionId}/tasks/claim:
    post:
      description: >-
        АТОМАРНО по замыслу: при нескольких dev agent на одном модуле два
        одновременных claim не могут вернуть одну и ту же задачу. Если доступной
        задачи нет, возвращает пустой результат вместо ошибки.
      operationId: InternalSessionsController_claimTask
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimTaskInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponseDto'
        '400':
          description: Некорректное тело.
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '404':
          description: Сессия, проект или ресурс не найдены.
      security:
        - service-token: []
      summary: Атомарно забирает следующую доступную задачу модуля
      tags:
        - internal
  /internal/sessions/{sessionId}/tasks/in-progress-by-dev:
    get:
      description: >-
        Не заблокированные и вне gate PR; пусто, если сессия не является сессией
        выполнения. Используется engine при остановке выполнения, чтобы
        заблокировать те, которые не удерживает ни один живой dev agent.
      operationId: InternalSessionsController_tarefasEmCursoDeDev
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TarefaEmCursoDeDevResponseDto'
        '400':
          description: Некорректное тело.
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '404':
          description: Сессия, проект или ресурс не найдены.
      security:
        - service-token: []
      summary: Перечисляет задачи проекта в работе, удерживаемые dev agent
      tags:
        - internal
  /internal/sessions/{sessionId}/termination:
    post:
      description: >-
        Сюда доходят только завершения, которые НЕ вызвала api, — падение, kill,
        `heartbeat_timeout`, защитное выключение. Остановка, запланированная
        самой api, сюда не проходит: engine уже узнал о ней через outbox, и
        сообщать о ней обратно было бы эхом.
      operationId: InternalSessionsController_report
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportSessionTerminationDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '400':
          description: Некорректное тело.
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '404':
          description: Сессия, проект или ресурс не найдены.
      security:
        - service-token: []
      summary: Сообщает, что процесс сессии завершился в engine
      tags:
        - internal
  /live:
    get:
      description: >-
        НАМЕРЕННО НЕ касается базы данных. Если бы касался, медленный Postgres
        перезапустил бы ВСЕ реплики сразу и превратил деградацию в полный отказ.
        Pod убирается из балансировщика нагрузки через `/health`.
      operationId: HealthController_live
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponseDto'
      summary: Liveness — процесс всё ещё обслуживает запросы
      tags:
        - infrastructure
  /llm/provider-capabilities:
    get:
      description: >-
        Слой ПРОВАЙДЕРА возможностей (ADR 0041) для девяти провайдеров,
        прочитанный из тех же экземпляров, что обслуживают вызовы. Возможность
        равна `true`, только если доказана против реального API. Экран читает
        отсюда `routingPreference`, прежде чем предложить предпочтение
        маршрутизации в binding (ADR 0166).
      operationId: ProviderCapabilitiesController_list
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderCapabilitiesResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Перечисляет, что умеет каждый провайдер LLM, независимо от модели
      tags:
        - llm
  /metrics:
    get:
      description: >-
        Не JSON: это `text/plain` в формате экспозиции. Публичный по
        необходимости (сборщик не несёт токена) и ограничен СЕТЬЮ — Ingress
        продакшена блокирует этот путь на границе, а NetworkPolicy разрешает
        только пространство имён мониторинга.
      operationId: MetricsController_scrape
      parameters: []
      responses:
        '200':
          description: Метрики в формате экспозиции.
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP oban_queue_depth Oban queue depth
                # TYPE oban_queue_depth gauge
                oban_queue_depth{queue="default",state="available"} 0
      summary: Отдаёт метрики в формате экспозиции Prometheus
      tags:
        - infrastructure
  /projects/{projectId}:
