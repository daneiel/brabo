        用于 `connect/3` 认证，对象是 Phoenix 套接字 `/runner`（主题 `terminal:<projectId>`，角色
        “runner”）——不是复用的 JWT，此路由本身只接受 Personal Access Token 代替会话 JWT（ADR
        0105）。TTL 30 秒，一次性使用。如果项目不处于 “runner” 模式则以 400
