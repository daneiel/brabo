        '404':
          description: Сессия, проект или ресурс не найдены.
        '409':
          description: >-
            `agente_ja_ativo` (ADR 0182, RN-635): целевой агент уже активен в
            незакрытой сессии проекта. `message` — текст, который агент читает
            как результат инструмента.
      security:
        - service-token: []
      summary: Предлагает handoff от одного агента другому
      tags:
        - internal
