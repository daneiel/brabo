        '403':
          description: 在该范围上的角色不足。
        '404':
          description: 未找到该范围。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 一次读取解析多个代理和区域的模型
      tags:
        - llm
  /projects/{projectId}/models:
    get:
      description: >-
        `local` 类别是 Ollama 的模型，不花钱；`cloud` 是付费 API 的模型。workspace
        未激活的模型不会出现在这里，但仍保留在历史成本中——要查看它请使用目录路由。该列表属于项目的所有者 workspace：同一模型可以在一个
        workspace 中开启而在相邻的 workspace 中关闭（ADR 0049）。
