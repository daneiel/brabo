          description: >-
            Ссылка OCI с явным ТЕГОМ или digest. `latest` ОТКЛОНЯЕТСЯ с 400 —
            правило на уровне домена.
        rationale:
          type: string
          example: >-
            The module_map is TypeScript on Node 22; the slim variant has the
            runtime and nothing else.
          description: Почему этот образ. Минимум 10 символов.
        network:
          type: string
          enum:
            - none
            - egress
          default: none
          description: >-
            Сетевая позиция контейнера. `none` — значение по умолчанию, и именно
            оно делает фразу «внутри агент свободен» безопасной.
        resources:
          type: object
          additionalProperties: true
          example:
            cpus: 2
            memoryMb: 4096
            pidsLimit: 512
          description: >-
            Лимит ресурсов. Выше максимума решение ОТКЛОНЯЕТСЯ, а не молча
            понижается.
      required:
        - projectId
        - image
        - rationale
    DecisaoDeImagemResponseDto:
      type: object
      properties:
        image:
          type: string
          example: node:22-bookworm-slim
          description: >-
            Ссылка OCI с явным ТЕГОМ или digest. `latest` отклоняется: артефакт
            должен говорить то же самое и через шесть месяцев.
        rationale:
          type: string
          example: >-
            The module_map is all TypeScript over Node; the slim variant is
            enough and reduces surface.
          description: Почему ЭТОТ образ. Именно это делает решение проверяемым.
        network:
          type: string
          enum:
            - none
            - egress
          example: none
          description: >-
            Сетевая позиция контейнера, решаемая ОДИН раз в артефакте, а не от
            команды к команде. `egress` — это стоимость и поверхность атаки:
            Архитектор просит, пользователь разрешает при создании.
        resources:
