  /projects/{projectId}/rag/search:
    post:
      description: >-
        将余弦相似度（pgvector）与词法 `ts_rank`（tsvector）结合，二者来自独立的查询，通过加权求和合并并按阈值截断（ADR
        0080）。当嵌入提供商没有响应、搜索只用词法信号运行时，`vectorAvailable: false`
        会发出提示——它从不假装运行了完整的混合搜索。
      operationId: RagController_buscar
      parameters:
