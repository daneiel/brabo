        响应只是一个确认，并在接受时返回——在代理的回合结束之前（ADR
        0163）。代理的回复通过会话的事件日志和通道到达——而不是通过这次调用。如果代理正处于回合中，消息不会被拒绝：它会进入代理的队列（`entrega:
        "enfileirada"`），在当前回合结束时与其他排队的消息在一个回合中一起被读取；等待期间可以取消（RN-673，ADR 0191）。
