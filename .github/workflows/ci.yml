name: CI

# Fase 5, item 4. Antes disto o repo não tinha CI de verdade: os dois workflows
# ao lado são helpers do Claude e nenhum roda teste.
#
# Este workflow é o que a proteção da branch `dev` deve exigir — a configuração
# está documentada em docs/adr/0024, e aplicá-la é passo MANUAL do usuário nas
# settings do GitHub (hoje bloqueado pelo plano do repo, ver o ADR).
# Só `pull_request`, sem `push`.
#
# Antes, `push` na branch de trabalho e `pull_request` para a permanente
# disparavam os DOIS — todo job rodava duas vezes por PR, incluindo os ~5,5 min
# do build de imagens: 11 minutos gastos para produzir o mesmo veredito duas
# vezes.
#
# Nada se perde em cobertura: a política exige PR para toda mudança, e PR em
# rascunho já dispara `opened` e `synchronize`. Quem quer CI antes de pedir
# review abre o PR como rascunho.
#
# O gatilho cobre a escada inteira (dev, qa, main). Enquanto filtrava só `dev`,
# um PR de promoção não rodava CI nenhum — e exigir estes checks nas
# permanentes travaria o PR para sempre, porque o check exigido nunca
# apareceria.
on:
  pull_request:
    branches:
      - dev
      - qa
      - main

# Push seguido de push no mesmo PR cancela a execução anterior: o que importa
# é o resultado do HEAD.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.11.1'
  PNPM_VERSION: '11.3.0'
  ELIXIR_VERSION: '1.17.3'
  OTP_VERSION: '27.1.2'
  # Mesmas versões pinadas do docker/engine/Dockerfile.prod. Divergir daqui
  # significa testar contra um scanner diferente do que roda em produção.
  # O passo "Versões dos scanners batem com o Dockerfile.prod" (job `lint`)
  # falha o build se estas três divergirem do que está lá.
  GITLEAKS_VERSION: '8.30.1'
  HADOLINT_VERSION: '2.12.0'
  YAMLLINT_VERSION: '1.38.0'
  ACTIONLINT_VERSION: '1.7.12'
  # Manifests de Kubernetes (Fase 5, sessão 2).
  KUSTOMIZE_VERSION: '5.8.1'
  KUBECONFORM_VERSION: '0.7.0'
  # SHA-256 de cada binário baixado por `curl` neste workflow — sem isto, um
  # `curl` que baixa release do GitHub sem checar nada é supply-chain aberta
  # (release comprometido ou MITM entregam um binário diferente do esperado,
  # e ninguém percebe até o scanner falhar em rodar, ou pior, "funcionar").
  # GITLEAKS_SHA256/HADOLINT_SHA256/ACTIONLINT_SHA256 são os MESMOS valores do
  # docker/engine/Dockerfile.prod (mesmo binário, mesma versão); conferidos
  # aqui de novo, por download independente, contra o checksums.txt publicado
  # em cada release. KUSTOMIZE_SHA256/KUBECONFORM_SHA256 não têm par no
  # Dockerfile.prod (o engine não usa os dois), mas seguem o mesmo método.
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  HADOLINT_SHA256: '56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010'
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
  KUSTOMIZE_SHA256: '029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d'
  KUBECONFORM_SHA256: 'c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # Barato e cedo de propósito (nenhuma dependência instalada ainda): o
      # comentário perto de GITLEAKS_VERSION/HADOLINT_VERSION/ACTIONLINT_VERSION
      # promete que estas versões batem com docker/engine/Dockerfile.prod, mas
      # nada FORÇAVA isso até agora — alguém podia atualizar um dos dois
      # arquivos e o outro ficaria mudo, silenciosamente testando um scanner
      # diferente do que roda em produção (achado #8 da revisão de
      # 2026-08-28, docs/explanation/backlog.md).
      - name: Versões dos scanners batem com o Dockerfile.prod do engine
        run: |
          set -euo pipefail
          falhou=0
          for var in GITLEAKS_VERSION HADOLINT_VERSION ACTIONLINT_VERSION; do
            do_ci="$(grep -oP "^\s*${var}: '\K[^']+" .github/workflows/ci.yml)"
            do_dockerfile="$(grep -oP "^ARG ${var}=\K.+" docker/engine/Dockerfile.prod)"
            if [ "${do_ci}" != "${do_dockerfile}" ]; then
              echo "::error::${var} diverge — ci.yml='${do_ci}' Dockerfile.prod='${do_dockerfile}'"
              falhou=1
            fi
          done
          if [ "${falhou}" -ne 0 ]; then
            echo "As versões dos scanners têm que bater entre ci.yml e docker/engine/Dockerfile.prod."
            exit 1
          fi
          echo "ok: GITLEAKS_VERSION/HADOLINT_VERSION/ACTIONLINT_VERSION batem entre ci.yml e Dockerfile.prod"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `eslint` direto, SEM o script `lint` do package.json: ele roda com
      # `--fix`, que num CI "conserta" o arquivo e sai verde sem ninguém ver o
      # problema. Aqui o modo é verificação.
      - name: ESLint (api, modo verificação)
        run: pnpm --filter api exec eslint "src/**/*.ts" --max-warnings 0

      - name: Oxlint (web)
        run: pnpm --filter web lint

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # SÓ RESTAURA — quem ESCREVE o cache do Elixir é o `test-engine`, e essa
      # assimetria é o ponto, não um detalhe.
      #
      # Antes eram duas entradas de cache mantidas em paralelo, sem reuso
      # cruzado: `lint` e `audit` gravavam `${os}-mix-deps-…` com `deps` só, e o
      # `test-engine` gravava `${os}-mix-…` com `deps` + `_build`. Duas cópias
      # das mesmas deps, e o `_build` — que é o que pesa, e cuja ausência faz o
      # `test-engine` variar de 39s a 124s — só existia numa delas.
      #
      # A saída ÓBVIA seria unificar a key e dar `_build` aos três. Ela está
      # ERRADA, e o modo de falha é silencioso: no Actions o PRIMEIRO que grava
      # uma key ganha, e gravação subsequente na mesma key é descartada. Como o
      # `lint` (66s) termina antes do `test-engine` (124s) e NÃO compila nada, ele
      # gravaria um `_build` vazio sob a key compartilhada — e o `test-engine`
      # passaria a restaurar isso e recompilar do zero para sempre. Unificar
      # deixaria o CI mais LENTO, com cache verde.
      #
      # Por isso `cache/restore`: mesma key e mesmos paths do escritor, zero
      # gravação. Cache frio aqui degrada para o que já era o caminho frio —
      # `mix deps.get` pela rede.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            apps/engine/deps
            apps/engine/_build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('apps/engine/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      # `mix format` NÃO é standalone aqui: o .formatter.exs faz
      # `import_deps: [:ecto, :ecto_sql, :phoenix]` para conhecer as macros
      # dessas libs, e sem as deps baixadas ele falha com "Unknown dependency".
      - name: mix deps.get
        working-directory: apps/engine
        run: mix deps.get

      # Mesma disciplina do eslint: `--check-formatted`, não `mix format`.
      #
      # A versão do Elixir aqui É load-bearing: as regras do formatador mudam
      # entre versões, então este check só é estável porque bate com o
      # ELIXIR_VERSION pinado nos Dockerfiles. Ver ADR 0024, decisão 10.
      - name: mix format --check-formatted
        working-directory: apps/engine
        run: mix format --check-formatted

      # Os Dockerfiles de produção passam pelo mesmo linter que o gate de QA de
      # infra usa nos artefatos que o agente propõe (ADR 0021).
      - name: Hadolint nos Dockerfiles de produção
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint
          /tmp/hadolint docker/api/Dockerfile.prod docker/engine/Dockerfile.prod \
            docker/web/Dockerfile.prod docker/backup/Dockerfile.prod

  test-ts:
    name: Testes TS (api + web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # pgvector, não `postgres:16` puro: as migrations criam a extensão e um
        # Postgres sem ela falha na primeira migration.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: brabo
          POSTGRES_PASSWORD: brabo
          POSTGRES_DB: brabo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brabo -d brabo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # O globalSetup do vitest cria a brabo_test e aplica as migrations
      # sozinho — só precisa de um Postgres onde possa CREATE DATABASE.
      DATABASE_URL: postgres://brabo:brabo@localhost:5432/brabo
      TEST_DATABASE_URL: postgres://brabo:brabo@localhost:5432/brabo_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Testes da api
        run: pnpm --filter api test

      # O vitest transpila por SWC, que APAGA os tipos sem verificá-los — o
      # mesmo motivo do typecheck dos scripts de CI, logo abaixo. Aqui isso
      # importa mais do que parece: os DTOs de resposta da Fase 7b provam por
      # TIPO que espelham a entidade de domínio (`Wire<T>` + `MesmasChaves`),
      # e sem este passo essa prova só rodaria no job de imagens, 20 minutos
      # depois e num lugar que ninguém lê.
      - name: Typecheck da api
        run: pnpm --filter api typecheck

      - name: Testes do web
        run: pnpm --filter web test

      # O web NÃO tinha typecheck no CI — só `lint` e `test`, e os dois passam
      # com erro de tipo (o vitest transpila por esbuild, que apaga os tipos
      # sem verificá-los, e o eslint não faz checagem de tipo aqui). O único
      # lugar que verificava era o `tsc -b` dentro do build da IMAGEM, que só
      # roda no bootstrap do k8s — feito à mão.
      #
      # O resultado foi quatro erros acumulados em três fases sem ninguém ver,
      # e a imagem `brabo-web` sem conseguir ser construída — ou seja, o deploy
      # Kubernetes inteiro quebrado, em silêncio. `--force` porque o `tsc -b`
      # é incremental e pularia o trabalho num runner com cache.
      - name: Typecheck do web
        run: pnpm --filter web typecheck

      # Os scripts de CI são lógica pura, sem banco — mas rodam no mesmo job
      # porque compartilham o `pnpm install` acima.
      - name: Testes dos scripts de CI
        run: pnpm --filter @brabo/scripts test

      # O Node executa os `.ts` de scripts/ci/ por type stripping, que APAGA os
      # tipos sem verificá-los. Sem este passo, a anotação seria enfeite.
      - name: Typecheck dos scripts de CI
        run: pnpm --filter @brabo/scripts typecheck

      # `apps/runner` nunca rodou aqui até o ADR 0106 — buraco pré-existente,
      # mais grave agora que este código é publicado no npm pra terceiros.
      - name: Testes do runner
        run: pnpm --filter runner test

      - name: Typecheck do runner
        run: pnpm --filter runner typecheck

      - name: Build do runner (tsup)
        run: pnpm --filter runner build

      # O único teste que exercita o ARTEFATO EMPACOTADO de ponta a ponta —
      # os testes acima só chamam funções exportadas de `src/`, nunca o
      # `dist/index.cjs` que de fato vai pro registry.
      - name: Smoke do artefato empacotado do runner
        run: pnpm --filter runner smoke

  test-engine:
    name: Testes do engine (ExUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: brabo
          POSTGRES_PASSWORD: brabo
          POSTGRES_DB: brabo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brabo -d brabo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_USER: brabo
      POSTGRES_PASSWORD: brabo
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # O ESCRITOR do cache do Elixir — `lint` e `audit` só restauram desta key.
      # Este é o único job que compila (`mix compile` + `mix test`), então é o
      # único cujo `_build` vale ser guardado. O porquê de não distribuir a
      # gravação está no comentário do `lint`.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            apps/engine/deps
            apps/engine/_build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('apps/engine/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      # ---------------------------------------------------------------------
      # ESTE PASSO É O QUE IMPEDE UM FALSO-VERDE.
      #
      # test_helper.exs exclui as tags :gitleaks/:hadolint/:yamllint/:actionlint
      # quando o binário não existe na máquina. Esses módulos são exatamente as
      # REGRESSÕES que provam que os gates não aprovam vazio (ADR 0020: o
      # gitleaks varria o histórico em vez da árvore; ADR 0021: o gate de QA de
      # infra aprovava qualquer Dockerfile; ADR 0039: o Workflows geraria
      # pipeline sem validação nenhuma). Num runner pelado eles somem em
      # silêncio e o CI fica verde sem nunca testar os gates de segurança.
      #
      # Versões idênticas às do Dockerfile.prod do engine.
      # ---------------------------------------------------------------------
      - name: Instalar os binários dos gates (gitleaks, hadolint, yamllint, actionlint)
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          sudo chmod 0755 /usr/local/bin/gitleaks
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  /usr/local/bin/hadolint" | sha256sum -c -
          sudo chmod 0755 /usr/local/bin/hadolint
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          sudo chmod 0755 /usr/local/bin/actionlint
          pipx install "yamllint==${YAMLLINT_VERSION}"
          gitleaks version && hadolint --version && yamllint --version && actionlint -version

      - name: mix deps.get
        working-directory: apps/engine
        run: mix deps.get

      - name: Compilar com --warnings-as-errors
        working-directory: apps/engine
        run: mix compile --warnings-as-errors

      - name: mix test
        working-directory: apps/engine
        run: mix test 2>&1 | tee /tmp/mix-test.log

      # Guarda do falso-verde: se qualquer teste foi EXCLUÍDO, algum binário do
      # passo acima não chegou e os gates não foram exercitados. Falhar aqui é
      # a diferença entre "verde" e "verde de verdade".
      - name: Nenhum teste pode ter sido excluído
        run: |
          if grep -qE '[1-9][0-9]* excluded' /tmp/mix-test.log; then
            echo "::error::testes excluídos — os binários dos gates não estavam disponíveis:"
            grep -E 'excluded' /tmp/mix-test.log
            exit 1
          fi
          echo "ok: nenhum teste excluído"

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job próprio, e não um passo do `lint`, porque a natureza da falha é
    # diferente: lint reprova o QUE ESCREVEMOS, auditoria reprova o que
    # IMPORTAMOS. Separado, dá para ver num relance se a PR quebrou por código
    # nosso ou porque uma CVE foi publicada num pacote de terceiro entre ontem
    # e hoje — que acontece sem ninguém tocar no repo.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--audit-level critical`: o gate é para CRÍTICA, como definido no
      # escopo da fase. HIGH e abaixo aparecem no log sem reprovar — reprovar
      # em `moderate` num monorepo com esta árvore de dependências
      # transformaria o CI num bloqueio permanente por coisa que ninguém pode
      # resolver hoje, e a reação seria desligar o gate inteiro.
      - name: pnpm audit (workspace)
        run: pnpm audit --audit-level critical

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # Só restaura, pelo mesmo motivo detalhado no job `lint`: o escritor do
      # cache do Elixir é o `test-engine`, e gravar daqui poria um `_build`
      # vazio sob a key dele.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            apps/engine/deps
            apps/engine/_build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('apps/engine/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: mix deps.get
        working-directory: apps/engine
        run: mix deps.get

      # Os dois respondem perguntas DIFERENTES e por isso os dois rodam:
      #   hex.audit    -> este pacote foi APOSENTADO pelo autor?
      #   deps.audit   -> este pacote tem CVE publicada? (mix_audit)
      # Só o primeiro, que foi o pedido original, deixaria o gate do engine sem
      # detectar vulnerabilidade nenhuma.
      - name: mix hex.audit (pacotes aposentados)
        working-directory: apps/engine
        run: mix hex.audit

      - name: mix deps.audit (CVEs)
        working-directory: apps/engine
        run: mix deps.audit

  secrets-scan:
    name: Gitleaks no repositório
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Histórico completo: um segredo removido no último commit continua
          # recuperável e precisa ser encontrado.
          fetch-depth: 0

      # `fetch-depth: 0` traz TODAS as refs, e o `gitleaks detect` varre todos os
      # commits alcançáveis — não só o histórico do HEAD. Desde o ADR 0034 isso
      # passou a incluir a `gh-pages`, que carrega o site CONSTRUÍDO.
      #
      # O efeito foi medido, não previsto: **112 achados `generic-api-key`** num
      # único commit do bot de publicação, todos em `dev/assets/js/*.js` — nomes de
      # arquivo de avatar dentro de bundle minificado, com entropia alta o
      # suficiente para a regra morder. Reprovou o PR de promoção #78 (`v1.1.0`), o
      # primeiro a ser varrido depois de a `gh-pages` nascer.
      #
      # A `gh-pages` NÃO é código-fonte: nada nela é escrito por pessoa, tudo é
      # gerado de `docs/` e `website/`. Varrê-la procurando segredo é procurar no
      # lugar errado, e o custo de não fazer nada seria pior que o ruído — check
      # required vermelho por ruído ensina a ignorar check vermelho.
      #
      # A saída NÃO é allowlist de caminho no `.gitleaks.toml`: aquilo valeria para
      # TODOS os commits, então um `dev/` que aparecesse no código-fonte um dia
      # ficaria sem varredura, em silêncio. Tirar a ref do escopo é preciso —
      # exclui exatamente os commits que não são fonte, e nada mais.
      #
      # Verificado por execução com o gitleaks 8.30.1, a mesma versão daqui:
      # antes 133 commits e 112 achados (idêntico ao log do #78); depois 132
      # commits e nenhum achado. E a prova de que não abriu buraco: um PAT do
      # GitHub com entropia real, plantado num commit de `apps/api/src/`, continua
      # sendo detectado.
      - name: Tirar a gh-pages do escopo
        run: |
          set -euo pipefail
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            git update-ref -d refs/remotes/origin/gh-pages
            echo "gh-pages fora do escopo — ela é site gerado, não fonte."
          else
            echo "gh-pages não existe neste clone; nada a excluir."
          fi

      - name: Instalar gitleaks
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          sudo chmod 0755 /usr/local/bin/gitleaks

      - name: gitleaks detect
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  manifests:
    name: Manifests de Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Instalar kustomize e kubeconform
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  /tmp/kustomize.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin kustomize
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          sudo chmod 0755 /usr/local/bin/kustomize /usr/local/bin/kubeconform

      # Dois níveis, que pegam coisas diferentes: `kustomize build` acha patch
      # sem alvo e conflito de ID; `kubeconform` acha campo com nome errado,
      # tipo errado e apiVersion inexistente. O segundo é o que separa "o YAML
      # monta" de "a API aceitaria" — sem ele, um `maxUnavailble` passaria.
      - name: Montar e validar os overlays
        run: bash deploy/k8s/validate.sh

      # O overlay local é o único exercitado de verdade (`make deploy-local`), e
      # o que o smoke assume dele são as portas. Se alguém mudar um NodePort
      # sem mudar o mapeamento do bootstrap, o cluster sobe e o smoke falha por
      # um motivo que não parece ter relação. Barato afirmar aqui.
      - name: Portas do overlay local batem com as do compose de produção
        run: |
          set -euo pipefail
          out="$(kustomize build deploy/k8s/overlays/local)"
          # 30080 saiu com o Keycloak (Fase 7.2): era a porta dele, e nenhum
          # serviço a ocupa desde então. Manter a asserção reprovaria para
          # sempre uma remoção que já foi feita de propósito.
          for port in 30300 30400 30088; do
            grep -q "nodePort: ${port}" <<<"${out}" \
              || { echo "NodePort ${port} sumiu do overlay local"; exit 1; }
          done

      # `WEB_PORT` e `WEB_ORIGIN` são a MESMA informação vista de dois lados: a
      # porta em que o browser abre o web, e a origem que a api e o engine
      # aceitam no CORS. Enquanto tiveram defaults independentes, trocar
      # `WEB_PORT` movia o browser e deixava o CORS para trás — e o console fala
      # de CORS, não de porta, então o tempo vai todo para o lugar errado
      # (ADR 0037). Derivar um do outro torna a divergência impossível; esta
      # asserção impede que alguém volte a separá-los sem perceber.
      - name: WEB_ORIGIN deriva de WEB_PORT nos composes
        run: |
          set -euo pipefail
          faltou=0
          for arquivo in docker/docker-compose.yml docker/docker-compose.prod.yml; do
            while IFS= read -r linha; do
              case "${linha}" in
                *'${WEB_PORT'*) ;;
                *)
                  echo "${arquivo}: WEB_ORIGIN não deriva de WEB_PORT -> ${linha}"
                  faltou=1
                  ;;
              esac
            done < <(grep -E '^[[:space:]]*WEB_ORIGIN:' "${arquivo}" || true)
          done
          if [ "${faltou}" -ne 0 ]; then
            echo "A porta faz parte do contrato de CORS — ver docs/adr/0037-cors-do-engine-e-a-porta-como-contrato.md"
            exit 1
          fi
          echo "ok: todo WEB_ORIGIN dos composes deriva de WEB_PORT"

      # O nome da métrica e os rótulos são referenciados por STRING em três
      # lugares que não se enxergam: o HPA, a regra do prometheus-adapter e o
      # smoke. Renomear a métrica no engine compila, passa na suite, e o único
      # sintoma é o HPA parar em `<unknown>` sem escalar.
      - name: HPA do engine referencia a métrica que o engine expõe
        run: |
          set -euo pipefail
          grep -q 'name: oban_queue_depth' deploy/k8s/base/engine/hpa.yaml
          grep -q 'state: available' deploy/k8s/base/engine/hpa.yaml
          grep -q 'oban_queue_depth' deploy/k8s/helm/prometheus-adapter-values.yaml
          grep -q 'by (queue, state)' deploy/k8s/helm/prometheus-adapter-values.yaml
          grep -rq 'oban_queue_depth' apps/engine/test/engine_web/controllers/metrics_controller_test.exs

      # Nome de métrica, de campo de log e de datasource são referenciados por
      # STRING em lugares que não se enxergam: dashboards, alertas, runbook e o
      # código. Divergir compila, passa na suite, e o único sintoma é painel
      # vazio ou link de correlação que deixou de aparecer.
      - name: Contratos de observabilidade batem entre código e dashboards
        run: |
          set -euo pipefail

          # Dashboards e alertas são JSON/YAML válidos.
          for f in deploy/k8s/observability/dashboards/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
          python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" \
            deploy/k8s/observability/alerts/brabo-alerts.yaml

          # Toda métrica citada nos dashboards existe no código.
          for metric in \
            brabo_llm_cost_micros_total brabo_llm_tokens_total \
            brabo_llm_call_duration_seconds brabo_sessions_active \
            brabo_tasks_blocked brabo_proposed_actions_decided_total; do
            grep -rq "${metric%_bucket}" apps/api/src/infrastructure/observability/brabo-metrics.ts \
              || { echo "métrica ${metric} está nos dashboards e não no código"; exit 1; }
          done
          grep -rq "oban_queue_depth" apps/engine/lib/engine_web/telemetry.ex
          grep -rq "brabo_engine_sessions_hosted\|:sessions, :hosted" apps/engine/lib/engine_web/telemetry.ex

          # `trace_id` com underscore nos TRÊS serviços — é o que o Alloy extrai
          # e o derivedFields do Loki procura.
          grep -q "trace_id" apps/api/src/infrastructure/observability/logger.config.ts
          # No engine o campo mora em `log_fields.ex` desde o ADR 0035: o
          # `json_log_formatter.ex` passou a só serializar o mapa que esse módulo
          # monta, e o `pretty_log_formatter.ex` consome o mesmo mapa. Apontar
          # para o dono dos NOMES é mais estável que para um dos formatadores.
          grep -q '"trace_id"' apps/engine/lib/engine/telemetry/log_fields.ex
          grep -q "trace_id" apps/web/src/lib/logger.ts
          grep -q "matcherRegex: trace_id" deploy/k8s/helm/grafana-values.yaml
          grep -q "trace_id" deploy/k8s/helm/alloy-values.yaml

          # A NetworkPolicy de OTLP existe: sem ela a instrumentação exporta
          # para o vazio, em silêncio.
          grep -q "allow-otlp-egress" deploy/k8s/base/common/netpol-observability.yaml
          grep -q "netpol-observability" deploy/k8s/base/kustomization.yaml

      - name: shellcheck nos scripts de deploy
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning deploy/k8s/*.sh docker/smoke.sh

  images:
    name: Build, scan e smoke das imagens de produção
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Build, scan e smoke no MESMO job de propósito: as quatro imagens somam
    # ~1,7 GB, e passá-las entre jobs por artifact custaria mais tempo de
    # upload/download do que o build inteiro. Aqui elas ficam no daemon local.
    #
    # O paralelismo vem do `bake`, não de uma matriz de jobs — cada job da
    # matriz teria seu próprio daemon, e aí as imagens precisariam trafegar.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # Os quatro alvos em PARALELO num builder só. Em sequência somavam ~6
      # dos 8 minutos do job (api 130s, engine 160s, web 49s, backup 20s).
      # Medido localmente com cache frio: 201s em sequência, 111s em paralelo.
      # No runner o ganho é menor — 2 vCPUs não sobrepõem `tsc` com `mix
      # compile` —, mas as esperas de rede de pnpm/mix/pip/apk sobrepõem bem.
      #
      # O que cada alvo constrói, com que cache e com que tag está no
      # docker-bake.hcl da raiz, que também é o que se roda na mão.
      - name: Build das quatro imagens (em paralelo)
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4  # v6
        with:
          files: docker-bake.hcl
          targets: default
          load: true

      # Critério de aceite explícito da sessão. Checado aqui além do smoke.sh
      # porque é barato e falha com mensagem direta.
      - name: Nenhuma imagem pode rodar como root
        run: |
          set -euo pipefail
          for img in brabo-api:prod brabo-engine:prod brabo-web:prod brabo-backup:prod; do
            user="$(docker inspect --format '{{.Config.User}}' "$img")"
            if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
              echo "::error::$img roda como root (Config.User='$user')"
              exit 1
            fi
            echo "ok: $img -> $user"
          done

      - name: Trivy na api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: brabo-api:prod
          format: table
          # Versão do binário do trivy pinada — a mesma usada pra validar o
          # .trivyignore.yaml localmente. É o default da action nesta tag; sem
          # pin explícito, atualizar a action mudaria o scanner em silêncio.
          version: v0.70.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # CVEs aceitas conscientemente, cada uma com justificativa e data de
          # expiração — ver o cabeçalho do arquivo.
          trivyignores: .trivyignore.yaml
          exit-code: '1'

      - name: Trivy no engine
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: brabo-engine:prod
          format: table
          # Versão do binário do trivy pinada — a mesma usada pra validar o
          # .trivyignore.yaml localmente. É o default da action nesta tag; sem
          # pin explícito, atualizar a action mudaria o scanner em silêncio.
          version: v0.70.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # CVEs aceitas conscientemente, cada uma com justificativa e data de
          # expiração — ver o cabeçalho do arquivo.
          trivyignores: .trivyignore.yaml
          exit-code: '1'

      - name: Trivy no web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: brabo-web:prod
          format: table
          # Versão do binário do trivy pinada — a mesma usada pra validar o
          # .trivyignore.yaml localmente. É o default da action nesta tag; sem
          # pin explícito, atualizar a action mudaria o scanner em silêncio.
          version: v0.70.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # CVEs aceitas conscientemente, cada uma com justificativa e data de
          # expiração — ver o cabeçalho do arquivo.
          trivyignores: .trivyignore.yaml
          exit-code: '1'

      - name: Trivy no backup
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: brabo-backup:prod
          format: table
          version: v0.70.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'

      # SMOKE_NO_BUILD: as imagens já estão no daemon, construídas com cache
      # acima — o compose reusaria a tag e reconstruiria à toa.
      - name: Teste de fumaça (compose.prod)
        run: SMOKE_NO_BUILD=1 bash docker/smoke.sh
