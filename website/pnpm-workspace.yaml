# Mesmas decisões do `allowBuilds` da raiz (comentários completos lá),
# reproduzidas aqui porque este lockfile é isolado e o pnpm perguntou por
# elas na primeira instalação:
#   - `@swc/core: true` — o `@docusaurus/faster` (auto-instalado como peer)
#     usa o binding nativo de verdade para o modo rápido do build; sem o
#     build, cai para um binário ausente, não para um fallback silencioso.
#   - `@parcel/watcher: false`, `core-js: false`,
#     `postman-code-generators: false` — nenhum dos três faz nada que o
#     build ou o `docusaurus gen-api-docs` precise (watcher de modo
#     watch-only, mensagem de patrocínio, `npm install` aninhado por
#     gerador). Mesmo motivo de cada um na raiz.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  core-js: false
  postman-code-generators: false
# `website/` NÃO é membro do workspace da raiz (ADR 0117) — este arquivo faz
# dele o PRÓPRIO root do pnpm (pacote único, sem `packages:`), com lockfile
# independente. `pnpm install` de dentro de `website/` já resolve contra
# ESTE arquivo, e não sobe até `../pnpm-workspace.yaml`, porque o pnpm usa o
# mais PRÓXIMO na árvore.
#
# Overrides de SEGURANÇA — mesma disciplina do `pnpm-workspace.yaml` da raiz
# (chave é a faixa vulnerável, presa à linha maior afetada). Cada entrada
# aqui tem uma origem PRÓPRIA dentro da árvore de dependências do
# Docusaurus — não é cópia cega da raiz. Onde a mesma faixa também protege
# `apps/api`/`apps/web` (lockfile agora separado), a entrada existe nos dois
# arquivos; onde é exclusiva de um lado, existe só lá. Ver ADR 0117 para o
# levantamento completo (`pnpm why <pacote> -r`) de qual pacote resolve por
# qual caminho.
