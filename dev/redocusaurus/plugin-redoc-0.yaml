      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelBindingResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no escopo.
        '404':
          description: Escopo não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Define o modelo padrão do workspace
      tags:
        - llm
  /workspaces/{workspaceId}/models/{modelId}/price-changes:
    get:
      description: >-
        A mais recente primeiro. É um log imutável: nunca recebe UPDATE, e a
        linha traz o par antes/depois para que a auditoria não dependa de
        reconstruir o "antes" a partir da linha anterior.
