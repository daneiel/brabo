          description: Sessão, projeto ou recurso não encontrado.
        '409':
          description: Transição inválida, ou tarefa de outro agente.
      security:
        - service-token: []
      summary: Move o estado da tarefa conforme o trabalho avança
      tags:
        - internal
  /internal/sessions/{sessionId}/tasks/{taskId}/unblock:
    post:
      description: >-
        Chamada pelo job de retentativa do engine (até 3 vezes, depois de 1, 3 e
        10 min). Mesmo caso de uso do desbloqueio humano, com ator `system`;
        tarefa que não está mais bloqueada fica intocada.
      operationId: InternalSessionsController_unblockTaskAutomatically
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: taskId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnblockTaskInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponseDto'
        '400':
          description: Corpo inválido.
        '403':
          description: Service token ausente ou diferente do compartilhado.
        '404':
          description: Sessão, projeto ou recurso não encontrado.
      security:
        - service-token: []
      summary: Desbloqueia uma tarefa depois de uma falha transitória de rede/provider
      tags:
        - internal
  /internal/sessions/{sessionId}/tasks/claim:
    post:
      description: >-
        ATÔMICA por desenho: com vários dev agents no mesmo módulo, dois claims
        concorrentes não podem devolver a mesma tarefa. Sem tarefa disponível,
        devolve vazio em vez de erro.
      operationId: InternalSessionsController_claimTask
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimTaskInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponseDto'
        '400':
          description: Corpo inválido.
        '403':
          description: Service token ausente ou diferente do compartilhado.
        '404':
          description: Sessão, projeto ou recurso não encontrado.
      security:
        - service-token: []
      summary: Reivindica atomicamente a próxima tarefa reivindicável do módulo
      tags:
        - internal
  /internal/sessions/{sessionId}/tasks/in-progress-by-dev:
    get:
      description: >-
        Não bloqueadas e fora dos gates de PR; vazio a menos que a sessão seja
        de execução. Usada pelo engine ao parar uma execução, para bloquear as
        que nenhum dev agent vivo segura.
      operationId: InternalSessionsController_tarefasEmCursoDeDev
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TarefaEmCursoDeDevResponseDto'
        '400':
          description: Corpo inválido.
        '403':
          description: Service token ausente ou diferente do compartilhado.
        '404':
          description: Sessão, projeto ou recurso não encontrado.
      security:
        - service-token: []
      summary: Lista as tarefas em andamento do projeto seguradas por um dev agent
      tags:
        - internal
  /internal/sessions/{sessionId}/termination:
    post:
      description: >-
        Só chegam aqui os encerramentos que a api NÃO causou — crash, kill,
        `heartbeat_timeout`, desligamento defensivo. Uma parada planejada pela
        própria api não passa por aqui: o engine já soube dela pela outbox, e
        relatá-la de volta seria eco.
      operationId: InternalSessionsController_report
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportSessionTerminationDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '400':
          description: Corpo inválido.
        '403':
          description: Service token ausente ou diferente do compartilhado.
        '404':
          description: Sessão, projeto ou recurso não encontrado.
      security:
        - service-token: []
      summary: Relata que o processo da sessão terminou no engine
      tags:
        - internal
  /live:
    get:
      description: >-
        NÃO toca o banco, de propósito. Se tocasse, um Postgres lento
        reiniciaria TODAS as réplicas de uma vez e transformaria degradação em
        queda total. O pod sai do balanceador pelo `/health`.
      operationId: HealthController_live
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponseDto'
      summary: Liveness — o processo ainda atende requisições
      tags:
        - infrastructure
  /llm/provider-capabilities:
    get:
      description: >-
        A camada de PROVIDER das capabilities (ADR 0041) para os nove providers,
        lida das mesmas instâncias que servem as chamadas. Uma capability só é
        `true` quando provada contra a API real. A tela lê `routingPreference`
        daqui antes de oferecer preferência de roteamento num binding (ADR
        0166).
      operationId: ProviderCapabilitiesController_list
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderCapabilitiesResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista o que cada provider de LLM sabe fazer, independente do modelo
      tags:
        - llm
  /metrics:
    get:
      description: >-
        Não é JSON: é `text/plain` no formato de exposição. Pública por
        necessidade (o scraper não carrega token) e restrita por REDE — o
        Ingress de produção bloqueia este caminho na borda e a NetworkPolicy só
        libera o namespace de monitoramento.
      operationId: MetricsController_scrape
      parameters: []
      responses:
        '200':
          description: Métricas no formato de exposição.
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP oban_queue_depth Oban queue depth
                # TYPE oban_queue_depth gauge
                oban_queue_depth{queue="default",state="available"} 0
      summary: Expõe métricas no formato de exposição do Prometheus
      tags:
        - infrastructure
  /projects/{projectId}:
    get:
      operationId: ProjectsController_get
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: O projeto não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Devolve um projeto pelo id
      tags:
        - projects
    patch:
      operationId: ProjectsController_update
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: O projeto não existe ou é invisível para quem chama.
        '409':
          description: Já existe um projeto com este slug no workspace.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Muda o nome ou o slug do projeto
      tags:
        - projects
    delete:
      description: Leva junto as sessões, o event log e as ações propostas.
      operationId: ProjectsController_remove
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: O projeto não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Remove o projeto
      tags:
        - projects
  /projects/{projectId}/actions:
    get:
      description: >-
        `status` é `pending` (o padrão) ou `failed`. `actionType` filtra por
        tipo — ex.: `git_merge`, para a aba de PRs achar a proposta de merge de
        uma PR sem saber qual sessão a criou. `status=failed` EXIGE `actionType`
        e lista as ações cuja execução falhou — a aba de PRs lê dali o último
        merge recusado de cada PR (conflito de merge traz
        `executionResult.conflictingFiles`).
      operationId: ProjectActionsController_list
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: status
          required: false
          in: query
          schema:
            example: pending
            type: string
        - name: actionType
          required: false
          in: query
          schema:
            example: git_merge
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProposedActionResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista as ações PENDENTES do projeto inteiro, de qualquer sessão
      tags:
        - actions
  /projects/{projectId}/agent-areas:
    get:
      description: >-
        O projeto nasce com as três áreas (RN-094), então a lista volta cheia
        mesmo antes de existir `module_map`. O que ativar a execução acrescenta
        são os MEMBROS da área de dev, um por módulo.
      operationId: ExecutionController_listAreas
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AreaDeAgentesResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou tarefa não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: As áreas de agentes do projeto, com o teto de cada lead
      tags:
        - execution
  /projects/{projectId}/agent-areas/{key}/budget:
    put:
      description: >-
        Exige `maintainer`, pelo mesmo motivo do teto de paralelismo: é uma
        checagem INDEPENDENTE e aditiva ao lado dos orçamentos de projeto e de
        sessão (ADR 0110) — não é cascata, nem substitui nenhum dos dois. O
        limite entra em DÓLARES e é convertido para micro-USD no servidor, a
        mesma convenção do `BudgetsController`. `null` limpa o teto.
      operationId: ExecutionController_setBudget
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: key
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAreaBudgetDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaDeAgentesResponseDto'
        '400':
          description: '`limitUsd` não é `null` nem um número >= 0.'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou tarefa não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Define (ou limpa) o teto de gasto de uma área
      tags:
        - execution
  /projects/{projectId}/agent-areas/{key}/max-parallel:
    patch:
      description: >-
        Exige `maintainer`, não `developer`, pelo mesmo motivo de ativar a
        execução: subir o teto é decidir quanto o produto pode gastar sem
        perguntar. Vale para os PRÓXIMOS pedidos — o que já aguarda a sua
        decisão continua aguardando.
      operationId: ExecutionController_setMaxParallel
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: key
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMaxParallelDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaDeAgentesResponseDto'
        '400':
          description: '`maxParallel` não é um inteiro >= 1.'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, sessão ou tarefa não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Muda o teto de paralelismo de uma área
      tags:
        - execution
  /projects/{projectId}/agent-autonomy:
    get:
      description: >-
        Só as regras gravadas explicitamente. Agente sem linha aqui cai no
        padrão do `permissions.json` do projeto.
      operationId: AgentAutonomyController_list
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentAutonomyRuleResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista a autonomia concedida a cada agente
      tags:
        - actions
    put:
      description: >-
        Upsert por (agente, tipo). NÃO sobrepõe o `permissions.json`: padrão já
        em `deny` continua bloqueado por mais autonomia que se conceda aqui.
        `actionType: "*"` é o "modo automático" (RN-153) — autonomia para
        QUALQUER tipo de ação deste agente; regra específica gravada depois
        continua vencendo a curinga para aquele tipo.
      operationId: AgentAutonomyController_set
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAgentAutonomyDto'
      responses:
        '204':
          description: Regra gravada. Sem corpo.
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Define a autonomia de um agente para um tipo de ação
      tags:
        - actions
  /projects/{projectId}/agent-bindings/{agentSlug}:
    get:
      description: >-
        Cascata agente → área → projeto → workspace, SEM sessão: é a
        configuração do agente no projeto, não a de uma conversa específica.
        `origin: "agent"` quer dizer que este agente DIVERGIU do padrão da área;
        qualquer outra origem quer dizer que ele herda.
      operationId: ModelBindingsController_getAgentBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: agentSlug
          required: true
          in: path
          schema:
            example: dev-api
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedBindingResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no escopo.
        '404':
          description: Escopo não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Resolve qual modelo um agente usa, e de onde veio
      tags:
        - llm
    put:
      description: >-
        Vale para toda sessão deste projeto que não tem binding próprio, e só
        para elas — antes do ADR 0064 o binding era global e alcançava outros
        projetos também. É assim que se dá um modelo barato ao Psicólogo e um
        caro ao Arquiteto no mesmo projeto, e também é como um agente DIVERGE do
        padrão da área.
      operationId: ModelBindingsController_setAgentBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: agentSlug
          required: true
          in: path
          schema:
            example: dev-api
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModelBindingDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelBindingResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no escopo.
        '404':
          description: Escopo não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Fixa o modelo de um agente NESTE projeto
      tags:
        - llm
    delete:
      description: >-
        APAGA o binding do agente — não copia o modelo da área para ele. Copiar
        pareceria igual na tela e não é: viraria uma cópia, e a próxima mudança
        da área deixaria este agente para trás em silêncio. 404 quando ele já
        herda.
      operationId: ModelBindingsController_clearAgentBinding
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: agentSlug
          required: true
          in: path
          schema:
            example: dev-api
            type: string
      responses:
        '204':
          description: O agente voltou a herdar. Sem corpo.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no escopo.
        '404':
          description: Escopo não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Faz o agente voltar a herdar o modelo da área
      tags:
        - llm
  /projects/{projectId}/agent-costs:
    get:
      description: >-
        Janela DESLIZANTE de 30 dias, não o mês civil corrente: é o rótulo que a
        tela mostra, e com mês civil a estimativa despencaria no dia 1º por
        virar a página, não por mudança de uso. Só conta `actor_kind = agent`
        (RN-038). Agente que nunca rodou não aparece na lista — a tela mostra um
        traço para ele, o que é diferente de zero.
      operationId: BudgetsController_getProjectAgentCosts
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentTokenUsageResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto ou sessão não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Quebra o gasto do projeto por agente, nos últimos 30 dias
      tags:
        - llm
  /projects/{projectId}/agents/{agent}/instruction-versions:
    get:
      description: >-
        A mais recente primeiro, cada uma já trazendo o diff contra a anterior,
        calculado no servidor.
      operationId: AnamneseController_versions
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: agent
          required: true
          in: path
          schema:
            example: dev-api
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstructionVersionResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, evento ou versão não existe.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista as versões de instrução de um agente
      tags:
        - anamnesis
  /projects/{projectId}/agents/{agent}/instruction-versions/{version}/rollback:
    post:
      description: >-
        O histórico é imutável: restaurar não apaga nada, CRIA uma versão nova
        com o conteúdo antigo. Exige `maintainer` porque muda o comportamento do
        agente dali em diante — mesmo calibre do patch.
      operationId: AnamneseController_rollbackVersion
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: agent
          required: true
          in: path
          schema:
            example: dev-api
            type: string
        - name: version
          required: true
          in: path
          description: Versão a restaurar.
          schema:
            example: 2
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackResponseDto'
        '400':
          description: A versão não é um inteiro positivo.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto, evento ou versão não existe.
        '429':
