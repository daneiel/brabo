apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: brabo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
    - Ingress
  ingress:
    # Sem `from`: o browser precisa alcançar o Keycloak de fora do cluster
    # (fluxo de authorization code + PKCE do brabo-web), e api e engine
    # precisam dele de dentro. Restringir a origem aqui quebraria o login.
    - ports:
        - protocol: TCP
          port: 8080
    # Porta de management: só o kubelet (probes) e nada mais. O kubelet chega
    # pelo IP do nó, que não casa com nenhum podSelector — daí sem `from`.
    - ports:
        - protocol: TCP
          port: 9000
