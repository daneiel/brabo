          type: string
          example: another pretty long passphrase
          minLength: 12
      required:
        - token
        - novaSenha
    ResolvedBindingResponseDto:
      type: object
      properties:
        modelId:
          type: string
          example: 01JC4Z0000MODELO00000000001
        origin:
          type: string
          enum:
            - workspace
            - project
            - area
            - agent
            - session
          example: project
          description: >-
            Из какой области действия пришло значение. Каскад: сессия → агент →
            проект → рабочее пространство, и раскрытие ИСТОЧНИКА позволяет
            интерфейсу сказать «унаследовано от проекта», а не показывать
            значение без происхождения.
        routingPreference:
          type: string
          enum:
            - price
            - throughput
            - latency
          nullable: true
          example: null
          description: >-
            Предпочтение маршрутизации того BINDING, КОТОРЫЙ ПОБЕДИЛ в каскаде
            (ADR 0166). Само по себе оно никогда не каскадируется: пропущенный
            уровень забирает своё предпочтение с собой, и ни один уровень не
            наследует только предпочтение другого.
        skipped:
          description: >-
            Более конкретные области действия, которые каскад отбросил до
            достижения `origin`. На обычном пути пусто.
          type: array
          items:
            $ref: '#/components/schemas/SkippedBindingResponseDto'
        herdadoDoLead:
          type: string
          example: secops
          description: >-
            Присутствует, когда у запрошенного агента не было собственной модели
            (ни у его области, ни у проекта) и он унаследовал РАЗРЕШЁННЫЙ
            binding lead своей области (RN-703). Тогда `origin` — это источник
            binding lead.
      required:
        - modelId
        - origin
        - routingPreference
        - skipped
    ResultadoPorProviderResponseDto:
      type: object
      properties:
        provider:
          type: string
          enum:
            - ollama
            - anthropic
            - openai
            - openrouter
            - nvidia-nim
            - together
            - deepinfra
            - bitdeer
            - vultr
            - 9router
          example: openai
        descobertos:
          type: number
          example: 3
          description: >-
            Модели, которых не было в базе данных. Они входят НЕАКТИВНЫМИ —
            активация — это курация владельца (RN-043).
        reencontrados:
          type: number
          example: 1
          description: >-
            Модели, которые были `unavailable` и вернулись в каталог. Их
            `isActive` не затрагивается: выбор владельца переживает отсутствие.
        indisponibilizados:
          type: number
          example: 0
          description: >-
            Модели, исчезнувшие из удалённого каталога. Они становятся
            `unavailable` и НИКОГДА не удаляются — на них указывают binding и
            история затрат.
        pulado:
          type: string
          enum:
            - sem_capability
            - sem_credencial
            - falha
          description: >-
            Присутствует, когда провайдер не был синхронизирован. Пропущенный
            провайдер ничего не помечает недоступным: «я не знаю, что там» — не
            то же самое, что «там ничего нет».
        origemDaFalha:
          type: string
          enum:
            - infra
            - modelo
          description: >-
            Только при `pulado: "falha"`. Словарь источников из ADR 0020 —
            `infra`, когда до провайдера даже не дотянулись, `modelo`, когда он
            ответил отказом.
        detalhe:
          type: string
          example: openai responded with status 401
      required:
        - provider
        - descobertos
        - reencontrados
        - indisponibilizados
    ReturnStoryDto:
      type: object
      properties:
        reason:
          type: string
          example: The acceptance criteria don't cover the payment refusal case.
          description: >-
            Причина ОБЯЗАТЕЛЬНА: она становится сообщением, закреплённым в
            сессии PO, а возврат без причины возвращает работу без информации.
      required:
        - reason
    RollbackResponseDto:
      type: object
      properties:
        agent:
          type: string
          example: dev-api
        restoredFrom:
          type: number
          example: 2
          description: Версия, чьё содержимое восстановлено.
        toVersion:
          type: number
          example: 5
          description: >-
            НОВАЯ версия, созданная откатом. История неизменяема: восстановление
            ничего не удаляет, а добавляет.
        cacheInvalidated:
          type: boolean
          example: true
          description: Успешно ли инвалидирован кеш инструкций engine.
      required:
        - agent
        - restoredFrom
        - toVersion
        - cacheInvalidated
    RosterFactsResponseDto:
      type: object
      properties:
        executionActivated:
          type: boolean
          example: true
          description: >-
            В самой свежей сессии уже записан `execution.activated` — именно это
            приводит в состав dev agent по модулям.
        moduleNames:
          example:
            - api
            - web
          description: >-
            Имена модулей из ТЕКУЩЕГО module_map (наибольший `version`). Один
            dev agent на модуль после активации выполнения.
          type: array
          items:
            type: string
        gatesEverOpened:
          type: boolean
          example: true
          description: >-
            Какой-либо gate PR (dev или infra) открывался ХОТЯ БЫ РАЗ в этой
            сессии — именно это приводит в состав QA и SecOps. Охватывает всю
            сессию, а не окно последних N событий.
        delegatedSubagents:
          example:
            - qa-automacao
          description: >-
            Субагенты хотя бы с одним делегированием, записанным в сессии,
            независимо от исхода, — отказ — это записанное решение, а не
            молчание.
          type: array
          items:
            type: string
        activatedAgents:
          example:
            - arquiteto
            - infra
          description: >-
            Агенты хотя бы с одним `agent.activated` в сессии, сначала самые
            недавно активированные (по `seq`), одна запись на агента (RN-630).
            Охватывает ВСЮ сессию, а не окно в 200 событий: клиент прибавляет
            это к окну и доверяет этому, только когда `latestSessionId` —
            сессия, которую он читает.
          type: array
          items:
            type: string
        infraActive:
          type: boolean
          example: false
          description: В самой свежей сессии есть handoff в состоянии `accepted` к `infra`.
        uxDesignerActive:
          type: boolean
          example: false
          description: >-
            В самой свежей сессии есть handoff в состоянии `accepted` к
            `ux-designer` (ADR 0087).
        staffActive:
          type: boolean
          example: false
          description: >-
            В самой свежей сессии есть handoff в состоянии `accepted` к `staff`
            (docs/fluxo.yml, ADR 0088) — спящий для автоматического запуска,
            лишь отражает уже принятую РУЧНУЮ активацию.
      required:
        - executionActivated
        - moduleNames
        - gatesEverOpened
        - delegatedSubagents
        - activatedAgents
        - infraActive
        - uxDesignerActive
        - staffActive
    RoteamentoDeModuloInternalDto:
