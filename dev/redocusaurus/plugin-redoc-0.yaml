          type: string
          enum:
            - delta
            - done
            - error
            - metering_failed
          example: delta
          description: >-
            `delta` leva `text` incremental; `done` fecha com a contabilidade de
            tokens/custo; `error` aborta; `metering_failed` quer dizer que a
            RESPOSTA saiu mas o custo não foi contabilizado — o quadro existe
            para essa falha não passar despercebida.
        text:
          type: string
          example: I will open the epic
          description: Só em `delta`.
        inputTokens:
          type: number
          example: 1820
          description: Só em `done`.
        outputTokens:
          type: number
          example: 340
          description: Só em `done`.
        costMicros:
          type: number
          example: 52700
          description: Só em `done`, micro-USD.
        estimated:
          type: boolean
          example: false
          description: >-
            Só em `done`. `true` quando o provider não devolveu contagem e o
            custo foi ESTIMADO — o número vale menos e a interface precisa poder
            dizer isso.
        message:
          type: string
          example: session budget exhausted
          description: Só em `error` e `metering_failed`.
      required:
        - type
    CicloDeVidaDoContainerResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - provisioning
            - running
            - stopped
            - failed
            - removed
          example: provisioning
          description: >-
            O que foi REGISTRADO, não o que um daemon do Docker confirma —
            nenhum orquestrador real transiciona esta tabela hoje (RN-243).
        imageVersion:
          type: number
          example: 1
          description: >-
            Versão do `artifact.project_image` CONGELADA na primeira transição
            (RN-245) — não reaplicada a cada leitura.
        resources:
          description: Teto DECLARADO no provisionamento — não aplicado (RN-248).
          allOf:
            - $ref: '#/components/schemas/RecursosDoContainerResponseDto'
        failureReason:
          type: object
          nullable: true
          example: null
          description: Só preenchido numa transição para `failed`.
        createdAt:
          type: string
          format: date-time
        statusChangedAt:
          type: string
          format: date-time
        observado:
          nullable: true
          description: >-
            O que o daemon do Docker relata AGORA, perguntado pelo broker (ADR
            0130) — nunca fundido com os campos acima, que são o que foi
            REGISTRADO. Um container morto por fora aparece como `running`
            registrado e `exited` observado, e é esse o ponto. `null` quer dizer
            "não há container" ou "não consegui olhar" — leia `naoObservado`
            para distinguir.
          type: object
          allOf:
            - $ref: '#/components/schemas/ObservacaoDeContainerResponseDto'
        naoObservado:
          type: string
          enum:
            - broker-nao-configurado
            - broker-sem-resposta
            - broker-recusou
            - null
          nullable: true
          example: broker-nao-configurado
          description: >-
            `null` quando a observação de fato ACONTECEU — inclusive quando
            voltou vazia, que é a afirmação positiva "olhei e não há container".
            Preenchido quando não houve como olhar, dizendo por quê. Herdar aqui
            o estado registrado é exatamente o que a RN-468 proíbe.
        detalheDaObservacao:
          type: object
          nullable: true
          example: null
          description: A mensagem do próprio broker, quando houve.
      required:
        - status
        - imageVersion
        - resources
        - failureReason
        - createdAt
        - statusChangedAt
        - observado
        - naoObservado
        - detalheDaObservacao
