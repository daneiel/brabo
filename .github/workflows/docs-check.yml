name: Guardião da documentação

# Roda em todo PR. Cinco perguntas, nesta ordem de custo — medida, não estimada
# (execuções 30313457222, 30313191242, 30312381170; job inteiro em 51-53s, ANTES
# do item 2 ganhar o sub-passo dos tipos do web — ver abaixo; não remedido):
#   1. o mapa de responsabilidade está íntegro? (0s)
#   2. o que é gerado está em dia? (10s — openapi.json/MDX da api; e, desde o
#      ADR 0117, os tipos do web gerados dele, `pnpm --filter web run
#      openapi:types:check`, que reusa o mesmo openapi.json já checado acima)
#   3. o PR atualizou a doc que deveria? (0-1s)
#   4. o site constrói sem link quebrado? (12s)
#   5. a referência de API RENDERIZA? (0s — e ver o comentário do passo)
#
# O item 4 dizia "minutos" e custa 12s: com o cache do Rspack quente e o
# `future.faster` do Docusaurus 3.10, ele não é nem o maior passo do job — o
# `pnpm install` (12-16s) é. Este workflow também NÃO está no caminho crítico do
# PR: termina em ~52s, contra ~5min do `ci.yml`.
on:
  pull_request:
    # `edited` junto dos três default, pelo mesmo motivo que o
    # `promotion-check.yml` registra: check required indexado por sha que não
    # roda deixa veredito velho colado.
    #
    # Este workflow é SENSÍVEL À BASE, e é isso que o separa do `ci.yml`. O
    # drift compara um RANGE (`origin/<base>...HEAD`) e lê o CORPO do PR atrás
    # da linha `docs-not-needed:`. Sem `edited`:
    #
    #   - retargetar o PR (o GitHub abre contra o default e o autor corrige
    #     depois) deixa no lugar um veredito calculado contra a base errada —
    #     que foi o que aconteceu no #71, reprovando por arquivos que já
    #     tinham sido revisados e mesclados noutro PR;
    #   - o escape hatch fica inalcançável sem um commit de mentira: escrever
    #     `docs-not-needed:` no corpo não reavaliava nada.
    #
    # O `ci.yml` não precisa disto: o que ele testa é o HEAD, e o resultado
    # dele não muda com a base.
    #
    # O preço é o job inteiro (~52s, dos quais 12s de `docs:build`) reexecutar
    # quando alguém só mexe no texto do PR. O `concurrency` acima já cancela a
    # execução anterior, e o veredito correto vale o custo.
    types: [opened, reopened, synchronize, edited]
  schedule:
    # Segunda, 06:00 UTC — só o check de links externos.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  guardiao:
    name: Drift, gerados e build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # O drift check compara com a branch base; sem histórico o range
          # `origin/<base>...HEAD` não resolve.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `website/` NÃO é mais membro do workspace da raiz (ADR 0117) — tem
      # `pnpm-lock.yaml` PRÓPRIO, e o install acima não o alcança. Sem este
      # passo separado, `pnpm docs:build` (agora `pnpm --dir website build`)
      # abaixo falharia por `node_modules` ausente.
      - name: Instalar dependências do website
        working-directory: website
        run: pnpm install --frozen-lockfile

      # Glob que não casa com nada é regra morta: nunca dispara e finge
      # cobertura. Falha rápido, antes de qualquer coisa cara.
      - name: Integridade do .docmap.yml
        run: node scripts/docs/docmap.mjs

      # Se o gerado difere do commitado, alguém editou à mão ou esqueceu de
      # rodar o gerador. Nos dois casos o repositório está mentindo.
      - name: Gerados em dia
        run: |
          node scripts/docs/generate.mjs --check || {
            echo '::error::Documentação gerada fora de dia. Rode `pnpm docs:generate` e commite.'
            exit 1
          }

      # `apps/web/src/lib/api-types.generated.ts` é o segundo andar da mesma
      # cadeia: `docs/reference/openapi.json` (checado acima) → tipos do web.
      # PRECISA rodar DEPOIS do passo anterior — é ele que garante que o
      # `openapi.json` no disco é o de verdade antes de gerar os tipos a
      # partir dele. `--check` é o mecanismo nativo do openapi-typescript
      # (mesma ideia do `escrever()`/CHECAR de generate.mjs): recalcula e
      # compara, nunca escreve. Ver docs/adr/0116-tipos-do-web-gerados-do-openapi.md.
      - name: Tipos do web gerados do OpenAPI estão em dia
        run: |
          pnpm --filter web run openapi:types:check || {
            echo '::error::apps/web/src/lib/api-types.generated.ts fora de dia. Rode `pnpm --filter web run openapi:types` e commite.'
            exit 1
          }

      # O drift NÃO se aplica a PR entre permanentes — promoção (dev→qa,
      # qa→main) e retropropagação (main→qa, qa→dev). Não é conveniência: um PR
      # desses não tem AUTORIA. Ele carrega commits que já passaram por um PR
      # para `dev`, onde este mesmo drift já rodou sobre exatamente aqueles
      # arquivos. Cobrar de novo é cobrar a mesma dívida em cada degrau.
      #
      # E não é só redundante, é INSATISFAZÍVEL, o que é pior:
      #
      #   - o escape hatch não atravessa o degrau. O #70 dispensou a regra
      #     `config-e-inferencia` com `docs-not-needed:` no corpo DELE; o corpo
      #     do PR de promoção é gerado pelo `promote`, então a justificativa não
      #     vem junto e a regra torna a bloquear. Foi exatamente isso que
      #     reprovou o #72 (`v1.0.1`), por `docker/**` do #70;
      #   - e não há como satisfazer: o `promotion-check` exige range limpo — o
      #     head tem que ser o tip da origem —, então commitar doc no PR de
      #     promoção reprova o OUTRO check required. Sobraria pôr a label em
      #     toda promoção, que é ensinar a usar o escape hatch por reflexo até
      #     ele não significar mais nada.
      #
      # O filtro fica DENTRO do passo, e o passo se pronuncia: pular o JOB
      # deixaria `Drift, gerados e build` — que é required — sem veredito para o
      # sha, e PR de promoção travado para sempre. Os outros passos continuam
      # rodando: docmap, gerados e build do site dependem só do HEAD, e valem em
      # qualquer degrau.
      # AT-094: o BOT escreve `docs-not-needed:` no corpo de PR do Dependabot
      # cujo diff é SÓ troca de pin de action (SHA + comentário de versão).
      # A decisão mora em `scripts/ci/dependabot-justifica-pin.ts` (testado):
      # autor que não é o Dependabot, ou qualquer linha que não seja pin, e
      # nada é escrito — o drift abaixo julga como sempre.
      #
      # Mora AQUI, e não num workflow irmão do `dependabot-para-dev.yml`, por
      # três medições:
      #   - editar o corpo com o `GITHUB_TOKEN` não dispara `edited`, então um
      #     workflow separado escreveria a linha e ESTE check ficaria vermelho;
      #   - re-executar este job não resolve: a re-execução reusa o PAYLOAD
      #     original, com o corpo antigo (run 34898913072, tentativa 2, 17/09);
      #   - `pull_request_target`, onde o token escreve sem pedir, só roda o
      #     workflow da branch DEFAULT (`main`) — a mesma armadilha do
      #     `pr-police.yml` —, então a regra nova só valeria depois da promoção.
      # No mesmo job, o passo seguinte lê o corpo novo por `PR_BODY_FILE`, na
      # ordem, sem corrida e sem redisparo.
      #
      # Não roda em `edited`: se um humano apagou a linha do bot, a vontade dele
      # manda. O token de PR do Dependabot escreve porque este workflow declara
      # `pull-requests: write` (evento do Dependabot respeita `permissions:`);
      # se a escrita falhar, nenhum arquivo é gravado e o drift usa o corpo do
      # evento — falha FECHADO, o PR fica bloqueado como antes.
      - name: Justificativa do bot para troca de pin (Dependabot)
        if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.action != 'edited'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTOR: ${{ github.event.pull_request.user.login }}
          PR_TIPO_DO_AUTOR: ${{ github.event.pull_request.user.type }}
          BASE_REF: ${{ github.base_ref }}
          CORPO_NOVO: ${{ runner.temp }}/corpo-do-pr.md
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          # O MESMO range que o drift avalia logo abaixo.
          git diff --no-color --no-ext-diff "origin/$BASE_REF...HEAD" > "$TMP/diff"
          printf '%s' "$PR_BODY" > "$TMP/corpo.md"

          RESULTADO="$(node scripts/ci/dependabot-justifica-pin.ts "$TMP/diff" "$TMP/corpo.md" "$TMP/novo.md")"
          ACAO="$(jq -r .acao <<<"$RESULTADO")"
          echo "dependabot-justifica-pin → $ACAO: $(jq -r .motivo <<<"$RESULTADO")"

          if [ "$ACAO" = "manter" ]; then exit 0; fi
          if gh pr edit "$PR_NUMERO" --repo "$REPO" --body-file "$TMP/novo.md"; then
            cp "$TMP/novo.md" "$CORPO_NOVO"
          else
            echo "::warning::não consegui editar o corpo do PR — o drift julga pelo corpo do evento"
          fi

      - name: Drift check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BODY_FILE: ${{ runner.temp }}/corpo-do-pr.md
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.base_ref }}
          # Head chamado `main` vindo de FORK não é promoção — é branch de
          # trabalho de terceiro, e essa passa pelo drift como qualquer outra.
          # Mesma ressalva que o `pr-police` faz ao classificar a família.
          MESMO_REPO: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        run: |
          set -euo pipefail

          entre_permanentes=false
          if [ "$MESMO_REPO" = 'true' ]; then
            case "$HEAD_REF" in
              dev | qa | main) entre_permanentes=true ;;
            esac
          fi

          if [ "$entre_permanentes" = true ]; then
            # `echo` linha a linha, e não string multilinha: dentro de um bloco
            # YAML a indentação vira conteúdo, e quatro espaços a mais fariam o
            # resumo do check virar um bloco de código no Markdown.
            {
              echo '### Drift check da documentação'
              echo
              echo "\`$HEAD_REF\` → \`$BASE_REF\` é PR entre branches permanentes: o drift não se aplica."
              echo
              echo "A documentação destes commits foi cobrada no PR para \`dev\`, um a um."
              echo 'Um PR de promoção ou de retropropagação não tem autoria própria —'
              echo 'não há doc nova a exigir dele.'
            } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi

          node scripts/docs/drift.mjs "origin/$BASE_REF...HEAD"

      - name: Cache do Rspack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: website/node_modules/.cache
          key: rspack-${{ runner.os }}-${{ hashFiles('website/pnpm-lock.yaml') }}-${{ hashFiles('docs/**') }}
          restore-keys: |
            rspack-${{ runner.os }}-${{ hashFiles('website/pnpm-lock.yaml') }}-
            rspack-${{ runner.os }}-

      # onBrokenLinks / onBrokenAnchors / onBrokenMarkdownLinks são 'throw':
      # link quebrado e MDX inválido reprovam aqui, não viram 404 em produção.
      #
      # Este é o ÚNICO build de site em PR. O `docs-deploy.yml` fazia o mesmo e
      # perdeu o gatilho de `pull_request`: mesmo comando, mesmo veredito, duas
      # vezes. Ao mexer aqui, lembre que a publicação depende deste build passar.
      - name: Build do site
        run: pnpm docs:build

      # BUILD VERDE NÃO É PÁGINA QUE RENDERIZA, e essa distinção custou duas
      # releases. A referência de API subiu morta em v1.0.0 e v1.0.1: faltava
      # `docItemComponent: '@theme/ApiItem'` no config, o `ApiItem` nunca era
      # montado, e as 117 páginas de operação morriam na HIDRATAÇÃO com
      # "Cannot destructure property 'store'". O passo acima ficou verde todas
      # as vezes — o MDX compila, o SSR escreve o conteúdo, e o error boundary
      # só apaga a página no navegador.
      #
      # Este passo afirma a marca estrutural que só o `ApiItem` produz. Precisa
      # vir DEPOIS do build, porque é o build que ele inspeciona.
      #
      # Localmente: `pnpm docs:build && node scripts/docs/api-render-check.mjs`.
      # Fora do `docs:check` de propósito — aquele não constrói o site.
      - name: A referência de API renderiza
        run: node scripts/docs/api-render-check.mjs

  # Links EXTERNOS não entram no PR: site de terceiro fora do ar não pode
  # reprovar o trabalho de ninguém. Vira relatório semanal.
  links-externos:
    name: Links externos (semanal)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2
        with:
          args: --no-progress --exclude-mail --accept 200,206,429 './docs/**/*.md' './*.md'
          fail: false
