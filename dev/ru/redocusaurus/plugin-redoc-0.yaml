          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateAbertoResponseDto'
        '400':
          description: Некорректное тело.
        '403':
          description: Сервисный токен отсутствует или отличается от общего.
        '404':
          description: Сессия, проект или ресурс не найдены.
      security:
        - service-token: []
      summary: Открывает конвейер gate задачи, начиная с QA
      tags:
        - internal
  /internal/sessions/{sessionId}/tasks/{taskId}/status:
    post:
      operationId: InternalSessionsController_markTaskStatus
