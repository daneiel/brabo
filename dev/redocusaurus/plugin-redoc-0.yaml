  /workspaces/{workspaceId}/huggingface/pull-requests/{id}/confirm:
    post:
      description: >-
        Move `pending_confirmation` → `confirmed` → `pulling`, chama o daemon do
        Ollama e, em caso de sucesso, faz upsert do modelo no catálogo
        (`models`) e o ativa para ESTE workspace. Em caso de falha o pedido
        termina em `failed` com um motivo que declara a origem (infra | modelo |
        código | política) — nunca falha calada. Esta chamada roda de forma
        SÍNCRONA durante o pull inteiro (ver o caso de uso para o porquê); use a
        rota GET abaixo para consultar em vez de segurar esta conexão aberta.
      operationId: HuggingFaceModelsController_confirm
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPullRequestResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Exige `maintainer` no workspace.
        '404':
          description: Pedido de pull não encontrado.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: A segunda confirmação — roda o pull de fato
      tags:
        - llm
  /workspaces/{workspaceId}/members:
    get:
      description: >-
        Quem está associado ao WORKSPACE, com o papel de workspace — o papel que
        todo projeto herda a menos que uma linha de projeto o sobreponha.
        Completa `GET projects/:projectId/members`, que lista só linhas de
        projeto: quem alcança um projeto só pelo workspace aparece aqui e não
        lá. Só id, nome, e-mail e papel.
      operationId: WorkspacesController_listMembers
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMemberComUsuarioResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: Papel insuficiente no workspace.
        '404':
          description: O workspace não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Lista os membros do workspace
      tags:
        - workspaces
    post:
      description: >-
        Só `owner` mexe na lista de membros. O papel aqui é herdado por TODOS os
        projetos do workspace. Esse papel é NECESSÁRIO mas não SUFICIENTE: mudar
        o SEU PRÓPRIO papel aqui é recusado com 403 nos dois sentidos, e não
        pode ser habilitado em lugar nenhum. Não há nível acima para segurar a
        queda, então um autorrebaixamento seria irrecuperável pela interface.
        Rebaixar OUTRO `owner` continua permitido — é o único jeito de revogar
        propriedade.
      operationId: WorkspacesController_addMember
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: >-
            Não é `owner` do workspace, OU o alvo é quem chama e o papel pedido
            difere do atual dele (teto de automovimento).
        '404':
          description: O workspace não existe ou é invisível para quem chama.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Associa um usuário ao workspace
      tags:
        - workspaces
  /workspaces/{workspaceId}/members/{userId}:
    delete:
      description: >-
        Só `owner`, como o upsert. Remove a linha do workspace E, na mesma
        transação, as linhas do usuário em todo projeto deste workspace (o papel
        de projeto sobrepõe o de workspace, então deixá-las manteria o usuário
        dentro desses projetos), mais as chaves de dispositivo de PROJETO e os
        personal access tokens do usuário neles. Depois a conexão de runner viva
        desse usuário em cada projeto é derrubada, em melhor esforço. Chaves de
        dispositivo de máquina e sessões abertas ficam como estão — deixam de
        alcançar este workspace porque o papel resolve para nenhum.


        Remover a SI MESMO é recusado com 403 e não pode ser habilitado em lugar
        nenhum: não há nível acima para segurar a queda. Essa mesma cláusula é o
        que protege o último `owner` — só um `owner` chama esta rota e ninguém
        se remove, então toda chamada bem-sucedida deixa ao menos quem chamou
        como `owner`. Remover OUTRO `owner` é permitido — é como se revoga
        propriedade —, exceto o TITULAR (`createdBy`), recusado com 409
        `criador_do_workspace` até `PUT :workspaceId/owner-of-record` passá-lo a
        outro owner: a chave de LLM que os agentes gastam e o relatório de gasto
        são dele. Idempotente: alvo sem linha de workspace ainda tem as linhas
        de projeto deste workspace limpas, e recebe `204`.
      operationId: WorkspacesController_removeMember
      parameters:
        - name: workspaceId
          required: true
          in: path
          schema:
            type: string
        - name: userId
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Associação removida. Sem corpo.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: >-
            Não é `owner` do workspace, OU o alvo é quem chama (teto de
            autorremoção).
        '404':
          description: O workspace não existe ou é invisível para quem chama.
        '409':
          description: >-
            `criador_do_workspace`: o alvo é o titular; transfira a titularidade
            antes.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Desassocia um usuário do workspace
      tags:
        - workspaces
  /workspaces/{workspaceId}/model-binding:
