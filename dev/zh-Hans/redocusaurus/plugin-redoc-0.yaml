          application/json:
            schema:
              $ref: '#/components/schemas/DeclareModuleContractsInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratosDeclaradosResponseDto'
        '400':
          description: >-
            列表为空、模块重复、模块不在当前 module_map 中（或没有 module_map）、模块的 `expoe` 为空或过大、条目的
            `tipo` 未知，或 `assinatura` 缺失/过大。
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
        '404':
          description: 未找到会话、项目或资源。
