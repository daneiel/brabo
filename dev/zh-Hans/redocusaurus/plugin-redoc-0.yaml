    DevTaskContextResponseDto:
      type: object
      properties:
        task:
          $ref: '#/components/schemas/TaskResponseDto'
        story:
          $ref: '#/components/schemas/StoryResponseDto'
        businessRules:
          type: array
          items:
            $ref: '#/components/schemas/DevContextBusinessRuleResponseDto'
        adrs:
          description: 适用的 ADR：横切的那些（未声明模块）加上引用此代理模块的那些。
          type: array
          items:
            $ref: '#/components/schemas/DevContextAdrResponseDto'
        siblingTasks:
          description: >-
            同一 story 的其他任务及其状态。QA gate
            按属于此任务的内容评判交付；兄弟任务的需求只是一条观察，绝不是拒绝的理由（RN-765）。
          type: array
          items:
            $ref: '#/components/schemas/DevContextSiblingTaskResponseDto'
        moduleOpenTasks:
          description: >-
            同一模块中其他 story 尚未完成的任务，附 story 标题（最多 20 个）。依赖于另一个 story 将交付内容的需求，对 QA
            gate 而言只是一条观察，绝不是拒绝的理由（RN-785）。
          type: array
          items:
            $ref: '#/components/schemas/DevContextModuleOpenTaskResponseDto'
        moduleOpenTasksTotal:
          type: number
          description: 该模块在其他 story 中未完成任务的真实数量——当列表被截断时大于 `moduleOpenTasks.length`。
        moduleContract:
          nullable: true
          description: >-
            任务所属模块的当前契约（`artifact.module_contracts`）——QA gate 的接口来源。当 story
            与契约不一致时，裁决会指出这一差异，而不是拒绝遵循了契约的 dev（RN-786）。没有可解析的模块或契约时为 `null`。
          type: object
          allOf:
            - $ref: '#/components/schemas/ContratoDeModuloResponseDto'
        primeiraDoModulo:
          type: boolean
          description: >-
            这是否是该模块的第一个任务：项目中最早的那个 `backlog.task_claimed`（针对
            `module`）就是此任务。engine 会给它两倍的单任务预算（RN-774）。值为 `false`，如果没有 `module`。
        decisoes:
          description: >-
            RN-859：通过 `afeta` 与此任务、其 story 或其规则关联的用户决定——发生冲突时优先于 RF/DoR。最新的在前，最多
            10 条，每条文本截断为 1,500 个字符。
          type: array
          items:
            $ref: '#/components/schemas/DevContextDecisaoResponseDto'
        decisoesDoProjeto:
          description: >-
            RN-872（ADR 0215）：项目的其他决定——即 `afeta` 不涉及此任务的那些。单独的部分，与 `decisoes`
            共用同一个 10 条上限（任务决定优先占用上限），最新的在前。
          type: array
          items:
            $ref: '#/components/schemas/DevContextDecisaoResponseDto'
      required:
        - task
        - story
        - businessRules
        - adrs
        - siblingTasks
        - moduleOpenTasks
        - moduleOpenTasksTotal
        - moduleContract
        - primeiraDoModulo
        - decisoes
        - decisoesDoProjeto
