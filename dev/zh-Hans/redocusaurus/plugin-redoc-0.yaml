        name:
          type: string
          example: Senior Dev
          nullable: true
        email:
          type: string
          example: dev@brabo.dev
      required:
        - userId
        - role
        - name
        - email
    WorkspaceMemberResponseDto:
      type: object
      properties:
        workspaceId:
          type: string
          example: 01JC4Z0000WORKSPACE00000001
        userId:
          type: string
          example: 01JC4Z0000USUARIO0000000002
        role:
          type: string
          enum:
            - viewer
            - developer
            - maintainer
            - owner
          example: maintainer
          description: 线性层级：owner > maintainer > developer > viewer。每个角色都包含其后角色的权限。
        createdAt:
          type: string
          example: '2026-07-22T08:00:00.000Z'
          format: date-time
      required:
        - workspaceId
        - userId
        - role
        - createdAt
    WorkspaceResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z0000WORKSPACE00000001
        name:
          type: string
          example: Acme Corp
        slug:
          type: string
          example: acme-corp
          description: 在系统中唯一；它会出现在 URL 中。
        createdBy:
          type: string
          example: 01JC4Z0000USUARIO0000000001
        toolRouterEnabled:
          type: boolean
          example: true
          description: >-
            是否为此 workspace 运行由 Jev 进行的工具路由步骤（ADR 0179）。默认开启；仅当回合模型来自 OpenRouter
            时才起作用，因此在没有 OpenRouter 的 workspace 上为 `true` 不会产生任何效果。
        createdAt:
          type: string
          example: '2026-07-20T09:12:00.000Z'
          format: date-time
        updatedAt:
          type: string
          example: '2026-07-20T09:12:00.000Z'
          format: date-time
      required:
        - id
        - name
        - slug
        - createdBy
        - toolRouterEnabled
        - createdAt
        - updatedAt
    WorkspaceSpendReportResponseDto:
      type: object
      properties:
        workspaceId:
          type: string
          example: 9b1c2d3e-4f50-4a61-8b72-0c3d4e5f6a7b
          format: uuid
        ownerId:
          type: string
          example: 9b1c2d3e-4f50-4a61-8b72-0c3d4e5f6a7b
          format: uuid
          description: 为这笔花费出资的密钥的所有者（RN-058）。
        dias:
          type: number
          example: 30
          description: 滑动窗口，以天计。
        totalMicros:
          type: number
          example: 1250000
        inputTokens:
          type: number
          example: 120000
        outputTokens:
          type: number
          example: 35000
        chamadas:
          type: number
          example: 42
        porModelo:
          description: 按模型。两个提供商服务同一名称时会落入同一行——把它们分开会以另一个名义重新引入凭据维度。
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porProvider:
          description: >-
            按提供商（ADR 0076，RN-186）。这个维度关乎凭据，因此只存在于这里，在要求 `owner`
            的路由上（RN-060）——成员的响应中没有它，而且这不是一个把它隐藏起来的过滤器：是仓储类型在参与者范围下拒绝它（RN-187）。
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porProjeto:
          description: 按 workspace 内的项目。
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porAtor:
          description: 按参与者——代理和人在同一列表中，以 `actorKind` 区分。
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porOwner:
          description: >-
            人的行（`actor_kind = "user"`）——handoff 称之为“按所有者”的块，因为依据
            RN-058，他们花费的都是所有者的密钥。所有者是谁见 `ownerId`。是 `porAtor`
            的一个分区，无需额外查询（RN-188）。
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porAgente:
          description: 代理的行（`actor_kind = "agent"`）。`porAtor` 的另一半。
          type: array
          items:
            $ref: '#/components/schemas/SpendLinhaResponseDto'
        porDia:
          type: array
          items:
            $ref: '#/components/schemas/SpendPorDiaResponseDto'
      required:
        - workspaceId
        - ownerId
        - dias
        - totalMicros
        - inputTokens
        - outputTokens
        - chamadas
        - porModelo
        - porProvider
        - porProjeto
        - porAtor
        - porOwner
        - porAgente
        - porDia
    WorkspaceSummaryResponseDto:
      type: object
      properties:
        activeProjects:
          type: number
          example: 4
          description: workspace 中的项目数。领域中没有“活跃”标志——每个项目都计入。
        agentCount:
          type: number
          example: 6
          description: >-
            本月花费过 token 的不同代理（actorKind=agent），在 workspace
            所有项目中求和——包括区域子专业（Phase 8）。
        spentMicros:
          type: number
          example: 12500000
          description: 本月花费，以微美元计，按 token_usage.createdAt 求和。
      required:
        - activeProjects
        - agentCount
        - spentMicros
