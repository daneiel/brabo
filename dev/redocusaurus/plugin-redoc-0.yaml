  /projects/{projectId}/open-questions/{questionId}/answer:
    post:
      description: >-
        Só o autor da sessão onde a pergunta nasceu responde. Grava um
        `decision_record` (ator: o usuário, com `questionId`) e
        `open_question.answered`, e pede ao engine para retomar o gate de QA
        estacionado de cada tarefa afetada (RN-860), em melhor esforço.
      operationId: OpenQuestionsController_answer
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: questionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerOpenQuestionDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenQuestionResponseDto'
        '400':
          description: Sem resposta, ou sugestão aceita onde não há nenhuma.
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '403':
          description: >-
            Não é o autor da sessão — corpo com `reason:
            "so_o_autor_da_sessao"`.
        '404':
          description: A pergunta não é deste projeto.
        '409':
          description: 'Já respondida — `reason: "pergunta_ja_respondida"`.'
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: Responde uma pergunta aberta (RN-858)
      tags:
        - backlog
  /projects/{projectId}/permissions:
    get:
      description: >-
        É o arquivo físico na raiz do workspace do projeto, não uma coluna do
