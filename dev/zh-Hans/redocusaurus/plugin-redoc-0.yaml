            项目只通过 broker 启动容器（ADR 0144），没有它，每个 dev agent 都会永远被阻塞（ADR 0143）。为
            `false` 时，项目向导不会预选 Mounted，Container 和 Mounted 保持可见但不可选并以文字说明原因，并预选
            Runner（ADR 0161，RN-573）。它说明的是变量存在，而绝不是 broker 有响应。与 `projectsBase`
            一样是安装配置：每个 workspace 都相同。
