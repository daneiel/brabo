# O tema de cada ADR — e a lista fechada de temas (ADR 0202, AT-137).
#
# O tema mora AQUI, e não no ADR: ADR aceito NUNCA é editado, nem para ganhar
# frontmatter. `docs/adr/index.md` é agrupado por tema a partir deste arquivo,
# e `pnpm docs:check` (`scripts/docs/temas-de-adr.mjs`) reprova:
#   - ADR em `docs/adr/` sem tema aqui;
#   - tema citado em `adrs:` que não está em `temas:`;
#   - entrada em `adrs:` para ADR que não existe;
#   - tema da lista sem nenhum ADR;
#   - no índice: seção de tema ausente, fora da ordem desta lista, linha de ADR
#     sob a seção errada, fora de seção, repetida ou fora da ordem numérica.
#
# ADR novo: UMA linha em `adrs:` com UM tema (o principal — quando dois servem,
# vale aquele em que alguém procuraria primeiro), e a linha do índice na seção
# desse tema, em ordem numérica. Quem escreve o ADR propõe o tema; quem revisa
# o PR confirma. Tema NOVO é mudança desta lista, justificada no PR que o
# cria; passar de 15 temas exige ADR que revise o 0202.
#
# `titulo` é o cabeçalho da seção no índice (o índice está em inglês); `id` é a
# âncora (`{#tema-<id>}`) e o valor usado em `adrs:`.

temas:
  - id: git
    titulo: Git, repositório e política de branches
    descricao: O contrato do provider de git, o nascimento e a adoção do repositório, a proteção e a política de branches.
  - id: agentes
    titulo: Harness de agente, turnos e sessões
    descricao: Como um agente roda — contexto, o laço de ferramentas, o turno conversacional, a sessão e seus estados.
  - id: time
    titulo: O time de agentes — papéis, áreas e handoffs
    descricao: Quais agentes existem, o que cada um entrega a quem, a delegação dentro de uma área e o handoff entre eles.
  - id: gates
    titulo: Gates, QA e revisão de segurança
    descricao: O registro de gates, os vereditos de QA e SecOps e os golden-sets que os medem.
  - id: execucao
    titulo: Execução, política de terminal e aprovações
    descricao: O dev agent trabalhando, `proposed_action`, a política de terminal, o escopo de caminho, o modo automático e os tetos absolutos.
  - id: modos
    titulo: Onde o código mora — modos de execução
    descricao: Os três modos de execução, a pasta do usuário, a base de projetos e a conversão de um projeto entre modos.
  - id: container
    titulo: Container do projeto e broker
    descricao: O ciclo de vida do container do projeto, a decisão de imagem, a porta de Docker e o broker que fala com o daemon.
  - id: runner
    titulo: O runner local
    descricao: O CLI na máquina do usuário — o canal, as credenciais, as chaves de dispositivo, a distribuição, a base e o serviço.
  - id: iam
    titulo: Autenticação, acesso e segredos
    descricao: Autenticação first-party, papéis e seus tetos, associação ao workspace, endurecimento entre origens e envelopes de segredo.
  - id: llm
    titulo: Providers de LLM, modelos e gasto
    descricao: O contrato de provider, o catálogo de modelos e a curadoria, os bindings de modelo, o metering e os orçamentos.
  - id: conhecimento
    titulo: RAG, grafo de conhecimento e artefatos
    descricao: Chunks e busca híbrida, a medição dela, o grafo Neo4j e os artefatos projetados do event log.
  - id: web
    titulo: Interface web e design system
    descricao: Telas, navegação, temas e a estrutura dos maiores arquivos do app web.
  - id: operacao
    titulo: Operação, deploy e instalação
    descricao: Imagens de produção, Kubernetes, observabilidade, backup, o compose de dev e o instalador de uma linha.
  - id: engenharia
    titulo: CI, release e cadeia de suprimentos
    descricao: O pipeline, as imagens publicadas, a assinatura, a varredura, o pin, as camadas de teste e a estrutura do próprio repositório.
  - id: docs
    titulo: Documentação
    descricao: Como a documentação é gerada, verificada e publicada.

