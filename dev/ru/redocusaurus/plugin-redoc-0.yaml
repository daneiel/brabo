        `null`, когда проект никогда не создавался, — сегодня это обычный
        случай, потому что ни один реальный оркестратор ещё не переводит эту
        таблицу (RN-243/RN-267). `status`/`imageVersion`/`resources` — это то,
        что было ЗАПИСАНО; `observado` — то, что демон Docker сообщает прямо
        сейчас, по запросу через broker (ADR 0130). Они никогда не сливаются:
        контейнер, убитый извне, читается как записанный `running` и наблюдаемый
        `exited`. Когда посмотреть не удалось, `observado` равен `null`, а
        `naoObservado` говорит почему — он никогда не наследует записанное
        состояние (RN-468).
      operationId: ContainersController_cicloDeVida
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Записанный жизненный цикл или `null` (никогда не создавался).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CicloDeVidaDoContainerResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Жизненный цикл контейнера проекта (записанное состояние)
      tags:
        - projects
  /projects/{projectId}/coverage:
    get:
      description: >-
        Сопоставляет правила проекта с `businessRuleIds` историй. Правило вообще
        без истории — это ОТКРЫТИЕ, незакрытый вопрос для PO, а не ошибка.
      operationId: BacklogController_coverage
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageReportResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Вычисляет покрытие бизнес-правило → истории
      tags:
        - backlog
  /projects/{projectId}/events/{eventId}:
    get:
      description: >-
        В отличие от маршрута события по сессии: здесь сессия не известна.
        Именно это позволяет фишке доказательства в профиле попадать на нужное
        событие, поскольку окно Анамнеза охватывает несколько сессий.
      operationId: AnamneseController_event
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: eventId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEventResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, событие или версия не существуют.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Возвращает событие проекта по id, определяя его сессию
      tags:
        - anamnesis
  /projects/{projectId}/execution-mode:
    put:
      description: >-
        Переносит `execution_mode`/`workspacePath` для УЖЕ существующего проекта
        (RN-447..450, ADR 0111) — отдельный маршрут, отделённый от PATCH, потому
        что он оркестрирует больше, чем запись столбца: переносит
        permissions.json в новый корень области, выводит из обращения строку
        жизненного цикла контейнера при выходе из режима `container` и отклоняет
        (409), пока любой dev agent проекта не простаивает, поскольку работающий
        агент сам не пересчитывает расположение своего worktree.
      operationId: ProjectsController_convertExecutionModeRoute
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertExecutionModeDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует или невидим для вызывающего.
        '409':
          description: Dev agent этого проекта сейчас работает или завис.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Конвертирует режим выполнения проекта
      tags:
        - projects
  /projects/{projectId}/execution/activate:
    post:
      description: >-
        Требует `maintainer`, а не `developer`, потому что git-действия dev
        agent наследуют роль ТОГО, КТО АКТИВИРОВАЛ, в оценке IAM — активация с
        ролью developer оставила бы агентов без возможности открыть PR. Каждый
        модуль в `module_map` получает агента в изолированном worktree.
      operationId: ExecutionController_activate
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateExecutionDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecucaoAtivadaResponseDto'
        '400':
          description: >-
            Нет текущего `module_map` (Архитектор сначала должен определить
            модули), или сохранённое расположение рабочей области проекта
            несогласованно — `permissions.json`, засеваемый здесь, не может быть
            из него выведен (RN-478).
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, сессия или задача не найдены.
        '409':
          description: >-
            У проекта ещё нет репозитория (RN-582): dev agent работают в его
            worktree, поэтому ничего не запускается. Сообщение называет, чего не
            хватает, — handoff к Архитектору (или, как вторая дверь, к Dev
            Lead), принятие которого создаёт его, или страницу создания, если
            этот handoff уже был принят и не оставил репозитория. Также:
            исходная сессия `consultiva` и отклоняет `execution.activated`
            (RN-097). Повторная активация НЕ является конфликтом: она
            идемпотентна через `findActiveExecutionSession` и повторно
            активирует внутри той же сессии.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Активирует фазу выполнения и запускает по одному dev agent на модуль
      tags:
        - execution
  /projects/{projectId}/execution/session:
    get:
      description: >-
        Самая свежая сессия `active`, уже несущая `execution.activated`, — ТОТ
        ЖЕ критерий, который `activate` использует, чтобы решить, активировать
        повторно или создать (RN-139). `null`, когда выполнение не идёт.
        Существует, чтобы вкладка Исполнители перестала выводить эту сессию из
        самой свежей сессии проекта, которая меняется от сессии к сессии без
        всякой подсказки в интерфейсе.
      operationId: ExecutionController_getSession
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: '`null` в теле, когда нет активного выполнения.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, сессия или задача не найдены.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Возвращает текущую сессию выполнения проекта или ничего
      tags:
        - execution
  /projects/{projectId}/git/{provider}/connect:
    get:
      description: >-
        Не перенаправляет: возвращает URL, чтобы клиент решил, когда отправить
        браузер. `state` подписан HMAC, и именно это не даёт подделать callback.
      operationId: GitController_connect
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - github
              - gitlab
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitAuthorizeUrlResponseDto'
        '400':
          description: Провайдер вне `github`/`gitlab`.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Начинает OAuth с git-провайдером
      tags:
        - git
  /projects/{projectId}/git/{provider}/repository:
    post:
      description: >-
        СИНХРОННО: ответ приходит только после выполнения всего bootstrap
        (постоянные ветки, защиты, шаблоны) — за этим нет ни worker, ни очереди.
        Это ИДЕМПОТЕНТНО И ВОЗОБНОВЛЯЕМО, поэтому повторный вызов после сбоя
        продолжает с шага, на котором произошёл сбой. Следите за прогрессом и
        читайте причину сбоя через `GET /projects/:id/git/bootstrap`.
      operationId: GitController_provision
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - local
              - github
              - gitlab
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionRepositoryDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionRepositoryResponseDto'
        '400':
          description: Недопустимый провайдер или отсутствуют учётные данные.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Создаёт репозиторий и выполняет bootstrap Gitflow
      tags:
        - git
  /projects/{projectId}/git/{provider}/repository/adopt:
    post:
      description: >-
        Проверяет доступ через `getRepo` и составляет ПЛАН (dry-run) того, что
        сделал бы bootstrap, — недостающие ветки, недостающие защиты, файлы. В
        репозитории НИЧЕГО не выполняется: решите потом через `plan/approve` или
        `plan/skip`. Повторное подключение того же репозитория сходится (план
        генерируется заново без дублирования строки).
      operationId: GitController_adopt
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - local
              - github
              - gitlab
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptRepositoryDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptRepositoryResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: >-
            Репозиторий существует, но зарегистрированные учётные данные не дают
            до него добраться.
        '404':
          description: Репозиторий не существует у провайдера — проверьте идентификатор.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Подключает существующий репозиторий, ничего не создавая
      tags:
        - git
  /projects/{projectId}/git/bootstrap:
    get:
      description: >-
        На каком шаге он находится, был ли сбой и где, и сколько было попыток.
        Пошаговые детали берутся из событий `bootstrap.step_*` выделенной
        сессии.
      operationId: GitController_getBootstrap
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoBootstrapStatusResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Возвращает состояние bootstrap Gitflow
      tags:
        - git
  /projects/{projectId}/git/bootstrap/acknowledge-protection-failure:
    post:
      description: >-
        `protect_branches` завершается сбоем в приватном репозитории на
        бесплатном тарифе, и мастер предупреждает об этом ЗАРАНЕЕ. Без этого
        выхода единственной кнопкой было «Попробовать снова», что всегда
        проваливается по той же причине, — а `provision_failed` заставляет
        панель перенаправлять проект обратно на страницу создания, делая его
        недоступным навсегда. Подтвердить можно только сбой при ЗАЩИТЕ: это
        последний шаг и единственный, сбой которого оставляет пригодный
        репозиторий. Блокировка merge продукта (RN-006) не зависит от защиты
        провайдера и продолжает действовать.
      operationId: GitController_reconhecerFalhaDeProtecao
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconhecerFalhaDeProtecaoResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '409':
          description: >-
            Bootstrap не завершился сбоем, или сбой произошёл на шаге до защиты
            — продолжать там означало бы оставить проект без пригодного
            репозитория.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Подтверждает сбой защиты веток и продолжает
      tags:
        - git
  /projects/{projectId}/git/bootstrap/plan:
    get:
      description: >-
        `decision: null` при наличии плана — это состояние, в котором НИЧЕГО не
        выполняется: ожидание одобрения или подключения как есть (RN-045).
      operationId: GitController_plan
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapPlanEstadoResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Возвращает план bootstrap и принятое по нему решение
      tags:
        - git
  /projects/{projectId}/git/bootstrap/plan/approve:
    post:
      description: >-
        Одобрение — всё или ничего: одобрение отдельных шагов сломало бы каскад
        `dev←main, qa←dev, rc←qa`. Выполняется план, ЗАНОВО ВЫВЕДЕННЫЙ в момент
        выполнения, — равный показанному или меньше, но никогда не больше.
      operationId: GitController_approvePlan
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideBootstrapPlanDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideBootstrapPlanResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '409':
          description: >-
            План был пересоздан с момента, когда вы его видели, или по нему уже
            было принято решение.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Одобряет ВЕСЬ план и выполняет bootstrap
      tags:
        - git
  /projects/{projectId}/git/bootstrap/plan/skip:
    post:
      description: >-
        Записывает решение и не трогает репозиторий. План остаётся сохранённым
        как доказательство того, что сознательно не было применено, а курсор
        bootstrap НЕ изменяется — ни один шаг не выполнялся.
      operationId: GitController_skipPlan
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideBootstrapPlanDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideBootstrapPlanResponseDto'
        '400':
          description: >-
            Некорректное тело. `ValidationPipe` работает с `whitelist` и
            `forbidNonWhitelisted`, поэтому неизвестное поле тоже приводит к
            ошибке.
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '409':
          description: >-
            План был пересоздан с момента, когда вы его видели, или по нему уже
            было принято решение.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Подключает репозиторий КАК ЕСТЬ, отказываясь от bootstrap
      tags:
        - git
  /projects/{projectId}/git/repository:
    get:
      operationId: GitController_get
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionedRepositoryResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект не существует.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Возвращает созданный репозиторий проекта
      tags:
        - git
  /projects/{projectId}/hypotheses:
    get:
      description: >-
        Каждая гипотеза ссылается на события, которые её подтверждают
