        - entrega
    MirrorSyncResultInternalDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
          description: >-
            O desfecho REAL da cópia, relatado pelo agente local depois de
            terminar — nunca um "ok" otimista antes de a rodada acabar.
        destination:
          type: string
          example: /home/you/mirrors/store
          description: >-
            O destino que a rodada de fato resolveu (sucesso) ou tentou usar
            (falha), na máquina do USUÁRIO. CONGELADO na linha: mostrar o
            destino atual do projeto ao lado da cópia de ontem seria a tela
            afirmando sobre uma pasta que aquela rodada nunca tocou. Omitido
            quando a falha é sobre o próprio destino.
        filesCopied:
          type: number
          example: 412
          description: >-
            Arquivos regulares copiados nesta rodada. `0` é um número, não uma
            ausência — "sincronizou e não copiou nada" é um estado próprio
            (RN-088).
        filesSkipped:
          type: number
          example: 3
          description: >-
            Entradas que o git listou e não são arquivos regulares — um
            repositório aninhado (o worktree de um dev agent é um), um symlink,
            ou um arquivo que sumiu entre a listagem e a cópia.
        filesRefused:
          type: number
          example: 0
          description: >-
            Alvos que a guarda por arquivo recusou (um symlink escapando do
            destino). Contados, nunca engolidos.
        error:
          type: string
          example: >-
            o espelho não conseguiu listar o trabalho com o git: not a git
            repository
          description: >-
            A mensagem de falha NOMEADA. Guardada cortada quando muito longa,
            dizendo que foi cortada. Nunca apaga a última sincronização
            bem-sucedida — qual linha é a CORRENTE se decide comparando os dois
            carimbos.
      required:
        - ok
    MirrorSyncResultResponseDto:
      type: object
      properties:
        recorded:
          type: boolean
          example: true
        status:
          type: string
          example: synced
          enum:
            - never
            - synced
            - failed
          description: >-
            Qual dos três estados é o CORRENTE depois desta gravação. `never` é
            inalcançável aqui (toda gravação carimba um dos dois) e está listado
            porque o vocabulário é o mesmo que a tela lê.
      required:
        - recorded
        - status
    ModelBindingResponseDto:
