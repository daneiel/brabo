    RunnerDeviceKeyListResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 01JC4Z0000CHAVE000000000001
        name:
          type: string
          example: laptop
        projectId:
          type: object
          example: 01JC4Z0000PROJETO000000001
          nullable: true
          description: >-
            Нулевое = МАШИННЫЙ ключ (ADR 0154): действует для любого проекта его
            владельца, а не только для этого. См. `especie`.
        especie:
          type: string
          enum:
            - projeto
            - maquina
          example: projeto
          description: >-
            `projeto` = привязан к проекту этого маршрута (ADR 0118). `maquina`
            = описывает МАШИНУ (ADR 0154) и появляется в списке каждого проекта,
            который она обслуживает, — его отзыв обрывает локального агента во
            всех них.
        createdAt:
          type: string
          example: '2026-08-27T12:00:00.000Z'
          format: date-time
        revokedAt:
          type: object
          example: null
          nullable: true
          description: Нулевое = активен. Отозванный продолжает появляться в списке.
        lastUsedAt:
          type: object
          example: null
          nullable: true
          description: >-
            Нулевое = ни разу не использовался — признак осиротевшего ключа
            (вкладка закрыта посреди потока автоматической настройки runner).
      required:
