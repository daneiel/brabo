            Circuit breaker (Fase 12b — RN-047): quantas tarefas consecutivas
            terminando bloqueadas param o dev agent do módulo em idle_tripped.
            Omitido usa o padrão do domínio (DEFAULT_MAX_CONSECUTIVE_BLOCKED).
