          type: string
          example: how does the PR gate work
          description: Entre 2 e 500 caracteres — mesma régua da busca da aba Código.
        scopes:
          type: array
          description: Quando ausente, busca nos quatro escopos (RN-219/454).
          items:
            type: string
            enum:
              - docs
              - adr
              - session
              - local
        limit:
          type: number
          example: 10
          description: De 1 a 10 — quando ausente, usa o teto.
      required:
        - query
    HybridSearchResponseDto:
      type: object
      properties:
        query:
          type: string
        searchId:
          type: string
          nullable: true
          format: uuid
          description: >-
            A linha de `rag_searches` que esta busca deixou (RN-479) — o id ao
            qual um voto se prende. `null` quer dizer que a linha de telemetria
            NÃO foi gravada (o insert falhou), o que não é o mesmo que "sem
            resultados": não há a que prender um voto, e a interface precisa
            distinguir os dois para não oferecer um controle que a api vai
            recusar.
        hits:
          type: array
          items:
            $ref: '#/components/schemas/HybridSearchHitResponseDto'
        vectorAvailable:
          type: boolean
          description: >-
            `false` quando o provider de embedding não respondeu — a busca rodou
            só com o sinal léxico (RN-233).
        vectorUnavailableReason:
          type: string
      required:
        - query
        - searchId
        - hits
        - vectorAvailable
