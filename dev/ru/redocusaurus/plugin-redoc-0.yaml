          in: path
          schema:
            type: string
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
        - name: actionId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveAlwaysResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Недостаточная роль в проекте.
        '404':
          description: Проект, сессия или действие не найдены.
        '409':
          description: >-
            Действие уже было ОТКЛОНЕНО (`reason: acao_ja_recusada`); шаблон не
            записывается.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
