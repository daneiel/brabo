openapi: 3.0.0
paths:
  /.well-known/jwks.json:
    get:
      description: 正常运行时一个密钥；AUTH_JWT_SECRET 轮换期间两个。
      operationId: JwksController_jwks
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponseDto'
      summary: 访问令牌的公开验证密钥
      tags:
        - auth
  /auth/login:
    post:
      description: 不存在的邮箱、错误的密码和被锁定的账户都返回完全相同的 401 响应——相同的响应体，相同的状态码。
      operationId: AuthController_login_
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '401':
          description: 凭据无效。
        '403':
          description: 邮箱尚未验证。
      summary: 进行身份验证并签发 access + refresh 令牌对
      tags:
        - auth
  /auth/logout:
    post:
      description: 始终返回 204，即使令牌未知——在此返回 401 将成为令牌有效性的探测口。
      operationId: AuthController_logout_
      parameters: []
      responses:
        '204':
          description: 会话已结束。会话 cookie 已被清除。
      summary: 撤销所出示 refresh 所属的整个令牌族
      tags:
        - auth
  /auth/oauth/{provider}/callback:
    get:
      description: >-
        成功时跳转到 `WEB_ORIGIN/` 并已设置会话 cookie；失败时跳转到
        `WEB_ORIGIN/login?oauth_error=1`，不说明原因。
      operationId: AuthController_oauthCallback
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - github
              - gitlab
            type: string
        - name: code
          required: true
          in: query
          schema:
            type: string
        - name: state
          required: true
          in: query
          schema:
            type: string
      responses:
        '302':
          description: 重定向到 Web 应用。
          headers:
            Location:
              description: Web 应用中的目标地址。
              schema:
                type: string
                example: http://localhost:5173/
      summary: 接收社交登录的 OAuth 回调
      tags:
        - auth
  /auth/oauth/{provider}/start:
    get:
      description: '`state` 以其自身专用用途经 HMAC 签名——绝不使用 git 连接到项目流程的签名（见 ADR 0084）。'
      operationId: AuthController_oauthStart
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - github
              - gitlab
            type: string
      responses:
        '302':
          description: 重定向到提供商。
          headers:
            Location:
              description: 提供商的授权 URL。
              schema:
                type: string
                example: https://github.com/login/oauth/authorize?…
        '400':
          description: 提供商不在 `github`/`gitlab` 之列。
      summary: 重定向到 OAuth 提供商进行社交登录
      tags:
        - auth
  /auth/refresh:
    post:
      description: 所出示的 refresh 会被消耗。重复出示已轮换的令牌会撤销整个令牌族并记录一条安全事件——即使原因只是客户端重复提交。
      operationId: AuthController_refresh_
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoResponseDto'
        '401':
          description: refresh 无效、已过期或已被使用。
      summary: 轮换 refresh 并签发新的令牌对
      tags:
        - auth
  /auth/register:
    post:
      description: 无论是新地址还是已注册地址都返回 202——响应不会透露账户是否存在。第二种情况下不会创建任何内容，地址所有者会收到通知。
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AceiteResponseDto'
        '400':
          description: 密码不符合最低策略。
        '403':
          description: 注册已关闭（AUTH_REGISTRATION_ENABLED=false）。
      summary: 创建账户并发送验证邮件
      tags:
        - auth
  /auth/request-password-reset:
    post:
      description: 无论地址已知还是未知都返回 202。这也是从 Keycloak 导入且尚未设置密码的用户所走的路径。
      operationId: AuthController_requestPasswordReset
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordResetDto'
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AceiteResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
      summary: 请求密码重置链接
      tags:
        - auth
  /auth/reset-password:
    post:
      description: 撤销该用户的所有会话。不签发令牌：重置密码的人会被引导去登录，这样邮箱被攻破并不等于一步就接管了账户。
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '204':
          description: 密码已设置。该用户所有活跃会话随之被撤销。
        '400':
          description: 链接无效/已过期，或密码不符合策略。
      summary: 根据令牌设置新密码
      tags:
        - auth
  /auth/verify-email:
    post:
      operationId: AuthController_verifyEmail
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailDto'
      responses:
        '204':
          description: 邮箱已验证；现在即可登录。
        '400':
          description: 链接无效、已过期或已被使用——三种情况响应相同。
      summary: 使用一次性令牌确认邮箱
      tags:
        - auth
  /gates:
    get:
      description: >-
        流程 gate 的声明式索引（ADR
        0054）。界面从这里推导存在哪些步骤以及每一步由谁判定，而不是在代码中重复这份列表——过去正是这样在无人察觉中过时的。
      operationId: GatesController_listar
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatesResponseDto'
        '401':
          description: 没有令牌、令牌已过期或签名无效。
        '429':
          description: 按用户或按 IP 的速率限制。
      security:
        - bearer: []
      summary: 活跃 gate 的注册表
      tags:
        - gates
  /git/oauth/{provider}/callback:
    get:
      description: >-
        之所以公开，是因为到达这里的是用户的浏览器，从提供商跳转而来，没有 api 会话。但它并非不受限制：`state` 经 HMAC
        校验，没有有效的 state 调用会被拒绝。从不返回 JSON——始终重定向，因为在浏览器导航中显示原始错误体体验极差。
      operationId: GitController_callback
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - github
              - gitlab
            type: string
        - name: code
          required: true
          in: query
          schema:
            type: string
        - name: state
          required: true
          in: query
          schema:
            type: string
      responses:
        '302':
          description: >-
            成功时跳转到 `WEB_ORIGIN/projects/:id?git=connected`；失败时跳转到
            `WEB_ORIGIN/git-error`。错误原因不会泄露在 URL 中。
          headers:
            Location:
              description: Web 应用中的目标地址。
              schema:
                type: string
                example: http://localhost:5173/projects/01JC…?git=connected
        '403':
          description: 在项目上的角色不足。
        '404':
          description: 项目不存在。
      summary: 接收 OAuth 返回并重定向到 Web 应用
      tags:
        - git
  /health:
    get:
      description: 执行 `select 1`。只透露数据库是否响应；不透露拓扑或版本。之所以公开，是因为调用方是 kubelet，它不携带令牌。
      operationId: HealthController_check
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponseDto'
        '503':
          description: 数据库未响应。响应体在 `details` 中携带消息。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponseDto'
      summary: 就绪检查——进程确实能够处理流量
      tags:
        - infrastructure
  /internal/first-account:
    post:
      description: >-
        供一行命令安装器使用，它运行在未配置邮件传输的环境中：生成的 `.env` 不含任何邮件变量，`MAIL_TRANSPORT` 回落为
        `log`，而常规注册会等待一封永远不会到达的邮件。账户一出生即已验证，因为运行安装器的人已经证明了比控制一个邮箱更强的东西——他们控制着这台机器、`.env`
        和 Docker 守护进程。常规注册不受影响。当安装中已有任何用户时以 409
        拒绝：条件针对的是安装，而非这个邮箱，因此迁移恢复会通过同一检查让这一步保持静默。密码绝不在此生成，除了 argon2id
        哈希外也绝不存储在任何地方；个人 workspace（RN-410）在同一事务中创建。
      operationId: InternalFirstAccountController_criar
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirstAccountInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirstAccountInternalResponseDto'
        '400':
          description: 邮箱格式错误，或密码被领域策略拒绝——与注册调用的是同一段代码，绝无第二套规则。
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
        '409':
          description: 该安装已有用户。未创建任何内容。
      security:
        - service-token: []
      summary: 创建一个安装的第一个账户，且已验证
      tags:
        - internal
  /internal/gates:
    get:
      description: >-
        注册表只做描述，不做执行：没有任何 gate 会因为它而被强制执行，在此修改字段也不会改变任何行为。每个 gate
        都说明其通过的证据存放在哪里（`evidencia`），因为并非所有证据都在事件日志中。
      operationId: InternalGatesController_ler
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateRegistryResponseDto'
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
      security:
        - service-token: []
      summary: 读取声明式 gate 注册表
      tags:
        - internal
  /internal/graph/prompt-templates:
    post:
      description: >-
        如果同一 `name` 已存在哈希相同的版本，则不会创建新版本——而是返回已有版本（幂等命中不会改变 HTTP 状态：为简单起见始终为
        201——响应体与新建时完全相同）。
      operationId: InternalGraphController_upsert
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPromptTemplateInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
        '503':
          description: Neo4j 未配置或不可达——读写模板没有可用的回退方案。
      security:
        - service-token: []
      summary: 发布提示词模板的一个版本，按哈希幂等
      tags:
        - internal
  /internal/graph/prompt-templates/{name}:
    get:
      description: 指定 `version` 时按相等查找；省略时查找最新的 `active` 版本。模板（或所请求的版本）不存在时返回 404。
      operationId: InternalGraphController_getByName
      parameters:
        - name: name
          required: true
          in: path
          schema:
            type: string
        - name: version
          required: false
          in: query
          schema:
            example: '3'
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateReadResponseDto'
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
        '404':
          description: 模板不存在，或缺少所请求的版本。
        '503':
          description: Neo4j 未配置或不可达——读写模板没有可用的回退方案。
      security:
        - service-token: []
      summary: 按名称查找提示词模板
      tags:
        - internal
  /internal/machine-device-keys:
    post:
      description: >-
        供一行命令安装器在创建第一个账户后立即使用：本地代理需要一份凭据，而此前唯一存在的凭据绑定在项目上——而此时安装中还没有任何项目。密钥对在机器上生成，只有公开的一半到达这里；请把返回的
        `id` 作为 `kid` 写入私有 JWK（RN-475），这是磁盘上的文件与服务器上公开一半之间唯一的关联。请求体中故意没有
        `userId`：所有者是该安装的唯一用户，由 api
        解析，因此持有服务令牌绝不意味着可以选择为谁签发凭据。注册即替换：所有者现有的机器密钥在同一事务中被撤销，因此重装的机器可以工作，也不可能存在上千把机器密钥。项目密钥（ADR
        0118）不受影响。
      operationId: InternalMachineDeviceKeysController_registrarChave
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachineDeviceKeyInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineDeviceKeyInternalResponseDto'
        '400':
          description: >-
            该 JWK 不是 Ed25519 公钥——JSON 格式错误、`kty`/`crv` 不对、缺少 `x`，或携带了
            `d`（那是私有的一半，会被明确拒绝而不是存储）。
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
        '409':
          description: 该安装没有用户，或有不止一个用户。未写入任何内容。此路由属于安装那一刻，一旦安装有了团队就永久失效。
      security:
        - service-token: []
      summary: 为全新安装注册机器设备密钥
      tags:
        - internal
  /internal/models/sync:
    post:
      description: 绝不会因为某一个提供商而失败：每个提供商在报告中各自作答，附带被跳过的原因以及失败时的来源。未响应的提供商会被跳过，而不是被标记为不可用。
      operationId: InternalModelsController_sync
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncModelCatalogResponseDto'
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
      security:
        - service-token: []
      summary: 在所有提供商之间同步模型目录
      tags:
        - internal
  /internal/projects/{projectId}/backlog:
    get:
      description: >-
        与 Backlog 标签页相同的 epic → story → task 树，经由同一用例（每个项目三次读取，绝无 N+1）。PO
        借此看到孤立的 epic 和没有任务的 story，而不是重新创建已有内容（RN-164）。
      operationId: InternalProjectsController_backlog
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EpicComHistoriasResponseDto'
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
      security:
        - service-token: []
      summary: 以树形展示项目的 backlog，供 PO 阅读已写下的内容
      tags:
        - internal
  /internal/projects/{projectId}/business-rules:
    get:
      description: >-
        项目所有会话中的每一条 `artifact.business_rule`——而不仅是当前会话的，那曾是 PO 启动上下文的上限——带有完整的
        `description` 以及哪些 story 已引用每条规则。`uncoveredCount` 是待办项：没有任何 story
        覆盖的规则（RN-164）。完全没有规则的项目返回 `200` 和空列表：“尚未捕获任何规则”不是错误。
      operationId: InternalProjectsController_businessRules
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBusinessRulesResponseDto'
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
      security:
        - service-token: []
      summary: 项目的业务规则及其覆盖情况，供 PO 阅读
      tags:
        - internal
  /internal/projects/{projectId}/container-exec:
    post:
      description: >-
        仅由 engine 调用，当 `Engine.Actions.TerminalExecutor`
        判定命令应在真实容器内执行时（`execution_mode: container` 且有已登记的 `running` 记录）。代理到
        `ContainerBrokerPort.exec`（ADR 0130/0134）——broker 五个操作中最后一个获得真实调用方的。响应中的
        `sucesso: false`——绝不是抛出的错误——是 broker 拒绝或不可达时的正常形态：在登记的 `running`
        记录与本次调用之间，容器可能已在外部死亡或被移除（RN-486，登记状态与观测状态绝不合并），这是命令失败，而非传输错误。
      operationId: InternalProjectsController_containerExec
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerExecInternalDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerExecInternalResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
      security:
        - service-token: []
      summary: 在项目的真实容器内执行终端命令（RN-492）
      tags:
        - internal
  /internal/projects/{projectId}/container-spec:
    get:
      description: >-
        项目标识、执行模式以及 Architect 当前的镜像决定。broker
        在把任何东西交给守护进程之前都会重新校验——从这里读取并不等于信任它，拒绝时会指明字段。不返回任何绝对路径：绑定源由守护进程依据宿主机文件系统解析，而来自
        api 容器内部的路径会静默挂载一个空文件夹。传递的是 `localizacao`（RN-503）——使用 broker
        两个根目录中的哪一个，以及该根目录未覆盖的相对段。
      operationId: InternalContainersController_containerSpec
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerSpecInternalResponseDto'
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
        '404':
          description: 未找到项目。
      security:
        - service-token: []
      summary: broker 自行组装容器规格所需的信息
      tags:
        - internal
  /internal/projects/{projectId}/git-remote:
    get:
      description: >-
        返回干净的源地址（不嵌入凭据），对于远程提供商，还返回即时解密的 workspace
        所有者令牌（RN-058）。使用方按每次调用注入令牌，绝不写入文件——`.git/config` 位于 RN-075 授予 dev agent
        自动批准读取权限的文件夹内。
      operationId: InternalProjectsController_gitRemote
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGitRemoteResponseDto'
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
        '404':
          description: 项目没有已置备的仓库，或 workspace 所有者没有为该仓库提供商登记凭据。
      security:
        - service-token: []
      summary: 项目的工作远程仓库，用于 fetch 和 push
      tags:
        - internal
  /internal/projects/{projectId}/mirror-sync-result:
    post:
      description: >-
        仅由 engine 调用，在 runner 通过通道推送 `mirror_sync_result` 之后——与
        `workspace_confirm` 走同一路径（runner → 通道 → engine → api），绝无第二套机制：engine
        负责报告，不写表。这是遥测，不是领域事件：绝不写入 `session_events`（一轮镜像没有会话，而 `session_id` 是
        `NOT NULL`，与把 `rag_searches` 做成表的理由相同），也绝不是
        `proposed_action`（镜像写入是用户声明的配置，不是代理请求执行操作）。决定结果的是 `ok`——绝不是计数或消息是否存在：复制了
        0 个文件的一轮是正常的，绝不能与从未运行的一轮无法区分。记录绝不会破坏它所测量的东西：调用此接口时复制已经完成，engine
        只会在此记录拒绝。目标在此期间被清除的项目仍然会记录——这一轮确实发生了，而它的错误通常正是解释问题所在的线索。
      operationId: InternalProjectsController_mirrorSyncResult
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MirrorSyncResultInternalDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MirrorSyncResultResponseDto'
        '400':
          description: >-
            请求体无效。`ValidationPipe` 以 `whitelist` 和 `forbidNonWhitelisted`
            运行，因此未知字段也会失败。
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
        '404':
          description: 项目不存在。
      security:
        - service-token: []
      summary: 本地代理报告一轮镜像的结果（RN-517）
      tags:
        - internal
  /internal/projects/{projectId}/module-contracts:
    get:
      description: >-
        当前 module_map 中每个模块一条记录：它消费什么（`dependeDe`，即映射中的
        `dependsOn`）以及它暴露什么（`expoe`，来自 Architect 当前的
        `artifact.module_contracts`，未声明时为 `null`）。dev agent 读取它，而不是打开另一个模块的
        worktree（ADR 0200）。没有契约的项目返回 `200` 和 `status: sem_contratos`。
      operationId: InternalProjectsController_moduleContracts
      parameters:
        - name: projectId
