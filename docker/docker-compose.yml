name: brabo

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brabo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brabo}
      POSTGRES_DB: ${POSTGRES_DB:-brabo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brabo} -d ${POSTGRES_DB:-brabo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro

  # Ollama local — baixa um modelo pequeno (llama3.2:1b) automaticamente
  # no primeiro start, pra o chat funcionar via curl sem passo manual.
  ollama:
    image: ollama/ollama:latest
    entrypoint: ["sh", "-c", "ollama serve & sleep 5 && ollama pull llama3.2:1b; wait"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      # Sem GPU (o host precisaria do nvidia-container-toolkit), o modelo vive
      # na RAM e o default de 5min descarrega ele entre um agente e outro — o
      # turno seguinte paga o carregamento de ~5GB de novo e estoura o
      # LLM_TURN_TIMEOUT_MS. Manter residente é o que torna uma sessão com
      # vários agentes viável nesta máquina.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1h}
      # Sem isto o KEEP_ALIVE acima acumula: cada modelo já usado fica
      # residente e uma máquina de 15GB chegou a 15,2GB só de pesos, com o
      # agente devolvendo resposta VAZIA por falta de memória. Um por vez.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      # O default do Ollama é 4096 tokens e ele TRUNCA em silêncio, enquanto o
      # ToolLoop monta o prompt pra uma janela de 128k. Na prática o agente
      # perdia as próprias instruções a partir do 2º/3º turno e passava a imitar
      # o que sobrava no fim do contexto (o schema das ferramentas). Ver ADR 0020.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}

  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    working_dir: /workspace
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://brabo:brabo@postgres:5432/brabo}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      # Teto de INATIVIDADE do socket na chamada ao Ollama (ver
      # ollama-provider.ts). Precisa ser >= o LLM_TURN_TIMEOUT_MS do engine,
      # senão quem desiste primeiro é a api e o teto do engine não vale nada.
      OLLAMA_REQUEST_TIMEOUT_MS: ${OLLAMA_REQUEST_TIMEOUT_MS:-300000}
      CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY:-dev-master-key-change-me}
      # KEYCLOAK_URL: alcançável da rede do compose (fetch de JWKS).
      # KEYCLOAK_ISSUER_URL: o host que quem pede o token realmente usa
      # (o navegador/curl no host usam localhost:8080) — precisa bater
      # com o claim "iss" do token, por isso é diferente de KEYCLOAK_URL
      # aqui dentro do container.
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-http://localhost:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-brabo-dev}
      ENGINE_KEYCLOAK_CLIENT_ID: ${ENGINE_KEYCLOAK_CLIENT_ID:-engine-service}
      # Git providers (Fase 2): OAuth Apps do GitHub/GitLab + provisionamento
      # de repositório local. GIT_OAUTH_STATE_SECRET é separado de
      # CREDENTIALS_MASTER_KEY de propósito — domínios de segurança
      # diferentes (HMAC de curta duração vs. derivação AES de longa
      # duração), rotação independente.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITLAB_OAUTH_CLIENT_ID: ${GITLAB_OAUTH_CLIENT_ID:-}
      GITLAB_OAUTH_CLIENT_SECRET: ${GITLAB_OAUTH_CLIENT_SECRET:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3000}
      GIT_OAUTH_STATE_SECRET: ${GIT_OAUTH_STATE_SECRET:-dev-oauth-state-secret-change-me}
      GIT_LOCAL_REPOS_ROOT: /data/git-repos
      # Comando síncrono api -> engine (criar sessão supervisionada na
      # ativação) — client credentials do Keycloak, simétrico à direção
      # engine -> api que já existe.
      ENGINE_URL: ${ENGINE_URL:-http://engine:4000}
      API_KEYCLOAK_CLIENT_ID: ${API_KEYCLOAK_CLIENT_ID:-api-service}
      API_KEYCLOAK_CLIENT_SECRET: ${API_KEYCLOAK_CLIENT_SECRET:-api-service-dev-secret-change-me}
      # Pipeline de ações propostas (Fase 1 item 5): raiz compartilhada com
      # o engine (mesmo path, mesmo volume) onde mora o permissions.json
      # de cada projeto.
      PROJECT_WORKSPACES_ROOT: /data/project-workspaces
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ..:/workspace
      - api_root_node_modules:/workspace/node_modules
      - api_app_node_modules:/workspace/apps/api/node_modules
      - api_shared_node_modules:/workspace/packages/shared/node_modules
      - git_local_repos:/data/git-repos
      - project_workspaces:/data/project-workspaces
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  engine:
    build:
      context: ..
      dockerfile: docker/engine/Dockerfile
    working_dir: /workspace/apps/engine
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgres://brabo:brabo@postgres:5432/brabo}
      MIX_ENV: dev
      # config/test.exs (usado por `mix test`) monta a conexão a partir
      # destas variáveis, não de DATABASE_URL — sem isso o Postgrex tenta
      # localhost de dentro do container e nunca alcança o serviço postgres.
      POSTGRES_USER: ${POSTGRES_USER:-brabo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brabo}
      POSTGRES_HOST: postgres
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-brabo-dev}
      ENGINE_KEYCLOAK_CLIENT_ID: ${ENGINE_KEYCLOAK_CLIENT_ID:-engine-service}
      ENGINE_KEYCLOAK_CLIENT_SECRET: ${ENGINE_KEYCLOAK_CLIENT_SECRET:-engine-service-dev-secret-change-me}
      API_URL: ${API_URL:-http://api:3000}
      # A api chama o engine com um token client-credentials deste client
      # — o engine só precisa saber QUAL client esperar, nunca o secret.
      API_KEYCLOAK_CLIENT_ID: ${API_KEYCLOAK_CLIENT_ID:-api-service}
      SESSION_HEARTBEAT_TIMEOUT_MS: ${SESSION_HEARTBEAT_TIMEOUT_MS:-30000}
      # Pipeline de ações propostas (Fase 1 item 5): mesma raiz de
      # workspaces que a api usa — Engine.Actions.Workspace faz o
      # checkout do bare repo (montado abaixo, read-only) ali dentro.
      PROJECT_WORKSPACES_ROOT: /data/project-workspaces
      TERMINAL_ACTION_TIMEOUT_MS: ${TERMINAL_ACTION_TIMEOUT_MS:-15000}
      SECOPS_SCAN_TIMEOUT_MS: ${SECOPS_SCAN_TIMEOUT_MS:-180000}
      # Já era lido do ambiente pelo runtime.exs, mas não era exposto aqui —
      # o default (8) é justo pro caminho feliz e apertado quando o agente
      # precisa de ciclos de correção (escrever, testar, corrigir, testar).
      TOOL_LOOP_MAX_ITERATIONS: ${TOOL_LOOP_MAX_ITERATIONS:-8}
      # Também já era lido do runtime.exs sem estar exposto aqui. Com modelo
      # local o primeiro turno carrega os pesos antes do primeiro token, e
      # trocar de modelo entre agentes (dev e qa) paga esse custo mais de uma
      # vez na mesma sessão.
      LLM_TURN_TIMEOUT_MS: ${LLM_TURN_TIMEOUT_MS:-300000}
      # Ver runtime.exs: desligar os agentes de fundo libera o provider local
      # pros agentes de execução. Default ligado.
      START_OUTBOX_DRAIN: ${START_OUTBOX_DRAIN:-true}
      START_ANAMNESE: ${START_ANAMNESE:-true}
      # Triagem do Psicólogo (Fase 4b). Os defaults foram calibrados pensando
      # em modelo forte; num 7B local o modelo gasta tentativas hallucinando
      # event id (e sendo corretamente rejeitado) antes de acertar, então subir
      # o teto de iterações é o que faz o critério de aceite fechar sem afrouxar
      # a validação de evidência. Ver Engine.Psychologist.Triage.
      PSYCHOLOGIST_TRIAGE_THRESHOLD: ${PSYCHOLOGIST_TRIAGE_THRESHOLD:-20}
      PSYCHOLOGIST_MAX_ITERATIONS_LEVE: ${PSYCHOLOGIST_MAX_ITERATIONS_LEVE:-4}
      PSYCHOLOGIST_MAX_ITERATIONS_PESADA: ${PSYCHOLOGIST_MAX_ITERATIONS_PESADA:-8}
      PSYCHOLOGIST_BUDGET_MICROS_LEVE: ${PSYCHOLOGIST_BUDGET_MICROS_LEVE:-50000}
      PSYCHOLOGIST_BUDGET_MICROS_PESADA: ${PSYCHOLOGIST_BUDGET_MICROS_PESADA:-300000}
      # Anamnese (Fase 4b). O tick é global e faz fan-out por projeto; baixar o
      # intervalo num ambiente de teste é o que permite exercitar o ciclo sem
      # esperar 15 min (o endpoint de rodada sob demanda é o outro caminho).
      ANAMNESE_INTERVAL_SECONDS: ${ANAMNESE_INTERVAL_SECONDS:-900}
      ANAMNESE_INITIAL_WINDOW_DAYS: ${ANAMNESE_INITIAL_WINDOW_DAYS:-30}
      ANAMNESE_MIN_EVENTS: ${ANAMNESE_MIN_EVENTS:-10}
      ANAMNESE_MAX_ITERATIONS: ${ANAMNESE_MAX_ITERATIONS:-6}
      ANAMNESE_BUDGET_MICROS: ${ANAMNESE_BUDGET_MICROS:-200000}
      ANAMNESE_MAX_PROMPT_EVENTS: ${ANAMNESE_MAX_PROMPT_EVENTS:-500}
      ANAMNESE_MAX_PAYLOAD_CHARS: ${ANAMNESE_MAX_PAYLOAD_CHARS:-600}
    ports:
      - "${ENGINE_PORT:-4000}:4000"
    volumes:
      - ../apps/engine:/workspace/apps/engine
      - engine_build:/workspace/apps/engine/_build
      - engine_deps:/workspace/apps/engine/deps
      - engine_mix:/root/.mix
      - engine_hex:/root/.hex
      # RW (era :ro): desde a Fase 4a o executor `git_push` roda NO ENGINE
      # (Engine.Actions.GitExecutor) e empurra a branch do worktree pro bare
      # repo local. Com o mount read-only o push morre em "remote unpack
      # failed: unable to create temporary object directory", e a PR do dev
      # agent nunca chega a abrir.
      - git_local_repos:/data/git-repos
      - project_workspaces:/data/project-workspaces
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    working_dir: /workspace
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_ENGINE_URL: ${VITE_ENGINE_URL:-http://localhost:4000}
      # Login via Keycloak (client público brabo-web, PKCE) — mesmo
      # KEYCLOAK_ISSUER_URL usado pela api pra bater com o claim "iss"
      # do token, já que o browser roda fora da rede do compose.
      VITE_KEYCLOAK_URL: ${KEYCLOAK_ISSUER_URL:-http://localhost:8080}
      VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-brabo-dev}
      VITE_KEYCLOAK_CLIENT_ID: brabo-web
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ..:/workspace
      - web_root_node_modules:/workspace/node_modules
      - web_app_node_modules:/workspace/apps/web/node_modules
      - web_shared_node_modules:/workspace/packages/shared/node_modules
    depends_on:
      - api
      - engine

volumes:
  pgdata:
  ollama_data:
  git_local_repos:
  api_root_node_modules:
  api_app_node_modules:
  api_shared_node_modules:
  web_root_node_modules:
  web_app_node_modules:
  web_shared_node_modules:
  engine_build:
  engine_deps:
  engine_mix:
  engine_hex:
  project_workspaces:
