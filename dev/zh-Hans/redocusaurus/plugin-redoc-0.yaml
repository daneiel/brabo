    ReportSessionTerminationDto:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
          example: 01JC4Z0000PROJETO0000000001
        to:
          type: string
          enum:
            - closing
            - closed
            - closed_abnormally
          example: closed_abnormally
          description: >-
            `closing`
            不是终止状态：它表示“我正在释放这个会话”。如果另一个副本接管了它，它会继续存活；如果在超时前没有人接管，排空过程会发送
            `closed_abnormally`。`created` 和 `active` 被排除在外，因为进入它们是 api
            做出的决定，绝不是由 engine 报告终止而来。
        reason:
          type: string
          example: heartbeat_timeout
          description: 终止的来源，而不是通过排除法得出的诊断。
      required:
        - projectId
        - to
