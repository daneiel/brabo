        email:
          type: string
          example: voce@exemplo.dev
          description: >-
            O e-mail NORMALIZADO — o que foi de fato gravado, que pode diferir
            do digitado. É o que o instalador grava no marcador dele.
        workspaceId:
          type: string
          format: uuid
          example: 01JC4Z0000WORKSPACE00000001
          description: >-
            O workspace pessoal nascido na MESMA transação (RN-410), com a conta
            como `owner`. Sem ele a instalação fecharia com um login que
            funciona e um painel onde "Novo projeto" não tem onde criar.
      required:
        - userId
        - email
        - workspaceId
    GateAbertoResponseDto:
