openapi: 3.0.0
paths:
  /.well-known/jwks.json:
    get:
      description: >-
        Uma chave em operação normal; duas durante uma rotação de
        AUTH_JWT_SECRET.
      operationId: JwksController_jwks
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponseDto'
      summary: Chaves públicas de verificação do access token
      tags:
        - auth
  /auth/login:
    post:
      description: >-
        E-mail inexistente, senha errada e conta bloqueada devolvem exatamente a
        mesma resposta 401 — mesmo corpo, mesmo status.
      operationId: AuthController_login_
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '401':
          description: Credenciais inválidas.
        '403':
          description: E-mail ainda não verificado.
      summary: Autentica e emite o par access + refresh
      tags:
        - auth
  /auth/logout:
    post:
      description: >-
        Sempre 204, mesmo para token desconhecido — responder 401 aqui seria um
        oráculo de validade de token.
      operationId: AuthController_logout_
      parameters: []
      responses:
        '204':
          description: Sessão encerrada. Os cookies da sessão são limpos.
      summary: Revoga a família do refresh apresentado
      tags:
        - auth
  /auth/oauth/{provider}/callback:
    get:
      description: >-
        Sucesso vai para `WEB_ORIGIN/` já com os cookies da sessão gravados;
        falha vai para `WEB_ORIGIN/login?oauth_error=1`, sem detalhar o motivo.
      operationId: AuthController_oauthCallback
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - github
              - gitlab
            type: string
        - name: code
          required: true
          in: query
          schema:
            type: string
        - name: state
          required: true
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redireciona para a web.
          headers:
            Location:
              description: Destino na web.
              schema:
                type: string
                example: http://localhost:5173/
      summary: Recebe o callback OAuth do login social
      tags:
        - auth
  /auth/oauth/{provider}/start:
    get:
      description: >-
        O `state` vai assinado por HMAC com propósito PRÓPRIO — nunca o do fluxo
        de conexão de git ao projeto (ver ADR 0084).
      operationId: AuthController_oauthStart
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - github
              - gitlab
            type: string
      responses:
        '302':
          description: Redireciona para o provider.
          headers:
            Location:
              description: A URL de autorização do provider.
              schema:
                type: string
                example: https://github.com/login/oauth/authorize?…
        '400':
          description: Provider fora de `github`/`gitlab`.
      summary: Redireciona para o provider OAuth do login social
      tags:
        - auth
  /auth/refresh:
    post:
      description: >-
        O refresh apresentado é consumido. Reapresentar um token já rotacionado
        revoga a família INTEIRA e grava um evento de segurança — mesmo quando a
        causa foi um duplo envio do cliente.
      operationId: AuthController_refresh_
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoResponseDto'
        '401':
          description: Refresh inválido, expirado ou já usado.
      summary: Rotaciona o refresh e emite um par novo
      tags:
        - auth
  /auth/register:
    post:
      description: >-
        Responde 202 tanto para endereço novo quanto para um já cadastrado — a
        resposta não revela se a conta existe. No segundo caso nada é criado e o
        dono do endereço recebe um aviso.
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AceiteResponseDto'
        '400':
          description: Senha não cumpre a política mínima.
        '403':
          description: Cadastro fechado (AUTH_REGISTRATION_ENABLED=false).
      summary: Cria uma conta e envia o e-mail de verificação
      tags:
        - auth
  /auth/request-password-reset:
    post:
      description: >-
        Responde 202 tanto para endereço conhecido quanto desconhecido. É também
        o caminho de quem foi importado do Keycloak e ainda não definiu senha.
      operationId: AuthController_requestPasswordReset
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordResetDto'
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AceiteResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
      summary: Pede o link de redefinição de senha
      tags:
        - auth
  /auth/reset-password:
    post:
      description: >-
        Revoga TODAS as sessões do usuário. Não emite tokens: quem redefine a
        senha é mandado ao login, para que comprometer o e-mail não equivalha a
        tomar a conta num passo só.
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '204':
          description: >-
            Senha definida. TODAS as sessões vivas do usuário são revogadas
            junto.
        '400':
          description: Link inválido/expirado, ou senha não cumpre a política.
      summary: Define a senha nova a partir do token
      tags:
        - auth
  /auth/verify-email:
    post:
      operationId: AuthController_verifyEmail
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailDto'
      responses:
        '204':
          description: E-mail verificado; o login já funciona.
        '400':
          description: Link inválido, expirado ou já usado — os três com a mesma resposta.
      summary: Confirma o e-mail com o token de uso único
      tags:
        - auth
  /gates:
    get:
      description: >-
        Índice declarativo dos gates do fluxo (ADR 0054). A tela deriva daqui
        quais etapas existem e quem julga cada uma, em vez de repetir a lista no
        código — que era como ela envelhecia sem ninguém notar.
      operationId: GatesController_listar
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatesResponseDto'
        '401':
          description: Sem token, token expirado ou assinatura inválida.
        '429':
          description: Rate limit por usuário ou por IP.
      security:
        - bearer: []
      summary: O registro de gates ativos
      tags:
        - gates
  /git/oauth/{provider}/callback:
    get:
      description: >-
        Pública porque quem chega é o NAVEGADOR do usuário vindo do provider,
        sem sessão da api. Não é irrestrita: o `state` é verificado por HMAC e
        sem um válido a chamada é recusada. Nunca responde JSON — sempre
        redireciona, porque um corpo de erro cru numa navegação do navegador
        seria uma experiência péssima.
      operationId: GitController_callback
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            enum:
              - github
              - gitlab
            type: string
        - name: code
          required: true
          in: query
          schema:
            type: string
        - name: state
          required: true
          in: query
          schema:
            type: string
      responses:
        '302':
          description: >-
            Sucesso vai para `WEB_ORIGIN/projects/:id?git=connected`; falha vai
            para `WEB_ORIGIN/git-error`. O erro NÃO vaza o motivo na URL.
          headers:
            Location:
              description: Destino na web.
              schema:
                type: string
                example: http://localhost:5173/projects/01JC…?git=connected
        '403':
          description: Papel insuficiente no projeto.
        '404':
          description: Projeto não existe.
      summary: Recebe o retorno OAuth e redireciona para a web
      tags:
        - git
  /health:
    get:
      description: >-
        Executa um `select 1`. Revela só se o banco responde; nem topologia nem
        versão. Pública porque quem chama é o kubelet, que não carrega token.
      operationId: HealthController_check
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponseDto'
        '503':
          description: O banco não respondeu. O corpo traz a mensagem em `details`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponseDto'
      summary: Readiness — o processo consegue de fato servir tráfego
      tags:
        - infrastructure
  /internal/first-account:
    post:
      description: >-
        Para o instalador de uma linha, que roda onde nenhum transporte de
        e-mail está configurado: o `.env` gerado não traz variável de e-mail,
        `MAIL_TRANSPORT` cai em `log`, e o cadastro normal espera um e-mail que
        nunca chega. A conta nasce verificada porque quem roda o instalador já
        provou algo MAIS FORTE que controlar uma caixa de e-mail — controla a
        máquina, o `.env` e o daemon do Docker. O cadastro normal não muda.
        Recusa com 409 quando a instalação tem QUALQUER usuário: a condição é
        sobre a instalação, não sobre este e-mail, então a restauração de uma
        migração silencia o passo pelo mesmo teste. A senha nunca é gerada aqui
        e nunca é guardada em lugar nenhum senão como hash argon2id; o workspace
        pessoal (RN-410) nasce na mesma transação.
      operationId: InternalFirstAccountController_criar
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirstAccountInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirstAccountInternalResponseDto'
        '400':
          description: >-
            E-mail malformado, ou senha que a política do DOMÍNIO recusa — o
            mesmo código que o cadastro chama, nunca uma segunda régua.
        '403':
          description: Service token ausente ou diferente do compartilhado.
        '409':
          description: A instalação já tem usuário. Nada foi criado.
      security:
        - service-token: []
      summary: Cria a PRIMEIRA conta de uma instalação, já verificada
      tags:
        - internal
  /internal/gates:
    get:
      description: >-
        O registro DESCREVE, não executa: nenhum gate passa a ser aplicado por
        causa dele, e mudar um campo aqui não muda comportamento nenhum. Cada
        gate diz onde mora a prova de que passou (`evidencia`), porque nem toda
        prova está no event log.
      operationId: InternalGatesController_ler
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateRegistryResponseDto'
        '403':
          description: Service token ausente ou diferente do compartilhado.
      security:
        - service-token: []
      summary: Lê o registro declarativo de gates
      tags:
        - internal
  /internal/graph/prompt-templates:
    post:
      description: >-
        Se já existe uma versão com o MESMO hash para o mesmo `name`, nenhuma
        versão nova é criada — a existente é devolvida (o acerto de idempotência
        não muda o status HTTP: sempre 201, por simplicidade — o corpo é
        idêntico ao que teria sido criado).
      operationId: InternalGraphController_upsert
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPromptTemplateInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '403':
          description: Service token ausente ou diferente do compartilhado.
        '503':
          description: >-
            Neo4j não configurado ou inalcançável — não há fallback possível
            para ler/gravar um template.
      security:
        - service-token: []
      summary: Publica uma versão de prompt template, idempotente por hash
      tags:
        - internal
  /internal/graph/prompt-templates/{name}:
    get:
      description: >-
        Uma `version` específica busca por igualdade; omitida, busca a versão
        `active` mais recente. 404 se o template (ou a versão pedida) não
        existe.
      operationId: InternalGraphController_getByName
      parameters:
        - name: name
          required: true
          in: path
          schema:
            type: string
        - name: version
          required: false
          in: query
          schema:
            example: '3'
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateReadResponseDto'
        '403':
          description: Service token ausente ou diferente do compartilhado.
        '404':
          description: Template não existe, ou não tem a versão pedida.
        '503':
          description: >-
            Neo4j não configurado ou inalcançável — não há fallback possível
            para ler/gravar um template.
      security:
        - service-token: []
      summary: Busca um prompt template pelo nome
      tags:
        - internal
  /internal/machine-device-keys:
    post:
      description: >-
        Para o instalador de uma linha, logo depois de criar a primeira conta: o
        agente local precisa de uma credencial, e a única que existia era presa
        a um PROJETO — numa instalação que ainda não tem nenhum. O par é gerado
        NA MÁQUINA e só a metade pública chega aqui; grave o `id` devolvido na
        JWK privada como `kid` (RN-475), que é o único vínculo entre o arquivo
        em disco e a metade pública no servidor. Não há `userId` no corpo DE
        PROPÓSITO: o dono é o ÚNICO usuário da instalação, resolvido pela api,
        então ter o service token nunca significa escolher de quem é a
        credencial cunhada. Registrar SUBSTITUI: as chaves de máquina ativas do
        dono são revogadas na mesma transação, então uma máquina reinstalada
        funciona e mil chaves de máquina não podem existir. Chaves de projeto
        (ADR 0118) nunca são tocadas.
      operationId: InternalMachineDeviceKeysController_registrarChave
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachineDeviceKeyInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineDeviceKeyInternalResponseDto'
        '400':
          description: >-
            A JWK não é uma chave PÚBLICA Ed25519 — JSON malformado, `kty`/`crv`
            errados, `x` ausente, ou trazendo `d` (essa é a metade privada, e é
            recusada pelo nome em vez de guardada).
        '403':
          description: Service token ausente ou diferente do compartilhado.
        '409':
          description: >-
            A instalação não tem usuário, ou tem mais de um. Nada foi gravado.
            Esta rota é do momento da instalação e se cala de vez quando a
            instalação tem um time.
      security:
        - service-token: []
      summary: Registra a chave de dispositivo de MÁQUINA de uma instalação nova
      tags:
        - internal
  /internal/models/sync:
    post:
      description: >-
        Nunca falha por causa de um provider: cada um responde por si no
        relatório, com o motivo de ter sido pulado e a origem da falha quando
        houve. Provider que não respondeu é PULADO, não marcado indisponível.
      operationId: InternalModelsController_sync
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncModelCatalogResponseDto'
        '403':
          description: Service token ausente ou diferente do compartilhado.
      security:
        - service-token: []
      summary: Sincroniza o catálogo de modelos de todos os providers
      tags:
        - internal
  /internal/projects/{projectId}/backlog:
    get:
      description: >-
        A MESMA árvore épico → história → tarefa da aba Backlog, pelo mesmo caso
        de uso (três leituras por projeto, nunca N+1). É com ela que o PO vê um
        épico órfão e uma história sem tarefa em vez de recriar o que já existe
        (RN-164).
      operationId: InternalProjectsController_backlog
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EpicComHistoriasResponseDto'
        '403':
          description: Service token ausente ou diferente do compartilhado.
      security:
        - service-token: []
      summary: O backlog do projeto em árvore, para o PO ler o que já foi escrito
      tags:
        - internal
  /internal/projects/{projectId}/business-rules:
    get:
      description: >-
        Todo `artifact.business_rule` das sessões do projeto — não só o da
        sessão corrente, que era o teto do contexto de kickoff do PO — com a
        `description` inteira e quais histórias já citam cada regra.
        `uncoveredCount` é a pendência: regra que nenhuma história cobre
        (RN-164). Projeto sem regra nenhuma responde `200` com lista vazia:
        "nenhuma regra capturada ainda" não é erro.
      operationId: InternalProjectsController_businessRules
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBusinessRulesResponseDto'
        '403':
          description: Service token ausente ou diferente do compartilhado.
      security:
        - service-token: []
      summary: As regras de negócio do projeto, com cobertura, para o PO ler
      tags:
        - internal
  /internal/projects/{projectId}/container-exec:
    post:
      description: >-
        Chamada só pelo engine, quando `Engine.Actions.TerminalExecutor` decidiu
        que o comando cabe dentro do container real (`execution_mode: container`
        com uma linha `running` REGISTRADA). Faz proxy para
        `ContainerBrokerPort.exec` (ADR 0130/0134) — a última das cinco
        operações do broker a ganhar chamador real. `sucesso: false` na resposta
        — nunca um erro lançado — é a forma NORMAL de broker que recusou ou é
        inalcançável: o container pode ter morrido ou sido removido por fora
        entre a linha `running` registrada e esta chamada (RN-486, registrado e
        observado nunca se fundem), e isso é falha do comando, não erro de
        transporte.
      operationId: InternalProjectsController_containerExec
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerExecInternalDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerExecInternalResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '403':
          description: Service token ausente ou diferente do compartilhado.
      security:
        - service-token: []
      summary: >-
        Executa um comando de terminal DENTRO do container real do projeto
        (RN-492)
      tags:
        - internal
  /internal/projects/{projectId}/container-spec:
    get:
      description: >-
        Identidade do projeto, modo de execução e a decisão de imagem vigente do
        Arquiteto. O broker revalida tudo antes de entregar qualquer coisa ao
        daemon — ler daqui não é o mesmo que confiar, e a recusa nomeia o campo.
        Nenhum caminho ABSOLUTO é devolvido: a origem do bind é resolvida pelo
        daemon contra o sistema de arquivos do HOST, e um caminho de dentro do
        container da api montaria em silêncio uma pasta vazia. O que viaja é
        `localizacao` (RN-503) — qual das duas raízes do broker usar, mais o
        segmento relativo que a raiz não cobre.
      operationId: InternalContainersController_containerSpec
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerSpecInternalResponseDto'
        '403':
          description: Service token ausente ou diferente do compartilhado.
        '404':
          description: Projeto não encontrado.
      security:
        - service-token: []
      summary: O que o broker precisa para compor ele mesmo a spec do container
      tags:
        - internal
  /internal/projects/{projectId}/git-remote:
    get:
      description: >-
        Devolve a origem limpa (sem credencial embutida) e, para provider
        remoto, o token do DONO do workspace (RN-058) decifrado na hora. Quem
        consome injeta o token por invocação e NUNCA o grava em arquivo —
        `.git/config` fica dentro da pasta onde a RN-075 concede ao dev agent
        leitura auto-aprovada.
      operationId: InternalProjectsController_gitRemote
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGitRemoteResponseDto'
        '403':
          description: Service token ausente ou diferente do compartilhado.
        '404':
          description: >-
            Projeto sem repositório provisionado, ou o dono do workspace não tem
            credencial registrada para o provider do repositório.
      security:
        - service-token: []
      summary: O remoto de trabalho do projeto, para fetch e push
      tags:
        - internal
  /internal/projects/{projectId}/mirror-sync-result:
    post:
      description: >-
        Chamada só pelo engine, depois que o runner empurra `mirror_sync_result`
        pelo canal — o MESMO caminho do `workspace_confirm` (runner → canal →
        engine → api), nunca um segundo mecanismo: o engine relata, não grava a
        tabela. Isto é TELEMETRIA, não evento de domínio: nunca `session_events`
        (rodada de espelho não tem sessão e `session_id` é `NOT NULL`, o mesmo
        raciocínio que fez de `rag_searches` uma tabela) e nunca
        `proposed_action` (a escrita do espelho é configuração que o usuário
        declarou, não agente pedindo para agir). `ok` é o que decide o desfecho
        — nunca a presença de uma contagem ou de uma mensagem: rodada que copiou
        0 arquivos é normal e não pode ser indistinguível de uma que nunca
        rodou. Gravar nunca derruba o que mede: a cópia já está feita quando
        isto é chamado, e o engine só registra em log uma recusa aqui. Projeto
        cujo destino foi limpo nesse meio-tempo AINDA grava — a rodada
        aconteceu, e o erro dela costuma ser o que explica o que deu errado.
      operationId: InternalProjectsController_mirrorSyncResult
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MirrorSyncResultInternalDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MirrorSyncResultResponseDto'
        '400':
          description: >-
            Corpo inválido. O `ValidationPipe` roda com `whitelist` e
            `forbidNonWhitelisted`, então campo desconhecido também reprova.
        '403':
          description: Service token ausente ou diferente do compartilhado.
        '404':
          description: Projeto não existe.
      security:
        - service-token: []
      summary: O agente local relata o desfecho de uma rodada de espelho (RN-517)
      tags:
        - internal
  /internal/projects/{projectId}/module-contracts:
    get:
      description: >-
        Uma entrada por módulo do module_map VIGENTE: o que ele consome
        (`dependeDe`, o `dependsOn` do mapa) e o que expõe (`expoe`, do
        `artifact.module_contracts` vigente do Arquiteto, ou `null` quando
        nenhum foi declarado). É o que um dev agent lê em vez de abrir o
        worktree de outro módulo (ADR 0200). Projeto sem contrato responde `200`
        com `status: sem_contratos`.
      operationId: InternalProjectsController_moduleContracts
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratosDoProjetoResponseDto'
        '403':
          description: Service token ausente ou diferente do compartilhado.
      security:
        - service-token: []
      summary: Os contratos entre módulos, para um dev agent ler (RN-684)
      tags:
        - internal
  /internal/projects/{projectId}/product-metrics:
    get:
      description: >-
        O MESMO relatório do script `analise:funil` (ADR 0089) — funil sessão →
        commit → PR → merge, lead time real e frequência de deploy real — pelas
        mesmas funções puras e a mesma consulta
        (`apps/api/src/application/services/funil-metrics.ts`), para que os dois
        nunca divirjam sobre o mesmo fato. Fecha `docs/fluxo.yml` (papel `po`,
        entrada `metricas-de-produto`, antes `status: lacuna`) (RN-407).
