            pedido ao engine (duplo clique, segunda aba). O Dev Lead não é mais
            alvo aqui: a Infra o oferece assim que o container está `running`
            (RN-672).
        jaAtendidos:
          type: array
          items:
            $ref: '#/components/schemas/AlvoJaAtendidoResponseDto'
      required:
        - ok
        - desfecho
        - jaAtendidos
    ConfirmProjectWorkspaceInternalDto:
      type: object
      properties:
        path:
          type: string
          example: /home/you/projects/store
          description: >-
            Caminho absoluto confirmado pelo runner NO HOST — a fonte de verdade
            (RN-423). Revalidado LEXICAMENTE aqui antes de gravar; inválido é
            400, nunca gravado.
        sessionId:
          type: string
          format: uuid
          example: 01JC4Z0000SESSAO00000000001
          description: >-
            A sessão mais recente do projeto (`ProjectSession.latest_id/1`),
            resolvida do lado do engine. `null`/omitida quando o projeto ainda
            não tem sessão nenhuma — o projeto é atualizado assim mesmo, só o
            evento de auditoria é pulado (lacuna aceita, RN-423).
        actorId:
          type: string
          format: uuid
          example: 01JC4Z0000USUARIO0000000001
          description: >-
            Quem pediu o ticket do runner (dono do socket que confirmou) — vira
            o ator do evento `project.workspace_verified`. Omitido: o evento (se
            houver sessão) nasce sem ator identificado.
      required:
        - path
    ConfirmProjectWorkspaceResponseDto:
      type: object
      properties:
        verified:
          type: boolean
          example: true
          description: >-
            Sempre `true` quando a chamada não lançou — a confirmação é
            idempotente. `changed` diz se ALGO mudou nesta chamada.
        workspacePath:
          type: string
          example: /home/you/projects/store
          description: >-
            O caminho GRAVADO (normalizado) — pode diferir do que a criação
            tinha, porque o runner é a fonte de verdade e o sobrescreve.
        changed:
          type: boolean
          example: true
          description: >-
            `true` na primeira confirmação, ou quando o caminho relatado é
            DIFERENTE do que já estava gravado. `false` numa reconexão que
            relata o mesmo caminho de sempre — nada foi regravado.
      required:
        - verified
        - workspacePath
        - changed
    ContainerExecInternalDto:
      type: object
      properties:
        comando:
          type: string
          example: npm test
          description: >-
            O comando de shell, interpretado por `sh -c` DENTRO do container — a
            mesma convenção da ação de terminal rodada fora de um.
        cwd:
          type: string
          example: /work/.worktrees/dev-api
          description: >-
            Diretório de trabalho DENTRO do container. Já traduzido do caminho
            do host pelo engine (RN-492) — este DTO não repete essa tradução.
            Omitido roda em `/work`, a raiz do projeto. O broker revalida que
            está dentro de `/work` e recusa (`DiretorioForaDoEscopoError`) caso
            contrário.
        timeoutMs:
          type: number
          example: 300000
          description: Timeout em milissegundos. Omitido usa o padrão do broker.
      required:
        - comando
    ContainerExecInternalResponseDto:
      type: object
      properties:
        sucesso:
          type: boolean
          example: true
          description: >-
            `false` quando o broker recusou ou não respondeu — os outros campos
            ficam ausentes e `motivo` explica.
        exitCode:
          type: number
          example: 0
          description: 'Presente só quando `sucesso: true`.'
        output:
          type: string
          example: |
            ok
          description: 'Presente só quando `sucesso: true`.'
        timedOut:
          type: boolean
          example: false
          description: 'Presente só quando `sucesso: true`.'
        motivo:
          type: string
          example: 'o broker de container não respondeu em http://broker:8090: timeout'
          description: 'Presente só quando `sucesso: false`.'
      required:
        - sucesso
    ContainerOverviewItemResponseDto:
      type: object
      properties:
        projectId:
          type: string
          example: 01JC4Z0000PROJETO000001
        projectName:
          type: string
          example: exp002
        projectSlug:
          type: string
          example: exp002
        executionMode:
          type: string
          enum:
            - container
            - mounted
            - runner
          example: runner
          description: >-
            Onde o container deste projeto sobe (RN-497/503). `container` e
            `mounted` passam pelo broker, no servidor; `runner` passa pelo
            agente local na máquina do usuário. É o que ramifica a ação de
            subida entre `container_start` e `container_start_via_runner`.
        registrado:
          nullable: true
          description: >-
            `null` quer dizer que este projeto NUNCA provisionou container — um
            TERCEIRO estado, não um valor de `status`: não é `stopped`
            (container que existiu e parou) nem "não pôde ser observado" (que é
            sobre o daemon). Leia `naoVerificado: "sem_container_registrado"`
            junto.
          type: object
          allOf:
            - $ref: '#/components/schemas/RegistroDeContainerResponseDto'
        temImagemDecidida:
          type: boolean
          example: true
          description: >-
            Se existe ALGUM `artifact.project_image` para este projeto — o
            portão da RN-105, que desde a RN-494/ADR 0135 vale para os TRÊS
            modos. `false` quer dizer que subir container é impossível agora, e
            a página diz isso em vez de propor uma ação que se sabe que vai
            falhar.
        workspaceVerifiedAt:
          type: object
          nullable: true
          format: date-time
          description: >-
            Quando um runner CONFIRMOU a pasta (RN-423) — só tem sentido para
            `executionMode: "runner"`. Registra UMA confirmação e nunca é
            batimento (RN-468): não nulo NÃO prova que um agente local está
            conectado agora. O que ele prova é o negativo — `null` num projeto
            `runner` quer dizer que nenhum runner jamais conectou.
        observado:
          nullable: true
          description: >-
            O que o broker relata agora — `null` porque não há container, porque
            não foi possível perguntar (`naoObservado`), ou porque esta linha
            não foi perguntada nesta carga (`naoVerificado`).
          type: object
          allOf:
            - $ref: '#/components/schemas/ObservacaoDeContainerResponseDto'
        naoObservado:
          type: string
          enum:
            - broker-nao-configurado
            - broker-sem-resposta
            - broker-recusou
            - null
          nullable: true
        detalheDaObservacao:
          type: object
          nullable: true
          example: null
        naoVerificado:
          type: string
          enum:
            - fora_do_escopo_da_verificacao
            - teto_de_verificacoes_atingido
            - sem_container_registrado
            - null
          nullable: true
          example: null
          description: >-
            Não nulo quando esta linha NÃO foi perguntada ao broker nesta carga
            — nunca confundido com `naoObservado`, que quer dizer que FOI
            perguntada e falhou. `fora_do_escopo_da_verificacao`: status é
            `stopped`/`failed`/`removed`, onde a confirmação do daemon não
            importa. `teto_de_verificacoes_atingido`: elegível, mas o orçamento
            de chamadas ao broker por carga já foi gasto por outras linhas.
            `sem_container_registrado`: o projeto nunca provisionou um, então
            não há o que observar — e também nunca gasta chamada do orçamento.
        acaoPendente:
          nullable: true
          description: >-
            A ação pendente
            `container_start`/`container_stop`/`container_remove`/`container_start_via_runner`
            deste projeto, se houver — em QUALQUER sessão dele. A página desenha
            o `ApprovalCard` em linha para ela em vez do botão da ação, o mesmo
            padrão da aba de PRs.
          type: object
          allOf:
            - $ref: '#/components/schemas/ProposedActionResponseDto'
        brokerConfigurado:
          type: boolean
          example: false
          description: >-
            Se ESTA INSTALAÇÃO tem broker de container configurado (`BROKER_URL`
            definida, ADR 0130) — o mesmo valor em toda linha, porque é
            configuração da instalação e não propriedade do projeto. Projetos
            `container` e `mounted` só sobem container pelo broker (ADR 0144),
            então com `false` a página recusa o botão de subida para eles ANTES
            do clique e diz por quê (ADR 0161, RN-574); projetos `runner` não
            são afetados. Diz que a variável existe, nunca que o broker responde
            — isso é o que `naoObservado` relata.
      required:
        - projectId
        - projectName
        - projectSlug
        - executionMode
        - registrado
        - temImagemDecidida
        - workspaceVerifiedAt
        - observado
        - naoObservado
        - detalheDaObservacao
        - naoVerificado
        - acaoPendente
        - brokerConfigurado
    ContainerSpecInternalResponseDto:
      type: object
      properties:
        projectId:
          type: string
          example: f52be111-0000-4000-8000-000000000000
        projectSlug:
          type: string
          example: exp002
        workspaceId:
          type: string
          example: aaaaaaaa-0000-4000-8000-000000000000
        workspaceDirName:
          type: string
          example: exp002-f52be111
          description: >-
            Nome da pasta CONGELADO na criação do projeto (RN-109). É a fonte
            única do nome do container (`brabo-<workspaceDirName>`) nos TRÊS
            modos. ONDE a PASTA está é outra pergunta, respondida por
            `localizacao` (RN-503) — a api continua nunca mandando caminho
            absoluto, porque um caminho de dentro do container da api não é um
            caminho que o daemon do Docker consiga resolver.
        executionMode:
          type: string
          enum:
            - container
            - mounted
            - runner
          example: container
          description: >-
            Onde o código mora. O broker serve `container` E `mounted` (RN-503):
            desde o ADR 0141 a pasta montada mora sob uma base que este servidor
            monta por identidade, então o daemon a alcança. Continua recusando
            `runner`: essa pasta está na máquina do usuário e nenhuma raiz aqui
            a enxerga — ali, quem sobe container é o runner (ADR 0137).
        localizacao:
          description: >-
            O localizador discriminado da pasta do projeto (RN-503): qual das
            duas raízes do broker o resolve, e o segmento relativo a juntar a
            essa raiz.
          allOf:
            - $ref: '#/components/schemas/LocalizacaoDoProjetoResponseDto'
        usuarioDaPasta:
          type: object
          nullable: true
          properties:
            uid:
              type: integer
              example: 1000
            gid:
              type: integer
              example: 1000
          description: >-
            O DONO da pasta do projeto, medido pela api (ADR 0180): o broker
            sobe o container com `--user uid:gid` para o dev agent conseguir
            escrever na pasta sob `--cap-drop ALL`. `null` quando a pasta não
            pode ser medida, o projeto é `runner`, ou o dono é root — o
            container então sobe como antes. Nunca aceito de um pedido ao
            broker.
        imagem:
          nullable: true
          description: >-
            `null` enquanto o Arquiteto não decidiu (RN-105) — `start` é então
            recusado com 409 do lado do broker, e as outras quatro operações
            continuam funcionando.
          type: object
          allOf:
            - $ref: '#/components/schemas/ImagemParaOBrokerResponseDto'
        imagemVersao:
          type: number
          example: 3
          description: >-
            Versão do artefato vigente; 0 quando não há decisão. Vai parar no
            container como o rótulo `brabo.image.version`.
      required:
        - projectId
        - projectSlug
        - workspaceId
        - workspaceDirName
        - executionMode
        - localizacao
        - usuarioDaPasta
        - imagem
        - imagemVersao
