        в `domain/llm/huggingface-official-publishers.ts`) — тот же дух «всегда
        ручная курация», что и у каталога LLM (ADR 0042), применённый к значку
        «официальный», а не к активации. `includeCommunity=true` включает всех
        издателей, каждый помечен `official: false`, чтобы экран показал
        предупреждение о безопасности, — никогда не скрывается.
      operationId: HuggingFaceModelsController_search
      parameters:
        - name: q
          required: true
          in: query
          description: Текст поиска.
          schema:
            type: string
        - name: includeCommunity
          required: false
          in: query
          description: Передайте `true`, чтобы также включить неофициальных издателей.
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HuggingFaceModelResponseDto'
        '401':
          description: Нет токена, токен истёк или подпись недействительна.
        '403':
          description: Требует `maintainer` в рабочем пространстве.
        '429':
          description: Ограничение частоты запросов на пользователя или на IP.
      security:
        - bearer: []
      summary: Ищет модели GGUF в Hugging Face Hub
      tags:
        - llm
