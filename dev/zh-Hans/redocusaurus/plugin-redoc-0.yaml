        - service-token: []
      summary: 声明模块之间契约的新版本
      tags:
        - internal
  /internal/sessions/{sessionId}/module-map:
    post:
      description: >-
        历史不可变：每次发布都是新增一个版本，当前版本是 `version` 最高的那个。模块之间存在依赖环时映射会以 400
        被拒绝——图必须是无环的。
      operationId: InternalSessionsController_moduleMap
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModuleMapInternalDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleMapResponseDto'
        '400':
          description: 模块之间存在依赖环。
        '403':
          description: 服务令牌缺失或与共享令牌不一致。
        '404':
          description: 未找到会话、项目或资源。
      security:
        - service-token: []
      summary: 发布 module_map 的新版本
