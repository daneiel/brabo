# Secrets via External Secrets Operator.
#
# Nenhum segredo entra em manifesto versionado. O que está aqui é a DECLARAÇÃO
# de quais chaves existem e de onde vêm; o valor vive no provider e o ESO
# materializa o Secret dentro do cluster.
#
# O `secretStoreRef` aponta para um SecretStore que cada overlay define — é o
# único ponto que muda entre local e produção. No overlay local o store lê de
# um Secret-fonte que o bootstrap.sh cria imperativamente com `openssl rand`
# (`kubectl create secret`, nunca versionado); em staging/prod aponta para o
# provider real.
#
# Fallback sealed-secrets: ver docs/runbook.md (seção "Deploy local") — a alternativa é
# substituir estes dois recursos por SealedSecrets, mantendo os MESMOS nomes de
# Secret e as mesmas chaves, para que nada mais no chart precise mudar.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: brabo-secrets
  labels:
    app.kubernetes.io/part-of: brabo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: brabo-secret-store
    kind: SecretStore
  target:
    name: brabo-secrets
    creationPolicy: Owner
  data:
    # Conexão do Postgres — externo por padrão (ver docs/adr/0025).
    - secretKey: DATABASE_URL
      remoteRef:
        key: brabo
        property: DATABASE_URL
    # Phoenix: assina sessão e token de canal.
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: brabo
        property: SECRET_KEY_BASE
    # Envelope encryption das credenciais de LLM e git do usuário.
    - secretKey: CREDENTIALS_MASTER_KEY
      remoteRef:
        key: brabo
        property: CREDENTIALS_MASTER_KEY
    # HMAC do state do OAuth de git — rotação independente da master key.
    - secretKey: GIT_OAUTH_STATE_SECRET
      remoteRef:
        key: brabo
        property: GIT_OAUTH_STATE_SECRET
    # Deriva o par Ed25519 que assina o access token (Fase 7a).
    - secretKey: AUTH_JWT_SECRET
      remoteRef:
        key: brabo
        property: AUTH_JWT_SECRET
    # HMAC do hash dos refresh tokens e dos tokens de conta. Rotacionar
    # INVALIDA todas as sessões e todos os links em aberto — ver o runbook.
    - secretKey: AUTH_TOKEN_PEPPER
      remoteRef:
        key: brabo
        property: AUTH_TOKEN_PEPPER
    # O MESMO valor nos dois sentidos do tráfego interno engine <-> api.
    - secretKey: BRABO_SERVICE_TOKEN
      remoteRef:
        key: brabo
        property: BRABO_SERVICE_TOKEN
    # Cookie da distribuição Erlang. O release já carrega um cookie gerado no
    # build; sobrescrever por Secret tira o segredo de dentro da imagem, que é
    # artefato compartilhado entre ambientes.
    - secretKey: RELEASE_COOKIE
      remoteRef:
        key: brabo
        property: RELEASE_COOKIE
    # Destino do backup (Fase 5, item 6). Endpoint e bucket entram aqui junto
    # das credenciais, e não no ConfigMap, para que trocar de bucket em um
    # incidente seja UMA operação no provider de segredo em vez de duas em
    # lugares diferentes — e porque o endpoint de um bucket privado já é
    # informação que não precisa estar em manifesto versionado.
    - secretKey: BACKUP_S3_ENDPOINT
      remoteRef:
        key: brabo
        property: BACKUP_S3_ENDPOINT
    - secretKey: BACKUP_S3_BUCKET
      remoteRef:
        key: brabo
        property: BACKUP_S3_BUCKET
    - secretKey: BACKUP_S3_ACCESS_KEY
      remoteRef:
        key: brabo
        property: BACKUP_S3_ACCESS_KEY
    - secretKey: BACKUP_S3_SECRET_KEY
      remoteRef:
        key: brabo
        property: BACKUP_S3_SECRET_KEY