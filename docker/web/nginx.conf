# nginx que serve o SPA em produção (Fase 5). Roda como usuário NÃO-ROOT com
# rootfs read-only, então tudo que o nginx escreve foi redirecionado pra
# caminhos montados como tmpfs (ver docker-compose.prod.yml).
#
# `${CSP_CONNECT_SRC}` é substituído em runtime por docker/web/entrypoint.sh.

# Sem `user`: o processo já sobe como o usuário do container. Declarar `user`
# aqui exigiria root pra fazer o setuid.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Todos os caminhos de escrita vão pra tmpfs — sem isto o nginx não sobe com
  # o filesystem em read-only.
  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  access_log /dev/stdout;

  sendfile on;
  tcp_nopush on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Política de cache resolvida por `map` em vez de `add_header` por location,
  # DE PROPÓSITO: `add_header` num bloco filho DESCARTA todos os headers
  # herdados do pai. Com um `add_header Cache-Control` dentro de
  # `location = /index.html`, os headers de segurança do server sumiam
  # silenciosamente justamente na rota que serve o app (verificado com curl).
  # Assim os headers são declarados UMA vez, no server, e nada os sombreia.
  map $uri $brabo_cache_control {
    # Assets com hash no nome (Vite): imutáveis, cache longo.
    ~^/assets/  "public, max-age=31536000, immutable";
    # A configuração de runtime é o único arquivo que muda entre dois pods da
    # MESMA imagem — cacheá-la faria um pod novo servir a config do anterior.
    /config.js  "no-store";
    # O index.html NUNCA entra em cache: ele é quem aponta pros assets com hash
    # novo. Cacheado, um deploy novo não chega no browser até o cache expirar.
    default     "no-cache, must-revalidate";
  }

  server {
    # 8080, não 80: porta acima de 1024 é o que permite bind sem privilégio.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `connect-src` precisa da api, do engine (inclusive o websocket dos canais
    # `style-src 'unsafe-inline'`: o Vite injeta estilos inline no bundle.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' ${CSP_CONNECT_SRC}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $brabo_cache_control always;

    # Health do próprio nginx — o HEALTHCHECK da imagem bate aqui. Não passa
    # pelo fallback de SPA, então responde mesmo se o docroot estiver vazio.
    # `default_type` em vez de `add_header Content-Type` justamente pra não
    # sombrear os headers de segurança do server (ver o comentário do map).
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Configuração de runtime, gerada pelo entrypoint a partir do ambiente do
    # container (ver apps/web/src/lib/runtime-config.ts). Fica em /tmp porque o
    # docroot é read-only. `alias` e não `root`: o arquivo não vive sob o
    # docroot. Sem `add_header` aqui — o Cache-Control vem do map, senão os
    # headers de segurança do server sumiriam nesta rota.
    location = /config.js {
      alias /tmp/nginx/config.js;
      default_type application/javascript;
    }

    # Asset com hash que não existe é 404, não index.html: sem isto um deploy
    # com asset faltando devolveria HTML no lugar de JS e o erro apareceria no
    # browser como sintaxe inválida em vez de 404.
    location /assets/ {
      try_files $uri =404;
    }

    # Fallback de SPA: qualquer rota do TanStack Router cai no index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
