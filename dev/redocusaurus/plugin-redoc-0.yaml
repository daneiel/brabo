        publicKeyJwk:
          type: string
          example: '{"kty":"OKP","crv":"Ed25519","x":"…"}'
          description: >-
            A JWK PÚBLICA Ed25519 (RFC 8037), serializada como JSON. O par é
            gerado na máquina e a metade privada nunca viaja — JWK trazendo `d`
            é recusada com 400 dizendo isso, nunca guardada.
      required:
        - name
