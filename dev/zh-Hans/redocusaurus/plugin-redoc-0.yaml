    LlmTurnResponseDto:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/LlmMessageResponseDto'
        usage:
          $ref: '#/components/schemas/LlmUsageResponseDto'
        error:
          type: object
          example: null
          nullable: true
          description: >-
            提供商的失败。以 200 在响应体中返回，而不是作为 HTTP 错误，因为 `usage`
            中的计费仍然有效——即使失败，该回合也产生了花费。
        errorCode:
          type: object
          example: null
          nullable: true
          description: >-
            提供商失败的规范化 `code`（ADR
            0041）——`auth`、`rate_limit`、`insufficient_credit`（HTTP
            402，RN-730）、`model_not_found`、`context_length`、`timeout`、`connection`
            或 `upstream`。没有错误，或错误不属于提供商（预算、缺少 binding）时为 `null`。请依据它做判断，绝不依据
            `error` 的文本。
        modelName:
          type: object
          example: llama3.2:3b
          nullable: true
          description: >-
            生成响应的模型名称（问题 2 的发现）——当回合在解析模型之前就失败时（没有 binding，或 binding 指向不存在的模型）为
            `null`。
        truncated:
          type: boolean
          enum:
            - true
          description: >-
            仅当提供商在输出上限处截断了响应时出现（始终为 `true`）（`finish_reason: "length"` /
            `stop_reason: "max_tokens"`，RN-737）：文本和 `toolCalls` 的参数都被截断。engine
            拒绝执行被截断的工具调用，并叙述这一截断。
        toolRouting:
          description: >-
            Jev 选择工具的那一步（ADR 0179，RN-625）。未咨询路由器时缺省（提供商不是
            OpenRouter、工具少于两个、workspace 开关关闭）。engine 将其叙述为
            `tool_router.decided`。
          allOf:
            - $ref: '#/components/schemas/ToolRoutingResponseDto'
      required:
        - message
        - usage
        - error
        - errorCode
        - modelName
