        rotulo:
          type: object
          example: Loja
          nullable: true
          description: >-
            Понятное имя, когда есть таблица с именем (проект). `null`, когда
            ключ уже является подписью.
        actorKind:
          type: object
          example: agent
          nullable: true
          description: >-
            Это заполняют только списки по акторам (`porAtor`, `porOwner`,
